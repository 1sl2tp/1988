<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>TikTok mẫu · 1988</title>
<!-- LIVE HLS via Render proxy: Referer/User-Agent/CORS -->
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--card:#181818;--line:#2b2b2b;--text:#f5f5f5;--muted:#9d9d9d;--tt:#fe2c55}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}.head strong{font-size:19px}.head span{color:var(--muted);font-size:13px}.spacer{flex:1}
button,a.btn{border:0;background:#292929;color:#fff;border-radius:18px;padding:9px 13px;text-decoration:none;font-size:13px;cursor:pointer}
main{max-width:900px;margin:auto;padding:16px}.note{color:var(--muted);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden}
.cardhead{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800}.badge{background:var(--tt);border-radius:5px;padding:4px 7px;font-size:11px}.sub{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}
.body{min-height:480px;display:flex;align-items:center;justify-content:center;background:#111}.status{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}
.official{width:100%;padding:10px;display:flex;justify-content:center;overflow:hidden}.official .tiktok-embed{margin:0!important;min-width:0!important;max-width:605px!important;width:100%!important}
.livebox{position:relative;width:min(100%,430px);aspect-ratio:9/16;background:#000}.livebox video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.liveinfo{position:absolute;left:10px;right:10px;bottom:12px;text-shadow:0 1px 3px #000;pointer-events:none}.liveinfo strong{display:block}.liveinfo span{font-size:12px}
.foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}.foot span{font-size:12px;color:var(--muted)}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="head"><strong>TikTok · mẫu</strong><span>1 video + LIVE @nhungnhoii205</span><div class="spacer"></div><button id="reload">Làm mới</button></div></header>
<main>
  <p class="note">Video dùng cố định một mẫu; LIVE đi qua proxy để gắn Referer/User-Agent và mở CORS trước khi HLS.js phát.</p>
  <section class="grid">
    <article class="card">
      <div class="cardhead">VIDEO MẪU <span class="sub" id="videoState">Đang tìm…</span></div>
      <div class="body" id="videoBox"><div class="status">Đang lấy 1 video của kênh…</div></div>
      <div class="foot"><span id="videoId">—</span><a class="btn" id="videoOpen" target="_blank" rel="noopener noreferrer" style="display:none">Mở TikTok</a></div>
    </article>
    <article class="card">
      <div class="cardhead"><span class="badge">LIVE</span> PHIÊN LIVE <span class="sub" id="liveState">Đang kiểm tra…</span></div>
      <div class="body" id="liveBox"><div class="status">Đang lấy luồng LIVE…</div></div>
      <div class="foot"><span>@nhungnhoii205/live</span><a class="btn" href="https://www.tiktok.com/@nhungnhoii205/live" target="_blank" rel="noopener noreferrer">Mở TikTok</a></div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script>
const API='https://one988-tiktok-session.onrender.com';
const HANDLE='nhungnhoii205';
const MANUAL_LIVE_M3U8='https://pull-hls-l10-sg01.tiktokcdn.com/stage/stream-1849552805028692169.m3u8?';
let player=null;

function destroyPlayer(){
  try{player?.pause?.();player?.unload?.();player?.detachMediaElement?.();player?.destroy?.()}catch{}
  player=null;
}
function refreshEmbed(){
  document.querySelectorAll('script[data-tt-refresh]').forEach(x=>x.remove());
  const s=document.createElement('script');
  s.async=true;s.dataset.ttRefresh='1';
  s.src='https://www.tiktok.com/embed.js?ts='+Date.now();
  document.body.appendChild(s);
}
const SAMPLE_VIDEO='https://www.tiktok.com/@yvesellys/video/7689526045287959826';

function showVideoMp4(src){
  const box=document.getElementById('videoBox');
  const state=document.getElementById('videoState');
  const id=document.getElementById('videoId');
  const open=document.getElementById('videoOpen');
  state.textContent='Đã mở';
  id.textContent='MP4 mẫu';
  open.href=SAMPLE_VIDEO;open.style.display='';
  box.innerHTML='<div class="livebox"><video id="sampleVideo" controls autoplay muted playsinline preload="metadata" src="'+src+'"></video></div>';
  document.getElementById('sampleVideo')?.play().catch(()=>{});
}
function showVideoEmbed(){
  const box=document.getElementById('videoBox');
  const state=document.getElementById('videoState');
  const id=document.getElementById('videoId');
  const open=document.getElementById('videoOpen');
  state.textContent='TikTok embed';
  id.textContent='ID 7689526045287959826';
  open.href=SAMPLE_VIDEO;open.style.display='';
  box.innerHTML='<div class="official"><blockquote class="tiktok-embed" cite="'+SAMPLE_VIDEO+'" data-video-id="7689526045287959826" style="max-width:605px;min-width:0;width:100%"><section><a target="_blank" href="https://www.tiktok.com/@yvesellys">@yvesellys</a></section></blockquote></div>';
  refreshEmbed();
}

function attachLive(type,directUrl,allowProxyFallback=true){
  destroyPlayer();
  const box=document.getElementById('liveBox');
  const state=document.getElementById('liveState');
  box.innerHTML='<div class="livebox"><video id="liveVideo" controls autoplay muted playsinline preload="metadata"></video><div class="liveinfo"><strong>@'+HANDLE+'</strong><span>LIVE trực tiếp</span></div></div>';
  const video=document.getElementById('liveVideo');
  const proxy=API+'/tiktok/live-stream?user='+encodeURIComponent(HANDLE)+'&t='+Date.now();
  const play=()=>video.play().catch(()=>{});
  let usingProxy=false;

  const loadHls=(src)=>{
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=src;
      video.addEventListener('loadedmetadata',play,{once:true});
      video.addEventListener('error',()=>{
        if(allowProxyFallback&&!usingProxy&&src!==proxy){usingProxy=true;loadHls(proxy)}
      },{once:true});
      play();
      state.textContent='Đang LIVE · HLS';
      return;
    }
    if(window.Hls&&Hls.isSupported()){
      try{player?.destroy?.()}catch{}
      const h=new Hls({lowLatencyMode:true,backBufferLength:20,enableWorker:true});
      h.loadSource(src);
      h.attachMedia(video);
      h.on(Hls.Events.MANIFEST_PARSED,play);
      h.on(Hls.Events.ERROR,(_,d)=>{
        if(d.fatal&&allowProxyFallback&&!usingProxy&&src!==proxy){
          usingProxy=true;
          try{h.destroy()}catch{}
          player=null;
          loadHls(proxy);
        }else if(d.fatal){
          state.textContent='Lỗi phát LIVE';
        }
      });
      player=h;
      state.textContent='Đang LIVE · HLS';
      return;
    }
    video.src=src;
    video.addEventListener('loadedmetadata',play,{once:true});
    play();
    state.textContent='Đang LIVE';
  };

  const src=directUrl||proxy;
  if(type==='hls'){
    loadHls(src);
    return;
  }
  if(type==='flv'&&window.flvjs&&flvjs.isSupported()){
    const p=flvjs.createPlayer({type:'flv',isLive:true,url:src},{enableStashBuffer:false});
    p.attachMediaElement(video);
    p.load();
    p.on(flvjs.Events.METADATA_ARRIVED,play);
    player=p;
    state.textContent='Đang LIVE · FLV';
    return;
  }
  video.src=src;
  video.addEventListener('loadedmetadata',play,{once:true});
  play();
  state.textContent='Đang LIVE';
}

async function loadVideo(){
  document.getElementById('videoState').textContent='Đang lấy MP4…';
  document.getElementById('videoBox').innerHTML='<div class="status">Đang lấy video mẫu…</div>';
  try{
    const r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(SAMPLE_VIDEO),{cache:'no-store'});
    const data=await r.json();
    if(data?.code===0&&data?.data?.play){
      showVideoMp4(data.data.play);
      return;
    }
    showVideoEmbed();
  }catch(err){
    showVideoEmbed();
  }
}

async function loadLive(){
  destroyPlayer();
  document.getElementById('liveState').textContent='Đang mở .m3u8 trực tiếp…';
  document.getElementById('liveBox').innerHTML='<div class="status">Đang phát link .m3u8 bạn vừa lấy được…</div>';
  const proxied=API+'/tiktok/hls-proxy?url='+encodeURIComponent(MANUAL_LIVE_M3U8)+'&t='+Date.now();
  attachLive('hls',proxied,false);
}

function load(){
  loadVideo();
  loadLive();
}

document.getElementById('reload').onclick=load;
load();
</script>
</body>
</html>
