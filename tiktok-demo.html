height:1px;background:var(--line);flex:1}.libgroup:first-child{margin-top:0}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden}
.cardhead{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800}.badge{background:var(--tt);border-radius:5px;padding:4px 7px;font-size:11px}.sub{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}

<body>
<header><div class="head"><strong>TikTok · LIVE</strong><span id="currentHandleLabel">LIVE @nhungnhoii205</span><div class="spacer"></div><button id="reload">Làm mới</button></div></header>
<main>
  <p class="note">Dán link TikTok LIVE để mở. Kênh đã chọn, tên và avatar được đồng bộ từ server.</p>
  <div class="tester">

  </div>
  <section class="workspace">

      <div class="cardhead"><span class="badge">LIVE</span> PHIÊN LIVE <span class="sub" id="liveState">Đang kiểm tra…</span></div>

        </div>

      <div class="foot"><span id="liveFootText">@nhungnhoii205/live</span><a class="btn" id="liveOpen" href="https://www.tiktok.com/@nhungnhoii205/live" target="_blank" rel="noopener noreferrer">Mở TikTok</a></div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script>
const API='https://one988-tiktok-session.onrender.com';
const DEFAULT_HANDLE='nhungnhoii205';
const CURRENT_KEY='tiktokDemoCurrentLiveLink';
const LIVE_LIBRARY_KEY='tiktokDemoLiveLibraryV2';
const LIVE_LIBRARY_POLL_MS=3000;
let HANDLE=DEFAULT_HANDLE;
let PLAYING_HANDLE='';
let PENDING_HANDLE='';
let PLAYING_SOURCE_SIG='';
let player=null;
let liveSoundWanted=false;
let liveLibraryVersion=-1;
let liveLibraryItems={};
let liveLibraryHandles=[];
let liveLibrarySyncBusy=false;
let liveIdentityItems={};
let liveIdentityInflight=new Set();
let liveIdentityHydrateBusy=false;
let liveOpenBusy=false;
let liveSaveBusy=false;

function parseTikTokHandle(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  const direct=raw.replace(/^@/,'');
  if(/^[A-Za-z0-9._]{2,32}$/.test(direct))return direct;
  const m=raw.match(/tiktok\.com\/@([A-Za-z0-9._]{2,32})(?:\/live)?/i);
  return m?.[1]||'';
}
function liveUrlFor(handle){
  return 'https://www.tiktok.com/@'+handle+'/live';
}
function loadLocalLiveLibrary(){
  try{
    // One-time migration: fold all old local memory into the single LIVE library.
    let legacyHandles=[];
    try{
      const legacy=JSON.parse(localStorage.getItem('tiktokDemoSavedLiveLinks')||'[]');
      if(Array.isArray(legacy))legacyHandles=legacy.map(parseTikTokHandle).filter(Boolean);
    }catch{}
    localStorage.removeItem('tiktokDemoSavedLiveLinks');
    localStorage.removeItem('tiktokDemoRecentLiveStatesV2');
    localStorage.removeItem('tiktokDemoRecentLiveStates');
    localStorage.removeItem('tiktokDemoLiveLibraryV1');

    const data=JSON.parse(localStorage.getItem(LIVE_LIBRARY_KEY)||'{}');
    liveLibraryVersion=Number(data?.version??-1);
    liveLibraryHandles=[...new Set([
      ...(Array.isArray(data?.handles)?data.handles:[]),
      ...legacyHandles
    ].map(parseTikTokHandle).filter(Boolean))].slice(0,60);

    const rows=Array.isArray(data?.items)?data.items:[];
    liveLibraryItems=Object.fromEntries(
      rows.filter(row=>parseTikTokHandle(row?.handle||''))
        .map(row=>[
          String(row.handle).toLowerCase(),
          {...row,ready:false,status:row?.live?'live':(String(row?.status||'offline')==='offline'?'offline':'offline'),sourceSig:''}
        ])
    );
  }catch{
    liveLibraryVersion=-1;
    liveLibraryItems={};
    liveLibraryHandles=[];
  }
}
function saveLocalLiveLibrary(){
  const payload={
    version:liveLibraryVersion,
    handles:liveLibraryHandles,
    items:Object.values(liveLibraryItems)
  };
  const next=JSON.stringify(payload);
  if(localStorage.getItem(LIVE_LIBRARY_KEY)!==next){
    localStorage.setItem(LIVE_LIBRARY_KEY,next);
  }
}
function liveLibraryItem(handle){
  return liveLibraryItems[String(handle||'').toLowerCase()]||null;
}
function liveIdentityItem(handle){
  return liveIdentityItems[String(handle||'').toLowerCase()]||null;
}
function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function applyCurrentIdentity(handle=HANDLE){
  handle=parseTikTokHandle(handle);
  if(!handle)return;
  const identity=liveIdentityItem(handle)||{};
  const name=String(identity.nickname||'').trim();
  const label=document.getElementById('currentHandleLabel');
  if(label)label.textContent=name?(name+' · @'+handle):('LIVE @'+handle);
  const info=document.getElementById('liveInfoHandle');
  if(info)info.textContent=name?(name+' · @'+handle):('@'+handle);
}
async function hydrateLiveLibraryIdentities(handles=libraryHandles()){
  if(liveIdentityHydrateBusy)return;
  const pending=[...new Set((handles||[]).map(parseTikTokHandle).filter(Boolean))]
    .filter(handle=>!liveIdentityItem(handle)&&!liveIdentityInflight.has(handle.toLowerCase()));
  if(!pending.length){
    applyCurrentIdentity();
    return;
  }

  liveIdentityHydrateBusy=true;
  let cursor=0;
  const worker=async()=>{
    while(true){
      const index=cursor++;
      if(index>=pending.length)return;
      const handle=pending[index];
      const key=handle.toLowerCase();
      liveIdentityInflight.add(key);
      try{
        const r=await fetch(
          API+'/tiktok/profile-identity?user='+encodeURIComponent(handle)+'&t='+Date.now(),
          {cache:'no-store'}
        );
        const data=await r.json().catch(()=>({}));
        if(r.ok&&data?.ok){
          liveIdentityItems[key]={
            nickname:String(data.nickname||''),
            avatar:String(data.avatar||'')
          };
        }
      }catch{}
      finally{liveIdentityInflight.delete(key)}
    }
  };

  try{
    await Promise.all(Array.from({length:Math.min(4,pending.length)},()=>worker()));
  }finally{
    liveIdentityHydrateBusy=false;
    renderSavedLiveLinks();
    applyCurrentIdentity();
    const remaining=libraryHandles().filter(handle=>!liveIdentityItem(handle));
    if(remaining.length)void hydrateLiveLibraryIdentities(remaining);
  }
}
function liveLibraryAge(row){
  const at=Number(row?.changedAt||row?.confirmedAt||0);
  if(!at)return '';
  const age=Date.now()-at;
  if(age<2*60*1000)return 'mới';
  if(age<10*60*1000)return 'gần';
  return 'cũ';
}
function libraryHandles(){
  return [...new Set([
    HANDLE,
    ...liveLibraryHandles
  ].map(parseTikTokHandle).filter(Boolean))].slice(0,60);
}
async function syncLiveLibrary({force=false}={}){
  if(liveLibrarySyncBusy)return;
  const handles=libraryHandles();
  if(!handles.length)return;
  liveLibrarySyncBusy=true;
  try{
    const v=force?-1:liveLibraryVersion;
    const r=await fetch(
      API+'/tiktok/live-library?handles='+encodeURIComponent(handles.join(','))+
      '&refresh=0&v='+encodeURIComponent(v)+'&t='+Date.now(),
      {cache:'no-store'}
    );
    const data=await r.json();
    if(!r.ok||!data?.ok)return;

    if(!data.unchanged&&Array.isArray(data.items)){
      liveLibraryItems=Object.fromEntries(
        data.items.map(row=>[String(row.handle||'').toLowerCase(),row])
      );
      // The server/Supabase package is authoritative for selected channels.
      // Local storage is only a mirror so a fresh browser immediately receives
      // the same full list after the first package read.
      liveLibraryHandles=data.items
        .map(row=>parseTikTokHandle(row?.handle||''))
        .filter(Boolean)
        .slice(0,60);
      liveLibraryVersion=Number(data.version??liveLibraryVersion);
      saveLocalLiveLibrary();
      renderSavedLiveLinks();
    }else{
      const summary=document.getElementById('liveLibrarySummary');
      if(summary)summary.textContent='Không đổi · LIVE '+Object.values(liveLibraryItems).filter(x=>x?.live).length;
    }

    if(PENDING_HANDLE){
      const pending=liveLibraryItem(PENDING_HANDLE);
      if(pending?.live&&pending?.ready&&pending?.type&&pending?.sourceSig){
        const handle=PENDING_HANDLE;
        PENDING_HANDLE='';
        openLiveFromLibrary(pending,handle);
      }
    }else if(!PLAYING_HANDLE){
      const first=Object.values(liveLibraryItems)
        .filter(row=>row?.live&&row?.ready&&row?.type&&row?.sourceSig)
        .sort((a,b)=>Number(b.confirmedAt||0)-Number(a.confirmedAt||0))[0];
      if(first)openLiveFromLibrary(first,first.handle);
    }
  }catch{}
  finally{liveLibrarySyncBusy=false}
}

function openLiveFromLibrary(row,handle=row?.handle||HANDLE){
  handle=parseTikTokHandle(handle);
  if(!handle||!row?.ready||!row?.type||!row?.sourceSig)return false;
  HANDLE=handle;
  PLAYING_HANDLE=handle;
  PLAYING_SOURCE_SIG=String(row.sourceSig||'');
  localStorage.setItem(CURRENT_KEY,liveUrlFor(handle));

  const label=document.getElementById('currentHandleLabel');
  if(label)label.textContent='LIVE @'+handle;
  const foot=document.getElementById('liveFootText');
  if(foot)foot.textContent='@'+handle+'/live';
  const open=document.getElementById('liveOpen');
  if(open)open.href=liveUrlFor(handle);
  const info=document.getElementById('liveInfoHandle');
  if(info)info.textContent='@'+handle;

  const age=liveLibraryAge(row);
  const state=document.getElementById('liveState');
  if(state)state.textContent='LIVE · '+String(row.type).toUpperCase()+
    (row.width&&row.height?' · '+row.width+'×'+row.height:'');

  const relay=API+'/tiktok/live-stream?user='+encodeURIComponent(handle)+
    '&source='+encodeURIComponent(row.sourceSig)+'&t='+Date.now();
  attachLive(String(row.type).toLowerCase(),relay,true,false,handle,row.sourceSig);
  renderSavedLiveLinks();
  return true;
}

function setCurrentLive(value,{playIfReady=true}={}){
  const handle=parseTikTokHandle(value);
  if(!handle)return false;
  HANDLE=handle;
  const url=liveUrlFor(handle);
  localStorage.setItem(CURRENT_KEY,url);
  const input=document.getElementById('liveLinkInput');
  if(input)input.value=url;
  const label=document.getElementById('currentHandleLabel');
  if(label)label.textContent='LIVE @'+handle;
  const foot=document.getElementById('liveFootText');
  if(foot)foot.textContent='@'+handle+'/live';
  const open=document.getElementById('liveOpen');
  if(open)open.href=url;
  renderSavedLiveLinks();

  const row=liveLibraryItem(handle);
  if(playIfReady&&row?.live&&row?.ready&&row?.type&&row?.sourceSig){
    PENDING_HANDLE='';
    openLiveFromLibrary(row,handle);
  }else if(playIfReady){
    // Do not touch the current player. The library prepares this channel in
    // the background and auto-switches only after audio+video are confirmed.
    PENDING_HANDLE=handle;
    const state=document.getElementById('liveState');
    if(state&&PLAYING_HANDLE)state.textContent='Đang xem @'+PLAYING_HANDLE+' · chuẩn bị @'+handle+' ngầm';
    void syncLiveLibrary({force:true});
  }
  return true;
}

async function openCurrentLive(value){
  const handle=parseTikTokHandle(value);
  if(!handle)return false;

  setCurrentLive(handle,{playIfReady:false});
  liveSoundWanted=true;

  const cached=liveLibraryItem(handle);
  if(cached?.live&&cached?.ready&&cached?.type&&cached?.sourceSig){
    PENDING_HANDLE='';
    return openLiveFromLibrary(cached,handle);
  }

  // Open first, resolve second: switch the media element immediately and let
  // the relay resolve a compatible FLV source inside the streaming request.
  PLAYING_HANDLE=handle;
  PLAYING_SOURCE_SIG='';
  PENDING_HANDLE='';
  const state=document.getElementById('liveState');
  if(state)state.textContent='Đang kết nối @'+handle+'…';

  const relay=API+'/tiktok/live-stream?user='+encodeURIComponent(handle)+
    '&compat=1&t='+Date.now();
  attachLive('flv',relay,true,false,handle,'',true);
  renderSavedLiveLinks();
  return true;
}

async function saveCurrentLive(){
  const input=document.getElementById('liveLinkInput');
  const handle=parseTikTokHandle(input?.value||'');
  if(!handle){
    input?.focus();
    return false;
  }
  if(liveSaveBusy)return false;

  liveSaveBusy=true;
  const button=document.getElementById('saveLiveBtn');
  const summary=document.getElementById('liveLibrarySummary');
  if(button){
    button.disabled=true;
    button.textContent='Đang lưu…';
  }
  if(summary)summary.textContent='Đang lưu @'+handle+'…';

  try{
    const r=await fetch(API+'/tiktok/selected-channel',{
      method:'POST',
      cache:'no-store',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({handle,selected:true})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data?.ok)throw new Error(data?.error||('save_'+r.status));

    liveLibraryHandles=[handle,...liveLibraryHandles.filter(x=>x.toLowerCase()!==handle.toLowerCase())].slice(0,60);
    setCurrentLive(handle,{playIfReady:false});
    saveLocalLiveLibrary();

    // Server/Supabase is authoritative. Fetch a full package immediately so
    // the just-saved channel cannot be overwritten by an older local mirror.
    liveLibraryVersion=-1;
    await syncLiveLibrary({force:true});

    if(button)button.textContent='Đã lưu';
    setTimeout(()=>{
      if(button&&!liveSaveBusy)button.textContent='Lưu';
    },900);
    return true;
  }catch(error){
    if(summary)summary.textContent='Lưu thất bại · thử lại';
    console.warn('save TikTok channel failed',handle,error);
    return false;
  }finally{
    liveSaveBusy=false;
    if(button){
      button.disabled=false;
      if(button.textContent!=='Đã lưu')button.textContent='Lưu';
    }
  }
}
function renderSavedLiveLinks(){
  const root=document.getElementById('savedLiveLinks');
  if(!root)return;
  const handles=libraryHandles();

  const sorter=(a,b)=>{
    const A=liveLibraryItem(a)||{},B=liveLibraryItem(b)||{};
    const flvDiff=Number(String(B.type||'').toLowerCase()==='flv')-Number(String(A.type||'').toLowerCase()==='flv');
    if(flvDiff)return flvDiff;
    const changed=Number(B.confirmedAt||B.changedAt||0)-Number(A.confirmedAt||A.changedAt||0);
    if(changed)return changed;
    return a.localeCompare(b);
  };

  const liveHandles=handles.filter(handle=>liveLibraryItem(handle)?.live===true).sort(sorter);
  const nonLiveHandles=handles.filter(handle=>liveLibraryItem(handle)?.live!==true).sort(sorter);

  const summary=document.getElementById('liveLibrarySummary');
  if(summary)summary.textContent='Tổng '+handles.length+' · LIVE '+liveHandles.length;

  const rows=(list,isLive)=>list.map(handle=>{
    const row=liveLibraryItem(handle)||{};
    const identity=liveIdentityItem(handle)||{};
    const active=handle===HANDLE?' active':'';
    const type=String(row.type||'').toUpperCase();
    const name=String(identity.nickname||'').trim()||('@'+handle);
    const avatar=String(identity.avatar||'').trim();
    const meta=isLive
      ? ['LIVE',row.ready?type:''].filter(Boolean).join(' · ')
      : 'Không LIVE';
    const avatarHtml=avatar
      ? '<span class="libavatar"><img src="'+escapeHtml(avatar)+'" alt="" referrerpolicy="no-referrer"></span>'
      : '<span class="libavatar">'+escapeHtml(handle.slice(0,1).toUpperCase())+'</span>';
    return '<button class="'+active.trim()+'" data-live-handle="'+handle+'">'+
      avatarHtml+
      '<span class="libwho"><span class="libname">'+escapeHtml(name)+'</span><span class="libhandle">@'+escapeHtml(handle)+'</span></span>'+
      '<span class="liveflag '+(isLive?'on':'')+'">'+(isLive?'●':'○')+'</span>'+
      '<span class="libmeta">'+meta+'</span>'+
      '</button>';
  }).join('');

  const group=(title,list,isLive)=>
    '<div class="libgroup">'+title+' · '+list.length+'</div>'+rows(list,isLive);

  root.innerHTML=
    group('Đang LIVE',liveHandles,true)+
    group('Không LIVE',nonLiveHandles,false);

  root.querySelectorAll('[data-live-handle]').forEach(btn=>{
    btn.onclick=()=>{
      liveSoundWanted=true;
      const handle=btn.dataset.liveHandle;
      const row=liveLibraryItem(handle);
      setCurrentLive(handle,{playIfReady:false});
      applyCurrentIdentity(handle);

      if(row?.live&&row?.ready&&row?.type&&row?.sourceSig){
        PENDING_HANDLE='';
        openLiveFromLibrary(row,handle);
      }else if(row?.live){
        // The list already knows this account is LIVE. Keep the current player
        // untouched while the backend prepares/validates its media in background.
        PENDING_HANDLE=handle;
        void syncLiveLibrary({force:true});
      }
      // Non-LIVE rows are intentionally ignored: no yt-dlp, no ffprobe,
      // no browser session, no player reset.
    };
  });

  applyCurrentIdentity();
  void hydrateLiveLibraryIdentities(handles);
}

function destroyPlayer({clearVideo=false}={}){
  try{player?.pause?.();player?.unload?.();player?.detachMediaElement?.();player?.destroy?.()}catch{}
  player=null;
  if(clearVideo){
    const video=document.getElementById('liveVideo');
    try{
      video?.pause?.();
      video?.removeAttribute?.('src');
      video?.load?.();
    }catch{}
  }
}

function refreshEmbed(){
  document.querySelectorAll('script[data-tt-refresh]').forEach(x=>x.remove());
  const s=document.createElement('script');
  s.async=true;s.dataset.ttRefresh='1';
  s.src='https://www.tiktok.com/embed.js?ts='+Date.now();
  document.body.appendChild(s);
}
const SAMPLE_VIDEO='https://www.tiktok.com/@yvesellys/video/7689526045287959826';

function attachLive(type,directUrl,allowProxyFallback=true,canForceBrowser=false,liveHandle=HANDLE,sourceSig='',previewOnly=false){
  const video=document.getElementById('liveVideo');
  const shell=document.getElementById('liveShell');
  const state=document.getElementById('liveState');
  const info=document.getElementById('liveInfoHandle');
  if(!video||!shell)return;

  const streamHandle=parseTikTokHandle(liveHandle)||HANDLE;
  if(info)info.textContent='@'+streamHandle;

  // One and only one media element. We destroy only the decoder/loader for the
  // previous stream at the moment a prevalidated replacement is ready.
  destroyPlayer({clearVideo:false});
  try{video.pause()}catch{}

  const proxy=API+'/tiktok/live-stream?user='+encodeURIComponent(streamHandle)+
    (sourceSig?'&source='+encodeURIComponent(sourceSig):'')+'&t='+Date.now();
  const proxyAll=proxy+'&segments=proxy';

  let usingSegmentProxy=false;
  let failedOnce=false;
  const play=async()=>{
    video.volume=1;
    video.muted=!liveSoundWanted;
    try{
      await video.play();
    }catch{
      video.muted=true;
      try{await video.play()}catch{}
    }
  };
  const markBad=()=>{
    if(failedOnce||PLAYING_HANDLE!==streamHandle)return;
    failedOnce=true;

    if(previewOnly){
      PENDING_HANDLE='';
      if(state)state.textContent='@'+streamHandle+' chưa LIVE hoặc chưa lấy được nguồn';
      return;
    }

    PENDING_HANDLE=streamHandle;
    if(state)state.textContent='LIVE · đang lấy FLV mới';

    // UI does not classify or probe anything. It only reports a real media
    // failure; the server refreshes its package and publishes a fresh FLV.
    fetch(
      API+'/tiktok/live-feedback?user='+encodeURIComponent(streamHandle)+
      '&status=bad&type='+encodeURIComponent(type)+'&t='+Date.now(),
      {cache:'no-store'}
    ).catch(()=>{}).finally(()=>{
      setTimeout(()=>{void syncLiveLibrary({force:true})},250);
    });
  };
  const fitByVideoShape=()=>{
    const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
    if(!w||!h)return;
    shell.classList.remove('landscape','portrait','square');
    const ratio=w/h;
    if(ratio>1.12)shell.classList.add('landscape');
    else if(ratio<0.88)shell.classList.add('portrait');
    else shell.classList.add('square');
    shell.style.aspectRatio=w+' / '+h;
    if(state&&PLAYING_HANDLE===streamHandle)state.textContent='LIVE · '+type.toUpperCase()+' · '+w+'×'+h;
  };

  video.onloadedmetadata=()=>{fitByVideoShape();void play()};
  video.onresize=fitByVideoShape;
  video.onloadeddata=()=>{fitByVideoShape();void play()};
  video.onplaying=fitByVideoShape;
  video.ontimeupdate=null;
  video.onstalled=null;
  video.onerror=markBad;
  video.onended=markBad;

  const loadHls=src=>{
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=src;
      void play();
      return;
    }
    if(window.Hls&&Hls.isSupported()){
      const h=new Hls({
        lowLatencyMode:true,
        enableWorker:true,
        startFragPrefetch:true,
        backBufferLength:30,
        maxBufferLength:20,
        maxMaxBufferLength:40,
        liveSyncDurationCount:3,
        liveMaxLatencyDurationCount:10,
        maxLiveSyncPlaybackRate:1.12
      });
      h.loadSource(src);
      h.attachMedia(video);
      h.on(Hls.Events.MANIFEST_PARSED,()=>{void play()});
      h.on(Hls.Events.FRAG_BUFFERED,fitByVideoShape);
      h.on(Hls.Events.ERROR,(_,d)=>{
        if(
          allowProxyFallback&&
          !usingSegmentProxy&&
          d.type===Hls.ErrorTypes.NETWORK_ERROR
        ){
          usingSegmentProxy=true;
          try{h.destroy()}catch{}
          player=null;
          loadHls(proxyAll);
          return;
        }
        if(d.fatal)markBad();
      });
      player=h;
      return;
    }
    video.src=src;
    void play();
  };

  const src=directUrl||proxy;
  if(type==='hls'){
    loadHls(src);
    return;
  }

  if(type==='flv'&&window.flvjs&&flvjs.isSupported()){
    const p=flvjs.createPlayer(
      {type:'flv',isLive:true,url:src},
      {enableStashBuffer:true,stashInitialSize:512*1024,lazyLoad:false}
    );
    p.attachMediaElement(video);
    p.load();
    p.on(flvjs.Events.METADATA_ARRIVED,()=>{fitByVideoShape();void play()});
    p.on(flvjs.Events.ERROR,()=>markBad());
    player=p;
    return;
  }

  video.src=src;
  void play();
}

async function loadVideo(){return;}

async function loadLive(){
  const row=liveLibraryItem(HANDLE);
  if(row?.live&&row?.ready&&row?.type&&row?.sourceSig){
    openLiveFromLibrary(row,HANDLE);
    return;
  }
  PENDING_HANDLE=HANDLE;
  const state=document.getElementById('liveState');
  if(state){
    state.textContent=PLAYING_HANDLE
      ?'Đang xem @'+PLAYING_HANDLE
      :'Đang chờ gói LIVE từ server';
  }
  void syncLiveLibrary({force:true});
}

function load(){
  loadLive();
}
