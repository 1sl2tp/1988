<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>TikTok mẫu · 1988</title>
<!-- LIVE HLS via Render proxy: Referer/User-Agent/CORS -->
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--card:#181818;--line:#2b2b2b;--text:#f5f5f5;--muted:#9d9d9d;--tt:#fe2c55}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px}.head strong{font-size:19px}.head span{color:var(--muted);font-size:13px}.spacer{flex:1}
button,a.btn{border:0;background:#292929;color:#fff;border-radius:18px;padding:9px 13px;text-decoration:none;font-size:13px;cursor:pointer}
main{max-width:900px;margin:auto;padding:16px}.note{color:var(--muted);font-size:13px;margin:0 0 14px}
.tester{display:flex;gap:8px;align-items:center;margin:0 0 10px}.tester input{min-width:0;flex:1;border:1px solid var(--line);background:#111;color:#fff;border-radius:18px;padding:10px 13px;outline:none}.tester input:focus{border-color:#555}.saved{display:flex;gap:7px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}.saved::-webkit-scrollbar{display:none}.saved button{flex:0 0 auto;padding:7px 10px;font-size:12px}.saved button.active{background:#fff;color:#111}
.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden}
.cardhead{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800}.badge{background:var(--tt);border-radius:5px;padding:4px 7px;font-size:11px}.sub{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}
.body{min-height:480px;display:flex;align-items:center;justify-content:center;background:#111}.status{padding:30px 20px;text-align:center;color:var(--muted);font-size:13px}
.official{width:100%;padding:10px;display:flex;justify-content:center;overflow:hidden}.official .tiktok-embed{margin:0!important;min-width:0!important;max-width:605px!important;width:100%!important}
.livebox{position:relative;width:min(100%,430px);aspect-ratio:9/16;background:#000;transition:width .18s ease,aspect-ratio .18s ease}.livebox video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.livebox.landscape{width:100%;max-width:100%;aspect-ratio:16/9}.livebox.square{width:min(100%,560px);aspect-ratio:1/1}.livebox.portrait{width:min(100%,430px);aspect-ratio:9/16}
.liveinfo{position:absolute;left:10px;right:10px;bottom:12px;text-shadow:0 1px 3px #000;pointer-events:none}.liveinfo strong{display:block}.liveinfo span{font-size:12px}
.foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between}.foot span{font-size:12px;color:var(--muted)}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="head"><strong>TikTok · mẫu</strong><span id="currentHandleLabel">1 video + LIVE @nhungnhoii205</span><div class="spacer"></div><button id="reload">Làm mới</button></div></header>
<main>
  <p class="note">Dán link TikTok LIVE để test. Link đã lưu sẽ giữ lại trên máy này để bấm test lại nhanh.</p>
  <div class="tester">
    <input id="liveLinkInput" autocomplete="off" spellcheck="false" placeholder="Dán link TikTok LIVE, ví dụ https://www.tiktok.com/@user/live">
    <button id="testLiveBtn">Test</button>
    <button id="saveLiveBtn">Lưu</button>
  </div>
  <div id="savedLiveLinks" class="saved"></div>
  <section class="grid">
    <article class="card">
      <div class="cardhead">VIDEO MẪU <span class="sub" id="videoState">Đang tìm…</span></div>
      <div class="body" id="videoBox"><div class="status">Đang lấy 1 video của kênh…</div></div>
      <div class="foot"><span id="videoId">—</span><a class="btn" id="videoOpen" target="_blank" rel="noopener noreferrer" style="display:none">Mở TikTok</a></div>
    </article>
    <article class="card">
      <div class="cardhead"><span class="badge">LIVE</span> PHIÊN LIVE <span class="sub" id="liveState">Đang kiểm tra…</span></div>
      <div class="body" id="liveBox"><div class="status">Đang lấy luồng LIVE…</div></div>
      <div class="foot"><span id="liveFootText">@nhungnhoii205/live</span><a class="btn" id="liveOpen" href="https://www.tiktok.com/@nhungnhoii205/live" target="_blank" rel="noopener noreferrer">Mở TikTok</a></div>
    </article>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script>
const API='https://one988-tiktok-session.onrender.com';
const DEFAULT_HANDLE='nhungnhoii205';
const SAVED_KEY='tiktokDemoSavedLiveLinks';
const CURRENT_KEY='tiktokDemoCurrentLiveLink';
const RECENT_KEY='tiktokDemoRecentLiveStatesV2';
const RECENT_MS=10*60*1000;
let HANDLE=DEFAULT_HANDLE;
let player=null;
let liveSoundWanted=false;

function parseTikTokHandle(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  const direct=raw.replace(/^@/,'');
  if(/^[A-Za-z0-9._]{2,32}$/.test(direct))return direct;
  const m=raw.match(/tiktok\.com\/@([A-Za-z0-9._]{2,32})(?:\/live)?/i);
  return m?.[1]||'';
}
function liveUrlFor(handle){
  return 'https://www.tiktok.com/@'+handle+'/live';
}
function setCurrentLive(value,{reload=true}={}){
  const handle=parseTikTokHandle(value);
  if(!handle)return false;
  HANDLE=handle;
  const url=liveUrlFor(handle);
  localStorage.setItem(CURRENT_KEY,url);
  const input=document.getElementById('liveLinkInput');
  if(input)input.value=url;
  const label=document.getElementById('currentHandleLabel');
  if(label)label.textContent='1 video + LIVE @'+handle;
  const foot=document.getElementById('liveFootText');
  if(foot)foot.textContent='@'+handle+'/live';
  const open=document.getElementById('liveOpen');
  if(open)open.href=url;
  renderSavedLiveLinks();
  if(reload)loadLive();
  return true;
}
function savedLiveLinks(){
  try{
    const arr=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');
    return Array.isArray(arr)?arr.filter(x=>parseTikTokHandle(x)).slice(0,12):[];
  }catch{return []}
}
function recentLiveStates(){
  try{
    const data=JSON.parse(localStorage.getItem(RECENT_KEY)||'{}');
    return data&&typeof data==='object'?data:{};
  }catch{return {}}
}
function recentLiveState(handle){
  const row=recentLiveStates()[String(handle||'').toLowerCase()];
  if(!row||!row.at||Date.now()-Number(row.at)>RECENT_MS)return null;
  return row;
}
function rememberRecentLive(handle,type,mode){
  const key=String(handle||'').toLowerCase();
  if(!key)return;
  const data=recentLiveStates();
  data[key]={type:String(type||'hls').toLowerCase(),mode:String(mode||'cache'),at:Date.now()};
  const entries=Object.entries(data)
    .sort((a,b)=>Number(b[1]?.at||0)-Number(a[1]?.at||0))
    .slice(0,12);
  localStorage.setItem(RECENT_KEY,JSON.stringify(Object.fromEntries(entries)));
}
function forgetRecentLive(handle){
  const key=String(handle||'').toLowerCase();
  const data=recentLiveStates();
  delete data[key];
  localStorage.setItem(RECENT_KEY,JSON.stringify(data));
}
function sendLiveFeedback(status,type){
  const url=API+'/tiktok/live-feedback?user='+encodeURIComponent(HANDLE)+
    '&status='+encodeURIComponent(status)+
    '&type='+encodeURIComponent(String(type||'').toLowerCase())+
    '&t='+Date.now();
  fetch(url,{cache:'no-store'}).catch(()=>{});
}
function saveCurrentLive(){
  const input=document.getElementById('liveLinkInput');
  const handle=parseTikTokHandle(input?.value||'');
  if(!handle)return;
  const url=liveUrlFor(handle);
  const next=[url,...savedLiveLinks().filter(x=>parseTikTokHandle(x)!==handle)].slice(0,12);
  localStorage.setItem(SAVED_KEY,JSON.stringify(next));
  setCurrentLive(url,{reload:false});
  renderSavedLiveLinks();
}
function renderSavedLiveLinks(){
  const root=document.getElementById('savedLiveLinks');
  if(!root)return;
  const rows=savedLiveLinks();
  root.innerHTML=rows.map(url=>{
    const handle=parseTikTokHandle(url);
    const active=handle===HANDLE?' active':'';
    return '<button class="'+active.trim()+'" data-live-handle="'+handle+'">@'+handle+'</button>';
  }).join('');
  root.querySelectorAll('[data-live-handle]').forEach(btn=>{
    btn.onclick=()=>{liveSoundWanted=true;setCurrentLive(btn.dataset.liveHandle)};
  });
}

function destroyPlayer(){
  try{player?.pause?.();player?.unload?.();player?.detachMediaElement?.();player?.destroy?.()}catch{}
  player=null;
}
function refreshEmbed(){
  document.querySelectorAll('script[data-tt-refresh]').forEach(x=>x.remove());
  const s=document.createElement('script');
  s.async=true;s.dataset.ttRefresh='1';
  s.src='https://www.tiktok.com/embed.js?ts='+Date.now();
  document.body.appendChild(s);
}
const SAMPLE_VIDEO='https://www.tiktok.com/@yvesellys/video/7689526045287959826';

function showVideoMp4(src){
  const box=document.getElementById('videoBox');
  const state=document.getElementById('videoState');
  const id=document.getElementById('videoId');
  const open=document.getElementById('videoOpen');
  state.textContent='Đã mở';
  id.textContent='MP4 mẫu';
  open.href=SAMPLE_VIDEO;open.style.display='';
  box.innerHTML='<div class="livebox"><video id="sampleVideo" controls autoplay muted playsinline preload="metadata" src="'+src+'"></video></div>';
  document.getElementById('sampleVideo')?.play().catch(()=>{});
}
function showVideoEmbed(){
  const box=document.getElementById('videoBox');
  const state=document.getElementById('videoState');
  const id=document.getElementById('videoId');
  const open=document.getElementById('videoOpen');
  state.textContent='TikTok embed';
  id.textContent='ID 7689526045287959826';
  open.href=SAMPLE_VIDEO;open.style.display='';
  box.innerHTML='<div class="official"><blockquote class="tiktok-embed" cite="'+SAMPLE_VIDEO+'" data-video-id="7689526045287959826" style="max-width:605px;min-width:0;width:100%"><section><a target="_blank" href="https://www.tiktok.com/@yvesellys">@yvesellys</a></section></blockquote></div>';
  refreshEmbed();
}

function attachLive(type,directUrl,allowProxyFallback=true,canForceBrowser=true){
  destroyPlayer();
  const box=document.getElementById('liveBox');
  const state=document.getElementById('liveState');
  box.innerHTML='<div class="livebox"><video id="liveVideo" controls autoplay playsinline preload="metadata"></video><div class="liveinfo"><strong>@'+HANDLE+'</strong><span>LIVE trực tiếp</span></div></div>';
  const video=document.getElementById('liveVideo');
  const shell=video.closest('.livebox');
  const proxy=API+'/tiktok/live-stream?user='+encodeURIComponent(HANDLE)+'&t='+Date.now();
  const proxyAll=proxy+'&segments=proxy';
  const play=async()=>{
    video.volume=1;
    video.muted=!liveSoundWanted;
    try{
      await video.play();
    }catch{
      // Nếu trình duyệt chặn autoplay có tiếng, vẫn cho LIVE chạy ngay.
      video.muted=true;
      try{await video.play()}catch{}
      if(liveSoundWanted){
        const suffix=' · chạm loa để bật tiếng';
        if(!state.textContent.includes('chạm loa'))state.textContent+=suffix;
      }
    }
  };
  let usingProxy=false;
  let usingSegmentProxy=false;
  let pictureTimer=null;
  let forcingBrowser=false;
  let confirmedGood=false;
  let lastProgressAt=Date.now();
  let lastProgressTime=0;
  let progressStartedAt=0;

  const confirmGood=()=>{
    if(confirmedGood)return;
    const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
    const t=Number(video.currentTime||0);
    // A source that only plays 5–7 seconds is not a reusable LIVE source.
    // Require sustained progress before saving it as "good".
    const stableMs=progressStartedAt?Date.now()-progressStartedAt:0;
    if(w>0&&h>0&&t>0.6&&stableMs>=8000){
      confirmedGood=true;
      rememberRecentLive(HANDLE,type,'confirmed');
      sendLiveFeedback('ok',type);
    }
  };


  const clearPictureTimer=()=>{
    if(pictureTimer){clearTimeout(pictureTimer);pictureTimer=null}
  };

  const recoverPicture=async(currentSrc='',force=false)=>{
    if(forcingBrowser)return;
    forgetRecentLive(HANDLE);
    sendLiveFeedback('bad',type);
    if(!force&&(video.videoWidth&&video.videoHeight)&&Number(video.currentTime||0)>0.6)return;

    // First recovery: keep the same HLS but relay every segment. This handles
    // CDN/CORS failures without reopening the TikTok session.
    if(type==='hls'&&allowProxyFallback&&!usingSegmentProxy&&currentSrc!==proxyAll){
      usingSegmentProxy=true;
      clearPictureTimer();
      state.textContent='LIVE chưa có hình · thử relay segment…';
      try{player?.destroy?.()}catch{}
      player=null;
      loadHls(proxyAll);
      return;
    }

    if(!canForceBrowser)return;
    forcingBrowser=true;
    clearPictureTimer();
    forgetRecentLive(HANDLE);
    const forceBrowser=type==='flv';
    state.textContent=forceBrowser
      ?'FLV chưa chạy · lấy lại trong cùng phiên TikTok…'
      :'LIVE chưa có hình · đổi sang luồng tương thích…';
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),28000);
      const mode=forceBrowser?'&force=browser':'&compat=1';
      const r=await fetch(API+'/tiktok/live-session?user='+encodeURIComponent(HANDLE)+mode+'&t='+Date.now(),{
        cache:'no-store',
        signal:ctrl.signal
      });
      clearTimeout(timer);
      const data=await r.json();
      if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));
      const nextType=String(data.streamType||'flv').toLowerCase();
      rememberRecentLive(HANDLE,nextType,forceBrowser?'browser':'compat');
      const next=API+'/tiktok/live-stream?user='+encodeURIComponent(HANDLE)+(forceBrowser?'&force=browser':'')+'&t='+Date.now();
      attachLive(nextType,next,true,false);
    }catch(err){
      state.textContent='LIVE chưa lấy được luồng có hình';
    }
  };

  const armPictureTimer=(currentSrc,ms=5000)=>{
    clearPictureTimer();
    pictureTimer=setTimeout(()=>{
      const hasPicture=Boolean(video.videoWidth&&video.videoHeight);
      const progressed=Number(video.currentTime||0)>0.15;
      if(!hasPicture||!progressed)void recoverPicture(currentSrc);
    },ms);
  };

  const fitByVideoShape=()=>{
    const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
    if(!w||!h||!shell)return;
    clearPictureTimer();
    shell.classList.remove('landscape','portrait','square');
    const ratio=w/h;
    if(ratio>1.12)shell.classList.add('landscape');
    else if(ratio<0.88)shell.classList.add('portrait');
    else shell.classList.add('square');
    shell.style.aspectRatio=w+' / '+h;
    state.textContent='Đang LIVE · '+type.toUpperCase()+' · '+w+'×'+h;
    confirmGood();
  };
  video.addEventListener('loadedmetadata',fitByVideoShape);
  video.addEventListener('resize',fitByVideoShape);
  video.addEventListener('playing',()=>{
    if(video.videoWidth&&video.videoHeight)clearPictureTimer();
  });
  video.addEventListener('loadeddata',()=>{
    if(video.videoWidth&&video.videoHeight)clearPictureTimer();
  });
  video.addEventListener('timeupdate',()=>{
    const t=Number(video.currentTime||0);
    if(t>lastProgressTime+0.12){
      if(!progressStartedAt)progressStartedAt=Date.now();
      lastProgressTime=t;
      lastProgressAt=Date.now();
      confirmGood();
    }
  });
  video.addEventListener('ended',()=>{
    const d=Number(video.duration||0);
    const t=Number(video.currentTime||0);
    confirmedGood=false;
    forgetRecentLive(HANDLE);
    sendLiveFeedback('bad',type);
    state.textContent='Phiên LIVE đã dừng'+(Number.isFinite(d)&&d>0?' ở '+Math.round(d)+'s':'')+' · tạo phiên mới…';
    void recoverPicture(type==='hls'?proxyAll:src,true);
  });
  video.addEventListener('stalled',()=>{
    if(Number(video.currentTime||0)>0.6&&Date.now()-lastProgressAt>3500){
      confirmedGood=false;
      forgetRecentLive(HANDLE);
      sendLiveFeedback('bad',type);
      state.textContent='Phiên LIVE bị đứng · tạo phiên mới…';
      void recoverPicture(type==='hls'?proxyAll:src,true);
    }
  });
  const stallTimer=setInterval(()=>{
    if(!document.body.contains(video)){
      clearInterval(stallTimer);
      return;
    }
    if(lastProgressTime>0.6&&!video.paused&&Date.now()-lastProgressAt>6500){
      confirmedGood=false;
      forgetRecentLive(HANDLE);
      sendLiveFeedback('bad',type);
      state.textContent=video.ended?'Phiên LIVE đã kết thúc · tạo phiên mới…':'Phiên LIVE bị đứng · tạo phiên mới…';
      void recoverPicture(type==='hls'?proxyAll:src,true);
    }
  },1800);

  const loadHls=(src)=>{
    if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src=src;
      armPictureTimer(src,5500);
      video.addEventListener('loadedmetadata',play,{once:true});
      video.addEventListener('error',()=>{
        if(allowProxyFallback&&!usingSegmentProxy&&src!==proxyAll){
          usingSegmentProxy=true;
          state.textContent='Đang LIVE · HLS · fallback relay';
          loadHls(proxyAll);
        }
      },{once:true});
      play();
      state.textContent='Đang LIVE · HLS';
      return;
    }
    if(window.Hls&&Hls.isSupported()){
      try{player?.destroy?.()}catch{}
      const h=new Hls({
        lowLatencyMode:true,
        enableWorker:true,
        startFragPrefetch:true,
        backBufferLength:30,
        maxBufferLength:20,
        maxMaxBufferLength:40,
        liveSyncDurationCount:3,
        liveMaxLatencyDurationCount:10,
        maxLiveSyncPlaybackRate:1.12
      });
      h.loadSource(src);
      h.attachMedia(video);
      h.on(Hls.Events.MANIFEST_PARSED,()=>{armPictureTimer(src,5500);play()});
      h.on(Hls.Events.FRAG_BUFFERED,fitByVideoShape);
      h.on(Hls.Events.ERROR,(_,d)=>{
        const directSegmentError=Boolean(
          d?.frag?.url&&
          /tiktokcdn.com|tiktokv.com|byteoversea.com|realcrius.com/i.test(String(d.frag.url))&&
          d.type===Hls.ErrorTypes.NETWORK_ERROR
        );
        if(allowProxyFallback&&directSegmentError&&!usingSegmentProxy&&src!==proxyAll){
          usingSegmentProxy=true;
          state.textContent='Đang LIVE · HLS · fallback segment relay';
          try{h.destroy()}catch{}
          player=null;
          loadHls(proxyAll);
          return;
        }
        if(d.fatal&&allowProxyFallback&&!usingProxy&&src!==proxy){
          usingProxy=true;
          try{h.destroy()}catch{}
          player=null;
          loadHls(proxy);
        }else if(d.fatal){
          state.textContent='Lỗi phát LIVE';
        }
      });
      player=h;
      state.textContent='Đang LIVE · HLS';
      return;
    }
    video.src=src;
    video.addEventListener('loadedmetadata',play,{once:true});
    play();
    state.textContent='Đang LIVE';
  };

  const src=directUrl||proxy;
  if(type==='hls'){
    loadHls(src);
    return;
  }
  if(type==='flv'&&window.flvjs&&flvjs.isSupported()){
    const p=flvjs.createPlayer(
      {type:'flv',isLive:true,url:src},
      {enableStashBuffer:true,stashInitialSize:512*1024,lazyLoad:false}
    );
    p.attachMediaElement(video);
    armPictureTimer(src,5000);
    p.load();
    p.on(flvjs.Events.METADATA_ARRIVED,()=>{fitByVideoShape();play()});
    p.on(flvjs.Events.ERROR,()=>{void recoverPicture(src)});
    player=p;
    state.textContent='Đang LIVE · FLV';
    return;
  }
  video.src=src;
  video.addEventListener('loadedmetadata',play,{once:true});
  play();
  state.textContent='Đang LIVE';
}

async function loadVideo(){
  document.getElementById('videoState').textContent='Đang lấy MP4…';
  document.getElementById('videoBox').innerHTML='<div class="status">Đang lấy video mẫu…</div>';
  try{
    const r=await fetch('https://www.tikwm.com/api/?url='+encodeURIComponent(SAMPLE_VIDEO),{cache:'no-store'});
    const data=await r.json();
    if(data?.code===0&&data?.data?.play){
      showVideoMp4(data.data.play);
      return;
    }
    showVideoEmbed();
  }catch(err){
    showVideoEmbed();
  }
}

async function loadLive(){
  destroyPlayer();
  const state=document.getElementById('liveState');
  const box=document.getElementById('liveBox');
  const relay=API+'/tiktok/live-stream?user='+encodeURIComponent(HANDLE)+'&t='+Date.now();

  const recent=recentLiveState(HANDLE);
  state.textContent=recent?'Đang kiểm tra LIVE gần nhất…':'Đang tìm LIVE nhanh…';
  box.innerHTML=recent
    ?'<div class="status">Đang kiểm tra lại luồng gần nhất của @'+HANDLE+'…</div>'
    :'<div class="status">Đang thử link nhanh; nếu không được mới mở phiên trình duyệt TikTok…</div>';
  let timer=null;
  let ticker=null;
  try{
    const ctrl=new AbortController();
    const started=Date.now();
    ticker=setInterval(()=>{
      const sec=Math.max(0,Math.floor((Date.now()-started)/1000));
      state.textContent=recent?'Đang kiểm tra LIVE gần nhất… '+sec+'s':(sec<7?'Đang thử LIVE nhanh… '+sec+'s':'Đang mở phiên TikTok… '+sec+'s');
    },1000);
    timer=setTimeout(()=>ctrl.abort(),45000);
    const r=await fetch(API+'/tiktok/live-session?user='+encodeURIComponent(HANDLE)+'&t='+Date.now(),{
      cache:'no-store',
      signal:ctrl.signal
    });
    const data=await r.json();
    if(!r.ok||!data.ok)throw new Error(data.error||('HTTP '+r.status));
    const type=String(data.streamType||'').toLowerCase()||'hls';
    state.textContent='Đang LIVE · '+type.toUpperCase()+' · '+String(data.mode||'session');
    attachLive(type,relay,true);
  }catch(err){
    state.textContent=err?.name==='AbortError'?'LIVE phản hồi quá chậm · thử lại':'Lỗi phiên LIVE';
    box.innerHTML='<div class="status">'+(err?.name==='AbortError'?'TikTok chưa trả luồng kịp. Bấm Test lại, lần sau sẽ ưu tiên phiên trình duyệt đã biết là ổn.':(String(err?.message||err).includes('tiktok_not_live')?'Kênh này hiện không có LIVE hoặc TikTok không cho mở phiên.':'Không tạo được phiên LIVE: '+String(err?.message||err)))+'</div>';
  }finally{
    if(timer)clearTimeout(timer);
    if(ticker)clearInterval(ticker);
  }
}

function load(){
  loadVideo();
  loadLive();
}

document.getElementById('reload').onclick=()=>{liveSoundWanted=true;load()};
document.getElementById('testLiveBtn').onclick=()=>{
  liveSoundWanted=true;
  const input=document.getElementById('liveLinkInput');
  const nextHandle=parseTikTokHandle(input?.value||'');
  const currentVideo=document.getElementById('liveVideo');
  if(nextHandle&&nextHandle===HANDLE&&currentVideo){
    const hasPicture=Boolean(currentVideo.videoWidth&&currentVideo.videoHeight);
    const progressed=Number(currentVideo.currentTime||0)>0.6;
    if(!hasPicture||!progressed){
      forgetRecentLive(HANDLE);
      const currentType=/FLV/i.test(document.getElementById('liveState')?.textContent||'')?'flv':'hls';
      sendLiveFeedback('bad',currentType);
    }
  }
  if(!setCurrentLive(input?.value||''))input?.focus();
};
document.getElementById('saveLiveBtn').onclick=saveCurrentLive;
document.getElementById('liveLinkInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    liveSoundWanted=true;
    if(!setCurrentLive(e.currentTarget.value))e.currentTarget.focus();
  }
});

const savedCurrent=localStorage.getItem(CURRENT_KEY)||liveUrlFor(DEFAULT_HANDLE);
setCurrentLive(savedCurrent,{reload:false});
renderSavedLiveLinks();
load();
</script>
</body>
</html>
