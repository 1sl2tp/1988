name: Smoke AI topic clustering

on:
  push:
    branches: [diag-keyword-channel-scan]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call yt1988 topics AI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-topics';
          const key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdjbm9haHFzcnF1eGt3a2pidXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NDY5MDEsImV4cCI6MjEwMzUyMjkwMX0.16EE_LENbAV5oD29XQGpR5c2eYXPqBSWkGTFdOqeRQE';
          const videos=[
            {id:'aaaaaaaaaaa',title:'Bão số 5 mạnh lên, nhiều nơi mưa lớn',channel:'VTV24',published:'2 giờ trước'},
            {id:'bbbbbbbbbbb',title:'Bão số 5 áp sát đất liền, cảnh báo ngập lụt',channel:'VTC NEWS',published:'3 giờ trước'},
            {id:'ccccccccccc',title:'Giá xăng tăng mạnh từ chiều nay',channel:'VietnamNet',published:'1 giờ trước'},
            {id:'ddddddddddd',title:'Xăng dầu đồng loạt tăng giá',channel:'Tuổi Trẻ',published:'2 giờ trước'},
            {id:'eeeeeeeeeee',title:'Công an điều tra âm mưu lừa đảo mới',channel:'ANTV',published:'4 giờ trước'},
            {id:'ffffffffff1',title:'Phanh phui âm mưu lừa đảo qua mạng',channel:'VTC NEWS',published:'5 giờ trước'},
            {id:'ggggggggggg',title:'Giá vàng tiếp tục tăng, nhà đầu tư chú ý',channel:'VTV24',published:'1 giờ trước'},
            {id:'hhhhhhhhhhh',title:'Vàng trong nước tăng giá mạnh',channel:'VOV',published:'2 giờ trước'}
          ];
          const res=await fetch(url,{
            method:'POST',
            headers:{
              'content-type':'application/json',
              'authorization':'Bearer '+key,
              'apikey':key,
              'origin':'https://yt.taphoa.xyz'
            },
            body:JSON.stringify({scope:'latest',videos})
          });
          const text=await res.text();
          console.log('STATUS='+res.status);
          console.log('BODY='+text);
          if(!res.ok)process.exit(1);
          const body=JSON.parse(text);
          if(!body.ok||!Array.isArray(body.topics))process.exit(2);
          NODE
