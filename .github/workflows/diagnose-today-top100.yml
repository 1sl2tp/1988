name: Smoke source popup UI

on:
  push:
    branches: [diag-keyword-channel-scan]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test production source UI
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          PID=$!
          sleep 2
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function connect(){
            let targets=[];
            for(let i=0;i<40;i++){
              try{targets=await (await fetch('http://127.0.0.1:9222/json')).json();if(targets.length)break}catch{}
              await sleep(250);
            }
            const target=targets.find(x=>x.type==='page');
            if(!target?.webSocketDebuggerUrl)throw new Error('no_cdp_target');
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            let id=0; const pending=new Map();
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const msgId=++id;pending.set(msgId,{resolve,reject});ws.send(JSON.stringify({id:msgId,method,params}));
            });
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}};
            await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
            return {ws,send};
          }
          (async()=>{
            const {ws,send}=await connect();
            await send('Runtime.enable');await send('Page.enable');
            await send('Page.navigate',{url:'https://yt.taphoa.xyz/?sourcepopup='+Date.now()});
            await sleep(6000);
            const out=await send('Runtime.evaluate',{
              expression:`(async()=>{
                const errors=[];
                window.addEventListener('error',e=>errors.push(String(e.message||e.error||e)));
                document.querySelector('#sourcesBtn')?.click();
                await new Promise(r=>setTimeout(r,1800));

                const firstRow=document.querySelector('#sourceList .source-row[data-source-id]');
                const firstId=firstRow?.dataset?.sourceId||'';
                const avatar=firstRow?.querySelector('.source-avatar img')?.src||'';
                const sub=firstRow?.querySelector('.source-row-sub')?.textContent||'';

                document.querySelector('#sourceSettingsBtn')?.click();
                await new Promise(r=>setTimeout(r,100));
                const settingsActive=document.querySelector('#sourceSettingsBtn')?.classList.contains('active')||false;
                const deleteVisible=!!document.querySelector('#sourceList [data-source-delete]');
                document.querySelector('#sourceSettingsBtn')?.click();

                document.querySelector('#sourceList [data-source-preview]')?.click();
                await new Promise(r=>setTimeout(r,4000));
                const previewVisible=!document.querySelector('#sourcePreview')?.hidden;
                const videoButton=document.querySelector('#sourcePreviewList [data-source-video-id]');
                const previewVideos=document.querySelectorAll('#sourcePreviewList [data-source-video-id]').length;
                videoButton?.click();
                await new Promise(r=>setTimeout(r,500));

                const popup=document.querySelector('#sourceVideoPopup');
                const popupVisible=!popup?.hidden;
                const frameSrc=document.querySelector('#sourceVideoFrame')?.src||'';
                const sheetStillVisible=!document.querySelector('#sourcesSheet')?.hidden;
                const previewStillVisible=!document.querySelector('#sourcePreview')?.hidden;

                document.querySelector('#closeSourceVideoPopup')?.click();
                const popupClosed=document.querySelector('#sourceVideoPopup')?.hidden===true;

                const local=window.YTLocal;
                const vtv=local?.searchChannels?await local.searchChannels('VTV'):[];
                const meta=firstId&&local?.channelMeta?await local.channelMeta(firstId):null;

                return JSON.stringify({
                  firstId,avatar,sub,settingsActive,deleteVisible,
                  previewVisible,previewVideos,popupVisible,frameSrc,
                  sheetStillVisible,previewStillVisible,popupClosed,
                  vtv:vtv.slice(0,3),meta,errors
                });
              })()`,
              awaitPromise:true,
              returnByValue:true
            });
            console.log('SMOKE_JSON='+out?.result?.value);
            ws.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$PID" 2>/dev/null || true
