name: Smoke production AI cleanup

on:
  push:
    branches: [diag-keyword-channel-scan]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify production AI cleanup
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          PID=$!
          sleep 2
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function connect(){
            let targets=[];
            for(let i=0;i<40;i++){
              try{targets=await (await fetch('http://127.0.0.1:9222/json')).json();if(targets.length)break}catch{}
              await sleep(250);
            }
            const target=targets.find(x=>x.type==='page');
            if(!target?.webSocketDebuggerUrl)throw new Error('no_cdp_target');
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            let id=0;const pending=new Map();const listeners=[];
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const msgId=++id;pending.set(msgId,{resolve,reject});ws.send(JSON.stringify({id:msgId,method,params}));
            });
            ws.onmessage=e=>{
              const m=JSON.parse(e.data);
              if(m.id&&pending.has(m.id)){
                const p=pending.get(m.id);pending.delete(m.id);
                m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);
              }else if(m.method){
                for(const fn of listeners)fn(m);
              }
            };
            await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
            return {ws,send,on:fn=>listeners.push(fn)};
          }

          (async()=>{
            const {ws,send,on}=await connect();
            await send('Runtime.enable');
            await send('Page.enable');
            await send('Network.enable');

            let aiResponse=null;
            on(async m=>{
              if(m.method!=='Network.responseReceived')return;
              const url=String(m.params?.response?.url||'');
              if(!url.includes('/yt1988-topics'))return;
              try{
                const body=await send('Network.getResponseBody',{requestId:m.params.requestId});
                aiResponse=body?.body||'';
              }catch{}
            });

            await send('Page.navigate',{url:'https://yt.taphoa.xyz/?aiclean='+Date.now()});
            await sleep(22000);

            const dom=await send('Runtime.evaluate',{
              expression:`(()=>{
                const cards=[...document.querySelectorAll('#feed .card')].slice(0,12).map(card=>({
                  title:card.querySelector('.card-title')?.textContent?.trim()||'',
                  channel:card.querySelector('.card-channel')?.textContent?.trim()||''
                }));
                const chips=[...document.querySelectorAll('#trendTopics .trend-chip')].map(x=>x.textContent.trim()).filter(Boolean);
                return JSON.stringify({
                  title:document.querySelector('#feedTitle')?.textContent?.trim()||'',
                  cardCount:document.querySelectorAll('#feed .card').length,
                  chips,
                  cards
                });
              })()`,
              returnByValue:true
            });

            let aiSummary=null;
            try{
              const parsed=JSON.parse(aiResponse||'{}');
              aiSummary={
                ok:parsed.ok,
                cached:parsed.cached,
                topicCount:Array.isArray(parsed.topics)?parsed.topics.length:0,
                videoMetaCount:Array.isArray(parsed.videos)?parsed.videos.length:0,
                duplicateCount:Array.isArray(parsed.videos)?parsed.videos.filter(v=>v.duplicateGroup).length:0,
                samples:Array.isArray(parsed.videos)?parsed.videos.slice(0,5):[]
              };
            }catch{}

            console.log('PROD_JSON='+dom?.result?.value);
            console.log('AI_JSON='+JSON.stringify(aiSummary));
            ws.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          kill "$PID" 2>/dev/null || true
