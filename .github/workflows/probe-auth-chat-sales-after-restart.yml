name: Probe Auth Chat Sales after restart

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-auth-chat-sales-after-restart.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Supabase Auth and REST
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,time
          base='https://gcnoahqsrquxkwkjbuxy.supabase.co'
          key='sb_publishable_UY3gfQ9MsntDFCUJ_uV0UA__eTYXz_w'
          h={'apikey':key,'Authorization':'Bearer '+key}
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          def call(name,method,url,headers=None,**kw):
              t=time.time()
              try:
                  r=s.request(method,url,headers=headers,timeout=12,**kw)
                  print(name,'status='+str(r.status_code),'sec='+str(round(time.time()-t,3)),
                        'body='+r.text[:180].replace('\n',' '))
              except Exception as e:
                  print(name,'ERROR','sec='+str(round(time.time()-t,3)),repr(e))
          call('AUTH_HEALTH','GET',base+'/auth/v1/health')
          call('AUTH_FAKE_LOGIN','POST',base+'/auth/v1/token?grant_type=password',
               headers={**h,'Content-Type':'application/json'},
               json={'email':'probe-do-not-exist@example.invalid','password':'not-real'})
          call('REST_CHAT','GET',base+'/rest/v1/v21_messages?select=id&limit=1',headers=h)
          call('REST_SALES_PRODUCTS','GET',base+'/rest/v1/taphoa_products?select=id&limit=1',headers=h)
          call('REST_SALES_ORDERS','GET',base+'/rest/v1/taphoa_orders?select=id&limit=1',headers=h)
          for u in ['https://chat.taphoa.xyz','https://app.taphoa.xyz']:
              call('SITE_'+u.split('//')[1].split('.')[0].upper(),'GET',u)
          PY
