name: Scan giaodendoithuong79 FLV fields once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-giaodendoithuong79-flv-once.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan all TikTok response fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          H='giaodendoithuong79'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          url='https://www.tiktok.com/api-live/user/room?aid=1988&sourceType=54&uniqueId='+H
          req=urllib.request.Request(url,headers={
              'User-Agent':UA,
              'Referer':'https://www.tiktok.com/@'+H+'/live',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'vi-VN,vi;q=0.9,en;q=0.5'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              root=json.load(r)

          print('ROOT_KEYS',sorted(root.keys()))
          print('STATUS_CODE',root.get('statusCode'),'MESSAGE',root.get('message'))

          rows=[]
          urls=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      p=(path+'.'+k) if path else k
                      low=p.lower()
                      if any(t in low for t in ('flv','stream','pull','room','live_core','play_url','playurl')):
                          s=str(x)
                          rows.append((p,type(x).__name__,s[:260].replace('\n',' ')))
                      walk(x,p)
              elif isinstance(v,list):
                  for i,x in enumerate(v[:100]):
                      walk(x,path+'['+str(i)+']')
              elif isinstance(v,str):
                  for m in re.finditer(r'https?://[^"\\\s<>]+',v):
                      u=m.group(0).replace('\\u002F','/').replace('\\u0026','&').replace('\\/','/')
                      if not any(z[1]==u for z in urls):
                          urls.append((path,u))
                  t=v.strip()
                  if (t.startswith('{') and t.endswith('}')) or (t.startswith('[') and t.endswith(']')):
                      try: walk(json.loads(t),path+'{json}')
                      except: pass
          walk(root)
          for p,t,s in rows[:300]:
              print('PATH',p,'TYPE',t,'VAL',s)
          print('URL_COUNT',len(urls))
          for p,u in urls[:120]:
              q=urllib.parse.urlsplit(u)
              print('URL',p,'host='+str(q.hostname),'path='+q.path[-120:])
          PY
