name: Verify media scroll stability once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-media-scroll-stability-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium webkit

      - name: Verify shared inline geometry on web mobile and PWA
        env:
          TARGET_URL: https://yt.taphoa.xyz/
        run: |
          node <<'NODE'
          const { chromium, webkit } = require('playwright');

          async function waitRows(page,selector,timeout=20000){
            await page.waitForFunction(
              selector => document.querySelectorAll(selector).length>0,
              selector,
              {timeout}
            );
            return page.locator(selector);
          }

          async function measureAlignment(page,label,expectedType){
            await page.waitForFunction(expectedType=>{
              const player=document.getElementById('player');
              return player?.classList.contains('inline-overlay') &&
                     !player?.classList.contains('pip') &&
                     player?.dataset?.mediaType===expectedType;
            },expectedType,{timeout:12000});

            const initial=await page.evaluate(()=>{
              const player=document.getElementById('player');
              const id=String(document.querySelector('.row.selected')?.dataset?.videoId||'');
              const host=document.querySelector('.row.selected .row-thumb');
              const p=player.getBoundingClientRect();
              const h=host?.getBoundingClientRect();
              return {
                id,
                position:getComputedStyle(player).position,
                p:{top:p.top,left:p.left,right:p.right,bottom:p.bottom,width:p.width,height:p.height},
                h:h?{top:h.top,left:h.left,right:h.right,bottom:h.bottom,width:h.width,height:h.height}:null
              };
            });
            if(initial.position!=='absolute')throw new Error(label+': inline player is '+initial.position+', expected absolute');
            if(!initial.h)throw new Error(label+': selected thumbnail missing');

            const target=Math.max(30,Math.min(initial.h.height*.48,initial.h.top+initial.h.height*.48));
            const samples=[];
            for(let i=1;i<=12;i++){
              await page.evaluate(y=>window.scrollBy(0,y),target/12);
              await page.waitForTimeout(35);
              const sample=await page.evaluate(()=>{
                const player=document.getElementById('player');
                const host=document.querySelector('.row.selected .row-thumb');
                const p=player.getBoundingClientRect();
                const h=host?.getBoundingClientRect();
                return {
                  pip:player.classList.contains('pip'),
                  inline:player.classList.contains('inline-overlay'),
                  type:player.dataset.mediaType||'',
                  top:p.top-h.top,
                  left:p.left-h.left,
                  right:p.right-h.right,
                  bottom:p.bottom-h.bottom,
                  width:p.width-h.width,
                  height:p.height-h.height,
                  hostTop:h.top,
                  hostBottom:h.bottom
                };
              });
              samples.push(sample);
            }

            const stable=samples.filter(x=>x.inline&&!x.pip);
            if(stable.length<8)throw new Error(label+': inline->PiP switched too early '+JSON.stringify(samples));
            const maxAbs=Math.max(...stable.flatMap(x=>[
              Math.abs(x.top),Math.abs(x.left),Math.abs(x.right),
              Math.abs(x.bottom),Math.abs(x.width),Math.abs(x.height)
            ]));
            if(maxAbs>0.8)throw new Error(label+': geometry drift '+maxAbs+' '+JSON.stringify(stable));

            console.log(JSON.stringify({
              ok:true,
              label,
              expectedType,
              videoId:initial.id,
              maxGeometryDriftPx:maxAbs,
              samples:stable.length
            }));
          }

          async function openYoutube(page){
            await page.locator('#platformYouTube').click();
            await page.waitForTimeout(800);
            const latest=page.locator('.source-chip[data-source-tab="latest"]');
            if(await latest.count())await latest.click();
            const rows=await waitRows(page,'.row[data-provider="youtube"][data-video-id]');
            const row=rows.first();
            await row.scrollIntoViewIfNeeded();
            await row.click();
            await page.waitForTimeout(600);
            await measureAlignment(page,'youtube-embed','embed');
          }

          async function openTikTokMedia(page){
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.locator('#platformTikTok').click();
            await page.waitForTimeout(500);
            const video=page.locator('[data-platform-subtab="video"]');
            if(await video.count())await video.click();
            const rows=await waitRows(page,'.row[data-provider="tiktok"][data-video-id]',25000);
            const nonLive=rows.filter({hasNot:page.locator('.tiktok-live-badge')}).first();
            await nonLive.scrollIntoViewIfNeeded();
            await nonLive.click();
            await page.waitForTimeout(600);
            await measureAlignment(page,'tiktok-media','media');
          }

          async function verifyLiveShell(page){
            // Geometry is owned by the shared player shell, not the decoder.
            // Reuse a selected TikTok card and switch only engine type so this
            // test is independent of whether a LIVE happens to exist right now
            // or whether headless Chromium supports that stream codec.
            await page.evaluate(()=>window.scrollTo(0,0));
            const video=page.locator('[data-platform-subtab="video"]');
            if(!(await video.isVisible().catch(()=>false))){
              await page.locator('#platformTikTok').click().catch(()=>{});
              await page.waitForTimeout(350);
            }
            if(await video.isVisible().catch(()=>false))await video.click();

            const rows=await waitRows(page,'.row[data-provider="tiktok"][data-video-id]',25000);
            const row=rows.first();
            await row.scrollIntoViewIfNeeded();
            await row.click();
            await page.waitForTimeout(500);

            await page.evaluate(()=>{
              const p=document.getElementById('player');
              const embed=document.getElementById('embedMediaCore');
              const live=document.getElementById('liveMediaCore');
              const media=document.getElementById('nativeMediaCore');
              if(p)p.dataset.mediaType='live';
              if(embed)embed.hidden=true;
              if(live)live.hidden=false;
              if(media)media.hidden=true;
            });

            await measureAlignment(page,'tiktok-live-shell','live');
          }

          async function run(browserType,label,contextOptions={},standalone=false){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext(contextOptions);

            if(standalone){
              await context.addInitScript(() => {
                try{
                  Object.defineProperty(navigator,'standalone',{get:()=>true,configurable:true});
                }catch{}
                const mm=window.matchMedia.bind(window);
                window.matchMedia=(query)=>{
                  const result=mm(query);
                  if(String(query).includes('display-mode: standalone')){
                    return new Proxy(result,{
                      get(target,prop){
                        if(prop==='matches')return true;
                        const value=target[prop];
                        return typeof value==='function'?value.bind(target):value;
                      }
                    });
                  }
                  return result;
                };
              });
            }

            const page=await context.newPage();
            page.on('pageerror',e=>console.error(label,'pageerror',String(e)));
            await page.goto(process.env.TARGET_URL+'?scroll_verify='+Date.now(),{
              waitUntil:'domcontentloaded',
              timeout:60000
            });
            await page.waitForTimeout(3500);

            if(standalone){
              await page.evaluate(async()=>navigator.serviceWorker?.ready.catch(()=>null));
              await page.reload({waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(2200);
              const pwa=await page.evaluate(async()=>({
                controlled:!!navigator.serviceWorker?.controller,
                caches:'caches' in window?await caches.keys():[]
              }));
              if(!pwa.controlled)throw new Error(label+': service worker not controlling');
              if(!pwa.caches.includes('1988-simple-media-v43')){
                throw new Error(label+': v43 cache missing '+JSON.stringify(pwa.caches));
              }
            }

            await openYoutube(page);
            await openTikTokMedia(page);
            await verifyLiveShell(page);

            console.log(JSON.stringify({ok:true,mode:label}));
            await context.close();
            await browser.close();
          }

          (async()=>{
            await run(chromium,'web-one-column',{
              viewport:{width:820,height:900}
            });
            await run(webkit,'web-mobile',{
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
            });
            await run(chromium,'pwa-standalone',{
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
            },true);
          })().catch(error=>{
            console.error(error);
            process.exit(1);
          });
          NODE
