name: Verify yt-dlp Nightly

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve nightly requirements
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/ytdlp/requirements.txt
          python - <<'PY'
          import yt_dlp
          print("yt-dlp version:", yt_dlp.version.__version__)
          assert yt_dlp.version.__version__ != "2026.08.19"
          PY
