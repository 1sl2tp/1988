name: One-shot Deploy YouTube LIVE Strict Edge
# run-rev: state-lite-v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-youtube-live-state-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_COMMIT: 52946bce76535788525913fa647095f9030d9522
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stage strict Worker mirror
        run: |
          set -euo pipefail
          mkdir -p /tmp/youtube-live-state/src
          cp cloudflare/youtube-live-state/worker.js /tmp/youtube-live-state/src/index.js
          node --check /tmp/youtube-live-state/src/index.js

      - name: Install Wrangler
        run: npm install -g wrangler@4.129.1

      - name: Check Cloudflare access
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "$API?per_page=100" > /tmp/kv-list.json
          KV_ID="$(jq -r '.result[] | select(.title=="1988-youtube-live-state") | .id' /tmp/kv-list.json | head -1)"
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Build no-cron config
        run: |
          cat > /tmp/youtube-live-state/wrangler.toml <<EOF
          name = "1988-youtube-live-state"
          main = "src/index.js"
          compatibility_date = "2026-10-01"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[kv_namespaces]]
          binding = "YOUTUBE_LIVE"
          id = "$KV_ID"

          [triggers]
          crons = []
          EOF

      - name: Deploy strict LIVE edge
        working-directory: /tmp/youtube-live-state
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$URL"
          echo "EDGE_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify zero schedules
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/1988-youtube-live-state/schedules"
          curl -fsSL             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "$API" > /tmp/schedules.json
          jq -e '.success == true and (.result.schedules | length) == 0' /tmp/schedules.json >/dev/null

      - name: Complete one demand scan
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 "$EDGE_URL/youtube/live-scan?start=1" -o /tmp/scan.json
          for i in $(seq 1 20); do
            DONE="$(jq -r '.done // false' /tmp/scan.json)"
            if [ "$DONE" = "true" ]; then break; fi
            curl -fsSL --max-time 120 "$EDGE_URL/youtube/live-scan" -o /tmp/scan.json
          done
          jq '{ok,edge,done,cursor,total,selected,discovered,checked,live,changed}' /tmp/scan.json
          jq -e '.ok == true and .edge == true and .done == true' /tmp/scan.json >/dev/null

      - name: Verify snapshot
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 "$EDGE_URL/youtube/live-now" -o /tmp/live.json
          jq '{ok,edge,version,checkedAt,live,selected,discovered}' /tmp/live.json
          jq -e '.ok == true and .edge == true' /tmp/live.json >/dev/null
