name: Backfill TikTok channels missing recent videos once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-tiktok-missing-videos-once.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deep refresh only channels with incomplete recent-video data
        shell: bash
        env:
          HANDLES: "anhdidau86,djro_9os,duyanh.hp91,hai.chung.minhh,hayenbai555,huan_guitar,nguyenthu029,nguyet_hadong,o752873,phanyeudep,phuongbetong8,quynhanhvuive,quynhlam_official,thichkhaiquang,thuhienducphat,trangvachigai,duong.06789,tu.thuong_lay_minh_1,jabaw2026,phamtuninhbinh,tmtaoe96,ttgdyedh,banhcanhghe69hl,ne_vietnam"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          base='https://one988-tiktok-session.onrender.com'
          handles=[x for x in os.environ['HANDLES'].split(',') if x]
          results=[]

          def get_json(path, timeout=45):
              req=urllib.request.Request(
                  base+path,
                  headers={
                      'User-Agent':'1988-tiktok-targeted-backfill/1.0',
                      'Accept':'application/json'
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          for i,handle in enumerate(handles,1):
              q=urllib.parse.urlencode({'user':handle,'refresh':'1','full':'1'})
              before=get_json('/tiktok/channel-videos?'+q)
              before_checked=int(before.get('checkedAt') or 0)
              print(f'[{i}/{len(handles)}] queued @{handle} old={len(before.get("videos") or [])}', flush=True)

              final=before
              deadline=time.time()+55
              while time.time()<deadline:
                  time.sleep(2)
                  q2=urllib.parse.urlencode({'user':handle,'refresh':'0'})
                  row=get_json('/tiktok/channel-videos?'+q2)
                  final=row
                  checked=int(row.get('checkedAt') or 0)
                  if checked>before_checked:
                      break

              count=len(final.get('videos') or [])
              results.append({
                  'handle':handle,
                  'videos':count,
                  'status':final.get('status'),
                  'checkedAt':final.get('checkedAt')
              })
              print(f'[{i}/{len(handles)}] done @{handle} videos={count} status={final.get("status")}', flush=True)

          print(json.dumps({'ok':True,'results':results},ensure_ascii=False))
          PY
