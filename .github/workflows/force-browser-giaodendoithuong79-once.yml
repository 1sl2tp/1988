name: Force browser giaodendoithuong79 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-browser-giaodendoithuong79-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask backend browser capture then verify
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          BASE='https://one988-tiktok-session.onrender.com'
          H='giaodendoithuong79'
          UA='Mozilla/5.0'
          def read(url,timeout=40):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.headers,r.read()
          try:
              s,h,b=read(BASE+'/tiktok/live-session?user='+H+'&force=browser',55)
              print('CAPTURE',s,b.decode('utf-8','ignore')[:2000])
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','ignore')
              print('CAPTURE_HTTP_ERROR',e.code,body[:4000])
          except Exception as e:
              print('CAPTURE_ERROR',repr(e))
          try:
              s,h,b=read(BASE+'/tiktok/live-now?t=after',30)
              d=json.loads(b)
              rows=[x for x in d.get('items',[]) if str(x.get('handle','')).lower()==H]
              print('AFTER',json.dumps(rows,ensure_ascii=False))
              row=rows[0] if rows else {}
              stream=row.get('streamUrl') or ''
              if stream:
                  req=urllib.request.Request(BASE+stream,headers={'User-Agent':UA,'Range':'bytes=0-262143','Accept':'*/*'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(262144)
                      print('STREAM',r.status,r.headers.get('content-type'),len(data),data[:3],9 in data[:65536],8 in data[:65536])
          except Exception as e:
              print('VERIFY_ERROR',repr(e))
          PY
