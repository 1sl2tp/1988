name: Deploy 1988 Player

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test media core
        run: |
          node --test tests/feed-refresh.test.cjs
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/backend-media-proxy.test.cjs
          python -m py_compile backend/ytdlp/server.py
          node --check src/media-core.js
          node --check src/app.js
          node --check src/yt-local.js
          node --check backend/social-collector/server.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
