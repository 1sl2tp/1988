name: Deploy 1988 Player

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "supabase/**"
      - "cloudflare/**"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
      - "**/*.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test frontend production contracts
        run: |
          node --test tests/feed-refresh.test.cjs
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/tiktok-playback-contract.test.cjs
          node tests/channel-library-contract.test.cjs
          node --check src/media-core.js
          node --check src/app.js
          node --check src/yt-local.js
          node --check sources/sources.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build production site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js CNAME .nojekyll apple-touch-icon.png silent.wav _site/
          cp -R icons src sources _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
