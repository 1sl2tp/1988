name: Deploy 1988 Player
# contract-rev: host-v3

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "supabase/**"
      - "cloudflare/**"
      - "docs/**"
      - "tests/**"
      - "scripts/**"
      - "**/*.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test frontend production contracts
        run: |
          node --test tests/feed-refresh.test.cjs
          node tests/source-state-contract.test.cjs
          node tests/search-resource-contract.test.cjs
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/channel-library-contract.test.cjs
          node tests/host-architecture-contract.test.cjs
          node --check src/media-core.js
          node --check src/app.js
          node --check src/yt-local.js
          node --check sources/sources.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build production site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js CNAME .nojekyll apple-touch-icon.png silent.wav _site/
          cp -R icons src sources _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Pages custom domain
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          DOMAIN="$(tr -d '\r\n[:space:]' < CNAME)"
          test -n "$DOMAIN"
          echo "Expected domain: $DOMAIN"
          echo "GitHub Pages URL: $PAGE_URL"

          case "$PAGE_URL" in
            "https://$DOMAIN/"|"https://$DOMAIN") ;;
            *)
              echo "::error::GitHub Pages Custom domain is not bound to $DOMAIN. Open Settings → Pages → Custom domain and save $DOMAIN."
              exit 1
              ;;
          esac

          CNAME_TARGET="$(dig +short CNAME "$DOMAIN" | head -1 | tr -d '\r\n')"
          echo "DNS CNAME: $CNAME_TARGET"
          case "$CNAME_TARGET" in
            *.github.io.) ;;
            *)
              echo "::error::DNS for $DOMAIN must be a CNAME to a github.io host."
              exit 1
              ;;
          esac

          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -L -sS -o /tmp/pages-domain.html -w '%{http_code}' --max-time 20 "https://$DOMAIN/" || true)"
            if [ "$CODE" = "200" ]; then
              echo "HTTPS OK: https://$DOMAIN/"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE; retrying..."
            sleep 10
          done

          echo "::error::https://$DOMAIN/ did not return HTTP 200 after deployment."
          exit 1
