name: Deploy 1988 Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose live media
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988'
          curl -sS --fail-with-body "$BASE?action=search&q=MY%20HANH%20Viber&filter=videos" -o /tmp/search.json
          echo '=== SEARCH ==='
          jq '{ok,source,items:(.data.items//[])[:3]|map({url,title,duration})}' /tmp/search.json
          ID=$(jq -r '(.data.items//[])[0].url // empty' /tmp/search.json | sed -nE 's#.*([A-Za-z0-9_-]{11})$#\1#p' | head -1 || true)
          if [ -z "$ID" ]; then ID='jfKfPfyJRdk'; fi
          echo "ID=$ID"
          echo '=== PLAYBACK ==='
          curl -sS --fail-with-body "$BASE?action=playback&id=$ID" -o /tmp/playback.json
          jq '{ok,source,data:{hls:.data.hls,sources:(.data.sources//[])[:5],audioSources:(.data.audioSources//[])[:3]}}' /tmp/playback.json
          echo '=== MEDIA HEAD ==='
          curl -sS -I -L --max-time 30 "$BASE?action=media&id=$ID&kind=video" | sed -n '1,120p'
          echo '=== MEDIA RANGE ==='
          curl -sS -L --max-time 30 -r 0-65535 -D /tmp/media.headers "$BASE?action=media&id=$ID&kind=video" -o /tmp/media.bin || true
          cat /tmp/media.headers
          file /tmp/media.bin || true
          wc -c /tmp/media.bin || true

      - name: Test media core
        run: |
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node --check src/media-core.js
          node --check src/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
