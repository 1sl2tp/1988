name: Deploy 1988 Player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-player-v4
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply 1988 UX patch
        run: python3 scripts/apply-ux-patch.py

      - name: Apply immersive reel UX
        run: python3 scripts/apply-reel-v2.py

      - name: Apply polish v3
        run: python3 scripts/apply-polish-v3.py

      - name: Apply source feed v4
        run: python3 scripts/apply-feed-v4.py

      - name: Apply UI v5
        run: python3 scripts/apply-ui-v5.py

      - name: Rewrite YouTube shell v7
        run: python3 scripts/apply-youtube-shell-v7.py

      - name: Rewrite YouTube pages v7
        run: python3 scripts/apply-youtube-pages-v7.py

      - name: Apply persistent mini v8
        run: python3 scripts/apply-mini-v8.py

      - name: Apply unavailable filter v9
        run: python3 scripts/apply-unavailable-v9.py

      - name: Apply mini transport v10
        run: python3 scripts/apply-mini-v10.py

      - name: Apply watch refinement v11
        run: python3 scripts/apply-watch-v11.py

      - name: Apply unified cards v12
        run: python3 scripts/apply-card-unify-v12.py

      - name: Apply freshness v13
        run: python3 scripts/apply-freshness-v13.py

      - name: Apply publisher sources v14
        run: python3 scripts/apply-sources-v14.py

      - name: Apply TikTok swipe v15
        run: python3 scripts/apply-tiktok-v15.py

      - name: Apply dynamic sources v16
        run: python3 scripts/apply-dynamic-sources-v16.py

      - name: Apply card navigation v17
        run: python3 scripts/apply-card-navigation-v17.py

      - name: Build exact Kira proof
        run: bash scripts/build-kira-proof.sh


      - name: Diagnose live media
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        continue-on-error: true
        run: |
          BASE='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988'
          AUDIO='https://one988-audio.onrender.com'
          curl -sS "$BASE?action=search&q=MY%20HANH%20Viber&filter=videos" -o /tmp/search.json
          echo '=== SEARCH ==='
          jq '{ok,source,items:(.data.items//[])[:3]|map({url,title,duration})}' /tmp/search.json
          ID=$(jq -r '(.data.items//[])[0].url // empty' /tmp/search.json | sed -nE 's#.*([A-Za-z0-9_-]{11})$#\1#p' | head -1 || true)
          if [ -z "$ID" ]; then ID='jfKfPfyJRdk'; fi
          echo "ID=$ID"

          echo '=== DIRECT PIPED STREAM TIMING ==='
          for API in https://pipedapi.ducks.party https://pipedapi.adminforge.de https://api.piped.private.coffee; do
            printf '%s -> ' "$API"
            curl -sS -o /tmp/piped.json --max-time 15 -w 'HTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n' "$API/streams/$ID" || true
            if [ -s /tmp/piped.json ]; then jq -r '{title,videoStreams:(.videoStreams//[]|length),audioStreams:(.audioStreams//[]|length),hls:(.hls//"")}' /tmp/piped.json 2>/dev/null || true; fi
          done

          echo '=== INVIDIOUS VIDEO API ==='
          for INV in https://inv.nadeko.net https://invidious.nerdvpn.de https://yt.chocolatemoo53.com https://invidious.tiekoetter.com https://invidious.f5.si; do
            printf '%s -> ' "$INV"
            curl -sS -o /tmp/inv.json --max-time 20 -w 'HTTP=%{http_code} TIME=%{time_total}s SIZE=%{size_download}\n' "$INV/api/v1/videos/$ID?local=true" || true
            if [ -s /tmp/inv.json ]; then
              jq -r '{title,formatStreams:(.formatStreams//[]|length),adaptiveFormats:(.adaptiveFormats//[]|length),mp4:(.formatStreams//[]|map(select((.type//"")|contains("video/mp4")))|length),audioMp4:(.adaptiveFormats//[]|map(select((.type//"")|contains("audio/mp4")))|length),hlsUrl:(.hlsUrl//"")}' /tmp/inv.json 2>/dev/null || true
            fi
          done

          echo '=== EDGE PLAYBACK ==='
          curl -sS -w '\nHTTP=%{http_code}\n' "$BASE?action=playback&id=$ID" || true

          echo '=== EDGE MEDIA HEAD ==='
          curl -sS -I -L --max-time 30 "$BASE?action=media&id=$ID&kind=video" || true

          echo '=== RENDER HEALTH ==='
          curl -sS -w '\nHTTP=%{http_code}\n' --max-time 40 "$AUDIO/health" || true
          echo '=== PLAYER FRONTENDS ==='
          for FRONT in https://piped.video https://cf.piped.video https://vc.piped.video https://re.piped.video https://nf.piped.video; do
            printf '%s -> ' "$FRONT"
            curl -sS -L -o /dev/null --max-time 20 -w 'HTTP=%{http_code} TYPE=%{content_type} URL=%{url_effective}\n' "$FRONT/embed/$ID?autoplay=1" || true
          done


          echo '=== RENDER RESOLVE ==='
          curl -sS -w '\nHTTP=%{http_code}\n' --max-time 60 "$AUDIO/resolve?id=$ID" || true

      - name: Test media core
        run: |
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/backend-media-proxy.test.cjs
          python -m py_compile backend/ytdlp/server.py
          node --check src/media-core.js
          node --check src/app.js
          node --check src/yt-local.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
