name: Deploy 1988 Site to Cloudflare

concurrency:
  group: deploy-1988-site-cloudflare-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "CNAME"
      - ".nojekyll"
      - "apple-touch-icon.png"
      - "silent.wav"
      - "icons/**"
      - "src/**"
      - "sources/**"
      - "cloudflare/site/**"
      - ".github/workflows/deploy-site-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test production contracts
        run: |
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/tiktok-playback-contract.test.cjs

      - name: Build production site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js CNAME .nojekyll apple-touch-icon.png silent.wav _site/
          cp -R icons src sources _site/

      - name: Deploy Cloudflare site
        working-directory: cloudflare/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
