name: Benchmark TikTok Downloaders

on:
  push:
    branches: [bench-tiktok-downloaders]
    paths:
      - ".github/workflows/benchmark-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Benchmark one TikTok video
        env:
          VIDEO_URL: "https://www.tiktok.com/@geely.daily/video/7689814919914458374?is_from_webapp=1&sender_device=pc"
        run: |
          cat > bench.mjs <<'JS'
          import { chromium } from 'playwright';

          const videoUrl=process.env.VIDEO_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36'
          });
          const page=await context.newPage();

          let apiRequest=null;
          let apiResponse=null;
          let apiStart=0;
          let apiEnd=0;

          page.on('request',req=>{
            if(req.url().includes('api3.viesnap.com/info')){
              apiStart=Date.now();
              apiRequest={
                url:req.url(),
                method:req.method(),
                postData:req.postData(),
                headers:req.headers()
              };
            }
          });
          page.on('response',async res=>{
            if(res.url().includes('api3.viesnap.com/info')){
              apiEnd=Date.now();
              try{apiResponse=await res.json()}catch{apiResponse={raw:(await res.text()).slice(0,10000)}}
            }
          });

          const t0=Date.now();
          await page.goto('https://braw.ie/#',{waitUntil:'domcontentloaded',timeout:30000});
          const loadMs=Date.now()-t0;

          const input=page.locator('#urlInput');
          await input.fill(videoUrl);
          const btn=page.locator('button').filter({hasText:/tải|download/i}).first();
          const submitAt=Date.now();
          await btn.click();
          await page.waitForTimeout(6500);

          function flatten(value,path='',out=[]){
            if(value==null)return out;
            if(typeof value==='string'){
              if(/^https?:\/\//i.test(value))out.push({path,url:value});
              return out;
            }
            if(Array.isArray(value)){
              value.forEach((v,i)=>flatten(v,path+'['+i+']',out));
              return out;
            }
            if(typeof value==='object'){
              for(const [k,v] of Object.entries(value))flatten(v,path?path+'.'+k:k,out);
            }
            return out;
          }

          const urls=flatten(apiResponse||{});
          const candidates=urls.filter(x=>{
            const p=x.path.toLowerCase(),u=x.url.toLowerCase();
            return /(video|play|download|nowm|watermark|hd|origin|media)/.test(p) ||
                   /\.mp4(?:\?|$)|tiktokcdn|muscdn|byteoversea|ibytedtos/.test(u);
          });

          async function probe(url){
            const controller=new AbortController();
            const timeout=setTimeout(()=>controller.abort(),12000);
            const started=Date.now();
            try{
              const r=await fetch(url,{
                headers:{
                  'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
                  'range':'bytes=0-1048575',
                  'accept':'video/*,*/*',
                  'referer':'https://braw.ie/'
                },
                redirect:'follow',signal:controller.signal
              });
              const ttfb=Date.now()-started;
              const ab=await r.arrayBuffer();
              const total=Date.now()-started;
              const ct=r.headers.get('content-type')||'';
              return {
                url,status:r.status,contentType:ct,ttfbMs:ttfb,totalMs:total,
                bytes:ab.byteLength,
                mbps:total?Number(((ab.byteLength*8/1e6)/(total/1000)).toFixed(2)):0,
                finalUrl:r.url
              };
            }catch(e){return {url,error:String(e?.message||e)}}
            finally{clearTimeout(timeout)}
          }

          const probes=[];
          for(const c of candidates.slice(0,12)){
            const p=await probe(c.url);
            probes.push({path:c.path,...p});
            if(/video\/|octet-stream/i.test(p.contentType||'')&&p.bytes>0)break;
          }

          console.log('BRAW_RESULT '+JSON.stringify({
            loadMs,
            submitToApiResponseMs:apiEnd&&submitAt?apiEnd-submitAt:null,
            apiDurationMs:apiEnd&&apiStart?apiEnd-apiStart:null,
            request:{
              url:apiRequest?.url||'',
              method:apiRequest?.method||'',
              postData:apiRequest?.postData||''
            },
            responseKeys:apiResponse&&typeof apiResponse==='object'?Object.keys(apiResponse):[],
            candidates:candidates.slice(0,20),
            probes
          }));
          await context.close();
          await browser.close();
          JS
          node bench.mjs
