name: Benchmark TikTok Downloaders

on:
  push:
    branches: [bench-tiktok-downloaders]
    paths:
      - ".github/workflows/benchmark-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Benchmark one TikTok video
        env:
          VIDEO_URL: "https://www.tiktok.com/@geely.daily/video/7689814919914458374?is_from_webapp=1&sender_device=pc"
        run: |
          cat > bench.mjs <<'JS'
          import { chromium } from 'playwright';

          const videoUrl = process.env.VIDEO_URL;
          const sites = [
            {name:'Braw', urls:['https://braw.ie/#']},
            {name:'SnapTik.vn', urls:['https://snaptik.vn/']},
            {name:'SnapTik.com.pl', urls:['https://snaptik.com.pl/vi/']},
            {name:'TDown', urls:['https://tdown.app/','https://www.tdown.app/']}
          ];

          const isMediaUrl=(url,ct='')=>{
            const s=(url+' '+ct).toLowerCase();
            return /tiktokcdn|muscdn|byteoversea|byteintl|ibytedtos|video\/mp4|application\/octet-stream|\.mp4(?:\?|$)|playaddr|downloadaddr/.test(s);
          };
          const downloadText=(text='')=>/download|tải|mp4|hd|without watermark|không logo|no watermark/i.test(text);

          async function firstVisible(locator){
            const n=await locator.count();
            for(let i=0;i<n;i++){
              const el=locator.nth(i);
              try{ if(await el.isVisible()) return el; }catch{}
            }
            return null;
          }

          async function probeUrl(url,referer){
            const controller=new AbortController();
            const timeout=setTimeout(()=>controller.abort(),12000);
            const started=Date.now();
            try{
              const r=await fetch(url,{
                headers:{
                  'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
                  'range':'bytes=0-1048575',
                  'accept':'*/*',
                  'referer':referer
                },
                redirect:'follow',
                signal:controller.signal
              });
              const ttfb=Date.now()-started;
              const ab=await r.arrayBuffer();
              const total=Date.now()-started;
              const ct=r.headers.get('content-type')||'';
              return {
                ok:(r.ok||r.status===206) && (/video|octet-stream/i.test(ct)||isMediaUrl(r.url,ct)),
                status:r.status,ttfbMs:ttfb,totalMs:total,bytes:ab.byteLength,
                mbps:total?Number(((ab.byteLength*8/1e6)/(total/1000)).toFixed(2)):0,
                contentType:ct,finalUrl:r.url
              };
            }catch(e){
              return {ok:false,error:String(e?.message||e),totalMs:Date.now()-started};
            }finally{clearTimeout(timeout)}
          }

          const browser=await chromium.launch({headless:true});
          const results=[];

          for(const site of sites){
            const row={name:site.name,url:'',loadMs:null,submitMs:null,status:'',downloadHref:'',probe:null,error:'',inputs:[],api:[]};
            let page=null,context=null;
            try{
              context=await browser.newContext({
                acceptDownloads:true,
                userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36'
              });
              page=await context.newPage();

              let loaded=false;
              for(const candidate of site.urls){
                const t0=Date.now();
                try{
                  await page.goto(candidate,{waitUntil:'domcontentloaded',timeout:25000});
                  row.url=page.url();
                  row.loadMs=Date.now()-t0;
                  loaded=true;break;
                }catch(e){
                  row.error=String(e?.message||e);
                }
              }
              if(!loaded)throw new Error(row.error||'site_unreachable');

              const inputInfo=await page.locator('input,textarea').evaluateAll(els=>els.map(el=>({
                tag:el.tagName,type:el.getAttribute('type')||'',name:el.getAttribute('name')||'',
                placeholder:el.getAttribute('placeholder')||'',id:el.id||''
              })));
              row.inputs=inputInfo.slice(0,12);

              const baseline=new Set(await page.locator('a[href]').evaluateAll(els=>els.map(a=>a.href)));

              let input=await firstVisible(page.locator('input[type="search"],input[type="text"],input[type="url"],input:not([type]),textarea'));
              if(!input) throw new Error('no_visible_input');
              await input.fill(videoUrl);

              const activity=[];
              let submitAt=0;
              page.on('response', async res=>{
                if(!submitAt)return;
                const rt=res.request().resourceType();
                const ct=(await res.allHeaders().catch(()=>({})))['content-type']||'';
                if(['xhr','fetch','document'].includes(rt)||isMediaUrl(res.url(),ct)){
                  const item={ms:Date.now()-submitAt,type:rt,status:res.status(),url:res.url(),ct};
                  if(['xhr','fetch'].includes(rt)&&/json|text|javascript|html/i.test(ct)){
                    try{item.body=(await res.text()).slice(0,700).replace(/\s+/g,' ')}catch{}
                  }
                  activity.push(item);
                }
              });

              let button=null;
              const form=input.locator('xpath=ancestor::form[1]');
              if(await form.count()){
                button=await firstVisible(form.locator('button[type="submit"],input[type="submit"],button'));
              }
              if(!button){
                for(const label of [/tải xuống/i,/download/i,/tải/i,/get/i,/submit/i,/start/i]){
                  button=await firstVisible(page.getByRole('button',{name:label}));
                  if(button)break;
                }
              }

              submitAt=Date.now();
              if(button) await button.click({timeout:5000});
              else await input.press('Enter');

              let href='';
              const deadline=Date.now()+30000;
              while(Date.now()<deadline){
                await page.waitForTimeout(200);

                const mediaActivity=activity.find(x=>isMediaUrl(x.url,x.ct));
                if(mediaActivity){href=mediaActivity.url;break;}

                const anchors=await page.locator('a[href]').evaluateAll(els=>els.map(a=>({
                  href:a.href,text:(a.textContent||'').trim().replace(/\s+/g,' ').slice(0,160)
                })));
                const fresh=anchors.filter(a=>!baseline.has(a.href)&&!a.href.startsWith('javascript:')&&!a.href.endsWith('#'));
                const best=fresh.find(a=>downloadText(a.text)&&!/(facebook|telegram|wa\.me|twitter|x\.com)/i.test(a.href))
                  || fresh.find(a=>isMediaUrl(a.href,''));
                if(best){href=best.href;break;}

                // Some SPAs replace an existing placeholder href in-place.
                const visibleDownload=[];
                for(const a of anchors){
                  if(downloadText(a.text)&&a.href&&!a.href.endsWith('#')&&!/(blog|facebook|telegram|wa\.me)/i.test(a.href)){
                    visibleDownload.push(a);
                  }
                }
                const candidate=visibleDownload.find(a=>!baseline.has(a.href)||isMediaUrl(a.href,''));
                if(candidate){href=candidate.href;break;}
              }

              row.submitMs=Date.now()-submitAt;
              row.api=activity.slice(0,20);
              row.downloadHref=href;
              if(!href){
                row.status='no_result';
              }else{
                row.probe=await probeUrl(href,row.url);
                row.status=row.probe?.ok?'direct_media_ok':'result_not_direct_media';
              }
            }catch(e){
              row.status='error';
              row.error=String(e?.message||e);
            }finally{
              try{await context?.close()}catch{}
            }
            results.push(row);
          }

          await browser.close();
          console.log('BENCH_RESULT '+JSON.stringify(results));
          JS
          node bench.mjs
