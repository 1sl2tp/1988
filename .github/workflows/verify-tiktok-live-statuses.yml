name: Verify TikTok LIVE status coverage

on:
  push:
    branches: [main]
    paths:
      - "backend/social-collector/server.mjs"
      - "tiktok-settings.html"
      - "tiktok-clean-demo.html"
      - "scripts/verify_tiktok_live_statuses.py"
      - ".github/workflows/verify-tiktok-live-statuses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exhaustive selected-channel LIVE coverage
        run: python3 scripts/verify_tiktok_live_statuses.py
