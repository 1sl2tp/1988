name: Verify TikTok LIVE status coverage
# test-one-live-and-five-vods 2026-10-04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tiktok-live-statuses.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exhaustive selected-channel LIVE coverage
        run: python3 scripts/verify_tiktok_live_statuses.py
