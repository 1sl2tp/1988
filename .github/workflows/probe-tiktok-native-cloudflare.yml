name: Probe TikTok Native Cloudflare

on:
  push:
    branches: [test-cobalt-tiktok-resolver]
    paths:
      - ".github/workflows/probe-tiktok-native-cloudflare.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe ttwid registration against exact VOD
        shell: bash
        run: |
          cat > /tmp/ttwid-probe.mjs <<'JS'
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0.0.0 Safari/537.36';
          const origin='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin?url='+encodeURIComponent('https://www.tiktok.com/@_phat_nguoi_yeu_thi_giai/video/7691708011651386645');
          const meta=await fetch(origin).then(r=>r.json());
          const preferred=meta?.data?.mediaModel?.preferredMuxed||{};
          const cdn=(preferred.urls||[]).find(u=>{
            try{
              const host=new URL(u).hostname.toLowerCase();
              return /webapp-prime|tiktokcdn|byteoversea|ibytedtos|muscdn/i.test(host);
            }catch{return false}
          })||'';
          if(!cdn) throw new Error('no_cdn_url');

          // Compare with the exact Cobalt-style anonymous @i/video request that
          // previously yielded a usable session on a normal server runtime.
          {
            const jar=new Map();
            let pageStatus=0,mediaStatus=0,ct='',bytes=0,range='',err='';
            try{
              const page=await fetch('https://www.tiktok.com/@i/video/7691708011651386645',{
                headers:{
                  'user-agent':ua,
                  'accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
                  'accept-language':'vi-VN,vi;q=0.9,en-US;q=0.7,en;q=0.5'
                },
                redirect:'follow'
              });
              pageStatus=page.status;
              for(const [k,v] of cookiePairs(page.headers))jar.set(k,v);
              try{await page.body?.cancel?.()}catch{}
              if(jar.size){
                const r=await fetch(cdn,{
                  headers:{
                    'user-agent':ua,
                    'referer':'https://www.tiktok.com/',
                    'cookie':jarHeader(jar),
                    'range':'bytes=0-1048575',
                    'accept':'video/*,*/*'
                  },
                  redirect:'follow'
                });
                mediaStatus=r.status;
                ct=r.headers.get('content-type')||'';
                range=r.headers.get('content-range')||'';
                bytes=(await r.arrayBuffer()).byteLength;
              }
            }catch(e){err=String(e?.message||e)}
            console.log(JSON.stringify({
              name:'cobalt-anonymous-i-video',
              pageStatus,
              cookieCount:jar.size,
              cookieNames:[...jar.keys()].sort(),
              mediaStatus,
              contentType:ct,
              contentRange:range,
              bytes,
              error:err
            }));
          }

          const variants=[
            {
              name:'bytedance-tiktok-va',
              endpoint:'https://ttwid.bytedance.com/ttwid/union/register/',
              body:{region:'va',aid:1768,needFid:false,service:'www.tiktok.com',migrate_info:{ticket:'',source:'node'},cbUrlProtocol:'https',union:true}
            },
            {
              name:'bytedance-ixigua-cn',
              endpoint:'https://ttwid.bytedance.com/ttwid/union/register/',
              body:{region:'cn',aid:1768,needFid:false,service:'www.ixigua.com',migrate_info:{ticket:'',source:'node'},cbUrlProtocol:'https',union:true}
            },
            {
              name:'tiktok-register',
              endpoint:'https://www.tiktok.com/ttwid/union/register/',
              body:{region:'va',aid:1768,needFid:false,service:'www.tiktok.com',migrate_info:{ticket:'',source:'node'},cbUrlProtocol:'https',union:true}
            }
          ];

          function setCookies(headers){
            try{
              if(typeof headers.getSetCookie==='function')return headers.getSetCookie();
            }catch{}
            const raw=headers.get('set-cookie')||'';
            return raw?[raw]:[];
          }
          function ttwidFrom(headers){
            for(const raw of setCookies(headers)){
              const m=String(raw).match(/(?:^|[,;]\s*)ttwid=([^;]+)/i);
              if(m)return 'ttwid='+m[1];
            }
            return '';
          }

          function cookiePairs(headers){
            const out=[];
            for(const raw of setCookies(headers)){
              for(const part of String(raw||'').split(/,(?=[^;,]+=)/g)){
                const pair=String(part||'').split(';')[0].trim();
                const i=pair.indexOf('=');
                if(i>0)out.push([pair.slice(0,i).trim(),pair.slice(i+1).trim()]);
              }
            }
            return out;
          }
          function jarHeader(jar){
            return [...jar.entries()].map(([k,v])=>k+'='+v).join('; ');
          }
          async function feedCookieJar(jar,url){
            const r=await fetch(url,{
              headers:{
                'user-agent':ua,
                'accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
                'accept-language':'vi-VN,vi;q=0.9,en-US;q=0.7,en;q=0.5',
                'referer':'https://www.tiktok.com/',
                ...(jar.size?{'cookie':jarHeader(jar)}:{})
              },
              redirect:'follow'
            });
            for(const [k,v] of cookiePairs(r.headers))jar.set(k,v);
            try{await r.body?.cancel?.()}catch{}
            return r.status;
          }

          for(const v of variants){
            let status=0,cookie='',err='';
            try{
              const r=await fetch(v.endpoint,{
                method:'POST',
                headers:{
                  'user-agent':ua,
                  'accept':'application/json,text/plain,*/*',
                  'content-type':'application/json',
                  'referer':'https://www.tiktok.com/',
                  'origin':'https://www.tiktok.com'
                },
                body:JSON.stringify(v.body),
                redirect:'follow'
              });
              status=r.status;
              cookie=ttwidFrom(r.headers);
              try{await r.body?.cancel?.()}catch{}
            }catch(e){err=String(e?.message||e)}
            let mediaStatus=0,ct='',bytes=0,range='',cookieCount=0,cookieNames=[];
            if(cookie){
              try{
                const jar=new Map();
                const ci=cookie.indexOf('=');
                if(ci>0)jar.set(cookie.slice(0,ci),cookie.slice(ci+1));
                await feedCookieJar(jar,'https://www.tiktok.com/');
                await feedCookieJar(jar,'https://www.tiktok.com/@i/video/7691708011651386645');
                await feedCookieJar(jar,'https://www.tiktok.com/@_phat_nguoi_yeu_thi_giai/video/7691708011651386645');
                cookieCount=jar.size;
                cookieNames=[...jar.keys()].sort();

                const r=await fetch(cdn,{
                  headers:{
                    'user-agent':ua,
                    'referer':'https://www.tiktok.com/',
                    'cookie':jarHeader(jar),
                    'range':'bytes=0-1048575',
                    'accept':'video/*,*/*'
                  },
                  redirect:'follow'
                });
                mediaStatus=r.status;
                ct=r.headers.get('content-type')||'';
                range=r.headers.get('content-range')||'';
                const b=await r.arrayBuffer();
                bytes=b.byteLength;
              }catch(e){err+=(err?';':'')+String(e?.message||e)}
            }
            console.log(JSON.stringify({
              name:v.name,
              registerStatus:status,
              hasTtwid:Boolean(cookie),
              ttwidLength:cookie.length,
              cookieCount,
              cookieNames,
              mediaStatus,
              contentType:ct,
              contentRange:range,
              bytes,
              error:err
            }));
          }
          JS
          node /tmp/ttwid-probe.mjs

      - name: Probe exact VOD after TikTok gateway relay
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40_phat_nguoi_yeu_thi_giai%2Fvideo%2F7691708011651386645'
          echo '---ORIGIN---'
          curl -sS --max-time 30 "$ORIGIN" | tee /tmp/origin.json
          echo
          URL='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-stream?user=_phat_nguoi_yeu_thi_giai&id=7691708011651386645&source=auto'
          curl -sS -L --max-time 30 -D /tmp/h -H 'Range: bytes=0-1048575' -o /tmp/b "$URL" || true
          echo '---HEADERS---'
          cat /tmp/h
          echo '---BYTES---'
          wc -c /tmp/b || true
          echo '---FILE---'
          file /tmp/b || true
          echo '---BODY---'
          cat /tmp/b || true
