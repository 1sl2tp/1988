name: Verify TikTok direct video proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify browser playback
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS https://yt.taphoa.xyz/tiktok-mask-proof.html -o page.html || true
            grep -q 'Không fetch media' page.html && break
            sleep 3
          done
          grep -q 'Không fetch media' page.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu             --autoplay-policy=no-user-gesture-required             --virtual-time-budget=12000             --dump-dom https://yt.taphoa.xyz/tiktok-mask-proof.html > dom.html 2>chrome.err || true
          echo '--- status ---'
          grep -o '<div class="status[^>]*>[^<]*' dom.html | tail -1 || true
          echo '--- info ---'
          grep -Eo 'mode = [^<]*|role = [^<]*|codec = [^<]*|size = [^<]*' dom.html | head -8 || true
          echo '--- errors ---'
          grep -Eo 'Resolver lỗi:[^<]*|Media URL này chưa phát được[^<]*' dom.html || true
