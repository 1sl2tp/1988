name: Verify TikTok origin Range proxy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify origin relay and Chrome playback
        shell: bash
        run: |
          set -euo pipefail
          EDGE='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev'
          RES="$EDGE/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40geely.daily%2Fvideo%2F7689814919914458374"
          curl -fsS "$RES" -o model.json
          GATEWAY=$(python3 - <<'PY'
          import json
          x=json.load(open('model.json'))
          p=((x.get('data') or {}).get('mediaModel') or {}).get('preferredMuxed') or {}
          print(next((u for u in (p.get('urls') or []) if 'www.tiktok.com/aweme/v1/play/' in u),''))
          PY
          )
          test -n "$GATEWAY"
          PROXY="$EDGE/tiktok/video-origin-stream?url=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$GATEWAY")"

          echo '--- relay headers ---'
          curl -sS --max-time 20 -r 0-4095 -o /dev/null -D - "$PROXY" | grep -Ei '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:|access-control-allow-origin:|x-1988-media:)' || true

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          python3 - "$PROXY" <<'PY'
          import sys,html
          u=html.escape(sys.argv[1],quote=True)
          open('test.html','w').write(f"""<!doctype html><meta charset=utf-8>
          <div id=s>start</div>
          <video id=v muted autoplay playsinline preload=metadata src="{u}"></video>
          <script>
          v.onloadedmetadata=()=>s.textContent='VIDEO_OK '+v.videoWidth+'x'+v.videoHeight+' dur='+v.duration;
          v.onerror=()=>s.textContent='VIDEO_ERR '+(v.error&&v.error.code);
          setTimeout(()=>document.body.dataset.final=s.textContent,8000);
          </script>""")
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/test.html > dom.html 2>/dev/null || true
          grep -o '<div id="s">[^<]*' dom.html || true
          grep -o 'data-final="[^"]*"' dom.html || true
