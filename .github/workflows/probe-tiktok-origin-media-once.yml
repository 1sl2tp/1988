name: Diagnose TikTok origin proxy CDN

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print proxy CDN failure
        shell: bash
        run: |
          set -euo pipefail
          EDGE='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev'
          RES="$EDGE/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40geely.daily%2Fvideo%2F7689814919914458374"
          curl -fsS "$RES" -o model.json
          GATEWAY=$(python3 - <<'PY'
          import json
          x=json.load(open('model.json'))
          p=((x.get('data') or {}).get('mediaModel') or {}).get('preferredMuxed') or {}
          urls=p.get('urls') or []
          print(next((u for u in urls if 'www.tiktok.com/aweme/v1/play/' in u),''))
          PY
          )
          test -n "$GATEWAY"
          PROXY="$EDGE/tiktok/video-origin-stream?url=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$GATEWAY")"
          echo '=== PROXY RESPONSE ==='
          curl -sS --max-time 20 -r 0-4095 -D /tmp/h.txt "$PROXY" -o /tmp/b.bin || true
          cat /tmp/h.txt
          echo '--- body ---'
          cat /tmp/b.bin
          echo
