name: Probe TikTok session link once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Render session resolver
        shell: bash
        run: |
          set -euo pipefail
          POST='https://www.tiktok.com/@geely.daily/video/7689814919914458374?is_from_webapp=1&sender_device=pc&web_id=7670812910123369992'
          ENC="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://www.tiktok.com/@geely.daily/video/7689814919914458374?is_from_webapp=1&sender_device=pc&web_id=7670812910123369992", safe=""))')"
          URL="https://one988-tiktok-session.onrender.com/tiktok/video-session-link?url=$ENC"
          curl -fsSL "$URL" -o /tmp/session.json
          cat /tmp/session.json
          python3 - <<'PY'
          import json,sys
          j=json.load(open('/tmp/session.json'))
          d=j.get('data') or {}
          assert j.get('ok') is True, j
          assert d.get('mediaViaRender') is False, d
          assert d.get('proxyVideo') is False, d
          assert d.get('supabaseWrites') == 0, d
          assert '/aweme/v1/play/' in d.get('directUrl',''), d
          print('CHECK', d.get('source'), d.get('codec'), d.get('status'), d.get('redirectHost'), d.get('session'))
          print('DIRECT', d.get('directUrl'))
          PY
