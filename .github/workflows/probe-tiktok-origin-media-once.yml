name: Probe TikTok Render session origin

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Render session Range relay
        shell: bash
        run: |
          set -euo pipefail
          EDGE='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev'
          RENDER='https://one988-tiktok-session.onrender.com'
          RES="$EDGE/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40geely.daily%2Fvideo%2F7689814919914458374"
          curl -fsS "$RES" -o model.json
          GATEWAY=$(python3 - <<'PY'
          import json
          x=json.load(open('model.json'))
          p=((x.get('data') or {}).get('mediaModel') or {}).get('preferredMuxed') or {}
          urls=p.get('urls') or []
          print(next((u for u in urls if 'www.tiktok.com/aweme/v1/play/' in u),''))
          PY
          )
          test -n "$GATEWAY"
          PROXY="$RENDER/tiktok/video-session-stream?url=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$GATEWAY")"

          echo '=== RANGE ==='
          curl -sS --max-time 25 -r 0-4095 -D /tmp/h.txt "$PROXY" -o /tmp/b.bin || true
          cat /tmp/h.txt
          echo "bytes=$(wc -c </tmp/b.bin)"
          file /tmp/b.bin || true
          if grep -qi 'content-type: application/json' /tmp/h.txt; then cat /tmp/b.bin; echo; fi

          echo '=== CHROME ==='
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          python3 - "$PROXY" <<'PY'
          import sys,html
          u=html.escape(sys.argv[1],quote=True)
          open('test.html','w').write(f"""<!doctype html><meta charset=utf-8>
          <body><div id=s>start</div>
          <video id=v muted autoplay playsinline preload=metadata src="{u}"></video>
          <script>
          const s=document.getElementById('s'),v=document.getElementById('v');
          v.onloadedmetadata=()=>s.textContent='VIDEO_OK '+v.videoWidth+'x'+v.videoHeight+' dur='+v.duration;
          v.onerror=()=>s.textContent='VIDEO_ERR code='+(v.error&&v.error.code)+' network='+v.networkState+' ready='+v.readyState;
          setTimeout(()=>document.body.dataset.final=s.textContent,10000);
          </script>""")
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu             --autoplay-policy=no-user-gesture-required             --virtual-time-budget=12000             --dump-dom http://127.0.0.1:8765/test.html > dom.html 2>chrome.err || true
          grep -o '<div id="s">[^<]*' dom.html || true
          grep -o 'data-final="[^"]*"' dom.html || true
