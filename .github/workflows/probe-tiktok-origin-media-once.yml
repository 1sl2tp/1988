name: Probe TikTok direct media element

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test direct video and iframe
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          RES='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40geely.daily%2Fvideo%2F7689814919914458374'
          curl -fsS "$RES" -o model.json
          GATEWAY=$(python3 - <<'PY'
          import json
          x=json.load(open('model.json'))
          m=(x.get('data') or {}).get('mediaModel') or {}
          p=m.get('preferredMuxed') or {}
          urls=p.get('urls') or []
          print(next((u for u in urls if 'www.tiktok.com/aweme/v1/play/' in u),''))
          PY
          )
          test -n "$GATEWAY"
          python3 - "$GATEWAY" <<'PY'
          import sys,html
          u=html.escape(sys.argv[1],quote=True)
          open('test.html','w').write(f"""<!doctype html><meta charset=utf-8>
          <body><div id=s>start</div>
          <video id=v referrerpolicy=no-referrer muted autoplay playsinline preload=metadata src="{u}"></video>
          <iframe id=f referrerpolicy=no-referrer src="{u}"></iframe>
          <script>
          const s=document.getElementById('s'),v=document.getElementById('v'),f=document.getElementById('f');
          v.onloadedmetadata=()=>s.textContent='VIDEO_OK '+v.videoWidth+'x'+v.videoHeight+' dur='+v.duration+' src='+v.currentSrc;
          v.onerror=()=>s.textContent='VIDEO_ERR code='+(v.error&&v.error.code)+' src='+v.currentSrc;
          f.onload=()=>{{document.body.dataset.iframe='loaded';}};
          setTimeout(()=>{{document.body.dataset.final=s.textContent;}},8000);
          </script>""")
          PY
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          HPID=$!
          trap 'kill $HPID || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu             --autoplay-policy=no-user-gesture-required             --virtual-time-budget=10000             --dump-dom http://127.0.0.1:8765/test.html > dom.html 2>chrome.err || true
          grep -o '<div id="s">[^<]*' dom.html || true
          grep -o 'data-iframe="[^"]*"' dom.html || true
          grep -o 'data-final="[^"]*"' dom.html || true
          tail -20 chrome.err || true
