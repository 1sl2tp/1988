name: Probe TikTok media model once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe media model
        shell: bash
        run: |
          set -euo pipefail
          URL='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin?url=https%3A%2F%2Fwww.tiktok.com%2F%40geely.daily%2Fvideo%2F7689814919914458374'
          curl -fsS "$URL" -o out.json
          python3 - <<'PY'
          import json
          x=json.load(open('out.json'))
          d=x.get('data') or {}
          m=d.get('mediaModel') or {}
          print(json.dumps({
            'ok':x.get('ok'),
            'apiStatus':d.get('apiStatus'),
            'pageStatus':d.get('pageStatus'),
            'preferredMuxed':m.get('preferredMuxed'),
            'preferredDash':m.get('preferredDash'),
            'audioTracks':m.get('audioTracks'),
            'variantCount':len(m.get('variants') or []),
            'variants':(m.get('variants') or [])[:8]
          },ensure_ascii=False,indent=2))
          PY
