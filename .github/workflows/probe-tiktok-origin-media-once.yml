name: Probe TikTok video track once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-origin-media-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe streams
        shell: bash
        env:
          URL: 'https://www.tiktok.com/aweme/v1/play/?faid=1988&file_id=9aeca68ed6784c149898d7b6683a320e&is_play_url=1&item_id=7689814919914458374&line=0&ply_type=2&pt=dGlrdG9rLndlYmFyY2guZ2F0ZXdheSYvQGdlZWx5LmRhaWx5L3ZpZGVvLzc2ODk4MTQ5MTk5MTQ0NTgzNzQmMjAyNjEwMDIwNzA3MjY5QjIwMDk3QkZFQkQzNUU4MkE4NyYxNzkwOTI0ODQ2JmI1MWYyZDZmNGU4Yg&signaturev3=dmlkZW9faWQ7ZmlsZV9pZDtpdGVtX2lkLjE1OWE2ODgxOWY5Yzk0MjBmMzcwZGI2ODlmOTNmYmVh&tk=tt_chain_token&video_id=v14044g50000darrbjfog65n1cp4n2j0'
        run: |
          set -euo pipefail
          ffprobe -v error             -user_agent 'Mozilla/5.0'             -headers $'Referer: https://www.tiktok.com/\r\n'             -show_entries stream=index,codec_type,codec_name,codec_tag_string,width,height,sample_rate,channels             -of json "$URL"
