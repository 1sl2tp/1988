name: Probe Resolver APIs

on:
  push:
    branches:
      - probe/cobalt-resolvers-20260923

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check resolved MP3 response headers
        shell: bash
        run: |
          set +e
          U='https://ricky4.savenow.to/api/v2/download/5kjuq0AjyDcYy2yPXOTptzgvSJ7fOQU39AEDhRR2wod1ndhE'
          echo '=== HEAD ==='
          curl -sS -I -L --connect-timeout 4 --max-time 15 -A 'Mozilla/5.0' "$U" | tr -d '\r' |             grep -iE '^(HTTP/|content-type:|content-length:|content-disposition:|accept-ranges:|access-control-allow-origin:|cache-control:)'
          echo '=== 1s GET ==='
          curl -sS -L --connect-timeout 4 --max-time 1 -A 'Mozilla/5.0' "$U" -o /tmp/a.bin
          echo "size=$(wc -c < /tmp/a.bin)"
          file /tmp/a.bin
          xxd -l 32 /tmp/a.bin
