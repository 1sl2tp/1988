name: Probe Resolver APIs

on:
  push:
    branches:
      - probe/cobalt-resolvers-20260923

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production Supabase audio resolver
        shell: bash
        run: |
          set -e
          U='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988?action=audio_resolve&id=vhUjvanyu2U'
          OUT=$(mktemp)
          META=$(curl -sS -L --connect-timeout 4 --max-time 40 -o "$OUT" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}' "$U")
          echo "$META"
          cat "$OUT"; echo
          MP3=$(jq -r '.data.url // empty' "$OUT")
          MIME=$(jq -r '.data.mimeType // empty' "$OUT")
          ENGINE=$(jq -r '.data.engine // empty' "$OUT")
          [ -n "$MP3" ] || exit 1
          echo "ENGINE=$ENGINE MIME=$MIME"
          echo "=== FINAL HEAD ==="
          curl -sS -I -L --connect-timeout 4 --max-time 15 -A 'Mozilla/5.0' "$MP3" | tr -d '\r' |             grep -iE '^(HTTP/|content-type:|content-disposition:|access-control-allow-origin:|cache-control:)'
