name: Probe Resolver APIs

on:
  push:
    branches:
      - probe/cobalt-resolvers-20260923

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe active third-party YouTube resolvers
        shell: bash
        run: |
          set +e
          SRC='https://www.youtube.com/watch?v=vhUjvanyu2U'
          ENC='https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DvhUjvanyu2U'

          declare -A APIS
          APIS[akuari]="https://api.akuari.my.id/downloader/youtube?link=$ENC"
          APIS[nexray]="https://api.nexray.eu.cc/downloader/v1/ytmp3?url=$ENC"
          APIS[fabdl]="https://api.fabdl.com/youtube/get?url=$ENC"
          APIS[nyxs]="https://api.nyxs.pw/dl/yt-direct?url=$ENC"
          APIS[ryzendesu]="https://api.ryzendesu.vip/api/downloader/ytdl?url=$ENC"
          APIS[akane]="https://api.akane.web.id/api/downloader/youtube?url=$ENC&type=audio&quality=128"
          APIS[delirius]="https://deliriussapi-oficial.vercel.app/download/ytmp4?url=$ENC"
          APIS[loader]="https://loader.to/ajax/download.php?format=mp3&url=$ENC"

          probe_api(){
            NAME="$1"; U="$2"
            OUT=$(mktemp)
            META=$(curl -sS -L --connect-timeout 3 --max-time 18 -A 'Mozilla/5.0' -o "$OUT" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}' "$U")
            echo "=== $NAME ==="
            echo "API $META"
            head -c 1800 "$OUT"; echo
            if jq -e . "$OUT" >/dev/null 2>&1; then
              jq -r '.. | strings | select(test("^https?://"))' "$OUT" 2>/dev/null | awk '!seen[$0]++' | head -8 > "/tmp/$NAME.urls"
            else
              : > "/tmp/$NAME.urls"
            fi
            n=0
            while read -r M; do
              n=$((n+1))
              HDR=$(mktemp); BIN=$(mktemp)
              curl -sS -L --connect-timeout 3 --max-time 12 -A 'Mozilla/5.0' -H 'Range: bytes=0-4095' -D "$HDR" -o "$BIN" "$M"
              CODE=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$HDR")
              TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
              SIZE=$(wc -c < "$BIN")
              FILE=$(file -b "$BIN" 2>/dev/null)
              CORS=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
              CRANGE=$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r",""); print $2" "$3}' "$HDR" | tail -1)
              echo "URL#$n HTTP=$CODE TYPE=$TYPE SIZE=$SIZE CORS=$CORS CRANGE=$CRANGE FILE=$FILE URL=$M"
              rm -f "$HDR" "$BIN"
            done < "/tmp/$NAME.urls"
            rm -f "$OUT"
          }

          export -f probe_api
          for NAME in "${!APIS[@]}"; do probe_api "$NAME" "${APIS[$NAME]}" & done
          wait
