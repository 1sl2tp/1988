name: Probe Cobalt Resolvers

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Cobalt resolver instances
        shell: bash
        run: |
          set +e
          ID='vhUjvanyu2U'
          SRC="https://www.youtube.com/watch?v=$ID"
          curl -sS -L --connect-timeout 4 --max-time 15 'https://instances.cobalt.best/api/instances.json' -o /tmp/cobalt.json
          echo '=== SAMPLE INSTANCE DATA ==='
          jq '.[0:5]' /tmp/cobalt.json
          echo '=== CANDIDATES ==='
          jq -r '
            .[] |
            select((.online // true) == true) |
            select((.services.youtube // .youtube // "") != "" or ((.services // []) | type == "array" and index("youtube"))) |
            (.api // .url // .uri // empty)
          ' /tmp/cobalt.json | sed '/^$/d' | head -20 > /tmp/apis.txt
          cat /tmp/apis.txt

          probe_one(){
            API="$1"
            API="${API%/}"
            OUT=$(mktemp)
            BODY=$(jq -nc --arg url "$SRC" '{url:$url,downloadMode:"auto",videoQuality:"360",youtubeVideoCodec:"h264",youtubeVideoContainer:"mp4",alwaysProxy:true,disableMetadata:true}')
            META=$(curl -sS -L --connect-timeout 4 --max-time 20 -X POST "$API/"               -H 'Accept: application/json' -H 'Content-Type: application/json'               --data "$BODY" -o "$OUT" -w 'HTTP=%{http_code} SIZE=%{size_download}')
            STATUS=$(jq -r '.status // ""' "$OUT" 2>/dev/null)
            URL=$(jq -r '.url // (.tunnel[0] // "")' "$OUT" 2>/dev/null)
            ERR=$(jq -r '.error.code // ""' "$OUT" 2>/dev/null)
            if [ -n "$URL" ]; then
              HDR=$(mktemp); BIN=$(mktemp)
              curl -sS -L --connect-timeout 4 --max-time 15 -H 'Range: bytes=0-2047' -D "$HDR" -o "$BIN" "$URL"
              CODE=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$HDR")
              TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
              SIZE=$(wc -c < "$BIN")
              FILE=$(file -b "$BIN" 2>/dev/null)
              echo "OK|$API|$META|STATUS=$STATUS|MEDIA_HTTP=$CODE|TYPE=$TYPE|SIZE=$SIZE|FILE=$FILE|URL=$URL"
              rm -f "$HDR" "$BIN"
            else
              echo "MISS|$API|$META|STATUS=$STATUS|ERR=$ERR|RESP=$(tr '\n' ' ' < "$OUT" | head -c 350)"
            fi
            rm -f "$OUT"
          }
          export -f probe_one
          export SRC
          while read -r API; do probe_one "$API" & done < /tmp/apis.txt
          wait
