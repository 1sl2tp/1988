name: Probe Resolver APIs

on:
  push:
    branches:
      - probe/cobalt-resolvers-20260923

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test OmegaTech returned media links
        shell: bash
        run: |
          set +e
          U='https://omegatech-api.dixonomega.tech/downloader/all?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DvhUjvanyu2U'
          OUT=$(mktemp)
          META=$(curl -sS -L --connect-timeout 4 --max-time 30 -o "$OUT" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}' "$U")
          echo "$META"
          cat "$OUT"
          echo
          jq -r '.. | objects | .url? // empty' "$OUT" | sed '/^$/d' | head -30 > /tmp/urls.txt
          echo '=== URLS ==='
          cat /tmp/urls.txt
          i=0
          while read -r M; do
            i=$((i+1))
            HDR=$(mktemp)
            BIN=$(mktemp)
            curl -sS -L --connect-timeout 4 --max-time 20 -H 'Range: bytes=0-4095' -D "$HDR" -o "$BIN" "$M"
            CODE=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$HDR")
            TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
            SIZE=$(wc -c < "$BIN")
            FILE=$(file -b "$BIN" 2>/dev/null)
            CORS=$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
            RANGE=$(awk 'BEGIN{IGNORECASE=1} /^accept-ranges:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
            echo "MEDIA#$i|HTTP=$CODE|TYPE=$TYPE|SIZE=$SIZE|CORS=$CORS|RANGE=$RANGE|FILE=$FILE|URL=$M"
            rm -f "$HDR" "$BIN"
          done < /tmp/urls.txt
