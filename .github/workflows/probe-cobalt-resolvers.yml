name: Probe Resolver APIs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe OmegaTech YouTube actions
        shell: bash
        run: |
          set +e
          BASE='https://omegatech-api.dixonomega.tech/api/download/youtube'
          SRC='https://www.youtube.com/watch?v=vhUjvanyu2U'
          ID='vhUjvanyu2U'

          probe(){
            U="$1"
            OUT=$(mktemp)
            META=$(curl -sS -L --connect-timeout 4 --max-time 30 -o "$OUT" -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}' "$U")
            echo "$META|$U|RESP=$(tr '\n' ' ' < "$OUT" | head -c 1000)"
            rm -f "$OUT"
          }

          for A in info download direct mp3 audio convert get; do
            probe "$BASE?action=$A&url=$SRC"
            probe "$BASE?action=$A&id=$ID"
            probe "$BASE?action=$A&url=$SRC&format=audio"
            probe "$BASE?action=$A&url=$SRC&format=mp3"
          done
