name: Lab Rootless WARP v7 + Piped

on:
  push:
    branches:
      - lab/warproxy-piped-render-20260923

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Start Mon-ius WARP v7 without privileges
        shell: bash
        run: |
          set -euxo pipefail
          docker run -d --name warp-socks             -p 9091:9091             ghcr.io/mon-ius/docker-warp-socks:latest

          docker inspect warp-socks --format 'Privileged={{.HostConfig.Privileged}} CapAdd={{json .HostConfig.CapAdd}} Devices={{json .HostConfig.Devices}}'

          for i in $(seq 1 60); do
            TRACE=$(curl -sS --max-time 5 -x socks5h://127.0.0.1:9091               https://www.cloudflare.com/cdn-cgi/trace || true)
            echo "$TRACE"
            echo "$TRACE" | grep -qE '^warp=(on|plus)$' && break
            sleep 2
          done

          TRACE=$(curl -fsS --max-time 10 -x socks5h://127.0.0.1:9091             https://www.cloudflare.com/cdn-cgi/trace)
          echo "$TRACE"
          echo "$TRACE" | grep -qE '^warp=(on|plus)$'
          docker logs --tail=160 warp-socks

      - name: Start official Piped stack through rootless WARP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/piped-warp
          cat > /tmp/piped-warp/config.properties <<'CFG'
          PORT:8080
          HTTP_WORKERS:2
          PROXY_PART:http://proxy:8080
          REQWEST_PROXY:socks5://host.docker.internal:9091
          API_URL:http://127.0.0.1:8081
          FRONTEND_URL:http://127.0.0.1:8083
          COMPROMISED_PASSWORD_CHECK:false
          DISABLE_REGISTRATION:true
          FEED_RETENTION:1
          DISABLE_TIMERS:true
          RYD_PROXY_URL:https://ryd-proxy.kavin.rocks
          SPONSORBLOCK_SERVERS:https://sponsor.ajay.app
          DISABLE_RYD:true
          DISABLE_SERVER:false
          DISABLE_LBRY:true
          SUBSCRIPTIONS_EXPIRY:1
          CONSENT_COOKIE:true
          BG_HELPER_URL:http://bg-helper:3000
          hibernate.connection.url:jdbc:postgresql://postgres:5432/piped
          hibernate.connection.driver_class:org.postgresql.Driver
          hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
          hibernate.connection.username:piped
          hibernate.connection.password:changeme
          CFG

          cat > /tmp/piped-warp/docker-compose.yml <<'YML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_DB: piped
                POSTGRES_USER: piped
                POSTGRES_PASSWORD: changeme
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U piped"]
                interval: 2s
                timeout: 2s
                retries: 30

            bg-helper:
              image: 1337kavin/bg-helper-server:latest

            proxy:
              image: 1337kavin/piped-proxy:latest

            piped:
              image: 1337kavin/piped:latest
              depends_on:
                postgres:
                  condition: service_healthy
                bg-helper:
                  condition: service_started
                proxy:
                  condition: service_started
              ports:
                - "8081:8080"
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - /tmp/piped-warp/config.properties:/app/config.properties:ro
          YML

          cd /tmp/piped-warp
          docker compose up -d
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3               http://127.0.0.1:8081/config || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8081/config)" = "200"

      - name: Verify exact video via official Piped
        shell: bash
        run: |
          set -euxo pipefail
          ID='vhUjvanyu2U'
          OUT=/tmp/streams.json
          curl -fsS --max-time 60 "http://127.0.0.1:8081/streams/$ID" -o "$OUT"

          jq '{title,duration,hls,audioCount:((.audioStreams//[])|length),videoCount:((.videoStreams//[])|length),firstVideo:((.videoStreams//[])[0] | {mimeType,quality,format,videoOnly,bitrate,fps,width,height})}' "$OUT"

          AC=$(jq -r '(.audioStreams//[])|length' "$OUT")
          VC=$(jq -r '(.videoStreams//[])|length' "$OUT")
          HLS=$(jq -r '.hls // ""' "$OUT")
          test "$AC" -gt 0 -o "$VC" -gt 0 -o -n "$HLS"

          MUX=$(jq -r '[(.videoStreams//[])[] | select(.url!=null and .videoOnly==false)][0].url // ""' "$OUT")
          test -n "$MUX"
          echo 'ROOTLESS_WARP_PIPED_PASS'
