name: Verify 1988 Media Proxy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and contracts
        run: |
          node --check src/app.js
          node --check src/media-core.js
          python -m py_compile backend/ytdlp/server.py
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/backend-media-proxy.test.cjs
          node tests/docker-pot-runtime.test.cjs
