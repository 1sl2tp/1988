name: Build Social Collector Image

concurrency:
  group: social-collector-image-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/social-collector/**"
      - ".github/workflows/social-collector-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test LIVE state contracts
        run: |
          node backend/social-collector/tiktok-live-state-contract.test.cjs
          node backend/social-collector/youtube-live-state-contract.test.cjs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend/social-collector
          file: backend/social-collector/Dockerfile
          push: true
          tags: |
            ghcr.io/1sl2tp/1988-social-collector:latest
            ghcr.io/1sl2tp/1988-social-collector:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/1sl2tp/1988
            org.opencontainers.image.description=1988 TikTok session collector
          cache-from: type=gha
          cache-to: type=gha,mode=max
