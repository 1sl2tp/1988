name: Probe TikTok live-now count once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-live-now-count-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read edge live-now snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/live-now'
          req=urllib.request.Request(url,headers={'User-Agent':'1988-live-count-probe/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          items=data.get('items') or []
          print('CHECKED_AT',data.get('checkedAt'))
          print('SELECTED_TOTAL',data.get('total'))
          print('LIVE_COUNT',data.get('live'))
          print('ITEM_COUNT',len(items))
          print('HANDLES',','.join(str(x.get('handle') or '') for x in items))
          assert int(data.get('live') or 0)==len(items)
          PY
