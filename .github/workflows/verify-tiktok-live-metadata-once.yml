name: Verify TikTok LIVE metadata once v4
# one-live-five-videos probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tiktok-live-metadata-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Find one current LIVE and five videos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          EDGE='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev'
          RENDER='https://one988-tiktok-session.onrender.com'
          def get(url,timeout=30):
              req=urllib.request.Request(url,headers={'User-Agent':'1988-one-live-five-videos/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)

          state=get(EDGE+'/state?t='+str(int(time.time())),30)
          channels=state.get('channels') or {}
          live=[
              {'handle':h,'roomId':str((row or {}).get('roomId') or '')}
              for h,row in channels.items()
              if int((row or {}).get('status') or 0)==2
          ]
          live.sort(key=lambda x:x['handle'])
          print('CURRENT_LIVE_HANDLES',json.dumps(live,ensure_ascii=False))
          if not live:
              raise SystemExit('NO_CURRENT_LIVE_IN_CLOUD_STATE')

          chosen=None
          for row in live:
              h=row['handle']
              try:
                  videos=get(RENDER+'/tiktok/channel-videos?refresh=0&user='+urllib.parse.quote(h)+'&t='+str(int(time.time())),30)
              except Exception:
                  continue
              rows=videos.get('videos') or []
              if len(rows)>=5:
                  chosen=(row,videos)
                  break
          if not chosen:
              raise SystemExit('NO_LIVE_HANDLE_WITH_5_VIDEOS')

          row,videos=chosen
          h=row['handle']
          live_now=get(EDGE+'/tiktok/live-now?t='+str(int(time.time())),60)
          live_item=next((x for x in (live_now.get('items') or []) if str(x.get('handle') or '').lower()==h.lower()),None)
          print('CHOSEN_HANDLE',h)
          print('LIVE_ITEM',json.dumps({
              'handle':h,
              'roomId':row.get('roomId'),
              'inLiveNow':bool(live_item),
              'playable':bool((live_item or {}).get('playable')),
              'type':(live_item or {}).get('type'),
              'hasStreamUrl':bool((live_item or {}).get('streamUrl')),
              'hasHlsUrl':bool((live_item or {}).get('hlsUrl')),
              'sourceName':(live_item or {}).get('sourceName'),
              'title':(live_item or {}).get('title')
          },ensure_ascii=False))
          print('VIDEOS',json.dumps([
              {
                  'id':str(v.get('id') or ''),
                  'title':str(v.get('title') or '')[:100],
                  'pageUrl':str(v.get('pageUrl') or ''),
                  'duration':v.get('duration'),
                  'createTime':v.get('createTime')
              }
              for v in (videos.get('videos') or [])[:5]
          ],ensure_ascii=False))
          PY
