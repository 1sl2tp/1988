name: Verify TikTok LIVE metadata once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tiktok-live-metadata-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect current TikTok LIVE metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, re
          url='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/live-now?t=verify'
          req=urllib.request.Request(url,headers={'User-Agent':'1988-live-metadata-check/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=json.load(r)
          items=data.get('items') or []
          summary=[]
          for x in items:
              handle=str(x.get('handle') or '')
              title=str(x.get('title') or '')
              source=str(x.get('sourceName') or '')
              preview=str(x.get('preview') or x.get('cover') or '')
              avatar=str(x.get('avatar') or '')
              viewers=int(float(x.get('viewerCount') or 0))
              title_is_channel=False
              def norm(v):
                  v=str(v or '').lower().strip().lstrip('@')
                  v=re.sub(r'\blive\b|trực tiếp','',v)
                  v=re.sub(r'[^\w.]+','',v,flags=re.UNICODE)
                  return v
              if norm(title) and norm(title) in {norm(handle),norm(source)}:
                  title_is_channel=True
              summary.append({
                  'handle':handle,
                  'hasCover':bool(preview),
                  'hasAvatar':bool(avatar),
                  'viewers':viewers,
                  'title':title[:90],
                  'sourceName':source[:60],
                  'titleIsChannel':title_is_channel
              })
          out={
              'ok':True,
              'live':len(items),
              'withCover':sum(1 for x in summary if x['hasCover']),
              'withAvatar':sum(1 for x in summary if x['hasAvatar']),
              'withViewerCount':sum(1 for x in summary if x['viewers']>0),
              'badTitleEqualsChannel':sum(1 for x in summary if x['titleIsChannel']),
              'sample':summary[:12]
          }
          print(json.dumps(out,ensure_ascii=False))
          assert out['badTitleEqualsChannel']==0, out
          PY
