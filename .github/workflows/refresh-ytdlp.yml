name: Refresh yt-dlp

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check latest yt-dlp release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LATEST="$(python - <<'PY'
import json, urllib.request
with urllib.request.urlopen("https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest", timeout=30) as r:
    data=json.load(r)
print(data["tag_name"])
PY
          )"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          CURRENT="$(cat backend/ytdlp/YTDLP_LATEST.txt 2>/dev/null || true)"
          echo "current=$CURRENT"
          echo "latest=$LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            printf "%s\n" "$LATEST" > backend/ytdlp/YTDLP_LATEST.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify latest yt-dlp installs
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]"
          yt-dlp --version
          python -m py_compile backend/ytdlp/server.py
      - name: Commit refresh stamp
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ytdlp/YTDLP_LATEST.txt
          git commit -m "chore: refresh yt-dlp ${{ steps.version.outputs.latest }}"
          git push origin HEAD:main
