name: Verify repeated search

on:
  pull_request:
    paths:
      - 'src/app.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/verify-repeated-search.yml'

permissions:
  contents: read

jobs:
  repeated-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify two searches in one session
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/1988-http.log 2>&1 &
          SERVER_PID=$!

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup(){
            kill "$CHROME_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function main(){
            let targets=[];
            for(let i=0;i<40;i++){
              try{
                targets=await (await fetch('http://127.0.0.1:9222/json')).json();
                if(targets.length)break;
              }catch{}
              await sleep(250);
            }
            const target=targets.find(x=>x.type==='page');
            if(!target?.webSocketDebuggerUrl)throw new Error('no_cdp_target');

            const ws=new WebSocket(target.webSocketDebuggerUrl);
            let id=0;
            const pending=new Map();
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const msgId=++id;
              pending.set(msgId,{resolve,reject});
              ws.send(JSON.stringify({id:msgId,method,params}));
            });
            ws.onmessage=event=>{
              const msg=JSON.parse(event.data);
              if(msg.id&&pending.has(msg.id)){
                const p=pending.get(msg.id);
                pending.delete(msg.id);
                msg.error?p.reject(new Error(JSON.stringify(msg.error))):p.resolve(msg.result);
              }
            };
            await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
            await send('Runtime.enable');
            await send('Page.enable');
            await send('Page.navigate',{url:'http://127.0.0.1:4173/?repeat-search='+Date.now()});

            let ready=false;
            for(let i=0;i<60;i++){
              await sleep(250);
              const probe=await send('Runtime.evaluate',{
                expression:`Boolean(document.querySelector('#searchForm')&&document.querySelector('#queryInput')&&typeof state!=='undefined'&&typeof doSearch==='function')`,
                returnByValue:true
              });
              if(probe?.result?.value){ready=true;break;}
            }
            if(!ready)throw new Error('search_ui_not_ready');

            const result=await send('Runtime.evaluate',{
              expression:`(async()=>{
                const input=document.querySelector('#queryInput');
                const form=document.querySelector('#searchForm');
                const start=Number(state.searchSeq)||0;

                const submit=async(q)=>{
                  input.focus();
                  input.value=q;
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  form.requestSubmit();
                  await new Promise(r=>setTimeout(r,220));
                  return {
                    seq:Number(state.searchSeq)||0,
                    query:String(state.searchQuery||''),
                    value:String(input.value||'')
                  };
                };

                const first=await submit('ronaldo');
                const second=await submit('tin tức thể thao');

                // Also exercise the Enter + IME path twice. Search sequence must
                // continue increasing instead of retaining pending/composing state.
                const imeSubmit=async(q)=>{
                  input.focus();
                  input.dispatchEvent(new CompositionEvent('compositionstart',{bubbles:true,data:''}));
                  input.value=q;
                  input.dispatchEvent(new Event('input',{bubbles:true}));
                  input.dispatchEvent(new KeyboardEvent('keydown',{
                    key:'Enter',
                    code:'Enter',
                    keyCode:229,
                    bubbles:true,
                    cancelable:true,
                    isComposing:true
                  }));
                  input.dispatchEvent(new CompositionEvent('compositionend',{bubbles:true,data:q}));
                  await new Promise(r=>setTimeout(r,260));
                  return {
                    seq:Number(state.searchSeq)||0,
                    query:String(state.searchQuery||''),
                    value:String(input.value||'')
                  };
                };

                const third=await imeSubmit('reviewer');
                const fourth=await imeSubmit('tin công nghệ');

                return JSON.stringify({start,first,second,third,fourth});
              })()`,
              awaitPromise:true,
              returnByValue:true
            });

            const data=JSON.parse(result?.result?.value||'{}');
            console.log('REPEATED_SEARCH_STATE',JSON.stringify(data));

            if(data.first?.seq!==data.start+1||data.first?.query!=='ronaldo'){
              throw new Error('first_search_not_committed');
            }
            if(data.second?.seq!==data.start+2||data.second?.query!=='tin tức thể thao'){
              throw new Error('second_search_not_committed');
            }
            if(data.third?.seq!==data.start+3||data.third?.query!=='reviewer'){
              throw new Error('third_ime_search_not_committed');
            }
            if(data.fourth?.seq!==data.start+4||data.fourth?.query!=='tin công nghệ'){
              throw new Error('fourth_ime_search_not_committed');
            }

            ws.close();
          }

          main().catch(err=>{
            console.error(err);
            process.exitCode=1;
          });
          NODE
