name: Verify 1988

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-1988-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test production contracts
        run: |
          node --test tests/feed-refresh.test.cjs
          node --test tests/youtube-live-demand-contract.test.cjs
          node tests/source-state-contract.test.cjs
          node tests/search-resource-contract.test.cjs
          node tests/read-model-resource-contract.test.cjs
          node tests/media-core.test.cjs
          node tests/integration-shape.test.cjs .
          node tests/channel-library-contract.test.cjs
          node tests/host-architecture-contract.test.cjs
          node --check src/media-core.js
          node --check src/app.js
          node --check src/yt-local.js
          node --check sources/sources.js
