name: Probe shared data outage once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-shared-outage-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe apps and Supabase gateway
        shell: bash
        run: |
          set +e
          echo "=== APP ROOTS ==="
          for u in             https://get.taphoa.xyz             https://yt.taphoa.xyz             https://app.taphoa.xyz             https://chat.taphoa.xyz             https://one988-tiktok-session.onrender.com/health
          do
            echo "--- $u"
            curl -L -sS -o /tmp/body -w 'code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total} type=%{content_type}\n' --max-time 20 "$u"
            head -c 220 /tmp/body | tr '\n' ' '; echo
          done

          echo "=== SUPABASE HEALTH ==="
          for u in             https://gcnoahqsrquxkwkjbuxy.supabase.co/auth/v1/health             https://gcnoahqsrquxkwkjbuxy.supabase.co/rest/v1/             https://gcnoahqsrquxkwkjbuxy.supabase.co/storage/v1/status
          do
            echo "--- $u"
            curl -sS -o /tmp/body -w 'code=%{http_code} dns=%{time_namelookup} connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total} type=%{content_type}\n' --max-time 20 "$u"
            head -c 300 /tmp/body | tr '\n' ' '; echo
          done
