name: Probe giaodendoithuong79 room FLV once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-giaodendoithuong79-room-flv-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TikTok room info FLV
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          H='giaodendoithuong79'
          RID='7691194439160531764'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          url='https://webcast.tiktok.com/webcast/room/info?aid=1988&room_id='+RID
          req=urllib.request.Request(url,headers={
              'User-Agent':UA,
              'Referer':'https://www.tiktok.com/@'+H+'/live',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'vi-VN,vi;q=0.9,en;q=0.5'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              root=json.load(r)

          room=root.get('data') or root.get('room') or {}
          print('ROOM_STATUS',room.get('status'),'KEYS',sorted(room.keys())[:120])

          out=[]
          urls=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      p=(path+'.'+k) if path else k
                      low=p.lower()
                      if any(t in low for t in ('flv','stream','pull','sdk','play')):
                          out.append((p,type(x).__name__,str(x)[:260].replace('\n',' ')))
                      walk(x,p)
              elif isinstance(v,list):
                  for i,x in enumerate(v[:100]):
                      walk(x,path+'['+str(i)+']')
              elif isinstance(v,str):
                  t=v.strip()
                  for m in re.finditer(r'https?://[^"\\\s<>]+',t):
                      u=m.group(0).replace('\\u002F','/').replace('\\u0026','&').replace('\\/','/')
                      if not any(a[1]==u for a in urls): urls.append((path,u))
                  if (t.startswith('{') and t.endswith('}')) or (t.startswith('[') and t.endswith(']')):
                      try: walk(json.loads(t),path+'{json}')
                      except: pass
          walk(room)
          for p,t,s in out[:400]:
              print('PATH',p,'TYPE',t,'VAL',s)
          print('URL_COUNT',len(urls))
          for p,u in urls[:150]:
              q=urllib.parse.urlsplit(u)
              print('URL',p,'host='+str(q.hostname),'path='+q.path[-120:])
          PY
