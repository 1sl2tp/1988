name: Smoke Production Player

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-production-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Test exact yt.taphoa.xyz production
        run: |
          cat >/tmp/smoke.mjs <<'JS'
          import puppeteer from 'puppeteer-core';

          const chrome = process.env.CHROME || '/usr/bin/google-chrome';
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: 'new',
            args: ['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });

          const events = [];
          const started = Date.now();

          page.on('console', msg => {
            const text = msg.text();
            if (/\[Player\]|error|failed|DASH|NewPipe|Cobalt/i.test(text)) {
              console.log('BROWSER', msg.type(), text);
            }
          });
          page.on('requestfailed', req => {
            console.log('REQUEST_FAILED', req.url(), req.failure()?.errorText || '');
          });

          const url = 'https://yt.taphoa.xyz/kira-proof/#/watch/dQw4w9WgXcQ';
          console.log('OPEN', url);
          const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          console.log('DOC_HTTP', response?.status());

          await page.waitForSelector('video', { timeout: 30000 });
          const firstVideoAt = Date.now();

          let firstPlayable = null;
          for (let i = 0; i < 80; i++) {
            const s = await page.$eval('video', v => ({
              currentTime: v.currentTime,
              duration: v.duration,
              readyState: v.readyState,
              networkState: v.networkState,
              paused: v.paused,
              videoWidth: v.videoWidth,
              videoHeight: v.videoHeight,
              buffered: v.buffered.length ? [v.buffered.start(0), v.buffered.end(v.buffered.length - 1)] : null,
              src: v.currentSrc || v.src
            }));
            console.log('STATE', i, JSON.stringify(s));
            if (!firstPlayable && Number.isFinite(s.duration) && s.duration > 1 && s.readyState >= 2 && s.videoWidth > 0) {
              firstPlayable = { ...s, ms: Date.now() - started };
              break;
            }
            await new Promise(r => setTimeout(r, 500));
          }

          if (!firstPlayable) {
            console.log('RESULT', JSON.stringify({ ok:false, reason:'not_playable_with_duration', ms:Date.now()-started }));
            await browser.close();
            process.exit(2);
          }

          const target = Math.min(60, Math.max(5, firstPlayable.duration / 2));
          const before = await page.$eval('video', v => v.currentTime);
          await page.$eval('video', (t) => { v.currentTime = t; }, target).catch(()=>{});
          await page.evaluate((t) => {
            const v = document.querySelector('video');
            if (v) v.currentTime = t;
          }, target);

          let seeked = false;
          let seekState = null;
          for (let i = 0; i < 30; i++) {
            seekState = await page.$eval('video', v => ({
              currentTime: v.currentTime,
              duration: v.duration,
              readyState: v.readyState,
              buffered: v.buffered.length ? [v.buffered.start(0), v.buffered.end(v.buffered.length - 1)] : null
            }));
            if (Math.abs(seekState.currentTime - target) < 2) { seeked = true; break; }
            await new Promise(r => setTimeout(r, 500));
          }

          console.log('RESULT', JSON.stringify({
            ok: firstPlayable.duration > 1 && seeked,
            firstPlayable,
            seekTarget: target,
            seeked,
            seekState,
            totalMs: Date.now() - started
          }));

          await browser.close();
          if (!seeked) process.exit(3);
          JS

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME="$CHROME" node /tmp/smoke.mjs
