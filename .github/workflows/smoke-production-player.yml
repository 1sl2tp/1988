name: Smoke Production Player

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-production-player.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Test exact yt.taphoa.xyz search and iframe
        run: |
          cat >smoke-production.mjs <<'JS'
          import puppeteer from 'puppeteer-core';

          const chrome = process.env.CHROME || '/usr/bin/google-chrome';
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: 'new',
            args: ['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']
          });

          const page = await browser.newPage();
          await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 });

          const norm = (s='') => String(s).normalize('NFD')
            .replace(/[\u0300-\u036f]/g,'')
            .replace(/đ/g,'d').replace(/Đ/g,'D')
            .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();

          const home = 'https://yt.taphoa.xyz/kira-proof/#/';
          const started = Date.now();
          const response = await page.goto(home, { waitUntil:'domcontentloaded', timeout:30000 });
          console.log('HOME_HTTP', response?.status());

          await page.waitForSelector('.search-input', { timeout:20000 });
          const input = await page.$('.search-input');

          // Reproduce the user's exact fast typing pattern so stale "tuan"
          // responses cannot overwrite "tuan hung".
          await input.type('tuan', { delay:20 });
          await new Promise(r => setTimeout(r, 120));
          await input.type(' hung', { delay:20 });

          await page.waitForFunction(() => {
            const q = document.querySelector('.search-input')?.value || '';
            const rows = [...document.querySelectorAll('.search-result-item')];
            return q === 'tuan hung' && rows.length > 0;
          }, { timeout:15000 });

          await new Promise(r => setTimeout(r, 1400));

          const results = await page.$$eval('.search-result-item', rows => rows.slice(0,8).map(row => ({
            title: row.querySelector('.title')?.textContent?.trim() || '',
            channel: row.querySelector('.channel')?.textContent?.trim() || ''
          })));
          console.log('SEARCH_MS', Date.now()-started);
          console.log('SEARCH_RESULTS', JSON.stringify(results));

          const exactIndex = results.findIndex(r => {
            const combined = norm(r.title+' '+r.channel);
            return combined.includes('tuan') && combined.includes('hung');
          });
          console.log('EXACT_INDEX', exactIndex);
          if (exactIndex < 0 || exactIndex > 2) {
            await browser.close();
            process.exit(4);
          }

          await page.goto('https://yt.taphoa.xyz/kira-proof/#/watch/dQw4w9WgXcQ', {
            waitUntil:'domcontentloaded',
            timeout:30000
          });
          await page.waitForSelector('iframe.youtube-frame', { timeout:15000 });
          const frameSrc = await page.$eval('iframe.youtube-frame', el => el.getAttribute('src') || '');
          console.log('IFRAME_SRC', frameSrc);
          if (!frameSrc.includes('youtube-nocookie.com/embed/dQw4w9WgXcQ')) {
            await browser.close();
            process.exit(5);
          }

          console.log('RESULT', JSON.stringify({ok:true, exactIndex, frameSrc}));
          await browser.close();
          JS

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME="$CHROME" node smoke-production.mjs
