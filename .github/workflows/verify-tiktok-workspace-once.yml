name: Verify dedicated TikTok workspace once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-tiktok-workspace-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium webkit

      - name: Verify TikTok desktop mobile and PWA workspace
        env:
          TARGET_URL: https://yt.taphoa.xyz/
        run: |
          node <<'NODE'
          const { chromium, webkit } = require('playwright');

          async function waitProfile(page){
            await page.waitForFunction(()=>(
              document.documentElement.classList.contains('tiktok-ui') &&
              document.documentElement.classList.contains('tiktok-profile') &&
              !!document.querySelector('#tiktokAccountRail .tiktok-account-button') &&
              !!document.querySelector('.tiktok-profile-head')
            ),null,{timeout:30000});
          }

          async function openTikTok(page){
            await page.locator('#platformTikTok').click();
            await waitProfile(page);
          }

          async function verifyProfile(page,label,mobile){
            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const rail=document.getElementById('tiktokAccountRail');
              const source=document.getElementById('sourcebar');
              const liveButtons=[...document.querySelectorAll('#tiktokAccountRail .tiktok-account-button.is-live')];
              const followed=[...document.querySelectorAll('#tiktokAccountRail .tiktok-account-button:not(.is-live)')];
              return {
                ui:root.classList.contains('tiktok-ui'),
                profile:root.classList.contains('tiktok-profile'),
                sourceHidden:source?.hidden===true||getComputedStyle(source).display==='none',
                railVisible:getComputedStyle(rail).display!=='none',
                liveCount:liveButtons.length,
                followedCount:followed.length,
                profileVideos:document.querySelectorAll('.row.tiktok-profile-video').length,
                pip:document.getElementById('player')?.classList.contains('pip')||false
              };
            });
            if(!state.ui||!state.profile)throw new Error(label+': TikTok profile workspace missing '+JSON.stringify(state));
            if(!state.sourceHidden)throw new Error(label+': old TikTok source tabs still visible');
            if(!state.railVisible)throw new Error(label+': account rail hidden');
            if(state.liveCount<1)throw new Error(label+': no LIVE accounts in left rail');
            if(state.followedCount<1)throw new Error(label+': no followed accounts in left rail');
            if(state.profileVideos<1)throw new Error(label+': no profile videos');
            if(state.pip)throw new Error(label+': TikTok profile unexpectedly in PiP');
            console.log(JSON.stringify({ok:true,label,step:'profile',state}));
          }

          async function verifyMediaWatch(page,label,mobile){
            const first=page.locator('.row.tiktok-profile-video').first();
            await first.click();
            await page.waitForFunction(()=>(
              document.documentElement.classList.contains('tiktok-watch') &&
              document.getElementById('player')?.dataset?.mediaType==='media'
            ),null,{timeout:20000});
            await page.waitForTimeout(500);

            const state=await page.evaluate(()=>{
              const root=document.documentElement;
              const player=document.getElementById('player');
              const media=document.getElementById('mediaCol');
              const rail=document.getElementById('tiktokAccountRail');
              const rows=document.getElementById('rows');
              const pstyle=getComputedStyle(player);
              const mstyle=getComputedStyle(media);
              return {
                watch:root.classList.contains('tiktok-watch'),
                type:player?.dataset?.mediaType||'',
                provider:player?.dataset?.mediaProvider||'',
                pip:player?.classList.contains('pip')||false,
                inline:player?.classList.contains('inline-overlay')||false,
                videoPresent:!!document.getElementById('tiktokMediaVideo'),
                mediaPosition:mstyle.position,
                playerPosition:pstyle.position,
                railDisplay:getComputedStyle(rail).display,
                rowsDisplay:getComputedStyle(rows).display,
                closeDisplay:getComputedStyle(document.getElementById('tiktokWatchClose')).display
              };
            });
            if(!state.watch||state.type!=='media'||state.provider!=='tiktok')throw new Error(label+': media watch routing wrong '+JSON.stringify(state));
            if(state.pip||state.inline)throw new Error(label+': TikTok media entered PiP/inline '+JSON.stringify(state));
            if(!state.videoPresent)throw new Error(label+': TikTok media video missing');
            if(mobile){
              if(state.mediaPosition!=='fixed')throw new Error(label+': mobile media not fullscreen fixed '+JSON.stringify(state));
              if(state.railDisplay!=='none'||state.rowsDisplay!=='none')throw new Error(label+': mobile watch did not hide lists '+JSON.stringify(state));
              if(state.closeDisplay==='none')throw new Error(label+': mobile close button hidden');
              await page.locator('#tiktokWatchClose').click();
              await waitProfile(page);
            }else{
              if(state.railDisplay==='none'||state.rowsDisplay==='none')throw new Error(label+': desktop watch lost side columns '+JSON.stringify(state));
              const grid=await page.evaluate(()=>getComputedStyle(document.querySelector('main')).gridTemplateColumns);
              if((grid.match(/px/g)||[]).length<2)throw new Error(label+': desktop TikTok watch is not multi-column '+grid);
            }
            console.log(JSON.stringify({ok:true,label,step:'media-watch',state}));
          }

          async function verifyLiveWatch(page,label,mobile){
            if(!document.documentElement.classList.contains('tiktok-profile')){
              if(mobile){
                // mobile media watch was closed above
                await waitProfile(page);
              }else{
                const creator=page.locator('[data-tiktok-profile-handle]').first();
                if(await creator.count())await creator.click();
                await waitProfile(page);
              }
            }

            const live=page.locator('#tiktokAccountRail .tiktok-account-button.is-live').first();
            await live.click();
            await page.waitForFunction(()=>(
              document.documentElement.classList.contains('tiktok-watch') &&
              document.getElementById('player')?.dataset?.mediaType==='live'
            ),null,{timeout:20000});
            await page.waitForTimeout(500);

            const state=await page.evaluate(()=>{
              const player=document.getElementById('player');
              const live=document.getElementById('tiktokLiveVideo');
              const rail=document.getElementById('tiktokAccountRail');
              const rows=document.getElementById('rows');
              return {
                type:player?.dataset?.mediaType||'',
                provider:player?.dataset?.mediaProvider||'',
                pip:player?.classList.contains('pip')||false,
                inline:player?.classList.contains('inline-overlay')||false,
                livePresent:!!live,
                liveSrc:String(live?.src||''),
                railDisplay:getComputedStyle(rail).display,
                rowsDisplay:getComputedStyle(rows).display
              };
            });
            if(state.type!=='live'||state.provider!=='tiktok')throw new Error(label+': LIVE routing wrong '+JSON.stringify(state));
            if(state.pip||state.inline)throw new Error(label+': TikTok LIVE entered PiP/inline');
            if(!state.livePresent)throw new Error(label+': LIVE video element missing');
            if(mobile&&(state.railDisplay!=='none'||state.rowsDisplay!=='none'))throw new Error(label+': mobile LIVE not fullscreen');
            console.log(JSON.stringify({ok:true,label,step:'live-watch',state}));
          }

          async function verifyReturnToYoutube(page,label){
            await page.locator('#platformYouTube').click();
            await page.waitForTimeout(1800);
            const state=await page.evaluate(()=>({
              tiktokUi:document.documentElement.classList.contains('tiktok-ui'),
              railHidden:document.getElementById('tiktokAccountRail')?.hidden===true,
              sourceVisible:document.getElementById('sourcebar')?.hidden===false
            }));
            if(state.tiktokUi||!state.railHidden||!state.sourceVisible)throw new Error(label+': TikTok workspace not cleared '+JSON.stringify(state));
            console.log(JSON.stringify({ok:true,label,step:'youtube-return',state}));
          }

          async function run(browserType,label,options={},standalone=false){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext(options);

            if(standalone){
              await context.addInitScript(()=>{
                try{Object.defineProperty(navigator,'standalone',{get:()=>true,configurable:true})}catch{}
                const native=window.matchMedia.bind(window);
                window.matchMedia=(q)=>{
                  const r=native(q);
                  if(String(q).includes('display-mode: standalone')){
                    return new Proxy(r,{get(t,p){
                      if(p==='matches')return true;
                      const v=t[p];
                      return typeof v==='function'?v.bind(t):v;
                    }});
                  }
                  return r;
                };
              });
            }

            const page=await context.newPage();
            page.on('pageerror',e=>console.error(label,'pageerror',String(e)));
            await page.goto(process.env.TARGET_URL+'?verify_tiktok_workspace='+Date.now(),{
              waitUntil:'domcontentloaded',
              timeout:60000
            });
            await page.waitForTimeout(4000);

            if(standalone){
              await page.evaluate(async()=>navigator.serviceWorker?.ready.catch(()=>null));
              await page.reload({waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(2500);
              const pwa=await page.evaluate(async()=>({
                controlled:!!navigator.serviceWorker?.controller,
                caches:'caches' in window?await caches.keys():[]
              }));
              if(!pwa.controlled)throw new Error(label+': service worker not controlling');
              if(!pwa.caches.includes('1988-simple-media-v46'))throw new Error(label+': PWA v46 missing '+JSON.stringify(pwa.caches));
            }

            const mobile=options?.isMobile===true;
            await openTikTok(page);
            await verifyProfile(page,label,mobile);
            await verifyMediaWatch(page,label,mobile);
            await verifyLiveWatch(page,label,mobile);
            if(mobile){
              await page.locator('#tiktokWatchClose').click();
              await waitProfile(page);
            }else{
              const creator=page.locator('[data-tiktok-profile-handle]').first();
              if(await creator.count())await creator.click();
              await waitProfile(page);
            }
            await verifyReturnToYoutube(page,label);

            await context.close();
            await browser.close();
          }

          (async()=>{
            await run(chromium,'desktop',{viewport:{width:1440,height:1000}});
            await run(webkit,'mobile-web',{
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
            });
            await run(chromium,'pwa-standalone',{
              viewport:{width:390,height:844},
              isMobile:true,
              hasTouch:true,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
            },true);
          })().catch(error=>{
            console.error(error);
            process.exit(1);
          });
          NODE
