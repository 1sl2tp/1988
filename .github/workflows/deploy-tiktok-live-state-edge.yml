name: Deploy TikTok Live State Edge

concurrency:
  group: deploy-tiktok-live-state-edge-main
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test edge contracts
        run: |
          node cloudflare/tiktok-live-state/video-fingerprint-contract.test.cjs
          node cloudflare/tiktok-live-state/demand-only-contract.test.cjs
          node cloudflare/tiktok-live-state/vod-failover-contract.test.cjs
      - name: Deploy Worker
        working-directory: cloudflare/tiktok-live-state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
      - name: Enforce zero LIVE schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/1988-tiktok-live-state/schedules"
          curl -fsSL \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '[]' \
            "$API" > /tmp/tiktok-live-schedules-put.json
          jq -e '.success == true and (.result.schedules | length) == 0' /tmp/tiktok-live-schedules-put.json >/dev/null
          curl -fsSL \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$API" > /tmp/tiktok-live-schedules-get.json
          jq -e '.success == true and (.result.schedules | length) == 0' /tmp/tiktok-live-schedules-get.json >/dev/null
