name: Deploy TikTok Live State Edge

concurrency:
  group: deploy-tiktok-live-state-edge-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/tiktok-live-state/**"
      - ".github/workflows/deploy-tiktok-live-state-edge.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test edge contracts
        run: node cloudflare/tiktok-live-state/video-fingerprint-contract.test.cjs
      - name: Deploy Worker
        working-directory: cloudflare/tiktok-live-state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
