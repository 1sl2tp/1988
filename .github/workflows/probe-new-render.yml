name: Probe New 1988 Render
# retry after yt-dlp nightly merge v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe backend
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://one988-1od3.onrender.com'
          ID='8JA5ODE64c4'

          echo '=== HEALTH ==='
          curl -sS --fail-with-body --max-time 60 "$BASE/health"

          echo
          echo '=== RESOLVE VIDEO ==='
          VIDEO_HTTP="$(curl -sS --max-time 90 -o /tmp/resolve.json -w '%{http_code}' "$BASE/resolve?id=$ID&kind=video" || true)"
          echo "VIDEO_HTTP=$VIDEO_HTTP"
          cat /tmp/resolve.json || true

          echo
          echo '=== VIDEO RANGE ==='
          curl -sS --fail-with-body -L --max-time 90             -r 0-65535 -D /tmp/video.headers             "$BASE/video?id=$ID" -o /tmp/video.bin
          cat /tmp/video.headers
          wc -c /tmp/video.bin
          grep -Eiq '^HTTP/.* (200|206)' /tmp/video.headers
          grep -Eiq '^content-type: video/' /tmp/video.headers
          grep -Eiq '^accept-ranges: bytes' /tmp/video.headers
          test "$(wc -c < /tmp/video.bin)" -gt 1024

          echo
          echo '=== AUDIO RESOLVE ==='
          AUDIO_HTTP="$(curl -sS --max-time 90 -o /tmp/audio.json -w '%{http_code}' "$BASE/resolve?id=$ID&kind=audio" || true)"
          echo "AUDIO_HTTP=$AUDIO_HTTP"
          cat /tmp/audio.json || true
