name: Diagnose regional feeds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-regional.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed regional sources
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988'

          echo '=== REGIONAL UPLOAD FEED ==='
          curl -sS --max-time 30 -w '\nHTTP=%{http_code}\n' "$BASE?action=regional_feed&region=VN" -o /tmp/regional-feed.json || true
          jq '{ok,source,channels:(.channels//[]|length),dataLen:(.data//[]|length),sample:(.data//[])[0:5]}' /tmp/regional-feed.json 2>/dev/null || head -c 5000 /tmp/regional-feed.json || true

          echo '=== TRENDING VN ==='
          curl -sS --max-time 25 -w '\nHTTP=%{http_code}\n' "$BASE?action=trending&region=VN" -o /tmp/trending.json || true
          head -c 5000 /tmp/trending.json 2>/dev/null || true
          echo
          echo '--- SHAPE ---'
          jq 'if type=="object" then {ok,source,dataType:(.data|type),dataLen:(if (.data|type)=="array" then (.data|length) elif (.data.items?|type)=="array" then (.data.items|length) else null end),first:(if (.data|type)=="array" then .data[0] elif (.data.items?|type)=="array" then .data.items[0] else .data end)} else . end' /tmp/trending.json 2>/dev/null || true

          echo '=== REGIONAL COUNTS USING FRONTEND RULES ==='
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/trending.json','utf8'));
          const rows=Array.isArray(body?.data)?body.data:[];
          const now=Date.now();
          const age=row=>{
            const u=Number(row?.uploaded||0);
            if(Number.isFinite(u)&&u>0){
              const ms=u<1e12?u*1000:u;
              return Math.max(0,now-ms);
            }
            const raw=String(row?.uploadedDate||'').toLowerCase();
            const m=raw.match(/(\d+)\s*(second|seconds|minute|minutes|hour|hours|day|days|week|weeks|month|months|year|years)/);
            if(!m)return Number.MAX_SAFE_INTEGER;
            const n=Number(m[1])||0, unit=m[2], minute=60000;
            if(unit.startsWith('second'))return n*1000;
            if(unit.startsWith('minute'))return n*minute;
            if(unit.startsWith('hour'))return n*60*minute;
            if(unit.startsWith('day'))return n*24*60*minute;
            if(unit.startsWith('week'))return n*7*24*60*minute;
            if(unit.startsWith('month'))return n*30*24*60*minute;
            return n*365*24*60*minute;
          };
          const isLive=row=>Number(row?.duration)<0||Number(row?.uploaded)===-1;
          const live=rows.filter(isLive);
          const today=rows.filter(r=>!isLive(r)&&age(r)<=24*60*60*1000);
          const week=rows.filter(r=>!isLive(r)&&age(r)<=7*24*60*60*1000);
          console.log(JSON.stringify({
            total:rows.length,
            live:live.length,
            today:today.length,
            week:week.length,
            liveSample:live.slice(0,3).map(r=>({title:r.title,duration:r.duration,uploaded:r.uploaded,uploadedDate:r.uploadedDate})),
            todaySample:today.slice(0,3).map(r=>({title:r.title,views:r.views,uploaded:r.uploaded,uploadedDate:r.uploadedDate})),
            weekSample:week.slice(0,3).map(r=>({title:r.title,views:r.views,uploaded:r.uploaded,uploadedDate:r.uploadedDate}))
          },null,2));
          NODE

          echo '=== DEPLOYED ASSETS ==='
          curl -sS -L --max-time 25 https://yt.taphoa.xyz/ -o /tmp/index.html || true
          grep -Eo 'src/(app|yt-local)\.js\?v=[^" ]+' /tmp/index.html || true

          echo '=== BROWSER DOM ==='
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME=$CHROME"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage               --virtual-time-budget=15000 --dump-dom https://yt.taphoa.xyz/               > /tmp/dom.html 2>/tmp/chrome.log || true
            echo '--- FEED TEXT ---'
            grep -oE 'Chưa tải được[^<]*|Đang tải[^<]*|[0-9]+ video|LIVE|Hôm nay|Tuần này' /tmp/dom.html | head -80 || true
            echo '--- CARD COUNT ---'
            grep -o 'class="card"' /tmp/dom.html | wc -l || true
            echo '--- BROWSER ERRORS ---'
            grep -Ei 'error|uncaught|failed|cors|syntax|reference' /tmp/chrome.log | tail -80 || true
          fi
