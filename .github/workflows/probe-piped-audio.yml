name: Probe Piped Audio Pool

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect proxied muxed fallback
        shell: bash
        run: |
          set +e
          ID="dQw4w9WgXcQ"
          for API in "https://pipedapi.ducks.party" "https://api.piped.private.coffee"; do
            echo "=== $API ==="
            OUT=$(mktemp)
            curl -sS -L --connect-timeout 3 --max-time 12 "$API/streams/$ID" -o "$OUT"
            URL=$(jq -r '[(.videoStreams // [])[] | select(.url != null and .videoOnly == false and (.quality != "LBRY") and (.quality != "LBRY HLS"))][0].url // ""' "$OUT")
            MIME=$(jq -r '[(.videoStreams // [])[] | select(.url != null and .videoOnly == false and (.quality != "LBRY") and (.quality != "LBRY HLS"))][0].mimeType // ""' "$OUT")
            QUALITY=$(jq -r '[(.videoStreams // [])[] | select(.url != null and .videoOnly == false and (.quality != "LBRY") and (.quality != "LBRY HLS"))][0].quality // ""' "$OUT")
            echo "SELECTED MIME=$MIME QUALITY=$QUALITY HOST=$(printf "%s" "$URL" | sed -E "s#https?://([^/]+)/?.*#\\1#")"
            if [ -n "$URL" ]; then
              echo "-- HEAD/RANGE --"
              curl -sS -I -L --connect-timeout 3 --max-time 12 -H 'Range: bytes=0-1023' "$URL" | tr -d '\r' | grep -iE '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:|access-control-allow-origin:)' || true
              echo "-- GET 1KB --"
              curl -sS -L --connect-timeout 3 --max-time 12 -H 'Range: bytes=0-1023' -o /tmp/chunk.bin -w 'HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$URL" || true
              file /tmp/chunk.bin || true
            fi
            rm -f "$OUT"
          done
