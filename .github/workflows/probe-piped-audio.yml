name: Probe Piped Audio Pool

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect playable muxed fallback
        shell: bash
        run: |
          set +e
          ID="dQw4w9WgXcQ"
          for API in "https://pipedapi.ducks.party" "https://api.piped.private.coffee"; do
            echo "=== $API ==="
            OUT=$(mktemp)
            curl -sS -L --connect-timeout 3 --max-time 12 "$API/streams/$ID" -o "$OUT"
            jq -c '(.videoStreams // [])[] | {url,mimeType,quality,videoOnly,bitrate,format}' "$OUT" || true
            URL=$(jq -r '[(.videoStreams // [])[] | select(.url != null and (.videoOnly == false or .videoOnly == null))][0].url // ""' "$OUT")
            echo "MUXED_URL_HOST=$(printf "%s" "$URL" | sed -E "s#https?://([^/]+)/?.*#\\1#")"
            if [ -n "$URL" ]; then
              curl -sS -I -L --connect-timeout 3 --max-time 12 -H 'Range: bytes=0-1' "$URL" | tr -d '\r' | grep -iE '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:|access-control-allow-origin:)' || true
            fi
            rm -f "$OUT"
          done
