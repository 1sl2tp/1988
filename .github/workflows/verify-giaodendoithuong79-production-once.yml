name: Verify giaodendoithuong79 production once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-giaodendoithuong79-production-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production LIVE
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          B='https://one988-tiktok-session.onrender.com'
          H='giaodendoithuong79'
          UA='Mozilla/5.0'
          def get(url,timeout=55,headers=None):
              req=urllib.request.Request(url,headers=headers or {'User-Agent':UA,'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.status,r.headers,r.read()

          try:
              s,h,b=get(B+'/tiktok/live-session?user='+H+'&force=browser')
              print('CAPTURE',s,b.decode('utf-8','ignore')[:1500])
          except urllib.error.HTTPError as e:
              print('CAPTURE_HTTP',e.code,e.read().decode('utf-8','ignore')[:2000])
          except Exception as e:
              print('CAPTURE_ERR',repr(e))

          try:
              s,h,b=get(B+'/tiktok/live-now?t=prod')
              d=json.loads(b)
              row=next((x for x in d.get('items',[]) if str(x.get('handle','')).lower()==H),{})
              print('ROW',json.dumps(row,ensure_ascii=False))
              u=row.get('streamUrl') or ''
              if u:
                  try:
                      s2,h2,b2=get(B+u,30,{'User-Agent':UA,'Range':'bytes=0-262143','Accept':'*/*'})
                      print('STREAM',s2,h2.get('content-type'),len(b2),b2[:3])
                  except urllib.error.HTTPError as e:
                      print('STREAM_HTTP',e.code,e.read().decode('utf-8','ignore')[:1200])
                  except Exception as e:
                      print('STREAM_ERR',repr(e))
          except Exception as e:
              print('ROW_ERR',repr(e))
          PY
