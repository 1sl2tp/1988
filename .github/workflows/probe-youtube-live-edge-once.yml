name: Probe YouTube Live Edge Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-youtube-live-edge-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe YouTube LIVE edge
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://1988-youtube-live-state.taphoa-4ab8161d.workers.dev'
          python3 - <<'PY'
          import json, urllib.request, time
          base='https://1988-youtube-live-state.taphoa-4ab8161d.workers.dev'
          def get(path, timeout=30):
              req=urllib.request.Request(base+path,headers={'User-Agent':'1988-youtube-live-probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  body=r.read().decode('utf-8','replace')
                  print(path,'HTTP',r.status,body[:4000])
                  try:return json.loads(body)
                  except:return {}
          for p in ['/health','/youtube/live-now']:
              try:get(p)
              except Exception as e: print(p,'ERROR',repr(e))
          try:
              state=get('/youtube/live-scan?start=1&t='+str(int(time.time()*1000)),60)
              for i in range(12):
                  if state.get('done') is True: break
                  time.sleep(.5)
                  state=get('/youtube/live-scan?t='+str(int(time.time()*1000)),60)
              snap=get('/youtube/live-now?t='+str(int(time.time()*1000)),60)
              print('FINAL',json.dumps({
                  'scan':state,
                  'liveTotal':snap.get('live',snap.get('total')),
                  'items':len(snap.get('items') or [])
              },ensure_ascii=False)[:6000])
          except Exception as e:
              print('SCAN_ERROR',repr(e))
              raise
          PY
