name: Assemble uploaded HTML

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source file
        shell: bash
        run: |
          cat .upload/data-*.b64 | base64 -d | gzip -d > 5555_pixel_css.html
          echo "9f6f18b57c20ad73c948137e23f8c3fcd49f93f3b93f8b57af7ae1c35384592a  5555_pixel_css.html" | sha256sum -c -
          rm -rf .upload
      - name: Commit assembled file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 5555_pixel_css.html"
          git push
