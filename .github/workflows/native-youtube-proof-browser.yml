name: Native YouTube Proof Browser

on:
  push:
    branches:
      - feat/native-youtube-proof

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependency
        run: npm install --no-save playwright
      - name: Serve site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/youtube-proof.html >/dev/null && break
            sleep 1
          done
      - name: Probe final media response
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988?action=media&id=vhUjvanyu2U&kind=video'
          echo '--- HEAD/redirect chain ---'
          curl -sS -I -L "$URL" | sed -n '1,120p'
          echo '--- Range GET ---'
          code=$(curl -sS -L -r 0-4095 -D /tmp/media-h -o /tmp/media.bin -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          sed -n '1,120p' /tmp/media-h
          echo "BYTES=$(wc -c </tmp/media.bin)"
          file /tmp/media.bin || true
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/media.bin').read_bytes()
          print('FIRST32=',b[:32].hex())
          assert len(b) > 100
          PY

      - name: Play exact video without iframe
        shell: bash
        run: |
          cat >test.mjs <<'JS'
          import { chromium } from './node_modules/playwright/index.mjs';
          const browser=await chromium.launch({
            headless:true,
            executablePath:'/usr/bin/google-chrome',
            args:['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required']
          });
          const page=await browser.newPage();
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('PAGEERROR',e.message));
          await page.goto('http://127.0.0.1:4173/youtube-proof.html?v=vhUjvanyu2U',{waitUntil:'domcontentloaded',timeout:30000});

          const iframeCount=await page.locator('iframe').count();
          console.log('IFRAMES='+iframeCount);
          if(iframeCount!==0) throw new Error('iframe present');

          await page.locator('#playBtn').click();

          const started=await page.waitForFunction(()=>{
            const v=document.querySelector('#nativeVideo');
            return !!v && v.readyState>=2 && !v.paused && v.currentTime>0.5;
          },null,{timeout:45000}).then(()=>true).catch(()=>false);

          const state=await page.evaluate(()=>{
            const v=document.querySelector('#nativeVideo');
            return {
              started:!!v && v.readyState>=2 && !v.paused && v.currentTime>0.5,
              readyState:v?.readyState??-1,
              paused:v?.paused??true,
              currentTime:v?.currentTime??-1,
              src:v?.currentSrc||v?.src||'',
              status:document.querySelector('#playerStatus')?.textContent||''
            };
          });
          console.log('STATE='+JSON.stringify(state));
          await browser.close();
          if(!started) process.exit(2);
          JS
          node test.mjs
