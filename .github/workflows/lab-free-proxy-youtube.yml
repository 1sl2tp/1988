name: Lab Free Proxy YouTube Test

on:
  push:
    branches: [lab/free-proxy-test-20260923]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install yt-dlp with SOCKS support
        run: |
          python -m pip install -q "yt-dlp[default]"

      - name: Test free SOCKS5 proxies against exact video
        shell: bash
        run: |
          set +e
          ID='vhUjvanyu2U'
          cat > /tmp/proxies.txt <<'EOF'
          45.74.31.23:13173
          45.74.31.40:12419
          185.195.71.218:18080
          192.252.215.2:4145
          109.111.79.212:2080
          14.225.68.207:1337
          72.56.94.27:1081
          152.69.211.50:40001
          208.87.128.239:9150
          203.76.123.6:1080
          152.53.183.107:8081
          144.24.47.42:1080
          107.167.18.122:443
          68.71.249.153:48606
          EOF

          test_one() {
            P="$1"
            echo "=== $P ==="
            META=$(curl -sS --socks5-hostname "$P" --connect-timeout 4 --max-time 10               -o /tmp/page.$$ -w 'HTTP=%{http_code} TIME=%{time_total} IP=%{remote_ip} SIZE=%{size_download}'               "https://www.youtube.com/watch?v=$ID" 2>/tmp/curlerr.$$)
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "CURL_FAIL rc=$RC $(tr '\n' ' ' </tmp/curlerr.$$ | head -c 180)"
              rm -f /tmp/page.$$ /tmp/curlerr.$$
              return
            fi
            echo "CURL_OK $META"
            if grep -qiE 'sign in to confirm|not a bot' /tmp/page.$$; then
              echo "PAGE_BOT_CHECK"
              rm -f /tmp/page.$$ /tmp/curlerr.$$
              return
            fi
            rm -f /tmp/page.$$ /tmp/curlerr.$$

            timeout 35s yt-dlp               --proxy "socks5://$P"               --no-playlist --skip-download --no-warnings               --print '%(id)s|%(title)s|%(duration)s|%(format_id)s|%(ext)s'               -f 'bestaudio[ext=m4a]/bestaudio'               "https://www.youtube.com/watch?v=$ID"               >/tmp/ytdlp.$$ 2>/tmp/yterr.$$
            YRC=$?
            if [ $YRC -eq 0 ] && [ -s /tmp/ytdlp.$$ ]; then
              echo "YTDLP_OK $(head -1 /tmp/ytdlp.$$)"
              echo "$P" >> /tmp/winners.txt
            else
              echo "YTDLP_FAIL rc=$YRC $(tr '\n' ' ' </tmp/yterr.$$ | tail -c 500)"
            fi
            rm -f /tmp/ytdlp.$$ /tmp/yterr.$$
          }
          export -f test_one
          export ID
          : > /tmp/winners.txt

          cat /tmp/proxies.txt | xargs -n1 -P6 -I{} bash -c 'test_one "$@"' _ {}
          echo "=== WINNERS ==="
          cat /tmp/winners.txt || true

          if [ ! -s /tmp/winners.txt ]; then
            exit 2
          fi
