name: Check TikTok longgiatien LIVE once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-tiktok-live-status-endpoint-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify longgiatien and exhaustive LIVE scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          B='https://one988-tiktok-session.onrender.com'
          H='longgiatien'
          def get(path, timeout=220):
              req=urllib.request.Request(B+path,headers={'User-Agent':'1988-live-proof/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)

          one=get('/tiktok/check-live?user='+H,90)
          print('SINGLE',json.dumps(one,ensure_ascii=False,sort_keys=True))
          assert one.get('ok'), one
          assert one.get('live') is True, 'KNOWN LIVE @longgiatien was not detected'

          allst=get('/tiktok/live-statuses?refresh=1&t='+str(int(time.time())),240)
          print('TOTAL',allst.get('total'),'COUNTS',json.dumps(allst.get('counts') or {},ensure_ascii=False,sort_keys=True))
          row=next((x for x in allst.get('items',[]) if str(x.get('handle','')).lower()==H),None)
          print('LONGGIATIEN',json.dumps(row,ensure_ascii=False,sort_keys=True))
          assert row, '@longgiatien missing from selected-channel status table'
          assert str(row.get('state','')).startswith('live_'), 'full sweep lost KNOWN LIVE @longgiatien'
          assert any(e.get('known') and e.get('live') for e in (row.get('evidence') or [])), 'no positive LIVE evidence for @longgiatien'

          items=allst.get('items') or []
          handles=[str(x.get('handle') or '').lower() for x in items if x.get('handle')]
          assert len(handles)==allst.get('total'), 'total mismatch'
          assert len(handles)==len(set(handles)), 'duplicate handle in exhaustive LIVE table'
          print('PASS longgiatien detected and exhaustive scan returned',len(handles),'unique selected handles')
          PY
