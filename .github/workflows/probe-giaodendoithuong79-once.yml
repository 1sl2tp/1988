name: Probe giaodendoithuong79 LIVE once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-giaodendoithuong79-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe backend and TikTok
        shell: bash
        run: |
          python3 -m pip install -q -U yt-dlp
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          import yt_dlp

          HANDLE='giaodendoithuong79'
          BASE='https://one988-tiktok-session.onrender.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'

          def inspect_flv(data):
              if len(data)<13 or data[:3] != b'FLV':
                  return False, False, False
              offset=int.from_bytes(data[5:9],'big') or 9
              offset += 4
              video=audio=False
              tags=0
              while offset+11 <= len(data) and tags < 64:
                  typ=data[offset]
                  size=(data[offset+1]<<16)|(data[offset+2]<<8)|data[offset+3]
                  if typ==9: video=True
                  if typ==8: audio=True
                  tags += 1
                  nxt=offset+11+size+4
                  if nxt<=offset or nxt>len(data): break
                  offset=nxt
                  if video and audio: break
              return True, video, audio

          # Backend snapshot
          try:
              req=urllib.request.Request(BASE+'/tiktok/live-now?t=probe',headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=25) as r:
                  payload=json.load(r)
              rows=[x for x in payload.get('items',[]) if str(x.get('handle','')).lower()==HANDLE]
              print('SNAPSHOT',json.dumps(rows,ensure_ascii=False))
              row=rows[0] if rows else {}
              stream=row.get('streamUrl') or ''
              if stream:
                  req=urllib.request.Request(BASE+stream,headers={'User-Agent':UA,'Range':'bytes=0-262143','Accept':'*/*'})
                  try:
                      with urllib.request.urlopen(req,timeout=20) as r:
                          data=r.read(262144)
                          print('BACKEND_STREAM','status',r.status,'ctype',r.headers.get('content-type'),'bytes',len(data),'inspect',inspect_flv(data))
                  except Exception as e:
                      print('BACKEND_STREAM_ERROR',repr(e))
              else:
                  print('BACKEND_STREAM','none')
          except Exception as e:
              print('SNAPSHOT_ERROR',repr(e))

          # Direct TikTok API user/room
          try:
              api='https://www.tiktok.com/api-live/user/room?aid=1988&sourceType=54&uniqueId='+HANDLE
              req=urllib.request.Request(api,headers={
                  'User-Agent':UA,'Referer':'https://www.tiktok.com/@'+HANDLE+'/live',
                  'Accept':'application/json,text/plain,*/*','Accept-Language':'vi-VN,vi;q=0.9,en;q=0.5'
              })
              with urllib.request.urlopen(req,timeout=15) as r:
                  data=json.load(r)
              room=(data.get('data') or {}).get('liveRoom') or {}
              print('USER_ROOM_STATUS',room.get('status'),'roomId',room.get('roomId') or room.get('id'))
              raw=((room.get('streamData') or {}).get('pull_data') or {}).get('stream_data')
              print('USER_ROOM_HAS_STREAM_DATA',bool(raw))
          except Exception as e:
              print('USER_ROOM_ERROR',repr(e))

          # yt-dlp direct
          url='https://www.tiktok.com/@'+HANDLE+'/live'
          try:
              with yt_dlp.YoutubeDL({'quiet':True,'no_warnings':True,'skip_download':True,'socket_timeout':10,'retries':0,'extractor_retries':0,'user_agent':UA,'noplaylist':True}) as ydl:
                  info=ydl.extract_info(url,download=False) or {}
              print('YTDLP_LIVE',info.get('is_live'),info.get('live_status'))
              for f in info.get('formats') or []:
                  u=str(f.get('url') or '')
                  ext=str(f.get('ext') or '').lower()
                  container=str(f.get('container') or '').lower()
                  fid=str(f.get('format_id') or '')
                  if ext=='flv' or container=='flv' or fid.lower().startswith('flv-') or '.flv' in u.lower():
                      print('FORMAT',fid,f.get('vcodec'),f.get('width'),f.get('height'),f.get('tbr'),urllib.parse.urlsplit(u).hostname,urllib.parse.urlsplit(u).path[-90:])
          except Exception as e:
              print('YTDLP_ERROR',repr(e))
          PY
