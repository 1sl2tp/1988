name: Probe TikTok VOD Player Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-player-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and verify direct TikTok playback
        shell: bash
        run: |
          set -euo pipefail
          API='https://one988-tiktok-session.onrender.com'

          for HANDLE in vtv24news ngoctrinh89; do
            echo "=== request refresh: $HANDLE ==="
            curl -fsS "$API/tiktok/channel-videos?user=$HANDLE&refresh=1" >/tmp/refresh.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/refresh.json'))
          print('before',d.get('handle'),d.get('status'),d.get('latestVideoId'))
          PY
          done

          # Refresh runs serialized in the collector. Give both selected
          # channels enough time to update and sync the canonical package.
          sleep 18

          python3 - <<'PY'
          import json, urllib.request, urllib.parse, pathlib
          API='https://one988-tiktok-session.onrender.com'
          for handle in ['vtv24news','ngoctrinh89']:
              q=urllib.parse.urlencode({'user':handle,'refresh':'0'})
              req=urllib.request.Request(API+'/tiktok/channel-videos?'+q,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  d=json.load(r)
              rows=sorted(d.get('videos') or [],key=lambda v:int(v.get('createTime') or 0),reverse=True)
              v=rows[0] if rows else {}
              print('HANDLE='+handle)
              print('STATUS='+str(d.get('status')))
              print('ID='+str(v.get('id')))
              print('PLAY='+str(v.get('playUrl') or '')[:220])
              pathlib.Path('/tmp/url-'+handle).write_text(str(v.get('playUrl') or ''))
          PY

          test_one () {
            local handle="$1"
            local file="/tmp/url-$handle"
            [ -s "$file" ] || { echo "NO URL $handle"; return 1; }
            local url="$(cat "$file")"
            echo "=== CURL $handle ==="
            curl -L -sS -D "/tmp/h-$handle" -o "/tmp/b-$handle" --range 0-65535               -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/136.0.0.0 Safari/537.36'               -e 'https://yt.taphoa.xyz/' "$url" || true
            head -24 "/tmp/h-$handle"
            file "/tmp/b-$handle" || true
            wc -c "/tmp/b-$handle" || true

            python3 - "$handle" "$file" <<'PY'
          import sys
          handle,path=sys.argv[1:3]
          u=open(path).read()
          page=f'''<!doctype html><meta charset="utf-8"><video id="v" playsinline preload="metadata"></video><pre id="o">boot</pre>
          <script>
          const v=document.getElementById('v'),o=document.getElementById('o');
          const log=s=>o.textContent+='\\n'+s+' rs='+v.readyState+' ns='+v.networkState+' err='+(v.error?.code||0)+' t='+v.currentTime+' d='+v.duration;
          ['loadstart','loadedmetadata','loadeddata','canplay','playing','waiting','stalled','error','pause'].forEach(e=>v.addEventListener(e,()=>log(e)));
          v.src={u!r};v.load();v.play().then(()=>log('play-ok')).catch(e=>log('play-reject '+e.name+':'+e.message));
          setTimeout(()=>log('after-6s'),6000);
          </script>'''
          open('/tmp/probe-'+handle+'.html','w').write(page)
          PY
            echo "=== CHROME $handle ==="
            google-chrome --headless=new --no-sandbox --disable-gpu               --autoplay-policy=no-user-gesture-required               --virtual-time-budget=8000               --dump-dom "file:///tmp/probe-$handle.html" 2>/tmp/chrome.err | grep -A16 '<pre id="o">' | head -24 || true
          }

          test_one vtv24news
          test_one ngoctrinh89
