name: Probe Supabase app paths once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-supabase-app-paths-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe frontend Supabase paths
        shell: bash
        run: |
          python3 - <<'PY'
          import re, requests, urllib.parse
          S=requests.Session()
          S.headers['User-Agent']='Mozilla/5.0'
          sites=['https://app.taphoa.xyz','https://chat.taphoa.xyz','https://get.taphoa.xyz','https://yt.taphoa.xyz']
          project='https://gcnoahqsrquxkwkjbuxy.supabase.co'

          def bundle_text(site):
              r=S.get(site,timeout=15)
              html=r.text
              texts=[html]
              srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
              for src in srcs[:12]:
                  u=urllib.parse.urljoin(site+'/',src)
                  try:
                      rr=S.get(u,timeout=15)
                      if rr.ok and len(rr.content)<8_000_000:
                          texts.append(rr.text)
                  except Exception:
                      pass
              return '\n'.join(texts)

          key=None
          for site in sites:
              try:
                  text=bundle_text(site)
                  print('SITE_BUNDLE',site,'bytes',len(text),'projectRef',('gcnoahqsrquxkwkjbuxy' in text))
                  # New publishable keys or legacy anon JWTs.
                  m=re.search(r'(sb_publishable_[A-Za-z0-9._-]{20,})',text)
                  if not m:
                      # JWT beginning eyJ... near the project reference / supabase config.
                      candidates=re.findall(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',text)
                      for x in candidates:
                          if len(x)>100:
                              m=type('M',(),{'group':lambda self,n,x=x:x})()
                              break
                  if m and not key:
                      key=m.group(1)
                      print('KEY_FOUND',site,'kind',('publishable' if key.startswith('sb_publishable_') else 'jwt'),'len',len(key))
              except Exception as e:
                  print('SITE_BUNDLE_ERROR',site,repr(e))

          if not key:
              print('NO_PUBLIC_KEY_FOUND')
              raise SystemExit(0)

          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'}

          # Auth password path should return quickly with 400 for fake credentials,
          # not 5xx/timeout.
          try:
              r=S.post(project+'/auth/v1/token?grant_type=password',headers=headers,
                       json={'email':'probe-do-not-exist-1988@example.invalid','password':'not-a-real-password'},
                       timeout=15)
              print('AUTH_PASSWORD','status',r.status_code,'seconds',round(r.elapsed.total_seconds(),3),'body',r.text[:180].replace('\n',' '))
          except Exception as e:
              print('AUTH_PASSWORD_ERROR',repr(e))

          probes=[
            ('chat','v21_messages','id'),
            ('sales','taphoa_products','id'),
            ('youtube','yt1988_packages','scope'),
            ('getlink','getlink_links','id'),
            ('tiktok','yt1988_tiktok_library_package','package_key')
          ]
          for name,table,col in probes:
              try:
                  u=project+'/rest/v1/'+table+'?select='+urllib.parse.quote(col,safe='')+'&limit=1'
                  r=S.get(u,headers=headers,timeout=15)
                  print('REST',name,table,'status',r.status_code,'seconds',round(r.elapsed.total_seconds(),3),
                        'range',r.headers.get('content-range'),'body',r.text[:160].replace('\n',' '))
              except Exception as e:
                  print('REST_ERROR',name,table,repr(e))
          PY
