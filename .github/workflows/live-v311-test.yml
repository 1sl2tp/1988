name: Test LIVE v311 branch

on:
  push:
    branches:
      - feature/live-keywords-v311

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integration shape
        run: node tests/integration-shape.test.cjs .
      - name: Syntax
        run: |
          node --check src/app.js
          node tests/media-core.test.cjs
          node tests/backend-media-proxy.test.cjs
