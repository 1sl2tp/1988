name: Test LIVE manager v317
on:
  push:
    branches:
      - feature/live-manager-union-v317
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/integration-shape.test.cjs .
      - run: node --check src/app.js
      - run: node tests/media-core.test.cjs
      - run: node tests/backend-media-proxy.test.cjs
