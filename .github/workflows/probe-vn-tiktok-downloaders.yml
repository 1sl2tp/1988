name: Probe VN TikTok downloaders once v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vn-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect SSSTik and SnapTik VN endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse, json, http.cookiejar
          VIDEO='https://www.tiktok.com/@giadinhnhaman/video/7691953502813293832'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36'

          def get(url,opener=None):
              op=opener or urllib.request.build_opener()
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/json,*/*'})
              with op.open(req,timeout=25) as r:
                  return r.status,r.geturl(),r.headers,r.read()

          def post(url,data,headers=None,opener=None):
              op=opener or urllib.request.build_opener()
              h={'User-Agent':ua,'Accept':'text/html,application/json,*/*','Content-Type':'application/x-www-form-urlencoded'}
              h.update(headers or {})
              req=urllib.request.Request(url,data=urllib.parse.urlencode(data).encode(),headers=h,method='POST')
              with op.open(req,timeout=30) as r:
                  return r.status,r.geturl(),r.headers,r.read()

          # SSSTik: inspect JS then try likely submit endpoints from JS.
          print('\n### SSSTIK')
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          st,final,headers,body=get('https://ssstik.vn/',op)
          text=body.decode('utf-8','ignore')
          token=(re.search(r'name="_token"\s+value="([^"]+)"',text) or [None,''])[1]
          src=(re.search(r'<script[^>]+src="(https://ssstik\.vn/build/assets/[^"]+\.js)"',text) or [None,''])[1]
          print('home',st,'token',bool(token),'js',src)
          if src:
              js=get(src,op)[3].decode('utf-8','ignore')
              for pat in [r'fetch\([^\n]{0,350}',r'axios[^\n]{0,350}',r'["\']/[^"\']*(?:download|api|ajax|process|tiktok)[^"\']*["\']']:
                  for m in re.findall(pat,js,re.I)[:40]:
                      print('JS',m[:600])
              paths=sorted(set(re.findall(r'["\'](/[^"\']{1,120})["\']',js)))
              print('PATHS',[p for p in paths if any(k in p.lower() for k in ['download','api','ajax','process','tiktok'])][:80])

          # Try same-origin POST root using observed form fields.
          for endpoint in ['https://ssstik.vn/','https://ssstik.vn/download','https://ssstik.vn/api/download']:
              try:
                  st,final,h,b=post(endpoint,{'_token':token,'source_page':'homepage','locale':'vi','url':VIDEO},{'Referer':'https://ssstik.vn/'},op)
                  t=b.decode('utf-8','ignore')
                  urls=re.findall(r'https?://[^"\'\s<>]+',html.unescape(t))
                  media=[u for u in urls if any(k in u.lower() for k in ['.mp4','tiktokcdn','byteoversea','download'])]
                  print('POST',endpoint,'status',st,'final',final,'ct',h.get('content-type'),'len',len(b),'media',media[:8])
              except Exception as e:
                  print('POST',endpoint,'ERR',type(e).__name__,str(e)[:200])

          # VN SnapTik: inspect JS and submit GET form with token.
          print('\n### VN.SNAPTIK.COM')
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          st,final,headers,body=get('https://vn.snaptik.com/',op)
          text=body.decode('utf-8','ignore')
          token=(re.search(r'name="token"\s+value="([^"]+)"',text) or [None,''])[1]
          print('home',st,'token',token[:24] if token else '')
          try:
              js=get('https://vn.snaptik.com/main.js?v=2.02',op)[3].decode('utf-8','ignore')
              for pat in [r'fetch\([^\n]{0,350}',r'ajax[^\n]{0,350}',r'["\']/[^"\']*(?:download|api|ajax|process)[^"\']*["\']']:
                  for m in re.findall(pat,js,re.I)[:50]:
                      print('JS',m[:600])
          except Exception as e:
              print('JS ERR',type(e).__name__,str(e)[:200])

          qs=urllib.parse.urlencode({'url':VIDEO,'token':token})
          for endpoint in ['https://vn.snaptik.com/?'+qs,'https://vn.snaptik.com/action?'+qs]:
              try:
                  st,final,h,b=get(endpoint,op)
                  t=b.decode('utf-8','ignore')
                  urls=re.findall(r'https?://[^"\'\s<>]+',html.unescape(t))
                  media=[u for u in urls if any(k in u.lower() for k in ['.mp4','tiktokcdn','byteoversea','download'])]
                  print('GET',endpoint.split('?')[0],'status',st,'final',final,'ct',h.get('content-type'),'len',len(b),'media',media[:8])
              except Exception as e:
                  print('GET',endpoint.split('?')[0],'ERR',type(e).__name__,str(e)[:200])
          PY
