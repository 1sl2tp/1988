name: Probe VN TikTok downloaders once v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vn-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify VN downloader endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse, json, http.cookiejar, uuid
          VIDEO='https://www.tiktok.com/@giadinhnhaman/video/7691953502813293832'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36'

          def call(url,method='GET',body=None,headers=None,op=None):
              op=op or urllib.request.build_opener()
              h={'User-Agent':ua,'Accept':'text/html,application/json,*/*'}
              h.update(headers or {})
              req=urllib.request.Request(url,data=body,headers=h,method=method)
              with op.open(req,timeout=30) as r:
                  return r.status,r.geturl(),r.headers,r.read()

          def multipart(fields):
              boundary='----1988'+uuid.uuid4().hex
              chunks=[]
              for k,v in fields.items():
                  chunks.append('--'+boundary+'\r\nContent-Disposition: form-data; name="'+k+'"\r\n\r\n'+str(v)+'\r\n')
              chunks.append('--'+boundary+'--\r\n')
              return ''.join(chunks).encode(), 'multipart/form-data; boundary='+boundary

          def inspect_site(name,url):
              print('\n###',name)
              cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              try:
                  st,final,h,b=call(url,op=op)
                  text=b.decode('utf-8','ignore')
                  print('home',st,'final',final,'len',len(text))
                  print('forms',re.findall(r'<form\b[^>]*>',text,re.I)[:10])
                  print('inputs',re.findall(r'<input\b[^>]*>',text,re.I)[:20])
                  scripts=re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',text,re.I)
                  print('scripts',scripts[:20])
                  for src in scripts:
                      if src.startswith('/'): src=urllib.parse.urljoin(final,src)
                      if not src.startswith('http'): continue
                      try:
                          js=call(src,op=op)[3].decode('utf-8','ignore')
                      except: continue
                      hits=[]
                      for pat in [r'fetch\([^\n]{0,500}',r'XMLHttpRequest[^\n]{0,500}',r'\.open\([^\n]{0,500}',r'axios\.(?:post|get)\([^\n]{0,500}',r'["\']/[^"\']*(?:api|download|ajax|process|convert|extract)[^"\']*["\']']:
                          hits += re.findall(pat,js,re.I)
                      if hits:
                          print('SCRIPT',src)
                          for x in hits[:50]: print('JS',x[:700])
                  return op,text,final
              except Exception as e:
                  print('ERR',type(e).__name__,str(e)[:300])
                  return None,'',url

          # vn.snaptik.com actual POST /abc2.php
          print('### VN.SNAPTIK.COM POST')
          op,text,final=inspect_site('VN.SNAPTIK.HOME','https://vn.snaptik.com/')
          if op:
              token=(re.search(r'name="token"\s+value="([^"]+)"',text) or [None,''])[1]
              body,ctype=multipart({'url':VIDEO,'token':token})
              try:
                  st,final,h,b=call('https://vn.snaptik.com/abc2.php','POST',body,{
                      'Content-Type':ctype,'Referer':'https://vn.snaptik.com/','Origin':'https://vn.snaptik.com'
                  },op)
                  t=b.decode('utf-8','ignore')
                  print('ABC2 status',st,'ct',h.get('content-type'),'len',len(t))
                  print('ABC2 BODY',t[:5000])
                  urls=re.findall(r'https?://[^"\'\s<>\\]+',html.unescape(t))
                  print('ABC2 MEDIA',[u for u in urls if any(k in u.lower() for k in ['.mp4','tiktokcdn','byteoversea','download','snaptik'])][:20])
              except Exception as e:
                  print('ABC2 ERR',type(e).__name__,str(e)[:300])
                  if hasattr(e,'read'):
                      try: print('ABC2 ERRBODY',e.read().decode('utf-8','ignore')[:3000])
                      except: pass

          inspect_site('VIESNAP','https://viesnap.com/')
          inspect_site('TAIVIDEO','https://taivideo.vn/')
          inspect_site('SNAPTIKVN.APP','https://snaptikvn.app/')
          PY
