name: Probe VN TikTok downloaders once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vn-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect downloader forms and endpoints
        shell: bash
        run: |
          set -euo pipefail
          VIDEO='https://www.tiktok.com/@giadinhnhaman/video/7691953502813293832'
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse, json
          sites=[
            ("snaptik.vn","https://snaptik.vn/"),
            ("ssstik.vn","https://ssstik.vn/"),
            ("vn.snaptik.com","https://vn.snaptik.com/")
          ]
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36"
          for name,url in sites:
            print("\n###",name)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":ua,"Accept":"text/html,*/*"})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode("utf-8","ignore")
                print("status",r.status,"final",r.geturl(),"len",len(body))
                forms=re.findall(r'<form\b[^>]*>',body,re.I)
                inputs=re.findall(r'<input\b[^>]*>',body,re.I)
                scripts=re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',body,re.I)
                print("forms",forms[:8])
                print("inputs",inputs[:20])
                print("scripts",scripts[:20])
                hits=[]
                for pat in [
                  r'https?://[^"\'\s<>]+',
                  r'fetch\([^\n]{0,240}',
                  r'axios[^\n]{0,240}',
                  r'/api/[^"\'\s<>]+',
                  r'action=["\'][^"\']+'
                ]:
                  hits+=re.findall(pat,body,re.I)
                for h in hits[:60]:
                  if any(k in str(h).lower() for k in ["api","download","ajax","fetch","action","snaptik","ssstik"]):
                    print("HIT",html.unescape(str(h))[:500])
            except Exception as e:
              print("ERROR",type(e).__name__,str(e)[:300])
          PY
