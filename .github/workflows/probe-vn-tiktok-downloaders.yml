name: Probe VN TikTok downloaders once v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-vn-tiktok-downloaders.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify SSSTik API and SnapTik VN JS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, html, urllib.request, urllib.parse, json, http.cookiejar
          VIDEO='https://www.tiktok.com/@giadinhnhaman/video/7691953502813293832'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36'

          def req(url,method='GET',data=None,headers=None,opener=None):
              op=opener or urllib.request.build_opener()
              h={'User-Agent':ua,'Accept':'text/html,application/json,*/*'}
              h.update(headers or {})
              body=None if data is None else data
              r=urllib.request.Request(url,data=body,headers=h,method=method)
              with op.open(r,timeout=30) as x:
                  return x.status,x.geturl(),x.headers,x.read()

          print('### SSSTIK JSON API')
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          st,final,h,b=req('https://ssstik.vn/',opener=op)
          home=b.decode('utf-8','ignore')
          token=(re.search(r'<meta[^>]+name=["\']csrf-token["\'][^>]+content=["\']([^"\']+)',home,re.I)
                 or re.search(r'name="_token"\s+value="([^"]+)"',home) or [None,''])[1]
          payload=json.dumps({'url':VIDEO,'source_page':'homepage','locale':'vi'}).encode()
          try:
              st,final,h,b=req('https://ssstik.vn/api/download','POST',payload,{
                  'Content-Type':'application/json',
                  'X-CSRF-TOKEN':token,
                  'X-Requested-With':'XMLHttpRequest',
                  'Referer':'https://ssstik.vn/'
              },op)
              print('status',st,'ct',h.get('content-type'),'len',len(b))
              t=b.decode('utf-8','ignore')
              print('BODY',t[:4000])
              urls=re.findall(r'https?://[^"\'\s<>\\]+',html.unescape(t))
              print('MEDIA',[u for u in urls if any(k in u.lower() for k in ['.mp4','tiktokcdn','byteoversea','download'])][:12])
          except Exception as e:
              print('ERR',type(e).__name__,str(e)[:300])
              if hasattr(e,'read'):
                  try: print('ERRBODY',e.read().decode('utf-8','ignore')[:2500])
                  except: pass

          print('\n### VN SNAPTik JS CONTEXT')
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          st,final,h,b=req('https://vn.snaptik.com/',opener=op)
          home=b.decode('utf-8','ignore')
          token=(re.search(r'name="token"\s+value="([^"]+)"',home) or [None,''])[1]
          st,final,h,b=req('https://vn.snaptik.com/main.js?v=2.02',opener=op)
          js=b.decode('utf-8','ignore')
          for m in re.finditer(r'fetch\(',js):
              a=max(0,m.start()-900); z=min(len(js),m.start()+1800)
              print('CTX',js[a:z])
          for term in ['formurl','token','result','download']:
              for m in list(re.finditer(term,js,re.I))[:8]:
                  a=max(0,m.start()-500); z=min(len(js),m.start()+900)
                  print('TERM',term,js[a:z])
          PY
