name: Audit TikTok live-now truth once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tiktok-live-now-truth-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare retained snapshot with fresh status and media liveness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, concurrent.futures, time
          EDGE='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev'
          TARGET='giaodendoithuong79'
          def get_json(url,timeout=20):
              req=urllib.request.Request(url,headers={'User-Agent':'1988-live-audit/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.load(r)
          def fresh(handle):
              try:
                  return get_json(EDGE+'/lookup?user='+urllib.parse.quote(handle)+'&t='+str(int(time.time()*1000)),15)
              except Exception as e:
                  return {'ok':False,'handle':handle,'error':type(e).__name__+':'+str(e)}
          def media_probe(item):
              url=item.get('streamUrl') or item.get('hlsUrl') or ''
              h=item.get('handle') or ''
              if not url:return (h,False,'no_url')
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0',
                  'Referer':'https://www.tiktok.com/@'+h+'/live',
                  'Range':'bytes=0-65535',
                  'Accept':'*/*'
              })
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      status=getattr(r,'status',200)
                      typ=r.headers.get('content-type','')
                      data=r.read(4096)
                      return (h,status in (200,206) and len(data)>0,f'{status} {typ} bytes={len(data)}')
              except Exception as e:
                  return (h,False,type(e).__name__+':'+str(e))
          snap=get_json(EDGE+'/tiktok/live-now?t='+str(int(time.time()*1000)))
          items=snap.get('items') or []
          print('SNAP_LIVE',snap.get('live'),'ITEMS',len(items),'SELECTED',snap.get('total'),'CHECKED_AT',snap.get('checkedAt'))
          print('SNAP_HANDLES',','.join(x.get('handle','') for x in items))
          target=fresh(TARGET)
          print('TARGET_FRESH',json.dumps(target,separators=(',',':')))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              fresh_rows=list(ex.map(lambda it:(it.get('handle',''),fresh(it.get('handle',''))),items))
          stale=[]
          fresh_live=[]
          for h,row in fresh_rows:
              status=row.get('status')
              live=bool(row.get('live')) or status==2
              playable=bool(row.get('streamUrl') or row.get('hlsUrl'))
              if live: fresh_live.append(h)
              if not live: stale.append((h,status,row.get('source'),row.get('error')))
              print('FRESH',h,'status=',status,'live=',live,'playable=',playable,'source=',row.get('source'),'err=',row.get('error'))
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              probes=list(ex.map(media_probe,items))
          dead=[]
          for h,ok,detail in probes:
              print('MEDIA',h,'alive=',ok,detail)
              if not ok: dead.append((h,detail))
          print('FRESH_LIVE_COUNT_FROM_SNAPSHOT_HANDLES',len(fresh_live))
          print('STALE_API_COUNT',len(stale),json.dumps(stale,separators=(',',':')))
          print('DEAD_MEDIA_COUNT',len(dead),json.dumps(dead,separators=(',',':')))
          PY
