name: Probe TikTok VOD Render Pool

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-render-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Render resolvers and returned media
        shell: bash
        run: |
          set -u
          API='https://one988-tiktok-session.onrender.com'
          USER='haighepdoi89hy'
          ID='7689893872066940180'
          for SOURCE in tikwm tikdownloaderio ssstik musicaldownapi tikdownorg ttdownloader downtik tdown tiklydown douyinwtf; do
            echo "===== $SOURCE ====="
            URL="$API/tiktok/vod-resolve?user=$USER&id=$ID&source=$SOURCE&refresh=1"
            rm -f /tmp/r.json /tmp/h.txt /tmp/b.bin
            CODE=$(curl -sS --max-time 35 -o /tmp/r.json -w '%{http_code}' "$URL" || true)
            echo "resolver_http=$CODE"
            cat /tmp/r.json || true
            echo
            DIRECT=$(jq -r '.directUrl // empty' /tmp/r.json 2>/dev/null || true)
            if [ -z "$DIRECT" ]; then
              echo "direct=EMPTY"
              continue
            fi
            echo "direct_host=$(python3 - "$DIRECT" <<'PY'
          import sys,urllib.parse
          print(urllib.parse.urlparse(sys.argv[1]).netloc)
          PY
          )"
            curl -sS --max-time 30 -r 0-65535 -D /tmp/h.txt "$DIRECT" -o /tmp/b.bin || true
            STATUS=$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END{print s}' /tmp/h.txt 2>/dev/null || true)
            TYPE=$(awk -F': ' 'tolower($1)=="content-type"{gsub("\r","",$2);t=$2} END{print t}' /tmp/h.txt 2>/dev/null || true)
            RANGE=$(awk -F': ' 'tolower($1)=="content-range"{gsub("\r","",$2);t=$2} END{print t}' /tmp/h.txt 2>/dev/null || true)
            BYTES=$(wc -c </tmp/b.bin 2>/dev/null || echo 0)
            echo "media_status=$STATUS type=$TYPE range=$RANGE bytes=$BYTES"
            file /tmp/b.bin || true
          done
