name: Smoke NewPipe WASM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Run NewPipe WASM in real Chrome
        run: |
          set -e
          mkdir -p /tmp/np
          curl -fsSL 'https://raw.githubusercontent.com/thegrims/newpipe-extractor-wasm/main/browser-wrapper/webdemo/browser-wrapper.wasm-runtime.js' -o /tmp/np/browser-wrapper.wasm-runtime.js
          curl -fsSL 'https://raw.githubusercontent.com/thegrims/newpipe-extractor-wasm/main/browser-wrapper/webdemo/browser-wrapper.wasm' -o /tmp/np/browser-wrapper.wasm
          cat >/tmp/np/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <script src="browser-wrapper.wasm-runtime.js"></script>
          <pre id="out">loading</pre>
          <script>
          (async()=>{
            const q=new URLSearchParams(location.search);
            const relay=q.get('relay')||'';
            const t=performance.now();
            try {
              const teavm=await TeaVM.wasmGC.load('browser-wrapper.wasm');
              const media=teavm.exports.getFirstProgressiveStreamUrl(relay,'https://www.youtube.com/watch?v=dQw4w9WgXcQ');
              document.getElementById('out').textContent=JSON.stringify({ok:!String(media).startsWith('ERROR:'),ms:Math.round(performance.now()-t),media:String(media).slice(0,240)});
            } catch(e) {
              document.getElementById('out').textContent=JSON.stringify({ok:false,ms:Math.round(performance.now()-t),error:String(e)});
            }
          })();
          </script>
          HTML
          cd /tmp/np
          python3 -m http.server 8934 >/tmp/http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "CHROME=$CHROME"
          test -n "$CHROME"
          for RELAY in             'https://api.cors.syrins.tech/?url='             'https://api.allorigins.win/raw?url='
          do
            echo "=== RELAY $RELAY ==="
            ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$RELAY")
            timeout 35s "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage               --virtual-time-budget=30000 "http://127.0.0.1:8934/?relay=$ENC" --dump-dom 2>/tmp/chrome.err | grep -o '<pre id="out">[^<]*' || true
            tail -20 /tmp/chrome.err || true
          done
