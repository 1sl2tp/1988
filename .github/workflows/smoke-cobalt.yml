name: Smoke Cobalt Proxy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cobalt local-processing streams
        run: |
          set -e
          BODY='{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ","videoQuality":"360","youtubeVideoCodec":"h264","youtubeVideoContainer":"mp4","downloadMode":"auto","alwaysProxy":true,"localProcessing":"forced"}'
          curl -sS -L --max-time 30 -X POST 'https://cobaltapi.cjs.nz/' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$BODY" -o /tmp/out.json
          cat /tmp/out.json
          echo
          echo "STATUS=$(jq -r '.status // ""' /tmp/out.json)"
          echo "TYPE=$(jq -r '.type // ""' /tmp/out.json)"
          jq -r '.tunnel[]? // empty' /tmp/out.json > /tmp/tunnels
          i=0
          while IFS= read -r URL; do
            i=$((i+1))
            echo "=== TUNNEL $i ==="
            echo "$URL"
            curl -sS -L --max-time 30 -D "/tmp/h$i" -o "/tmp/b$i" -H 'Range: bytes=0-1023' "$URL"
            cat "/tmp/h$i"
            echo "BYTES=$(wc -c <"/tmp/b$i")"
            echo "FIRST=$(xxd -l 32 -p "/tmp/b$i")"
          done < /tmp/tunnels
