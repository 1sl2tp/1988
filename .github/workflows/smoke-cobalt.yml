name: Probe Official Invidious Progressive Sources

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test official Invidious instances
        run: |
          set +e
          python - <<'PY'
          import json, subprocess, urllib.parse, os
          hosts=[
            'https://inv.nadeko.net',
            'https://invidious.nerdvpn.de',
            'https://yt.chocolatemoo53.com',
            'https://invidious.tiekoetter.com',
          ]
          for base in hosts:
            out='/tmp/inv.json'
            try:
              stat=subprocess.check_output(['curl','-sS','-L','--max-time','18','-o',out,'-w','%{http_code} %{time_total} %{size_download}',base+'/api/v1/videos/dQw4w9WgXcQ'],stderr=subprocess.DEVNULL,text=True).strip()
            except subprocess.CalledProcessError:
              stat='ERR'
            try:
              data=json.load(open(out))
            except Exception:
              data={}
            fmts=data.get('formatStreams') or []
            adp=data.get('adaptiveFormats') or []
            print('INSTANCE',base,'HTTP',stat,'FMT',len(fmts),'ADP',len(adp),'ERROR',data.get('error'))
            for fmt in fmts[:3]:
              url=str(fmt.get('url') or '')
              print(' FORMAT',fmt.get('itag'),fmt.get('qualityLabel') or fmt.get('quality'),urllib.parse.urlparse(url).netloc)
              if not url: continue
              h='/tmp/rh'; b='/tmp/rb'
              try:
                rstat=subprocess.check_output(['curl','-sS','-L','--max-time','18','-D',h,'-o',b,'-H','Range: bytes=0-1023','-w','%{http_code} %{time_total} %{size_download}',url],stderr=subprocess.DEVNULL,text=True).strip()
              except subprocess.CalledProcessError:
                rstat='ERR'
              headers=open(h,errors='ignore').read() if os.path.exists(h) else ''
              print(' RANGE',rstat,'HEAD',headers.splitlines()[0] if headers else '')
              if rstat.startswith('206'):
                print('WINNER',base,'URL',url)
                raise SystemExit(0)
          PY
