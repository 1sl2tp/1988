name: Smoke Cobalt Proxy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test private Cobalt HLS proxy
        run: |
          set -e
          URL='https://kira-proxy-1988-us.onrender.com/api/cobalt?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DdQw4w9WgXcQ&videoQuality=360&youtubeHLS=true&alwaysProxy=true'
          curl -sS -L --max-time 30 "$URL" -o /tmp/out.json
          cat /tmp/out.json
          echo
          STATUS="$(jq -r '.status // ""' /tmp/out.json)"
          MEDIA="$(jq -r '.url // ""' /tmp/out.json)"
          echo "STATUS=$STATUS"
          echo "MEDIA=$MEDIA"
          test -n "$MEDIA"
          echo '=== MEDIA HEADERS ==='
          curl -sS -L --max-time 30 -D /tmp/h -o /tmp/body "$MEDIA"
          cat /tmp/h
          echo '=== FIRST BYTES ==='
          head -c 500 /tmp/body | tr '\n' ' '
          echo
