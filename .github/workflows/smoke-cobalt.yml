name: Probe Direct Browser YouTubei

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test direct browser calls to YouTubei
        run: |
          set -e
          mkdir -p /tmp/ytb
          cat >/tmp/ytb/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><pre id="out">loading</pre>
          <script>
          (async()=>{
            const out={};
            try {
              const r=await fetch('https://youtubei.googleapis.com/youtubei/v1/player?key=AIzaSyDCU8hByM-4DrUqRUYnGn-3llEO78bcxq8&prettyPrint=false',{
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({
                  context:{client:{clientName:'WEB',clientVersion:'2.20250222.10.00',hl:'en',gl:'US'}},
                  videoId:'dQw4w9WgXcQ',
                  contentCheckOk:true,
                  racyCheckOk:true
                })
              });
              out.player={ok:r.ok,status:r.status,type:r.type,acao:r.headers.get('access-control-allow-origin'),text:(await r.text()).slice(0,600)};
            } catch(e) { out.player={error:String(e)}; }
            try {
              const r=await fetch('https://www.youtube.com/watch?v=dQw4w9WgXcQ');
              out.watch={ok:r.ok,status:r.status,type:r.type,acao:r.headers.get('access-control-allow-origin'),text:(await r.text()).slice(0,120)};
            } catch(e) { out.watch={error:String(e)}; }
            document.getElementById('out').textContent=JSON.stringify(out);
          })();
          </script>
          HTML
          cd /tmp/ytb
          python3 -m http.server 8934 >/tmp/http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome)"
          "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --virtual-time-budget=15000             'http://127.0.0.1:8934/' --dump-dom 2>/tmp/chrome.err | grep -o '<pre id="out">[^<]*' || true
          tail -30 /tmp/chrome.err || true
