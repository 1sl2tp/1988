name: TikTok FLV Diagnose Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tiktok-flv-diagnose-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe current backend streams
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse

          BASE='https://one988-tiktok-session.onrender.com'
          TARGETS=['giaodendoithuong79','ongbodien']

          def inspect_flv(data):
              if len(data)<13 or data[:3] != b'FLV':
                  return False, False, False
              offset=int.from_bytes(data[5:9],'big') or 9
              offset += 4
              video=audio=False
              tags=0
              while offset+11 <= len(data) and tags < 64:
                  typ=data[offset]
                  size=(data[offset+1]<<16)|(data[offset+2]<<8)|data[offset+3]
                  if typ == 9: video=True
                  if typ == 8: audio=True
                  tags += 1
                  nxt=offset+11+size+4
                  if nxt<=offset or nxt>len(data): break
                  offset=nxt
                  if video and audio: break
              return True, video, audio

          try:
              req=urllib.request.Request(BASE+'/tiktok/live-now?diag=1',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  payload=json.load(r)
          except Exception as e:
              print('BACKEND live-now ERROR',repr(e))
              payload={}

          items={str(x.get('handle','')).lower():x for x in payload.get('items',[]) if isinstance(x,dict)}
          print('BACKEND summary total=',payload.get('total'),'live=',payload.get('live'),'checkedAt=',payload.get('checkedAt'))
          for handle in TARGETS:
              row=items.get(handle,{})
              print('BACKEND',handle,'detected=',row.get('detectedLive'),'playable=',row.get('playable'),
                    'type=',row.get('type'),'source=',row.get('source'),'quality=',row.get('quality'),
                    'codec=',row.get('videoCodec'),'path=',row.get('flvPath'),'sig=',row.get('sourceSig'))
              stream=row.get('streamUrl') or ''
              if not stream:
                  print('BACKEND_PROBE',handle,'NO_STREAM_URL')
                  continue
              try:
                  req=urllib.request.Request(
                      BASE+stream,
                      headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-262143','Accept':'*/*'}
                  )
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read(262144)
                      header,video,audio=inspect_flv(data)
                      print('BACKEND_PROBE',handle,'http=',r.status,'ctype=',r.headers.get('content-type'),
                            'bytes=',len(data),'flv_header=',header,'video=',video,'audio=',audio)
              except Exception as e:
                  print('BACKEND_PROBE',handle,'ERROR',repr(e))
          PY

      - name: Install yt-dlp
        run: python3 -m pip install -q -U yt-dlp

      - name: Enumerate and probe direct FLV formats
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse
          import yt_dlp

          TARGETS=['giaodendoithuong79','ongbodien']
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'

          def inspect_flv(data):
              if len(data)<13 or data[:3] != b'FLV':
                  return False, False, False
              offset=int.from_bytes(data[5:9],'big') or 9
              offset += 4
              video=audio=False
              tags=0
              while offset+11 <= len(data) and tags < 64:
                  typ=data[offset]
                  size=(data[offset+1]<<16)|(data[offset+2]<<8)|data[offset+3]
                  if typ == 9: video=True
                  if typ == 8: audio=True
                  tags += 1
                  nxt=offset+11+size+4
                  if nxt<=offset or nxt>len(data): break
                  offset=nxt
                  if video and audio: break
              return True, video, audio

          def score(f):
              vc=str(f.get('vcodec') or '').lower()
              codec=2 if any(x in vc for x in ('h264','avc','avc1')) else (0 if any(x in vc for x in ('h265','hevc','hev1','hvc1')) else 1)
              fid=str(f.get('format_id') or '').lower()
              audio=-1 if fid in ('ao','flv-ao') or 'audio' in fid else 0
              return (audio,codec,int(f.get('height') or 0),float(f.get('tbr') or 0))

          for handle in TARGETS:
              url=f'https://www.tiktok.com/@{handle}/live'
              print('\n=== DIRECT',handle,'===')
              opts={
                  'quiet':True,'no_warnings':True,'skip_download':True,
                  'socket_timeout':10,'retries':0,'extractor_retries':0,
                  'user_agent':UA,'noplaylist':True,
              }
              try:
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info=ydl.extract_info(url,download=False) or {}
              except Exception as e:
                  print('DIRECT_EXTRACT_ERROR',handle,repr(e))
                  continue

              formats=[]
              for f in info.get('formats') or []:
                  u=str(f.get('url') or '')
                  ext=str(f.get('ext') or '').lower()
                  fid=str(f.get('format_id') or '').lower()
                  container=str(f.get('container') or '').lower()
                  if ext=='flv' or container=='flv' or fid.startswith('flv-') or '.flv' in u.lower():
                      formats.append(f)
              formats.sort(key=score,reverse=True)
              print('DIRECT_FORMATS',handle,'count=',len(formats),'is_live=',info.get('is_live'),'live_status=',info.get('live_status'))

              for idx,f in enumerate(formats[:12],1):
                  u=str(f.get('url') or '')
                  p=urllib.parse.urlsplit(u)
                  label=(p.path.rsplit('/',1)[-1] or p.path)[-90:]
                  fid=str(f.get('format_id') or '')
                  vc=str(f.get('vcodec') or '')
                  w=int(f.get('width') or 0); h=int(f.get('height') or 0)
                  tbr=float(f.get('tbr') or 0)
                  try:
                      req=urllib.request.Request(u,headers={
                          'User-Agent':UA,'Referer':url,'Origin':'https://www.tiktok.com',
                          'Accept':'*/*','Range':'bytes=0-262143'
                      })
                      with urllib.request.urlopen(req,timeout=12) as r:
                          data=r.read(262144)
                          header,video,audio=inspect_flv(data)
                          print('FLV',idx,'id=',fid,'codec=',vc,'res=',f'{w}x{h}','tbr=',tbr,
                                'host=',p.hostname,'path=',label,'http=',r.status,'bytes=',len(data),
                                'flv_header=',header,'video=',video,'audio=',audio)
                  except Exception as e:
                      print('FLV',idx,'id=',fid,'codec=',vc,'res=',f'{w}x{h}','tbr=',tbr,
                            'host=',p.hostname,'path=',label,'ERROR=',repr(e))
          PY
