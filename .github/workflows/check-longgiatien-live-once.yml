name: Check longgiatien LIVE once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-longgiatien-live-once.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check current LIVE and FLV state
        shell: bash
        run: |
          set -e
          B="https://one988-tiktok-session.onrender.com"
          echo "=== CHECK LIVE ==="
          curl -fsS --max-time 90 "$B/tiktok/check-live?user=longgiatien&t=$(date +%s)"
          echo
          sleep 2
          echo "=== LIVE NOW ==="
          curl -fsS --max-time 45 "$B/tiktok/live-now?t=$(date +%s)" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(next((x for x in d.get("items",[]) if str(x.get("handle","")).lower()=="longgiatien"),None),ensure_ascii=False))'
          echo
