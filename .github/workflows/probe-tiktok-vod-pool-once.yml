name: Probe BHWA TikTok Profile
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BHWA profile parse
        shell: bash
        run: |
          set -u
          PROFILE='https://www.tiktok.com/@tu.thuong_lay_minh_1'
          echo "=== BHWA PROFILE ==="
          curl -sS --max-time 20 -D /tmp/h             "https://downloader-api.bhwa233.com/api/parse?url=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["PROFILE"], safe=""))' PROFILE="$PROFILE")"             -H 'User-Agent: Mozilla/5.0'             -o /tmp/body || true
          cat /tmp/h
          echo
          head -c 16000 /tmp/body
          echo
