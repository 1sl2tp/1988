name: Probe TikTok Canonical Channel Once
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger targeted refresh and verify canonical growth
        shell: bash
        run: |
          set -euo pipefail
          URL='https://one988-tiktok-session.onrender.com/tiktok/library?user=tu.thuong_lay_minh_1'
          curl -fsS --max-time 30 "$URL" -o /tmp/before.json
          sleep 22
          curl -fsS --max-time 30 "$URL" -o /tmp/after.json
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/before.json'))
          after=json.load(open('/tmp/after.json'))
          assert before.get('ok') is True
          assert after.get('ok') is True
          b=(before.get('channel') or {}).get('videos') or []
          a=(after.get('channel') or {}).get('videos') or []
          print('before='+str(len(b)))
          print('after='+str(len(a)))
          print('ids='+','.join(str(x.get('id') or '') for x in a))
          PY
