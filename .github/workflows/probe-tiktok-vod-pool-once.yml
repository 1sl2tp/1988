name: Probe TikTok TDown Direct
# manual-probe-trigger: 2026-10-04 tdown-direct-cors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe TDown direct API
        shell: bash
        run: |
          set -u
          PAGE='https://www.tiktok.com/@giadinhnhaman/video/7691953502813293832'
          URL="https://tdownv4.sl-bjs.workers.dev/?down=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["PAGE"], safe=""))' PAGE="$PAGE")"
          echo "URL=$URL"
          rm -f /tmp/tdown.h /tmp/tdown.body
          curl -sS --max-time 20 -D /tmp/tdown.h "$URL" -o /tmp/tdown.body || true
          echo "===== HEADERS ====="
          cat /tmp/tdown.h
          echo "===== BODY ====="
          head -c 3000 /tmp/tdown.body; echo
          echo "===== OPTIONS ====="
          curl -sS --max-time 20 -i -X OPTIONS "$URL"             -H 'Origin: https://yt.taphoa.xyz'             -H 'Access-Control-Request-Method: GET'             -H 'Access-Control-Request-Headers: content-type' | head -c 4000
