name: Probe TikTok RSS Bridge
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RSS-Bridge and rss2json
        shell: bash
        run: |
          set -u
          USER='%40tu.thuong_lay_minh_1'
          FEED="https://rss-bridge.org/bridge01/?action=display&bridge=TikTokBridge&context=By%20user&username=${USER}&format=Atom"

          echo "===== RSS-BRIDGE ====="
          curl -sS -L --max-time 30 -D /tmp/rss.h "$FEED" -o /tmp/rss.body || true
          cat /tmp/rss.h
          echo
          head -c 12000 /tmp/rss.body
          echo

          ENC=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$FEED")
          JSON_URL="https://api.rss2json.com/v1/api.json?rss_url=${ENC}"

          echo "===== RSS2JSON ====="
          curl -sS -L --max-time 30 -D /tmp/json.h "$JSON_URL" -o /tmp/json.body || true
          cat /tmp/json.h
          echo
          head -c 12000 /tmp/json.body
          echo
