name: Probe TikTok Profile HTML Variants
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe profile HTML variants
        shell: bash
        run: |
          set -u
          H='tu.thuong_lay_minh_1'
          URLS=(
            "https://www.tiktok.com/@${H}"
            "https://www.tiktok.com/@${H}?lang=en"
            "https://www.tiktok.com/@${H}?is_from_webapp=1&sender_device=pc"
          )
          i=0
          for URL in "${URLS[@]}"; do
            i=$((i+1))
            echo "===== VARIANT $i $URL ====="
            curl -sS -L --max-time 20 -c /tmp/cookies -b /tmp/cookies               "$URL"               -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'               -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'               -H 'Accept-Language: en-US,en;q=0.9'               -H 'Referer: https://www.tiktok.com/'               -o "/tmp/p${i}.html" -D "/tmp/h${i}" || true
            head -n 5 "/tmp/h${i}" || true
            python3 - "/tmp/p${i}.html" <<'PY'
          import re,sys
          p=sys.argv[1]
          s=open(p,'r',errors='ignore').read()
          print('LEN',len(s))
          for needle in ['__UNIVERSAL_DATA_FOR_REHYDRATION__','SIGI_STATE','"itemList"','/video/','webapp.user-detail','secUid']:
              print(needle, s.count(needle))
          ids=re.findall(r'/video/(\d{8,})',s)
          print('VIDEO_IDS', ids[:10])
          PY
          done
