name: Probe TikTok RSS Bridge Paths
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RSS-Bridge direct JSON and rss2json
        shell: bash
        run: |
          set -u
          H='tu.thuong_lay_minh_1'
          BASE='https://rss-bridge.org/bridge01/'
          JSON_URL="${BASE}?action=display&bridge=TikTokBridge&context=By%20user&username=%40${H}&format=Json"
          ATOM_URL="${BASE}?action=display&bridge=TikTokBridge&context=By%20user&username=%40${H}&format=Atom"

          echo '=== METHOD 1: RSS-BRIDGE JSON DIRECT ==='
          curl -sS --max-time 30 -D /tmp/rb-json-h "$JSON_URL"             -H 'Origin: https://yt.taphoa.xyz'             -H 'User-Agent: Mozilla/5.0'             -o /tmp/rb-json-body || true
          cat /tmp/rb-json-h
          echo
          head -c 10000 /tmp/rb-json-body
          echo

          echo '=== METHOD 1B: ALTERNATE PUBLIC INSTANCE JSON ==='
          ALT="https://wtf.roflcopter.fr/rss-bridge/?action=display&bridge=TikTokBridge&context=By%20user&username=%40${H}&format=Json"
          curl -sS --max-time 30 -D /tmp/rb-alt-h "$ALT"             -H 'Origin: https://yt.taphoa.xyz'             -H 'User-Agent: Mozilla/5.0'             -o /tmp/rb-alt-body || true
          cat /tmp/rb-alt-h
          echo
          head -c 10000 /tmp/rb-alt-body
          echo

          echo '=== METHOD 2: RSS-BRIDGE ATOM -> RSS2JSON ==='
          ENC=$(python3 - <<'PY'
import urllib.parse
u='https://rss-bridge.org/bridge01/?action=display&bridge=TikTokBridge&context=By%20user&username=%40tu.thuong_lay_minh_1&format=Atom'
print(urllib.parse.quote(u,safe=''))
PY
)
          R2J="https://api.rss2json.com/v1/api.json?rss_url=${ENC}"
          curl -sS --max-time 30 -D /tmp/r2j-h "$R2J"             -H 'Origin: https://yt.taphoa.xyz'             -H 'User-Agent: Mozilla/5.0'             -o /tmp/r2j-body || true
          cat /tmp/r2j-h
          echo
          head -c 12000 /tmp/r2j-body
          echo
