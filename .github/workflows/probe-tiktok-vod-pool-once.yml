name: Probe TikWM Single Video Exact
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact TikWM resolver and edge redirect
        shell: bash
        run: |
          set -u
          H='tu.thuong_lay_minh_1'
          ID='7680871454702882069'
          PAGE="https://www.tiktok.com/@${H}/video/${ID}"
          EDGE="https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-direct?user=${H}&id=${ID}"

          echo '=== TIKWM API ==='
          curl -sS --max-time 20 -G 'https://www.tikwm.com/api/'             --data-urlencode "url=${PAGE}"             -H 'Referer: https://www.tikwm.com/'             -H 'User-Agent: Mozilla/5.0'             -D /tmp/tikwm.h -o /tmp/tikwm.body || true
          cat /tmp/tikwm.h
          echo
          head -c 8000 /tmp/tikwm.body
          echo

          echo '=== EDGE 302 ==='
          curl -sS --max-time 20 "$EDGE" -D /tmp/edge.h -o /tmp/edge.body || true
          cat /tmp/edge.h
          echo
          cat /tmp/edge.body
          echo
