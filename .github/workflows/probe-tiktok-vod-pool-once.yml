name: Probe BHWA TikTok Profile
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BHWA profile parse
        shell: bash
        run: |
          set -u
          ENC=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("https://www.tiktok.com/@tu.thuong_lay_minh_1", safe=""))')
          URL="https://downloader-api.bhwa233.com/api/parse?url=${ENC}"
          echo "$URL"
          curl -sS --max-time 20 -D /tmp/h "$URL"             -H 'User-Agent: Mozilla/5.0'             -o /tmp/body || true
          cat /tmp/h
          echo
          cat /tmp/body
          echo
