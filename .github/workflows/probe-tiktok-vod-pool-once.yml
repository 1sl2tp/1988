name: Probe Production TikTok Channel Videos
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production worker
        shell: bash
        run: |
          set -u
          URL='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/channel-videos?user=tu.thuong_lay_minh_1&count=5'
          curl -sS --max-time 30 -D /tmp/h "$URL" -o /tmp/body || true
          cat /tmp/h
          echo
          cat /tmp/body
          echo
