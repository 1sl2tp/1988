name: Probe TikTok RSS Bridge JSON
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-tiktok-vod-pool-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe RSS-Bridge JSON
        shell: bash
        run: |
          set -u
          URL='https://rss-bridge.org/bridge01/?action=display&bridge=TikTokBridge&context=By%20user&username=%40tu.thuong_lay_minh_1&format=Json'
          curl -sS -L --max-time 30 -D /tmp/h "$URL" -o /tmp/body || true
          cat /tmp/h
          echo
          head -c 16000 /tmp/body
          echo
