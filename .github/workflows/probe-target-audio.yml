name: Probe Target Audio

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test exact links before changing player
        shell: bash
        run: |
          set +e
          ID='vhUjvanyu2U'
          echo '=== YOUTUBE WATCH ==='
          curl -sS -I -L --connect-timeout 4 --max-time 12 "https://www.youtube.com/watch?v=$ID" | tr -d '\r' | grep -iE '^(HTTP/|content-type:|content-length:)' | head -12

          echo '=== SUPABASE INNERTUBE ==='
          URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988?action=innertube_probe&id=$ID"
          curl -sS -L --connect-timeout 4 --max-time 15 -w '\nHTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' "$URL" -o /tmp/probe.json
          cat /tmp/probe.json
          echo

          echo '=== PARSED ==='
          jq -c '{ok,httpStatus,playability,videoDetails,streaming:(.streaming // null),error}' /tmp/probe.json 2>/dev/null || true
