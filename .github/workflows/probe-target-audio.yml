name: Probe Target Audio

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Supabase InnerTube for exact video
        shell: bash
        run: |
          set +e
          URL='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988?action=innertube_probe&id=vhUjvanyu2U'
          curl -sS -L --connect-timeout 4 --max-time 15 "$URL" -o /tmp/probe.json
          echo '=== RAW ==='
          cat /tmp/probe.json
          echo
          echo '=== SUMMARY ==='
          jq '{ok,httpStatus,playability,videoDetails,streaming}' /tmp/probe.json || true
