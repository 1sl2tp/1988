name: Probe Target Audio

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Supabase InnerTube for exact video
        shell: bash
        run: |
          set -e
          URL='https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988?action=innertube_probe&id=vhUjvanyu2U'
          curl -sS -L --connect-timeout 4 --max-time 15 "$URL" -o /tmp/probe.json
          jq '{ok,httpStatus,playability,videoDetails,streaming:{expiresInSeconds:.streaming.expiresInSeconds,formats:(.streaming.formats|map({itag,mimeType,bitrate,width,height,audioQuality,hasUrl,hasCipher,host}))}}' /tmp/probe.json
