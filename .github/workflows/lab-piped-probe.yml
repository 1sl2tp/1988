name: Lab Piped With Free Proxy

on:
  push:
    branches:
      - lab/piped-shaka-20260923

permissions:
  contents: read

jobs:
  free-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch live free SOCKS5 proxies
        shell: bash
        run: |
          set -e
          curl -sS -L --max-time 20             'https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/protocols/socks5/data.json'             -o /tmp/proxies.json

          jq -r '
            [.[] |
              select((.uptime_percent // 0) >= 70) |
              select((.latency_ms // 99999) <= 1500)
            ]
            | sort_by(.latency_ms)
            | .[0:40]
            | .[]
            | "\(.ip):\(.port)"
          ' /tmp/proxies.json > /tmp/candidates.txt

          echo "Candidates: $(wc -l < /tmp/candidates.txt)"
          head -20 /tmp/candidates.txt

      - name: Find proxies that can reach YouTube
        shell: bash
        run: |
          set +e
          : > /tmp/live.txt
          while read -r P; do
            echo "TEST $P"
            CODE=$(curl -sS --proxy "socks5h://$P"               --connect-timeout 3 --max-time 7               -o /tmp/yt.out -w '%{http_code}'               'https://www.youtube.com/generate_204')
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              echo "LIVE $P HTTP=$CODE"
              echo "$P" >> /tmp/live.txt
            fi
            [ "$(wc -l < /tmp/live.txt)" -ge 8 ] && break
          done < /tmp/candidates.txt

          echo "=== LIVE YOUTUBE PROXIES ==="
          cat /tmp/live.txt
          [ -s /tmp/live.txt ]

      - name: Start official Piped stack
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/piped-lab
          cat > /tmp/piped-lab/config.base <<'CFG'
          PORT:8080
          HTTP_WORKERS:2
          PROXY_PART:http://127.0.0.1:8082
          API_URL:http://127.0.0.1:8081
          FRONTEND_URL:http://127.0.0.1:8083
          COMPROMISED_PASSWORD_CHECK:false
          DISABLE_REGISTRATION:true
          FEED_RETENTION:1
          DISABLE_TIMERS:true
          RYD_PROXY_URL:https://ryd-proxy.kavin.rocks
          SPONSORBLOCK_SERVERS:https://sponsor.ajay.app
          DISABLE_RYD:true
          DISABLE_SERVER:false
          DISABLE_LBRY:true
          SUBSCRIPTIONS_EXPIRY:1
          CONSENT_COOKIE:true
          BG_HELPER_URL:http://bg-helper:3000
          hibernate.connection.url:jdbc:postgresql://postgres:5432/piped
          hibernate.connection.driver_class:org.postgresql.Driver
          hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
          hibernate.connection.username:piped
          hibernate.connection.password:changeme
          CFG

          cat > /tmp/piped-lab/docker-compose.yml <<'YML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_DB: piped
                POSTGRES_USER: piped
                POSTGRES_PASSWORD: changeme
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U piped"]
                interval: 2s
                timeout: 2s
                retries: 30

            bg-helper:
              image: 1337kavin/bg-helper-server:latest

            proxy:
              image: 1337kavin/piped-proxy:latest
              ports:
                - "8082:8080"

            piped:
              image: 1337kavin/piped:latest
              depends_on:
                postgres:
                  condition: service_healthy
                bg-helper:
                  condition: service_started
                proxy:
                  condition: service_started
              ports:
                - "8081:8080"
              volumes:
                - /tmp/piped-lab/config.properties:/app/config.properties:ro
          YML

          cp /tmp/piped-lab/config.base /tmp/piped-lab/config.properties
          cd /tmp/piped-lab
          docker compose up -d postgres bg-helper proxy piped

          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8081/config || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done

      - name: Try exact video through each free proxy
        shell: bash
        run: |
          set +e
          ID='vhUjvanyu2U'
          cd /tmp/piped-lab
          PASS=''

          while read -r P; do
            echo
            echo "===== TRY $P ====="
            cp config.base config.properties
            echo "REQWEST_PROXY:socks5://$P" >> config.properties

            docker compose restart piped >/dev/null 2>&1
            sleep 4

            OUT=$(mktemp)
            META=$(curl -sS -L --connect-timeout 3 --max-time 25               -o "$OUT" -w 'HTTP=%{http_code} SIZE=%{size_download} TIME=%{time_total}'               "http://127.0.0.1:8081/streams/$ID")

            AC=$(jq -r '(.audioStreams//[])|length' "$OUT" 2>/dev/null)
            VC=$(jq -r '(.videoStreams//[])|length' "$OUT" 2>/dev/null)
            HLS=$(jq -r '.hls // ""' "$OUT" 2>/dev/null)
            TITLE=$(jq -r '.title // ""' "$OUT" 2>/dev/null)

            echo "RESULT proxy=$P $META audio=$AC video=$VC hls=$([ -n "$HLS" ] && echo yes || echo no) title=$TITLE"

            if { [ "${AC:-0}" -gt 0 ] || [ "${VC:-0}" -gt 0 ] || [ -n "$HLS" ]; }; then
              echo "PASS_PROXY=$P"
              cat "$OUT" > /tmp/pass-streams.json
              echo "$P" > /tmp/pass-proxy.txt
              PASS="$P"
              rm -f "$OUT"
              break
            fi

            docker compose logs --tail=20 piped | tail -20
            rm -f "$OUT"
          done < /tmp/live.txt

          if [ -z "$PASS" ]; then
            echo "NO_FREE_PROXY_PASSED"
            exit 1
          fi

          echo "=== PASS SUMMARY ==="
          jq '{title,duration,hls,audioCount:((.audioStreams//[])|length),videoCount:((.videoStreams//[])|length)}' /tmp/pass-streams.json
