name: Lab Winning Proxy Media Test

on:
  push:
    branches:
      - lab/piped-shaka-20260923

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start official Piped stack with winning free proxy
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/piped-lab
          cat > /tmp/piped-lab/config.properties <<'CFG'
          PORT:8080
          HTTP_WORKERS:1
          PROXY_PART:http://127.0.0.1:8082
          API_URL:http://127.0.0.1:8081
          FRONTEND_URL:http://127.0.0.1:8083
          REQWEST_PROXY:http://49.48.121.191:8080
          COMPROMISED_PASSWORD_CHECK:false
          DISABLE_REGISTRATION:true
          FEED_RETENTION:1
          DISABLE_TIMERS:true
          DISABLE_RYD:true
          DISABLE_SERVER:false
          DISABLE_LBRY:true
          SUBSCRIPTIONS_EXPIRY:1
          CONSENT_COOKIE:true
          BG_HELPER_URL:http://bg-helper:3000
          hibernate.connection.url:jdbc:postgresql://postgres:5432/piped
          hibernate.connection.driver_class:org.postgresql.Driver
          hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
          hibernate.connection.username:piped
          hibernate.connection.password:changeme
          CFG

          cat > /tmp/piped-lab/docker-compose.yml <<'YML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_DB: piped
                POSTGRES_USER: piped
                POSTGRES_PASSWORD: changeme
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U piped"]
                interval: 2s
                timeout: 2s
                retries: 20
            bg-helper:
              image: 1337kavin/bg-helper-server:latest
            proxy:
              image: 1337kavin/piped-proxy:latest
              environment:
                PROXY: socks5://103.88.234.239:40002
              ports: ["8082:8080"]
            piped:
              image: 1337kavin/piped:latest
              depends_on:
                postgres:
                  condition: service_healthy
                bg-helper:
                  condition: service_started
                proxy:
                  condition: service_started
              ports: ["8081:8080"]
              volumes:
                - /tmp/piped-lab/config.properties:/app/config.properties:ro
          YML

          cd /tmp/piped-lab
          docker compose up -d

          for i in $(seq 1 45); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8081/config || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done

      - name: Resolve and verify actual MP4 bytes
        shell: bash
        run: |
          set -e
          OUT=/tmp/streams.json
          curl -fsS --max-time 35 http://127.0.0.1:8081/streams/vhUjvanyu2U -o "$OUT"
          URL=$(jq -r '[(.videoStreams//[])[] | select(.url!=null and .videoOnly==false)][0].url // empty' "$OUT")
          echo "TITLE=$(jq -r '.title' "$OUT")"
          echo "STREAM=$URL"
          [ -n "$URL" ]

          HDR=$(mktemp)
          BIN=$(mktemp)
          curl -sS -L --connect-timeout 4 --max-time 20             -H 'Range: bytes=0-65535' -D "$HDR" -o "$BIN" "$URL"

          CODE=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$HDR")
          TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
          CRANGE=$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r",""); print $2" "$3}' "$HDR" | tail -1)
          ARANGE=$(awk 'BEGIN{IGNORECASE=1} /^accept-ranges:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)
          SIZE=$(wc -c < "$BIN")
          FILE=$(file -b "$BIN")
          echo "MEDIA|HTTP=$CODE|TYPE=$TYPE|SIZE=$SIZE|CRANGE=$CRANGE|ARANGE=$ARANGE|FILE=$FILE"
          xxd -l 64 "$BIN"

          case "$TYPE" in video/mp4*) ;; *) exit 1 ;; esac
          [ "$SIZE" -gt 1000 ]
