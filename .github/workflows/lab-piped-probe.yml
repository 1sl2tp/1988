name: Lab Verify Proxy Media

on:
  push:
    branches:
      - lab/piped-shaka-20260923

permissions:
  contents: read

jobs:
  verify-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start official Piped stack with proven free SOCKS5
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/piped-lab
          cat > /tmp/piped-lab/config.properties <<'CFG'
          PORT:8080
          HTTP_WORKERS:2
          PROXY_PART:http://127.0.0.1:8082
          REQWEST_PROXY:socks5://103.88.234.239:40002
          API_URL:http://127.0.0.1:8081
          FRONTEND_URL:http://127.0.0.1:8083
          COMPROMISED_PASSWORD_CHECK:false
          DISABLE_REGISTRATION:true
          FEED_RETENTION:1
          DISABLE_TIMERS:true
          RYD_PROXY_URL:https://ryd-proxy.kavin.rocks
          SPONSORBLOCK_SERVERS:https://sponsor.ajay.app
          DISABLE_RYD:true
          DISABLE_SERVER:false
          DISABLE_LBRY:true
          SUBSCRIPTIONS_EXPIRY:1
          CONSENT_COOKIE:true
          BG_HELPER_URL:http://bg-helper:3000
          hibernate.connection.url:jdbc:postgresql://postgres:5432/piped
          hibernate.connection.driver_class:org.postgresql.Driver
          hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
          hibernate.connection.username:piped
          hibernate.connection.password:changeme
          CFG
          cat > /tmp/piped-lab/docker-compose.yml <<'YML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_DB: piped
                POSTGRES_USER: piped
                POSTGRES_PASSWORD: changeme
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U piped"]
                interval: 2s
                timeout: 2s
                retries: 30
            bg-helper:
              image: 1337kavin/bg-helper-server:latest
            proxy:
              image: 1337kavin/piped-proxy:latest
              ports: ["8082:8080"]
            piped:
              image: 1337kavin/piped:latest
              depends_on:
                postgres:
                  condition: service_healthy
                bg-helper:
                  condition: service_started
                proxy:
                  condition: service_started
              ports: ["8081:8080"]
              volumes:
                - /tmp/piped-lab/config.properties:/app/config.properties:ro
          YML
          cd /tmp/piped-lab
          docker compose up -d
          for i in $(seq 1 35); do
            C=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8081/config || true)
            [ "$C" = "200" ] && exit 0
            sleep 1
          done
          exit 1

      - name: Resolve exact video and verify MP4
        shell: bash
        run: |
          set -e
          OUT=/tmp/streams.json
          curl -fsS --max-time 40 http://127.0.0.1:8081/streams/vhUjvanyu2U -o "$OUT"
          jq '{title,duration,audioCount:((.audioStreams//[])|length),videoCount:((.videoStreams//[])|length)}' "$OUT"
          URL=$(jq -r '[(.videoStreams//[])[] | select(.videoOnly==false and .url!=null)][0].url // empty' "$OUT")
          [ -n "$URL" ]
          echo "MUXED_URL=$URL"

          echo '=== RANGE TEST ==='
          curl -sS -L --connect-timeout 4 --max-time 20 -H 'Range: bytes=0-1048575'             -D /tmp/h -o /tmp/media.bin "$URL"
          tr -d '\r' < /tmp/h | grep -iE '^(HTTP/|content-type:|content-length:|content-range:|accept-ranges:)'
          echo "BYTES=$(wc -c < /tmp/media.bin)"
          file /tmp/media.bin

          echo '=== FFPROBE ==='
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of json "$URL" | tee /tmp/probe.json
          VIDEO=$(jq '[.streams[]|select(.codec_type=="video")]|length' /tmp/probe.json)
          AUDIO=$(jq '[.streams[]|select(.codec_type=="audio")]|length' /tmp/probe.json)
          echo "VIDEO_TRACKS=$VIDEO AUDIO_TRACKS=$AUDIO"
          [ "$VIDEO" -gt 0 ] && [ "$AUDIO" -gt 0 ]
