name: Lab Free Proxy Piped Test

on:
  push:
    branches:
      - lab/piped-shaka-20260923

permissions:
  contents: read

jobs:
  proxy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Start official Piped dependencies
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/piped-lab
          cat > /tmp/piped-lab/docker-compose.yml <<'YML'
          services:
            postgres:
              image: postgres:17-alpine
              environment:
                POSTGRES_DB: piped
                POSTGRES_USER: piped
                POSTGRES_PASSWORD: changeme
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U piped"]
                interval: 2s
                timeout: 2s
                retries: 30
            bg-helper:
              image: 1337kavin/bg-helper-server:latest
              restart: unless-stopped
            proxy:
              image: 1337kavin/piped-proxy:latest
              ports:
                - "8082:8080"
              restart: unless-stopped
            piped:
              image: 1337kavin/piped:latest
              depends_on:
                postgres:
                  condition: service_healthy
                bg-helper:
                  condition: service_started
                proxy:
                  condition: service_started
              ports:
                - "8081:8080"
              volumes:
                - /tmp/piped-lab/config.properties:/app/config.properties:ro
              restart: unless-stopped
          YML
          cat > /tmp/piped-lab/base.properties <<'CFG'
          PORT:8080
          HTTP_WORKERS:2
          PROXY_PART:http://127.0.0.1:8082
          API_URL:http://127.0.0.1:8081
          FRONTEND_URL:http://127.0.0.1:8083
          COMPROMISED_PASSWORD_CHECK:false
          DISABLE_REGISTRATION:true
          FEED_RETENTION:1
          DISABLE_TIMERS:true
          RYD_PROXY_URL:https://ryd-proxy.kavin.rocks
          SPONSORBLOCK_SERVERS:https://sponsor.ajay.app
          DISABLE_RYD:true
          DISABLE_SERVER:false
          DISABLE_LBRY:true
          SUBSCRIPTIONS_EXPIRY:1
          CONSENT_COOKIE:true
          BG_HELPER_URL:http://bg-helper:3000
          hibernate.connection.url:jdbc:postgresql://postgres:5432/piped
          hibernate.connection.driver_class:org.postgresql.Driver
          hibernate.dialect:org.hibernate.dialect.PostgreSQLDialect
          hibernate.connection.username:piped
          hibernate.connection.password:changeme
          CFG
          cp /tmp/piped-lab/base.properties /tmp/piped-lab/config.properties
          cd /tmp/piped-lab
          docker compose up -d postgres bg-helper proxy
          docker compose ps

      - name: Fetch and precheck fresh free SOCKS5 proxies
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 20 \
            https://raw.githubusercontent.com/proxmint/free-proxy-list/main/proxies/socks5.txt \
            -o /tmp/all-proxies.txt
          grep -v '^$' /tmp/all-proxies.txt | head -80 > /tmp/proxies.txt || true
          echo "candidates=$(wc -l < /tmp/proxies.txt)"
          : > /tmp/good.txt
          while read -r P; do
            (
              BODY=$(mktemp)
              CODE=$(curl -sS --socks5-hostname "$P" --connect-timeout 2 --max-time 5 \
                -A 'Mozilla/5.0' -o "$BODY" -w '%{http_code}' \
                'https://www.youtube.com/watch?v=vhUjvanyu2U' || true)
              SIZE=$(wc -c < "$BODY" 2>/dev/null || echo 0)
              if [ "$CODE" = "200" ] && [ "$SIZE" -gt 10000 ]; then
                echo "$P" >> /tmp/good.txt
                echo "LIVE|$P|HTTP=$CODE|SIZE=$SIZE"
              fi
              rm -f "$BODY"
            ) &
          done < /tmp/proxies.txt
          wait
          awk '!seen[$0]++' /tmp/good.txt | head -10 > /tmp/selected.txt || true
          echo '=== selected ==='
          cat /tmp/selected.txt
          test -s /tmp/selected.txt

      - name: Try selected proxies with official Piped backend
        shell: bash
        run: |
          set +e
          ID='vhUjvanyu2U'
          cd /tmp/piped-lab
          SUCCESS=''
          N=0
          while read -r P; do
            N=$((N+1))
            echo "=== TRY#$N SOCKS5 $P ==="
            cp base.properties config.properties
            printf '\nREQWEST_PROXY:socks5://%s\n' "$P" >> config.properties

            docker compose rm -sf piped >/dev/null 2>&1 || true
            docker compose up -d piped >/dev/null

            READY=0
            for i in $(seq 1 25); do
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8081/config || true)
              if [ "$CODE" = "200" ]; then READY=1; break; fi
              sleep 1
            done
            if [ "$READY" != "1" ]; then
              echo "BACKEND_NOT_READY|$P"
              docker compose logs --tail=25 piped
              continue
            fi

            OUT=/tmp/streams-$N.json
            META=$(curl -sS --connect-timeout 3 --max-time 35               -o "$OUT" -w 'HTTP=%{http_code} SIZE=%{size_download} TIME=%{time_total}'               "http://127.0.0.1:8081/streams/$ID")
            AC=$(jq -r '(.audioStreams//[])|length' "$OUT" 2>/dev/null)
            VC=$(jq -r '(.videoStreams//[])|length' "$OUT" 2>/dev/null)
            HLS=$(jq -r '.hls // ""' "$OUT" 2>/dev/null)
            TITLE=$(jq -r '.title // ""' "$OUT" 2>/dev/null)
            echo "RESULT|$P|$META|AUDIO=${AC:-0}|VIDEO=${VC:-0}|HLS=$([ -n "$HLS" ] && echo yes || echo no)|TITLE=$TITLE"

            if { [ "${AC:-0}" -gt 0 ] || [ "${VC:-0}" -gt 0 ] || [ -n "$HLS" ]; }; then
              SUCCESS="$P"
              echo "SUCCESS_PROXY=$P"
              jq '{title,duration,hls,audioStreams:(.audioStreams[0:2]),videoStreams:(.videoStreams[0:3])}' "$OUT"
              break
            fi
            docker compose logs --tail=18 piped | tail -18
          done < /tmp/selected.txt

          if [ -z "$SUCCESS" ]; then
            echo 'NO_FREE_PROXY_SUCCEEDED'
            exit 1
          fi
