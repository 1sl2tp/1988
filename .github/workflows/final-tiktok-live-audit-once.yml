name: Final TikTok LIVE exhaustive audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-tiktok-live-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit every selected TikTok channel
        run: python3 scripts/verify_tiktok_live_statuses.py
