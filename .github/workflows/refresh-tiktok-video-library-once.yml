name: Refresh TikTok selected-channel video library once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tiktok-video-library-once.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Queue full TikTok selected-channel video refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          url='https://one988-tiktok-session.onrender.com/tiktok/video-refresh-all'
          req=urllib.request.Request(
              url,
              headers={
                  'User-Agent':'1988-tiktok-video-refresh/1.0',
                  'Accept':'application/json'
              }
          )
          with urllib.request.urlopen(req, timeout=90) as r:
              payload=json.load(r)
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          assert payload.get('ok') is True, payload
          assert payload.get('queued') is True or int(payload.get('total') or 0)==0, payload
          PY
