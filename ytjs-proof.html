<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1988 · YouTube.js MP4 Proof</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#000;color:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f7}
main{width:min(760px,100%);margin:auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 6px}.sub{color:#9b9ba3;font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
input,button{font:inherit;border-radius:10px;border:1px solid #303038;background:#141418;color:#fff;padding:11px 12px}
button{background:#fff;color:#000;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
video{display:block;width:100%;aspect-ratio:16/9;background:#090909;border-radius:12px;margin-top:14px}
.card{margin-top:12px;padding:12px;border:1px solid #25252b;border-radius:12px;background:#101014}
.status{font-size:13px;line-height:1.45;word-break:break-word}.ok{color:#74d680}.bad{color:#ff6961}.warn{color:#f5c451}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px;font-size:12px;margin-top:10px}.kv b{color:#8e8e98}.kv span{word-break:break-all}
.small{font-size:11px;color:#777780;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>YouTube.js · MP4 Proof</h1>
  <p class="sub">Local extraction trong browser → proxy riêng → bytes media. Không dùng Piped.</p>
  <div class="row">
    <input id="videoId" value="" autocomplete="off" spellcheck="false" placeholder="Tìm video hoặc dán link YouTube">
    <button id="go">Tìm & phát</button>
  </div>
  <video id="video" controls playsinline preload="metadata"></video>
  <div class="card">
    <div id="status" class="status warn">Chưa chạy.</div>
    <div class="kv">
      <b>Tiêu đề</b><span id="title">—</span>
      <b>Video ID</b><span id="resolvedId">—</span>
      <b>Định dạng</b><span id="format">—</span>
      <b>Clients</b><span id="clients">—</span>
      <b>Probe</b><span id="probe">—</span>
      <b>Player</b><span id="player">—</span>
    </div>
  </div>
  <div class="small">Build: ytjs-proof-20260923-7-tv-embedded</div>
</main>

<script type="module">
import ProofEngine from './src/yt-proof-engine.js?v=1';

const $=id=>document.getElementById(id);
const video=$('video'),status=$('status'),go=$('go');

function setStatus(text,kind='warn'){
  status.textContent=text;
  status.className='status '+kind;
}

function parseVideoId(raw){
  raw=String(raw||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw))return raw;
  try{
    const u=new URL(raw);
    const v=u.searchParams.get('v');
    if(v&&/^[A-Za-z0-9_-]{11}$/.test(v))return v;
    const parts=u.pathname.split('/').filter(Boolean);
    const candidate=u.hostname.includes('youtu.be')?parts[0]:parts.at(-1);
    return /^[A-Za-z0-9_-]{11}$/.test(candidate||'')?candidate:'';
  }catch{return ''}
}

async function waitReady(timeout=12000){
  return new Promise((resolve,reject)=>{
    let done=false;
    const clean=()=>{
      clearTimeout(timer);
      video.removeEventListener('loadedmetadata',ready);
      video.removeEventListener('canplay',ready);
      video.removeEventListener('error',bad);
    };
    const finish=(fn,v)=>{if(done)return;done=true;clean();fn(v)};
    const ready=()=>finish(resolve,true);
    const bad=()=>finish(reject,new Error('video_error_'+(video.error?.code||0)));
    const timer=setTimeout(()=>finish(reject,new Error('video_timeout')),timeout);
    video.addEventListener('loadedmetadata',ready,{once:true});
    video.addEventListener('canplay',ready,{once:true});
    video.addEventListener('error',bad,{once:true});
  });
}

async function run(){
  const raw=String($('videoId').value||'').trim();
  if(!raw){setStatus('Nhập tên video hoặc dán link YouTube.','bad');return}

  go.disabled=true;
  $('title').textContent='—';
  $('resolvedId').textContent='—';
  $('format').textContent='—';
  $('clients').textContent='—';
  $('probe').textContent='—';
  $('player').textContent='—';
  video.pause();
  video.removeAttribute('src');
  video.load();

  try{
    let id=parseVideoId(raw);

    if(!id){
      setStatus('Đang tìm video…');
      const rows=await YTLocal.search(raw,{type:'video'});
      const first=Array.isArray(rows)?rows.find(row=>row?.videoId):null;
      id=String(first?.videoId||'');
      if(!id)throw new Error('Không tìm thấy video');
      $('resolvedId').textContent=id;
      $('title').textContent=first?.title||'Video';
    }else{
      $('resolvedId').textContent=id;
    }

    const yt=await YTLocal.getYT();

    const clients=['WEB','MWEB','IOS','ANDROID','ANDROID_VR','VISIONOS','WEB_EMBEDDED','TV','TV_SIMPLY','TV_EMBEDDED'];
    const results=[];
    let chosen=null;

    for(const client of clients){
      try{
        setStatus('Đang thử '+client+'…');
        const info=await yt.getBasicInfo(id,{client});
        if(!$('title').textContent||$('title').textContent==='—'){
          $('title').textContent=info?.basic_info?.title||'(đã lấy metadata)';
        }
        const status=String(info?.playability_status?.status||'?');
        const reason=String(info?.playability_status?.reason||'');
        const hasStreaming=!!info?.streaming_data;
        results.push(client+': '+status+(hasStreaming?' ✓stream':' ✕stream')+(reason?' · '+reason:''));

        if(!hasStreaming)continue;

        const options={type:'video+audio',quality:'best',format:'mp4',client};
        const format=info.chooseFormat(options);
        format.url=await format.decipher(yt.session.player);
        if(!format?.url)continue;

        chosen={client,format};
        break;
      }catch(error){
        results.push(client+': ERROR · '+String(error?.message||error));
      }
    }

    $('clients').textContent=results.join(' | ');

    if(!chosen)throw new Error('Tất cả client đều không có streaming_data');

    const format=chosen.format;
    $('format').textContent=[
      'itag '+(format.itag??'?'),
      format.mime_type||format.mimeType||'',
      format.quality_label||format.quality||'',
      format.has_audio===false?'video-only':'A/V',
      chosen.client
    ].filter(Boolean).join(' · ');

    setStatus('Đã có stream từ '+chosen.client+' · đang kiểm tra bytes…');

    const mediaUrl=(()=>{
      const rawUrl=format.url;
      const src=new URL(rawUrl);
      const out=new URL('https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt-browser-proxy');
      out.searchParams.set('__host',src.host);
      out.searchParams.set('__path',src.pathname);
      for(const [k,v] of src.searchParams)out.searchParams.append(k,v);
      out.searchParams.set('__headers',JSON.stringify([['accept','*/*']]));
      return out.toString();
    })();

    const probe=await fetch(mediaUrl,{
      method:'GET',
      headers:{Range:'bytes=0-1023'},
      cache:'no-store'
    });
    const type=probe.headers.get('content-type')||'';
    const range=probe.headers.get('content-range')||'';
    $('probe').textContent='HTTP '+probe.status+' · '+type+(range?' · '+range:'');
    try{await probe.body?.cancel()}catch{}
    if(!(probe.status===200||probe.status===206))throw new Error('media_probe_http_'+probe.status);

    video.src=mediaUrl;
    video.load();
    await waitReady();

    $('player').textContent='loadedmetadata · '+(
      Number.isFinite(video.duration)?Math.round(video.duration)+'s':'duration ?'
    );

    try{
      await video.play();
      setStatus('THÀNH CÔNG · '+chosen.client+' · MP4 native đang phát.','ok');
    }catch{
      setStatus('THÀNH CÔNG phần stream · '+chosen.client+' · bấm Play.','ok');
    }
  }catch(error){
    console.error(error);
    setStatus('THẤT BẠI: '+String(error?.message||error),'bad');
  }finally{
    go.disabled=false;
  }
}
go.addEventListener('click',run);
$('videoId').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
const params=new URL(location.href).searchParams;
const initial=params.get('q')||params.get('id');
if(initial)$('videoId').value=initial;
</script>
</body>
</html>
