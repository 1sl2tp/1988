<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1988 · Kira SABR Proof</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#000;color:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f7}
main{width:min(980px,100%);margin:auto;padding:16px 14px 40px}
h1{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:#999;margin:0 0 12px}
.search{display:flex;gap:8px;position:sticky;top:0;background:#000;padding:8px 0;z-index:20}
.search input{flex:1;min-width:0}
input,button{font:inherit;border-radius:10px;border:1px solid #303038;background:#141418;color:#fff;padding:11px 12px}
button{cursor:pointer}.search button{background:#fff;color:#000;font-weight:750}
#video-container{width:100%;aspect-ratio:16/9;background:#080808;border-radius:12px;overflow:hidden;margin-top:10px}
#video{width:100%;height:100%;background:#080808}
.info{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:10px 0 5px}
#currentTitle{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#source{font-size:11px;color:#999;flex:none}
#status{font-size:12px;line-height:1.4;padding:9px 10px;border:1px solid #28282e;border-radius:10px;background:#101014;color:#f4c95d}
#status[data-kind="ok"]{color:#70d57b}#status[data-kind="bad"]{color:#ff6b66}
.results-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.results-head strong{font-size:15px}.results-head span{font-size:11px;color:#777}
#results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.result-card{padding:0;background:transparent;border:0;text-align:left;min-width:0;color:#fff}
.thumb{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#171717}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:5px;bottom:5px;font-size:10px;background:#000c;padding:2px 4px;border-radius:4px}
.result-title{font-size:13px;font-weight:700;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result-meta{font-size:11px;color:#888;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.build{font-size:11px;color:#666;margin-top:16px}
@media(max-width:700px){main{padding:10px 8px 32px}#results{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.result-title{font-size:12px}.search{padding-top:4px}}
</style>
</head>
<body>
<main>
  <h1>YouTube.js · Kira SABR Proof</h1>
  <p class="sub">Kira: YouTube.js + Onesie + SabrStreamingAdapter + Shaka Player. Không OAuth.</p>

  <div class="search">
    <input id="searchInput" autocomplete="off" spellcheck="false" placeholder="Tìm tên video hoặc dán link YouTube">
    <button id="searchButton" type="button" disabled>Tìm</button>
  </div>

  <div id="video-container">
    <video id="video" playsinline></video>
  </div>

  <div class="info">
    <div id="currentTitle">—</div>
    <span id="source">—</span>
  </div>
  <div id="status">Đang khởi tạo…</div>

  <div class="results-head">
    <strong>Kết quả</strong>
    <span>Chọn video để phát</span>
  </div>
  <div id="results"></div>

  <div class="build">Build: ytjs-proof-20260923-18-kira-sabr-shaka · proxy-v9</div>
</main>
<script type="module" src="./proof-kira/dist/kira-proof.js?v=18"></script>
</body>
</html>
