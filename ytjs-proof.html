<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1988 · YouTube.js MP4 Proof</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#000;color:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#000;color:#f5f5f7}
main{width:min(760px,100%);margin:auto;padding:18px 14px 40px}
h1{font-size:22px;margin:0 0 6px}.sub{color:#9b9ba3;font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
input,button{font:inherit;border-radius:10px;border:1px solid #303038;background:#141418;color:#fff;padding:11px 12px}
button{background:#fff;color:#000;font-weight:700;cursor:pointer}button:disabled{opacity:.55}
.auth-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.auth-row button{padding:8px 10px}
#authState{font-size:12px;color:#aaa}
.auth-pending{margin:0 0 10px;padding:10px;border:1px solid #303038;border-radius:10px;background:#101014;font-size:12px;line-height:1.5}
.auth-pending a{color:#8ab4ff;font-weight:700}
.auth-code{font-size:18px;font-weight:800;letter-spacing:.08em}
video{display:block;width:100%;aspect-ratio:16/9;background:#090909;border-radius:12px;margin-top:14px}
.card{margin-top:12px;padding:12px;border:1px solid #25252b;border-radius:12px;background:#101014}
.status{font-size:13px;line-height:1.45;word-break:break-word}.ok{color:#74d680}.bad{color:#ff6961}.warn{color:#f5c451}
.kv{display:grid;grid-template-columns:92px 1fr;gap:7px;font-size:12px;margin-top:10px}.kv b{color:#8e8e98}.kv span{word-break:break-all}
.small{font-size:11px;color:#777780;margin-top:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
</head>
<body>
<main>
  <h1>YouTube.js · MP4 Proof</h1>
  <p class="sub">Local extraction trong browser → proxy riêng → bytes media. Không dùng Piped.</p>
  <div class="auth-row">
    <button id="loginBtn" type="button">Đăng nhập YouTube</button>
    <button id="logoutBtn" type="button" hidden>Đăng xuất</button>
    <span id="authState">Chưa đăng nhập</span>
  </div>
  <div id="authPending" class="auth-pending" hidden></div>
  <div class="row">
    <input id="videoId" value="" autocomplete="off" spellcheck="false" placeholder="Tìm video hoặc dán link YouTube">
    <button id="go">Tìm & phát</button>
  </div>
  <video id="video" controls playsinline preload="metadata"></video>
  <div class="card">
    <div id="status" class="status warn">Chưa chạy.</div>
    <div class="kv">
      <b>Tiêu đề</b><span id="title">—</span>
      <b>Video ID</b><span id="resolvedId">—</span>
      <b>Định dạng</b><span id="format">—</span>
      <b>Clients</b><span id="clients">—</span>
      <b>Probe</b><span id="probe">—</span>
      <b>Player</b><span id="player">—</span>
    </div>
  </div>
  <div class="small">Build: ytjs-proof-20260923-12-adaptive-dash · proxy-v9</div>
</main>

<script type="module">
import ProofEngine from './src/yt-proof-engine.js?v=6';

const $=id=>document.getElementById(id);
const video=$('video'),status=$('status'),go=$('go');
let shakaPlayer=null;
const loginBtn=$('loginBtn'),logoutBtn=$('logoutBtn'),authStateEl=$('authState'),authPending=$('authPending');

function setStatus(text,kind='warn'){
  status.textContent=text;
  status.className='status '+kind;
}

function setAuthUi(loggedIn){
  loginBtn.hidden=!!loggedIn;
  logoutBtn.hidden=!loggedIn;
  authStateEl.textContent=loggedIn?'Đã đăng nhập YouTube':'Chưa đăng nhập YouTube';
  if(loggedIn)authPending.hidden=true;
}

async function refreshAuthUi(){
  try{
    const state=await ProofEngine.authState();
    setAuthUi(!!state?.loggedIn);
  }catch{
    setAuthUi(false);
  }
}

function parseVideoId(raw){
  raw=String(raw||'').trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw))return raw;
  try{
    const u=new URL(raw);
    const v=u.searchParams.get('v');
    if(v&&/^[A-Za-z0-9_-]{11}$/.test(v))return v;
    const parts=u.pathname.split('/').filter(Boolean);
    const candidate=u.hostname.includes('youtu.be')?parts[0]:parts.at(-1);
    return /^[A-Za-z0-9_-]{11}$/.test(candidate||'')?candidate:'';
  }catch{return ''}
}

async function waitReady(timeout=12000){
  return new Promise((resolve,reject)=>{
    let done=false;
    const clean=()=>{
      clearTimeout(timer);
      video.removeEventListener('loadedmetadata',ready);
      video.removeEventListener('canplay',ready);
      video.removeEventListener('error',bad);
    };
    const finish=(fn,v)=>{if(done)return;done=true;clean();fn(v)};
    const ready=()=>finish(resolve,true);
    const bad=()=>finish(reject,new Error('video_error_'+(video.error?.code||0)));
    const timer=setTimeout(()=>finish(reject,new Error('video_timeout')),timeout);
    video.addEventListener('loadedmetadata',ready,{once:true});
    video.addEventListener('canplay',ready,{once:true});
    video.addEventListener('error',bad,{once:true});
  });
}

async function run(){
  const raw=String($('videoId').value||'').trim();
  if(!raw){setStatus('Nhập tên video hoặc dán link YouTube.','bad');return}

  go.disabled=true;
  $('title').textContent='—';
  $('resolvedId').textContent='—';
  $('format').textContent='—';
  $('clients').textContent='—';
  $('probe').textContent='—';
  $('player').textContent='—';
  if(shakaPlayer){
    try{await shakaPlayer.destroy();}catch{}
    shakaPlayer=null;
  }
  video.pause();
  video.removeAttribute('src');
  video.load();

  try{
    let id=parseVideoId(raw);

    if(!id){
      setStatus('Đang tìm video…');
      const rows=await ProofEngine.search(raw);
      const first=Array.isArray(rows)?rows.find(row=>row?.videoId):null;
      id=String(first?.videoId||'');
      if(!id)throw new Error('Không tìm thấy video');
      $('title').textContent=first?.title||'Video';
    }

    $('resolvedId').textContent=id;

    const attempts=[];
    const media=await ProofEngine.resolve(id,(client)=>{
      attempts.push(client);
      $('clients').textContent=attempts.join(' → ');
      setStatus('Đang thử '+client+'…');
    });

    if(media?.meta?.title)$('title').textContent=media.meta.title;

    $('clients').textContent=(media.diagnostics||[]).map(row=>{
      const bits=[
        row.client+': '+row.playability,
        row.formats?row.formats+' format':'0 format',
        (row.muxed||row.adaptive)?('mux '+(row.muxed||0)+' / adaptive '+(row.adaptive||0)):'',
        row.dash?'DASH '+row.dash:'',
        row.probe||'',
        row.reason||''
      ].filter(Boolean);
      return bits.join(' · ');
    }).join(' | ');

    $('format').textContent=[
      media.mode==='dash'?'DASH adaptive':'itag '+(media.itag??'?'),
      media.mimeType||'',
      media.quality||'',
      media.hasAudio===false?'video-only':'A/V',
      media.client||''
    ].filter(Boolean).join(' · ');

    $('probe').textContent=[
      media.mode==='dash'?'Manifest DASH đã dựng':'HTTP '+(media.probe?.status??'?'),
      media.probe?.type||'',
      media.probe?.range||''
    ].filter(Boolean).join(' · ');

    if(media.mode==='dash'){
      if(!window.shaka?.Player)throw new Error('Shaka Player chưa tải');
      shaka.polyfill.installAll();
      if(!shaka.Player.isBrowserSupported())throw new Error('Trình duyệt không hỗ trợ DASH/MSE');

      shakaPlayer=new shaka.Player();
      await shakaPlayer.attach(video);

      const manifestBytes=new TextEncoder().encode(media.manifest);
      let binary='';
      for(const byte of manifestBytes)binary+=String.fromCharCode(byte);
      const manifestUri='data:application/dash+xml;base64,'+btoa(binary);

      setStatus('Đã có video + audio tách riêng · đang phát DASH…');
      await shakaPlayer.load(manifestUri);
    }else{
      video.src=media.url;
      video.load();
      await waitReady();
    }

    $('player').textContent='loadedmetadata · '+(
      Number.isFinite(video.duration)?Math.round(video.duration)+'s':'duration ?'
    );

    try{
      await video.play();
      setStatus(
        'THÀNH CÔNG · '+media.client+' · '+(media.mode==='dash'?'DASH video+audio':'MP4')+' đang phát.',
        'ok'
      );
    }catch{
      setStatus(
        'THÀNH CÔNG phần stream · '+media.client+' · '+(media.mode==='dash'?'DASH':'MP4')+' · bấm Play.',
        'ok'
      );
    }
  }catch(error){
    console.error(error);
    if(Array.isArray(error?.diagnostics)){
      $('clients').textContent=error.diagnostics.map(row=>
        [row.client+': '+row.playability,row.formats?row.formats+' format':'0 format',(row.muxed||row.adaptive)?('mux '+(row.muxed||0)+' / adaptive '+(row.adaptive||0)):'',row.dash?'DASH '+row.dash:'',row.probe||'',row.reason||'']
          .filter(Boolean).join(' · ')
      ).join(' | ');
    }
    setStatus('THẤT BẠI: '+String(error?.message||error),'bad');
  }finally{
    go.disabled=false;
  }
}
loginBtn.addEventListener('click',async()=>{
  loginBtn.disabled=true;
  authPending.hidden=true;
  authStateEl.textContent='Đang tạo mã đăng nhập…';

  try{
    await ProofEngine.signIn((data)=>{
      const url=String(data?.verification_url||'');
      const code=String(data?.user_code||'');
      authPending.innerHTML=
        '<div>Mở trang YouTube rồi nhập mã:</div>'+
        '<div class="auth-code">'+code.replace(/[&<>"]/g,'')+'</div>'+
        (url?'<a href="'+url.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">Mở trang xác nhận YouTube</a>':'');
      authPending.hidden=false;
      authStateEl.textContent='Chờ xác nhận trên YouTube…';
    });
    setAuthUi(true);
    setStatus('Đăng nhập YouTube thành công · thử lại video.','ok');
  }catch(error){
    console.error(error);
    setAuthUi(false);
    setStatus('Đăng nhập thất bại: '+String(error?.message||error),'bad');
  }finally{
    loginBtn.disabled=false;
  }
});

logoutBtn.addEventListener('click',async()=>{
  logoutBtn.disabled=true;
  try{
    await ProofEngine.signOut();
    setAuthUi(false);
    setStatus('Đã đăng xuất YouTube.','warn');
  }catch(error){
    setStatus('Đăng xuất thất bại: '+String(error?.message||error),'bad');
  }finally{
    logoutBtn.disabled=false;
  }
});

go.addEventListener('click',run);
$('videoId').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
const params=new URL(location.href).searchParams;
const initial=params.get('q')||params.get('id');
if(initial)$('videoId').value=initial;
void refreshAuthUi();
</script>
</body>
</html>
