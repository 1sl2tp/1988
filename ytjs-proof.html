<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kira</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<style>
html{overflow-y:scroll}
body{background-color:#202020;margin:0}
.app{display:flex;font-family:Arial,sans-serif;text-align:center;flex-direction:column;align-items:center}
::-webkit-scrollbar{width:10px;background-color:#1a1a1a}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.78);border-radius:8px;border:2px solid #202020}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.5)}
.main-content{width:100%;overflow-y:auto}
.search-container{position:sticky;top:0;z-index:20;width:100%;display:flex;justify-content:center;align-items:center;padding:8px 16px;box-sizing:border-box;background:#202020;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.home-button{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#aaa;transition:color .2s;background:none;border:0;padding:0;cursor:pointer}
.home-button:hover{color:#fff}
.search-input-wrapper{position:relative;display:flex;align-items:center;width:100%;max-width:600px}
.search-icon{position:absolute;left:12px;color:#aaa;display:flex;align-items:center}
.clear-search{position:absolute;right:12px;font-size:22px;color:#aaa;cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.clear-search:hover{color:#fff}
.search-input{width:100%;padding:12px 40px;font-size:16px;background:#2a2a2a;border:1px solid #444;color:white;border-radius:8px;transition:all .2s ease}
.search-input:focus{border-color:#3ea6ff;background:#333;outline:none;box-shadow:0 0 0 2px rgba(62,166,255,.2)}
.loader{position:absolute;right:14px;width:18px;height:18px;border:2px solid rgba(255,255,255,.1);border-top-color:#3ea6ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-results,.search-results{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:#242424;border:1px solid #444;border-radius:8px;max-height:450px;overflow-y:auto;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.search-result-item{display:flex;padding:12px;cursor:pointer;border-bottom:1px solid #333;transition:background .2s;text-decoration:none}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover,.search-result-item.highlighted{background:#333}
.search-thumbnail-container{width:180px;height:100px;margin-right:14px;background:#1a1a1a;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0}
.search-thumbnail{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.search-result-item:hover .search-thumbnail{transform:scale(1.05)}
.search-duration{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.7);color:white;padding:1px 4px;border-radius:2px;font-size:12px}
.search-video-info{flex:1;display:flex;flex-direction:column;text-align:left;min-width:0}
.search-title{font-size:16px;margin-bottom:6px;color:white;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;font-weight:500}
.search-channel{font-size:14px;color:#aaa;margin-bottom:4px}
.search-meta{font-size:12px;color:#888}
.empty-results{text-align:center;color:#aaa;padding:24px;background:#242424;border-radius:8px;margin-top:8px}
.settings-button{color:#aaa;background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s ease,background-color .2s ease;margin-left:8px;position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.settings-button:hover{color:#fff;background-color:#333}

.watch-page{width:100%;margin:0 auto;max-width:98%;display:flex;gap:24px}
.primary{flex:1;min-width:0;margin-top:15px}
.secondary{width:402px;margin-top:20px}
.video-player-container{overflow:hidden;border-radius:12px;position:relative;aspect-ratio:16/9;width:100%}
.player-host{width:100%;height:100%;position:relative}
#video{width:100%;height:100%;aspect-ratio:16/9;background-color:black}
.loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:white;animation:spin 1s ease-in-out infinite}
.shaka-spinner-container{display:none!important}
.video-info{margin-top:10px}
.video-title{font-size:20px;font-weight:600;margin:0 0 12px;color:#fff;text-align:left;overflow-wrap:break-word}
.metadata-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0 16px;border-bottom:1px solid #5e5e5e7c}
.channel-details{display:flex;flex-direction:column;text-align:left}
.channel-info{display:flex;align-items:center;gap:12px}
.channel-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#333}
.channel-name{font-size:16px;font-weight:500;margin:0;color:#fff}
.subscriber-count{color:#aaa;font-size:13px}
.video-stats{color:#aaa;font-size:14px;justify-content:center;align-items:center;display:flex;gap:12px}
.description{margin-top:12px;font-size:14px;line-height:1.5;overflow:hidden;position:relative;color:#fff;text-align:left;white-space:pre-wrap}
.separator{width:1px;height:24px;background-color:#5e5e5e7c}
.download-btn-container{position:relative;margin-left:8px}
.download-btn{display:flex;align-items:center;background:#333;color:#fff;border:none;border-radius:6px;padding:6px 12px;min-width:112px;height:30px;cursor:pointer;font-size:14px;transition:background .2s;position:relative;justify-content:center;opacity:.7;z-index:2;overflow:hidden}
.download-btn:hover{background:#393939}
.button-content{display:flex;align-items:center;justify-content:center}

.related-video-item{display:flex;margin-bottom:12px;cursor:pointer;text-decoration:none}
.related-thumbnail-container{position:relative;flex-shrink:0;margin-right:8px}
.related-thumbnail{border-radius:8px;background-color:#333;display:block}
.related-duration{position:absolute;bottom:4px;right:4px;background-color:rgba(0,0,0,.8);color:white;padding:2px 4px;border-radius:2px;font-size:11px;font-weight:500}
.related-video-details{display:flex;flex-direction:column;text-align:left;min-width:0}
.related-title{font-size:14px;font-weight:500;color:#fff;margin:0 0 4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
.related-metadata{font-size:12px;color:#aaa;margin:0 0 5px}

#status-toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;background:#242424;color:#fff;border:1px solid #444;border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.4);display:none;max-width:min(600px,calc(100vw - 32px))}
#status-toast.show{display:block}
#status-toast.bad{color:#ff8a80}
.build{font:11px Arial,sans-serif;color:#777;text-align:center;padding:16px 0 20px}

@media(max-width:1024px){
  ::-webkit-scrollbar{display:none}
  *{scrollbar-width:none}
  body{overflow:hidden}
  .app{margin:12px;height:calc(100vh - 24px);overflow-y:scroll}
  .watch-page{flex-direction:column;max-width:100%}
  .secondary{width:100%;margin-top:0}
  .empty-results,.search-results{margin-left:0}
}
@media(max-width:768px){
  .search-container{justify-content:space-between;gap:12px}
  .home-button{position:static;transform:none}
  .search-input-wrapper{max-width:calc(100% - 84px)}
  .empty-results,.search-results{left:auto;right:0;transform:none}
  .search-results{width:calc(100% - 36px)}
  .empty-results{width:calc(100% - 50px)}
  .settings-button{transform:none;padding:0;margin:0;border-radius:50%;position:static}
  .metadata-row{align-items:flex-start;gap:10px}
  .video-stats{font-size:12px;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .download-btn-container{display:none}
}
@media(min-width:1600px){.watch-page{max-width:calc(1200px + 402px + 24px)}}
</style>
</head>
