<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="1988 - xem, tìm kiếm, kênh và danh sách phát YouTube qua Piped.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/style.css?v=1988-2">
  <title>1988</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeButton" type="button" aria-label="Trang chủ">
      <span class="brand-mark">▶</span><span>1988</span>
    </button>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" inputmode="search" placeholder="Tìm kiếm" aria-label="Tìm kiếm">
      <button type="submit" aria-label="Tìm">⌕</button>
      <div class="suggestions" id="suggestions" hidden></div>
    </form>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Điều hướng">
    <button type="button" data-nav="home"><span>⌂</span><small>Trang chủ</small></button>
    <button type="button" data-nav="trending"><span>◉</span><small>Thịnh hành</small></button>
    <button type="button" data-nav="playlists"><span>☷</span><small>Danh sách</small></button>
    <button type="button" data-nav="history"><span>◷</span><small>Đã xem</small></button>
  </nav>

  <script type="module" src="./src/app.js?v=1988-2"></script>
</body>
</html>
