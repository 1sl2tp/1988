<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="1988">
  <meta name="description" content="1988 - xem YouTube không quảng cáo, PiP và âm thanh nền.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/style.css?v=fresh-5">
  <title>1988</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="1988">1988</a>
    <button id="installBtn" class="ghost-btn" type="button" hidden>Cài</button>
  </header>

  <main class="shell">
    <section class="search-box" aria-label="Tìm video">
      <form id="searchForm" autocomplete="off">
        <input id="queryInput" type="search" inputmode="search" placeholder="Tìm video hoặc dán link YouTube" aria-label="Tìm video hoặc dán link YouTube">
        <button type="submit">Tìm</button>
      </form>
    </section>

    <section id="playerSection" class="player-section" hidden>
      <div class="player-frame">
        <div id="yt-player"></div>
      </div>
      <div class="now">
        <div class="now-copy">
          <h1 id="videoTitle">1988</h1>
          <div id="videoMeta" class="video-meta"></div>
        </div>
        <div class="actions" aria-label="Chế độ phát">
          <button id="videoBtn" class="secondary-btn active" type="button" aria-pressed="true">Video</button>
          <button id="backgroundBtn" class="secondary-btn" type="button" aria-pressed="false">Âm thanh</button>
          <button id="pipBtn" class="secondary-btn" type="button" aria-pressed="false">PiP</button>
          <button id="lockBtn" class="secondary-btn" type="button" aria-pressed="false">Khóa</button>
          <button id="shareBtn" class="secondary-btn" type="button">Chia sẻ</button>
        </div>
        <div id="statusText" class="status-text">Video mở trực tiếp · âm thanh nền tách riêng</div>
      </div>
    </section>

    <section class="feed-section">
      <div class="section-head">
        <h2 id="feedTitle">Mới nhất</h2>
        <span id="feedStatus"></span>
      </div>
      <div id="feed" class="feed">
        <div class="loading">Đang tải…</div>
      </div>
    </section>
  </main>

  <audio id="bgAudio" preload="none" playsinline></audio>

  <div id="installSheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Cài 1988">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <strong>Cài 1988 trên iPhone</strong>
        <button id="closeInstallSheet" type="button" aria-label="Đóng">×</button>
      </div>
      <p>Mở trang này bằng Safari, bấm <b>Chia sẻ</b> → <b>Thêm vào Màn hình chính</b> → bật <b>Mở dưới dạng ứng dụng</b> → <b>Thêm</b>.</p>
    </div>
  </div>

  <script>
  (function(){
    if(!('serviceWorker' in navigator))return;
    window.addEventListener('load',async()=>{
      try{
        const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
        await reg.update().catch(()=>{});
      }catch(e){}
    });
  })();
  </script>
  <script src="./src/media-core.js?v=1"></script>
  <script src="./src/html5-background.js?v=7"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script defer src="./src/app.js?v=fresh-18"></script>
</body>
</html>
