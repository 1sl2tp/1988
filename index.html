  async function loadExistingSourceNames(){
    sourceNameChips.innerHTML="";

    const fallbackRows=[
      {key:"live",label:"Live"},
      {key:"latest",label:"Ngày"},
      {key:"week",label:"Tuần"}
    ];
    const sourceTabsKey="yt1988-source-tabs-v1";
    let storedRows=[];
    try{
      const saved=JSON.parse(localStorage.getItem(sourceTabsKey)||"[]");
      if(Array.isArray(saved)){
        storedRows=saved.filter(row=>row?.key&&row?.label);
      }
    }catch{}

    // Paint remembered tabs immediately; network state can refresh them later.
    renderExistingSourceNames(storedRows.length?storedRows:fallbackRows);

    // A reload restores the last fully committed Live package first. Even with
    // no network, the previous complete feed remains usable.
    const firstPackagePromise=(async()=>{
      await restoreStoredPackage("live");
      return showPackageScope("live");
    })();

    const statePromise=(async()=>{
      try{
        const response=await fetch(SOURCE_STATE_URL,{cache:"no-store"});
        if(!response.ok)throw new Error("source_state_"+response.status);
        const payload=await response.json();
        const remote=payload?.state&&typeof payload.state==="object"?payload.state:{};
        sourceStateRemote=remote;
        const rows=existingSourceTabNames(remote);
        try{localStorage.setItem(sourceTabsKey,JSON.stringify(rows))}catch{}
        return rows;
      }catch(_){
        return storedRows;
      }
    })();

    const manifestPromise=loadPackageManifest().then(async manifest=>{
      if(manifest?.live){
        await syncPreparedPackages(["live"]);
      }
      return manifest;
    });

    const [rowsFromState]=await Promise.all([
      statePromise,
      manifestPromise,
      firstPackagePromise
    ]);

    const rows=rowsFromState.length?rowsFromState:(storedRows.length?storedRows:fallbackRows);
    renderExistingSourceNames(rows);

    const scopes=rows
      .map(row=>row.key)
      .filter(scope=>!Object.keys(packageManifest).length||packageManifest[scope]);

    // Restore every previously committed package before any new download. Tab
    // clicks remain RAM-only even after a refresh or temporary loss of network.
    await Promise.all(scopes.map(scope=>restoreStoredPackage(scope)));
    if(feedMode==="package"){
      await showPackageScope(activePackageScope);
    }

    // Synchronizer compares manifest hashes and downloads only changed scopes.
    prefetchPackages(scopes);
    return rows;
  }

  let cardTintObserver=null;

  function paintCardTint(card){
    if(!card||card.dataset.tintReady==="1")return;
    card.dataset.tintReady="1";

    const thumb=card.querySelector(".row-thumb img");
    const art=String(thumb?.currentSrc||thumb?.src||"").trim();
    if(!/^https?:\/\//i.test(art))return;

    void youtubeCinematicPalette(art).then(palette=>{
      if(!palette||!card.isConnected)return;
      card.style.setProperty("--card-accent-rgb",palette.accent.join(","));
    });
  }

  function applyRenderedCardTints(rows){
    if(!rows)return;

    if(!("IntersectionObserver" in window)){
      rows.querySelectorAll(".row[data-video-id]").forEach(paintCardTint);
      return;
    }

    if(!cardTintObserver){
      cardTintObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          cardTintObserver.unobserve(entry.target);
          paintCardTint(entry.target);
        }
      },{root:null,rootMargin:"320px 0px",threshold:0.01});
    }

    rows.querySelectorAll(".row[data-video-id]").forEach(card=>{
      cardTintObserver.observe(card);
    });
  }

  let feedMasonryRaf=0;
  let feedMasonryObserver=null;

  function currentFeedColumnCount(){
    const raw=getComputedStyle(root).getPropertyValue("--feed-cols");
    return Math.max(1,Math.round(Number(raw)||1));
  }

  function layoutFeedMasonry(){
    const rows=document.getElementById("rows");
    if(!rows)return;

    const cards=[...rows.querySelectorAll(".row")];
    const cols=currentFeedColumnCount();
    const multi=cols>1&&cards.length>1;
    rows.classList.toggle("multi-column-feed",multi);

    // Ordinary list cards stay on strict shared rows so every thumbnail frame
    // starts on the same horizontal line. Masonry is only needed while a
    // portrait video is actually open inline and makes one card much taller.
    const hasTallInlinePortrait=
      multi &&
      !isTwoColumn() &&
      current?.kind==="portrait" &&
      !!rows.querySelector(".row-thumb.inline-playing:not(.pip-floating)");

    cards.forEach(card=>card.style.removeProperty("grid-row-end"));

    if(!hasTallInlinePortrait){
      rows.classList.remove("masonry-active");
      return;
    }

    rows.classList.add("masonry-active");

    const unit=4;
    const verticalGap=40;

    for(const card of cards){
      const height=Math.max(1,Math.ceil(card.getBoundingClientRect().height));
      const span=Math.max(1,Math.ceil((height+verticalGap)/unit));
      card.style.gridRowEnd="span "+span;
    }
  }

  function scheduleFeedMasonry(){
    if(feedMasonryRaf)return;
    feedMasonryRaf=requestAnimationFrame(()=>{
      feedMasonryRaf=0;
      layoutFeedMasonry();
      syncInlinePlayerOverlay();
    });
  }

  function observeFeedMasonryRows(){
    const rows=document.getElementById("rows");
    if(!rows)return;
    if(!feedMasonryObserver){
      feedMasonryObserver=new ResizeObserver(()=>scheduleFeedMasonry());
    }
    feedMasonryObserver.disconnect();
    rows.querySelectorAll(".row").forEach(card=>feedMasonryObserver.observe(card));
    scheduleFeedMasonry();
  }

  const preservedThumbNodes=new Map();
  const preservedAvatarNodes=new Map();
  const PRESERVED_IMAGE_LIMIT=120;

  function thumbPreserveKey(card,img){
    const id=String(card?.dataset?.videoId||"").trim();
    const base=String(img?.dataset?.thumbBase||"").trim();
    return id&&base?id+"|"+base:"";
  }

  function rememberRenderedThumbs(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-thumb img").forEach(img=>{
      const card=img.closest(".row[data-video-id]");
      const key=thumbPreserveKey(card,img);
      if(!key)return;
      img.remove();
      preservedThumbNodes.delete(key);
      preservedThumbNodes.set(key,img);
    });

    while(preservedThumbNodes.size>PRESERVED_IMAGE_LIMIT){
      const oldest=preservedThumbNodes.keys().next().value;
      if(!oldest)break;
      preservedThumbNodes.delete(oldest);
    }
  }

  function rememberRenderedAvatars(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-avatar-shell img.row-avatar").forEach(img=>{
      const card=img.closest(".row[data-video-id]");
      const id=String(card?.dataset?.videoId||"").trim();
      const src=String(img.getAttribute("src")||"").trim();
      const key=id&&src?id+"|"+src:"";
      if(!key)return;
      img.remove();
      preservedAvatarNodes.delete(key);
      preservedAvatarNodes.set(key,img);
    });

    while(preservedAvatarNodes.size>PRESERVED_IMAGE_LIMIT){
      const oldest=preservedAvatarNodes.keys().next().value;
      if(!oldest)break;
      preservedAvatarNodes.delete(oldest);
    }
  }

  function restoreRenderedThumbs(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-thumb img").forEach(fresh=>{
      const card=fresh.closest(".row[data-video-id]");
      const key=thumbPreserveKey(card,fresh);
      const cached=key?preservedThumbNodes.get(key):null;
      if(!(cached instanceof HTMLImageElement))return;

      // Keep the already-decoded image node when this video/package image is
      // unchanged. This avoids a decode/repaint flash when switching tabs or
      // when a package refresh repaints the same visible cards.
      cached.dataset.thumbBase=fresh.dataset.thumbBase||"";
      cached.dataset.thumbFallbackStage=fresh.dataset.thumbFallbackStage||"0";
      cached.loading=fresh.loading;
      cached.decoding=fresh.decoding;
      try{cached.fetchPriority=fresh.fetchPriority;}catch{}
      fresh.replaceWith(cached);
    });
  }

  function restoreRenderedAvatars(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-avatar-shell img.row-avatar").forEach(fresh=>{
      const card=fresh.closest(".row[data-video-id]");
      const id=String(card?.dataset?.videoId||"").trim();
      const src=String(fresh.getAttribute("src")||"").trim();
      const key=id&&src?id+"|"+src:"";
      const cached=key?preservedAvatarNodes.get(key):null;
      if(!(cached instanceof HTMLImageElement))return;
      cached.loading=fresh.loading;
      cached.decoding=fresh.decoding;
      fresh.replaceWith(cached);
    });
  }

  async function openChannelInApp(meta={}){
    const sourceId=validSourceId(meta?.sourceId);
    if(!sourceId)return false;

    const sourceName=String(meta?.sourceName||"").trim()||"Kênh";
    channelFeedBackStack.push(captureChannelFeedSnapshot());
    if(channelFeedBackStack.length>8)channelFeedBackStack.shift();

    const request=++channelFeedRequest;

    feedMode="channel";
    channelFeedSourceId=sourceId;

    sourceNameChips?.querySelectorAll?.(".source-chip[data-source-tab]")
      .forEach(chip=>chip.classList.remove("active"));

    const local=uniqueSearchMetas([
      ...feedMetas,
      ...relatedMetas,

    ].filter(item=>String(item?.sourceId||"").trim()===sourceId));

    feedMetas=local;
    renderSampleContent();
    syncFeedHeader();
    scrollPageToTop();

    try{
      if(!window.YT1988_API?.channel)return true;
      const payload=await window.YT1988_API.channel(sourceId);
      if(
        request!==channelFeedRequest ||
        feedMode!=="channel" ||
        channelFeedSourceId!==sourceId
      )return false;

      const fetched=collectVideoRows(payload)
        .filter(item=>String(item?.sourceId||sourceId).trim()===sourceId)
        .map(item=>{
          if(!item.sourceId)item.sourceId=sourceId;
          if(!item.sourceName)item.sourceName=sourceName;
          if(!item.sourceAvatar&&meta?.sourceAvatar)item.sourceAvatar=meta.sourceAvatar;
          return item;
        });

      feedMetas=uniqueSearchMetas([...local,...fetched]);
      renderSampleContent();
      syncFeedHeader();
      return true;
    }catch(error){
      console.warn("channel_view_failed",sourceId,error);
      return local.length>0;
    }
  }

  function feedVisualSignature(cards=[]){
    return cards.slice(0,18).map(meta=>[
      String(meta?.id||""),
      String(meta?.thumbnail||""),
      String(meta?.sourceAvatar||""),
      String(meta?.title||""),
      String(meta?.sourceName||""),
      String(meta?.durationLabel||""),
      String(meta?.viewsLabel||""),
      String(meta?.publishedLabel||""),
      meta?.isLive===true?"1":"0",
      meta?.verified===true?"1":"0"
    ].join("\u001f")).join("\u001e");
  }

  function renderSampleContent(){
    const rows=document.getElementById("rows");

    // The feed is authoritative. Never synthesize a fake card from current
    // player state when a package/search result is empty; that produced the
    // grey YouTube "..." thumbnail with source "1988".
    const cards=Array.isArray(feedMetas)?feedMetas:[];

    const activeInlineId=inlineVideoId;
    const wasFloating=!!pip && !!activeInlineId;

    // A feed render is authoritative. Never re-apply stale search text here;
    // otherwise clicking a source can load correctly but all new cards stay hidden.
    const rendered=cards.slice(0,18);
    const signature=feedVisualSignature(rendered);

    // Package hashes may change while the visible first page does not. Do not
    // destroy/recreate the same DOM in that case.
    if(rows.dataset.renderSignature===signature&&rows.querySelector(".row")){
      syncFeedHeader(rows);
      const currentId=String(current?.id||"");
      rows.querySelectorAll(".row[data-video-id]").forEach(row=>{
        row.classList.toggle("selected",String(row.dataset.videoId||"")===currentId);
      });
      if(activeInlineId){
        const activeCard=rows.querySelector('.row[data-video-id="'+activeInlineId+'"]');
        if(activeCard)attachPlayerToCard(activeCard,{floating:wasFloating});
        else if(!isTwoColumn())showPlayerAsPip();
      }
      observeRowThumbQuality(rows);
      applyRenderedCardTints(rows);
      observeFeedMasonryRows();
      return;
    }

    rememberRenderedThumbs(rows);
    rememberRenderedAvatars(rows);
    rows.innerHTML=feedHeaderMarkup()+rendered.map(cardMarkup).join("");
    rows.dataset.renderSignature=signature;
    syncFeedHeader(rows);
    restoreRenderedThumbs(rows);
    restoreRenderedAvatars(rows);
    observeRowThumbQuality(rows);
    applyRenderedCardTints(rows);

    if(activeInlineId){
      const card=rows.querySelector('.row[data-video-id="'+activeInlineId+'"]');
      if(card){
        attachPlayerToCard(card,{floating:wasFloating});
      }else if(!isTwoColumn()){
        showPlayerAsPip();
      }
    }else if(!isTwoColumn()){
      const routedId=routeVideoId();
      const currentId=String(current?.id||"").trim();
      if(routedId&&currentId&&routedId===currentId){
        const card=rows.querySelector('.row[data-video-id="'+currentId+'"]');
        if(card){
          inlineVideoId=currentId;
          attachPlayerToCard(card,{floating:false});
        }
      }
    }

    observeFeedMasonryRows();
  }

  function normalizedSearchQuery(value){
    return String(value||"").trim().replace(/\s+/g," ").toLocaleLowerCase("vi-VN");
  }

  function rememberRecentSearch(query,results=[]){
    const key=normalizedSearchQuery(query);
    if(!key)return;

    recentSearches=[key,...recentSearches.filter(item=>item!==key)].slice(0,2);
    try{
      localStorage.setItem(SEARCH_RECENT_KEY,JSON.stringify(recentSearches));
    }catch{}

    if(Array.isArray(results)&&results.length){
      searchCache.set(key,results.slice(0,18));
    }

    // Cache results for only the same 2 recent queries.
    for(const cachedKey of [...searchCache.keys()]){
      if(!recentSearches.includes(cachedKey))searchCache.delete(cachedKey);
    }
  }

  function uniqueSearchMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const meta of Array.isArray(items)?items:[]){
      const id=String(meta?.id||"").trim();
      if(!id||seen.has(id))continue;
      seen.add(id);
      out.push(meta);
      if(out.length>=18)break;
    }
    return out;
  }

  function localSearchMatches(query){
    const q=normalizedSearchQuery(query);
    if(!q)return [];

    // Current visible feed first, then already-downloaded packages. This is only
    // an instant first paint; the same click still launches global search.
    const pool=[
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat()
    ];

    return uniqueSearchMetas(pool.filter(meta=>{
      const hay=normalizedSearchQuery(
        (meta?.title||"")+" "+(meta?.sourceName||"")
      );
      return hay.includes(q);
    }));
  }

  function setSearchPending(active,token=0){
    if(!searchBox)return;
    if(active){
      searchBox.classList.add("search-pending");
      searchBox.setAttribute("aria-busy","true");
      return;
    }
    if(token&&token!==searchPendingSeq)return;
    searchBox.classList.remove("search-pending");
    searchBox.removeAttribute("aria-busy");
  }

  function showSearchResults(query,results=[]){
    const next=uniqueSearchMetas(results);
    if(!next.length)return false;

    feedMode="search";
    feedMetas=next;
    syncFeedHeader();
    primeMediaAspects(next,18);
    renderSampleContent();
    rememberRecentSearch(query,next);
    return true;
  }

  function showCachedSearchIfAvailable(query){
    const key=normalizedSearchQuery(query);
    if(!key)return false;

    const cached=searchCache.get(key);
    if(cached?.length)return showSearchResults(key,cached);
    return false;
  }

  async function runSearch(){
    const raw=(searchInput?.value||"").trim();
    const key=normalizedSearchQuery(raw);

    if(key)scrollPageToTop();

    if(!key){
      searchPendingSeq++;
      setSearchPending(false);
      void showPackageScope(activePackageScope);
      return;
    }

    const pendingToken=++searchPendingSeq;
    setSearchPending(true,pendingToken);

    // Exact repeat: paint the previous result immediately.
    const hadCached=showCachedSearchIfAvailable(key);

    // Otherwise paint matching content we already have in memory immediately.
    const localMatches=hadCached?[]:localSearchMatches(key);
    if(localMatches.length)showSearchResults(key,localMatches);

    // ONE user action always continues into the normal global search.
    const request=++feedRequest;
    try{
      if(!window.YT1988_API?.search)return;

      const payload=await window.YT1988_API.search(raw,"videos");
      if(request!==feedRequest)return;

      const globalResults=collectVideoRows(payload)
        .filter(meta=>meta.id&&meta.title);

      // Current-source/local matches get first positions only as a convenience;
      // global search is not restricted by the selected source.
      const merged=uniqueSearchMetas([
        ...(searchCache.get(key)||localMatches),
        ...globalResults
      ]);

      if(merged.length){
        showSearchResults(key,merged);
      }else if(!hadCached&&!localMatches.length){
        feedMode="search";
        feedMetas=[];
        renderSampleContent();
        rememberRecentSearch(key,[]);
      }
    }catch(_){
      // If instant cached/local results were already painted, keep them.
    }finally{
      setSearchPending(false,pendingToken);
    }
  }

  function selectedMetaNeedsLookup(meta){

  async function loadCurrentVideoMeta(){
    const request=++metaRequest;
    const requestedId=String(current?.id||"");
    const previousMeta=currentMeta;

    // Keep the selected card/list DOM and the provisional meta already supplied
    // by the package/search result. Rebuilding rows here caused a visible flash.
    try{
      const videoMetaApi=window.YT1988_API?.videoMeta||window.YT1988_API?.video;
      if(!videoMetaApi || !window.MediaMeta?.video){
        throw new Error("app data helpers unavailable");
      }

      // Deep-link/F5 only needs metadata here. Use the fast metadata endpoint
      // which skips slow stream probing and goes straight to oEmbed + exact-ID
      // search enrichment. Player loading continues independently.
      const payload=await videoMetaApi(requestedId);
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      const row=dataRow(payload);
      const nextMeta=cardMetaFromRow(row);
      if(!nextMeta.id)nextMeta.id=requestedId;

      // Package/search metadata may have hydrated currentMeta while this
      // request was in flight. Always merge into the newest same-video state;
      // never restore the stale snapshot captured before the request started.
      const latestBase=
        String(currentMeta?.id||"")===requestedId
          ? currentMeta
          : (previousMeta||{});
      currentMeta=mergeSelectedMeta(latestBase,nextMeta);

      const related=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.id!==requestedId)
        .slice(0,18);

      let feedChanged=false;
      if(related.length){
        relatedMetas=related;
        if(feedMode!=="search"&&feedMode!=="package"){
          feedMode="related";
          feedMetas=relatedMetas;
          feedChanged=true;
        }
      }

      renderCurrentInfo();
      applyHeaderTint(currentMeta);
      if(!currentMeta?.sourceAvatar){
        void hydrateCurrentSourceIdentity(requestedId);
      }

      // Only rebuild rows when the actual feed changed. Package/search card
      // lists remain untouched while the selected video metadata refreshes.
      if(feedChanged||!feedMetas.length)renderSampleContent();
      syncBoundaries();
    }catch(_){
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      // Keep any newer package/search hydration that arrived while the
      // request was in flight. Only fall back to the original snapshot when
      // there is no current metadata for this video.
      if(String(currentMeta?.id||"")!==requestedId){
        currentMeta=previousMeta;
      }
      renderCurrentInfo();
    }
  }

  function showPipUi(duration=1800){
    if(!pip||isTwoColumn())return;
    clearPipUiTimer();
    player.classList.add("pip-ui-visible");

  function clearMobilePipGestureGeometry(){
    clearPipUiTimer();
    pipGesture=null;
    player.classList.remove(
      "pip-ui-visible",
      "pip-gesture-active",
      "pip-docked-left",

  function mobilePipMinWidth(ratio){
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);
    const base=ratio<1?120:170;
    return Math.max(
      1,
      Math.min(
        base,
        viewportW-20,
        (viewportH-18)*Math.max(.34,ratio)
      )
    );
  }

  const PIP_DOCK_REVEAL=34;

  function mobilePipBounds(width,height,{allowDock=false}={}){
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);
    const headerBottom=mobileHeaderHidden
      ? 0
      : Math.max(0,Math.round(top.getBoundingClientRect().bottom||0));
    const gap=10;
    const reveal=Math.max(24,Math.min(PIP_DOCK_REVEAL,width));
    return {
      minLeft:allowDock?-(width-reveal):gap,
      maxLeft:allowDock?viewportW-reveal:Math.max(gap,viewportW-width-gap),
      minTop:headerBottom+8,
      maxTop:Math.max(headerBottom+8,viewportH-height-gap),
      viewportW,
      viewportH,
      gap,
      reveal
    };
  }

  function setMobilePipRect(left,topPos,width,height,{allowDock=false}={}){
    const bounds=mobilePipBounds(width,height,{allowDock});
    const x=Math.max(bounds.minLeft,Math.min(bounds.maxLeft,left));
    const y=Math.max(bounds.minTop,Math.min(bounds.maxTop,topPos));
    player.style.setProperty("left",Math.round(x)+"px","important");
    player.style.setProperty("right","auto","important");
    player.style.setProperty("top",Math.round(y)+"px","important");
    player.style.setProperty("bottom","auto","important");
    player.style.setProperty("width",Math.round(width)+"px","important");
    player.style.setProperty("height",Math.round(height)+"px","important");
  }

  function dockMobilePip(side){
    const rect=player.getBoundingClientRect();
    if(rect.width<1||rect.height<1)return;
    const bounds=mobilePipBounds(rect.width,rect.height,{allowDock:true});
    const left=side==="left"
      ?-(rect.width-bounds.reveal)
      :bounds.viewportW-bounds.reveal;
    player.classList.toggle("pip-docked-left",side==="left");
    player.classList.toggle("pip-docked-right",side==="right");
    setMobilePipRect(left,rect.top,rect.width,rect.height,{allowDock:true});
  }

  function beginMobilePipGesture(event,mode,edge=""){
    if(!pip||isTwoColumn())return;
    const rect=player.getBoundingClientRect();
    if(rect.width<1||rect.height<1)return;

    const ratio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      rect.width/Math.max(1,rect.height);

    if(mode==="move"){
      player.classList.remove("pip-docked-left","pip-docked-right");
    }

    pipGesture={
      mode,
      edge,
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      left:rect.left,
      top:rect.top,
      width:rect.width,
      height:rect.height,
      right:rect.right,
      bottom:rect.bottom,
      ratio
    };

    showPipUi(0);
    player.classList.add("pip-gesture-active");
    try{event.currentTarget.setPointerCapture(event.pointerId)}catch{}
    event.preventDefault();
    event.stopPropagation();
  }

  function updateMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;

    const dx=event.clientX-g.startX;
    const dy=event.clientY-g.startY;

    if(g.mode==="move"){
      setMobilePipRect(g.left+dx,g.top+dy,g.width,g.height,{allowDock:true});
      event.preventDefault();
      return;
    }

    const ratio=Math.max(.34,Math.min(2.6,g.ratio||16/9));
    const minW=mobilePipMinWidth(ratio);
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);

    const edge=String(g.edge||"");
    const fromLeft=edge.includes("left");
    const fromRight=edge.includes("right");
    const fromTop=edge.includes("top");
    const fromBottom=edge.includes("bottom");

    const widthFromX=fromLeft
      ? g.width-dx
      : fromRight
        ? g.width+dx
        : g.width;
    const widthFromY=fromTop
      ? (g.height-dy)*ratio
      : fromBottom
        ? (g.height+dy)*ratio
        : g.width;

    let nextW;
    if((fromLeft||fromRight)&&(fromTop||fromBottom)){
      // At a corner, whichever finger movement is stronger controls SIZE.
      nextW=Math.abs(dx)>=Math.abs(dy)?widthFromX:widthFromY;
    }else if(fromLeft||fromRight){
      nextW=widthFromX;
    }else{
      nextW=widthFromY;
    }

    const maxW=Math.max(
      minW,
      Math.min(viewportW-20,(viewportH-18)*ratio)
    );
    nextW=Math.max(minW,Math.min(maxW,nextW));
    const nextH=nextW/ratio;

    let nextLeft=g.left;
    let nextTop=g.top;
    if(fromLeft) nextLeft=g.right-nextW;
    if(fromTop) nextTop=g.bottom-nextH;

    setMobilePipRect(nextLeft,nextTop,nextW,nextH);
    event.preventDefault();
  }

  function endMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;
    try{event.currentTarget.releasePointerCapture(event.pointerId)}catch{}

    const dx=event.clientX-g.startX;
    const rect=player.getBoundingClientRect();
    pipGesture=null;
    player.classList.remove("pip-gesture-active");

    if(g.mode==="move"&&rect.width>0&&rect.height>0){
      const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
      const intent=Math.abs(dx)>=Math.max(28,Math.min(56,g.width*.16));
      if(intent&&dx<0&&rect.left<=12){
        dockMobilePip("left");
      }else if(intent&&dx>0&&rect.right>=viewportW-12){
        dockMobilePip("right");
      }else{
        player.classList.remove("pip-docked-left","pip-docked-right");
        setMobilePipRect(rect.left,rect.top,rect.width,rect.height);
      }
    }

    showPipUi(900);
    event.preventDefault();
    event.stopPropagation();
  }

  // Full-surface activation is intentionally disabled. Safe drag zones move
  // the PiP while the center and bottom remain native YouTube controls.
  void pipActivateZone;

  for(const zone of pipDragZones){
    zone.addEventListener("pointerdown",event=>{
      beginMobilePipGesture(event,"move");
    });
  }

  pipMoveZone?.addEventListener("pointerdown",event=>{
    beginMobilePipGesture(event,"move");
  });

  for(const edge of pipResizeEdges){
    edge.addEventListener("pointerdown",event=>{
      beginMobilePipGesture(event,"resize",edge.dataset.pipEdge||"");
    });
  }

  for(const zone of [pipMoveZone,...pipDragZones,...pipResizeEdges]){
    zone?.addEventListener("pointermove",updateMobilePipGesture,{passive:false});
    zone?.addEventListener("pointerup",endMobilePipGesture,{passive:false});
    zone?.addEventListener("pointercancel",endMobilePipGesture,{passive:false});
  }

  function layout(){
    syncBoundaries();

    root.classList.toggle("one-col",!two);

    root.classList.toggle("landscape",!portrait);
    root.classList.toggle("media-empty",two&&!/^[A-Za-z0-9_-]{11}$/.test(String(current?.id||"")));

    /* CSS owns all geometry:
       landscape follows width, portrait follows height. */

      if(inlineVideoId||pip||player.classList.contains("inline-overlay")){

        pip=false;

        }else{
          parkPlayerAtMainHome();
        }
      }
    }

    paintText();
  }

  function syncInlinePlayerOverlay(host=null){
    if(!useStableInlineOverlay())return false;
    host=host || inlineCardForCurrentVideo()?.querySelector(".row-thumb") || null;

  function attachPlayerToCard(card,{floating=false}={}){

  function syncPip(){
    if(isTwoColumn()){
      if(inlineVideoId||pip||player.classList.contains("inline-overlay")){
        returnPlayerToMainStage();
      }else{
        stage.classList.remove("pip-host");
        clearMobilePipGestureGeometry();
      }
      paintText();
      return;
    }

    const inlineCard=inlineCardForCurrentVideo();
    const host=inlineCard?.querySelector(".row-thumb")||null;

    // After a one-column card is selected, THAT thumbnail is the playback home.
    // The same player becomes PiP whenever that frame is not currently usable.
    if(inlineVideoId){
      if(!host||!host.isConnected){
        showPlayerAsPip();
        paintText();
        return;
      }

      const rect=host.getBoundingClientRect();
      const headerBottom=Math.max(0,Math.round(top.getBoundingClientRect().bottom||0));
      const viewportBottom=Math.max(
        1,
        Math.round(window.visualViewport?.height || document.documentElement.clientHeight || innerHeight || 1)
      );
      const visiblePixels=Math.max(
        0,
        Math.min(rect.bottom,viewportBottom)-Math.max(rect.top,headerBottom)
      );
      const hostVisible=visiblePixels>4;

      if(hostVisible){
        host.classList.remove("pip-floating");
        player.classList.remove("pip");
        player.classList.add("inline-overlay");
        stage.classList.add("pip-host");
        syncInlinePlayerOverlay(host);
        pip=false;
        clearMobilePipGestureGeometry();
      }else{
        host.classList.add("pip-floating");
        showPlayerAsPip();
      }
      paintText();
      return;
    }

    const currentId=String(current?.id||"").trim();
    if(/^[A-Za-z0-9_-]{11}$/.test(currentId)){
      const card=document.querySelector('.row[data-video-id="'+currentId+'"]');
      if(card){
        inlineVideoId=currentId;
        attachPlayerToCard(card,{floating:false});
      }else{
        inlineVideoId=currentId;
        showPlayerAsPip();
      }
      paintText();
      return;
    }

    parkPlayerAtMainHome();
    return;
  }

  function setMobileHeaderHidden(hidden){
    hidden=!!hidden && mobileHeaderMq.matches && !top.classList.contains("search-open");
    if(hidden===mobileHeaderHidden)return;

    mobileHeaderHidden=hidden;
    top.classList.toggle("mobile-scroll-hidden",hidden);
    root.style.setProperty(
      "--visible-top-boundary",
      hidden ? "0px" : Math.max(0,Math.round(top.offsetHeight||0))+"px"
    );
  }

  function syncMobileHeaderVisibility(reset=false){
    const y=pageScrollY();

    if(!mobileHeaderMq.matches){
      mobileHeaderLastY=y;
      setMobileHeaderHidden(false);
      return;
    }

    if(reset){
      mobileHeaderLastY=y;
      if(y<=4)setMobileHeaderHidden(false);
      return;
    }

    if(top.classList.contains("search-open")){
      mobileHeaderLastY=y;
      setMobileHeaderHidden(false);
      return;
    }

    const delta=y-mobileHeaderLastY;

    // Finger/content moves upward -> page scrollY increases -> hide.
    // Reverse direction -> reveal immediately. Always reveal at page top.
    if(y<=4){
      setMobileHeaderHidden(false);
    }else if(delta>6 && y>24){
      setMobileHeaderHidden(true);
    }else if(delta<-4){
      setMobileHeaderHidden(false);
    }

    mobileHeaderLastY=y;
  }

  function schedulePip(){

    raf=requestAnimationFrame(()=>{

  function stopVoiceSearch(abort=false){
    const recognition=voiceRecognition;
    voiceRecognition=null;
    if(recognition){
      try{
        if(abort)recognition.abort();
        else recognition.stop();
      }catch{}
    }
    setVoiceListening(false);
  }

  function startVoiceSearch(){
    if(!SpeechRecognitionCtor||!voiceSearchButton)return;
    if(voiceListening){
      stopVoiceSearch(false);
      return;
    }

    // Hide the software keyboard before opening microphone capture on phones.
    try{searchInput.blur()}catch{}

    const recognition=new SpeechRecognitionCtor();
    voiceRecognition=recognition;
    recognition.lang="vi-VN";
    recognition.continuous=false;
    recognition.interimResults=true;
    recognition.maxAlternatives=1;

    let submitted=false;
    recognition.onstart=()=>setVoiceListening(true);
    recognition.onresult=event=>{
      let interim="";
      let finalText="";
      for(let i=event.resultIndex;i<event.results.length;i++){
        const text=String(event.results[i]?.[0]?.transcript||"").trim();
        if(!text)continue;
        if(event.results[i].isFinal)finalText+=(finalText?" ":"")+text;
        else interim+=(interim?" ":"")+text;
      }

      const spoken=(finalText||interim).trim();
      if(spoken){
        searchInput.value=spoken;
        searchInput.dispatchEvent(new Event("input",{bubbles:true}));
      }

      if(finalText.trim()&&!submitted){
        submitted=true;
        void runSearch();
        try{recognition.stop()}catch{}
      }
    };
    recognition.onerror=event=>{
      if(event?.error==="not-allowed"||event?.error==="service-not-allowed"){
        voiceSearchButton.title="Cho phép micro để tìm bằng giọng nói";
      }
      setVoiceListening(false);
    };
    recognition.onend=()=>{
      if(voiceRecognition===recognition)voiceRecognition=null;
      setVoiceListening(false);
    };

    try{
      recognition.start();
    }catch{
      voiceRecognition=null;
      setVoiceListening(false);
    }
  }

  settingsPopover?.addEventListener("click",event=>event.stopPropagation());
  document.addEventListener("click",event=>{
    if(settingsPopover?.hidden)return;
    if(settingsButton?.contains(event.target)||settingsPopover?.contains(event.target))return;
    closeSettingsMenu();
  });
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape")closeSettingsMenu();
  });
  function applySourceUiEvent(event={}){
    if(event?.type!=="source-state")return;
    const id=validSourceId(event.id);
    const scope=String(event.scope||"").trim();
    const status=String(event.status||"");
    if(!id||!scope||!["selected","blocked","normal"].includes(status))return;
    patchLocalSourceStatus(id,status,scope);
  }

  try{
    sourceUiChannel?.addEventListener?.("message",event=>applySourceUiEvent(event.data));
  }catch{}

  addEventListener("storage",event=>{
    if(event.key===THEME_KEY){
      applyTheme(event.newValue,{persist:false});
      return;
    }
    if(event.key===SOURCE_UI_EVENT_KEY&&event.newValue){
      try{applySourceUiEvent(JSON.parse(event.newValue))}catch{}
      return;
    }
    if(event.key===SOURCE_ADMIN_AUTH_KEY){
      closeRowActionMenu();
    }
  });

  videoMenu?.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();
    const menu=ensureRowActionMenu();
    if(!menu.hidden&&openRowMenuAnchor===videoMenu){
      closeRowActionMenu();
      return;
    }
    showMainRowActionMenu(currentMeta||{},videoMenu);
  });

  sourcebar.addEventListener("click",event=>{
    const chip=event.target.closest(".source-chip[data-source-tab]");
    if(!chip)return;

    sourceNameChips.querySelectorAll(".source-chip[data-source-tab]").forEach(x=>x.classList.remove("active"));
    chip.classList.add("active");
    chip.scrollIntoView?.({behavior:"smooth",block:"nearest",inline:"nearest"});
    requestAnimationFrame(updateSourceRailArrows);

    // A source is a new top-level feed. Always open it from the top.
    scrollPageToTop();

    // Source selection is independent from search state. Invalidate any
    // in-flight global search so it cannot overwrite this source afterward.
    feedRequest++;
    channelFeedRequest++;
    channelFeedBackStack.length=0;
    channelFeedSourceId="";
    channelFeedName="";
    feedMode="package";
    void showPackageScope(chip.dataset.sourceTab||"live");
  });

  document.getElementById("rows").addEventListener("click",event=>{
    const channelBack=event.target.closest("[data-channel-back]");
    if(channelBack){
      event.preventDefault();
      event.stopPropagation();
      restorePreviousFeedFromChannel();
      return;
    }

    const autoplayToggle=event.target.closest("[data-autoplay-toggle]");
    if(autoplayToggle){
      event.preventDefault();
      event.stopPropagation();
      setAutoplayNext(!autoplayNext);
      return;
    }

    const menu=event.target.closest(".row-menu");
    const card=event.target.closest(".row");
    if(!card)return;

    if(menu){
      event.preventDefault();
      event.stopPropagation();

      const rowActionMenu=ensureRowActionMenu();
      if(!rowActionMenu.hidden&&openRowMenuAnchor===menu){
        closeRowActionMenu();
        return;
      }

      const id=String(card.dataset.videoId||"").trim();
      const selectedMeta=
        feedMetas.find(meta=>meta?.id===id)||
        relatedMetas.find(meta=>meta?.id===id)||
        metaForVideoId(id)||
        {};
      showMainRowActionMenu(selectedMeta,menu);
      return;
    }

    document.querySelectorAll(".row.selected").forEach(x=>x.classList.remove("selected"));
    card.classList.add("selected");

    const id=String(card.dataset.videoId||"").trim()||current.id;
    const selectedMeta=
      feedMetas.find(meta=>meta?.id===id)||
      relatedMetas.find(meta=>meta?.id===id)||
      null;

    if(!isTwoColumn()){
      openSelectedVideoInline(card,id);
    }

    if(navigateToVideo(id,selectedMeta)){
      renderCurrentInfo();

      // Package tabs are complete server snapshots: UI reads them only.
      // Search/deep-link flows may still fill genuinely missing fields.
      if(feedMode!=="package"&&selectedMetaNeedsLookup(selectedMeta)){
        void loadCurrentVideoMeta();
      }
      schedulePip();
    }
  });
  function runPrimaryVideoAction(kind,meta={},anchor=null){
    kind=String(kind||"");
    if(kind==="view-channel"){
      closeRowActionMenu();
      void openChannelInApp(meta);
      return true;
    }
    if(kind==="download"){
      openRowMenuMeta=meta||{};
      openRowMenuAnchor=anchor||videoMenu||null;
      showDownloadMenu();
      return true;
    }
    if(kind==="select-source"||kind==="block-source"){
      openRowMenuMeta=meta||{};
      openRowMenuAnchor=anchor||videoMenu||null;
      const wanted=kind==="select-source"?"selected":"blocked";
      if(feedMode==="package"&&activePackageScope){
        const currentStatus=directSourceStatus(meta.sourceId,activePackageScope);
        const nextStatus=currentStatus===wanted?"normal":wanted;
        void writeCardSourceStatus(meta,nextStatus,activePackageScope).then(()=>renderCurrentInfo());
      }else{
        showScopePicker(wanted);
      }
      return true;
    }
    return false;
  }

  document.addEventListener("click",event=>{
    const infoAction=event.target.closest?.("[data-info-action]");
    if(infoAction&&videoInfo?.contains(infoAction)){
      event.preventDefault();
      event.stopPropagation();
      runPrimaryVideoAction(
        String(infoAction.dataset.infoAction||""),
        currentMeta||{},
        infoAction
      );
      return;
    }

    const action=event.target.closest?.("[data-row-action]");
    if(action&&ensureRowActionMenu().contains(action)){
      event.preventDefault();
      event.stopPropagation();
      const kind=String(action.dataset.rowAction||"");
      const meta=openRowMenuMeta||{};

      if(kind==="back-main"){
        showMainRowActionMenu(meta,openRowMenuAnchor);
        return;
      }
      if(kind==="view-channel"||kind==="download"){
        runPrimaryVideoAction(kind,meta,openRowMenuAnchor);
        return;
      }
      if(kind==="download-mp4"){
        setDownloadRowStatus("mp4","Đang tải…");
        void startNativeDownload(meta,"mp4");
        return;
      }
      if(kind==="download-mp3"){
        setDownloadRowStatus("mp3","Đang tải…");
        void startNativeDownload(meta,"mp3");
        return;
      }
      if(kind==="select-source"||kind==="block-source"){
        runPrimaryVideoAction(kind,meta,openRowMenuAnchor);
        return;
      }
    }

    const scoped=event.target.closest?.("[data-row-scope][data-row-status]");
    if(scoped&&ensureRowActionMenu().contains(scoped)){
      event.preventDefault();
      event.stopPropagation();
      const scope=String(scoped.dataset.rowScope||"");
      const wanted=String(scoped.dataset.rowStatus||"");
      const meta=openRowMenuMeta||{};
      const currentStatus=directSourceStatus(meta.sourceId,scope);
      const nextStatus=currentStatus===wanted?"normal":wanted;
      void writeCardSourceStatus(meta,nextStatus,scope);
      return;
    }

    const rowMenu=ensureRowActionMenu();
    if(!rowMenu.hidden&&!rowMenu.contains(event.target)&&event.target!==openRowMenuAnchor){
      closeRowActionMenu();
    }
  });

  document.addEventListener("keydown",event=>{
    if(event.key==="Escape")closeRowActionMenu();
  });

  addEventListener("resize",()=>{
    const rowMenu=ensureRowActionMenu();
    if(!rowMenu.hidden)positionRowActionMenu(openRowMenuAnchor);
  },{passive:true});

  addEventListener("scroll",()=>{
    closeRowActionMenu();
    syncHeaderScrollState();
    schedulePip();
    syncMobileHeaderVisibility();
  },{passive:true});

  /* Breakpoint has exactly one owner: the same media query used by CSS. */
  columnsMq.addEventListener?.("change",()=>{
    if(matchMedia("(min-width:657px)").matches){
      top.classList.remove("search-open");
    }
    layout();
    scheduleFeedMasonry();
    updateHeaderSearchRoom();
    syncMobileHeaderVisibility(true);
    schedulePip();
  });

  /* Resize refreshes geometry, but never enter a scrollbar feedback loop. */
  let lastViewportW=document.documentElement.clientWidth||innerWidth||0;
  addEventListener("resize",()=>{
    const nextW=document.documentElement.clientWidth||innerWidth||0;
    const widthChanged=Math.abs(nextW-lastViewportW)>1;
    lastViewportW=nextW;

    if(widthChanged || document.documentElement.scrollWidth<=nextW+1){
      syncBoundaries();
    }
    updateHeaderSearchRoom();
    syncMobileHeaderVisibility(true);
    updateSourceRailArrows();
    schedulePip();
    scheduleFeedMasonry();
    syncInlinePlayerOverlay();
  },{passive:true});

  /* If title/search/source chrome changes height, every media mode receives
     the same new TOP without separate mode-specific calculations. */
  new ResizeObserver(()=>{
    updateHeaderSearchRoom();
    syncBoundaries();
    schedulePip();
  }).observe(top);

  new ResizeObserver(()=>{
    updateHeaderSearchRoom();
    updateSourceRailArrows();
  }).observe(sourceChips);

  window.visualViewport?.addEventListener?.("resize",()=>{
    syncBoundaries();
    syncMobileHeaderVisibility(true);
    schedulePip();
  },{passive:true});

  mobileHeaderLastY=pageScrollY();
  syncHeaderScrollState();
  syncMobileHeaderVisibility(true);

  // Establish empty/full media layout BEFORE creating the YouTube iframe.
  // On desktop root with no video id this prevents even a single frame of
  // pinned empty MAIN from appearing.
  layout();

  // MAIN stage is the permanent player home. In one-column/mobile the
  // media column is merely parked off-screen, so the iframe stays renderable.
  parkPlayerAtMainHome();

  // Start API/player creation as early as possible. No video is selected here,
  // so this cannot autoplay or resurrect the old waiting MAIN.
  void ensureYoutubePlayer();

  // Deep link owns the initial media. Setting it before loading packages prevents
  // Live's first item from replacing the requested video.
  openVideoFromLocation();

  loadExistingSourceNames();
  requestAnimationFrame(()=>{
    updateHeaderSearchRoom();
    updateSourceRailArrows();
  });
  document.fonts?.ready?.then?.(()=>{
    updateHeaderSearchRoom();
    updateSourceRailArrows();
  });

  addEventListener("popstate",event=>{
    openVideoFromLocation(event.state);
  });
  addEventListener("hashchange",()=>{
    // Covers a manually edited/pasted hash. Back/Forward is handled by popstate
    // and the second call becomes a harmless no-op because current.id matches.
    openVideoFromLocation(history.state);
  });
})();
</script>

<script>
if("serviceWorker" in navigator){
  addEventListener("load",()=>{
    navigator.serviceWorker
      .register("./sw.js",{updateViaCache:"none"})
      .then(registration=>registration.update())
      .catch(()=>{});
  },{once:true});
}
</script>
