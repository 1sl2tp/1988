<meta id="themeColorMeta" name="theme-color" content="rgba(33,33,33,.98)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1988">
<meta name="description" content="1988 - xem video nhanh.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>1988</title>
<script>
(()=>{
  try{
    const theme=localStorage.getItem("yt1988-theme-v1");
    if(theme==="light"||theme==="dark"){
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
      const meta=document.getElementById("themeColorMeta");
      if(meta)meta.setAttribute("content",theme==="light"?"#ffffff":"#212121");
    }
  }catch{}
})();
</script>

/* One-column no longer keeps a waiting MAIN player above the feed.
   Playback starts only inside the card the user selects.
   The media-query guard also applies BEFORE JS adds the one-col class, so the
   old empty MAIN info/menu cannot flash as a stray vertical ellipsis. */

  display:none!important;
}

    display:none!important;
  }

.top{
  position:sticky;
  top:0;
  z-index:50;
  width:100%;
  display:flex;
  align-items:center;
  padding-top:var(--safe-top);
  --header-alpha:var(--header-alpha-base);
  background:rgba(var(--header-rgb),var(--header-alpha));
  -webkit-backdrop-filter:saturate(145%) blur(var(--header-blur));
  backdrop-filter:saturate(145%) blur(var(--header-blur));
  border-bottom:0;
  transform:translateY(0);
  transition:
    transform .20s cubic-bezier(.4,0,.2,1),
    background-color .18s cubic-bezier(.2,0,0,1);
  will-change:transform;
}
.top::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:var(--header-wash-opacity);
  background:
    radial-gradient(
      62% 120% at 18% 50%,
      rgba(var(--header-accent-rgb),var(--header-wash-strong)) 0,
      rgba(var(--header-accent-rgb),var(--header-wash-mid)) 38%,
      rgba(var(--header-accent-rgb),0) 72%
    ),
    linear-gradient(
      90deg,
      rgba(var(--header-accent-rgb),var(--header-wash-soft)),
      transparent 45%,
      rgba(var(--header-accent-rgb),var(--header-wash-edge))
    );
  transition:opacity .22s cubic-bezier(.2,0,0,1);
}
.top.search-open::after{
  opacity:var(--header-search-wash-opacity);
  animation:search-chrome-wash .36s cubic-bezier(.2,0,0,1) both;
}
.top > *{
  position:relative;
  z-index:1;
}
@keyframes search-chrome-wash{
  from{opacity:.28;filter:saturate(.82)}
  to{opacity:.92;filter:saturate(1.12)}
}
.top.chrome-scrolled{
  --header-alpha:var(--header-alpha-scrolled);
}
.top.search-open{
  --header-alpha:var(--header-alpha-search);
}

}
.brand-mark svg{

}
.brand-name{

}
.searchbox{

}
.search-input{

.source-chip:hover{background:var(--yt-chip-hover)}

.source-chip.active{

      rgba(var(--header-accent-rgb),var(--accent-chip-strong)),
      rgba(var(--header-accent-rgb),var(--accent-chip-soft))

  box-shadow:

}
.source-arrow{
  position:absolute;
  top:0;
  bottom:0;
  z-index:4;
  width:52px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(var(--header-rgb),var(--header-alpha));
  overflow:visible;
  pointer-events:none;
}
.source-arrow[hidden]{display:none}
.source-arrow.left{left:0}
.source-arrow.right{right:0}

/* Hard guard: chips are fully clipped below the arrow zone.
   Only a short 16px feather remains toward the content. */
.source-arrow.left::after,
.source-arrow.right::before{
  content:"";
  position:absolute;
  top:0;
  width:16px;
  height:100%;
  pointer-events:none;
}
.source-arrow.left::after{
  left:100%;
  background:linear-gradient(
    to right,
    rgba(var(--header-rgb),var(--header-alpha)),
    rgba(var(--header-rgb),0)
  );
}
.source-arrow.right::before{
  right:100%;
  background:linear-gradient(
    to left,
    rgba(var(--header-rgb),var(--header-alpha)),
    rgba(var(--header-rgb),0)

}
.source-arrow-button{
  position:relative;

.settings-popover{

  box-shadow:var(--yt-menu-shadow);

.settings-popover-title{

.settings-popover-label{

.settings-source-link{

  min-height:44px;

  border-radius:10px;

.settings-source-link{
  margin-top:6px;
  border-top:1px solid var(--yt-divider);
  border-radius:0 0 10px 10px;

.settings-source-link svg{

  height:18px;
  margin-left:auto;

@media(max-width:656px){
  .settings-popover{
    top:calc(var(--safe-top) + 50px);
    right:8px;
  }

/* Plenty of horizontal room: expand search without hiding the source rail. */
.top.search-roomy:not(.search-open) .search-toggle{display:none}

  flex:0 0 var(--auto-search-w,360px);

.top.search-roomy:not(.search-open) .settings-button{

/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
/* MAIN 1 cột:
   ngang chạm mép = vuông;
   dọc là một media card độc lập = bo thống nhất với PiP / 2 cột. */
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  border-radius:0;
  background:transparent;
}

html.one-col.portrait .stage,

  border-radius:var(--floating-radius);
  background:transparent;
}
html.one-col.portrait .stage,
html.one-col.portrait .player{
  overflow:hidden;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  width:min(100%,calc(var(--current-full-h) * var(--media-ratio)));
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.portrait .player{
  inset:0;
  width:100%;
  height:100%;
  transform:none;
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:2147483000;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:calc(var(--visible-top-boundary,var(--top-boundary)) + 8px) !important;
  border-radius:var(--floating-radius);
  background:transparent;

  aspect-ratio:var(--media-ratio);
}

/* PiP interaction in every 1-column layout (mobile + PC).
   Tap anywhere once to reveal the top move grip.
   Resize has NO visible handle: drag from any edge. */
.pip-activate-zone,
.pip-move-zone,
.pip-resize-edge{display:none}

html.one-col .player.pip .pip-activate-zone{
  display:block;
  position:absolute;
  z-index:7;
  inset:0;
  touch-action:manipulation;
  background:transparent;
}
html.one-col .player.pip.pip-ui-visible .pip-activate-zone{
  pointer-events:none;
}

html.one-col .player.pip .pip-move-zone{
  display:block;
  position:absolute;
  z-index:11;
  top:0;
  left:50%;
  width:68px;
  height:32px;
  transform:translateX(-50%);
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
html.one-col .player.pip.pip-ui-visible .pip-move-zone,
html.one-col .player.pip.pip-gesture-active .pip-move-zone{
  opacity:1;
  pointer-events:auto;
}
html.one-col .player.pip .pip-move-zone:active{cursor:grabbing}
html.one-col .player.pip .pip-move-zone::after{
  content:"";
  position:absolute;
  left:50%;
  top:7px;
  width:32px;
  height:4px;
  transform:translateX(-50%);
  border-radius:999px;
  background:rgba(255,255,255,.94);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  pointer-events:none;

/* Invisible resize hit-zones. Bottom 36px is reserved for native YouTube seek/controls. */
html.one-col .player.pip .pip-resize-edge{
  display:block;
  position:absolute;
  z-index:10;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  background:transparent;
}

}
html.one-col .player.pip .pip-resize-right{
  right:0; top:0; bottom:36px; width:26px;
  cursor:ew-resize;
}
html.one-col .player.pip .pip-resize-top{
  left:0; right:0; top:0; height:26px;
  cursor:ns-resize;
}

/* Exact corners get their own generous invisible hit boxes. */

}
html.one-col .player.pip .pip-resize-top-left{

}
html.one-col .player.pip .pip-resize-top-right{

/* The center of the top edge belongs to MOVE, not resize. */

  html.two-col.landscape .media-col{

  html.two-col.portrait .media-col{

  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;

<script>
(() => {

  const VIDEO_META_URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-video-meta";

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const pipActivateZone=document.getElementById("pipActivateZone");

  const videoMenu=document.getElementById("videoMenu");

  const searchInput=document.getElementById("searchInput");

  const searchButton=document.getElementById("searchButton");

  const searchBack=document.getElementById("searchBack");

  const sourceNext=document.getElementById("sourceNext");
  const sourceNameChips=document.getElementById("sourceNameChips");
  const themeColorMeta=document.getElementById("themeColorMeta");
  const settingsButton=document.getElementById("settingsButton");
  const settingsPopover=document.getElementById("settingsPopover");
  const themeChoiceButtons=[...document.querySelectorAll("[data-theme-choice]")];

  let current={id:"",kind:"landscape",ratio:16/9,detectedRatio:0,label:""};
  let pip=false;
  let raf=0;
  let pipGesture=null;
  let pipUiTimer=0;
  let inlineVideoId="";

  let currentMeta=null;

  const packageCache=new Map();
  const packagePending=new Map();

  const THEME_KEY="yt1988-theme-v1";
  function normalizedTheme(value){
    return value==="light"?"light":"dark";
  }
  function syncThemeControls(){
    const current=normalizedTheme(root.dataset.theme);
    for(const button of themeChoiceButtons){
      button.setAttribute(

        button.dataset.themeChoice===current?"true":"false"

  }
  function applyTheme(value,{persist=true,retint=true}={}){
    const theme=normalizedTheme(value);
    root.dataset.theme=theme;
    root.style.colorScheme=theme;
    root.style.setProperty(
      "--header-rgb",

      themeColorMeta.setAttribute(

        theme==="light"?"#ffffff":"rgba(33,33,33,.98)"
      );
    }
    if(persist){
      try{localStorage.setItem(THEME_KEY,theme)}catch{}
    }
    syncThemeControls();
    if(retint&&currentMeta)applyHeaderTint(currentMeta);
  }
  function closeSettingsMenu(){
    if(!settingsPopover||!settingsButton)return;
    settingsPopover.hidden=true;
    settingsButton.setAttribute("aria-expanded","false");
  }
  function toggleSettingsMenu(){
    if(!settingsPopover||!settingsButton)return;
    const willOpen=settingsPopover.hidden;
    settingsPopover.hidden=!willOpen;
    settingsButton.setAttribute("aria-expanded",willOpen?"true":"false");
    if(willOpen)syncThemeControls();
  }

  applyTheme(root.dataset.theme||"dark",{persist:false,retint:false});

  // Search is independent from source tabs. Keep only the 2 most recent
  // queries/results so repeats can paint immediately without another click.
  const SEARCH_RECENT_KEY="yt1988-proof-recent-searches-v1";
  const searchCache=new Map();
  let recentSearches=[];
  const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition||null;
  let voiceRecognition=null;
  let voiceListening=false;
  if(voiceSearchButton)voiceSearchButton.hidden=!SpeechRecognitionCtor;
  try{
    const saved=JSON.parse(localStorage.getItem(SEARCH_RECENT_KEY)||"[]");
    if(Array.isArray(saved))recentSearches=saved.map(String).filter(Boolean).slice(0,2);
  }catch{}

  // Aspect belongs to the media id, never to the previous UI mode.
  const mediaAspectCache=new Map();
  const STANDARD_MEDIA_ASPECTS=[
    1,
    4/3,3/4,
    5/4,4/5,
    3/2,2/3,
    16/10,10/16,
    16/9,9/16,
    21/9,9/21
  ];
  const columnsMq=matchMedia("(min-width:1000px)");
  const mobileHeaderMq=matchMedia("(max-width:656px)");
  let mobileHeaderLastY=0;
  let mobileHeaderHidden=false;
  let headerRoomy=false;

  let ytPlayer=null;
  let ytPlayerReady=false;
  let pendingVideoId="";
  let youtubeApiPromise=null;

  // Server owns media aspect by video id; YouTube videoContentRect only
  // confirms/corrects the server cache after playback.
  const aspectPrimeCache=new Map();
  const aspectPrimePending=new Map();
  const aspectCorrectionSent=new Map();
  const sourceIdentityCache=new Map();
  const sourceIdentityPending=new Map();

  function validMediaAspect(value){
    const ratio=Number(value)||0;
    if(!Number.isFinite(ratio)||ratio<.34||ratio>2.6)return 0;

    let nearest=ratio;
    let delta=Infinity;
    for(const standard of STANDARD_MEDIA_ASPECTS){
      const next=Math.abs(standard-ratio);
      if(next<delta){
        nearest=standard;
        delta=next;
      }
    }
    return delta<=.05?nearest:ratio;
  }



  function cachedMediaAspect(id,{verifiedOnly=false}={}){
    const row=mediaAspectCache.get(String(id||"").trim());
    if(verifiedOnly&&row?.verified!==true)return 0;
    return validMediaAspect(row?.value);
  }

  function mediaAspectFromMeta(meta={}){
    if(!meta||typeof meta!=="object")return 0;
    if(meta.isShort===true)return 9/16;

    const direct=validMediaAspect(
      Number(meta.aspectRatio)||
      Number(meta.videoAspectRatio)||
      Number(meta.contentAspectRatio)||
      0
    );
    if(direct)return direct;

    const w=Number(meta.videoWidth||meta.width)||0;
    const h=Number(meta.videoHeight||meta.height)||0;
    return w>0&&h>0?validMediaAspect(w/h):0;
  }

  function rememberMediaAspect(id,ratio,source="",verified=false){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio)return 0;

    // Only the actual YouTube player content rectangle is allowed to define
    // media kind. Everything else is presentation/data only.
    if(source!=="iframe-content-rect"||verified!==true){
      return cachedMediaAspect(id)||0;
    }

    mediaAspectCache.set(id,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    return ratio;
  }

  function cachedPrimedAspect(id){
    const entry=aspectPrimeCache.get(String(id||"").trim());
    return validMediaAspect(entry?.value);
  }

  function applyServerAspectRow(id,row){
    id=String(id||"").trim();
    const ratio=validMediaAspect(row?.aspectRatio);
    if(!id||!ratio)return 0;

    aspectPrimeCache.set(id,{
      value:ratio,
      source:String(row?.aspectSource||"server"),
      verified:row?.aspectVerified===true,
      at:Date.now()
    });

    if(row?.aspectVerified===true){
      mediaAspectCache.set(id,{
        value:ratio,
        source:String(row?.aspectSource||"server"),
        verified:true,
        at:Date.now()
      });
    }
    return ratio;
  }

  function fetchServerAspects(ids=[],resolve=true){
    const unique=[...new Set(
      (Array.isArray(ids)?ids:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )].slice(0,24);
    if(!unique.length)return Promise.resolve({});

    const url=VIDEO_META_URL+
      "?ids="+encodeURIComponent(unique.join(","))+
      (resolve?"&resolve=1":"");

    return fetch(url,{cache:"no-store"})
      .then(response=>{
        if(!response.ok)throw new Error("aspect_http_"+response.status);
        return response.json();
      })
      .then(payload=>{
        const data=payload?.data&&typeof payload.data==="object"?payload.data:{};
        for(const id of unique){
          if(data[id])applyServerAspectRow(id,data[id]);
        }
        return data;
      })
      .catch(()=>({}));
  }

  function primeMediaAspect(id){
    id=String(id||"").trim();
    if(!id)return Promise.resolve(0);

    const cached=cachedPrimedAspect(id);
    if(cached)return Promise.resolve(cached);
    if(aspectPrimePending.has(id))return aspectPrimePending.get(id);

    const task=fetchServerAspects([id],true)
      .then(data=>validMediaAspect(data?.[id]?.aspectRatio)||cachedPrimedAspect(id)||0)
      .finally(()=>aspectPrimePending.delete(id));

    aspectPrimePending.set(id,task);
    return task;
  }

  function primeMediaAspects(metas=[],limit=18){
    const list=(Array.isArray(metas)?metas:[])
      .filter(meta=>meta?.id)
      .slice(0,Math.max(0,limit));

    // Package/search metadata from the server is authoritative for first paint.
    for(const meta of list){
      const ratio=mediaAspectFromMeta(meta);
      if(ratio){
        const id=String(meta.id);
        aspectPrimeCache.set(id,{
          value:ratio,
          source:String(meta?._aspectSource||"server-package"),
          verified:meta?._aspectVerified===true,
          at:Date.now()
        });
        if(meta?._aspectVerified===true){
          mediaAspectCache.set(id,{
            value:ratio,
            source:String(meta?._aspectSource||"server-package"),
            verified:true,
            at:Date.now()
          });
        }
      }
    }

    const missing=list
      .map(meta=>String(meta.id||""))
      .filter(id=>id&&!cachedPrimedAspect(id));

    if(!missing.length)return;

    // One background batch for the whole visible list. Click never waits on it.
    const run=()=>{ void fetchServerAspects(missing,true); };
    if("requestIdleCallback" in window){
      requestIdleCallback(run,{timeout:180});
    }else{
      setTimeout(run,0);
    }
  }

  function mediaLayoutKindFromRatio(ratio){
    ratio=validMediaAspect(ratio)||16/9;
    return ratio<1?"portrait":"landscape";
  }

  function applyMediaLayoutSelection(kind,{relayout=true}={}){
    kind=kind==="portrait"?"portrait":"landscape";
    const fallback=kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallback;

    current={
      ...current,
      kind,
      ratio:mediaRatio
    };

    // Shape chooses BLACK; exact media aspect chooses the crop viewport.
    root.dataset.mediaShape=kind;
    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    if(relayout){
      layout();
      schedulePip();
      scheduleFeedMasonry();
    }
    return kind;
  }

  function commitCurrentAspect(id,ratio,{relayout=true}={}){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio||String(current?.id||"")!==id)return false;

    const previousRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      0;
    const kind=mediaLayoutKindFromRatio(ratio);
    const shapeChanged=current?.kind!==kind;
    const ratioChanged=!previousRatio||Math.abs(previousRatio-ratio)>.002;

    current={
      ...current,
      detectedRatio:ratio
    };
    applyMediaLayoutSelection(kind,{
      relayout:relayout&&(shapeChanged||ratioChanged)
    });
    return shapeChanged||ratioChanged;
  }

  const headerColorCache=new Map();

  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    let h=0,s=0;
    const l=(max+min)/2;
    const d=max-min;
    if(d){
      s=d/(1-Math.abs(2*l-1));
      if(max===r)h=((g-b)/d)%6;
      else if(max===g)h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60;
      if(h<0)h+=360;
    }
    return [h,s,l];
  }

  function hslToRgb(h,s,l){
    const cc=(1-Math.abs(2*l-1))*s;
    const x=cc*(1-Math.abs((h/60)%2-1));
    const m=l-cc/2;
    let rr=0,gg=0,bb=0;
    if(h<60){rr=cc;gg=x}
    else if(h<120){rr=x;gg=cc}
    else if(h<180){gg=cc;bb=x}
    else if(h<240){gg=x;bb=cc}
    else if(h<300){rr=x;bb=cc}
    else{rr=cc;bb=x}
    return [rr,gg,bb].map(v=>Math.round((v+m)*255));
  }

  function youtubeCinematicPalette(url){
    url=String(url||"").trim();
    if(!url)return Promise.resolve(null);
    if(headerColorCache.has(url))return headerColorCache.get(url);

    const task=new Promise(resolve=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.decoding="async";
      img.onload=()=>{
        try{
          const w=24,h=14;
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d",{willReadFrequently:true});
          if(!ctx){resolve(null);return;}
          ctx.drawImage(img,0,0,w,h);
          const data=ctx.getImageData(0,0,w,h).data;
          const buckets=new Map();

          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const i=(y*w+x)*4;
            if(data[i+3]<128)continue;
            const r=data[i],g=data[i+1],b=data[i+2];
            const lum=.2126*r+.7152*g+.0722*b;
            if(lum<24||lum>238)continue;
            const max=Math.max(r,g,b),min=Math.min(r,g,b);
            const sat=max?((max-min)/max):0;
            const nx=(x-(w-1)/2)/(w/2),ny=(y-(h-1)/2)/(h/2);
            const center=1+Math.max(0,1-Math.sqrt(nx*nx+ny*ny))*.55;
            const weight=center*(.45+sat*1.65);
            const key=((r>>5)<<6)|((g>>5)<<3)|(b>>5);
            const row=buckets.get(key)||{r:0,g:0,b:0,w:0};
            row.r+=r*weight;row.g+=g*weight;row.b+=b*weight;row.w+=weight;
            buckets.set(key,row);
          }

          let winner=null;
          for(const row of buckets.values()){
            if(!winner||row.w>winner.w)winner=row;
          }
          if(!winner||winner.w<=0){resolve(null);return;}

          const source=[winner.r/winner.w,winner.g/winner.w,winner.b/winner.w].map(Math.round);
          const hsl=rgbToHsl(source[0],source[1],source[2]);
          hsl[1]=Math.max(.42,Math.min(.88,hsl[1]*1.08));
          hsl[2]=Math.max(.48,Math.min(.68,hsl[2]));
          const accent=hslToRgb(hsl[0],hsl[1],hsl[2]);
          resolve({accent});
        }catch{
          resolve(null);
        }
      };
      img.onerror=()=>resolve(null);
      img.src=url;
    });

    headerColorCache.set(url,task);
    return task;
  }

  let headerTintSeq=0;
  function applyHeaderTint(meta=currentMeta){
    const art=String(
      meta?.thumbnail||
      meta?.thumbnailUrl||
      meta?.poster||
      ""
    ).trim();
    if(!/^https?:\/\//i.test(art))return;

    const seq=++headerTintSeq;
    void youtubeCinematicPalette(art).then(palette=>{
      if(seq!==headerTintSeq||!palette)return;

      const light=root.dataset.theme==="light";
      // The sampled video color is theme-neutral. Dark and light each blend
      // that same accent into their own base, preventing a dark/dirty cast in
      // light mode while preserving the cinematic tint.
      const base=light?[255,255,255]:[15,15,15];
      const mix=light?.075:.128;
      const [r,g,b]=palette.accent.map((value,index)=>Math.round(
        base[index]*(1-mix)+value*mix
      ));
      root.style.setProperty("--header-rgb",r+","+g+","+b);
      root.style.setProperty(
        "--header-accent-rgb",
        palette.accent.join(",")
      );

      // Do NOT paint browser/PWA status chrome with the media color.
      // Keeping this neutral avoids a persistent colored notch strip while
      // the in-page header itself scrolls away underneath black-translucent.
      if(themeColorMeta){
        themeColorMeta.setAttribute(
          "content",
          light?"#ffffff":"rgba(33,33,33,.98)"
        );
      }
    });
  }

  function youtubeContentRect(player=ytPlayer){
    const candidates=[
      player?.playerInfo?.videoContentRect,
      player?.videoContentRect,
      player?.playerInfo?.video_content_rect
    ];

    for(const rect of candidates){
      const width=Number(rect?.width)||0;
      const height=Number(rect?.height)||0;
      if(width<=0||height<=0)continue;

      const aspectRatio=validMediaAspect(width/height);
      if(!aspectRatio)continue;
      return {width,height,aspectRatio};
    }
    return null;
  }

  function reportVerifiedAspect(id,rect){
    id=String(id||"").trim();
    const ratio=validMediaAspect(rect?.aspectRatio);
    if(!id||!ratio)return;

    const signature=[
      ratio.toFixed(5),
      Math.round(Number(rect?.width)||0),
      Math.round(Number(rect?.height)||0)
    ].join(":");
    if(aspectCorrectionSent.get(id)===signature)return;
    aspectCorrectionSent.set(id,signature);

    void fetch(VIDEO_META_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        videoId:id,
        aspectRatio:ratio,
        width:Math.round(Number(rect?.width)||0),
        height:Math.round(Number(rect?.height)||0)
      }),
      keepalive:true

  function syncCurrentKindFromYoutubePlayer(player=ytPlayer){
    if(!player||!current?.id)return false;

    const expectedId=String(current.id||"").trim();
    let loadedId="";
    try{
      const data=player.getVideoData?.()||{};
      loadedId=String(data.video_id||data.videoId||"").trim();
    }catch{}

    // During loadVideoById() YouTube can briefly expose the previous video's rect.
    // Accept geometry only after YouTube explicitly reports THIS media id.
    if(!loadedId||loadedId!==expectedId)return false;

    const rect=youtubeContentRect(player);
    if(!rect)return false;

    const ratio=rememberMediaAspect(
      expectedId,
      rect.aspectRatio,
      "iframe-content-rect",
      true
    );
    if(!ratio)return false;

    commitCurrentAspect(expectedId,ratio,{relayout:true});
    aspectPrimeCache.set(expectedId,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()

  function loadYoutubeIframeApi(){
    if(window.YT&&typeof window.YT.Player==="function"){
      return Promise.resolve(window.YT);
    }
    if(youtubeApiPromise)return youtubeApiPromise;

    youtubeApiPromise=new Promise(resolve=>{
      const previous=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{
        try{previous?.()}catch{}
        resolve(window.YT||null);
      };

      if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
        const script=document.createElement("script");
        script.src="https://www.youtube.com/iframe_api";
        script.async=true;
        document.head.appendChild(script);
      }

      const started=Date.now();
      const timer=setInterval(()=>{
        if(window.YT&&typeof window.YT.Player==="function"){
          clearInterval(timer);
          resolve(window.YT);
        }else if(Date.now()-started>10000){
          clearInterval(timer);
          resolve(null);
        }
      },80);
    });
    return youtubeApiPromise;
  }

  async function ensureYoutubePlayer(){
    if(ytPlayer)return ytPlayer;

    const YTApi=await loadYoutubeIframeApi();
    if(!YTApi?.Player||ytPlayer)return ytPlayer;

    ytPlayer=new YTApi.Player("videoFrame",{
      host:"https://www.youtube-nocookie.com",
      width:"100%",
      height:"100%",
      playerVars:{
        autoplay:1,
        playsinline:1,
        controls:1,
        cc_load_policy:0,
        rel:0,
        fs:1,
        disablekb:0,
        modestbranding:1,
        iv_load_policy:3,
        enablejsapi:1,
        origin:location.origin,
        widget_referrer:location.href
      },
      events:{
        onReady(event){
          ytPlayerReady=true;
          configurePlayerIframe(event.target);

          const id=String(pendingVideoId||current?.id||"").trim();
          pendingVideoId="";
          if(!id)return;

          try{
            event.target.loadVideoById(id);
            event.target.playVideo?.();
          }catch{}
        },
        onStateChange(event){
          if(event.data===YTApi.PlayerState.PLAYING){
            scheduleCurrentPlayerKind(event.target);
          }
        },
        onError(event){
          // Packages are server-filtered for embed support before publishing.
          // Keep a single playback engine only: never switch to another player.
          const code=Number(event?.data)||0;
          if(code)console.warn("youtube_embed_error",code,String(current?.id||""));
        }
      }
    });

    return ytPlayer;
  }

  function playVideoId(id,meta=null,{history="none"}={}){
    id=String(id||"").trim();
    if(!id)return false;

    const confirmedRatio=
      mediaAspectCache.get(id)?.source==="iframe-content-rect"
        ?cachedMediaAspect(id,{verifiedOnly:true})
        :0;
    const metaRatio=mediaAspectFromMeta(meta||{});
    const primedRatio=cachedPrimedAspect(id);

    // Never delay the click. The list should already have primed this media.
    // If data is still missing, preserve the current shell instead of forcing
    // a new temporary 16:9 state.
    const fallbackRatio=
      validMediaAspect(current?.detectedRatio)||
      (current?.kind==="portrait"?9/16:16/9);

    const resolvedAspect=
      confirmedRatio||
      metaRatio||
      primedRatio||
      fallbackRatio;

    const kind=mediaLayoutKindFromRatio(resolvedAspect);

    if(meta?.id===id){
      currentMeta=meta;
      applyHeaderTint(meta);
    }else if(String(current?.id||"")!==id){
      currentMeta=null;
    }

    // media -> kind; MAIN / PiP / 2-column only consume it.
    current={
      id,
      kind,
      ratio:kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio,
      detectedRatio:resolvedAspect,
      label:meta?.title||"Video"
    };
    applyMediaLayoutSelection(kind,{relayout:true});
    if(history==="push"){
      syncVideoDocumentIdentity({push:true});
    }else if(history==="replace"){
      syncVideoDocumentIdentity({push:false});
    }else{
      syncVideoDocumentIdentity({push:false,write:false});
    }
    if(!currentMeta?.sourceAvatar){
      void hydrateCurrentSourceIdentity(id);
    }

    // PLAY IMMEDIATELY.
    // IMPORTANT on mobile Safari/PWA: if the YT player is already ready,
    // call loadVideoById/playVideo synchronously inside the user's click.
    // Deferring this through Promise.then() can lose the user-activation token
    // and leave the video paused until a second tap.
    pendingVideoId=id;
    let playedInGesture=false;

    if(ytPlayer&&ytPlayerReady){
      pendingVideoId="";
      try{
        ytPlayer.loadVideoById(id);
        ytPlayer.playVideo?.();
        playedInGesture=true;
      }catch{}
    }

    if(!playedInGesture){
      void ensureYoutubePlayer().then(playerApi=>{
        if(!playerApi||String(current?.id||"")!==id)return;
        if(!ytPlayerReady)return;

        pendingVideoId="";
        try{
          playerApi.loadVideoById(id);
          playerApi.playVideo?.();
        }catch{}
      });
    }

    // Only fill a missing cache in parallel. Never block the click.
    if(!confirmedRatio&&!metaRatio&&!primedRatio){
      void primeMediaAspect(id).then(ratio=>{
        if(!ratio||String(current?.id||"")!==id)return;
        if(mediaAspectCache.get(id)?.source==="iframe-content-rect")return;
        commitCurrentAspect(id,ratio,{relayout:true});
      });
    }

    return true;
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // YouTube source family: normal rich cards roughly 270..500px,
    // skeleton flex-basis around 310px. Pick a count near 310 without
    // allowing cards to drift outside the 270..500 band.
    const MIN=270;
    const TARGET=310;
    const MAX=500;

    const maxCols=Math.max(1,Math.floor((feedW+gap)/(MIN+gap)));
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    const fallbackRatio=
      current?.kind==="portrait"
        ? VIDEOS.portrait.ratio
        : VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallbackRatio;

    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      current?.kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(
      0,
      Math.round(top.offsetHeight || top.getBoundingClientRect().height || 0)
    );
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const contentTopGap=12;
    const fullH=Math.max(1,viewportH-topBoundary-contentTopGap-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    if(!root.style.getPropertyValue("--visible-top-boundary")){
      root.style.setProperty("--visible-top-boundary",topBoundary+"px");
    }
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP keeps the existing visual size policy. Rail only changes how the
    // native YouTube source is built/cropped inside that viewport.
    const viewportW=Math.max(
      1,
      Math.round(document.documentElement.clientWidth || innerWidth || 1)
    );
    // Mobile opens PiP at the SAME Library minimum SIZE as web:
    // landscape min width = 170px, portrait min width = 120px.
    // Do not let very tall portrait ratios become narrower than the web minimum.
    const mobilePip=viewportW<=656;
    const mobileAvailableW=Math.max(1,viewportW-20);
    const mobileLandscapeMinW=Math.min(170,mobileAvailableW);
    const mobilePortraitMinW=Math.min(120,mobileAvailableW);

    const pipLandscapeW=mobilePip
      ? mobileLandscapeMinW
      : Math.max(170,Math.min(280,Math.round(viewportW*.46)));
    const pipPortraitH=mobilePip
      ? Math.max(1,Math.round(mobilePortraitMinW/mediaRatio))
      : Math.max(240,Math.min(420,Math.round(fullH*.50)));

    root.style.setProperty("--pip-landscape-w",pipLandscapeW+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    const pageW=viewportW;
    const pageEdge=viewportW<480?12:24;
    const cardGap=32;
    const mediaGap=16;
    root.style.setProperty("--feed-edge-gap",pageEdge+"px");
    root.style.setProperty("--card-gap-x",cardGap+"px");
    root.style.setProperty("--card-gap-y","40px");
    root.style.setProperty("--card-meta-gap","12px");
    root.style.setProperty("--layout-gap",mediaGap+"px");
    root.style.setProperty("--card-target-w","310px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(pageEdge*2));
      const cols=chooseCardColumns(feedW,cardGap);
      root.style.setProperty("--feed-cols",String(cols));
    }else{
      const contentW=Math.max(1,pageW-(pageEdge*2));

      // Keep the existing feed-width family, but media now fits by the REAL
      // cropped video height. No title/chrome safe-zone estimation is needed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));
      const widthCap=Math.max(1,contentW-mediaGap-desiredFeedW);
      const heightDrivenW=Math.max(1,Math.round(fullH*mediaRatio));
      const mediaW=Math.min(widthCap,heightDrivenW);

      const feedW=Math.max(1,contentW-mediaGap-mediaW);
      const cols=chooseCardColumns(feedW,cardGap);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      root.style.setProperty("--feed-cols",String(cols));
    }
  }

  function escapeHtml(value=""){

      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")

  function videoTitleSlug(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[đĐ]/g,match=>match==="Đ"?"D":"d")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")

  function routeVideoId(){
    const hash=decodeURIComponent(String(location.hash||""));
    const fromHash=hash.match(/(?:^|\/)watch\/.*?([A-Za-z0-9_-]{11})$/i)?.[1]||
      hash.match(/([A-Za-z0-9_-]{11})$/)?.[1]||
      "";
    if(fromHash)return fromHash;

    try{
      const legacy=new URLSearchParams(location.search).get("v")||"";
      if(/^[A-Za-z0-9_-]{11}$/.test(legacy))return legacy;
    }catch{}
    return "";
  }

  function historyVideoId(state=history.state){
    const id=String(state?.videoId||"").trim();

  function videoHistoryState(id,title=""){

  function canonicalVideoHash(id,title=""){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";

    const cleanTitle=String(title||"").trim();
    const slug=
      cleanTitle && cleanTitle.toLowerCase()!=="video"
        ? videoTitleSlug(cleanTitle)
        : "";

    return "#/watch/"+(slug?slug+"-":"")+id;
  }

  function syncVideoDocumentIdentity({push=false,write=true}={}){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const title=String(currentMeta?.title||current?.label||"").trim();
    const meaningfulTitle=title&&title.toLowerCase()!=="video"?title:"";
    document.title=meaningfulTitle?meaningfulTitle+" · 1988":"1988";
    if(!write)return;

    const stateId=historyVideoId();
    const routeId=routeVideoId();
    const existingId=stateId||routeId;
    const currentHash=String(location.hash||"");
    const hasCanonicalHash=/^#\/watch\//i.test(currentHash);

    // A direct/deep link is also a real video history entry. Keep its readable
    // slug while metadata is still loading, but mark the browser state now.
    if(
      existingId===id &&
      hasCanonicalHash &&
      !meaningfulTitle
    ){
      if(stateId!==id){
        history.replaceState(
          videoHistoryState(id,""),
          "",
          location.pathname+location.search+location.hash
        );
      }
      return;
    }

    const nextHash=canonicalVideoHash(id,meaningfulTitle);
    if(!nextHash)return;

    const nextUrl="/"+nextHash;
    const nextState=videoHistoryState(id,meaningfulTitle);

    // User-selected videos become separate browser-history entries.
    // Metadata/title refreshes only rewrite the current entry.
    if(push&&existingId!==id){
      history.pushState(nextState,"",nextUrl);
      return;
    }

    if(
      stateId!==id ||
      location.pathname!=="/" ||
      location.search ||
      currentHash!==nextHash
    ){
      history.replaceState(nextState,"",nextUrl);
    }
  }

  function navigateToVideo(id,meta=null,{replace=false}={}){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    const previousId=historyVideoId()||routeVideoId();
    const title=String(meta?.title||"").trim();
    const nextHash=canonicalVideoHash(id,title);
    if(!nextHash)return false;

    // The first media in this document establishes the current browser entry.
    // Every later user-selected media gets its own entry, so Back/Forward is
    // always video <-> video instead of falling into an empty same-page route.
    const state=videoHistoryState(id,title);
    if(replace||!previousId){
      history.replaceState(state,"","/"+nextHash);
    }else if(previousId!==id){
      history.pushState(state,"","/"+nextHash);
    }else{
      history.replaceState(state,"","/"+nextHash);
    }

    return playVideoId(id,meta,{history:"none"});
  }

  function metaForVideoId(id){

  function openVideoFromLocation(state=history.state){
    const id=historyVideoId(state)||routeVideoId();
    if(!id){
      // Compatibility with legacy empty app entries created by older builds.
      // Do not leave the same video on screen under a route with no video.
      if(String(current?.id||"")){

    if(id===String(current?.id||""))return false;

    const meta=metaForVideoId(id);
    // Browser Back/Forward owns the selected entry. Replay it only; never
    // create or replace history while traversing.
    if(!playVideoId(id,meta,{history:"none"}))return false;
    renderCurrentInfo();
    loadCurrentVideoMeta();
    schedulePip();
    return true;
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    const videoWidth=Number(row?.videoWidth)||0;
    const videoHeight=Number(row?.videoHeight)||0;
    const genericWidth=Number(row?.width)||0;
    const genericHeight=Number(row?.height)||0;
    const isShort=row?.isShort===true||row?.is_short===true;
    const aspectRatio=validMediaAspect(
      (isShort?9/16:0)||
      Number(row?.aspectRatio)||
      Number(row?.videoAspectRatio)||
      (
        videoWidth>0&&videoHeight>0
          ?videoWidth/videoHeight
          :0
      )||
      (
        genericWidth>0&&genericHeight>0
          ?genericWidth/genericHeight
          :0
      )
    );
    return {
      ...meta,
      verified:cardVerified(row),
      isShort,
      videoWidth,
      videoHeight,
      aspectRatio,
      mediaKind:String(row?.mediaKind||""),
      _aspectVerified:
        row?._aspectVerified===true||
        (videoWidth>0&&videoHeight>0)||
        isShort,
      _aspectSource:String(row?.aspectSource||row?._aspectSource||"")
    };
  }

  function mergeSelectedMeta(base={},supplemental={}){
    const keep=(key)=>{
      const value=base?.[key];
      return value!==undefined&&value!==null&&value!=="";
    };

    // Supplemental data fills gaps; only meaningful selected-card fields
    // are protected below. Empty strings from the old card must not erase
    // sourceId/avatar/channel metadata returned by the video lookup.
    const merged={...base,...supplemental};

    // The selected package/search card is the visible contract.
    // Direct video lookup may fill gaps, but must not rename/relabel it.
    for(const key of [
      "title","sourceName","sourceAvatar","thumbnail",
      "viewsLabel","publishedLabel","durationLabel",
      "isLive","verified","mediaKind","aspectRatio",
      "videoWidth","videoHeight","_aspectVerified","_aspectSource"
    ]){
      if(keep(key))merged[key]=base[key];
    }

    return merged;
  }

  function applySourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const avatar=String(identity?.sourceAvatar||"").trim();
    const name=String(identity?.sourceName||"").trim();
    if(!id||(!avatar&&!name))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta.id||"").trim()!==id)return;
      if(avatar&&!meta.sourceAvatar)meta.sourceAvatar=avatar;
      if(name&&!meta.sourceName)meta.sourceName=name;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(String(current?.id||"")===id){
      renderCurrentInfo();
      applyHeaderTint(currentMeta);
    }

    if(avatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;
        oldAvatar.outerHTML=
          '<img class="row-avatar" src="'+escapeHtml(avatar)+'" alt="">';
      });
    }
    return true;
  }

  async function hydrateCurrentSourceIdentity(id=String(current?.id||"")){
    id=String(id||"").trim();
    if(!id||String(current?.id||"")!==id)return false;

    const meta=currentMeta||{};
    if(meta.sourceAvatar)return true;

    const sourceId=String(meta.sourceId||"").trim();
    if(!/^UC[A-Za-z0-9_-]{20,}$/.test(sourceId))return false;

    const cached=sourceIdentityCache.get(sourceId);
    if(cached){
      return applySourceIdentityToVideo(id,cached);
    }

    if(sourceIdentityPending.has(sourceId)){
      const identity=await sourceIdentityPending.get(sourceId);
      if(String(current?.id||"")!==id)return false;
      return applySourceIdentityToVideo(id,identity);
    }

    if(!window.YT1988_API?.channel||!window.MediaMeta?.source)return false;

    const task=(async()=>{
      try{
        const payload=await window.YT1988_API.channel(sourceId);
        const row=dataRow(payload);
        const source=window.MediaMeta.source(row);
        const identity={
          sourceName:String(source?.name||"").trim(),
          sourceAvatar:String(source?.avatar||"").trim()
        };
        if(identity.sourceAvatar||identity.sourceName){
          sourceIdentityCache.set(sourceId,identity);
        }
        return identity;
      }catch{
        return {};
      }finally{
        sourceIdentityPending.delete(sourceId);
      }
    })();

    sourceIdentityPending.set(sourceId,task);
    const identity=await task;
    if(String(current?.id||"")!==id)return false;
    return applySourceIdentityToVideo(id,identity);
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function packageMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const row of Array.isArray(items)?items:[]){
      const meta=cardMetaFromRow(row);
      if(!meta?.id||!meta?.title||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    primeMediaAspects(out,18);
    return out;
  }

  function hydrateCurrentMetaFromPackage(metas=[]){
    const id=String(current?.id||"").trim();
    if(!id)return false;

    const packageMeta=(Array.isArray(metas)?metas:[])
      .find(meta=>String(meta?.id||"").trim()===id);
    if(!packageMeta)return false;

    // Package/server metadata is the canonical list record. A direct video
    // lookup may have filled extra fields, but it must not leave avatar/name
    // blank when the package already knows them.
    currentMeta=mergeSelectedMeta(
      packageMeta,
      currentMeta||{}
    );

    if(currentMeta?.title){
      current.label=currentMeta.title;
    }

    renderCurrentInfo();
    applyHeaderTint(currentMeta);
    syncVideoDocumentIdentity({push:false});
    return true;
  }

  async function loadPackageManifest(){
    try{
      const response=await fetch(PACKAGE_SYNC_URL,{cache:"no-store"});
      if(!response.ok)throw new Error("package_manifest_"+response.status);
      const payload=await response.json();
      packageManifest=
        payload?.manifest && typeof payload.manifest==="object"
          ? payload.manifest
          : {};
      return packageManifest;
    }catch(_){
      packageManifest={};
      return packageManifest;
    }
  }

  async function getPackage(scope,{force=false}={}){
    scope=String(scope||"").trim();
    if(!scope)return [];

    if(!force&&packageCache.has(scope)){
      const cached=packageCache.get(scope);
      hydrateCurrentMetaFromPackage(cached);
      return cached;
    }
    if(packagePending.has(scope))return packagePending.get(scope);

    const task=(async()=>{
      try{
        const response=await fetch(
          PACKAGE_SYNC_URL+"?scope="+encodeURIComponent(scope),
          {cache:"no-store"}
        );
        if(!response.ok)throw new Error("package_"+scope+"_"+response.status);
        const payload=await response.json();
        const pkg=payload?.package;
        const items=payload?.ok&&payload?.exists&&Array.isArray(pkg?.items)
          ? pkg.items
          : [];
        const metas=packageMetas(items);
        packageCache.set(scope,metas);

        // Important for deep links: the video may have started from
        // YT1988_API.video(id) before its source package finished loading.
        // As soon as any package containing this id arrives, hydrate the
        // canonical channel avatar/name/title from that package.
        hydrateCurrentMetaFromPackage(metas);

        return metas;
      }catch(_){
        return packageCache.get(scope)||[];
      }finally{
        packagePending.delete(scope);
      }
    })();

    packagePending.set(scope,task);
    return task;
  }

  async function showPackageScope(scope,{force=false}={}){
    scope=String(scope||"").trim()||"live";
    activePackageScope=scope;
    feedMode="package";
    const request=++feedRequest;

    const cached=packageCache.get(scope);
    if(cached?.length){
      feedMetas=cached;
      renderSampleContent();
    }

    const metas=await getPackage(scope,{force});
    if(request!==feedRequest||activePackageScope!==scope||feedMode!=="package")return;
    feedMetas=metas;
    renderSampleContent();

    if(isTwoColumn()&&!String(current?.id||"")&&metas[0]?.id){
      if(navigateToVideo(metas[0].id,metas[0],{replace:true})){
        renderCurrentInfo();
        loadCurrentVideoMeta();
      }
    }
  }

  function prefetchPackages(scopes=[]){
    const unique=[...new Set((Array.isArray(scopes)?scopes:[]).map(String).filter(Boolean))];
    setTimeout(()=>{
      for(const scope of unique){
        if(scope===activePackageScope||packageCache.has(scope))continue;
        void getPackage(scope);
      }
    },0);
  }

  function parseSourceOrder(labels={}){
    try{
      const raw=labels?.__source_order;
      const parsed=Array.isArray(raw)?raw:JSON.parse(String(raw||"[]"));
      return Array.isArray(parsed)?parsed.map(String).filter(Boolean):[];
    }catch{
      return [];
    }
  }

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

  function renderExistingSourceNames(rows=[]){
    if(!sourceNameChips)return;
    const list=Array.isArray(rows)?rows.filter(row=>row?.key&&row?.label):[];
    sourceNameChips.innerHTML=list.map((row,index)=>
      '<button class="source-chip'+(index===0?' active':'')+'" data-source-tab="'+escapeHtml(row.key)+'">'+
        escapeHtml(row.label)+
      '</button>'
    ).join("");
    sourceScroll?.scrollTo?.({left:0,behavior:"auto"});
    requestAnimationFrame(()=>{
      updateHeaderSearchRoom();

  function naturalSourceChipsWidth(){
    if(!sourceNameChips)return 0;

    let total=0;
    const chips=sourceNameChips.querySelectorAll(".source-chip[data-source-tab]");
    chips.forEach(chip=>{
      const style=getComputedStyle(chip);
      total+=chip.getBoundingClientRect().width;
      total+=parseFloat(style.marginLeft)||0;
      total+=parseFloat(style.marginRight)||0;
    });
    return Math.ceil(total);
  }

  function updateHeaderSearchRoom(){
    if(!top||!sourceChips)return;

    // Mobile keeps the compact icon; explicit search always owns the row.
    if(mobileHeaderMq.matches||top.classList.contains("search-open")){
      headerRoomy=false;
      top.classList.remove("search-roomy");
      top.style.removeProperty("--auto-search-w");
      return;
    }

    const headerW=Math.max(
      0,
      top.clientWidth||
      document.documentElement.clientWidth||
      window.innerWidth||
      0
    );

    // IMPORTANT: do not use sourceChips.scrollWidth here.
    // The flex/block rail expands to its parent, so scrollWidth can look almost
    // as wide as the whole header even when the actual chips occupy much less.
    const chipsW=naturalSourceChipsWidth();

    // Reserve outer spacing plus the separate mic + settings buttons.
    // They sit beside the search pill on roomy desktop, like YouTube.
    const chromeReserve=108;
    const surplus=Math.max(0,headerW-chipsW-chromeReserve);

    // Full search is useful from 280px upward; let it grow with the real spare
    // space but cap it near YouTube's desktop search width.
    const roomy=chipsW>0&&surplus>=280;
    const searchW=roomy
      ?Math.min(640,Math.max(280,Math.floor(surplus)))
      :0;

    headerRoomy=roomy;
    top.classList.toggle("search-roomy",roomy);
    if(roomy)top.style.setProperty("--auto-search-w",searchW+"px");
    else top.style.removeProperty("--auto-search-w");
  }

  function updateSourceRailArrows(){
    if(!sourceScroll||!sourcePrev||!sourceNext)return;
    const max=Math.max(0,sourceScroll.scrollWidth-sourceScroll.clientWidth);
    const left=Math.max(0,sourceScroll.scrollLeft);
    sourcePrev.hidden=left<=2;
    sourceNext.hidden=max<=2||left>=max-2;
  }

  function moveSourceRail(direction){
    if(!sourceScroll)return;
    const step=Math.max(180,Math.min(360,Math.round(sourceScroll.clientWidth*.55)));
    sourceScroll.scrollBy({left:direction*step,behavior:"smooth"});
  }

  sourcePrev?.addEventListener("click",()=>moveSourceRail(-1));
  sourceNext?.addEventListener("click",()=>moveSourceRail(1));
  sourceScroll?.addEventListener("scroll",updateSourceRailArrows,{passive:true});

  async function loadExistingSourceNames(){
    sourceNameChips.innerHTML="";

    const fallbackRows=[
      {key:"live",label:"Live"},
      {key:"latest",label:"Ngày"},
      {key:"week",label:"Tuần"}
    ];

    // Paint the canonical rail immediately instead of waiting for network state.
    renderExistingSourceNames(fallbackRows);

    // Critical startup path: fetch the first real media package immediately.
    // Do NOT serialize it behind source-state or manifest requests.
    const firstPackagePromise=showPackageScope("live",{force:true});

    const statePromise=(async()=>{
      try{
        const response=await fetch(SOURCE_STATE_URL,{cache:"no-store"});
        if(!response.ok)throw new Error("source_state_"+response.status);
        const payload=await response.json();
        const remote=payload?.state&&typeof payload.state==="object"?payload.state:{};
        return existingSourceTabNames(remote);
      }catch(_){
        return [];
      }
    })();

    const manifestPromise=loadPackageManifest();

    const [rowsFromState]=await Promise.all([
      statePromise,
      manifestPromise,
      firstPackagePromise
    ]);

    const rows=rowsFromState.length?rowsFromState:fallbackRows;
    renderExistingSourceNames(rows);

    const scopes=rows
      .map(row=>row.key)
      .filter(scope=>!Object.keys(packageManifest).length||packageManifest[scope]);

    // Live is already loaded above; warm only the remaining packages.
    prefetchPackages(scopes.filter(scope=>scope!=="live"));
    return rows;
  }

  function applyRenderedCardTints(rows){

    rows.querySelectorAll(".row[data-video-id]").forEach(card=>{
      const thumb=card.querySelector(".row-thumb img");
      const art=String(thumb?.src||"").trim();
      if(!/^https?:\/\//i.test(art))return;
      void youtubeCinematicPalette(art).then(palette=>{
        if(!palette||!card.isConnected)return;
        card.style.setProperty("--card-accent-rgb",palette.accent.join(","));
      });
    });
  }

  let feedMasonryRaf=0;
  let feedMasonryObserver=null;

  function currentFeedColumnCount(){
    const raw=getComputedStyle(root).getPropertyValue("--feed-cols");
    return Math.max(1,Math.round(Number(raw)||1));
  }

  function layoutFeedMasonry(){
    const rows=document.getElementById("rows");
    if(!rows)return;

    const cards=[...rows.querySelectorAll(".row")];
    const cols=currentFeedColumnCount();

    if(cols<=1||cards.length<=1){
      rows.classList.remove("masonry-active");
      cards.forEach(card=>card.style.removeProperty("grid-row-end"));
      return;
    }

    rows.classList.add("masonry-active");

    const unit=4;
    const verticalGap=40;
    cards.forEach(card=>card.style.removeProperty("grid-row-end"));

    for(const card of cards){
      const height=Math.max(1,Math.ceil(card.getBoundingClientRect().height));
      const span=Math.max(1,Math.ceil((height+verticalGap)/unit));
      card.style.gridRowEnd="span "+span;
    }
  }

  function scheduleFeedMasonry(){
    if(feedMasonryRaf)return;
    feedMasonryRaf=requestAnimationFrame(()=>{
      feedMasonryRaf=0;
      layoutFeedMasonry();
    });
  }

  function observeFeedMasonryRows(){
    const rows=document.getElementById("rows");
    if(!rows)return;
    if(!feedMasonryObserver){
      feedMasonryObserver=new ResizeObserver(()=>scheduleFeedMasonry());
    }
    feedMasonryObserver.disconnect();
    rows.querySelectorAll(".row").forEach(card=>feedMasonryObserver.observe(card));
    scheduleFeedMasonry();
  }

  function renderSampleContent(){
    const rows=document.getElementById("rows");
    const meta=currentMeta || {};
    const cards=feedMetas.length
      ? feedMetas
      : [meta.id?meta:{...meta,id:current.id,title:current.label}];

    const activeInlineId=inlineVideoId;
    const wasFloating=!!pip && !!activeInlineId;
    const playerWasInRows=!!player.closest(".row-thumb");

    // Detach the same player before rows.innerHTML replaces its host card.
    // Modern browsers use moveBefore() when available to preserve iframe state.
    if(playerWasInRows){
      movePlayerNode(stage);
    }

    // A feed render is authoritative. Never re-apply stale search text here;
    // otherwise clicking a source can load correctly but all new cards stay hidden.
    const rendered=cards.slice(0,18);
    rows.innerHTML=rendered.map(cardMarkup).join("");
    applyRenderedCardTints(rows);

    if(activeInlineId){
      const card=rows.querySelector('.row[data-video-id="'+activeInlineId+'"]');
      if(card){
        attachPlayerToCard(card,{floating:wasFloating});
      }
    }else if(!isTwoColumn()){
      const routedId=routeVideoId();
      const currentId=String(current?.id||"").trim();
      if(routedId&&currentId&&routedId===currentId){
        const card=rows.querySelector('.row[data-video-id="'+currentId+'"]');
        if(card){
          inlineVideoId=currentId;
          attachPlayerToCard(card,{floating:false});
        }
      }
    }

    observeFeedMasonryRows();
  }

  function normalizedSearchQuery(value){
    return String(value||"").trim().replace(/\s+/g," ").toLocaleLowerCase("vi-VN");
  }

  function rememberRecentSearch(query,results=[]){
    const key=normalizedSearchQuery(query);
    if(!key)return;

    recentSearches=[key,...recentSearches.filter(item=>item!==key)].slice(0,2);
    try{
      localStorage.setItem(SEARCH_RECENT_KEY,JSON.stringify(recentSearches));
    }catch{}

    if(Array.isArray(results)&&results.length){
      searchCache.set(key,results.slice(0,18));
    }

    // Cache results for only the same 2 recent queries.
    for(const cachedKey of [...searchCache.keys()]){
      if(!recentSearches.includes(cachedKey))searchCache.delete(cachedKey);
    }
  }

  function uniqueSearchMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const meta of Array.isArray(items)?items:[]){
      const id=String(meta?.id||"").trim();
      if(!id||seen.has(id))continue;
      seen.add(id);
      out.push(meta);
      if(out.length>=18)break;
    }
    return out;
  }

  function localSearchMatches(query){
    const q=normalizedSearchQuery(query);
    if(!q)return [];

    // Current visible feed first, then already-downloaded packages. This is only
    // an instant first paint; the same click still launches global search.
    const pool=[
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat()
    ];

    return uniqueSearchMetas(pool.filter(meta=>{
      const hay=normalizedSearchQuery(
        (meta?.title||"")+" "+(meta?.sourceName||"")
      );
      return hay.includes(q);
    }));
  }

  function showSearchResults(query,results=[]){
    const next=uniqueSearchMetas(results);
    if(!next.length)return false;

    feedMode="search";
    feedMetas=next;
    primeMediaAspects(next,18);
    renderSampleContent();
    rememberRecentSearch(query,next);
    return true;
  }

  function showCachedSearchIfAvailable(query){
    const key=normalizedSearchQuery(query);
    if(!key)return false;

    const cached=searchCache.get(key);
    if(cached?.length)return showSearchResults(key,cached);
    return false;
  }

  async function runSearch(){
    const raw=(searchInput?.value||"").trim();
    const key=normalizedSearchQuery(raw);

    if(key)scrollPageToTop();

    if(!key){
      void showPackageScope(activePackageScope);
      return;
    }

    // Exact repeat: paint the previous result immediately.
    const hadCached=showCachedSearchIfAvailable(key);

    // Otherwise paint matching content we already have in memory immediately.
    const localMatches=hadCached?[]:localSearchMatches(key);
    if(localMatches.length)showSearchResults(key,localMatches);

    // ONE user action always continues into the normal global search.
    const request=++feedRequest;
    try{
      if(!window.YT1988_API?.search)return;

      const payload=await window.YT1988_API.search(raw,"videos");
      if(request!==feedRequest)return;

      const globalResults=collectVideoRows(payload)
        .filter(meta=>meta.id&&meta.title);

      // Current-source/local matches get first positions only as a convenience;
      // global search is not restricted by the selected source.
      const merged=uniqueSearchMetas([
        ...(searchCache.get(key)||localMatches),
        ...globalResults
      ]);

      if(merged.length){
        showSearchResults(key,merged);
      }else if(!hadCached&&!localMatches.length){
        feedMode="search";
        feedMetas=[];
        renderSampleContent();
        rememberRecentSearch(key,[]);
      }
    }catch(_){
      // If instant cached/local results were already painted, keep them.
    }
  }

  async function loadFeedData(){
    await loadPackageManifest();
    return showPackageScope(activePackageScope,{force:true});
  }

  async function loadCurrentVideoMeta(){
    const request=++metaRequest;
    const requestedId=String(current?.id||"");
    const previousMeta=currentMeta;

    // Keep the selected card/list DOM and the provisional meta already supplied
    // by the package/search result. Rebuilding rows here caused a visible flash.
    try{
      if(!window.YT1988_API?.video || !window.MediaMeta?.video){
        throw new Error("app data helpers unavailable");
      }

      const payload=await window.YT1988_API.video(requestedId);
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      const row=dataRow(payload);
      const nextMeta=cardMetaFromRow(row);
      if(!nextMeta.id)nextMeta.id=requestedId;

      // Package/search metadata may have hydrated currentMeta while this
      // request was in flight. Always merge into the newest same-video state;
      // never restore the stale snapshot captured before the request started.
      const latestBase=
        String(currentMeta?.id||"")===requestedId
          ? currentMeta
          : (previousMeta||{});
      currentMeta=mergeSelectedMeta(latestBase,nextMeta);

      const related=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.id!==requestedId)
        .slice(0,18);

      let feedChanged=false;
      if(related.length){
        relatedMetas=related;
        if(feedMode!=="search"&&feedMode!=="package"){
          feedMode="related";
          feedMetas=relatedMetas;
          feedChanged=true;
        }
      }

      renderCurrentInfo();
      applyHeaderTint(currentMeta);
      if(!currentMeta?.sourceAvatar){
        void hydrateCurrentSourceIdentity(requestedId);
      }

      // Only rebuild rows when the actual feed changed. Package/search card
      // lists remain untouched while the selected video metadata refreshes.
      if(feedChanged||!feedMetas.length)renderSampleContent();
      syncBoundaries();
    }catch(_){
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      // Keep any newer package/search hydration that arrived while the
      // request was in flight. Only fall back to the original snapshot when
      // there is no current metadata for this video.
      if(String(currentMeta?.id||"")!==requestedId){
        currentMeta=previousMeta;
      }
      renderCurrentInfo();
    }
  }
  function clearPipUiTimer(){
    if(!pipUiTimer)return;
    clearTimeout(pipUiTimer);
    pipUiTimer=0;
  }

  function showPipUi(duration=1800){
    if(!pip||isTwoColumn())return;
    clearPipUiTimer();
    player.classList.add("pip-ui-visible");
    if(duration>0){
      pipUiTimer=setTimeout(()=>{
        pipUiTimer=0;
        if(!pipGesture)player.classList.remove("pip-ui-visible");
      },duration);
    }
  }

  function clearMobilePipGestureGeometry(){
    clearPipUiTimer();
    pipGesture=null;
    player.classList.remove("pip-ui-visible","pip-gesture-active");
    for(const prop of ["left","right","top","bottom","width","height"]){
      player.style.removeProperty(prop);
    }
  }

  function mobilePipMinWidth(ratio){
    return ratio<1?120:170;
  }

  function mobilePipBounds(width,height){
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);
    const headerBottom=mobileHeaderHidden
      ? 0
      : Math.max(0,Math.round(top.getBoundingClientRect().bottom||0));
    const gap=10;
    return {
      minLeft:gap,
      maxLeft:Math.max(gap,viewportW-width-gap),
      minTop:headerBottom+8,
      maxTop:Math.max(headerBottom+8,viewportH-height-gap),
      viewportW,
      viewportH,
      gap
    };
  }

  function setMobilePipRect(left,topPos,width,height){
    const bounds=mobilePipBounds(width,height);
    const x=Math.max(bounds.minLeft,Math.min(bounds.maxLeft,left));
    const y=Math.max(bounds.minTop,Math.min(bounds.maxTop,topPos));
    player.style.setProperty("left",Math.round(x)+"px","important");
    player.style.setProperty("right","auto","important");
    player.style.setProperty("top",Math.round(y)+"px","important");
    player.style.setProperty("bottom","auto","important");
    player.style.setProperty("width",Math.round(width)+"px","important");
    player.style.setProperty("height",Math.round(height)+"px","important");
  }

  function beginMobilePipGesture(event,mode,edge=""){
    if(!pip||isTwoColumn())return;
    const rect=player.getBoundingClientRect();
    if(rect.width<1||rect.height<1)return;

    const ratio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      rect.width/Math.max(1,rect.height);

    pipGesture={
      mode,
      edge,
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      left:rect.left,
      top:rect.top,
      width:rect.width,
      height:rect.height,
      right:rect.right,
      bottom:rect.bottom,
      ratio
    };

    showPipUi(0);
    player.classList.add("pip-gesture-active");
    try{event.currentTarget.setPointerCapture(event.pointerId)}catch{}
    event.preventDefault();
    event.stopPropagation();
  }

  function updateMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;

    const dx=event.clientX-g.startX;
    const dy=event.clientY-g.startY;

    if(g.mode==="move"){
      setMobilePipRect(g.left+dx,g.top+dy,g.width,g.height);
      event.preventDefault();
      return;
    }

    const ratio=Math.max(.34,Math.min(2.6,g.ratio||16/9));
    const minW=mobilePipMinWidth(ratio);
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);

    const edge=String(g.edge||"");
    const fromLeft=edge.includes("left");
    const fromRight=edge.includes("right");
    const fromTop=edge.includes("top");
    const fromBottom=edge.includes("bottom");

    const widthFromX=fromLeft
      ? g.width-dx
      : fromRight
        ? g.width+dx
        : g.width;
    const widthFromY=fromTop
      ? (g.height-dy)*ratio
      : fromBottom
        ? (g.height+dy)*ratio
        : g.width;

    let nextW;
    if((fromLeft||fromRight)&&(fromTop||fromBottom)){
      // At a corner, whichever finger movement is stronger controls SIZE.
      nextW=Math.abs(dx)>=Math.abs(dy)?widthFromX:widthFromY;
    }else if(fromLeft||fromRight){
      nextW=widthFromX;
    }else{
      nextW=widthFromY;
    }

    const maxW=Math.max(
      minW,
      Math.min(viewportW-20,(viewportH-18)*ratio)
    );
    nextW=Math.max(minW,Math.min(maxW,nextW));
    const nextH=nextW/ratio;

    let nextLeft=g.left;
    let nextTop=g.top;
    if(fromLeft) nextLeft=g.right-nextW;
    if(fromTop) nextTop=g.bottom-nextH;

    setMobilePipRect(nextLeft,nextTop,nextW,nextH);
    event.preventDefault();
  }

  function endMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;
    try{event.currentTarget.releasePointerCapture(event.pointerId)}catch{}
    pipGesture=null;
    player.classList.remove("pip-gesture-active");
    showPipUi(1200);
    event.preventDefault();
    event.stopPropagation();
  }

  pipActivateZone?.addEventListener("pointerdown",event=>{
    if(!pip||isTwoColumn())return;
    showPipUi(1800);
    event.preventDefault();
    event.stopPropagation();
  });

  pipMoveZone?.addEventListener("pointerdown",event=>{
    beginMobilePipGesture(event,"move");
  });

  for(const edge of pipResizeEdges){
    edge.addEventListener("pointerdown",event=>{
      beginMobilePipGesture(event,"resize",edge.dataset.pipEdge||"");
    });
  }

  for(const zone of [pipMoveZone,...pipResizeEdges]){
    zone?.addEventListener("pointermove",updateMobilePipGesture,{passive:false});
    zone?.addEventListener("pointerup",endMobilePipGesture,{passive:false});
    zone?.addEventListener("pointercancel",endMobilePipGesture,{passive:false});
  }

  function layout(){
    syncBoundaries();
    const two=isTwoColumn();
    const portrait=current?.kind==="portrait";

    root.classList.toggle("one-col",!two);
    root.classList.toggle("two-col",two);
    root.classList.toggle("portrait",portrait);
    root.classList.toggle("landscape",!portrait);

    /* CSS owns all geometry:
       landscape follows width, portrait follows height. */

    if(two){
      if(inlineVideoId||player.parentNode!==stage){
        returnPlayerToMainStage();
      }else{
        pip=false;
        player.classList.remove("pip");
        stage.classList.remove("pip-host");
        clearMobilePipGestureGeometry();
      }
    }

    if(!two&&!inlineVideoId){
      const routedId=routeVideoId();
      const currentId=String(current?.id||"").trim();
      if(routedId&&currentId&&routedId===currentId){
        const card=document.querySelector('.row[data-video-id="'+currentId+'"]');
        if(card){
          inlineVideoId=currentId;
          attachPlayerToCard(card,{floating:false});
        }
      }
    }

    paintText();
  }
