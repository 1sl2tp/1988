<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="1988">
  <meta name="description" content="1988 - xem video nhanh trên web và PWA.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/style.css?v=single-clear-64">
  <title>1988</title>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="1988">
        <span class="brand-mark">▶</span><strong>1988</strong>
      </a>
      <form id="searchForm" class="header-search" autocomplete="off">
        <span class="search-icon">⌕</span>
        <input id="queryInput" type="search" inputmode="search" enterkeyhint="search"
          placeholder="Tìm video hoặc dán link YouTube"
          aria-label="Tìm video hoặc dán link YouTube">
        <button type="submit" aria-label="Tìm">Tìm</button>
        <div id="suggestions" class="suggestions" hidden></div>
      </form>
      <button id="installBtn" class="install-btn" type="button" hidden>Cài app</button>
    </div>
  </header>

  <main class="app-shell">
    <section id="topicChips" class="topic-chips" aria-label="Khám phá">
      <button class="topic-chip live-chip" type="button" data-feed="live">LIVE</button>
      <button class="topic-chip active" type="button" data-feed="latest">Mới nhất</button>
      <button class="topic-chip" type="button" data-feed="week">Tuần này</button>
      <button id="sourcesBtn" class="topic-chip source-chip" type="button">Nguồn</button>
      <button class="topic-chip" type="button" data-feed="news">Thời sự</button>
      <button class="topic-chip" type="button" data-feed="economy">Kinh tế</button>
      <button class="topic-chip" type="button" data-feed="security">An ninh</button>
      <button class="topic-chip" type="button" data-feed="music">Nhạc</button>
      <button class="topic-chip" type="button" data-feed="sports">Thể thao</button>
      <button class="topic-chip" type="button" data-feed="entertainment">Giải trí</button>
      <button class="topic-chip" type="button" data-feed="tech">Công nghệ</button>
      <button class="topic-chip" type="button" data-feed="shortfilm">Phim ngắn</button>
    </section>

    <section id="playerSection" class="player-section" hidden>
      <div class="player-card">
        <div class="player-frame">
          <video id="nativePlayer" controls playsinline webkit-playsinline preload="auto" hidden></video>
          <div id="yt-player" hidden></div>
        </div>
        <div class="now">
          <div class="now-copy">
            <h1 id="videoTitle">1988</h1>
            <div id="videoMeta" class="video-meta"></div>
          </div>
          <div class="actions" aria-label="Chế độ phát">
            <button id="videoBtn" class="mode-btn active" type="button" aria-pressed="true">Video</button>
            <button id="backgroundBtn" class="mode-btn" type="button" aria-pressed="false">Nền</button>
            <button id="lockBtn" class="mode-btn" type="button" aria-pressed="false">Khóa</button>
            <button id="shareBtn" class="mode-btn" type="button">Chia sẻ</button>
          </div>
          <div id="statusText" class="status-text">Sẵn sàng phát video</div>
        </div>
      </div>
    </section>

    <section class="feed-section">
      <div class="section-head">
        <div>
          <h2 id="feedTitle">Gợi ý</h2>
          <span class="section-sub">Vuốt để xem thêm</span>
        </div>
        <span id="feedStatus"></span>
      </div>
      <div id="feed" class="feed">
        <div class="loading">Đang tải…</div>
      </div>
    </section>
  </main>

  <audio id="bgAudio" preload="none" playsinline></audio>

  <div id="installSheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Cài 1988">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <strong>Thêm 1988 vào màn hình chính</strong>
        <button id="closeInstallSheet" type="button" aria-label="Đóng">×</button>
      </div>
      <p>Trên iPhone: mở bằng Safari → Chia sẻ → Thêm vào Màn hình chính → bật “Mở dưới dạng ứng dụng”.</p>
    </div>
  </div>

  <div id="sourcesSheet" class="sheet-backdrop" hidden>
    <div class="sheet sources-sheet" role="dialog" aria-modal="true" aria-label="Thư viện kênh">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <strong>Thư viện kênh</strong>
          <span id="sourceSummary" class="source-summary"></span>
        </div>
        <button id="closeSourcesSheet" type="button" aria-label="Đóng">×</button>
      </div>
      <div id="sourceBrowse" class="source-browse">
        <div class="source-search-bar">
          <div class="source-search-wrap">
            <input id="sourceSearch" class="source-search" type="search" inputmode="search" autocomplete="off" placeholder="Tìm kênh trên YouTube">
            <button id="clearSourceSearch" class="source-search-clear" type="button" aria-label="Xóa tìm kiếm" hidden>×</button>
          </div>
          <button id="sourceSettingsBtn" class="source-settings-btn" type="button" aria-label="Cài đặt thư viện" aria-pressed="false">⚙︎</button>
        </div>
        <div id="sourceSearchStatus" class="source-search-status"></div>
        <div id="sourceList" class="source-list"></div>
      </div>
      <div id="sourcePreview" class="source-preview" hidden>
        <div class="source-preview-head">
          <button id="backSourcePreview" type="button" aria-label="Quay lại">‹</button>
          <strong id="sourcePreviewTitle"></strong>
        </div>
        <div id="sourcePreviewList" class="source-preview-list"></div>
      </div>

      <div id="sourceVideoPopup" class="source-video-popup" hidden>
        <div class="source-video-popup-card">
          <button id="closeSourceVideoPopup" class="source-video-popup-close" type="button" aria-label="Đóng video">×</button>
          <div class="source-video-popup-frame">
            <iframe id="sourceVideoFrame" title="Video YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
          </div>
          <div id="sourceVideoPopupTitle" class="source-video-popup-title"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function(){
    if(!('serviceWorker' in navigator))return;
    window.addEventListener('load',async()=>{
      try{
        const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
        await reg.update().catch(()=>{});
      }catch(e){}
    });
  })();
  </script>
  <script src="./src/media-core.js?v=2"></script>
  <script src="./src/html5-background.js?v=9"></script>
  <script src="./src/channel-library.js?v=smart-sources-61"></script>
  <script type="module" src="./src/yt-local.js?v=source-popup-62"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
  <script defer src="./src/app.js?v=fast-source-pool-63"></script>
</body>
</html>
