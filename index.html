<title>1988</title>
<script>
(()=>{
  try{
    const theme=localStorage.getItem("yt1988-theme-v1");
    if(theme==="light"||theme==="dark"){
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
      const meta=document.getElementById("themeColorMeta");
      if(meta)meta.setAttribute("content",theme==="light"?"#ffffff":"#212121");
    }
  }catch{}
})();
</script>

/* One media core, one permanent DOM home.
   MAIN 2-column (.stage) remains the player's real parent at all times.
   In one-column/mobile the media column is parked off-screen but stays rendered,
   so the YouTube iframe remains alive/ready. Inline and PiP are only CSS views
   of that same player; the iframe is never reparented while playing. */
@media(max-width:999px){
  .media-col{
    display:block!important;
    position:absolute!important;
    left:-10000px!important;
    top:0!important;
    width:320px!important;
    height:180px!important;
    max-width:none!important;
    margin:0!important;
    overflow:visible!important;
    z-index:auto!important;
    isolation:auto!important;
    contain:none!important;
    pointer-events:none!important;
  }
}

/* One-column inline playback is a viewport-fixed overlay aligned to the card.
   The off-screen MAIN home must NOT create a stacking context; otherwise the
   fixed player cannot rise above feed cards even with a large child z-index. */
html.one-col .player.inline-overlay:not(.pip){
  position:fixed!important;
  inset:auto!important;
  left:var(--inline-player-left)!important;
  top:var(--inline-player-top)!important;
  width:var(--inline-player-w)!important;
  height:var(--inline-player-h)!important;
  z-index:2147482000!important;
  opacity:1!important;
  pointer-events:auto!important;
  border-radius:var(--floating-radius)!important;
  overflow:hidden!important;
  transform:none!important;
}
.top{

  backdrop-filter:saturate(145%) blur(var(--header-blur));
  border-bottom:0;
  transform:translateY(0);
  transition:
    transform .20s cubic-bezier(.4,0,.2,1),
    background-color .18s cubic-bezier(.2,0,0,1);

}
.top::after{
  content:"";

      transparent 45%,
      rgba(var(--header-accent-rgb),var(--header-wash-edge))
    );
  transition:opacity .22s cubic-bezier(.2,0,0,1);
}
.top.search-open::after{

}

/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
/* MAIN 1 cột:
   ngang chạm mép = vuông;
   dọc là một media card độc lập = bo thống nhất với PiP / 2 cột. */
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  border-radius:0;
  background:transparent;
}

html.one-col.portrait .stage,
html.one-col.portrait .player,
html.one-col.portrait .player iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}
html.one-col.portrait .stage,
html.one-col.portrait .player{
  overflow:hidden;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);
}

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  width:min(100%,calc(var(--current-full-h) * var(--media-ratio)));
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.portrait .player{
  inset:0;
  width:100%;
  height:100%;
  transform:none;
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:2147483000!important;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:auto !important;
  bottom:calc(10px + env(safe-area-inset-bottom,0px)) !important;
  pointer-events:auto!important;
  border-radius:var(--floating-radius);
  background:transparent;
  box-shadow:var(--yt-floating-shadow);
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w);
  height:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col.portrait .player.pip{
  height:var(--pip-portrait-h);
  width:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col .player.pip iframe{border-radius:inherit}

/* PiP interaction in every 1-column layout (mobile + PC).
   Drag almost anywhere on the picture; keep the center play/pause zone and the
   bottom YouTube seek/controls band untouched. Resize still uses the edges. */
.pip-activate-zone,
.pip-drag-zone,
.pip-move-zone,
.pip-resize-edge{display:none}

/* The old full-surface activation layer intercepted YouTube controls.
   Keep it disabled: native play/pause/seek must remain directly clickable. */
html.one-col .player.pip .pip-activate-zone{
  display:none!important;
}

html.one-col .player.pip .pip-drag-zone{
  display:block;
  position:absolute;
  z-index:8;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  background:transparent;
}
html.one-col .player.pip .pip-drag-zone:active{cursor:grabbing}

/* Four transparent move regions leave a center box for the large play/pause
   control and the bottom 44px for native seek/volume/fullscreen controls. */
html.one-col .player.pip .pip-drag-top{
  left:0; right:0; top:0; height:33%;
}
html.one-col .player.pip .pip-drag-left{
  left:0; top:33%; bottom:33%; width:33%;
}
html.one-col .player.pip .pip-drag-right{
  right:0; top:33%; bottom:33%; width:33%;
}
html.one-col .player.pip .pip-drag-lower{
  left:0; right:0; top:67%; bottom:44px;
}

/* Smoothly snap into/out of a screen edge after the finger is released. */
html.one-col .player.pip:not(.pip-gesture-active){
  transition:left .18s cubic-bezier(.2,0,0,1),
             top .18s cubic-bezier(.2,0,0,1);
}

/* While docked only a small grab strip remains visible. Do not let an edge
   resize zone steal the gesture used to pull the PiP back on-screen. */
html.one-col .player.pip.pip-docked-left .pip-resize-edge,
html.one-col .player.pip.pip-docked-right .pip-resize-edge{
  pointer-events:none!important;
}

html.one-col .player.pip .pip-move-zone{
  display:block;
  position:absolute;
  z-index:11;
  top:0;
  left:50%;
  width:68px;
  height:32px;
  transform:translateX(-50%);
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
html.one-col .player.pip.pip-ui-visible .pip-move-zone,
html.one-col .player.pip.pip-gesture-active .pip-move-zone{
  opacity:1;
  pointer-events:auto;
}
html.one-col .player.pip .pip-move-zone:active{cursor:grabbing}
html.one-col .player.pip .pip-move-zone::after{
  content:"";
  position:absolute;
  left:50%;
  top:7px;
  width:32px;
  height:4px;
  transform:translateX(-50%);
  border-radius:999px;
  background:rgba(255,255,255,.94);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  pointer-events:none;
}

/* Invisible resize hit-zones. Bottom 36px is reserved for native YouTube seek/controls. */
html.one-col .player.pip .pip-resize-edge{
  display:block;
  position:absolute;
  z-index:10;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  background:transparent;
}
html.one-col .player.pip .pip-resize-left{
  left:0; top:0; bottom:36px; width:26px;
  cursor:ew-resize;
}
html.one-col .player.pip .pip-resize-right{
  right:0; top:0; bottom:36px; width:26px;
  cursor:ew-resize;
}
html.one-col .player.pip .pip-resize-top{
  left:0; right:0; top:0; height:26px;
  cursor:ns-resize;
}

/* Exact corners get their own generous invisible hit boxes. */
html.one-col .player.pip .pip-resize-corner{
  z-index:12;
  width:38px;
  height:38px;
}
html.one-col .player.pip .pip-resize-top-left{
  left:0; top:0;
  cursor:nwse-resize;
}
html.one-col .player.pip .pip-resize-top-right{
  right:0; top:0;
  cursor:nesw-resize;
}

/* The center of the top edge belongs to MOVE, not resize. */
html.one-col .player.pip.pip-ui-visible .pip-resize-top{
  clip-path:polygon(0 0,calc(50% - 38px) 0,calc(50% - 38px) 100%,0 100%,0 0,
                    100% 0,100% 100%,calc(50% + 38px) 100%,calc(50% + 38px) 0,100% 0);
}

/* 2 COLUMNS */
@media(min-width:1000px){
  html.two-col,
  html.two-col body{
    overflow-x:clip;
    overscroll-behavior-y:none;
  }

  html.two-col main{
    width:100%;

    grid-template-columns:var(--two-col-media-w) minmax(0,1fr);
    grid-template-areas:"media feed";
    gap:var(--layout-gap);
    align-items:start;
    margin:0;
    padding:0 var(--feed-edge-gap);
  }

  /* No selected video on desktop: do not pin an empty YouTube MAIN.
     Feed owns the full width until a real video id is selected. */
  html.two-col.media-empty main{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"feed";
    gap:0;
  }
  html.two-col.media-empty .media-col{
    display:none!important;
  }
  html.two-col.media-empty .rows{
    padding-top:20px;
  }
  html.two-col.media-empty .feed-head{
    display:none!important;
  }

  html.two-col .rows{
    grid-area:feed;
    min-width:0;
    /* Feed header sits at 8px. First card outer halo starts 8px below it. */
    padding:60px 0 0;
    grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
    column-gap:var(--card-gap-x);
    row-gap:var(--card-gap-y);
  }

  html.two-col .feed-head{
    position:absolute;
    z-index:8;
    top:8px;
    left:0;
    right:0;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-width:0;
  }

  /* The generic 8px row cap is useful in one-column feeds, but in two-column
     mode it sat directly above the feed header and became a visible dark seam
     once the page gained video-derived ambient color. Let the page ambient
     continue through that 8px strip instead of painting a separate yt-bg bar. */
  html.two-col .rows::before{
    background:transparent;
  }

  html.two-col .media-col{
    grid-area:media;
    position:sticky;
    top:calc(var(--top-boundary) + 8px);
    align-self:start;
    height:var(--current-full-h);
    justify-self:start;
    min-width:0;
    margin-top:8px;
    margin-right:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     Column width is derived from CURRENT HEIGHT × 16/9 (capped only to preserve the feed). The iframe fills the current-height viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:var(--two-col-media-w);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:var(--landscape-player-h);
    border-radius:var(--floating-radius);
    background:#000;
    overflow:hidden;
  }
  html.two-col.landscape .player,
  html.two-col.landscape .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:#000;
  }

  /* 2-col portrait:
     Column width is derived from CURRENT HEIGHT × 9/16, so there is no wasted side space. */
  html.two-col.portrait .media-col{
    width:var(--two-col-media-w);
    height:var(--current-full-h);
  }
  html.two-col.portrait .stage{
    width:100%;
    height:auto;
    aspect-ratio:var(--media-ratio);
    border-radius:var(--floating-radius);
    background:transparent;
    overflow:hidden;
  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;
  }

/* Keep the visual top gap exact.
   .row::before extends 12px outside the card for hover/selected feedback.
   Rows start at 20px = 8px desired gap + 12px halo, so the OUTER card
   background aligns with the media column's 8px top gap. */
.rows::before{
  content:"";
  position:absolute;
  z-index:3;
  top:0;
  left:0;
  right:0;
  height:8px;
  background:
    linear-gradient(
      90deg,
      rgba(var(--header-accent-rgb),var(--ambient-page-right)),
      rgba(var(--header-accent-rgb),0)
    ),
    var(--yt-bg);
  pointer-events:none;
}

.row{
  --card-accent-rgb:var(--header-accent-rgb);
  position:relative;
  isolation:isolate;
  margin:0;
  padding-bottom:0;
  container-type:inline-size;
  container-name:media-card;
  min-width:0;
  background:transparent;
  overflow:visible;
  color:var(--yt-text-secondary);
  cursor:pointer;
  border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.row::before{
  content:"";
  position:absolute;
  inset:-12px;
  z-index:0;
  pointer-events:none;
  /* 12px thumbnail radius + 12px outer halo = parallel 24px curve. */
  border-radius:24px;
  background-color:transparent;
  transition:
    background-color .16s cubic-bezier(.2,0,0,1),
    transform .12s ease;
}
.row > *{
  position:relative;
  z-index:1;
}
@media(hover:hover){
  .row:hover::before{
    background-color:rgba(var(--card-accent-rgb),var(--card-hover-alpha));
  }
}
.row:active::before{
  background-color:rgba(var(--card-accent-rgb),var(--card-press-alpha));
  transform:scale(.985);
}
/* In one-column mode the three-dot button lives inside .row, so pressing it
   also makes the whole card match :active. The card halo extends 12px beyond
   the row and was the visible flash above/below the card. Keep card press
   feedback for normal card clicks, but freeze the halo when pressing menu. */
@media(hover:hover){
  html.one-col .row:has(.row-menu:active)::before{
    background-color:rgba(var(--card-accent-rgb),var(--card-hover-alpha));
    transform:none;
    transition:none;
  }
}
@media(hover:none){
  html.one-col .row:has(.row-menu:active)::before{
    background-color:transparent;
    transform:none;
    transition:none;
  }
}
html.one-col .row.selected:has(.row-menu:active)::before{
  background-color:rgba(var(--card-accent-rgb),var(--card-selected-alpha));
  transform:none;
  transition:none;

/* ============================================================
   RAIL MEDIA CORE
   One native YouTube player for MAIN 1-col / PiP / MAIN 2-col.
   Visible viewport = real media.
   Source iframe = media + BLACK top + BLACK bottom.
   Landscape BLACK 65px; portrait BLACK 59px.
   ============================================================ */
html.landscape{--rail-black:var(--rail-black-landscape)}
html.portrait{--rail-black:var(--rail-black-portrait)}

.stage,
.player{
  overflow:hidden;
}

/* The iframe itself is the taller SOURCE FRAME.
   The parent .player is the cropped media viewport. */
.player > #videoFrame,
.player > iframe,
.player iframe{
  position:absolute!important;
  left:0!important;
  right:auto!important;
  top:calc(0px - var(--rail-black))!important;
  bottom:auto!important;
  width:100%!important;
  height:calc(100% + var(--rail-black) + var(--rail-black))!important;
  max-width:none!important;
  max-height:none!important;
  transform:none!important;
  border:0!important;
  background:#000!important;
}

/* MAIN 1 column: SIZE changes only the crop viewport. */
html.one-col .stage{
  height:auto!important;
  aspect-ratio:var(--media-ratio)!important;
}
html.one-col .player{
  inset:0!important;
  width:100%!important;
  height:100%!important;
}

/* PiP: same cropped player, only its SIZE/position changes.
   IMPORTANT: override the generic one-col 100%/100% Rail viewport here.
   Otherwise PiP keeps MAIN size and appears to stretch wide instead of shrinking. */
html.one-col .player.pip{
  aspect-ratio:var(--media-ratio)!important;
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w)!important;
  height:auto!important;
}
html.one-col.portrait .player.pip{
  width:auto!important;
  height:var(--pip-portrait-h)!important;
}

/* MAIN 2 columns: same engine, column width chooses SIZE. */
@media(min-width:1000px){
  html.two-col .stage{
    width:100%!important;
    height:auto!important;
    aspect-ratio:var(--media-ratio)!important;
    overflow:hidden!important;
    background:transparent!important;
  }
  html.two-col .player{
    inset:0!important;
    width:100%!important;
    height:100%!important;
    transform:none!important;
    overflow:hidden!important;
  }
}

/* Native YouTube fullscreen must use the whole fullscreen viewport,
   not the cropped rail source offset. */
.player > #videoFrame:fullscreen,
.player > iframe:fullscreen,
.player iframe:fullscreen,
.player > #videoFrame:-webkit-full-screen,
.player > iframe:-webkit-full-screen,
.player iframe:-webkit-full-screen{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  max-width:none!important;
  max-height:none!important;
}
</style>

  let packageManifest={};

  const PACKAGE_DB_NAME="yt1988-packages-v1";
  const PACKAGE_DB_STORE="packages";
  let packageDbPromise=null;

  function openPackageDb(){
    if(packageDbPromise)return packageDbPromise;
    packageDbPromise=new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){
        reject(new Error("indexeddb_unavailable"));
        return;
      }
      const request=indexedDB.open(PACKAGE_DB_NAME,1);
      request.onupgradeneeded=()=>{
        const db=request.result;
        if(!db.objectStoreNames.contains(PACKAGE_DB_STORE)){
          db.createObjectStore(PACKAGE_DB_STORE,{keyPath:"scope"});
        }
      };
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error||new Error("indexeddb_open_failed"));
    }).catch(error=>{
      packageDbPromise=null;
      throw error;
    });
    return packageDbPromise;
  }

  async function readStoredPackage(scope){
    scope=String(scope||"").trim();
    if(!scope)return null;
    try{
      const db=await openPackageDb();
      return await new Promise((resolve,reject)=>{
        const tx=db.transaction(PACKAGE_DB_STORE,"readonly");
        const request=tx.objectStore(PACKAGE_DB_STORE).get(scope);
        request.onsuccess=()=>resolve(request.result||null);
        request.onerror=()=>reject(request.error||new Error("package_store_read_failed"));
      });
    }catch{
      return null;
    }
  }

  async function writeStoredPackage(scope,pkg){
    scope=String(scope||"").trim();
    const hash=String(pkg?.hash||"").trim();
    if(!scope||!hash||!Array.isArray(pkg?.items))return false;
    try{
      const db=await openPackageDb();
      const row={
        scope,
        hash,
        version:Number(pkg?.version)||0,
        updatedAt:pkg?.updated_at||pkg?.updatedAt||null,
        items:pkg.items
      };
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(PACKAGE_DB_STORE,"readwrite");
        tx.objectStore(PACKAGE_DB_STORE).put(row);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>reject(tx.error||new Error("package_store_write_failed"));
        tx.onabort=()=>reject(tx.error||new Error("package_store_write_aborted"));
      });
      return true;
    }catch{
      return false;
    }
  }

  async function restoreStoredPackage(scope){
    scope=String(scope||"").trim();
    if(!scope||packageCache.has(scope))return packageCache.get(scope)||[];
    const row=await readStoredPackage(scope);
    if(
      !row ||
      String(row.scope||"")!==scope ||
      !String(row.hash||"").trim() ||
      !Array.isArray(row.items)
    )return [];
    const metas=packageMetas(row.items);
    packageCache.set(scope,metas);
    packageHashCache.set(scope,String(row.hash));
    return metas;
  }

  // Search is independent from source tabs. Keep only the 2 most recent
  // queries/results so repeats can paint immediately without another click.
  const SEARCH_RECENT_KEY="yt1988-proof-recent-searches-v1";
  const searchCache=new Map();
  let recentSearches=[];
  const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition||null;
  let voiceRecognition=null;
  let voiceListening=false;
  if(voiceSearchButton)voiceSearchButton.hidden=!SpeechRecognitionCtor;
  try{

    if(Array.isArray(saved))recentSearches=saved.map(String).filter(Boolean).slice(0,2);
  }catch{}

  // Aspect belongs to the media id, never to the previous UI mode.
  const mediaAspectCache=new Map();
  const STANDARD_MEDIA_ASPECTS=[
    1,
    4/3,3/4,
    5/4,4/5,
    3/2,2/3,
    16/10,10/16,
    16/9,9/16,
    21/9,9/21
  ];
  const columnsMq=matchMedia("(min-width:1000px)");
  const mobileHeaderMq=matchMedia("(max-width:656px)");
  let mobileHeaderLastY=0;
  let mobileHeaderHidden=false;
  let headerRoomy=false;

  let ytPlayer=null;
  let ytPlayerReady=false;
  let pendingVideoId="";
  let youtubeApiPromise=null;

  // Server owns media aspect by video id; YouTube videoContentRect only
  // confirms/corrects the server cache after playback.
  const aspectPrimeCache=new Map();
  const aspectPrimePending=new Map();
  const aspectCorrectionSent=new Map();
  const sourceIdentityCache=new Map();

  function validMediaAspect(value){
    const ratio=Number(value)||0;
    if(!Number.isFinite(ratio)||ratio<.34||ratio>2.6)return 0;

    let nearest=ratio;
    let delta=Infinity;
    for(const standard of STANDARD_MEDIA_ASPECTS){
      const next=Math.abs(standard-ratio);
      if(next<delta){
        nearest=standard;
        delta=next;
      }
    }
    return delta<=.05?nearest:ratio;
  }



  function cachedMediaAspect(id,{verifiedOnly=false}={}){
    const row=mediaAspectCache.get(String(id||"").trim());
    if(verifiedOnly&&row?.verified!==true)return 0;
    return validMediaAspect(row?.value);
  }

  function mediaAspectFromMeta(meta={}){
    if(!meta||typeof meta!=="object")return 0;
    if(meta.isShort===true)return 9/16;

    const direct=validMediaAspect(
      Number(meta.aspectRatio)||
      Number(meta.videoAspectRatio)||
      Number(meta.contentAspectRatio)||
      0
    );
    if(direct)return direct;

    const w=Number(meta.videoWidth||meta.width)||0;
    const h=Number(meta.videoHeight||meta.height)||0;
    return w>0&&h>0?validMediaAspect(w/h):0;
  }

  function rememberMediaAspect(id,ratio,source="",verified=false){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio)return 0;

    // Only the actual YouTube player content rectangle is allowed to define
    // media kind. Everything else is presentation/data only.
    if(source!=="iframe-content-rect"||verified!==true){
      return cachedMediaAspect(id)||0;
    }

    mediaAspectCache.set(id,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    return ratio;
  }

  function cachedPrimedAspect(id){
    const entry=aspectPrimeCache.get(String(id||"").trim());
    return validMediaAspect(entry?.value);
  }

  function applyServerAspectRow(id,row){
    id=String(id||"").trim();
    const ratio=validMediaAspect(row?.aspectRatio);
    if(!id||!ratio)return 0;

    aspectPrimeCache.set(id,{
      value:ratio,
      source:String(row?.aspectSource||"server"),
      verified:row?.aspectVerified===true,
      at:Date.now()
    });

    if(row?.aspectVerified===true){
      mediaAspectCache.set(id,{
        value:ratio,
        source:String(row?.aspectSource||"server"),
        verified:true,
        at:Date.now()
      });
    }
    return ratio;
  }

  function fetchServerAspects(ids=[],resolve=true){
    const unique=[...new Set(
      (Array.isArray(ids)?ids:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )].slice(0,24);
    if(!unique.length)return Promise.resolve({});

    const url=VIDEO_META_URL+
      "?ids="+encodeURIComponent(unique.join(","))+
      (resolve?"&resolve=1":"");

    return fetch(url,{cache:"no-store"})
      .then(response=>{
        if(!response.ok)throw new Error("aspect_http_"+response.status);
        return response.json();
      })
      .then(payload=>{
        const data=payload?.data&&typeof payload.data==="object"?payload.data:{};
        for(const id of unique){
          if(data[id])applyServerAspectRow(id,data[id]);
        }
        return data;
      })
      .catch(()=>({}));
  }

  function primeMediaAspect(id){
    id=String(id||"").trim();
    if(!id)return Promise.resolve(0);

    const cached=cachedPrimedAspect(id);
    if(cached)return Promise.resolve(cached);
    if(aspectPrimePending.has(id))return aspectPrimePending.get(id);

    const task=fetchServerAspects([id],true)
      .then(data=>validMediaAspect(data?.[id]?.aspectRatio)||cachedPrimedAspect(id)||0)
      .finally(()=>aspectPrimePending.delete(id));

    aspectPrimePending.set(id,task);
    return task;
  }

  function primeMediaAspects(metas=[],limit=18){
    const list=(Array.isArray(metas)?metas:[])
      .filter(meta=>meta?.id)
      .slice(0,Math.max(0,limit));

    // UI rule: a downloaded package is authoritative for list rendering.
    // Read aspect data only when it is already present in that package.
    // Missing shape is learned from the real YouTube player after selection;
    // never fan out video-meta resolves for cards sitting in the list.
    for(const meta of list){
      const ratio=mediaAspectFromMeta(meta);
      if(!ratio)continue;

      const id=String(meta.id);
      aspectPrimeCache.set(id,{
        value:ratio,
        source:String(meta?._aspectSource||"server-package"),
        verified:meta?._aspectVerified===true,
        at:Date.now()
      });
      if(meta?._aspectVerified===true){
        mediaAspectCache.set(id,{
          value:ratio,
          source:String(meta?._aspectSource||"server-package"),
          verified:true,
          at:Date.now()
        });
      }
    }
  }

  function mediaLayoutKindFromRatio(ratio){
    ratio=validMediaAspect(ratio)||16/9;
    return ratio<1?"portrait":"landscape";
  }

  function applyMediaLayoutSelection(kind,{relayout=true}={}){
    kind=kind==="portrait"?"portrait":"landscape";
    const fallback=kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallback;

    current={
      ...current,
      kind,
      ratio:mediaRatio
    };

    // Shape chooses BLACK; exact media aspect chooses the crop viewport.
    root.dataset.mediaShape=kind;
    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    if(relayout){
      layout();
      schedulePip();
      scheduleFeedMasonry();
      requestAnimationFrame(()=>syncInlinePlayerOverlay());
    }
    return kind;
  }

  function commitCurrentAspect(id,ratio,{relayout=true}={}){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio||String(current?.id||"")!==id)return false;

    const previousRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      0;
    const kind=mediaLayoutKindFromRatio(ratio);
    const shapeChanged=current?.kind!==kind;
    const ratioChanged=!previousRatio||Math.abs(previousRatio-ratio)>.002;

    current={
      ...current,
      detectedRatio:ratio
    };
    applyMediaLayoutSelection(kind,{
      relayout:relayout&&(shapeChanged||ratioChanged)
    });
    return shapeChanged||ratioChanged;
  }

  const headerColorCache=new Map();

  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    let h=0,s=0;
    const l=(max+min)/2;
    const d=max-min;
    if(d){
      s=d/(1-Math.abs(2*l-1));
      if(max===r)h=((g-b)/d)%6;
      else if(max===g)h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60;
      if(h<0)h+=360;
    }
    return [h,s,l];
  }

  function hslToRgb(h,s,l){
    const cc=(1-Math.abs(2*l-1))*s;
    const x=cc*(1-Math.abs((h/60)%2-1));
    const m=l-cc/2;
    let rr=0,gg=0,bb=0;
    if(h<60){rr=cc;gg=x}
    else if(h<120){rr=x;gg=cc}
    else if(h<180){gg=cc;bb=x}
    else if(h<240){gg=x;bb=cc}
    else if(h<300){rr=x;bb=cc}
    else{rr=cc;bb=x}
    return [rr,gg,bb].map(v=>Math.round((v+m)*255));
  }

  function youtubeCinematicPalette(url){
    url=String(url||"").trim();
    if(!url)return Promise.resolve(null);
    if(headerColorCache.has(url))return headerColorCache.get(url);

    const task=new Promise(resolve=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.decoding="async";
      img.onload=()=>{
        try{
          const w=24,h=14;
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d",{willReadFrequently:true});
          if(!ctx){resolve(null);return;}
          ctx.drawImage(img,0,0,w,h);
          const data=ctx.getImageData(0,0,w,h).data;
          const buckets=new Map();

          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const i=(y*w+x)*4;
            if(data[i+3]<128)continue;
            const r=data[i],g=data[i+1],b=data[i+2];
            const lum=.2126*r+.7152*g+.0722*b;
            if(lum<24||lum>238)continue;
            const max=Math.max(r,g,b),min=Math.min(r,g,b);
            const sat=max?((max-min)/max):0;
            const nx=(x-(w-1)/2)/(w/2),ny=(y-(h-1)/2)/(h/2);
            const center=1+Math.max(0,1-Math.sqrt(nx*nx+ny*ny))*.55;
            const weight=center*(.45+sat*1.65);
            const key=((r>>5)<<6)|((g>>5)<<3)|(b>>5);
            const row=buckets.get(key)||{r:0,g:0,b:0,w:0};
            row.r+=r*weight;row.g+=g*weight;row.b+=b*weight;row.w+=weight;
            buckets.set(key,row);
          }

          let winner=null;
          for(const row of buckets.values()){
            if(!winner||row.w>winner.w)winner=row;
          }
          if(!winner||winner.w<=0){resolve(null);return;}

          const source=[winner.r/winner.w,winner.g/winner.w,winner.b/winner.w].map(Math.round);
          const hsl=rgbToHsl(source[0],source[1],source[2]);
          hsl[1]=Math.max(.42,Math.min(.88,hsl[1]*1.08));
          hsl[2]=Math.max(.48,Math.min(.68,hsl[2]));
          const accent=hslToRgb(hsl[0],hsl[1],hsl[2]);
          resolve({accent});
        }catch{
          resolve(null);
        }
      };
      img.onerror=()=>resolve(null);
      img.src=url;
    });

    headerColorCache.set(url,task);
    return task;
  }

  let headerTintSeq=0;
  function applyHeaderTint(meta=currentMeta){
    const art=String(
      meta?.thumbnail||
      meta?.thumbnailUrl||
      meta?.poster||
      ""
    ).trim();
    if(!/^https?:\/\//i.test(art))return;

    const seq=++headerTintSeq;
    void youtubeCinematicPalette(art).then(palette=>{
      if(seq!==headerTintSeq||!palette)return;

      const light=root.dataset.theme==="light";
      // The sampled video color is theme-neutral. Dark and light each blend
      // that same accent into their own base, preventing a dark/dirty cast in
      // light mode while preserving the cinematic tint.
      const base=light?[255,255,255]:[15,15,15];
      const mix=light?.075:.128;
      const [r,g,b]=palette.accent.map((value,index)=>Math.round(
        base[index]*(1-mix)+value*mix
      ));
      root.style.setProperty("--header-rgb",r+","+g+","+b);
      root.style.setProperty(
        "--header-accent-rgb",
        palette.accent.join(",")
      );

      // Do NOT paint browser/PWA status chrome with the media color.
      // Keeping this neutral avoids a persistent colored notch strip while
      // the in-page header itself scrolls away underneath black-translucent.
      if(themeColorMeta){
        themeColorMeta.setAttribute(
          "content",
          light?"#ffffff":"rgba(33,33,33,.98)"
        );
      }
    });
  }

  function syncHeaderScrollState(){
    top.classList.toggle("chrome-scrolled",pageScrollY()>2);

  function youtubeContentRect(player=ytPlayer){
    const candidates=[
      player?.playerInfo?.videoContentRect,
      player?.videoContentRect,
      player?.playerInfo?.video_content_rect
    ];

    for(const rect of candidates){
      const width=Number(rect?.width)||0;
      const height=Number(rect?.height)||0;
      if(width<=0||height<=0)continue;

      const aspectRatio=validMediaAspect(width/height);
      if(!aspectRatio)continue;
      return {width,height,aspectRatio};
    }
    return null;
  }

  function reportVerifiedAspect(id,rect){
    id=String(id||"").trim();
    const ratio=validMediaAspect(rect?.aspectRatio);
    if(!id||!ratio)return;

    const signature=[
      ratio.toFixed(5),
      Math.round(Number(rect?.width)||0),
      Math.round(Number(rect?.height)||0)
    ].join(":");
    if(aspectCorrectionSent.get(id)===signature)return;
    aspectCorrectionSent.set(id,signature);

    void fetch(VIDEO_META_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        videoId:id,
        aspectRatio:ratio,
        width:Math.round(Number(rect?.width)||0),
        height:Math.round(Number(rect?.height)||0)
      }),
      keepalive:true
    }).catch(()=>{});
  }

  function syncCurrentKindFromYoutubePlayer(player=ytPlayer){
    if(!player||!current?.id)return false;

    const expectedId=String(current.id||"").trim();
    let loadedId="";
    try{
      const data=player.getVideoData?.()||{};
      loadedId=String(data.video_id||data.videoId||"").trim();
    }catch{}

    // During loadVideoById() YouTube can briefly expose the previous video's rect.
    // Accept geometry only after YouTube explicitly reports THIS media id.
    if(!loadedId||loadedId!==expectedId)return false;

    const rect=youtubeContentRect(player);
    if(!rect)return false;

    const ratio=rememberMediaAspect(
      expectedId,
      rect.aspectRatio,
      "iframe-content-rect",
      true
    );
    if(!ratio)return false;

    commitCurrentAspect(expectedId,ratio,{relayout:true});
    aspectPrimeCache.set(expectedId,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    reportVerifiedAspect(expectedId,rect);
    return true;
  }

  function scheduleCurrentPlayerKind(player=ytPlayer){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const attempt=()=>{
      if(String(current?.id||"").trim()!==id)return;
      syncCurrentKindFromYoutubePlayer(player);
    };

    attempt();
    [90,260,700,1400,2600,4500].forEach(delay=>setTimeout(attempt,delay));
  }

  function configurePlayerIframe(player=ytPlayer){
    try{
      const iframe=player?.getIframe?.();
      if(!iframe)return;
      iframe.setAttribute("allowfullscreen","");
      iframe.setAttribute("webkitallowfullscreen","");
      iframe.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture; fullscreen"
      );
      iframe.referrerPolicy="strict-origin-when-cross-origin";
      iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    }catch{}
  }

  function loadYoutubeIframeApi(){
    if(window.YT&&typeof window.YT.Player==="function"){
      return Promise.resolve(window.YT);
    }
    if(youtubeApiPromise)return youtubeApiPromise;

    youtubeApiPromise=new Promise(resolve=>{
      const previous=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{
        try{previous?.()}catch{}
        resolve(window.YT||null);
      };

      if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
        const script=document.createElement("script");
        script.src="https://www.youtube.com/iframe_api";
        script.async=true;
        document.head.appendChild(script);
      }

      const started=Date.now();
      const timer=setInterval(()=>{
        if(window.YT&&typeof window.YT.Player==="function"){
          clearInterval(timer);
          resolve(window.YT);
        }else if(Date.now()-started>10000){
          clearInterval(timer);
          resolve(null);
        }
      },80);
    });
    return youtubeApiPromise;
  }

  async function ensureYoutubePlayer(){
    if(ytPlayer)return ytPlayer;

    const YTApi=await loadYoutubeIframeApi();
    if(!YTApi?.Player||ytPlayer)return ytPlayer;

    ytPlayer=new YTApi.Player("videoFrame",{
      host:"https://www.youtube-nocookie.com",
      width:"100%",
      height:"100%",
      playerVars:{
        autoplay:1,
        playsinline:1,
        controls:1,
        cc_load_policy:0,
        rel:0,
        fs:1,
        disablekb:0,
        modestbranding:1,
        iv_load_policy:3,
        enablejsapi:1,
        origin:location.origin,
        widget_referrer:location.href
      },
      events:{
        onReady(event){
          ytPlayerReady=true;
          configurePlayerIframe(event.target);

          const id=String(pendingVideoId||current?.id||"").trim();
          pendingVideoId="";
          if(!id)return;

          try{
            event.target.loadVideoById(id);
            event.target.playVideo?.();
          }catch{}
        },
        onStateChange(event){
          if(event.data===YTApi.PlayerState.PLAYING){
            scheduleCurrentPlayerKind(event.target);
          }else if(event.data===YTApi.PlayerState.ENDED){
            queueMicrotask(()=>playNextFeedVideo());
          }
        },
        onError(event){
          // Packages are server-filtered for embed support before publishing.
          // Keep a single playback engine only: never switch to another player.
          const code=Number(event?.data)||0;
          if(code)console.warn("youtube_embed_error",code,String(current?.id||""));
        }
      }
    });

    return ytPlayer;
  }

  function playVideoId(id,meta=null,{history="none"}={}){
    id=String(id||"").trim();
    if(!id)return false;

    const confirmedRatio=
      mediaAspectCache.get(id)?.source==="iframe-content-rect"
        ?cachedMediaAspect(id,{verifiedOnly:true})
        :0;
    const metaRatio=mediaAspectFromMeta(meta||{});
    const primedRatio=cachedPrimedAspect(id);

    // Never delay the click. The list should already have primed this media.
    // If data is still missing, preserve the current shell instead of forcing
    // a new temporary 16:9 state.
    const fallbackRatio=
      validMediaAspect(current?.detectedRatio)||
      (current?.kind==="portrait"?9/16:16/9);

    const resolvedAspect=
      confirmedRatio||
      metaRatio||
      primedRatio||
      fallbackRatio;

    const kind=mediaLayoutKindFromRatio(resolvedAspect);

    if(meta?.id===id){
      currentMeta=meta;
      applyHeaderTint(meta);
    }else if(String(current?.id||"")!==id){
      currentMeta=null;
    }

    // media -> kind; MAIN / PiP / 2-column only consume it.
    current={
      id,
      kind,
      ratio:kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio,
      detectedRatio:resolvedAspect,
      label:meta?.title||""
    };
    applyMediaLayoutSelection(kind,{relayout:true});
    if(history==="push"){
      syncVideoDocumentIdentity({push:true});
    }else if(history==="replace"){
      syncVideoDocumentIdentity({push:false});
    }else{
      syncVideoDocumentIdentity({push:false,write:false});
    }
    if(!currentMeta?.sourceAvatar){
      void hydrateCurrentSourceIdentity(id);
    }

    // PLAY IMMEDIATELY.
    // IMPORTANT on mobile Safari/PWA: if the YT player is already ready,
    // call loadVideoById/playVideo synchronously inside the user's click.
    // Deferring this through Promise.then() can lose the user-activation token
    // and leave the video paused until a second tap.
    pendingVideoId=id;
    let playedInGesture=false;

    if(ytPlayer&&ytPlayerReady){
      pendingVideoId="";
      try{
        ytPlayer.loadVideoById(id);
        ytPlayer.playVideo?.();
        playedInGesture=true;
      }catch{}
    }

    if(!playedInGesture){
      void ensureYoutubePlayer().then(playerApi=>{
        if(!playerApi||String(current?.id||"")!==id)return;
        if(!ytPlayerReady)return;

        pendingVideoId="";
        try{
          playerApi.loadVideoById(id);
          playerApi.playVideo?.();
        }catch{}
      });
    }

    // No per-click metadata resolve here. Package data paints instantly;
    // the real YouTube videoContentRect corrects shape after playback begins.
    return true;
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // YouTube source family: normal rich cards roughly 270..500px,
    // skeleton flex-basis around 310px. Pick a count near 310 without
    // allowing cards to drift outside the 270..500 band.
    const MIN=270;
    const TARGET=310;
    const MAX=500;

    const maxCols=Math.max(1,Math.floor((feedW+gap)/(MIN+gap)));
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    const fallbackRatio=
      current?.kind==="portrait"
        ? VIDEOS.portrait.ratio
        : VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallbackRatio;

    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      current?.kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(
      0,
      Math.round(top.offsetHeight || top.getBoundingClientRect().height || 0)
    );
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const contentTopGap=12;
    const fullH=Math.max(1,viewportH-topBoundary-contentTopGap-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    if(!root.style.getPropertyValue("--visible-top-boundary")){
      root.style.setProperty("--visible-top-boundary",topBoundary+"px");
    }
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP default SIZE follows the viewport; resize MIN is separate.
    // This avoids opening every phone at the hard minimum while still keeping
    // the same lower drag limit: landscape 170px, portrait 120px wide.
    const viewportW=Math.max(
      1,
      Math.round(document.documentElement.clientWidth || innerWidth || 1)
    );
    const mobilePip=viewportW<=656;
    const availableW=Math.max(1,viewportW-20);
    const availableH=Math.max(1,viewportH-20);

    const landscapeDragMin=Math.min(
      170,
      availableW,
      Math.max(1,Math.round(availableH*Math.max(1,mediaRatio)))
    );
    const portraitDragMin=Math.min(
      120,
      availableW,
      Math.max(1,Math.round(availableH*Math.max(.34,mediaRatio)))
    );

    const landscapeTarget=Math.round(viewportW*(mobilePip ? .54 : .36));
    const landscapeDefaultMin=mobilePip?190:240;
    const landscapeDefaultMax=mobilePip?300:360;
    const landscapeFitMax=Math.max(
      1,
      Math.min(availableW,Math.round(availableH*Math.max(1,mediaRatio)))
    );
    const pipLandscapeW=Math.max(
      Math.min(landscapeDragMin,landscapeFitMax),
      Math.min(
        landscapeFitMax,
        landscapeDefaultMax,
        Math.max(landscapeDefaultMin,landscapeTarget)
      )
    );

    const portraitTarget=Math.round(viewportW*(mobilePip ? .38 : .24));
    const portraitDefaultMin=mobilePip?136:160;
    const portraitDefaultMax=mobilePip?190:220;
    const portraitFitMax=Math.max(
      1,
      Math.min(availableW,Math.round(availableH*Math.max(.34,mediaRatio)))
    );
    const pipPortraitW=Math.max(
      Math.min(portraitDragMin,portraitFitMax),
      Math.min(
        portraitFitMax,
        portraitDefaultMax,
        Math.max(portraitDefaultMin,portraitTarget)
      )
    );
    const pipPortraitH=Math.max(1,Math.round(pipPortraitW/Math.max(.34,mediaRatio)));

    root.style.setProperty("--pip-landscape-w",Math.round(pipLandscapeW)+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    const pageW=viewportW;
    const pageEdge=viewportW<480?12:24;
    const cardGap=32;
    const mediaGap=16;
    root.style.setProperty("--feed-edge-gap",pageEdge+"px");
    root.style.setProperty("--card-gap-x",cardGap+"px");
    root.style.setProperty("--card-gap-y","40px");
    root.style.setProperty("--card-meta-gap","12px");
    root.style.setProperty("--layout-gap",mediaGap+"px");
    root.style.setProperty("--card-target-w","310px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(pageEdge*2));
      // Mobile + the smallest mini-web width are always one vertical list.
      // Only wider one-column layouts may split into multiple card columns.
      const cols=viewportW<=720?1:chooseCardColumns(feedW,cardGap);
      root.style.setProperty("--feed-cols",String(cols));
    }else{
      const contentW=Math.max(1,pageW-(pageEdge*2));
      const hasSelectedMedia=/^[A-Za-z0-9_-]{11}$/.test(String(current?.id||""));
      if(!hasSelectedMedia){
        root.style.setProperty("--feed-cols",String(chooseCardColumns(contentW,cardGap)));
        return;
      }

      // Desktop 2-column order is MEDIA LEFT + FEED RIGHT. Keep the existing
      // width family; only the visual order changes. Media still fits by the REAL
      // cropped video height, so no title/chrome safe-zone estimation is needed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));
      const widthCap=Math.max(1,contentW-mediaGap-desiredFeedW);
      const heightDrivenW=Math.max(1,Math.round(fullH*mediaRatio));
      const mediaW=Math.min(widthCap,heightDrivenW);

      const feedW=Math.max(1,contentW-mediaGap-mediaW);
      const cols=chooseCardColumns(feedW,cardGap);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      root.style.setProperty("--feed-cols",String(cols));
    }
  }
  function dataRow(payload){
    const data=payload?.data ?? payload;
    if(!data)return {};
    if(Array.isArray(data))return data[0]||{};
    return (
      data.video ||
      data.videoDetails ||
      data.details ||
      data.info ||

  function escapeHtml(value=""){
    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function videoTitleSlug(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[đĐ]/g,match=>match==="Đ"?"D":"d")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .replace(/-+/g,"-")
      .slice(0,88)
      .replace(/-+$/,"");
  }

  function routeVideoId(){
    const hash=decodeURIComponent(String(location.hash||""));
    const fromHash=hash.match(/(?:^|\/)watch\/.*?([A-Za-z0-9_-]{11})$/i)?.[1]||
      hash.match(/([A-Za-z0-9_-]{11})$/)?.[1]||
      "";
    if(fromHash)return fromHash;

    try{
      const legacy=new URLSearchParams(location.search).get("v")||"";
      if(/^[A-Za-z0-9_-]{11}$/.test(legacy))return legacy;
    }catch{}
    return "";
  }

  function historyVideoId(state=history.state){
    const id=String(state?.videoId||"").trim();
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
  }

  function videoHistoryState(id,title=""){
    return {
      yt1988:"video",
      videoId:String(id||"").trim(),
      title:String(title||"").trim(),
      scope:String(activePackageScope||""),
      feedMode:String(feedMode||"")
    };
  }

  function canonicalVideoHash(id,title=""){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";

    const cleanTitle=String(title||"").trim();
    const slug=
      cleanTitle && cleanTitle.toLowerCase()!=="video"
        ? videoTitleSlug(cleanTitle)
        : "";

    return "#/watch/"+(slug?slug+"-":"")+id;
  }

  function syncVideoDocumentIdentity({push=false,write=true}={}){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const title=String(currentMeta?.title||current?.label||"").trim();
    const meaningfulTitle=title&&title.toLowerCase()!=="video"?title:"";
    document.title=meaningfulTitle?meaningfulTitle+" · 1988":"1988";
    if(!write)return;

    const stateId=historyVideoId();
    const routeId=routeVideoId();
    const existingId=stateId||routeId;
    const currentHash=String(location.hash||"");
    const hasCanonicalHash=/^#\/watch\//i.test(currentHash);

    // A direct/deep link is also a real video history entry. Keep its readable
    // slug while metadata is still loading, but mark the browser state now.
    if(
      existingId===id &&
      hasCanonicalHash &&
      !meaningfulTitle
    ){
      if(stateId!==id){
        history.replaceState(
          videoHistoryState(id,""),
          "",
          location.pathname+location.search+location.hash
        );
      }
      return;
    }

    const nextHash=canonicalVideoHash(id,meaningfulTitle);
    if(!nextHash)return;

    const nextUrl="/"+nextHash;
    const nextState=videoHistoryState(id,meaningfulTitle);

    // User-selected videos become separate browser-history entries.
    // Metadata/title refreshes only rewrite the current entry.
    if(push&&existingId!==id){
      history.pushState(nextState,"",nextUrl);
      return;
    }

    if(
      stateId!==id ||
      location.pathname!=="/" ||
      location.search ||
      currentHash!==nextHash
    ){
      history.replaceState(nextState,"",nextUrl);
    }
  }

  function navigateToVideo(id,meta=null,{replace=false}={}){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    const previousId=historyVideoId()||routeVideoId();
    const title=String(meta?.title||"").trim();
    const nextHash=canonicalVideoHash(id,title);
    if(!nextHash)return false;

    // The first media in this document establishes the current browser entry.
    // Every later user-selected media gets its own entry, so Back/Forward is
    // always video <-> video instead of falling into an empty same-page route.
    const state=videoHistoryState(id,title);
    if(replace||!previousId){
      history.replaceState(state,"","/"+nextHash);
    }else if(previousId!==id){
      history.pushState(state,"","/"+nextHash);
    }else{
      history.replaceState(state,"","/"+nextHash);
    }

    return playVideoId(id,meta,{history:"none"});
  }

  function metaForVideoId(id){
    id=String(id||"").trim();
    return (
      feedMetas.find(meta=>meta?.id===id)||
      relatedMetas.find(meta=>meta?.id===id)||
      [...packageCache.values()].flat().find(meta=>meta?.id===id)||
      null
    );
  }

  function openVideoFromLocation(state=history.state){
    const id=historyVideoId(state)||routeVideoId();
    if(!id){
      // Compatibility with legacy empty app entries created by older builds.
      // Do not leave the same video on screen under a route with no video.
      if(String(current?.id||"")){
        queueMicrotask(()=>history.back());
      }
      return false;
    }
    if(id===String(current?.id||""))return false;

    const meta=metaForVideoId(id);
    // Browser Back/Forward owns the selected entry. Replay it only; never
    // create or replace history while traversing.
    if(!playVideoId(id,meta,{history:"none"}))return false;
    renderCurrentInfo();
    loadCurrentVideoMeta();
    schedulePip();
    return true;
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    const videoWidth=Number(row?.videoWidth)||0;
    const videoHeight=Number(row?.videoHeight)||0;
    const genericWidth=Number(row?.width)||0;
    const genericHeight=Number(row?.height)||0;
    const isShort=row?.isShort===true||row?.is_short===true;
    const aspectRatio=validMediaAspect(
      (isShort?9/16:0)||
      Number(row?.aspectRatio)||
      Number(row?.videoAspectRatio)||
      (
        videoWidth>0&&videoHeight>0
          ?videoWidth/videoHeight
          :0
      )||
      (
        genericWidth>0&&genericHeight>0
          ?genericWidth/genericHeight
          :0
      )
    );
    return {
      ...meta,
      verified:cardVerified(row),
      isShort,
      videoWidth,
      videoHeight,
      aspectRatio,
      mediaKind:String(row?.mediaKind||""),
      downloadVideoUrl:String(
        row?.downloadVideoUrl||
        row?.videoDownloadUrl||
        row?.mp4Url||
        row?.downloads?.mp4||
        row?.download?.video||
        ""
      ).trim(),
      downloadAudioUrl:String(
        row?.downloadAudioUrl||
        row?.audioDownloadUrl||
        row?.mp3Url||
        row?.downloads?.mp3||
        row?.download?.audio||
        ""
      ).trim(),
      _aspectVerified:
        row?._aspectVerified===true||
        (videoWidth>0&&videoHeight>0)||
        isShort,
      _aspectSource:String(row?.aspectSource||row?._aspectSource||"")
    };
  }

  function mergeSelectedMeta(base={},supplemental={}){
    const keep=(key)=>{
      const value=base?.[key];
      return value!==undefined&&value!==null&&value!=="";
    };

    // Supplemental data fills gaps; only meaningful selected-card fields
    // are protected below. Empty strings from the old card must not erase
    // sourceId/avatar/channel metadata returned by the video lookup.
    const merged={...base,...supplemental};

    // The selected package/search card is the visible contract.
    // Direct video lookup may fill gaps, but must not rename/relabel it.
    for(const key of [
      "title","sourceName","sourceAvatar","thumbnail",
      "viewsLabel","publishedLabel","durationLabel",
      "isLive","verified","mediaKind","aspectRatio",
      "videoWidth","videoHeight","downloadVideoUrl","downloadAudioUrl",
      "_aspectVerified","_aspectSource"
    ]){
      if(keep(key))merged[key]=base[key];
    }

    return merged;
  }

  function applySourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const avatar=String(identity?.sourceAvatar||"").trim();
    const name=String(identity?.sourceName||"").trim();
    if(!id||(!avatar&&!name))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta.id||"").trim()!==id)return;
      if(avatar&&!meta.sourceAvatar)meta.sourceAvatar=avatar;
      if(name&&!meta.sourceName)meta.sourceName=name;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(String(current?.id||"")===id){
      renderCurrentInfo();
      applyHeaderTint(currentMeta);
    }

    if(avatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;

        if(oldAvatar instanceof HTMLImageElement){
          const currentSrc=String(oldAvatar.getAttribute("src")||"").trim();
          if(currentSrc!==avatar)oldAvatar.src=avatar;
          return;
        }

        const next=document.createElement("img");
        next.className="row-avatar";
        next.alt="";
        next.src=avatar;
        oldAvatar.replaceWith(next);
      });
    }
    return true;
  }

  function localSourceIdentity(sourceId=""){
    sourceId=String(sourceId||"").trim();
    if(!sourceId)return {};

    const cached=sourceIdentityCache.get(sourceId);
    if(cached?.sourceAvatar||cached?.sourceName)return cached;

    const pools=[
      currentMeta,
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat(),
      ...[...searchCache.values()].flat()
    ];

    let sourceName="";
    let sourceAvatar="";
    for(const meta of pools){
      if(!meta||String(meta.sourceId||"").trim()!==sourceId)continue;
      if(!sourceName)sourceName=String(meta.sourceName||"").trim();
      if(!sourceAvatar)sourceAvatar=String(meta.sourceAvatar||"").trim();
      if(sourceName&&sourceAvatar)break;
    }

    const identity={sourceName,sourceAvatar};
    if(sourceAvatar||sourceName)sourceIdentityCache.set(sourceId,identity);
    return identity;
  }

  function hydrateCurrentSourceIdentity(id=String(current?.id||"")){
    id=String(id||"").trim();
    if(!id||String(current?.id||"")!==id)return false;

    const meta=currentMeta||{};
    if(meta.sourceAvatar)return true;

    // UI is download/read-only here. Channel identity must come from metadata
    // that is already present in the prepared packages/search cache; selecting
    // a video must not start an extra channel request.
    const sourceId=String(meta.sourceId||"").trim();
    if(!sourceId)return false;

    const identity=localSourceIdentity(sourceId);
    if(!identity?.sourceAvatar&&!identity?.sourceName)return false;
    return applySourceIdentityToVideo(id,identity);
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function packageMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const row of Array.isArray(items)?items:[]){
      const meta=cardMetaFromRow(row);
      if(!meta?.id||!meta?.title||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    primeMediaAspects(out,18);
    return out;
  }

  function hydrateCurrentMetaFromPackage(metas=[]){
    const id=String(current?.id||"").trim();
    if(!id)return false;

    const packageMeta=(Array.isArray(metas)?metas:[])
      .find(meta=>String(meta?.id||"").trim()===id);
    if(!packageMeta)return false;

    // Package/server metadata is the canonical list record. A direct video
    // lookup may have filled extra fields, but it must not leave avatar/name
    // blank when the package already knows them.
    currentMeta=mergeSelectedMeta(
      packageMeta,
      currentMeta||{}
    );

    if(currentMeta?.title){
      current.label=currentMeta.title;
    }

    renderCurrentInfo();
    applyHeaderTint(currentMeta);
    syncVideoDocumentIdentity({push:false});
    return true;
  }

  async function loadPackageManifest(){
    try{
      const response=await fetchWithTimeout(
        PACKAGE_SYNC_URL,
        {cache:"no-store"},
        5000
      );
      if(!response.ok)throw new Error("package_manifest_"+response.status);
      const payload=await response.json();
      const next=
        payload?.manifest && typeof payload.manifest==="object"
          ? payload.manifest
          : null;
      if(!next)throw new Error("package_manifest_invalid");
      packageManifest=next;
      return packageManifest;
    }catch(_){
      // A failed/slow manifest request must never erase the last known hashes.
      return packageManifest;
    }
  }

  async function getPackage(scope,{force=false,expectedHash=""}={}){
    scope=String(scope||"").trim();
    expectedHash=String(expectedHash||"").trim();
    if(!scope)return [];

    if(!force&&packageCache.has(scope)){
      const cached=packageCache.get(scope);
      hydrateCurrentMetaFromPackage(cached);
      return cached;
    }
    if(packagePending.has(scope))return packagePending.get(scope);

    const task=(async()=>{
      try{
        const response=await fetchWithTimeout(
          PACKAGE_SYNC_URL+"?scope="+encodeURIComponent(scope),
          {cache:"no-store"},
          12000
        );
        if(!response.ok)throw new Error("package_"+scope+"_"+response.status);

        const payload=await response.json();
        const pkg=payload?.ok&&payload?.exists?payload?.package:null;
        const nextHash=String(pkg?.hash||"").trim();

        if(!pkg||!nextHash||!Array.isArray(pkg?.items)){
          throw new Error("package_"+scope+"_invalid");
        }
        if(expectedHash&&nextHash!==expectedHash){
          throw new Error("package_"+scope+"_hash_mismatch");
        }

        const metas=packageMetas(pkg.items);

        // Download + JSON parse + normalization must all finish before either
        // durable storage or RAM is replaced. IndexedDB writes are transactional.
        await writeStoredPackage(scope,pkg);

        packageCache.set(scope,metas);
        packageHashCache.set(scope,nextHash);

        // Important for deep links: the video may have started from
        // YT1988_API.video(id) before its source package finished loading.
        // As soon as any package containing this id arrives, hydrate the
        // canonical channel avatar/name/title from that package.
        hydrateCurrentMetaFromPackage(metas);

        return metas;
      }catch(_){
        if(packageCache.has(scope))return packageCache.get(scope)||[];
        return await restoreStoredPackage(scope);
      }finally{
        packagePending.delete(scope);
      }
    })();

    packagePending.set(scope,task);
    return task;
  }

  async function showPackageScope(scope){
    scope=String(scope||"").trim()||"live";
    activePackageScope=scope;
    feedMode="package";
    ++feedRequest;
    syncFeedHeader();

    // Tab/UI reads memory only. Network package reads belong to the package synchronizer.
    const metas=packageCache.get(scope)||[];
    feedMetas=metas;
    renderSampleContent();

    if(isTwoColumn()&&!String(current?.id||"")&&metas[0]?.id){
      if(navigateToVideo(metas[0].id,metas[0],{replace:true})){
        renderCurrentInfo();
      }
    }
    return metas;
  }

  let packageSyncRunning=false;

  function paintSyncedPackage(scope,metas){
    if(feedMode!=="package"||activePackageScope!==scope)return;
    feedMetas=Array.isArray(metas)?metas:[];
    renderSampleContent();
  }

  async function syncPreparedPackages(scopes=[],{refreshManifest=false}={}){
    if(packageSyncRunning)return false;
    packageSyncRunning=true;
    try{
      if(refreshManifest||!Object.keys(packageManifest).length){
        await loadPackageManifest();
      }

      const unique=[...new Set(
        ((Array.isArray(scopes)&&scopes.length)?scopes:Object.keys(packageManifest))
          .map(String)
          .filter(Boolean)
      )];

      const changedScopes=unique.filter(scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        if(!remoteHash)return false;
        return String(packageHashCache.get(scope)||"").trim()!==remoteHash;
      });

      await Promise.allSettled(changedScopes.map(async scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        const metas=await getPackage(scope,{
          force:true,
          expectedHash:remoteHash
        });
        if(String(packageHashCache.get(scope)||"")!==remoteHash)return false;

        // Each package swaps independently only after its complete download,
        // parse, hash check and normalization have finished.
        paintSyncedPackage(scope,metas);
        return true;
      }));
      return true;
    }finally{
      packageSyncRunning=false;
    }
  }

  function prefetchPackages(scopes=[]){
    setTimeout(()=>{ void syncPreparedPackages(scopes); },0);
  }

  // Manifest polling must stay cheap: Edge Function invocations are billed
  // per request. A 5s loop alone exceeds the Free monthly quota for one
  // continuously open tab. Packages are immutable-by-hash, so one minute plus
  // an immediate visibility refresh preserves freshness without hammering
  // Supabase during normal use or an outage.
  const PACKAGE_MANIFEST_POLL_MS=60_000;
  setInterval(()=>{
    if(document.hidden)return;
    void syncPreparedPackages([],{refreshManifest:true});
  },PACKAGE_MANIFEST_POLL_MS);

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"){
      void syncPreparedPackages([],{refreshManifest:true});
    }
  },{passive:true});

  const youtubeThumbQualityCache=new Map();
  let youtubeThumbQualityObserver=null;

  function probeYoutubeThumb(url,minWidth=480,minHeight=270){
    return new Promise(resolve=>{
      if(!url){resolve("");return;}
      const test=new Image();
      test.decoding="async";
      try{test.fetchPriority="low";}catch{}
      let settled=false;
      const finish=value=>{
        if(settled)return;
        settled=true;
        resolve(value);
      };
      test.onload=async()=>{
        try{await test.decode?.();}catch{}
        const width=Number(test.naturalWidth)||0;
        const height=Number(test.naturalHeight)||0;
        finish(width>=minWidth&&height>=minHeight?url:"");
      };
      test.onerror=()=>finish("");
      test.src=url;
      if(test.complete&&test.naturalWidth)queueMicrotask(()=>test.onload?.());
      setTimeout(()=>finish(""),1800);
    });
  }

  function resolvePreferredCardThumb(id,current=""){
    id=String(id||"").trim();
    current=String(current||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return Promise.resolve(current);
    const cacheKey=id+"|"+current;
    const cached=youtubeThumbQualityCache.get(cacheKey);
    if(cached)return cached;

    const task=(async()=>{
      const maxres=await probeYoutubeThumb(youtubeThumbUrl(id,"maxresdefault.jpg"),640,360);
      if(maxres)return maxres;

      // Some videos do not publish maxres. YouTube can answer those URLs with
      // a tiny grey placeholder instead of a network error, so validate the
      // decoded size before switching the visible card away from its safe hq image.
      const sd=await probeYoutubeThumb(youtubeThumbUrl(id,"sddefault.jpg"),480,360);
      if(sd)return sd;

      return current;
    })().catch(()=>current);

    youtubeThumbQualityCache.set(cacheKey,task);
    return task;
  }

  function upgradeRowThumb(img){
    if(!(img instanceof HTMLImageElement)||img.dataset.thumbQualityDone==="1")return;
    const card=img.closest(".row[data-video-id]");
    const id=String(card?.dataset?.videoId||"").trim();
    const base=String(img.dataset.thumbBase||img.getAttribute("src")||"").trim();
    if(!id||!base){
      img.dataset.thumbQualityDone="1";
      return;
    }
    img.dataset.thumbQualityDone="1";
    void resolvePreferredCardThumb(id,base).then(best=>{
      if(!best||!img.isConnected||card?.dataset?.videoId!==id)return;
      if(best!==img.getAttribute("src"))img.src=best;
    });
  }

  function observeRowThumbQuality(root){
    if(!root)return;
    const images=[...root.querySelectorAll(".row[data-video-id] .row-thumb img")];
    if(!("IntersectionObserver" in window)){
      images.forEach(upgradeRowThumb);
      return;
    }
    if(!youtubeThumbQualityObserver){
      youtubeThumbQualityObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          youtubeThumbQualityObserver?.unobserve?.(entry.target);
          upgradeRowThumb(entry.target);
        }
      },{rootMargin:"320px 0px"});
    }
    images.forEach(img=>youtubeThumbQualityObserver.observe(img));
  }

  function directSourceStatus(sourceId,scope=activePackageScope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return "normal";
    const selected=Array.isArray(sourceStateRemote?.scopedSelected?.[scope])
      ?sourceStateRemote.scopedSelected[scope]
      :[];
    const blocked=Array.isArray(sourceStateRemote?.scopedBlocked?.[scope])
      ?sourceStateRemote.scopedBlocked[scope]
      :[];
    if(blocked.includes(sourceId))return "blocked";
    if(selected.includes(sourceId))return "selected";
    return "normal";
  }

  function patchLocalSourceStatus(sourceId,status,scope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return;
    sourceStateRemote=sourceStateRemote&&typeof sourceStateRemote==="object"
      ?sourceStateRemote
      :{};
    sourceStateRemote.scopedSelected=sourceStateRemote.scopedSelected||{};
    sourceStateRemote.scopedBlocked=sourceStateRemote.scopedBlocked||{};
    const without=(list)=>Array.isArray(list)?list.filter(id=>id!==sourceId):[];
    sourceStateRemote.scopedSelected[scope]=without(sourceStateRemote.scopedSelected[scope]);
    sourceStateRemote.scopedBlocked[scope]=without(sourceStateRemote.scopedBlocked[scope]);
    if(status==="selected")sourceStateRemote.scopedSelected[scope].push(sourceId);
    if(status==="blocked")sourceStateRemote.scopedBlocked[scope].push(sourceId);
  }

  function positionRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor||menu.hidden)return;
    const rect=anchor.getBoundingClientRect();
    const menuRect=menu.getBoundingClientRect();
    const gap=6;
    const left=Math.max(
      8,
      Math.min(
        window.innerWidth-menuRect.width-8,
        rect.right-menuRect.width
      )
    );
    const below=rect.bottom+gap;
    const top=below+menuRect.height<=window.innerHeight-8
      ?below
      :Math.max(8,rect.top-menuRect.height-gap);
    menu.style.left=Math.round(left)+"px";
    menu.style.top=Math.round(top)+"px";
  }

  function revealRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor){
      menu.hidden=true;
      return;
    }
    // Keep the freshly rendered menu out of paint until its final
    // coordinates are known. This prevents the one-frame flash at the
    // previous/default position when opening or switching submenus.
    menu.style.visibility="hidden";
    menu.hidden=false;
    positionRowActionMenu(anchor);
    menu.style.visibility="";
  }

  async function startNativeDownload(meta={},format="mp4"){
    const resolverUrl=downloadUrl(meta,format);
    if(!resolverUrl){
      setDownloadRowStatus(format,"");
      window.alert("Không tìm thấy media để tải.");
      return false;
    }

    try{
      const response=await fetch(resolverUrl,{
        method:"GET",
        mode:"cors",
        cache:"no-store",
        credentials:"omit",
        headers:{"accept":"application/json"}
      });
      const data=await response.json().catch(()=>null);
      const directUrl=String(data?.url||"").trim();
      if(!response.ok||!data?.ok||!/^https:\/\//i.test(directUrl)){
        throw new Error(String(data?.error||"download_resolve_failed"));
      }

      const anchor=document.createElement("a");
      anchor.href=directUrl;
      anchor.rel="noopener";
      anchor.download="";
      anchor.style.display="none";
      document.body.appendChild(anchor);
      anchor.click();
      window.setTimeout(()=>anchor.remove(),30000);
      window.setTimeout(()=>closeRowActionMenu(),1200);
      return true;
    }catch(error){
      console.warn("download resolve failed",error);
      setDownloadRowStatus(format,"");
      window.alert("Không lấy được file. Thử lại.");
      return false;
    }
  }

  async function writeCardSourceStatus(meta,status,scope){
    const sourceId=validSourceId(meta?.sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope||!hasSourceAdminAccess())return false;
    const pin=SOURCE_ADMIN_PIN;

    const previous=directSourceStatus(sourceId,scope);
    patchLocalSourceStatus(sourceId,status,scope);

    const event={
      type:"source-state",
      id:sourceId,
      status,
      scope,
      name:String(meta?.sourceName||"").trim(),
      at:Date.now()
    };
    try{sourceUiChannel?.postMessage(event)}catch{}
    try{localStorage.setItem(SOURCE_UI_EVENT_KEY,JSON.stringify(event))}catch{}

    try{
      const response=await fetch(SOURCE_STATE_URL,{
        method:"POST",
        cache:"no-store",
        headers:{
          "content-type":"application/json",
          "x-1988-pin":pin
        },
        body:JSON.stringify({
          op:"set_source",
          scope,
          channel_id:sourceId,
          status,
          version:Date.now(),
          source:{
            name:String(meta?.sourceName||"").trim(),
            thumbnailUrl:String(meta?.sourceAvatar||"").trim(),
            subscribers:""
          }
        })
      });
      if(response.status===401){
        try{localStorage.removeItem(SOURCE_ADMIN_AUTH_KEY)}catch{}
        patchLocalSourceStatus(sourceId,previous,scope);
        closeRowActionMenu();
        window.alert("Phiên quản trị không còn hợp lệ.");
        return false;
      }
      if(!response.ok){
        patchLocalSourceStatus(sourceId,previous,scope);
        throw new Error("source_state_"+response.status);
      }

      closeRowActionMenu();
      setTimeout(()=>void syncPreparedPackages([scope],{refreshManifest:true}),1200);
      return true;
    }catch(error){
      patchLocalSourceStatus(sourceId,previous,scope);
      console.warn("save source status failed",error);
      window.alert("Chưa lưu được thay đổi nguồn.");
      return false;
    }
  }

    try{
      const raw=labels?.__source_order;
      const parsed=Array.isArray(raw)?raw:JSON.parse(String(raw||"[]"));

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

      const style=getComputedStyle(chip);
      total+=chip.getBoundingClientRect().width;
      total+=parseFloat(style.marginLeft)||0;
      total+=parseFloat(style.marginRight)||0;
    });
    return Math.ceil(total);
  }

  function updateHeaderSearchRoom(){
    if(!top||!sourceChips)return;

    // Mobile keeps the compact icon; explicit search always owns the row.
    if(mobileHeaderMq.matches||top.classList.contains("search-open")){
      headerRoomy=false;
      top.classList.remove("search-roomy");
      top.style.removeProperty("--auto-search-w");
      return;
    }

    const headerW=Math.max(
      0,
      top.clientWidth||
      document.documentElement.clientWidth||
      window.innerWidth||
      0
    );

    // IMPORTANT: do not use sourceChips.scrollWidth here.
    // The flex/block rail expands to its parent, so scrollWidth can look almost
    // as wide as the whole header even when the actual chips occupy much less.
    const chipsW=naturalSourceChipsWidth();

    // Reserve outer spacing plus the separate mic + settings buttons.
    // The source rail owns the left side; search/mic/settings own the right.
    const chromeReserve=108;
    const surplus=Math.max(0,headerW-chipsW-chromeReserve);

    // Full search is useful from 280px upward; let it grow with the real spare
    // space but cap it near YouTube's desktop search width.
    const roomy=chipsW>0&&surplus>=280;
    const searchW=roomy
      ?Math.min(640,Math.max(280,Math.floor(surplus)))
      :0;

    headerRoomy=roomy;
    top.classList.toggle("search-roomy",roomy);
    if(roomy)top.style.setProperty("--auto-search-w",searchW+"px");
    else top.style.removeProperty("--auto-search-w");
  }
