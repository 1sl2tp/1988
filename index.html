  async function refreshTikTokLiveFeed({paint=true,force=false}={}){
    const now=Date.now();
    if(!force&&now-tiktokLiveLastAt<12_000)return tiktokLiveMetas;
    if(tiktokLiveFetchPromise)return tiktokLiveFetchPromise;

    tiktokLiveFetchPromise=(async()=>{
      try{
        const response=await fetch(
          TIKTOK_LIVE_API+"/tiktok/live-now?t="+Date.now(),
          {cache:"no-store"}
        );
        if(!response.ok)throw new Error("tiktok_live_"+response.status);
        const payload=await response.json();
        let next=(Array.isArray(payload?.items)?payload.items:[])
          .map(normalizeTikTokLiveItem)
          .filter(Boolean)
          .filter(meta=>meta.playable);

        const needsLibraryFallback=next.some(meta=>
          !meta?.hasLiveCover||
          !String(meta?.sourceAvatar||"").trim()||
          !String(meta?.sourceName||"").trim()||
          liveComparableName(meta?.sourceName)===liveComparableName(meta?.handle)
        );

        if(needsLibraryFallback){
          await loadTikTokLatestVideoFeed({silent:true}).catch(()=>{});
          next=next.map(meta=>tiktokLibraryChannelFallbacks(meta));
        }

        tiktokLiveMetas=next;
        tiktokLiveReady=true;
        tiktokLiveLastAt=Date.now();

        if(paint&&liveDemandActive("tiktok")){
          paintUnifiedLiveFromEdge("tiktok");
        }
        return tiktokLiveMetas;
      }catch(error){
        console.warn("tiktok_live_feed_failed",error);
        return tiktokLiveMetas;
      }finally{
        tiktokLiveFetchPromise=null;
      }
    })();
    return tiktokLiveFetchPromise;
  }

  function isAppleMobileBrowser(){
    const ua=navigator.userAgent||"";
    return /iPad|iPhone|iPod/i.test(ua)||
      (navigator.platform==="MacIntel"&&Number(navigator.maxTouchPoints||0)>1);
  }

  function nativeHlsSupported(video=tiktokLiveVideo){
    if(!video?.canPlayType)return false;
    return Boolean(
      video.canPlayType("application/vnd.apple.mpegurl")||
      video.canPlayType("application/x-mpegURL")
    );
  }

  function mpegtsLiveSupported(){
    try{
      const features=window.mpegts?.getFeatureList?.();
      if(features&&typeof features.mseLivePlayback==="boolean"){
        return features.mseLivePlayback===true;
      }
      return window.mpegts?.isSupported?.()===true;
    }catch{
      return false;
    }
  }

  function safariManagedMediaSourceCapable(){
    return Boolean(
      window.ManagedMediaSource||
      window.MediaSource
    )&&mpegtsLiveSupported();
  }

  function syncTikTokControls(){
    player.classList.toggle("tiktok-playing",!tiktokLiveVideo?.paused);
  }

  function showTikTokControls({sticky=false}={}){
    if(currentMediaType!=="live")return;
    player.classList.add("tiktok-controls-visible");
    clearTimeout(tiktokControlsTimer);
    if(sticky||tiktokLiveVideo?.paused)return;
    tiktokControlsTimer=setTimeout(()=>{
      if(!tiktokLiveVideo?.paused)player.classList.remove("tiktok-controls-visible");
    },2200);
  }

  function installTikTokLiveControls(){
    if(!tiktokLiveVideo||!tiktokLiveControls)return;
    tiktokLivePlay?.addEventListener("click",event=>{
      event.stopPropagation();
      if(tiktokLiveVideo.paused)tiktokLiveVideo.play().catch(()=>{});
      else tiktokLiveVideo.pause();
      syncTikTokControls();
      showTikTokControls({sticky:tiktokLiveVideo.paused});
    });
    tiktokLiveMute?.addEventListener("click",event=>{
      event.stopPropagation();
      tiktokLiveVideo.muted=!tiktokLiveVideo.muted;
      showTikTokControls();
    });
    tiktokLiveFull?.addEventListener("click",event=>{
      event.stopPropagation();
      if(document.fullscreenElement)document.exitFullscreen?.();
      else if(player.requestFullscreen)player.requestFullscreen();
      else if(tiktokLiveVideo.webkitEnterFullscreen)tiktokLiveVideo.webkitEnterFullscreen();
    });
    tiktokLiveVideo.addEventListener("playing",()=>{
      player.classList.add("tiktok-media-playing");
      syncTikTokControls();
      showTikTokControls();
    });
    tiktokLiveVideo.addEventListener("error",()=>{
      player.classList.remove("tiktok-media-playing");
      showTikTokControls({sticky:true});
    });
    tiktokLiveVideo.addEventListener("waiting",()=>{
      player.classList.remove("tiktok-media-playing");
    });
    tiktokLiveVideo.addEventListener("pause",()=>{
      syncTikTokControls();
      showTikTokControls({sticky:true});
    });
    player.addEventListener("pointermove",()=>showTikTokControls());
    player.addEventListener("pointerenter",()=>showTikTokControls());
    player.addEventListener("pointerleave",()=>{
      if(currentMediaType==="live"&&!tiktokLiveVideo.paused){
        player.classList.remove("tiktok-controls-visible");
      }
    });
    player.addEventListener("click",event=>{
      if(currentMediaType!=="live")return;
      if(event.target.closest?.(".tiktok-live-controls,[data-pip-drag],[data-pip-edge],.pip-move-zone"))return;
      showTikTokControls();
    });
  }

  function stopTikTokLivePlayback(){
    clearTimeout(tiktokPreparedTimer);
    tiktokPreparedTimer=0;
    tiktokPreparedLiveId="";
    try{
      tiktokLivePlayer?.pause?.();
      tiktokLivePlayer?.unload?.();
      tiktokLivePlayer?.detachMediaElement?.();
      tiktokLivePlayer?.destroy?.();
    }catch{}
    tiktokLivePlayer=null;
    try{
      tiktokLiveVideo.pause();
      tiktokLiveVideo.onerror=null;
      tiktokLiveVideo.onloadedmetadata=null;
      tiktokLiveVideo.onplaying=null;
      tiktokLiveVideo.removeAttribute("src");
      tiktokLiveVideo.load();
    }catch{}
    clearTimeout(tiktokControlsTimer);
    player.classList.remove("tiktok-active","tiktok-vod","tiktok-controls-visible","tiktok-playing","tiktok-media-playing");
    if(tiktokLiveVideo)tiktokLiveVideo.controls=false;
    if(tiktokLiveControls)tiktokLiveControls.hidden=true;
    if(tiktokLivePreview){
      tiktokLivePreview.hidden=true;
      tiktokLivePreview.removeAttribute("src");
    }
  }

  function stopTikTokVideoPlayback(){
    if(tiktokMediaVideo){
      try{
        tiktokMediaVideo.pause();
        tiktokMediaVideo.onerror=null;
        tiktokMediaVideo.onloadedmetadata=null;
        tiktokMediaVideo.oncanplay=null;
        tiktokMediaVideo.onplaying=null;
        tiktokMediaVideo.onpause=null;
        tiktokMediaVideo.onended=null;
        tiktokMediaVideo.autoplay=false;
        tiktokMediaVideo.removeAttribute("autoplay");
        tiktokMediaVideo.removeAttribute("src");
        tiktokMediaVideo.load();
      }catch{}
      tiktokMediaVideo.controls=false;
      tiktokMediaVideo.hidden=true;
    }
    if(tiktokMediaPreview){
      tiktokMediaPreview.hidden=true;
      tiktokMediaPreview.removeAttribute("src");
    }
    player.classList.remove("tiktok-vod","tiktok-vod-loading","tiktok-playing","tiktok-media-playing");
  }

  function activateMediaType(type){
    type=normalizedMediaType(type);
    currentMediaType=type;
    player.dataset.mediaType=type;

    if(embedMediaCore)embedMediaCore.hidden=type!=="embed";
    if(liveMediaCore)liveMediaCore.hidden=type!=="live";
    if(nativeMediaCore)nativeMediaCore.hidden=type!=="media";

    if(type==="embed"){
      currentMediaProvider="youtube";
      player.dataset.mediaProvider="youtube";
      player.classList.remove(
        "tiktok-active","tiktok-vod","tiktok-controls-visible",
        "tiktok-playing","tiktok-media-playing","tiktok-vod-loading"
      );
    }else{
      currentMediaProvider="tiktok";
      player.dataset.mediaProvider="tiktok";
      player.classList.add("tiktok-active");
      player.classList.toggle("tiktok-vod",type==="media");
      if(type!=="live")player.classList.remove("tiktok-controls-visible","tiktok-playing");
    }
    return type;
  }

  function activateYoutubeSurface(){
    stopTikTokVideoPlayback();
    stopTikTokLivePlayback();
    activateMediaType("embed");
    try{
      const iframe=ytPlayer?.getIframe?.();
      if(iframe){
        iframe.style.removeProperty("display");
        iframe.style.removeProperty("visibility");
        iframe.style.removeProperty("opacity");

  function activateTikTokLiveSurface(){

    activateMediaType("live");
  }

  function activateTikTokMediaSurface(){
    try{ytPlayer?.pauseVideo?.()}catch{}
    activateMediaType("media");
  }

  function prepareTikTokLivePlayer(meta={}){
    if(String(meta?.provider||"").toLowerCase()!=="tiktok")return false;
    void primeTikTokPreparedStream(meta,{priority:true});
    primeTikTokPlaybackNeighborhood(String(meta?.id||""),2);
    return true;
  }

  function attachTikTokFlv(url,meta,{legacy=false}={}){
    if(!url||!tiktokLiveVideo)return false;
    const engine=!legacy&&window.mpegts&&mpegtsLiveSupported()
      ?window.mpegts
      :(!isAppleMobileBrowser()&&window.flvjs&&flvjs.isSupported?.()?window.flvjs:null);
    if(!engine)return false;

    let instance=null;
    try{
      instance=engine.createPlayer(
        {type:"flv",isLive:true,url,cors:true,withCredentials:false},
        {
          customLoader:(!legacy&&engine===window.mpegts)?TikTokPreparedLoader:undefined,
          enableStashBuffer:false,
          stashInitialSize:64*1024,
          lazyLoad:false,
          autoCleanupSourceBuffer:true,
          autoCleanupMaxBackwardDuration:30,
          autoCleanupMinBackwardDuration:12,
          enableWorkerForMSE:Boolean(window.ManagedMediaSource||/Safari/i.test(navigator.userAgent||"")),
          liveSync:true,
          liveSyncMaxLatency:3,
          liveSyncTargetLatency:1.2
        }
      );
      instance.attachMediaElement(tiktokLiveVideo);
      instance.load();
      tiktokLivePlayer=instance;
      tiktokLiveVideo.play().catch(()=>{});
    }catch(error){
      try{instance?.destroy?.()}catch{}
      if(!legacy&&window.flvjs?.isSupported?.()){
        return attachTikTokFlv(url,meta,{legacy:true});
      }
      console.warn("tiktok_live_player_failed",error);
      return false;
    }

    const events=engine.Events||{};
    if(events.ERROR){
      instance.on(events.ERROR,()=>{
        player.classList.remove("tiktok-media-playing");
        if(
          !legacy&&
          String(currentMeta?.id||"")===String(meta?.id||"")&&
          !isAppleMobileBrowser()&&
          window.flvjs?.isSupported?.()
        ){
          stopTikTokLivePlayback();
          player.classList.add("tiktok-active");
          attachTikTokFlv(url,meta,{legacy:true});
        }
      });
    }
    return true;
  }

  function playTikTokLive(meta={}){
    stopTikTokVideoPlayback();
    player.classList.remove("tiktok-vod");
    const id=String(meta?.id||"").trim();
    const direct=String(meta?.streamUrl||"").trim();
    const hls=String(meta?.hlsUrl||"").trim();
    if(!id||(!direct&&!hls))return false;

    // The prepared HTTP-FLV reader lives outside the decoder. Closing a
    // previous player does not discard the selected card's preloaded GOP.
    stopTikTokLivePlayback();
    activateTikTokLiveSurface();
    enterTikTokWatchMode(meta);

    tiktokEmbedCurrentTime=0;
    tiktokEmbedDuration=0;
    currentMeta=meta;
    const ratio=
      validMediaAspect(meta?.aspectRatio)||
      (
        Number(meta?.videoWidth)>0&&Number(meta?.videoHeight)>0
          ?Number(meta.videoWidth)/Number(meta.videoHeight)
          :9/16
      );
    const kind=mediaLayoutKindFromRatio(ratio);
    current={
      id,
      kind,
      ratio,
      detectedRatio:ratio,
      label:String(meta?.title||""),
      provider:"tiktok",
      type:"live"
    };
    applyMediaLayoutSelection(kind,{relayout:true});
    applyHeaderTint(meta);

    const previewUrl=livePreviewForMeta(meta);
    if(tiktokLivePreview){
      tiktokLivePreview.hidden=!previewUrl;
      if(previewUrl)tiktokLivePreview.src=previewUrl;
    }
    player.classList.remove("tiktok-media-playing");

    tiktokLiveVideo.hidden=false;
    tiktokLiveVideo.controls=false;
    tiktokLiveVideo.muted=false;
    if(tiktokLiveControls)tiktokLiveControls.hidden=false;
    syncTikTokControls();
    showTikTokControls();
    tiktokLiveVideo.poster="";

    tiktokLiveVideo.onloadedmetadata=()=>{
      if(String(current?.id||"")!==id)return;
      const w=Number(tiktokLiveVideo.videoWidth)||0;
      const h=Number(tiktokLiveVideo.videoHeight)||0;
      if(w>0&&h>0)commitCurrentAspect(id,w/h,{relayout:true,provider:"tiktok"});
    };

    if(
      isAppleMobileBrowser()&&
      hls&&
      nativeHlsSupported(tiktokLiveVideo)
    ){
      tiktokLiveVideo.src=hls;
      tiktokLiveVideo.load();
      tiktokLiveVideo.play().catch(()=>{});
    }else if(direct&&mpegtsLiveSupported()){
      if(!attachTikTokFlv(direct,meta)){
        player.classList.remove("tiktok-active");
        return false;
      }
    }else{
      // Do not force HTTP-FLV on an Apple/WebKit build that has no
      // live MSE/ManagedMediaSource path. That creates the Safari spinner.
      console.warn("tiktok_live_unsupported_on_browser",{
        provider:"tiktok",
        handle:String(meta?.handle||""),
        hls:Boolean(hls),
        flv:Boolean(direct),
        mseLive:mpegtsLiveSupported(),
        managedMediaSource:Boolean(window.ManagedMediaSource)
      });
      player.classList.remove("tiktok-active");
      return false;
    }

    renderCurrentInfo();
    schedulePip();
    return true;
  }

  const tiktokVodWarmAt=new Map();
  const tiktokVodWarmSources=new Map();
  let tiktokVodWarmObserver=null;

  function tiktokVodWarmKey(meta={}){
    const id=String(meta?.id||"").trim();
    const handle=String(meta?.handle||"").trim().replace(/^@/,"").toLowerCase();
    return handle&&id?handle+":"+id:"";
  }

  function warmTikTokVod(meta={}){
    if(String(meta?.provider||"").toLowerCase()!=="tiktok"||meta?.isLive===true)return false;
    const id=String(meta?.id||"").trim();
    const handle=String(meta?.handle||"").trim().replace(/^@/,"");
    if(!/^[0-9]{8,}$/.test(id)||!handle)return false;

    const key=tiktokVodWarmKey(meta);
    const now=Date.now();
    if(key&&now-Number(tiktokVodWarmAt.get(key)||0)<90_000)return true;
    if(key)tiktokVodWarmAt.set(key,now);

    // Resolve only a couple of bytes at the edge so click-to-play can attach
    // the native <video> immediately. No iframe and no Render media bytes.
    const endpoint=new URL(TIKTOK_LIVE_API+"/tiktok/video-warm-edge");
    endpoint.searchParams.set("user",handle);
    endpoint.searchParams.set("id",id);
    fetch(endpoint.toString(),{cache:"no-store"})
      .then(response=>response.body?.cancel?.())
      .catch(()=>{});
    return true;
  }
  function observeTikTokVodWarmRows(rootEl=document){
    const cards=[...rootEl.querySelectorAll?.('.row[data-provider="tiktok"][data-video-id]')||[]];
    if(!cards.length)return;

    if(!("IntersectionObserver" in window)){
      cards.slice(0,4).forEach(card=>{
        const id=String(card.dataset.videoId||"");
        const meta=feedMetas.find(item=>String(item?.id||"")===id);
        if(meta&&!meta?.isLive)warmTikTokVod(meta);
      });
      return;
    }

    if(!tiktokVodWarmObserver){
      tiktokVodWarmObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          tiktokVodWarmObserver.unobserve(entry.target);
          const id=String(entry.target.dataset.videoId||"");
          const meta=feedMetas.find(item=>String(item?.id||"")===id);
          if(meta&&!meta?.isLive)warmTikTokVod(meta);
        }
      },{root:null,rootMargin:"700px 0px",threshold:0.01});
    }

    cards.forEach(card=>tiktokVodWarmObserver.observe(card));
  }

  function playTikTokVideo(meta={}){
    const id=String(meta?.id||"").trim();
    const handle=String(meta?.handle||"").trim().replace(/^@/,"");
    if(!/^[0-9]{8,}$/.test(id)||!handle||!tiktokMediaVideo)return false;

    stopTikTokLivePlayback();
    stopTikTokVideoPlayback();
    activateTikTokMediaSurface();
    enterTikTokWatchMode(meta);
    player.classList.add("tiktok-vod","tiktok-vod-loading");
    player.classList.remove("tiktok-playing","tiktok-media-playing");
    currentMeta=meta;

    const sourceRatio=
      validMediaAspect(meta?.aspectRatio)||
      (
        Number(meta?.videoWidth)>0&&Number(meta?.videoHeight)>0
          ?Number(meta.videoWidth)/Number(meta.videoHeight)
          :9/16
      );
    const kind=mediaLayoutKindFromRatio(sourceRatio);
    const ratio=kind==="portrait"?9/16:16/9;
    current={
      id,
      kind,
      ratio,
      detectedRatio:ratio,
      label:String(meta?.title||""),
      provider:"tiktok",
      type:"media"
    };
    applyMediaLayoutSelection(kind,{relayout:true});
    applyHeaderTint(meta);

    if(tiktokLiveVideo)tiktokLiveVideo.hidden=true;
    if(tiktokLiveControls)tiktokLiveControls.hidden=true;

    const preview=String(meta?.thumbnail||meta?.sourceAvatar||"").trim();
    if(tiktokMediaPreview){
      tiktokMediaPreview.hidden=!preview;
      if(preview)tiktokMediaPreview.src=preview;
    }

    const endpoint=new URL(TIKTOK_LIVE_API+"/tiktok/video-stream");
    endpoint.searchParams.set("user",handle);
    endpoint.searchParams.set("id",id);
    endpoint.searchParams.set("source","auto");

    const video=tiktokMediaVideo;
    video.hidden=false;
    video.controls=true;
    video.autoplay=true;
    video.muted=false;
    video.playsInline=true;
    video.setAttribute("playsinline","");
    video.setAttribute("webkit-playsinline","");
    video.preload="auto";

    video.onloadedmetadata=()=>{
      if(String(current?.id||"")!==id)return;
      const detected=
        Number(video.videoWidth)>0&&Number(video.videoHeight)>0
          ?Number(video.videoWidth)/Number(video.videoHeight)
          :0;
      if(detected>0){
        const detectedKind=mediaLayoutKindFromRatio(detected);
        current.detectedRatio=detected;
        current.kind=detectedKind;
        current.ratio=detectedKind==="portrait"?9/16:16/9;
        applyMediaLayoutSelection(detectedKind,{relayout:true});
      }
    };
    video.oncanplay=()=>{
      if(String(current?.id||"")!==id)return;
      player.classList.remove("tiktok-vod-loading");
    };
    video.onplaying=()=>{
      if(String(current?.id||"")!==id)return;
      player.classList.remove("tiktok-vod-loading");
      player.classList.add("tiktok-playing","tiktok-media-playing");
      if(tiktokMediaPreview)tiktokMediaPreview.hidden=true;
    };
    video.onpause=()=>{
      if(String(current?.id||"")!==id)return;
      player.classList.remove("tiktok-playing");
    };
    video.onended=()=>{
      if(String(current?.id||"")!==id)return;
      player.classList.remove("tiktok-playing","tiktok-media-playing");
      queueMicrotask(()=>playNextFeedVideo());
    };
    video.onerror=()=>{
      if(String(current?.id||"")!==id)return;
      player.classList.remove("tiktok-playing","tiktok-media-playing","tiktok-vod-loading");
      console.warn("tiktok_native_video_error",id);
    };

    video.src=endpoint.toString();
    video.load();
    const attempt=video.play();
    if(attempt&&typeof attempt.catch==="function"){
      attempt.catch(()=>{});
    }

    renderCurrentInfo();
    schedulePip();
    return true;
  }
  function openMedia(meta={},options={}){
    const id=String(meta?.id||"").trim();
    if(!id)return false;

    const type=mediaTypeFor(meta);
    if(type==="live")return playTikTokLive(meta);
    if(type==="media")return playTikTokVideo(meta);
    return navigateToVideo(id,meta,{replace:options?.replace===true});
  }

  function compactFactsMarkup(meta={}){
    const views=String(meta.viewsLabel||"").trim();
    const time=String(meta.publishedLabel || (meta.isLive?"Đang trực tiếp":"")).trim();
    const pieces=[];
    if(views){
      if(meta.isLive){
        pieces.push('<span class="fact-views">'+escapeHtml(views)+'</span>');
      }else{
        pieces.push('<span class="fact-views-group">'+viewsPlayIconMarkup()+'<span class="fact-views">'+escapeHtml(views)+'</span></span>');
      }
    }
    if(time&&(!meta.isLive||!views))pieces.push('<span class="fact-time">'+escapeHtml(time)+'</span>');
    return pieces.join("");

  function renderInfoQuickActions(meta={}){

      String(meta?.provider||"").toLowerCase()==="tiktok"
        ?String(meta?.handle||"").trim().replace(/^@/,"")
        :"";

    const scope=feedMode==="package"?String(activePackageScope||""):"";
    const scopeLabel=scope?currentFeedLabel():"";

      ?(status==="selected"?"Bỏ chọn khỏi "+scopeLabel:"Chọn vào "+scopeLabel)
      :"Chọn vào nguồn…";

      ?(status==="blocked"?"Bỏ chặn khỏi "+scopeLabel:"Chặn khỏi "+scopeLabel)

  function renderCurrentInfo(){
    if(currentMeta&&!currentMeta.sourceAvatar&&currentMeta.sourceId){
      const identity=localSourceIdentity(currentMeta.sourceId);
      if(identity?.sourceAvatar&&!currentMeta.sourceAvatar){
        currentMeta.sourceAvatar=identity.sourceAvatar;
      }
      if(identity?.sourceName&&!currentMeta.sourceName){
        currentMeta.sourceName=identity.sourceName;
      }
    }

    const meta=currentMeta||{};
    const title=String(meta.title||"").trim();
    const source=String(meta.sourceName||"").trim();
    const hasRealMeta=Boolean(String(meta.id||"").trim()&&title);

    if(videoInfo)videoInfo.hidden=!hasRealMeta;
    if(!hasRealMeta){
      titleEl.textContent="";
      videoSourceEl.textContent="";
      videoFactsEl.textContent="";
      videoQuickActions?.replaceChildren();
      videoAvatarSlot.replaceChildren();
      return;
    }

    titleEl.textContent=title;
    videoSourceEl.innerHTML=
      escapeHtml(source)+(meta.verified?verifiedBadgeMarkup():"");
    // TikTok LIVE already shows LIVE + viewer count on the thumbnail.
    // Do not repeat "N đang xem" again in the detail/info line.
    const hideTikTokLiveFacts=
      String(meta?.provider||"").toLowerCase()==="tiktok" &&
      meta?.isLive===true;
    videoFactsEl.innerHTML=hideTikTokLiveFacts?"":compactFactsMarkup(meta);
    renderInfoQuickActions(meta);
    if(videoMetaSep)videoMetaSep.hidden=true;
    syncVideoDocumentIdentity({push:false});

    const avatar=String(meta.sourceAvatar||"").trim();
    const existingAvatar=videoAvatarSlot.querySelector(".info-avatar");
    if(avatar){
      if(existingAvatar instanceof HTMLImageElement){
        const currentSrc=String(existingAvatar.getAttribute("src")||"").trim();
        if(currentSrc!==avatar)existingAvatar.src=avatar;
      }else{
        const next=document.createElement("img");
        next.className="info-avatar";
        next.alt="";
        next.src=avatar;
        videoAvatarSlot.replaceChildren(next);
      }
    }else if(source){
      const letter=source.slice(0,1).toUpperCase();
      if(existingAvatar?.classList?.contains("placeholder")){
        if(existingAvatar.textContent!==letter)existingAvatar.textContent=letter;
      }else{
        const next=document.createElement("span");
        next.className="info-avatar placeholder";
        next.textContent=letter;
        videoAvatarSlot.replaceChildren(next);
      }
    }else{
      videoAvatarSlot.replaceChildren();
    }
  }

  function avatarMarkup(meta,eager=false){
    // Resolve the avatar from the exact row first, then channelId, then the
    // canonical source directory / same channel name already present locally.

      :"";

  const youtubeThumbQualityCache=new Map();
  let youtubeThumbQualityObserver=null;

  function probeYoutubeThumb(url,minWidth=480,minHeight=270){
    return new Promise(resolve=>{
      if(!url){resolve("");return;}
      const test=new Image();
      test.decoding="async";
      try{test.fetchPriority="low";}catch{}
      let settled=false;
      const finish=value=>{
        if(settled)return;
        settled=true;
        resolve(value);
      };
      test.onload=async()=>{
        try{await test.decode?.();}catch{}
        const width=Number(test.naturalWidth)||0;
        const height=Number(test.naturalHeight)||0;
        finish(width>=minWidth&&height>=minHeight?url:"");
      };
      test.onerror=()=>finish("");
      test.src=url;
      if(test.complete&&test.naturalWidth)queueMicrotask(()=>test.onload?.());
      setTimeout(()=>finish(""),1800);
    });
  }

  function resolvePreferredCardThumb(id,current=""){
    id=String(id||"").trim();
    current=String(current||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return Promise.resolve(current);
    const cacheKey=id+"|"+current;
    const cached=youtubeThumbQualityCache.get(cacheKey);
    if(cached)return cached;

    const task=(async()=>{
      const maxres=await probeYoutubeThumb(youtubeThumbUrl(id,"maxresdefault.jpg"),640,360);
      if(maxres)return maxres;

      // Some videos do not publish maxres. YouTube can answer those URLs with
      // a tiny grey placeholder instead of a network error, so validate the
      // decoded size before switching the visible card away from its safe hq image.
      const sd=await probeYoutubeThumb(youtubeThumbUrl(id,"sddefault.jpg"),480,360);
      if(sd)return sd;

      return current;
    })().catch(()=>current);

    youtubeThumbQualityCache.set(cacheKey,task);
    return task;
  }

  function upgradeRowThumb(img){
    if(!(img instanceof HTMLImageElement)||img.dataset.thumbQualityDone==="1")return;
    const card=img.closest(".row[data-video-id]");
    const id=String(card?.dataset?.videoId||"").trim();
    const base=String(img.dataset.thumbBase||img.getAttribute("src")||"").trim();
    if(!id||!base){
      img.dataset.thumbQualityDone="1";
      return;
    }
    img.dataset.thumbQualityDone="1";
    void resolvePreferredCardThumb(id,base).then(best=>{
      if(!best||!img.isConnected||card?.dataset?.videoId!==id)return;
      if(best!==img.getAttribute("src"))img.src=best;
    });
  }

  function observeRowThumbQuality(root){
    if(!root)return;
    const images=[...root.querySelectorAll(".row[data-video-id] .row-thumb img")];
    if(!("IntersectionObserver" in window)){
      images.forEach(upgradeRowThumb);
      return;
    }
    if(!youtubeThumbQualityObserver){
      youtubeThumbQualityObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          youtubeThumbQualityObserver?.unobserve?.(entry.target);
          upgradeRowThumb(entry.target);
        }
      },{rootMargin:"320px 0px"});
    }
    images.forEach(img=>youtubeThumbQualityObserver.observe(img));
  }

  function directSourceStatus(sourceId,scope=activePackageScope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return "normal";
    const selected=Array.isArray(sourceStateRemote?.scopedSelected?.[scope])
      ?sourceStateRemote.scopedSelected[scope]
      :[];
    const blocked=Array.isArray(sourceStateRemote?.scopedBlocked?.[scope])
      ?sourceStateRemote.scopedBlocked[scope]
      :[];
    if(blocked.includes(sourceId))return "blocked";
    if(selected.includes(sourceId))return "selected";
    return "normal";
  }

  function patchLocalSourceStatus(sourceId,status,scope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return;
    sourceStateRemote=sourceStateRemote&&typeof sourceStateRemote==="object"
      ?sourceStateRemote
      :{};
    sourceStateRemote.scopedSelected=sourceStateRemote.scopedSelected||{};
    sourceStateRemote.scopedBlocked=sourceStateRemote.scopedBlocked||{};
    const without=(list)=>Array.isArray(list)?list.filter(id=>id!==sourceId):[];
    sourceStateRemote.scopedSelected[scope]=without(sourceStateRemote.scopedSelected[scope]);
    sourceStateRemote.scopedBlocked[scope]=without(sourceStateRemote.scopedBlocked[scope]);
    if(status==="selected")sourceStateRemote.scopedSelected[scope].push(sourceId);
    if(status==="blocked")sourceStateRemote.scopedBlocked[scope].push(sourceId);
  }

  function positionRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor||menu.hidden)return;
    const rect=anchor.getBoundingClientRect();
    const menuRect=menu.getBoundingClientRect();
    const gap=6;
    const left=Math.max(
      8,
      Math.min(
        window.innerWidth-menuRect.width-8,
        rect.right-menuRect.width
      )
    );
    const below=rect.bottom+gap;
    const top=below+menuRect.height<=window.innerHeight-8
      ?below
      :Math.max(8,rect.top-menuRect.height-gap);
    menu.style.left=Math.round(left)+"px";
    menu.style.top=Math.round(top)+"px";
  }

  function revealRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor){
      menu.hidden=true;
      return;
    }
    // Keep the freshly rendered menu out of paint until its final
    // coordinates are known. This prevents the one-frame flash at the
    // previous/default position when opening or switching submenus.
    menu.style.visibility="hidden";
    menu.hidden=false;
    positionRowActionMenu(anchor);
    menu.style.visibility="";
    requestAnimationFrame(()=>{
      syncInlinePlayerOverlay();
      requestAnimationFrame(()=>syncInlinePlayerOverlay());

  async function startNativeDownload(meta={},format="mp4"){
    const resolverUrl=downloadUrl(meta,format);
    if(!resolverUrl){
      setDownloadRowStatus(format,"");
      window.alert("Không tìm thấy media để tải.");
      return false;
    }

    try{
      const response=await fetch(resolverUrl,{
        method:"GET",
        mode:"cors",
        cache:"no-store",
        credentials:"omit",
        headers:{"accept":"application/json"}
      });
      const data=await response.json().catch(()=>null);
      const directUrl=String(data?.url||"").trim();
      if(!response.ok||!data?.ok||!/^https:\/\//i.test(directUrl)){
        throw new Error(String(data?.error||"download_resolve_failed"));
      }

      const anchor=document.createElement("a");
      anchor.href=directUrl;
      anchor.rel="noopener";
      anchor.download="";
      anchor.style.display="none";
      document.body.appendChild(anchor);
      anchor.click();
      window.setTimeout(()=>anchor.remove(),30000);
      window.setTimeout(()=>closeRowActionMenu(),1200);
      return true;
    }catch(error){
      console.warn("download resolve failed",error);
      setDownloadRowStatus(format,"");
      window.alert("Không lấy được file. Thử lại.");
      return false;
    }
  }

  async function writeCardSourceStatus(meta,status,scope){
    const sourceId=validSourceId(meta?.sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope||!hasSourceAdminAccess())return false;
    const pin=SOURCE_ADMIN_PIN;

    const previous=directSourceStatus(sourceId,scope);
    patchLocalSourceStatus(sourceId,status,scope);

    const event={
      type:"source-state",
      id:sourceId,
      status,
      scope,
      name:String(meta?.sourceName||"").trim(),
      at:Date.now()
    };
    try{sourceUiChannel?.postMessage(event)}catch{}
    try{localStorage.setItem(SOURCE_UI_EVENT_KEY,JSON.stringify(event))}catch{}

    try{
      const response=await fetch(SOURCE_STATE_URL,{
        method:"POST",
        cache:"no-store",
        headers:{
          "content-type":"application/json",
          "x-1988-pin":pin
        },
        body:JSON.stringify({
          op:"set_source",
          scope,
          channel_id:sourceId,
          status,
          version:Date.now(),
          source:{
            name:String(meta?.sourceName||"").trim(),
            thumbnailUrl:String(meta?.sourceAvatar||"").trim(),
            subscribers:""
          }
        })
      });
      if(response.status===401){
        try{localStorage.removeItem(SOURCE_ADMIN_AUTH_KEY)}catch{}
        patchLocalSourceStatus(sourceId,previous,scope);
        closeRowActionMenu();
        window.alert("Phiên quản trị không còn hợp lệ.");
        return false;
      }
      if(!response.ok){
        patchLocalSourceStatus(sourceId,previous,scope);
        throw new Error("source_state_"+response.status);
      }

      closeRowActionMenu();
      setTimeout(()=>void syncPreparedPackages([scope],{refreshManifest:true}),1200);
      return true;
    }catch(error){
      patchLocalSourceStatus(sourceId,previous,scope);
      console.warn("save source status failed",error);
      window.alert("Chưa lưu được thay đổi nguồn.");
      return false;
    }
  }

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

  function compactTikTokVideoCount(value){
    const n=Math.max(0,Number(value)||0);
    if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,"")+"B";
    if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
    if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K";
    return n?String(Math.round(n)):"";
  }

  function tiktokVideoAgeLabel(createTime=0){
    const raw=Number(createTime)||0;
    if(!raw)return "";
    const ms=raw>1e12?raw:raw*1000;
    const age=Math.max(0,Date.now()-ms);
    const minute=60_000;
    const hour=60*minute;
    const day=24*hour;
    if(age<hour)return Math.max(1,Math.floor(age/minute))+" phút trước";
    if(age<day)return Math.max(1,Math.floor(age/hour))+" giờ trước";
    if(age<7*day)return Math.max(1,Math.floor(age/day))+" ngày trước";
    if(age<30*day)return Math.max(1,Math.floor(age/(7*day)))+" tuần trước";
    if(age<365*day)return Math.max(1,Math.floor(age/(30*day)))+" tháng trước";
    return Math.max(1,Math.floor(age/(365*day)))+" năm trước";
  }

  function tiktokVideoDurationLabel(seconds=0){
    const total=Math.max(0,Math.round(Number(seconds)||0));
    if(!total)return "";
    const h=Math.floor(total/3600);
    const m=Math.floor((total%3600)/60);
    const s=total%60;
    if(h)return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
    return m+":"+String(s).padStart(2,"0");
  }

  function normalizeTikTokChannelVideo(channel={},video={}){
    const handle=String(channel?.handle||video?.handle||"").trim().replace(/^@/,"");
    const id=String(video?.id||"").trim();
    if(!handle||!/^[0-9]{8,}$/.test(id))return null;

    const profile=channel?.profile&&typeof channel.profile==="object"
      ?channel.profile
      :{};
    const canonical=channelLibraryEntry("tiktok",handle);
    const cover=video?.cover&&typeof video.cover==="object"?video.cover:{};
    const stats=video?.stats&&typeof video.stats==="object"?video.stats:{};

    const width=Math.max(0,Number(cover?.width)||0);
    const height=Math.max(0,Number(cover?.height)||0);
    const ratio=width>0&&height>0?width/height:9/16;
    const avatar=String(
      canonical?.avatar?.url||
      canonical?.avatar?.storedUrl||
      canonical?.avatar?.sourceUrl||
      profile?.avatar?.url||
      profile?.avatar?.sourceUrl||
      profile?.avatar?.storedUrl||
      ""
    ).trim();
    const thumbnail=String(
      cover?.url||
      cover?.sourceUrl||
      cover?.storedUrl||
      avatar
    ).trim();

    return {
      id,
      provider:"tiktok",
      type:"media",
      handle,
      title:String(video?.title||"").trim()||("@"+handle),
      sourceName:String(canonical?.name||profile?.name||"").trim()||("@"+handle),
      sourceId:"tiktok:"+handle.toLowerCase(),
      sourceAvatar:avatar,
      thumbnail,
      isLive:false,
      verified:canonical?.verified===true||profile?.verified===true,
      viewsLabel:compactTikTokVideoCount(stats?.views),
      publishedLabel:tiktokVideoAgeLabel(video?.createTime),
      durationLabel:tiktokVideoDurationLabel(video?.duration),
      duration:Number(video?.duration)||0,
      uploaded:Number(video?.createTime)||0,
      mediaKind:ratio<1?"portrait":"landscape",
      aspectRatio:ratio,
      videoWidth:width,
      videoHeight:height,
      _aspectVerified:width>0&&height>0,
      _aspectSource:"tiktok-library",
      pageUrl:String(video?.pageUrl||"").trim()
    };
  }

  function normalizeLatestTikTokChannelVideo(channel={}){
    const videos=(Array.isArray(channel?.videos)?channel.videos:[])
      .filter(video=>/^[0-9]{8,}$/.test(String(video?.id||"").trim()))
      .sort((a,b)=>
        Number(b?.createTime||0)-Number(a?.createTime||0)||
        String(b?.id||"").localeCompare(String(a?.id||""))
      );
    return videos.length?normalizeTikTokChannelVideo(channel,videos[0]):null;
  }

  function buildLatestTikTokVideoFeed(payload={}){
    const out=[];
    const seen=new Set();
    for(const channel of Array.isArray(payload?.channels)?payload.channels:[]){
      const newest=(Array.isArray(channel?.videos)?channel.videos:[])
        .filter(video=>/^[0-9]{8,}$/.test(String(video?.id||"").trim()))
        .sort((a,b)=>
          Number(b?.createTime||0)-Number(a?.createTime||0)||
          String(b?.id||"").localeCompare(String(a?.id||""))
        )[0];
      if(!newest)continue;
      const meta=normalizeTikTokChannelVideo(channel,newest);
      if(!meta||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    return out.sort((a,b)=>
      Number(b?.uploaded||0)-Number(a?.uploaded||0)||
      String(a?.sourceName||"").localeCompare(String(b?.sourceName||""),"vi")
    );
  }

  function tiktokChannelListRows(){
    return (Array.isArray(tiktokLibraryChannels)?tiktokLibraryChannels:[])
      .filter(channel=>String(channel?.handle||"").trim())
      .slice()
      .sort((a,b)=>{
        const aHandle=String(a?.handle||"").trim().replace(/^@/,"");
        const bHandle=String(b?.handle||"").trim().replace(/^@/,"");
        const aName=String(channelLibraryEntry("tiktok",aHandle)?.name||a?.profile?.name||aHandle);
        const bName=String(channelLibraryEntry("tiktok",bHandle)?.name||b?.profile?.name||bHandle);
        return aName.localeCompare(bName,"vi");
      });
  }

    const channel=tiktokLibraryChannelForHandle(handle);

      .map(video=>normalizeTikTokChannelVideo(channel,video))
      .filter(Boolean)

  function tiktokLiveForHandle(handle=""){
    const key=String(handle||"").trim().replace(/^@/,"").toLowerCase();
    if(!key)return null;

      .find(meta=>String(meta?.handle||"").trim().replace(/^@/,"").toLowerCase()===key)||null;

  function tiktokProfileIdentity(handle=""){
    handle=String(handle||"").trim().replace(/^@/,"");
    const canonical=channelLibraryEntry("tiktok",handle);
    const channel=tiktokLibraryChannelForHandle(handle);
    const live=tiktokLiveForHandle(handle);
    const packageProfile=channel?.profile&&typeof channel.profile==="object"?channel.profile:{};
    const canonicalStats=
      canonical?.stats&&typeof canonical.stats==="object"
        ?canonical.stats
        :{};
    const avatar=String(
      canonical?.avatar?.url||
      canonical?.avatar?.storedUrl||
      canonical?.avatar?.sourceUrl||
      packageProfile?.avatar?.url||
      packageProfile?.avatar?.sourceUrl||
      packageProfile?.avatar?.storedUrl||
      live?.sourceAvatar||
      ""
    ).trim();
    const name=String(
      canonical?.name||
      packageProfile?.name||
      live?.sourceName||
      ("@"+handle)
    ).trim();
    const profile={
      ...packageProfile,
      name,
      avatar:{
        ...(packageProfile?.avatar&&typeof packageProfile.avatar==="object"
          ?packageProfile.avatar
          :{}),
        url:avatar
      },
      followers:
        canonicalStats?.followers??
        packageProfile?.followers??
        0,
      likes:
        canonicalStats?.likes??
        packageProfile?.likes??
        0,
      videoCount:
        canonicalStats?.videos??
        packageProfile?.videoCount??
        0,
      verified:
        canonical?.verified===true||
        packageProfile?.verified===true
    };
    return {
      channel,
      live,
      profile,
      avatar,
      name,
      canonical,
      stats:canonicalStats,
      verified:profile.verified===true
    };
  }

  async function loadTikTokLatestVideoFeed({force=false,silent=false}={}){
    if(tiktokLibraryFetchPromise)return tiktokLibraryFetchPromise;

    if(tiktokVideoMetas.length&&!silent&&activePlatformNav==="tiktok"&&activeTikTokSubtab==="video"){
      feedMode="tiktok-video";
      activePackageScope="tiktok-video";
      feedMetas=tiktokVideoMetas;
      renderSampleContent();
    }

    tiktokLibraryFetchPromise=(async()=>{
      try{
        const version=force?-1:tiktokLibraryVersion;
        const response=await fetch(
          TIKTOK_LIBRARY_API+"/tiktok/library?v="+encodeURIComponent(version)+"&t="+Date.now(),
          {cache:"no-store"}
        );
        if(!response.ok)throw new Error("tiktok_library_"+response.status);
        const payload=await response.json();

        if(payload?.unchanged===true&&tiktokVideoMetas.length){
          return tiktokVideoMetas;
        }

        const next=buildLatestTikTokVideoFeed(payload);
        tiktokLibraryVersion=Number(payload?.version??tiktokLibraryVersion);
        tiktokLibraryChannels=Array.isArray(payload?.channels)?payload.channels:[];
        tiktokVideoMetas=next;

        if(!silent&&activePlatformNav==="tiktok"&&activeTikTokSubtab==="video"){
          feedMode="tiktok-video";
          activePackageScope="tiktok-video";
          feedMetas=next;
          renderSampleContent();
          syncFeedHeader();
        }
        return next;

  function updateHeaderSearchRoom(){
    if(!top||!sourceChips)return;

    // Mobile keeps the compact icon; explicit search always owns the row.
    if(mobileHeaderMq.matches||top.classList.contains("search-open")){
      headerRoomy=false;
      top.classList.remove("search-roomy");
      top.style.removeProperty("--auto-search-w");
      return;
    }

    const headerW=Math.max(
      0,
      top.clientWidth||
      document.documentElement.clientWidth||
      window.innerWidth||
      0
    );

    // IMPORTANT: do not use sourceChips.scrollWidth here.
    // The flex/block rail expands to its parent, so scrollWidth can look almost
    // as wide as the whole header even when the actual chips occupy much less.
    const chipsW=naturalSourceChipsWidth();

    // Reserve outer spacing plus the separate mic + settings buttons.
    // The source rail owns the left side; search/mic/settings own the right.
    const chromeReserve=108;
    const surplus=Math.max(0,headerW-chipsW-chromeReserve);

    // Full search is useful from 280px upward; let it grow with the real spare
    // space but cap it near YouTube's desktop search width.
    const roomy=chipsW>0&&surplus>=280;
    const searchW=roomy
      ?Math.min(640,Math.max(280,Math.floor(surplus)))
      :0;

    headerRoomy=roomy;
    top.classList.toggle("search-roomy",roomy);
    if(roomy)top.style.setProperty("--auto-search-w",searchW+"px");
    else top.style.removeProperty("--auto-search-w");
  }

  async function loadExistingSourceNames(){
    sourceNameChips.innerHTML="";

    const fallbackRows=[
      {key:"latest",label:"Ngày"},
      {key:"week",label:"Tuần"},
      {key:"live",label:"Live"}
    ];
    const sourceTabsKey="yt1988-source-tabs-v1";
    let storedRows=[];
    try{
      const saved=JSON.parse(localStorage.getItem(sourceTabsKey)||"[]");
      if(Array.isArray(saved)){
        storedRows=saved.filter(row=>row?.key&&row?.label);
      }
    }catch{}

    // Paint remembered tabs immediately; network state can refresh them later.
    renderExistingSourceNames(storedRows.length?storedRows:fallbackRows);

    // First app entry is always video-first: paint the latest package from
    // IndexedDB immediately and keep one newest video per channel. LIVE lists
    // are preloaded only after that paint, so realtime network never blocks home.
    const firstPackagePromise=(async()=>{
      const scope=STARTUP_SCOPE;
      activePackageScope=scope;
      await restoreStoredPackage(scope);
      const painted=await showPackageScope(scope,{hydrateLive:false});
      scheduleStartupLivePreload();
      return painted;
    })();

    const statePromise=(async()=>{
      try{
        const response=await fetch(SOURCE_STATE_URL,{cache:"no-store"});
        if(!response.ok)throw new Error("source_state_"+response.status);
        const payload=await response.json();
        const remote=payload?.state&&typeof payload.state==="object"?payload.state:{};
        sourceStateRemote=remote;
        sourceIdentityCache.clear();
        primeUnifiedChannelLibrary(remote);
        primeChannelDirectoryFromState(remote);

        // The feed may have painted from IndexedDB before source-state arrived.
        // Force one repaint so newly available channel avatars replace letter
        // placeholders instead of being skipped by the visual-signature cache.
        const feedRows=document.getElementById("rows");
        if(feedRows)feedRows.dataset.renderSignature="";
        if(
          feedMode==="package"&&
          activePackageScope==="live"&&
          activeLiveProvider()
        ){
          paintUnifiedLiveFromEdge(activeLiveProvider());
        }else if(feedMetas.length){
          renderSampleContent();
        }
        if(currentMeta)renderCurrentInfo();

        const rows=existingSourceTabNames(remote);
        try{localStorage.setItem(sourceTabsKey,JSON.stringify(rows))}catch{}
        return rows;
      }catch(_){
        return storedRows;
      }
    })();

    const manifestPromise=loadPackageManifest().then(async manifest=>{
      const scope=manifest?.[activePackageScope]?activePackageScope:(manifest?.latest?"latest":"");
      if(scope)await syncPreparedPackages([scope]);
      return manifest;
    });

    const [rowsFromState]=await Promise.all([
      statePromise,
      manifestPromise,
      firstPackagePromise
    ]);

    const rows=rowsFromState.length?rowsFromState:(storedRows.length?storedRows:fallbackRows);
    if(!rows.some(row=>String(row?.key||"")===String(activePackageScope))){
      activePackageScope=String(rows[0]?.key||"live");
      try{localStorage.setItem(ACTIVE_SCOPE_KEY,activePackageScope)}catch{}
    }
    renderExistingSourceNames(rows);

    const scopes=rows
      .map(row=>row.key)
      .filter(scope=>!Object.keys(packageManifest).length||packageManifest[scope]);

    // Restore every previously committed package before any new download. Tab
    // clicks remain RAM-only even after a refresh or temporary loss of network.
    await Promise.all(scopes.map(scope=>restoreStoredPackage(scope)));
    if(feedMode==="package"){
      await showPackageScope(activePackageScope);
    }

    // Synchronizer compares manifest hashes and downloads only changed scopes.
    prefetchPackages(scopes);

    // Non-LIVE packages may check on open. LIVE discovery already ran exactly
    // once above when this reload actually opened the Live tab.
    setTimeout(()=>{
      if(feedMode==="package"&&activePackageScope!=="live"){
        void checkPackagesOnDemand([activePackageScope]);
      }
    },0);
    return rows;
  }

  function layoutFeedMasonry(){
    const rows=document.getElementById("rows");
    if(!rows)return;

    const cards=[...rows.querySelectorAll(".row")];
    const cols=currentFeedColumnCount();
    const multi=cols>1&&cards.length>1;
    rows.classList.toggle("multi-column-feed",multi);

    // Ordinary list cards stay on strict shared rows so every thumbnail frame
    // starts on the same horizontal line. Masonry is only needed while a
    // portrait video is actually open inline and makes one card much taller.
    const hasTallInlinePortrait=
      multi &&
      !isTwoColumn() &&
      current?.kind==="portrait" &&
      !!rows.querySelector(".row-thumb.inline-playing:not(.pip-floating)");

    cards.forEach(card=>card.style.removeProperty("grid-row-end"));

    if(!hasTallInlinePortrait){
      rows.classList.remove("masonry-active");
      return;
    }

    rows.classList.add("masonry-active");

    const unit=4;
    const verticalGap=40;

    for(const card of cards){
      const height=Math.max(1,Math.ceil(card.getBoundingClientRect().height));
      const span=Math.max(1,Math.ceil((height+verticalGap)/unit));
      card.style.gridRowEnd="span "+span;
    }
  }

  function scheduleFeedMasonry(){

    });
  }

  function observeFeedMasonryRows(){
    const rows=document.getElementById("rows");
    if(!rows)return;
    if(!feedMasonryObserver){
      feedMasonryObserver=new ResizeObserver(()=>scheduleFeedMasonry());
    }
    feedMasonryObserver.disconnect();

    // Desktop/two-column cards already have fixed grid geometry. Watching every
    // thumbnail/avatar decode there caused repeated ResizeObserver -> rAF cycles
    // while scrolling a TikTok channel list.
    if(!isTwoColumn()){
      rows.querySelectorAll(".row").forEach(card=>feedMasonryObserver.observe(card));
      scheduleFeedMasonry();
    }else{
      rows.classList.remove("masonry-active");
      rows.querySelectorAll(".row").forEach(card=>card.style.removeProperty("grid-row-end"));
    }

  const rowsImageHost=document.getElementById("rows");

  for(const eventName of ["pointerover","pointerdown"]){
    rowsImageHost?.addEventListener(eventName,event=>{

      if(!card)return;

  rowsImageHost?.addEventListener("error",event=>{
    const img=event.target;
    if(!(img instanceof HTMLImageElement)||!img.closest(".row-thumb"))return;

    const card=img.closest(".row[data-video-id]");
    const id=String(card?.dataset?.videoId||"").trim();
    const provider=String(card?.dataset?.provider||"youtube").toLowerCase();

    if(provider==="tiktok"){
      const meta=feedMetas.find(item=>String(item?.id||"")===id);
      const currentSrc=String(img.currentSrc||img.src||img.getAttribute("src")||"").trim();
      const tried=new Set(
        String(img.dataset.tiktokThumbTried||"")
          .split("\n")
          .map(value=>value.trim())
          .filter(Boolean)
      );
      if(currentSrc)tried.add(currentSrc);

      const candidates=[
        ...(Array.isArray(meta?.livePreviewFallbacks)?meta.livePreviewFallbacks:[]),
        String(meta?.livePreview||"").trim(),
        String(meta?.thumbnail||"").trim(),
        String(meta?.sourceAvatar||"").trim()
      ].filter(Boolean);

      const next=candidates.find(url=>!tried.has(url));
      img.dataset.tiktokThumbTried=[...tried].join("\n");

      if(next){
        img.src=next;
        if(meta){
          meta.livePreview=next;
          meta.thumbnail=next;
        }
        return;
      }

      // One fresh edge refresh can provide a newly signed live-cover URL.
      if(img.dataset.tiktokThumbRefresh!=="1"){
        img.dataset.tiktokThumbRefresh="1";
        const handle=String(meta?.handle||"").trim();
        void refreshTikTokLiveFeed({paint:false,force:true}).then(()=>{
          if(!img.isConnected)return;
          const fresh=feedMetas.find(item=>String(item?.id||"")===id)||
            tiktokLiveMetas.find(item=>String(item?.handle||"")===handle);
          const refreshed=[
            ...(Array.isArray(fresh?.livePreviewFallbacks)?fresh.livePreviewFallbacks:[]),
            String(fresh?.livePreview||"").trim(),
            String(fresh?.thumbnail||"").trim(),
            String(fresh?.sourceAvatar||"").trim()
          ].filter(Boolean).find(url=>!tried.has(url));
          if(refreshed){
            img.src=refreshed;
            return;
          }

          // Never leave the browser's broken-image icon over a LIVE card.
          const avatar=String(fresh?.sourceAvatar||meta?.sourceAvatar||"").trim();
          if(avatar&&avatar!==currentSrc){
            img.src=avatar;
          }else{
            img.removeAttribute("src");
            img.style.visibility="hidden";
          }
        }).catch(()=>{
          const avatar=String(meta?.sourceAvatar||"").trim();
          if(avatar&&avatar!==currentSrc)img.src=avatar;
          else{
            img.removeAttribute("src");
            img.style.visibility="hidden";
          }
        });
      }
      return;
    }

    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;

    const stage=Number(img.dataset.thumbFallbackStage||0);
    const variants=[
      "sddefault.jpg",
      "hqdefault.jpg",
      "mqdefault.jpg"
    ];

    if(stage<variants.length){
      img.dataset.thumbFallbackStage=String(stage+1);
      const fallback=youtubeThumbUrl(id,variants[stage]);
      if(fallback&&fallback!==img.src){
        img.src=fallback;
        return;
      }
    }

    const meta=feedMetas.find(item=>String(item?.id||"")===id);
    if(meta?.isLive===true){
      // LIVE preview belongs to runtime UI. After the live/static YouTube
      // thumbnail fallbacks are exhausted, use the channel avatar once; never
      // leave the browser's broken-image glyph on the card.
      if(img.dataset.youtubeLiveFinal!=="1"){
        img.dataset.youtubeLiveFinal="1";
        const avatar=String(resolvedSourceIdentity(meta)?.sourceAvatar||meta?.sourceAvatar||"").trim();
        if(avatar){
          img.src=avatar;
          return;
        }
      }
      img.removeAttribute("src");
      img.style.visibility="hidden";
      return;
    }

    const base=String(img.dataset.thumbBase||"").trim();
    if(base&&base!==img.src){
      img.dataset.thumbBase="";
      img.src=base;
    }
  },true);

  const preservedThumbNodes=new Map();
  const preservedAvatarNodes=new Map();
  const PRESERVED_IMAGE_LIMIT=120;

  function thumbPreserveKey(card,img){
    const id=String(card?.dataset?.videoId||"").trim();
    const base=String(img?.dataset?.thumbBase||"").trim();
    return id&&base?id+"|"+base:"";
  }

  function rememberRenderedThumbs(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-thumb img").forEach(img=>{
      const card=img.closest(".row[data-video-id]");
      const key=thumbPreserveKey(card,img);
      if(!key)return;
      img.remove();
      preservedThumbNodes.delete(key);
      preservedThumbNodes.set(key,img);
    });

    while(preservedThumbNodes.size>PRESERVED_IMAGE_LIMIT){
      const oldest=preservedThumbNodes.keys().next().value;
      if(!oldest)break;
      preservedThumbNodes.delete(oldest);
    }
  }

  function rememberRenderedAvatars(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-avatar-shell img.row-avatar").forEach(img=>{
      const card=img.closest(".row[data-video-id]");
      const id=String(card?.dataset?.videoId||"").trim();
      const src=String(img.getAttribute("src")||"").trim();
      const key=id&&src?id+"|"+src:"";
      if(!key)return;
      img.remove();
      preservedAvatarNodes.delete(key);
      preservedAvatarNodes.set(key,img);
    });

    while(preservedAvatarNodes.size>PRESERVED_IMAGE_LIMIT){
      const oldest=preservedAvatarNodes.keys().next().value;
      if(!oldest)break;
      preservedAvatarNodes.delete(oldest);
    }
  }

  function restoreRenderedThumbs(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-thumb img").forEach(fresh=>{
      const card=fresh.closest(".row[data-video-id]");
      const key=thumbPreserveKey(card,fresh);
      const cached=key?preservedThumbNodes.get(key):null;
      if(!(cached instanceof HTMLImageElement))return;

      // Keep the already-decoded image node when this video/package image is
      // unchanged. This avoids a decode/repaint flash when switching tabs or
      // when a package refresh repaints the same visible cards.
      cached.dataset.thumbBase=fresh.dataset.thumbBase||"";
      cached.dataset.thumbFallbackStage=fresh.dataset.thumbFallbackStage||"0";
      cached.loading=fresh.loading;
      cached.decoding=fresh.decoding;
      try{cached.fetchPriority=fresh.fetchPriority;}catch{}
      fresh.replaceWith(cached);
    });
  }

  function restoreRenderedAvatars(rows){
    rows?.querySelectorAll?.(".row[data-video-id] .row-avatar-shell img.row-avatar").forEach(fresh=>{
      const card=fresh.closest(".row[data-video-id]");
      const id=String(card?.dataset?.videoId||"").trim();
      const src=String(fresh.getAttribute("src")||"").trim();
      const key=id&&src?id+"|"+src:"";
      const cached=key?preservedAvatarNodes.get(key):null;
      if(!(cached instanceof HTMLImageElement))return;
      cached.loading=fresh.loading;
      cached.decoding=fresh.decoding;
      fresh.replaceWith(cached);
    });
  }

  function restorePreviousFeedFromChannel(){

    const snapshot=channelFeedBackStack.pop();
    feedMode=snapshot.feedMode||"package";

    feedMetas=Array.isArray(snapshot.feedMetas)?snapshot.feedMetas.slice():[];

  async function openChannelInApp(meta={}){
    const sourceId=validSourceId(meta?.sourceId);
    if(!sourceId)return false;

    const sourceName=String(meta?.sourceName||"").trim()||"Kênh";
    channelFeedBackStack.push(captureChannelFeedSnapshot());
    if(channelFeedBackStack.length>8)channelFeedBackStack.shift();

    const request=++channelFeedRequest;
    feedRequest++;
    stopYoutubeLiveDemand();
    feedMode="channel";
    channelFeedSourceId=sourceId;
    channelFeedName=sourceName;

    sourceNameChips?.querySelectorAll?.(".source-chip[data-source-tab]")
      .forEach(chip=>chip.classList.remove("active"));

    const local=uniqueSearchMetas([
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat()
    ].filter(item=>String(item?.sourceId||"").trim()===sourceId));

    feedMetas=local;
    renderSampleContent();
    syncFeedHeader();
    scrollPageToTop();

    try{
      if(!window.YT1988_API?.channel)return true;
      const payload=await window.YT1988_API.channel(sourceId);
      if(
        request!==channelFeedRequest ||
        feedMode!=="channel" ||
        channelFeedSourceId!==sourceId
      )return false;

      const fetched=collectVideoRows(payload)
        .filter(item=>String(item?.sourceId||sourceId).trim()===sourceId)
        .map(item=>{
          if(!item.sourceId)item.sourceId=sourceId;
          if(!item.sourceName)item.sourceName=sourceName;
          if(!item.sourceAvatar&&meta?.sourceAvatar)item.sourceAvatar=meta.sourceAvatar;
          return item;
        });

      feedMetas=uniqueSearchMetas([...local,...fetched]);
      renderSampleContent();
      syncFeedHeader();
      return true;
    }catch(error){
      console.warn("channel_view_failed",sourceId,error);
      return local.length>0;
    }
  }

  function feedVisualSignature(cards=[]){
    return cards.map(meta=>{
      const identity=resolvedSourceIdentity(meta);
      return [
      String(meta?.id||""),
      String(meta?.thumbnail||""),
      String(identity?.sourceAvatar||""),
      String(meta?.title||""),
      String(identity?.sourceName||meta?.sourceName||""),
      String(meta?.durationLabel||""),
      String(meta?.viewsLabel||""),
      String(meta?.publishedLabel||""),
      meta?.isLive===true?"1":"0",
      meta?.verified===true?"1":"0",
      String(meta?.provider||"youtube"),
      String(meta?.sourceSig||"")
    ].join("\u001f");
    }).join("\u001e");
  }

  function renderSampleContent(){
    if(activePlatformNav==="tiktok"&&root.classList.contains("tiktok-ui")){
      if(tiktokWorkspaceView==="watch"&&currentMeta?.provider==="tiktok"){
        renderTikTokWatchPanel(currentMeta);
      }else if(tiktokWorkspaceHandle){
        renderTikTokCreatorProfile(tiktokWorkspaceHandle);
      }
      return;
    }
    const rows=document.getElementById("rows");

    // The feed is authoritative. Never synthesize a fake card from current
    // player state when a package/search result is empty; that produced the
    // grey YouTube "..." thumbnail with source "1988".
    const cards=Array.isArray(feedMetas)?feedMetas:[];

    const activeInlineId=inlineVideoId;
    const wasFloating=!!pip && !!activeInlineId;

    // A feed render is authoritative. Never re-apply stale search text here;
    // otherwise clicking a source can load correctly but all new cards stay hidden.
    const renderLimit=feedMode==="tiktok-video"?60:18;
    const rendered=cards.slice(0,renderLimit);
    const signature=feedVisualSignature(rendered);

    // Package hashes may change while the visible first page does not. Do not
    // destroy/recreate the same DOM in that case.
    if(rows.dataset.renderSignature===signature&&rows.querySelector(".row")){
      syncFeedHeader(rows);
      const currentId=String(current?.id||"");
      rows.querySelectorAll(".row[data-video-id]").forEach(row=>{
        row.classList.toggle("selected",String(row.dataset.videoId||"")===currentId);
      });
      if(activeInlineId){
        const activeCard=rows.querySelector('.row[data-video-id="'+activeInlineId+'"]');
        if(activeCard)attachPlayerToCard(activeCard,{floating:wasFloating});
        else if(!isTwoColumn())showPlayerAsPip();
      }
      observeRowThumbQuality(rows);
      applyRenderedCardTints(rows);
      observeFeedMasonryRows();
      return;
    }

    rememberRenderedThumbs(rows);
    rememberRenderedAvatars(rows);
    rows.innerHTML=feedHeaderMarkup()+rendered.map(cardMarkup).join("");
    rows.dataset.renderSignature=signature;
    syncFeedHeader(rows);
    restoreRenderedThumbs(rows);
    restoreRenderedAvatars(rows);
    observeRowThumbQuality(rows);
    applyRenderedCardTints(rows);

    if(activeInlineId){
      const card=rows.querySelector('.row[data-video-id="'+activeInlineId+'"]');
      if(card){
        attachPlayerToCard(card,{floating:wasFloating});
      }else if(!isTwoColumn()){
        showPlayerAsPip();
      }
    }else if(!isTwoColumn()){
      const routedId=routeVideoId();
      const currentId=String(current?.id||"").trim();
      if(routedId&&currentId&&routedId===currentId){
        const card=rows.querySelector('.row[data-video-id="'+currentId+'"]');
        if(card){
          inlineVideoId=currentId;
          attachPlayerToCard(card,{floating:false});
        }
      }
    }

    primeVisibleLivePreviews();
    observeFeedMasonryRows();
  }

  function normalizedSearchQuery(value){
    return String(value||"").trim().replace(/\s+/g," ").toLocaleLowerCase("vi-VN");
  }

  function rememberRecentSearch(query,results=[]){
    const key=normalizedSearchQuery(query);
    if(!key)return;

    recentSearches=[key,...recentSearches.filter(item=>item!==key)].slice(0,2);
    try{
      localStorage.setItem(SEARCH_RECENT_KEY,JSON.stringify(recentSearches));
    }catch{}

    if(Array.isArray(results)&&results.length){
      searchCache.set(key,results.slice(0,18));
    }

    // Cache results for only the same 2 recent queries.
    for(const cachedKey of [...searchCache.keys()]){
      if(!recentSearches.includes(cachedKey))searchCache.delete(cachedKey);
    }
  }

  function uniqueSearchMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const meta of Array.isArray(items)?items:[]){
      const id=String(meta?.id||"").trim();
      if(!id||seen.has(id))continue;
      seen.add(id);
      out.push(meta);
      if(out.length>=18)break;
    }
    return out;
  }

  function localSearchMatches(query){
    const q=normalizedSearchQuery(query);
    if(!q)return [];

    // Current visible feed first, then already-downloaded packages. This is only
    // an instant first paint; the same click still launches global search.
    const pool=[
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat()
    ];

    return uniqueSearchMetas(pool.filter(meta=>{
      const hay=normalizedSearchQuery(
        (meta?.title||"")+" "+(meta?.sourceName||"")
      );
      return hay.includes(q);
    }));
  }

  function setSearchPending(active,token=0){
    if(!searchBox)return;
    if(active){
      searchBox.classList.add("search-pending");
      searchBox.setAttribute("aria-busy","true");
      return;
    }
    if(token&&token!==searchPendingSeq)return;
    searchBox.classList.remove("search-pending");
    searchBox.removeAttribute("aria-busy");
  }

  function showSearchResults(query,results=[]){
    const next=uniqueSearchMetas(results);
    if(!next.length)return false;

    feedMode="search";
    feedMetas=next;
    syncFeedHeader();
    primeMediaAspects(next,18);

    // Search results are discovery input. Render immediately, then complete
    // channel id/name/avatar in the background and persist it to the library.
    queueDiscoveredYoutubeHydration(next,"search-discovery");

    renderSampleContent();
    rememberRecentSearch(query,next);
    return true;
  }

  function showCachedSearchIfAvailable(query){
    const key=normalizedSearchQuery(query);
    if(!key)return false;

    const cached=searchCache.get(key);
    if(cached?.length)return showSearchResults(key,cached);
    return false;
  }

  async function runSearch(){
    const raw=(searchInput?.value||"").trim();
    const key=normalizedSearchQuery(raw);

    if(key)scrollPageToTop();

    if(!key){
      searchPendingSeq++;
      setSearchPending(false);
      void showPackageScope(activePackageScope);
      return;
    }

    const pendingToken=++searchPendingSeq;
    setSearchPending(true,pendingToken);

    // Exact repeat: paint the previous result immediately.
    const hadCached=showCachedSearchIfAvailable(key);

    // Otherwise paint matching content we already have in memory immediately.
    const localMatches=hadCached?[]:localSearchMatches(key);
    if(localMatches.length)showSearchResults(key,localMatches);

    // ONE user action always continues into the normal global search.
    const request=++feedRequest;
    try{
      if(!window.YT1988_API?.search)return;

      const payload=await window.YT1988_API.search(raw,"videos");
      if(request!==feedRequest)return;

      const globalResults=collectVideoRows(payload)
        .filter(meta=>meta.id&&meta.title);

      // Current-source/local matches get first positions only as a convenience;
      // global search is not restricted by the selected source.
      const merged=uniqueSearchMetas([
        ...(searchCache.get(key)||localMatches),
        ...globalResults
      ]);

      if(merged.length){
        showSearchResults(key,merged);
      }else if(!hadCached&&!localMatches.length){
        feedMode="search";
        feedMetas=[];
        renderSampleContent();
        rememberRecentSearch(key,[]);
      }
    }catch(_){
      // If instant cached/local results were already painted, keep them.
    }finally{
      setSearchPending(false,pendingToken);
    }
  }

  async function loadCurrentVideoMeta(){
    const request=++metaRequest;
    const requestedId=String(current?.id||"");
    const previousMeta=currentMeta;

    // Keep the selected card/list DOM and the provisional meta already supplied
    // by the package/search result. Rebuilding rows here caused a visible flash.
    try{
      const videoMetaApi=window.YT1988_API?.videoMeta||window.YT1988_API?.video;
      if(!videoMetaApi || !window.MediaMeta?.video){
        throw new Error("app data helpers unavailable");
      }

      // Deep-link/F5 only needs metadata here. Use the fast metadata endpoint
      // which skips slow stream probing and goes straight to oEmbed + exact-ID
      // search enrichment. Player loading continues independently.
      const payload=await videoMetaApi(requestedId);
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      const row=dataRow(payload);
      const nextMeta=cardMetaFromRow(row);
      if(!nextMeta.id)nextMeta.id=requestedId;

      // Package/search metadata may have hydrated currentMeta while this
      // request was in flight. Always merge into the newest same-video state;
      // never restore the stale snapshot captured before the request started.
      const latestBase=
        String(currentMeta?.id||"")===requestedId
          ? currentMeta
          : (previousMeta||{});
      currentMeta=mergeSelectedMeta(latestBase,nextMeta);

      const related=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.id!==requestedId)
        .slice(0,18);

      let feedChanged=false;
      if(related.length){
        relatedMetas=related;
        if(feedMode!=="search"&&feedMode!=="package"){
          feedMode="related";
          feedMetas=relatedMetas;
          feedChanged=true;
        }
      }

      renderCurrentInfo();
      applyHeaderTint(currentMeta);
      if(!currentMeta?.sourceAvatar){
        void hydrateCurrentSourceIdentity(requestedId);
      }

      // Only rebuild rows when the actual feed changed. Package/search card
      // lists remain untouched while the selected video metadata refreshes.
      if(feedChanged||!feedMetas.length)renderSampleContent();
      syncBoundaries();
    }catch(_){
      if(request!==metaRequest||String(current?.id||"")!==requestedId)return;

      // Keep any newer package/search hydration that arrived while the
      // request was in flight. Only fall back to the original snapshot when
      // there is no current metadata for this video.
      if(String(currentMeta?.id||"")!==requestedId){
        currentMeta=previousMeta;
      }
      renderCurrentInfo();
    }
  }

  function showPipUi(duration=1800){

    clearPipUiTimer();
    player.classList.add("pip-ui-visible");

  function clearMobilePipGestureGeometry(){
    clearPipUiTimer();
    pipGesture=null;
    player.classList.remove(
      "pip-ui-visible",
      "pip-gesture-active",
      "pip-docked-left",

    );
    for(const prop of ["left","right","top","bottom","width","height"]){

  function mobilePipMinWidth(ratio){
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);
    const base=ratio<1?120:170;
    return Math.max(
      1,
      Math.min(
        base,
        viewportW-20,
        (viewportH-18)*Math.max(.34,ratio)
      )
    );
  }

  const PIP_DOCK_REVEAL=34;

  function mobilePipBounds(width,height,{allowDock=false}={}){
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);
    const headerBottom=mobileHeaderHidden
      ? 0
      : Math.max(0,Math.round(top.getBoundingClientRect().bottom||0));
    const gap=10;
    const reveal=Math.max(24,Math.min(PIP_DOCK_REVEAL,width));
    return {
      minLeft:allowDock?-(width-reveal):gap,
      maxLeft:allowDock?viewportW-reveal:Math.max(gap,viewportW-width-gap),
      minTop:headerBottom+8,
      maxTop:Math.max(headerBottom+8,viewportH-height-gap),
      viewportW,
      viewportH,
      gap,
      reveal
    };
  }

  function setMobilePipRect(left,topPos,width,height,{allowDock=false}={}){
    const bounds=mobilePipBounds(width,height,{allowDock});
    const x=Math.max(bounds.minLeft,Math.min(bounds.maxLeft,left));
    const y=Math.max(bounds.minTop,Math.min(bounds.maxTop,topPos));
    player.style.setProperty("left",Math.round(x)+"px","important");
    player.style.setProperty("right","auto","important");
    player.style.setProperty("top",Math.round(y)+"px","important");
    player.style.setProperty("bottom","auto","important");
    player.style.setProperty("width",Math.round(width)+"px","important");
    player.style.setProperty("height",Math.round(height)+"px","important");
  }

  function dockMobilePip(side){
    const rect=player.getBoundingClientRect();
    if(rect.width<1||rect.height<1)return;
    const bounds=mobilePipBounds(rect.width,rect.height,{allowDock:true});
    const left=side==="left"
      ?-(rect.width-bounds.reveal)
      :bounds.viewportW-bounds.reveal;
    player.classList.toggle("pip-docked-left",side==="left");
    player.classList.toggle("pip-docked-right",side==="right");
    setMobilePipRect(left,rect.top,rect.width,rect.height,{allowDock:true});
  }

  function beginMobilePipGesture(event,mode,edge=""){
    if(!pip||isTwoColumn())return;
    const rect=player.getBoundingClientRect();
    if(rect.width<1||rect.height<1)return;

    const ratio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      rect.width/Math.max(1,rect.height);

    if(mode==="move"){
      player.classList.remove("pip-docked-left","pip-docked-right");
    }

    pipGesture={
      mode,
      edge,
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      left:rect.left,
      top:rect.top,
      width:rect.width,
      height:rect.height,
      right:rect.right,
      bottom:rect.bottom,
      ratio
    };

    showPipUi(0);
    player.classList.add("pip-gesture-active");
    try{event.currentTarget.setPointerCapture(event.pointerId)}catch{}
    event.preventDefault();
    event.stopPropagation();
  }

  function updateMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;

    const dx=event.clientX-g.startX;
    const dy=event.clientY-g.startY;

    if(g.mode==="move"){
      setMobilePipRect(g.left+dx,g.top+dy,g.width,g.height,{allowDock:true});
      event.preventDefault();
      return;
    }

    const ratio=Math.max(.34,Math.min(2.6,g.ratio||16/9));
    const minW=mobilePipMinWidth(ratio);
    const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
    const viewportH=Math.max(1,document.documentElement.clientHeight||innerHeight||1);

    const edge=String(g.edge||"");
    const fromLeft=edge.includes("left");
    const fromRight=edge.includes("right");
    const fromTop=edge.includes("top");
    const fromBottom=edge.includes("bottom");

    const widthFromX=fromLeft
      ? g.width-dx
      : fromRight
        ? g.width+dx
        : g.width;
    const widthFromY=fromTop
      ? (g.height-dy)*ratio
      : fromBottom
        ? (g.height+dy)*ratio
        : g.width;

    let nextW;
    if((fromLeft||fromRight)&&(fromTop||fromBottom)){
      // At a corner, whichever finger movement is stronger controls SIZE.
      nextW=Math.abs(dx)>=Math.abs(dy)?widthFromX:widthFromY;
    }else if(fromLeft||fromRight){
      nextW=widthFromX;
    }else{
      nextW=widthFromY;
    }

    const maxW=Math.max(
      minW,
      Math.min(viewportW-20,(viewportH-18)*ratio)
    );
    nextW=Math.max(minW,Math.min(maxW,nextW));
    const nextH=nextW/ratio;

    let nextLeft=g.left;
    let nextTop=g.top;
    if(fromLeft) nextLeft=g.right-nextW;
    if(fromTop) nextTop=g.bottom-nextH;

    setMobilePipRect(nextLeft,nextTop,nextW,nextH);
    event.preventDefault();
  }

  function endMobilePipGesture(event){
    const g=pipGesture;
    if(!g||event.pointerId!==g.pointerId)return;
    try{event.currentTarget.releasePointerCapture(event.pointerId)}catch{}

    const dx=event.clientX-g.startX;
    const rect=player.getBoundingClientRect();
    pipGesture=null;
    player.classList.remove("pip-gesture-active");

    if(g.mode==="move"&&rect.width>0&&rect.height>0){
      const viewportW=Math.max(1,document.documentElement.clientWidth||innerWidth||1);
      const intent=Math.abs(dx)>=Math.max(28,Math.min(56,g.width*.16));
      if(intent&&dx<0&&rect.left<=12){
        dockMobilePip("left");
      }else if(intent&&dx>0&&rect.right>=viewportW-12){
        dockMobilePip("right");
      }else{
        player.classList.remove("pip-docked-left","pip-docked-right");
        setMobilePipRect(rect.left,rect.top,rect.width,rect.height);
      }
    }

    showPipUi(900);
    event.preventDefault();
    event.stopPropagation();
  }

  // Full-surface activation is intentionally disabled. Safe drag zones move
  // the PiP while the center and bottom remain native YouTube controls.
  void pipActivateZone;

  for(const zone of pipDragZones){
    zone.addEventListener("pointerdown",event=>{
      beginMobilePipGesture(event,"move");
    });
  }

  pipMoveZone?.addEventListener("pointerdown",event=>{
    beginMobilePipGesture(event,"move");
  });

  for(const edge of pipResizeEdges){
    edge.addEventListener("pointerdown",event=>{
      beginMobilePipGesture(event,"resize",edge.dataset.pipEdge||"");
    });
  }

  for(const zone of [pipMoveZone,...pipDragZones,...pipResizeEdges]){
    zone?.addEventListener("pointermove",updateMobilePipGesture,{passive:false});
    zone?.addEventListener("pointerup",endMobilePipGesture,{passive:false});
    zone?.addEventListener("pointercancel",endMobilePipGesture,{passive:false});
  }

  function syncInlinePlayerOverlay(host=null){
    if(!useStableInlineOverlay())return false;
    host=host || inlineCardForCurrentVideo()?.querySelector(".row-thumb") || null;
    if(!host||!host.isConnected||!stage?.isConnected)return false;

    const rect=host.getBoundingClientRect();
    const stageRect=stage.getBoundingClientRect();

    // Relative document geometry is invariant while scrolling:
    // (hostViewport - stageViewport) cancels scrollY/scrollX exactly.
    const left=rect.left-stageRect.left;
    const topPos=rect.top-stageRect.top;
    const px=value=>(Math.round(value*1000)/1000)+"px";

    player.style.setProperty("--inline-player-left",px(left));
    player.style.setProperty("--inline-player-top",px(topPos));
