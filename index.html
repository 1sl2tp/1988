<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="1988">
  <meta name="description" content="1988 - tìm kiếm, xem video, mini-player và phát nền.">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest?v=14">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="./src/style.css?v=1988-33">
  <title>1988</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeButton" type="button" aria-label="Trang chủ">
      <span class="brand-mark">▶</span><span>1988</span>
    </button>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Tìm kiếm" aria-label="Tìm kiếm">
      <button type="submit" aria-label="Tìm"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg></button>
      <div class="suggestions" id="suggestions" hidden></div>
    </form>
    <button id="installButton" class="install-btn" type="button" aria-label="Cài ứng dụng" hidden>＋</button>
  </header>

  <section id="persistentPlayer" class="persistent-player" hidden>
    <div class="mini-toolbar">
      <div id="miniTitle" class="mini-title">1988</div>
      <button id="miniExpand" type="button" aria-label="Mở rộng">↗</button>
      <button id="miniClose" type="button" aria-label="Đóng">×</button>
    </div>
    <div class="player-aspect">
      <video id="nativeVideo" class="native-video" autoplay playsinline webkit-playsinline preload="metadata" controlslist="nodownload noremoteplayback" disablepictureinpicture></video>
      <iframe hidden id="playerFrame" title="1988 player" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
    </div>
    <div class="player-controls" id="playerControls">
      <button id="playPauseButton" type="button" aria-label="Phát hoặc tạm dừng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
      <span id="currentTimeLabel" class="time-label">0:00</span>
      <input id="seekRange" class="seek-range" type="range" min="0" max="1" value="0" step="0.1" aria-label="Tua video">
      <span id="durationLabel" class="time-label">0:00</span>
      <button id="muteButton" type="button" aria-label="Tắt hoặc bật tiếng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15 9a4 4 0 0 1 0 6M17.8 6.2a8 8 0 0 1 0 11.6"></path></svg></button>
      <input id="volumeRange" class="volume-range" type="range" min="0" max="100" value="100" step="1" aria-label="Âm lượng">
      <button id="fullscreenButton" type="button" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path></svg></button>
    </div>
  </section>

  <audio id="backgroundAudio" preload="auto" playsinline webkit-playsinline></audio>

  <main id="view" class="view" aria-live="polite">
    <div class="section-head"><h1>Dành cho bạn</h1></div>
    <div class="feed"><div class="thumb-wrap skeleton"></div></div>
  </main>

  <nav class="bottom-nav" aria-label="Điều hướng">
    <button type="button" data-nav="home"><span>⌂</span><small>Trang chủ</small></button>
    <button type="button" data-nav="trending"><span>◉</span><small>Thịnh hành</small></button>
    <button type="button" data-nav="playlists"><span>☷</span><small>Danh sách</small></button>
    <button type="button" data-nav="history"><span>◷</span><small>Đã xem</small></button>
  </nav>

  <script defer src="./src/app.js?v=1988-33"></script>
</body>
</html>
