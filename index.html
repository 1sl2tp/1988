<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="color-scheme" content="dark">
<title>1988 · Video</title>
<meta name="description" content="Giao diện xem và tìm kiếm video kiểu YouTube, dùng nguồn Piped.">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.0/dist/shaka-player.compiled.js"></script>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#0f0f0f;--panel:#181818;--panel2:#212121;--line:#303030;
  --text:#f1f1f1;--muted:#aaa;--soft:#272727;--red:#ff0033;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{min-height:100vh}
.header{
  position:sticky;top:0;z-index:50;height:58px;display:grid;
  grid-template-columns:210px minmax(260px,680px) 210px;gap:18px;
  align-items:center;padding:0 18px;background:rgba(15,15,15,.98);
  border-bottom:1px solid rgba(255,255,255,.03)
}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:-.03em}
.menu-btn,.header-icon{
  width:40px;height:40px;border:0;border-radius:50%;
  background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer
}
.menu-btn:hover,.header-icon:hover{background:#272727}
.play-logo{
  width:34px;height:24px;border-radius:7px;background:var(--red);
  display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset
}
.play-logo:after{
  content:"";display:block;margin-left:2px;border-left:10px solid #fff;
  border-top:6px solid transparent;border-bottom:6px solid transparent
}
.brand-name{font-size:18px}
.brand-name sup{font-size:8px;color:#aaa;margin-left:2px;vertical-align:top}
.search-wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 58px}
.search-input{
  height:40px;border:1px solid #303030;border-right:0;border-radius:20px 0 0 20px;
  background:#121212;color:#fff;padding:0 18px;font-size:15px;outline:none
}
.search-input:focus{border-color:#1c62b9;box-shadow:inset 1px 0 #1c62b9}
.search-button{
  height:40px;border:1px solid #303030;border-radius:0 20px 20px 0;
  background:#222;color:#fff;display:grid;place-items:center;cursor:pointer
}
.search-button:hover{background:#2a2a2a}
.search-suggest{
  position:absolute;top:46px;left:0;right:0;background:#fff;color:#0f0f0f;
  border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);overflow:hidden;display:none
}
.search-suggest.show{display:block}
.suggest-item{
  width:100%;display:flex;align-items:center;gap:11px;padding:9px 13px;border:0;
  background:#fff;color:#111;text-align:left;cursor:pointer;font-size:14px
}
.suggest-item:hover{background:#f1f1f1}
.suggest-thumb{width:58px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:#ddd}
.suggest-text{min-width:0}
.suggest-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.suggest-channel{font-size:11px;color:#666;margin-top:2px}
.header-right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:#3ea6ff;color:#001d34;font-weight:900;font-size:12px
}
.body{display:grid;grid-template-columns:224px minmax(0,1fr)}
.sidebar{
  position:sticky;top:58px;height:calc(100vh - 58px);padding:12px 12px 90px;
  overflow:auto;background:#0f0f0f
}
.nav-group{padding:4px 0 12px;border-bottom:1px solid #303030;margin-bottom:12px}
.nav-btn{
  width:100%;height:42px;border:0;border-radius:10px;background:transparent;color:#fff;
  display:flex;align-items:center;gap:22px;padding:0 14px;font-size:14px;cursor:pointer;text-align:left
}
.nav-btn:hover{background:#272727}
.nav-btn.active{background:#272727;font-weight:750}
.nav-icon{width:22px;text-align:center;font-size:18px}
.sidebar-note{color:#717171;font-size:11px;line-height:1.5;padding:5px 14px}
.main{min-width:0;padding:18px 22px 42px}
.content-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.content-title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.status{font-size:11px;color:#777}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;height:32px;border:0;border-radius:8px;padding:0 13px;
  background:#272727;color:#fff;font-size:12px;font-weight:650;cursor:pointer
}
.chip.active{background:#f1f1f1;color:#111}
.grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:28px 16px
}
.video-card{min-width:0;cursor:pointer}
.thumb-wrap{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222}
.thumb{width:100%;height:100%;object-fit:cover;display:block}
.duration{
  position:absolute;right:5px;bottom:5px;padding:2px 4px;border-radius:4px;
  background:rgba(0,0,0,.82);font-size:10px;font-weight:800
}
.video-info{display:grid;grid-template-columns:36px minmax(0,1fr);gap:9px;padding-top:10px}
.channel-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#252525}
.card-title{
  margin:0;font-size:14px;line-height:1.35;font-weight:750;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden
}
.card-meta{margin-top:5px;color:#aaa;font-size:11px;line-height:1.45}
.skeleton{background:linear-gradient(90deg,#222 25%,#2a2a2a 37%,#222 63%);background-size:400% 100%;animation:shine 1.2s infinite}
@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{
  display:grid;place-items:center;min-height:40vh;text-align:center;color:#aaa
}
.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:5px}
.watch-page{display:none}
.watch-page.show{display:block}
.browse-page.hidden{display:none}
.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
.player-wrap{min-width:0}
.player-box{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player-box video,.player-box iframe{width:100%;height:100%;display:block;background:#000;border:0}
.player-box iframe[hidden]{display:none}
.player-loading{
  position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:13px;
  background:#000
}
.player-loading[hidden]{display:none}
.watch-title{font-size:18px;font-weight:800;line-height:1.4;margin:14px 0 8px}
.watch-meta{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:14px;border-bottom:1px solid #303030
}
.channel-line{display:flex;align-items:center;gap:10px;min-width:0}
.watch-avatar{width:40px;height:40px;border-radius:50%;background:#222;object-fit:cover}
.channel-name{font-size:13px;font-weight:800}
.channel-sub{font-size:11px;color:#aaa;margin-top:2px}
.watch-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.action-btn{
  height:36px;border:0;border-radius:18px;padding:0 14px;background:#272727;color:#fff;
  font-size:12px;font-weight:750;cursor:pointer
}
.action-btn:hover{background:#333}
.description{
  margin-top:12px;padding:12px 14px;border-radius:12px;background:#272727;
  font-size:12px;line-height:1.55;color:#ddd;white-space:pre-wrap;max-height:150px;overflow:auto
}
.related{display:flex;flex-direction:column;gap:10px}
.related-card{
  display:grid;grid-template-columns:168px minmax(0,1fr);gap:9px;cursor:pointer
}
.related-thumb-wrap{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#222}
.related-thumb{width:100%;height:100%;object-fit:cover}
.related-title{
  font-size:12px;line-height:1.35;font-weight:750;display:-webkit-box;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden
}
.related-meta{font-size:10px;color:#aaa;line-height:1.45;margin-top:4px}
.back-btn{
  display:none;width:38px;height:38px;border:0;border-radius:50%;background:#272727;color:#fff;
  place-items:center;cursor:pointer;margin-bottom:10px
}
.mobile-nav{display:none}
.error-banner{
  display:none;margin-bottom:14px;padding:11px 13px;border-radius:10px;
  background:#3a1717;color:#ffb4b4;font-size:12px
}
.error-banner.show{display:block}
@media(max-width:1180px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .watch-layout{grid-template-columns:minmax(0,1fr) 320px}
}
@media(max-width:980px){
  .header{grid-template-columns:170px minmax(220px,1fr) 80px}
  .body{grid-template-columns:74px minmax(0,1fr)}
  .sidebar{padding:10px 5px}
  .nav-btn{height:58px;flex-direction:column;justify-content:center;gap:2px;padding:0;font-size:9px}
  .nav-icon{font-size:18px}
  .sidebar-note{display:none}
  .watch-layout{grid-template-columns:1fr}
  .related{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .related-card{grid-template-columns:150px minmax(0,1fr)}
}
@media(max-width:760px){
  .header{
    position:sticky;height:auto;min-height:54px;grid-template-columns:1fr auto;
    grid-template-areas:"brand right" "search search";padding:8px 10px 10px;gap:8px
  }
  .brand{grid-area:brand}
  .menu-btn{display:none}
  .header-right{grid-area:right}
  .search-wrap{grid-area:search}
  .body{display:block}
  .sidebar{display:none}
  .main{padding:12px 10px 80px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
  .video-info{grid-template-columns:30px minmax(0,1fr);gap:7px}
  .channel-avatar{width:30px;height:30px}
  .card-title{font-size:12px}
  .card-meta{font-size:10px}
  .thumb-wrap{border-radius:8px}
  .watch-layout{display:block}
  .player-box{border-radius:0;margin:0 -10px}
  .watch-title{font-size:16px}
  .watch-meta{align-items:flex-start;flex-direction:column}
  .watch-actions{width:100%;justify-content:flex-start;overflow:auto;flex-wrap:nowrap}
  .action-btn{flex:0 0 auto}
  .related{display:flex;margin-top:18px}
  .related-card{grid-template-columns:168px minmax(0,1fr)}
  .back-btn{display:grid}
  .mobile-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:60;height:62px;
    display:grid;grid-template-columns:repeat(3,1fr);background:rgba(15,15,15,.97);
    border-top:1px solid #282828;padding-bottom:env(safe-area-inset-bottom)
  }
  .mobile-nav button{
    border:0;background:transparent;color:#ddd;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:2px;font-size:9px
  }
  .mobile-nav span:first-child{font-size:18px}
}
@media(max-width:440px){
  .grid{grid-template-columns:1fr}
  .video-card{margin:0 -10px}
  .video-info{padding:9px 10px 0}
  .thumb-wrap{border-radius:0}
  .content-head,.chips{margin-left:0;margin-right:0}
  .related-card{grid-template-columns:150px minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <div class="play-logo" aria-hidden="true"></div>
      <div class="brand-name">1988<sup>VN</sup></div>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="search" placeholder="Tìm kiếm" autocomplete="off" aria-label="Tìm kiếm video">
      <button class="search-button" id="searchButton" type="button" aria-label="Tìm kiếm">⌕</button>
      <div class="search-suggest" id="searchSuggest"></div>
    </div>

    <div class="header-right">
      <button class="header-icon" id="reloadSource" type="button" title="Đổi nguồn" aria-label="Đổi nguồn">↻</button>
      <div class="avatar">88</div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="nav-group">
        <button class="nav-btn active" data-nav="home" type="button"><span class="nav-icon">⌂</span><span>Trang chủ</span></button>
        <button class="nav-btn" data-nav="trending" type="button"><span class="nav-icon">◉</span><span>Thịnh hành</span></button>
        <button class="nav-btn" data-nav="history" type="button"><span class="nav-icon">◷</span><span>Đã xem</span></button>
      </div>
      <div class="sidebar-note">1988 không chèn quảng cáo riêng. Video và tìm kiếm dùng nguồn Piped.</div>
    </aside>

    <main class="main">
      <div class="error-banner" id="errorBanner"></div>

      <section class="browse-page" id="browsePage">
        <div class="content-head">
          <div class="content-title" id="contentTitle">Đề xuất</div>
          <div class="status" id="sourceStatus"></div>
        </div>
        <div class="chips" id="chips">
          <button class="chip active" data-chip="Tất cả" type="button">Tất cả</button>
          <button class="chip" data-chip="Âm nhạc" type="button">Âm nhạc</button>
          <button class="chip" data-chip="Tin tức" type="button">Tin tức</button>
          <button class="chip" data-chip="Bóng đá" type="button">Bóng đá</button>
          <button class="chip" data-chip="Công nghệ" type="button">Công nghệ</button>
          <button class="chip" data-chip="Hài" type="button">Hài</button>
          <button class="chip" data-chip="Phim" type="button">Phim</button>
        </div>
        <div class="grid" id="videoGrid"></div>
      </section>

      <section class="watch-page" id="watchPage">
        <button class="back-btn" id="backBtn" type="button" aria-label="Quay lại">←</button>
        <div class="watch-layout">
          <div class="player-wrap">
            <div class="player-box" id="playerBox">
              <video id="videoPlayer" controls playsinline preload="metadata"></video>
              <iframe id="fallbackPlayer" title="Video player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen hidden></iframe>
              <div class="player-loading" id="playerLoading">Đang tải video…</div>
            </div>
            <div class="watch-title" id="watchTitle"></div>
            <div class="watch-meta">
              <div class="channel-line">
                <img class="watch-avatar" id="watchAvatar" alt="">
                <div>
                  <div class="channel-name" id="watchChannel"></div>
                  <div class="channel-sub" id="watchStats"></div>
                </div>
              </div>
              <div class="watch-actions">
                <button class="action-btn" id="shareBtn" type="button">Chia sẻ</button>
                <button class="action-btn" id="retryBtn" type="button">Đổi nguồn</button>
                <button class="action-btn" id="officialBtn" type="button">YouTube</button>
              </div>
            </div>
            <div class="description" id="watchDescription"></div>
          </div>
          <aside>
            <div class="related" id="relatedList"></div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav">
    <button data-nav="home" type="button"><span>⌂</span><span>Trang chủ</span></button>
    <button data-nav="trending" type="button"><span>◉</span><span>Thịnh hành</span></button>
    <button data-nav="history" type="button"><span>◷</span><span>Đã xem</span></button>
  </nav>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const APIS=[
  'https://pipedapi.kavin.rocks',
  'https://pipedapi.leptons.xyz',
  'https://pipedapi.nosebs.ru',
  'https://pipedapi-libre.kavin.rocks',
  'https://piped-api.privacy.com.de',
  'https://pipedapi.adminforge.de',
  'https://api.piped.yt',
  'https://pipedapi.drgns.space',
  'https://pipedapi.owo.si',
  'https://pipedapi.ducks.party',
  'https://piped-api.codespace.cz',
  'https://pipedapi.reallyaweso.me',
  'https://api.piped.private.coffee',
  'https://pipedapi.darkness.services',
  'https://pipedapi.orangenet.cc'
];
const HISTORY_KEY='1988.youtube.history.v2';
const API_CACHE_KEY='1988.piped.fast-api.v1';
const API_CACHE_MS=20*60*1000;

const searchInput=$('searchInput');
const searchButton=$('searchButton');
const searchSuggest=$('searchSuggest');
const grid=$('videoGrid');
const contentTitle=$('contentTitle');
const sourceStatus=$('sourceStatus');
const errorBanner=$('errorBanner');
const browsePage=$('browsePage');
const watchPage=$('watchPage');
const videoPlayer=$('videoPlayer');
const fallbackPlayer=$('fallbackPlayer');
const playerLoading=$('playerLoading');
const watchTitle=$('watchTitle');
const watchAvatar=$('watchAvatar');
const watchChannel=$('watchChannel');
const watchStats=$('watchStats');
const watchDescription=$('watchDescription');
const relatedList=$('relatedList');
const backBtn=$('backBtn');
const shareBtn=$('shareBtn');
const retryBtn=$('retryBtn');
const officialBtn=$('officialBtn');
const reloadSource=$('reloadSource');

let apiIndex=0;
let activeApi='';
let apiPicker=null;
let currentVideoId='';
let currentVideoInfo=null;
let shakaPlayer=null;
let dashBlobUrl='';
let suggestController=null;
let lastBrowse={type:'home',query:''};

function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function formatViews(value){
  const n=Number(value)||0;
  if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace('.0','')+' tỷ lượt xem';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+' Tr lượt xem';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace('.0','')+' N lượt xem';
  return n.toLocaleString('vi-VN')+' lượt xem';
}
function duration(seconds){
  const s=Math.max(0,Number(seconds)||0);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=Math.floor(s%60);
  return h? [h,String(m).padStart(2,'0'),String(sec).padStart(2,'0')].join(':')
          : [m,String(sec).padStart(2,'0')].join(':');
}
function ago(uploaded,uploadedDate=''){
  if(uploadedDate)return String(uploadedDate)
    .replace('seconds ago','giây trước').replace('minutes ago','phút trước')
    .replace('hours ago','giờ trước').replace('days ago','ngày trước')
    .replace('weeks ago','tuần trước').replace('months ago','tháng trước')
    .replace('years ago','năm trước')
    .replace('second ago','giây trước').replace('minute ago','phút trước')
    .replace('hour ago','giờ trước').replace('day ago','ngày trước')
    .replace('week ago','tuần trước').replace('month ago','tháng trước')
    .replace('year ago','năm trước');
  let ts=Number(uploaded)||0;
  if(!ts)return '';
  if(ts<1e12)ts*=1000;
  const diff=Math.max(0,Date.now()-ts);
  const d=Math.floor(diff/86400000);
  if(d<1)return 'hôm nay';
  if(d<7)return d+' ngày trước';
  if(d<30)return Math.floor(d/7)+' tuần trước';
  if(d<365)return Math.floor(d/30)+' tháng trước';
  return Math.floor(d/365)+' năm trước';
}
function idFromUrl(value=''){
  const m=String(value).match(/[?&]v=([A-Za-z0-9_-]{11})|\/watch\?v=([A-Za-z0-9_-]{11})|\/shorts\/([A-Za-z0-9_-]{11})|youtu\.be\/([A-Za-z0-9_-]{11})/);
  if(m)return m.slice(1).find(Boolean)||'';
  const exact=String(value).trim();
  return /^[A-Za-z0-9_-]{11}$/.test(exact)?exact:'';
}
function idFromItem(row={}){
  return idFromUrl(row.url||row.videoId||'');
}
function setError(message=''){
  errorBanner.textContent=message;
  errorBanner.classList.toggle('show',Boolean(message));
}
function setSourceLabel(){
  try{
    const u=new URL(activeApi||APIS[apiIndex]||APIS[0]);
    sourceStatus.textContent='Nguồn: '+u.hostname.replace(/^pipedapi\./,'');
  }catch{sourceStatus.textContent='';}
}
function readCachedApi(){
  try{
    const row=JSON.parse(localStorage.getItem(API_CACHE_KEY)||'null');
    if(row?.url&&APIS.includes(row.url)&&Date.now()-Number(row.at||0)<API_CACHE_MS)return row.url;
  }catch{}
  return '';
}
function rememberApi(base){
  activeApi=base;
  apiIndex=Math.max(0,APIS.indexOf(base));
  try{localStorage.setItem(API_CACHE_KEY,JSON.stringify({url:base,at:Date.now()}))}catch{}
  setSourceLabel();
}
async function requestJson(base,path,{signal,timeoutMs=4200}={}){
  const controller=new AbortController();
  const abort=()=>controller.abort();
  if(signal){
    if(signal.aborted)throw new DOMException('Aborted','AbortError');
    signal.addEventListener('abort',abort,{once:true});
  }
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(base+path,{
      signal:controller.signal,
      cache:'no-store',
      mode:'cors',
      credentials:'omit',
      headers:{accept:'application/json'}
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }finally{
    clearTimeout(timer);
    if(signal)signal.removeEventListener('abort',abort);
  }
}
async function pickFastApi({force=false,exclude=''}={}){
  if(!force){
    if(activeApi&&activeApi!==exclude)return activeApi;
    const cached=readCachedApi();
    if(cached&&cached!==exclude){rememberApi(cached);return cached;}
  }
  if(apiPicker&&!force)return apiPicker;
  const candidates=APIS.filter(x=>x!==exclude);
  const run=async()=>{
    for(let i=0;i<candidates.length;i+=5){
      const group=candidates.slice(i,i+5);
      try{
        const winner=await Promise.any(group.map(async base=>{
          await requestJson(base,'/config',{timeoutMs:1800});
          return base;
        }));
        rememberApi(winner);
        return winner;
      }catch{}
    }
    throw new Error('Không có máy chủ Piped khả dụng');
  };
  apiPicker=run().finally(()=>{apiPicker=null});
  return apiPicker;
}
async function api(path,{signal}={}){
  let base=await pickFastApi();
  try{
    return await requestJson(base,path,{signal,timeoutMs:5000});
  }catch(firstError){
    if(signal?.aborted)throw firstError;
    try{localStorage.removeItem(API_CACHE_KEY)}catch{}
    activeApi='';
    base=await pickFastApi({force:true,exclude:base});
    return await requestJson(base,path,{signal,timeoutMs:5000});
  }
}

async function doSearch(query){
  const q=String(query||'').trim();
  if(!q){loadHome();return;}
  setError('');
  lastBrowse={type:'search',query:q};
  contentTitle.textContent='Kết quả cho “'+q+'”';
  searchInput.value=q;
  searchSuggest.classList.remove('show');
  skeleton();
  showBrowse();
  const u=new URL(location.href);
  u.searchParams.delete('v');
  u.searchParams.set('q',q);
  window.history.replaceState({view:'search'},'',u);
  try{
    const data=await api('/search?q='+encodeURIComponent(q)+'&filter=videos');
    renderVideos(data?.items||[]);
  }catch(error){
    console.warn('search failed',error);
    setError('Nguồn tìm kiếm hiện không phản hồi. Hệ thống đã thử toàn bộ máy chủ Piped; bấm Đổi nguồn để thử lại.');
    renderVideos([]);
  }
}
async function suggest(query){
  const q=String(query||'').trim();
  if(q.length<2){searchSuggest.classList.remove('show');return;}
  suggestController?.abort();
  suggestController=new AbortController();
  try{
    const data=await api('/suggestions?query='+encodeURIComponent(q),{signal:suggestController.signal});
    const rows=(Array.isArray(data)?(Array.isArray(data[1])?data[1]:data):[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,8);
    if(!rows.length){searchSuggest.classList.remove('show');return;}
    searchSuggest.innerHTML=rows.map(text=>`
      <button class="suggest-item" type="button" data-query="${escapeHtml(text)}">
        <span class="suggest-text">
          <span class="suggest-title">${escapeHtml(text)}</span>
        </span>
      </button>`).join('');
    searchSuggest.classList.add('show');
  }catch(err){
    if(!suggestController?.signal.aborted)searchSuggest.classList.remove('show');
  }
}

async function destroyPlayer(){
  clearTimeout(destroyPlayer.timer);
  if(shakaPlayer){
    try{await shakaPlayer.destroy()}catch{}
    shakaPlayer=null;
  }
  if(dashBlobUrl){
    try{URL.revokeObjectURL(dashBlobUrl)}catch{}
    dashBlobUrl='';
  }
  try{videoPlayer.pause()}catch{}
  videoPlayer.removeAttribute('src');
  videoPlayer.load();
  videoPlayer.hidden=false;
  fallbackPlayer.hidden=true;
  fallbackPlayer.removeAttribute('src');
}
function xmlEscape(value=''){
  return String(value).replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
  })[ch]);
}
function dashRepresentation(stream={},isVideo=false){
  const attrs=[
    'id="'+xmlEscape(stream.itag||Math.random().toString(36).slice(2))+'"',
    'codecs="'+xmlEscape(stream.codec||'')+'"',
    'bandwidth="'+Math.max(1,Number(stream.bitrate)||1)+'"'
  ];
  if(isVideo){
    if(stream.width)attrs.push('width="'+Number(stream.width)+'"');
    if(stream.height)attrs.push('height="'+Number(stream.height)+'"');
    if(stream.fps)attrs.push('frameRate="'+Number(stream.fps)+'"');
  }
  const rangeOk=[stream.indexStart,stream.indexEnd,stream.initStart,stream.initEnd].every(v=>Number.isFinite(Number(v)));
  const segment=rangeOk
    ? '<SegmentBase indexRange="'+Number(stream.indexStart)+'-'+Number(stream.indexEnd)+'"><Initialization range="'+Number(stream.initStart)+'-'+Number(stream.initEnd)+'"/></SegmentBase>'
    : '';
  const audio=isVideo?'':'<AudioChannelConfiguration schemeIdUri="urn:mpeg:dash:23003:3:audio_channel_configuration:2011" value="2"/>';
  return '<Representation '+attrs.join(' ')+'>'+audio+'<BaseURL>'+xmlEscape(stream.url||'')+'</BaseURL>'+segment+'</Representation>';
}
function generatedDash(info={}){
  const all=[...(info.audioStreams||[]),...(info.videoStreams||[])].filter(s=>s?.url&&s?.mimeType);
  const audio=all.filter(s=>String(s.mimeType).includes('audio'));
  const video=all.filter(s=>String(s.mimeType).includes('video')&&s.videoOnly!==false);
  if(!audio.length||!video.length)return '';
  const groups=new Map();
  for(const s of [...video,...audio]){
    const isVideo=String(s.mimeType).includes('video');
    const key=(isVideo?'v':'a')+'|'+String(s.audioTrackId||'')+'|'+String(s.mimeType);
    if(!groups.has(key))groups.set(key,{isVideo,mime:s.mimeType,track:s.audioTrackId||'',rows:[]});
    groups.get(key).rows.push(s);
  }
  let sets='';
  for(const g of groups.values()){
    const attrs=['mimeType="'+xmlEscape(g.mime)+'"','startWithSAP="1"','subsegmentAlignment="true"'];
    if(g.isVideo)attrs.push('scanType="progressive"');
    else{
      if(g.track)attrs.push('id="'+xmlEscape(g.track)+'"');
      if(g.track)attrs.push('lang="'+xmlEscape(String(g.track).slice(0,2))+'"');
    }
    sets+='<AdaptationSet '+attrs.join(' ')+'>'+g.rows.map(s=>dashRepresentation(s,g.isVideo)).join('')+'</AdaptationSet>';
  }
  return '<?xml version="1.0" encoding="utf-8"?><MPD xmlns="urn:mpeg:dash:schema:mpd:2011" profiles="urn:mpeg:dash:profile:full:2011" minBufferTime="PT1.5S" type="static" mediaPresentationDuration="PT'+Math.max(1,Number(info.duration)||1)+'S"><Period>'+sets+'</Period></MPD>';
}
function bestProgressive(info={}){
  return (info.videoStreams||[])
    .filter(s=>s?.url&&!s.videoOnly)
    .sort((a,b)=>(Number(b.height)||0)-(Number(a.height)||0))[0]||null;
}
function proxifyShakaRequests(player,proxyUrl=''){
  if(!proxyUrl)return;
  let proxy;
  try{
    proxy=new URL(proxyUrl);
    if(proxy.pathname.endsWith('/'))proxy.pathname=proxy.pathname.slice(0,-1);
  }catch{return}
  player.getNetworkingEngine()?.registerRequestFilter((_type,request)=>{
    try{
      const uri=request.uris?.[0];
      if(!uri)return;
      const url=new URL(uri);
      if(url.host.endsWith('.googlevideo.com')){
        url.searchParams.set('host',url.host);
        url.protocol=proxy.protocol;
        url.host=proxy.host;
        url.pathname=proxy.pathname+url.pathname;
        if(request.headers?.Range){
          url.searchParams.set('range',String(request.headers.Range).split('=')[1]||'');
          request.headers={};
        }
        request.uris[0]=url.toString();
      }
    }catch{}
  });
}
async function showPipedEmbed(id){
  await destroyPlayer();
  videoPlayer.hidden=true;
  fallbackPlayer.hidden=false;
  fallbackPlayer.src='https://piped.video/embed/'+encodeURIComponent(id)+'?autoplay=1';
  playerLoading.hidden=true;
}
async function startStream(info={},id=currentVideoId){
  await destroyPlayer();
  playerLoading.hidden=false;
  if(!window.shaka?.Player)throw new Error('Shaka chưa tải');
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported())throw new Error('Trình duyệt không hỗ trợ Shaka');
  shakaPlayer=new shaka.Player();
  await shakaPlayer.attach(videoPlayer);
  shakaPlayer.configure({
    abr:{enabled:true},
    streaming:{
      bufferingGoal:10,
      bufferBehind:120,
      retryParameters:{maxAttempts:4,baseDelay:300,backoffFactor:1.5}
    }
  });
  proxifyShakaRequests(shakaPlayer,info.proxyUrl||'');

  let uri='';
  let mime='';
  if(info.livestream&&info.hls){
    uri=String(info.hls);
    mime='application/x-mpegURL';
  }else if(info.dash){
    try{
      const u=new URL(info.dash);
      u.searchParams.set('rewrite','false');
      uri=u.toString();
    }catch{uri=String(info.dash)}
    mime='application/dash+xml';
  }else{
    const dash=generatedDash(info);
    if(dash){
      dashBlobUrl=URL.createObjectURL(new Blob([dash],{type:'application/dash+xml'}));
      uri=dashBlobUrl;
      mime='application/dash+xml';
    }else if(info.hls){
      uri=String(info.hls);
      mime='application/x-mpegURL';
    }else{
      const progressive=bestProgressive(info);
      if(progressive?.url){
        uri=progressive.url;
        mime=progressive.mimeType||'video/mp4';
      }
    }
  }
  if(!uri)throw new Error('Không có luồng phát tương thích');

  const failTimer=setTimeout(()=>{
    if(videoPlayer.readyState<2&&currentVideoId===id)void showPipedEmbed(id);
  },5500);
  destroyPlayer.timer=failTimer;
  shakaPlayer.addEventListener('error',event=>{
    console.warn('shaka error',event?.detail);
    if(currentVideoId===id)void showPipedEmbed(id);
  });
  await shakaPlayer.load(uri,null,mime);
  clearTimeout(failTimer);
  playerLoading.hidden=true;
  await videoPlayer.play().catch(()=>{});
}

  const id=idFromItem(row);

  return `

async function openVideo(id,{push=true}={}){
  if(!/^[A-Za-z0-9_-]{11}$/.test(id||''))return;
  setError('');
  currentVideoId=id;
  showWatch();
  watchTitle.textContent='Đang tải…';
  watchChannel.textContent='';
  watchStats.textContent='';
  watchDescription.textContent='';
  relatedList.innerHTML=Array.from({length:6},()=>'<div class="related-card"><div class="related-thumb-wrap skeleton"></div><div><div class="skeleton" style="height:12px;border-radius:4px;margin-bottom:8px"></div><div class="skeleton" style="height:10px;width:65%;border-radius:4px"></div></div></div>').join('');
  playerLoading.hidden=false;

  if(push){
    const u=new URL(location.href);
    u.searchParams.delete('q');
    u.searchParams.set('v',id);
    window.history.pushState({view:'watch',id},'',u);
  }
  try{
    const info=await api('/streams/'+encodeURIComponent(id));
    currentVideoInfo=info;
    watchTitle.textContent=info.title||'Video';
    watchAvatar.src=info.uploaderAvatar||'';
    watchChannel.textContent=info.uploader||'';
    watchStats.textContent=[formatViews(info.views),info.uploadDate||''].filter(Boolean).join(' · ');
    watchDescription.textContent=info.description||'';
    relatedList.innerHTML=(info.relatedStreams||[]).slice(0,14).map(relatedCard).join('');
    addHistory(info,id);
    await startStream(info,id);
    document.title=(info.title||'Video')+' · 1988';
  }catch(err){
    console.warn('open video failed',err);
    watchTitle.textContent=watchTitle.textContent==='Đang tải…'?'Video '+id:watchTitle.textContent;
    watchDescription.textContent=watchDescription.textContent||'Đang chuyển sang player Piped dự phòng.';
    setError('Nguồn stream trực tiếp lỗi, đã chuyển sang player Piped dự phòng.');
    await showPipedEmbed(id);
  }
}
function nav(type){
  document.querySelectorAll('[data-nav]').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===type));
  if(type==='trending')loadTrending();
  else if(type==='history')loadHistory();

}
function retryCurrent(){
  try{localStorage.removeItem(API_CACHE_KEY)}catch{}
  activeApi='';
  apiPicker=null;
  if(currentVideoId)openVideo(currentVideoId,{push:false});
  else if(lastBrowse.type==='search')doSearch(lastBrowse.query);
  else if(lastBrowse.type==='history')loadHistory();
  else if(lastBrowse.type==='trending')loadTrending();
  else loadHome();
}
