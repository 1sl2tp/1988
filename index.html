<title>1988</title>
<script>
(()=>{
  try{
    const theme=localStorage.getItem("yt1988-theme-v1");
    if(theme==="light"||theme==="dark"){
      document.documentElement.dataset.theme=theme;
      document.documentElement.style.colorScheme=theme;
      const meta=document.getElementById("themeColorMeta");
      if(meta)meta.setAttribute("content",theme==="light"?"#ffffff":"#212121");
    }
  }catch{}
})();
</script>

/* One media core, one permanent DOM home.
   MAIN 2-column (.stage) remains the player's real parent at all times.
   In one-column/mobile the media column is parked off-screen but stays rendered,
   so the YouTube iframe remains alive/ready. Inline and PiP are only CSS views
   of that same player; the iframe is never reparented while playing. */
@media(max-width:999px){
  .media-col{
    display:block!important;
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:0!important;
    height:0!important;
    max-width:none!important;
    margin:0!important;
    overflow:visible!important;
    z-index:auto!important;
    isolation:auto!important;
    contain:none!important;
    pointer-events:none!important;
  }

  /* Mobile/1-column keeps only the player anchor in media-col.
     The metadata for the playing video is already represented by the inline
     card itself. If .info remains visible inside this zero-size/overflow-visible
     anchor, its avatar can leak above the first feed card as a stray logo. */
  .media-col > .info{
    display:none!important;
  }

  /* Keep the permanent player home inside the real page/compositor.
     Parking the parent at -10000px made Safari/PWA keep audio alive while
     the hardware video layer stayed clipped/black. The zero-size anchor is
     layout-neutral but still on-screen, and children can overflow from it. */
  .media-col > .stage{
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:0!important;
    height:0!important;
    aspect-ratio:auto!important;
    overflow:visible!important;
    background:transparent!important;
  }
}

/* One-column inline playback is document-anchored to the selected thumbnail.
   The player stays in its permanent stage DOM home, but its absolute coordinates
   are stored relative to that stage. Both stage and thumbnail scroll together,
   so no per-scroll geometry write is needed. */
@media(max-width:999px){
  html.one-col .stage.pip-host{
    width:0!important;
    height:0!important;
    aspect-ratio:auto!important;
    overflow:visible!important;
  }
}

html.one-col .player.inline-overlay:not(.pip){
  /* INLINE follows the document/card natively.
     Never chase scroll with position:fixed + getBoundingClientRect(). */
  position:absolute!important;
  inset:auto!important;
  left:var(--inline-player-left)!important;
  top:var(--inline-player-top)!important;
  width:var(--inline-player-w)!important;
  height:var(--inline-player-h)!important;
  z-index:40!important;
  opacity:1!important;
  pointer-events:auto!important;
  border-radius:var(--floating-radius)!important;
  overflow:hidden!important;
  transform:none!important;
  will-change:auto!important;
}

/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
/* MAIN 1 cột:
   ngang chạm mép = vuông;
   dọc là một media card độc lập = bo thống nhất với PiP / 2 cột. */
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  border-radius:0;
  background:transparent;
}

html.one-col.portrait .stage,
html.one-col.portrait .player,
html.one-col.portrait .player iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}
html.one-col.portrait .stage,
html.one-col.portrait .player{
  overflow:hidden;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);
}

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  width:min(100%,calc(var(--current-full-h) * var(--media-ratio)));
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.portrait .player{
  inset:0;
  width:100%;
  height:100%;
  transform:none;
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:2147483000!important;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:auto !important;
  bottom:calc(10px + env(safe-area-inset-bottom,0px)) !important;
  pointer-events:auto!important;
  border-radius:var(--floating-radius);
  background:transparent;
  box-shadow:var(--yt-floating-shadow);
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w);
  height:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col.portrait .player.pip{
  height:var(--pip-portrait-h);
  width:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col .player.pip iframe{border-radius:inherit}

/* PiP interaction in every 1-column layout (mobile + PC).
   Drag almost anywhere on the picture; keep the center play/pause zone and the
   bottom YouTube seek/controls band untouched. Resize still uses the edges. */
.pip-activate-zone,
.pip-drag-zone,
.pip-move-zone,
.pip-resize-edge{display:none}

/* The old full-surface activation layer intercepted YouTube controls.
   Keep it disabled: native play/pause/seek must remain directly clickable. */
html.one-col .player.pip .pip-activate-zone{
  display:none!important;
}

html.one-col .player.pip .pip-drag-zone{
  display:block;
  position:absolute;
  z-index:8;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  background:transparent;
}
html.one-col .player.pip .pip-drag-zone:active{cursor:grabbing}

/* Four transparent move regions leave a center box for the large play/pause
   control and the bottom 44px for native seek/volume/fullscreen controls. */
html.one-col .player.pip .pip-drag-top{
  left:0; right:0; top:0; height:33%;
}
html.one-col .player.pip .pip-drag-left{
  left:0; top:33%; bottom:33%; width:33%;
}
html.one-col .player.pip .pip-drag-right{
  right:0; top:33%; bottom:33%; width:33%;
}
html.one-col .player.pip .pip-drag-lower{
  left:0; right:0; top:67%; bottom:44px;
}

/* Smoothly snap into/out of a screen edge after the finger is released. */
html.one-col .player.pip:not(.pip-gesture-active){
  transition:left .18s cubic-bezier(.2,0,0,1),
             top .18s cubic-bezier(.2,0,0,1);
}

/* While docked only a small grab strip remains visible. Do not let an edge
   resize zone steal the gesture used to pull the PiP back on-screen. */
html.one-col .player.pip.pip-docked-left .pip-resize-edge,
html.one-col .player.pip.pip-docked-right .pip-resize-edge{
  pointer-events:none!important;
}

html.one-col .player.pip .pip-move-zone{
  display:block;
  position:absolute;
  z-index:11;
  top:0;
  left:50%;
  width:68px;
  height:32px;
  transform:translateX(-50%);
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s ease;
}
html.one-col .player.pip.pip-ui-visible .pip-move-zone,
html.one-col .player.pip.pip-gesture-active .pip-move-zone{
  opacity:1;
  pointer-events:auto;
}
html.one-col .player.pip .pip-move-zone:active{cursor:grabbing}
html.one-col .player.pip .pip-move-zone::after{
  content:"";
  position:absolute;
  left:50%;
  top:7px;
  width:32px;
  height:4px;
  transform:translateX(-50%);
  border-radius:999px;
  background:rgba(255,255,255,.94);
  box-shadow:0 1px 3px rgba(0,0,0,.45);
  pointer-events:none;
}

/* Invisible resize hit-zones. Bottom 36px is reserved for native YouTube seek/controls. */
html.one-col .player.pip .pip-resize-edge{
  display:block;
  position:absolute;
  z-index:10;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  background:transparent;
}
html.one-col .player.pip .pip-resize-left{
  left:0; top:0; bottom:36px; width:26px;
  cursor:ew-resize;
}
html.one-col .player.pip .pip-resize-right{
  right:0; top:0; bottom:36px; width:26px;
  cursor:ew-resize;
}
html.one-col .player.pip .pip-resize-top{
  left:0; right:0; top:0; height:26px;
  cursor:ns-resize;
}

/* Exact corners get their own generous invisible hit boxes. */
html.one-col .player.pip .pip-resize-corner{
  z-index:12;
  width:38px;
  height:38px;
}
html.one-col .player.pip .pip-resize-top-left{
  left:0; top:0;
  cursor:nwse-resize;
}
html.one-col .player.pip .pip-resize-top-right{
  right:0; top:0;
  cursor:nesw-resize;
}

/* The center of the top edge belongs to MOVE, not resize. */
html.one-col .player.pip.pip-ui-visible .pip-resize-top{
  clip-path:polygon(0 0,calc(50% - 38px) 0,calc(50% - 38px) 100%,0 100%,0 0,
                    100% 0,100% 100%,calc(50% + 38px) 100%,calc(50% + 38px) 0,100% 0);
}

@media(min-width:1000px){
  html.two-col,

    gap:var(--layout-gap);
    align-items:start;
    margin:0;
    padding:0 var(--feed-edge-gap);
  }

  /* No selected video on desktop: do not pin an empty YouTube MAIN.
     Feed owns the full width until a real video id is selected. */
  html.two-col.media-empty main{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"feed";
    gap:0;
  }
  html.two-col.media-empty .media-col{

  }

    padding-top:20px;
  }
  html.two-col.media-empty .feed-head{
    display:none!important;
  }

  html.two-col .rows{
    grid-area:feed;
    min-width:0;
    /* Feed header sits at 8px. First card outer halo starts 8px below it. */
    padding:60px 0 0;
    grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
    column-gap:var(--card-gap-x);
    row-gap:var(--card-gap-y);
  }

  html.two-col .feed-head{
    position:absolute;
    z-index:8;
    top:8px;
    left:0;
    right:0;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    min-width:0;
  }

  /* The generic 8px row cap is useful in one-column feeds, but in two-column
     mode it sat directly above the feed header and became a visible dark seam
     once the page gained video-derived ambient color. Let the page ambient
     continue through that 8px strip instead of painting a separate yt-bg bar. */
  html.two-col .rows::before{
    background:transparent;
  }

  html.two-col .media-col{
    grid-area:media;
    position:sticky;
    top:calc(var(--top-boundary) + 8px);
    align-self:start;
    height:var(--current-full-h);
    justify-self:start;
    min-width:0;
    margin-top:8px;
    margin-right:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     Column width is derived from CURRENT HEIGHT × 16/9 (capped only to preserve the feed). The iframe fills the current-height viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:var(--two-col-media-w);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:var(--landscape-player-h);
    border-radius:var(--floating-radius);
    background:#000;
    overflow:hidden;
  }
  html.two-col.landscape .player,
  html.two-col.landscape .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:#000;
  }

  /* 2-col portrait:
     Column width is derived from CURRENT HEIGHT × 9/16, so there is no wasted side space. */
  html.two-col.portrait .media-col{
    width:var(--two-col-media-w);
    height:var(--current-full-h);
  }
  html.two-col.portrait .stage{
    width:100%;
    height:auto;
    aspect-ratio:var(--media-ratio);
    border-radius:var(--floating-radius);
    background:transparent;
    overflow:hidden;
  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;
  }

/* Keep the visual top gap exact.

   Rows start at 20px = 8px desired gap + 12px halo, so the OUTER card
   background aligns with the media column's 8px top gap. */
.rows::before{
  content:"";
  position:absolute;
  z-index:3;
  top:0;
  left:0;
  right:0;
  height:8px;
  background:
    linear-gradient(
      90deg,
      rgba(var(--header-accent-rgb),var(--ambient-page-right)),

  container-name:media-card;
  min-width:0;
  background:transparent;
  overflow:visible;
  color:var(--yt-text-secondary);
  cursor:pointer;
  border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.row::before{
  content:"";
  position:absolute;
  inset:-12px;
  z-index:0;
  pointer-events:none;
  /* 12px thumbnail radius + 12px outer halo = parallel 24px curve. */
  border-radius:24px;
  background-color:transparent;
  transition:
    background-color .16s cubic-bezier(.2,0,0,1),
    transform .12s ease;
}
.row > *{
  position:relative;
  z-index:1;
}
@media(hover:hover){

  }
}

  transform:scale(.985);
}

   also makes the whole card match :active. The card halo extends 12px beyond
   the row and was the visible flash above/below the card. Keep card press
   feedback for normal card clicks, but freeze the halo when pressing menu. */

  html.one-col .row:has(.row-menu:active)::before{

/* ============================================================
   RAIL MEDIA CORE
   One native YouTube player for MAIN 1-col / PiP / MAIN 2-col.
   Visible viewport = real media.
   Source iframe = media + BLACK top + BLACK bottom.
   Landscape BLACK 65px; portrait BLACK 59px.
   ============================================================ */
html.landscape{--rail-black:var(--rail-black-landscape)}
html.portrait{--rail-black:var(--rail-black-portrait)}

.stage,
.player{
  overflow:hidden;
}

/* The iframe itself is the taller SOURCE FRAME.
   The parent .player is the cropped media viewport. */
.embed-media-core > #videoFrame,
.embed-media-core > iframe{
  position:absolute!important;
  left:0!important;
  right:auto!important;
  top:calc(0px - var(--rail-black))!important;
  bottom:auto!important;
  width:100%!important;
  height:calc(100% + var(--rail-black) + var(--rail-black))!important;
  max-width:none!important;
  max-height:none!important;
  transform:none!important;
  border:0!important;
  background:#000!important;
}


/* MAIN 1 column: SIZE changes only the crop viewport. */
html.one-col .stage{
  height:auto!important;
  aspect-ratio:var(--media-ratio)!important;
}
html.one-col .player{
  inset:0!important;
  width:100%!important;
  height:100%!important;
}

/* PiP: same cropped player, only its SIZE/position changes.
   IMPORTANT: override the generic one-col 100%/100% Rail viewport here.
   Otherwise PiP keeps MAIN size and appears to stretch wide instead of shrinking. */
html.one-col .player.pip{
  aspect-ratio:var(--media-ratio)!important;
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w)!important;
  height:auto!important;
}
html.one-col.portrait .player.pip{
  width:auto!important;
  height:var(--pip-portrait-h)!important;
}

/* MAIN 2 columns: same engine, column width chooses SIZE. */
@media(min-width:1000px){
  html.two-col .stage{
    width:100%!important;
    height:auto!important;
    aspect-ratio:var(--media-ratio)!important;
    overflow:hidden!important;
    background:transparent!important;
  }
  html.two-col .player{
    inset:0!important;
    width:100%!important;
    height:100%!important;
    transform:none!important;
    overflow:hidden!important;
  }
}

/* Native YouTube fullscreen must use the whole fullscreen viewport,
   not the cropped rail source offset. */
.embed-media-core > #videoFrame:fullscreen,
.embed-media-core > iframe:fullscreen,
.embed-media-core > #videoFrame:-webkit-full-screen,
.embed-media-core > iframe:-webkit-full-screen{
  position:fixed!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  max-width:none!important;
  max-height:none!important;
}

/* ============================================================
   FOCUSED VIEWER v1
   Browse = responsive feed.
   Watch = one media viewer; mobile stacks queue below, desktop places queue right.
   Inline-thumbnail playback and automatic PiP are retired from the primary flow.
   ============================================================ */
html.viewer-active.one-col body{
  min-height:100vh;
}
@media(max-width:999px){
  html.viewer-active.one-col main{
    display:block!important;
    width:100%!important;
    max-width:none!important;
    /* 657–999px keeps the header in document/sticky flow, so do not reserve
       another top-boundary here or the viewer gets a duplicate black gap. */
    padding:0!important;
    margin:0!important;
  }
  html.viewer-active.one-col .media-col{
    display:block!important;
    position:relative!important;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    max-width:none!important;
    margin:0!important;
    overflow:visible!important;
    z-index:1!important;
    isolation:isolate!important;
    contain:none!important;
    pointer-events:auto!important;
  }
  html.viewer-active.one-col .media-col > .stage{
    position:relative!important;
    left:auto!important;
    top:auto!important;
    width:100%!important;
    height:auto!important;
    max-height:calc(100dvh - var(--visible-top-boundary,0px) - 8px)!important;
    aspect-ratio:var(--media-ratio)!important;
    overflow:hidden!important;
    background:#000!important;
  }
  html.viewer-active.one-col .media-col > .info{
    display:block!important;
  }
  /* Portrait watch is intentionally a little narrower than the viewport.
     This keeps the tall video visually balanced like a dedicated portrait card
     without changing the real media ratio or the landscape viewer. */
  html.viewer-active.one-col.portrait .media-col > .stage{
    width:min(calc(100% - 32px),480px)!important;
    max-width:480px!important;
    margin-left:auto!important;
    margin-right:auto!important;
    border-radius:var(--floating-radius)!important;
  }
  html.viewer-active.one-col.portrait .media-col > .stage > .player,
  html.viewer-active.one-col.portrait .media-col > .stage > .player iframe{
    border-radius:var(--floating-radius)!important;
  }
  html.viewer-active.one-col .player{
    position:absolute!important;
    inset:0!important;
    width:100%!important;
    height:100%!important;
    transform:none!important;
    pointer-events:auto!important;
  }
  html.viewer-active.one-col .rows{
    padding-top:16px!important;
    grid-template-columns:minmax(0,1fr)!important;
  }
  /* The selected video is already represented by the focused viewer above. */
  html.viewer-active.one-col .row.selected{
    display:none!important;
  }
  html.media-empty.one-col .media-col{
    display:none!important;
  }
}
/* Only the <=656px breakpoint uses fixed top chrome. Reserve its measured
   height here; wider one-column layouts already flow below the sticky header. */
@media(max-width:656px){
  html.viewer-active.one-col main{
    padding:var(--top-boundary) 0 0!important;
  }
}
@media(min-width:1000px){
  html.viewer-active.two-col .rows{
    grid-template-columns:minmax(0,1fr)!important;
  }
  /* Queue means next choices; do not repeat the video already in the viewer. */
  html.viewer-active.two-col .row.selected{
    display:none!important;
  }
}

  function openPackageDb(){
    if(packageDbPromise)return packageDbPromise;
    packageDbPromise=new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){
        reject(new Error("indexeddb_unavailable"));
        return;
      }
      const request=indexedDB.open(PACKAGE_DB_NAME,1);
      request.onupgradeneeded=()=>{
        const db=request.result;
        if(!db.objectStoreNames.contains(PACKAGE_DB_STORE)){
          db.createObjectStore(PACKAGE_DB_STORE,{keyPath:"scope"});
        }
      };
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error||new Error("indexeddb_open_failed"));
    }).catch(error=>{
      packageDbPromise=null;
      throw error;
    });
    return packageDbPromise;
  }

  async function readStoredPackage(scope){
    scope=String(scope||"").trim();
    if(!scope)return null;
    try{
      const db=await openPackageDb();
      return await new Promise((resolve,reject)=>{
        const tx=db.transaction(PACKAGE_DB_STORE,"readonly");
        const request=tx.objectStore(PACKAGE_DB_STORE).get(scope);
        request.onsuccess=()=>resolve(request.result||null);
        request.onerror=()=>reject(request.error||new Error("package_store_read_failed"));
      });
    }catch{
      return null;
    }
  }

  async function writeStoredPackage(scope,pkg){
    scope=String(scope||"").trim();
    const hash=String(pkg?.hash||"").trim();
    if(!scope||!hash||!Array.isArray(pkg?.items))return false;
    try{
      const db=await openPackageDb();
      const row={
        scope,
        hash,
        version:Number(pkg?.version)||0,
        updatedAt:pkg?.updated_at||pkg?.updatedAt||null,
        items:pkg.items
      };
      await new Promise((resolve,reject)=>{
        const tx=db.transaction(PACKAGE_DB_STORE,"readwrite");
        tx.objectStore(PACKAGE_DB_STORE).put(row);
        tx.oncomplete=()=>resolve(true);
        tx.onerror=()=>reject(tx.error||new Error("package_store_write_failed"));
        tx.onabort=()=>reject(tx.error||new Error("package_store_write_aborted"));
      });
      return true;
    }catch{
      return false;
    }
  }

  async function restoreStoredPackage(scope){
    scope=String(scope||"").trim();
    if(!scope||packageCache.has(scope))return packageCache.get(scope)||[];
    const row=await readStoredPackage(scope);
    if(
      !row ||
      String(row.scope||"")!==scope ||
      !String(row.hash||"").trim() ||
      !Array.isArray(row.items)
    )return [];
    const metas=packageMetas(row.items);
    packageCache.set(scope,metas);
    packageHashCache.set(scope,String(row.hash));
    return metas;
  }

  function mergeChannelDirectoryRow(previous={},next={}){

  function applyChannelDirectoryLocal(row={}){
    const id=String(row?.id||"").trim();
    if(!/^UC[A-Za-z0-9_-]+$/.test(id))return false;

    if(!sourceStateRemote||typeof sourceStateRemote!=="object")sourceStateRemote={};
    if(!sourceStateRemote.avatars||typeof sourceStateRemote.avatars!=="object"){
      sourceStateRemote.avatars={};
    }
    if(!Array.isArray(sourceStateRemote.customSources)){
      sourceStateRemote.customSources=[];
    }

    let current=sourceStateRemote.customSources.find(
      item=>String(item?.id||"").trim()===id
    );
    if(!current){
      current={id,name:"",thumbnailUrl:"",subscribers:""};
      sourceStateRemote.customSources.push(current);
    }

    const name=String(row?.name||"").trim();
    const thumbnailUrl=String(row?.thumbnailUrl||"").trim();
    const subscribers=String(row?.subscribers||"").trim();

    if(name)current.name=name;
    if(thumbnailUrl){
      current.thumbnailUrl=thumbnailUrl;
      sourceStateRemote.avatars[id]=thumbnailUrl;
    }
    if(subscribers)current.subscribers=subscribers;

    const key=channelLibraryKey("youtube",id);
    const existing=channelLibraryByKey.get(key)||{};
    const existingAvatar=String(
      existing?.avatar?.url||
      existing?.avatar?.storedUrl||
      existing?.avatar?.sourceUrl||
      ""
    ).trim();
    const avatar=thumbnailUrl||existingAvatar;
    const verifiedKnown=
      row?.verifiedKnown===true||
      row?.verified_known===true||
      existing?.verification?.known===true;
    const verified=
      row?.verifiedKnown===true||row?.verified_known===true
        ?row?.verified===true
        :existing?.verified===true;
    const stats={
      ...(existing?.stats&&typeof existing.stats==="object"?existing.stats:{}),
      followers:
        Math.max(0,Number(row?.subscriberCount)||0)||
        Number(existing?.stats?.followers)||0,
      subscribers:
        Math.max(0,Number(row?.subscriberCount)||0)||
        Number(existing?.stats?.subscribers)||0,
      subscriberText:
        subscribers||
        String(existing?.stats?.subscriberText||""),
      views:
        Math.max(0,Number(row?.viewCount)||0)||
        Number(existing?.stats?.views)||0,
      videos:
        Math.max(0,Number(row?.videoCount)||0)||
        Number(existing?.stats?.videos)||0
    };

    channelLibraryByKey.set(key,{
      ...existing,
      key,
      platform:"youtube",
      id,
      userId:id,
      handle:String(row?.handle||existing?.handle||"").trim(),
      name:name||String(existing?.name||"").trim(),
      description:String(row?.description||existing?.description||"").trim(),
      profileUrl:String(
        row?.profileUrl||
        existing?.profileUrl||
        ("https://www.youtube.com/channel/"+id)
      ).trim(),
      avatar:{
        ...(existing?.avatar&&typeof existing.avatar==="object"?existing.avatar:{}),
        url:avatar,
        sourceUrl:avatar,
        storedUrl:String(existing?.avatar?.storedUrl||"").trim()
      },
      verified:verifiedKnown?verified:null,
      verification:{
        ...(existing?.verification&&typeof existing.verification==="object"
          ?existing.verification:{}),
        known:verifiedKnown,
        verified:verifiedKnown?verified:null,
        badge:verified===true?"verified":""
      },
      badges:verified===true?["verified"]:[],
      stats,
      source:String(row?.source||existing?.source||"metadata").trim(),
      checkedAt:String(row?.profileCheckedAt||existing?.checkedAt||"").trim()||null,
      updatedAt:new Date().toISOString()
    });

    const known=sourceIdentityCache.get(id)||{};
    sourceIdentityCache.set(id,{
      ...known,
      sourceName:name||String(known.sourceName||"").trim(),
      sourceAvatar:avatar||String(known.sourceAvatar||"").trim(),
      sourceVerified:verified===true,
      sourceStats:stats,
      sourceHandle:String(row?.handle||known?.sourceHandle||"").trim(),
      sourceProfileUrl:String(
        row?.profileUrl||known?.sourceProfileUrl||""
      ).trim()
    });
    return true;
  }

  function primeChannelDirectoryFromState(remote={}){

    for(const row of rows){

      channelDirectorySentSig.set(id,sig);

        channelDirectoryPending.delete(id);

  function queueYoutubeChannelDirectory(meta={},source="metadata"){
    const provider=String(meta?.provider||"youtube").toLowerCase();
    if(provider!=="youtube")return false;

    const id=String(meta?.sourceId||"").trim();
    if(!/^UC[A-Za-z0-9_-]+$/.test(id))return false;

    const verifiedKnown=
      meta?.sourceVerifiedKnown===true||
      meta?.verifiedKnown===true||
      meta?.verified_known===true;
    const row={
      id,
      name:String(meta?.sourceName||"").replace(/\s+/g," ").trim().slice(0,180),
      thumbnailUrl:String(meta?.sourceAvatar||"").trim().slice(0,1000),
      subscribers:String(
        meta?.sourceSubscribers||
        meta?.subscriberText||
        meta?.subscribers||
        ""
      ).replace(/\s+/g," ").trim().slice(0,120),
      handle:String(meta?.sourceHandle||meta?.handle||"").replace(/^@/,"").trim().slice(0,120),
      description:String(meta?.sourceDescription||meta?.description||"").replace(/\s+/g," ").trim().slice(0,2000),
      verified:verifiedKnown
        ?(meta?.sourceVerified===true||meta?.verified===true)
        :undefined,
      verifiedKnown,
      subscriberCount:Math.max(
        0,
        Number(meta?.sourceSubscriberCount)||
        Number(meta?.subscriberCount)||
        0
      ),
      viewCount:Math.max(
        0,
        Number(meta?.sourceViewCount)||
        Number(meta?.channelViewCount)||
        0
      ),
      videoCount:Math.max(
        0,
        Number(meta?.sourceVideoCount)||
        Number(meta?.channelVideoCount)||
        0
      ),
      profileUrl:String(meta?.sourceProfileUrl||meta?.profileUrl||"").trim().slice(0,1000),
      profileCheckedAt:String(
        meta?.sourceProfileCheckedAt||
        meta?.profileCheckedAt||
        ""
      ).trim(),
      source:String(source||"metadata").replace(/\s+/g," ").trim().slice(0,80)
    };
    if(
      !row.name&&!row.thumbnailUrl&&!row.subscribers&&!row.handle&&
      !row.description&&!row.profileUrl&&!row.profileCheckedAt
    )return false;

    applyChannelDirectoryLocal(row);

    const sig=channelDirectorySignature(row);
    if(channelDirectorySentSig.get(id)===sig)return true;

    const previous=channelDirectoryPending.get(id)||{};
    channelDirectoryPending.set(id,mergeChannelDirectoryRow(previous,row));

    clearTimeout(channelDirectoryFlushTimer);
    const discovery=/^(?:live|search)/i.test(String(source||""));
    channelDirectoryFlushTimer=setTimeout(()=>{
      void flushYoutubeChannelDirectory();
    },discovery?120:900);
    return true;
  }

  async function flushYoutubeChannelDirectory(){
    if(channelDirectoryFlushPromise)return channelDirectoryFlushPromise;
    const batch=[...channelDirectoryPending.values()].slice(0,80);
    if(!batch.length)return false;

    for(const row of batch)channelDirectoryPending.delete(row.id);

    channelDirectoryFlushPromise=(async()=>{
      try{
        const response=await fetch(SOURCE_STATE_URL,{
          method:"POST",
          cache:"no-store",
          keepalive:true,
          headers:{
            "content-type":"application/json",
            "x-1988-pin":SOURCE_ADMIN_PIN
          },
          body:JSON.stringify({
            op:"upsert_channels",
            channels:batch
          })
        });
        if(!response.ok)throw new Error("channel_directory_"+response.status);
        const payload=await response.json().catch(()=>({}));
        if(payload?.ok!==true)throw new Error("channel_directory_write_failed");

        for(const row of batch){
          channelDirectorySentSig.set(row.id,channelDirectorySignature(row));
        }
        return true;
      }catch(_){
        for(const row of batch){
          const existing=channelDirectoryPending.get(row.id)||{};
          channelDirectoryPending.set(
            row.id,
            mergeChannelDirectoryRow(row,existing)
          );
        }
        return false;
      }finally{
        channelDirectoryFlushPromise=null;
        if(channelDirectoryPending.size){
          clearTimeout(channelDirectoryFlushTimer);
          channelDirectoryFlushTimer=setTimeout(()=>{
            void flushYoutubeChannelDirectory();
          },2500);
        }
      }
    })();
    return channelDirectoryFlushPromise;
  }

  // Search/LIVE are discovery surfaces: a card may arrive before the canonical
  // channel directory knows its id/avatar/name. Paint first, then hydrate the
  // missing identity in the background and persist it into the shared library.
  const discoveredYoutubeHydrationPending=new Map();
  const discoveredYoutubeHydrationQueue=[];
  const discoveredYoutubeProfilePending=new Map();
  const discoveredYoutubeProfileDone=new Set();
  let discoveredYoutubeHydrationWorkers=0;
  const DISCOVERED_YOUTUBE_HYDRATION_CONCURRENCY=4;

  function youtubeProfileNeedsHydration(sourceId=""){
    sourceId=String(sourceId||"").trim();
    if(!/^UC[A-Za-z0-9_-]+$/.test(sourceId))return false;
    const canonical=channelLibraryEntry("youtube",sourceId);
    const avatar=String(
      canonical?.avatar?.url||
      canonical?.avatar?.sourceUrl||
      ""
    ).trim();
    return (
      !canonical||
      !String(canonical?.name||"").trim()||
      !avatar||
      !String(canonical?.checkedAt||"").trim()
    );
  }

  async function hydrateYoutubeDiscoveredChannelProfile(meta={},source="discovery"){
    const sourceId=String(meta?.sourceId||"").trim();
    if(
      !/^UC[A-Za-z0-9_-]+$/.test(sourceId)||
      !window.YT1988_API?.channel
    )return false;

    if(
      discoveredYoutubeProfileDone.has(sourceId)&&
      !youtubeProfileNeedsHydration(sourceId)
    )return true;
    if(discoveredYoutubeProfilePending.has(sourceId)){
      return discoveredYoutubeProfilePending.get(sourceId);
    }

    const task=(async()=>{
      try{
        const payload=await window.YT1988_API.channel(sourceId,true);
        const profile=dataRow(payload);
        if(!profile||typeof profile!=="object")return false;

        const avatar=String(
          profile?.avatarUrl||
          profile?.thumbnailUrl||
          profile?.avatar||
          meta?.sourceAvatar||
          ""
        ).trim();
        const name=String(
          profile?.name||
          profile?.channelName||
          meta?.sourceName||
          ""
        ).replace(/\s+/g," ").trim();

        const enriched={
          ...meta,
          provider:"youtube",
          sourceId,
          sourceName:name,
          sourceAvatar:avatar,
          sourceSubscribers:String(
            profile?.subscriberText||
            meta?.sourceSubscribers||
            ""
          ).trim(),
          sourceSubscriberCount:Math.max(0,Number(profile?.subscriberCount)||0),
          sourceViewCount:Math.max(0,Number(profile?.viewCount)||0),
          sourceVideoCount:Math.max(0,Number(profile?.videoCount)||0),
          sourceHandle:String(profile?.handle||"").replace(/^@/,"").trim(),
          sourceDescription:String(profile?.description||"").trim(),
          sourceProfileUrl:String(
            profile?.profileUrl||
            ("https://www.youtube.com/channel/"+sourceId)
          ).trim(),
          sourceVerified:profile?.verified===true,
          sourceVerifiedKnown:profile?.verifiedKnown===true,
          sourceProfileCheckedAt:new Date().toISOString()
        };

        if(name)meta.sourceName=name;
        if(avatar)meta.sourceAvatar=avatar;

        applySourceIdentityToVideo(meta?.id,{
          sourceId,
          sourceName:name,
          sourceAvatar:avatar
        });
        queueYoutubeChannelDirectory(enriched,source+"-profile");
        return true;
      }catch(_){
        return false;
      }finally{
        discoveredYoutubeProfilePending.delete(sourceId);
        discoveredYoutubeProfileDone.add(sourceId);
      }
    })();

    discoveredYoutubeProfilePending.set(sourceId,task);
    return task;
  }

  function youtubeLiveTitleNeedsHydration(meta={}){
    if(meta?.isLive!==true)return false;
    const title=String(meta?.title||"").replace(/\s+/g," ").trim();
    if(!title)return true;
    const normalized=normalizeLiveClientText(title);
    return /^(?:live|live stream|livestream|truc tiep|dang truc tiep|item|video)$/.test(normalized);
  }

  function youtubeDiscoveryNeedsHydration(meta={}){
    if(String(meta?.provider||"youtube").toLowerCase()!=="youtube")return false;
    const id=String(meta?.id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;
    return (
      !/^UC[A-Za-z0-9_-]+$/.test(String(meta?.sourceId||"").trim())||
      !String(meta?.sourceName||"").trim()||
      !String(meta?.sourceAvatar||"").trim()||
      youtubeLiveTitleNeedsHydration(meta)
    );
  }

  async function hydrateDiscoveredYoutubeMeta(meta={},source="discovery"){
    const id=String(meta?.id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    // If the discovery row already contains a complete channel identity, write
    // it immediately; no extra metadata request is needed.
    queueYoutubeChannelDirectory(meta,source);
    if(!youtubeDiscoveryNeedsHydration(meta))return true;
    if(discoveredYoutubeHydrationPending.has(id)){
      return discoveredYoutubeHydrationPending.get(id);
    }

    const task=(async()=>{
      try{
        if(!window.YT1988_API?.video&&!window.YT1988_API?.videoMeta)return false;

        let payload=null;
        // video_meta uses YouTube oEmbed + an exact-id search and is the best
        // lightweight source for a LIVE title/concurrent count. Fall back to
        // the normal video endpoint for channel identity when needed.
        if(window.YT1988_API?.videoMeta){
          try{payload=await window.YT1988_API.videoMeta(id)}catch{}
        }
        if(!payload&&window.YT1988_API?.video){
          payload=await window.YT1988_API.video(id);
        }

        let raw=dataRow(payload);
        let full=cardMetaFromRow(raw);
        if(!full?.id&&window.YT1988_API?.video){
          const fallbackPayload=await window.YT1988_API.video(id);
          raw=dataRow(fallbackPayload);
          full=cardMetaFromRow(raw);
        }
        if(!full?.id)return false;

        const sourceId=String(full?.sourceId||meta?.sourceId||"").trim();
        const sourceName=String(full?.sourceName||meta?.sourceName||"").trim();
        const sourceAvatar=String(full?.sourceAvatar||meta?.sourceAvatar||"").trim();

        if(sourceId&&!meta.sourceId)meta.sourceId=sourceId;
        if(sourceName&&!meta.sourceName)meta.sourceName=sourceName;
        if(sourceAvatar&&!meta.sourceAvatar)meta.sourceAvatar=sourceAvatar;

        const resolvedLiveTitle=cleanYoutubeLiveDisplayTitle(
          full?.title||raw?.title||"",
          sourceName
        );
        if(youtubeLiveTitleNeedsHydration(meta)&&resolvedLiveTitle){
          meta.title=resolvedLiveTitle;
        }

        const liveViewers=meta?.isLive===true
          ?liveViewerCountFromRow(raw,full)
          :0;
        if(liveViewers>0){
          meta.viewerCount=liveViewers;
          meta.viewsLabel=compactLiveViewerCount(liveViewers);
        }

        // Keep the authoritative edge row in sync as well. Otherwise a later
        // repaint would recreate the old generic "Đang trực tiếp" card.
        if(meta?.isLive===true){
          const edge=youtubeEdgeLiveMetas.find(row=>String(row?.id||"")===id);
          if(edge){
            if(resolvedLiveTitle)edge.title=resolvedLiveTitle;
            if(sourceId)edge.sourceId=sourceId;
            if(sourceName)edge.sourceName=sourceName;
            if(sourceAvatar)edge.sourceAvatar=sourceAvatar;
            if(liveViewers>0){
              edge.viewerCount=liveViewers;
              edge.viewsLabel=compactLiveViewerCount(liveViewers);
            }
          }
        }

        // Video thumbnail/live preview is session/UI state, not channel-library
        // state. It may fill the visible card, but queueYoutubeChannelDirectory
        // only persists channel identity fields.
        if(!String(meta?.thumbnail||"").trim()&&String(full?.thumbnail||"").trim()){
          meta.thumbnail=String(full.thumbnail).trim();
        }

        const identity={sourceId,sourceName,sourceAvatar};
        applySourceIdentityToVideo(id,identity);
        const discoveredMeta={
          ...full,
          ...meta,
          provider:"youtube",
          sourceId,
          sourceName,
          sourceAvatar
        };
        queueYoutubeChannelDirectory(discoveredMeta,source);

        // A newly discovered LIVE/search channel is promoted immediately into
        // the canonical library. The visible card gets whatever identity the
        // video endpoint already knows, while a channel-profile request fills
        // avatar/stats/verification in the background and persists them.
        if(sourceId&&youtubeProfileNeedsHydration(sourceId)){
          void hydrateYoutubeDiscoveredChannelProfile(discoveredMeta,source);
        }

        if(meta?.isLive===true&&liveDemandActive("youtube")){
          const rows=document.getElementById("rows");
          if(rows)rows.dataset.renderSignature="";
          paintUnifiedLiveFromEdge("youtube");
        }
        return true;
      }catch(_){
        return false;
      }finally{
        discoveredYoutubeHydrationPending.delete(id);
      }
    })();

    discoveredYoutubeHydrationPending.set(id,task);
    return task;
  }

  function pumpDiscoveredYoutubeHydration(){
    while(
      discoveredYoutubeHydrationWorkers<DISCOVERED_YOUTUBE_HYDRATION_CONCURRENCY&&
      discoveredYoutubeHydrationQueue.length
    ){
      const job=discoveredYoutubeHydrationQueue.shift();
      if(!job)break;
      discoveredYoutubeHydrationWorkers++;
      void hydrateDiscoveredYoutubeMeta(job.meta,job.source)
        .finally(()=>{
          discoveredYoutubeHydrationWorkers--;
          pumpDiscoveredYoutubeHydration();
        });
    }
  }

  function queueDiscoveredYoutubeHydration(metas=[],source="discovery"){
    const seen=new Set();
    for(const meta of Array.isArray(metas)?metas:[]){
      if(String(meta?.provider||"youtube").toLowerCase()!=="youtube")continue;
      const id=String(meta?.id||"").trim();
      if(!/^[A-Za-z0-9_-]{11}$/.test(id)||seen.has(id))continue;
      seen.add(id);

      // Complete identities still go straight into the persistent directory.
      // If this is a previously unseen channel, also fetch its full profile once
      // so later UI surfaces only have to read the canonical library.
      const sourceId=String(meta?.sourceId||"").trim();
      queueYoutubeChannelDirectory(meta,source);
      if(
        /^UC[A-Za-z0-9_-]+$/.test(sourceId)&&
        youtubeProfileNeedsHydration(sourceId)
      ){
        void hydrateYoutubeDiscoveredChannelProfile(meta,source);
      }
      if(!youtubeDiscoveryNeedsHydration(meta))continue;
      if(discoveredYoutubeHydrationPending.has(id))continue;
      if(discoveredYoutubeHydrationQueue.some(job=>String(job?.meta?.id||"")===id))continue;
      discoveredYoutubeHydrationQueue.push({meta,source});
    }
    pumpDiscoveredYoutubeHydration();
    return seen.size;
  }

  addEventListener("pagehide",()=>{
    if(channelDirectoryPending.size)void flushYoutubeChannelDirectory();
  },{passive:true});

  function validMediaAspect(value){
    const ratio=Number(value)||0;
    if(!Number.isFinite(ratio)||ratio<.34||ratio>2.6)return 0;

    let nearest=ratio;
    let delta=Infinity;
    for(const standard of STANDARD_MEDIA_ASPECTS){
      const next=Math.abs(standard-ratio);
      if(next<delta){
        nearest=standard;
        delta=next;
      }
    }
    return delta<=.05?nearest:ratio;
  }



  function cachedMediaAspect(id,{verifiedOnly=false}={}){
    const row=mediaAspectCache.get(String(id||"").trim());
    if(verifiedOnly&&row?.verified!==true)return 0;
    return validMediaAspect(row?.value);
  }

  function mediaAspectFromMeta(meta={}){
    if(!meta||typeof meta!=="object")return 0;
    if(meta.isShort===true)return 9/16;

    const direct=validMediaAspect(
      Number(meta.aspectRatio)||
      Number(meta.videoAspectRatio)||
      Number(meta.contentAspectRatio)||
      0
    );
    if(direct)return direct;

    const w=Number(meta.videoWidth||meta.width)||0;
    const h=Number(meta.videoHeight||meta.height)||0;
    if(w>0&&h>0)return validMediaAspect(w/h);

    // Server/package may already know the orientation even when exact
    // dimensions are unavailable. This is a prediction only; the real
    // YouTube videoContentRect still confirms/corrects it after playback.
    const kind=String(meta.mediaKind||meta.media_kind||"").toLowerCase();
    if(kind==="portrait"||kind==="vertical")return 9/16;
    if(kind==="landscape"||kind==="horizontal")return 16/9;

    return 0;
  }

  function rememberMediaAspect(id,ratio,source="",verified=false){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio)return 0;

    // Only the actual YouTube player content rectangle is allowed to define
    // media kind. Everything else is presentation/data only.
    if(source!=="iframe-content-rect"||verified!==true){
      return cachedMediaAspect(id)||0;
    }

    mediaAspectCache.set(id,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    return ratio;
  }

  function cachedPrimedAspect(id){
    const entry=aspectPrimeCache.get(String(id||"").trim());
    return validMediaAspect(entry?.value);
  }

  function applyServerAspectRow(id,row){
    id=String(id||"").trim();
    const ratio=validMediaAspect(row?.aspectRatio);
    if(!id||!ratio)return 0;

    aspectPrimeCache.set(id,{
      value:ratio,
      source:String(row?.aspectSource||"server"),
      verified:row?.aspectVerified===true,
      at:Date.now()
    });

    if(row?.aspectVerified===true){
      mediaAspectCache.set(id,{
        value:ratio,
        source:String(row?.aspectSource||"server"),
        verified:true,
        at:Date.now()
      });
    }
    return ratio;
  }

  function fetchServerAspects(ids=[],resolve=true){
    const unique=[...new Set(
      (Array.isArray(ids)?ids:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )].slice(0,24);
    if(!unique.length)return Promise.resolve({});

    const url=VIDEO_META_URL+
      "?ids="+encodeURIComponent(unique.join(","))+
      (resolve?"&resolve=1":"");

    return fetch(url,{cache:"no-store"})
      .then(response=>{
        if(!response.ok)throw new Error("aspect_http_"+response.status);
        return response.json();
      })
      .then(payload=>{
        const data=payload?.data&&typeof payload.data==="object"?payload.data:{};
        for(const id of unique){
          if(data[id])applyServerAspectRow(id,data[id]);
        }
        return data;
      })
      .catch(()=>({}));
  }

  function primeMediaAspect(id){
    id=String(id||"").trim();
    if(!id)return Promise.resolve(0);

    const cached=cachedPrimedAspect(id);
    if(cached)return Promise.resolve(cached);
    if(aspectPrimePending.has(id))return aspectPrimePending.get(id);

    const task=fetchServerAspects([id],true)
      .then(data=>validMediaAspect(data?.[id]?.aspectRatio)||cachedPrimedAspect(id)||0)
      .finally(()=>aspectPrimePending.delete(id));

    aspectPrimePending.set(id,task);
    return task;
  }

  function primeMediaAspects(metas=[],limit=18){
    const list=(Array.isArray(metas)?metas:[])
      .filter(meta=>meta?.id)
      .slice(0,Math.max(0,limit));

    // UI rule: a downloaded package is authoritative for list rendering.
    // Read aspect data only when it is already present in that package.
    // Missing shape is learned from the real YouTube player after selection;
    // never fan out video-meta resolves for cards sitting in the list.
    for(const meta of list){
      const ratio=mediaAspectFromMeta(meta);
      if(!ratio)continue;

      const id=String(meta.id);
      aspectPrimeCache.set(id,{
        value:ratio,
        source:String(meta?._aspectSource||"server-package"),
        verified:meta?._aspectVerified===true,
        at:Date.now()
      });
      if(meta?._aspectVerified===true){
        mediaAspectCache.set(id,{
          value:ratio,
          source:String(meta?._aspectSource||"server-package"),
          verified:true,
          at:Date.now()
        });
      }
    }
  }

  function mediaLayoutKindFromRatio(ratio){
    ratio=validMediaAspect(ratio)||16/9;
    return ratio<1?"portrait":"landscape";
  }

  function applyMediaLayoutSelection(kind,{relayout=true}={}){
    kind=kind==="portrait"?"portrait":"landscape";
    const fallback=kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallback;

    current={
      ...current,
      kind,
      ratio:mediaRatio
    };

    // Shape chooses BLACK; exact media aspect chooses the crop viewport.
    root.dataset.mediaShape=kind;
    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    if(relayout){
      layout();
      schedulePip();
      scheduleFeedMasonry();
      requestAnimationFrame(()=>syncInlinePlayerOverlay());
    }
    return kind;
  }

  function commitCurrentAspect(id,ratio,{relayout=true,provider=""}={}){
    id=String(id||"").trim();
    if(provider&&provider!==currentMediaProvider)return false;
    ratio=validMediaAspect(ratio);
    if(!id||!ratio||String(current?.id||"")!==id)return false;

    const previousRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      0;
    const kind=mediaLayoutKindFromRatio(ratio);
    const shapeChanged=current?.kind!==kind;
    const ratioChanged=!previousRatio||Math.abs(previousRatio-ratio)>.002;

    current={
      ...current,
      detectedRatio:ratio
    };
    applyMediaLayoutSelection(kind,{
      relayout:relayout&&(shapeChanged||ratioChanged)
    });
    return shapeChanged||ratioChanged;
  }

  const headerColorCache=new Map();

  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    let h=0,s=0;
    const l=(max+min)/2;
    const d=max-min;
    if(d){
      s=d/(1-Math.abs(2*l-1));
      if(max===r)h=((g-b)/d)%6;
      else if(max===g)h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60;
      if(h<0)h+=360;
    }
    return [h,s,l];
  }

  function hslToRgb(h,s,l){
    const cc=(1-Math.abs(2*l-1))*s;
    const x=cc*(1-Math.abs((h/60)%2-1));
    const m=l-cc/2;
    let rr=0,gg=0,bb=0;
    if(h<60){rr=cc;gg=x}
    else if(h<120){rr=x;gg=cc}
    else if(h<180){gg=cc;bb=x}
    else if(h<240){gg=x;bb=cc}
    else if(h<300){rr=x;bb=cc}
    else{rr=cc;bb=x}
    return [rr,gg,bb].map(v=>Math.round((v+m)*255));
  }

  function youtubeCinematicPalette(url){
    url=String(url||"").trim();
    if(!url)return Promise.resolve(null);
    if(headerColorCache.has(url))return headerColorCache.get(url);

    const task=new Promise(resolve=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.decoding="async";
      img.onload=()=>{
        try{
          const w=24,h=14;
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d",{willReadFrequently:true});
          if(!ctx){resolve(null);return;}
          ctx.drawImage(img,0,0,w,h);
          const data=ctx.getImageData(0,0,w,h).data;
          const buckets=new Map();

          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const i=(y*w+x)*4;
            if(data[i+3]<128)continue;
            const r=data[i],g=data[i+1],b=data[i+2];
            const lum=.2126*r+.7152*g+.0722*b;
            if(lum<24||lum>238)continue;
            const max=Math.max(r,g,b),min=Math.min(r,g,b);
            const sat=max?((max-min)/max):0;
            const nx=(x-(w-1)/2)/(w/2),ny=(y-(h-1)/2)/(h/2);
            const center=1+Math.max(0,1-Math.sqrt(nx*nx+ny*ny))*.55;
            const weight=center*(.45+sat*1.65);
            const key=((r>>5)<<6)|((g>>5)<<3)|(b>>5);
            const row=buckets.get(key)||{r:0,g:0,b:0,w:0};
            row.r+=r*weight;row.g+=g*weight;row.b+=b*weight;row.w+=weight;
            buckets.set(key,row);
          }

          let winner=null;
          for(const row of buckets.values()){
            if(!winner||row.w>winner.w)winner=row;
          }
          if(!winner||winner.w<=0){resolve(null);return;}

          const source=[winner.r/winner.w,winner.g/winner.w,winner.b/winner.w].map(Math.round);

          // Keep the thumbnail's real hue but stop manufacturing an over-saturated
          // accent. Cards may still use this fuller dominant color at low alpha.
          const accentHsl=rgbToHsl(source[0],source[1],source[2]);
          accentHsl[1]=Math.min(.72,accentHsl[1]*.88);
          accentHsl[2]=Math.max(.36,Math.min(.62,accentHsl[2]));
          const accent=hslToRgb(accentHsl[0],accentHsl[1],accentHsl[2]);

          // YouTube-style chrome is deliberately much more neutral than the
          // thumbnail. This prevents red/blue videos from turning the whole
          // header, chip rail and search area into a solid themed bar.
          const chromeHsl=[
            accentHsl[0],
            Math.min(.24,accentHsl[1]*.35),
            Math.max(.40,Math.min(.52,accentHsl[2]*.88))
          ];
          const chromeAccent=hslToRgb(chromeHsl[0],chromeHsl[1],chromeHsl[2]);
          resolve({accent,chromeAccent});
        }catch{
          resolve(null);
        }
      };
      img.onerror=()=>resolve(null);
      img.src=url;
    });

    headerColorCache.set(url,task);
    return task;
  }

  let headerTintSeq=0;
  function applyHeaderTint(meta=currentMeta){
    const art=String(
      meta?.thumbnail||
      meta?.thumbnailUrl||
      meta?.poster||
      ""
    ).trim();
    if(!/^https?:\/\//i.test(art))return;

    const seq=++headerTintSeq;
    void youtubeCinematicPalette(art).then(palette=>{
      if(seq!==headerTintSeq||!palette)return;

      const light=root.dataset.theme==="light";

      // Keep the structural header base neutral. Ambient color is a separate
      // overlay layer, so it can fade naturally instead of permanently tinting
      // every header pixel and every chip.
      const base=light?[255,255,255]:[15,15,15];
      root.style.setProperty("--header-rgb",base.join(","));
      // The same thumbnail color is progressively weakened as the grid grows.
      // 1 column may feel cinematic; 4 columns stays very close to neutral
      // YouTube desktop chrome instead of becoming one large colored strip.
      const cols=ambientColumnCount();
      const accentMixByCols={1:.90,2:.74,3:.58,4:.44};
      const sourceAccent=palette.chromeAccent||palette.accent;
      const accentMix=accentMixByCols[cols]??.44;
      const layoutAccent=sourceAccent.map((value,index)=>Math.round(
        base[index]*(1-accentMix)+value*accentMix
      ));
      root.style.setProperty(
        "--header-accent-rgb",
        layoutAccent.join(",")
      );

      // Do NOT paint browser/PWA status chrome with the media color.
      // Keeping this neutral avoids a persistent colored notch strip while
      // the in-page header itself scrolls away underneath black-translucent.
      if(themeColorMeta){
        themeColorMeta.setAttribute(
          "content",
          light?"#ffffff":"rgba(33,33,33,.98)"
        );
      }
    });
  }

  function youtubeContentRect(player=ytPlayer){
    const candidates=[
      player?.playerInfo?.videoContentRect,
      player?.videoContentRect,
      player?.playerInfo?.video_content_rect
    ];

    for(const rect of candidates){
      const width=Number(rect?.width)||0;
      const height=Number(rect?.height)||0;
      if(width<=0||height<=0)continue;

      const aspectRatio=validMediaAspect(width/height);
      if(!aspectRatio)continue;
      return {width,height,aspectRatio};
    }
    return null;
  }

  function reportVerifiedAspect(id,rect){
    id=String(id||"").trim();
    const ratio=validMediaAspect(rect?.aspectRatio);
    if(!id||!ratio)return;

    const signature=[
      ratio.toFixed(5),
      Math.round(Number(rect?.width)||0),
      Math.round(Number(rect?.height)||0)
    ].join(":");
    if(aspectCorrectionSent.get(id)===signature)return;
    aspectCorrectionSent.set(id,signature);

    void fetch(VIDEO_META_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        videoId:id,
        aspectRatio:ratio,
        width:Math.round(Number(rect?.width)||0),
        height:Math.round(Number(rect?.height)||0)
      }),
      keepalive:true
    }).catch(()=>{});
  }

  function syncCurrentKindFromYoutubePlayer(player=ytPlayer){
    if(
      !player||
      !current?.id||
      currentMediaProvider!=="youtube"||
      currentMediaType!=="embed"||
      current?.provider!=="youtube"
    )return false;

    const expectedId=String(current.id||"").trim();
    let loadedId="";
    try{
      const data=player.getVideoData?.()||{};
      loadedId=String(data.video_id||data.videoId||"").trim();
    }catch{}

    // During loadVideoById() YouTube can briefly expose the previous video's rect.
    // Accept geometry only after YouTube explicitly reports THIS media id.
    if(!loadedId||loadedId!==expectedId)return false;

    const rect=youtubeContentRect(player);
    if(!rect)return false;

    const ratio=rememberMediaAspect(
      expectedId,
      rect.aspectRatio,
      "iframe-content-rect",
      true
    );
    if(!ratio)return false;

    commitCurrentAspect(expectedId,ratio,{relayout:true,provider:"youtube"});
    aspectPrimeCache.set(expectedId,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    reportVerifiedAspect(expectedId,rect);
    return true;
  }

  function scheduleCurrentPlayerKind(player=ytPlayer){
    if(currentMediaProvider!=="youtube")return;
    const id=String(current?.id||"").trim();
    if(!id)return;

    const attempt=()=>{
      if(String(current?.id||"").trim()!==id)return;
      syncCurrentKindFromYoutubePlayer(player);
    };

    attempt();
    [90,260,700,1400,2600,4500].forEach(delay=>setTimeout(attempt,delay));
  }

  function configurePlayerIframe(player=ytPlayer){
    try{
      const iframe=player?.getIframe?.();
      if(!iframe)return;
      iframe.setAttribute("allowfullscreen","");
      iframe.setAttribute("webkitallowfullscreen","");
      iframe.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture; fullscreen"
      );
      iframe.referrerPolicy="strict-origin-when-cross-origin";
      iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    }catch{}
  }

  function loadYoutubeIframeApi(){
    if(window.YT&&typeof window.YT.Player==="function"){
      return Promise.resolve(window.YT);
    }
    if(youtubeApiPromise)return youtubeApiPromise;

    youtubeApiPromise=new Promise(resolve=>{
      const previous=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{
        try{previous?.()}catch{}
        resolve(window.YT||null);
      };

      if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
        const script=document.createElement("script");
        script.src="https://www.youtube.com/iframe_api";
        script.async=true;
        document.head.appendChild(script);
      }

      const started=Date.now();
      const timer=setInterval(()=>{
        if(window.YT&&typeof window.YT.Player==="function"){
          clearInterval(timer);
          resolve(window.YT);
        }else if(Date.now()-started>10000){
          clearInterval(timer);
          resolve(null);
        }
      },80);
    });
    return youtubeApiPromise;
  }

  async function ensureYoutubePlayer(){
    if(ytPlayer)return ytPlayer;

    const YTApi=await loadYoutubeIframeApi();
    if(!YTApi?.Player||ytPlayer)return ytPlayer;

    ytPlayer=new YTApi.Player("videoFrame",{
      host:"https://www.youtube-nocookie.com",
      width:"100%",
      height:"100%",
      playerVars:{
        autoplay:1,
        playsinline:1,
        controls:1,
        cc_load_policy:0,
        rel:0,
        fs:1,
        disablekb:0,
        modestbranding:1,
        iv_load_policy:3,
        enablejsapi:1,
        origin:location.origin,
        widget_referrer:location.href
      },
      events:{
        onReady(event){
          ytPlayerReady=true;
          configurePlayerIframe(event.target);

          const id=String(pendingVideoId||current?.id||"").trim();
          pendingVideoId="";
          if(!id)return;

          try{
            event.target.loadVideoById(id);
            event.target.playVideo?.();
          }catch{}
        },
        onStateChange(event){
          if(currentMediaProvider!=="youtube"||currentMediaType!=="embed")return;
          if(event.data===YTApi.PlayerState.PLAYING){
            scheduleCurrentPlayerKind(event.target);
          }else if(event.data===YTApi.PlayerState.ENDED){
            queueMicrotask(()=>playNextFeedVideo());
          }
        },
        onError(event){
          // Packages are server-filtered for embed support before publishing.
          // Keep a single playback engine only: never switch to another player.
          const code=Number(event?.data)||0;
          if(code)console.warn("youtube_embed_error",code,String(current?.id||""));
        }
      }
    });

    return ytPlayer;
  }

  function playVideoId(id,meta=null,{history="none"}={}){
    id=String(id||"").trim();
    if(!id)return false;
    activateYoutubeSurface();
    currentMediaType="embed";
    player.dataset.mediaType="embed";

    const confirmedRatio=
      mediaAspectCache.get(id)?.source==="iframe-content-rect"
        ?cachedMediaAspect(id,{verifiedOnly:true})
        :0;
    const metaRatio=mediaAspectFromMeta(meta||{});
    const primedRatio=cachedPrimedAspect(id);

    // Reuse only YouTube's own previous geometry.
    const previousYoutubeRatio=
      current?.provider==="youtube"
        ?(
            validMediaAspect(current?.detectedRatio)||
            validMediaAspect(current?.ratio)
          )
        :0;
    const fallbackRatio=previousYoutubeRatio||16/9;

    const resolvedAspect=
      confirmedRatio||
      metaRatio||
      primedRatio||
      fallbackRatio;

    const kind=mediaLayoutKindFromRatio(resolvedAspect);

    if(meta?.id===id){
      currentMeta=meta;
      applyHeaderTint(meta);
    }else if(String(current?.id||"")!==id){
      currentMeta=null;
    }

    // media -> kind; MAIN / PiP / 2-column only consume it.
    current={
      id,
      kind,
      ratio:kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio,
      detectedRatio:resolvedAspect,
      label:meta?.title||"",
      provider:"youtube",
      type:"embed"
    };
    applyMediaLayoutSelection(kind,{relayout:true});

    // If this card/package did not carry a shape, ask the existing media-meta
    // resolver in the background. Playback starts immediately; this request
    // may only correct the shared shell's portrait/landscape geometry.
    if(!confirmedRatio&&!metaRatio&&!primedRatio){
      void primeMediaAspect(id).then(ratio=>{
        if(
          ratio&&
          currentMediaProvider==="youtube"&&
          current?.provider==="youtube"&&
          String(current?.id||"")===id
        ){
          commitCurrentAspect(id,ratio,{relayout:true,provider:"youtube"});
        }
      });
    }

    if(history==="push"){
      syncVideoDocumentIdentity({push:true});
    }else if(history==="replace"){
      syncVideoDocumentIdentity({push:false});
    }else{
      syncVideoDocumentIdentity({push:false,write:false});
    }
    if(!currentMeta?.sourceAvatar){
      void hydrateCurrentSourceIdentity(id);
    }

    // PLAY IMMEDIATELY.
    // IMPORTANT on mobile Safari/PWA: if the YT player is already ready,
    // call loadVideoById/playVideo synchronously inside the user's click.
    // Deferring this through Promise.then() can lose the user-activation token
    // and leave the video paused until a second tap.
    pendingVideoId=id;
    let playedInGesture=false;

    if(ytPlayer&&ytPlayerReady){
      pendingVideoId="";
      try{
        ytPlayer.loadVideoById(id);
        ytPlayer.playVideo?.();
        playedInGesture=true;
      }catch{}
    }

    if(!playedInGesture){
      void ensureYoutubePlayer().then(playerApi=>{
        if(!playerApi||String(current?.id||"")!==id)return;
        if(!ytPlayerReady)return;

        pendingVideoId="";
        try{
          playerApi.loadVideoById(id);
          playerApi.playVideo?.();
        }catch{}
      });
    }

    // No per-click metadata resolve here. Package data paints instantly;
    // the real YouTube videoContentRect corrects shape after playback begins.
    return true;
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // Match YouTube's 1→4 column density instead of squeezing toward 5+ cards.
    // The reference layouts keep cards fairly generous: ~390px is the target,
    // ~300px is the lower bound, and a sparse row may stretch toward ~560px.
    const MIN=300;
    const TARGET=390;
    const MAX=560;
    const HARD_MAX=4;

    const maxCols=Math.min(
      HARD_MAX,
      Math.max(1,Math.floor((feedW+gap)/(MIN+gap)))
    );
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    const fallbackRatio=
      current?.kind==="portrait"
        ? VIDEOS.portrait.ratio
        : VIDEOS.landscape.ratio;
    const mediaRatio=
      validMediaAspect(current?.detectedRatio)||
      validMediaAspect(current?.ratio)||
      fallbackRatio;

    root.style.setProperty("--media-ratio",String(mediaRatio));
    root.style.setProperty(
      "--rail-black",
      current?.kind==="portrait"
        ? "var(--rail-black-portrait)"
        : "var(--rail-black-landscape)"
    );

    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(
      0,
      Math.round(top.offsetHeight || top.getBoundingClientRect().height || 0)
    );
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const contentTopGap=12;
    const fullH=Math.max(1,viewportH-topBoundary-contentTopGap-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    if(!root.style.getPropertyValue("--visible-top-boundary")){
      root.style.setProperty("--visible-top-boundary",topBoundary+"px");
    }
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP default SIZE follows the viewport; resize MIN is separate.
    // This avoids opening every phone at the hard minimum while still keeping
    // the same lower drag limit: landscape 170px, portrait 120px wide.
    const viewportW=Math.max(
      1,
      Math.round(document.documentElement.clientWidth || innerWidth || 1)
    );
    const mobilePip=viewportW<=656;
    const availableW=Math.max(1,viewportW-20);
    const availableH=Math.max(1,viewportH-20);

    const landscapeDragMin=Math.min(
      170,
      availableW,
      Math.max(1,Math.round(availableH*Math.max(1,mediaRatio)))
    );
    const portraitDragMin=Math.min(
      120,
      availableW,
      Math.max(1,Math.round(availableH*Math.max(.34,mediaRatio)))
    );

    const landscapeTarget=Math.round(viewportW*(mobilePip ? .54 : .36));
    const landscapeDefaultMin=mobilePip?190:240;
    const landscapeDefaultMax=mobilePip?300:360;
    const landscapeFitMax=Math.max(
      1,
      Math.min(availableW,Math.round(availableH*Math.max(1,mediaRatio)))
    );
    const pipLandscapeW=Math.max(
      Math.min(landscapeDragMin,landscapeFitMax),
      Math.min(
        landscapeFitMax,
        landscapeDefaultMax,
        Math.max(landscapeDefaultMin,landscapeTarget)
      )
    );

    const portraitTarget=Math.round(viewportW*(mobilePip ? .38 : .24));
    const portraitDefaultMin=mobilePip?136:160;
    const portraitDefaultMax=mobilePip?190:220;
    const portraitFitMax=Math.max(
      1,
      Math.min(availableW,Math.round(availableH*Math.max(.34,mediaRatio)))
    );
    const pipPortraitW=Math.max(
      Math.min(portraitDragMin,portraitFitMax),
      Math.min(
        portraitFitMax,
        portraitDefaultMax,
        Math.max(portraitDefaultMin,portraitTarget)
      )
    );
    const pipPortraitH=Math.max(1,Math.round(pipPortraitW/Math.max(.34,mediaRatio)));

    root.style.setProperty("--pip-landscape-w",Math.round(pipLandscapeW)+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    const pageW=viewportW;
    const pageEdge=viewportW<480?12:24;
    const cardGap=16;
    const mediaGap=16;
    root.style.setProperty("--feed-edge-gap",pageEdge+"px");
    root.style.setProperty("--layout-gap",mediaGap+"px");
    root.style.setProperty("--card-target-w","390px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(pageEdge*2));
      // Browse may expand responsively. Watch is always a single focused queue.
      const cols=hasCurrentMedia()
        ?1
        :(viewportW<=720?1:chooseCardColumns(feedW,cardGap));
      setFeedColumnCount(cols);
    }else{
      const contentW=Math.max(1,pageW-(pageEdge*2));
      const hasSelectedMedia=hasCurrentMedia();
      if(!hasSelectedMedia){
        setFeedColumnCount(chooseCardColumns(contentW,cardGap));
        return;
      }

      // Desktop 2-column order is MEDIA LEFT + FEED RIGHT. Keep the existing
      // width family; only the visual order changes. Media still fits by the REAL
      // cropped video height, so no title/chrome safe-zone estimation is needed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));
      const widthCap=Math.max(1,contentW-mediaGap-desiredFeedW);

      // Landscape MAIN shares the viewport with title/channel/quick actions.
      // Previously the video alone consumed fullH, so the info row and the last
      // action buttons were pushed below the visible bottom edge. Reserve a
      // compact 98px strip for that bar before deriving video width from height.
      const landscapeInfoReserve=
        current?.kind==="landscape"&&hasSelectedMedia ? 98 : 0;
      const playerFitH=Math.max(220,fullH-landscapeInfoReserve);
      const heightDrivenW=Math.max(1,Math.round(playerFitH*mediaRatio));
      const mediaW=Math.min(widthCap,heightDrivenW);

      const feedW=Math.max(1,contentW-mediaGap-mediaW);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      // Desktop watch uses the right side as a queue, not a competing grid.
      setFeedColumnCount(1);
    }
  }

  function escapeHtml(value=""){
    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");

  function videoTitleSlug(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[đĐ]/g,match=>match==="Đ"?"D":"d")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .replace(/-+/g,"-")
      .slice(0,88)
      .replace(/-+$/,"");
  }

  function routeVideoId(){
    const hash=decodeURIComponent(String(location.hash||""));
    const fromHash=hash.match(/(?:^|\/)watch\/.*?([A-Za-z0-9_-]{11})$/i)?.[1]||
      hash.match(/([A-Za-z0-9_-]{11})$/)?.[1]||
      "";
    if(fromHash)return fromHash;

    try{
      const legacy=new URLSearchParams(location.search).get("v")||"";
      if(/^[A-Za-z0-9_-]{11}$/.test(legacy))return legacy;
    }catch{}
    return "";
  }

  function historyVideoId(state=history.state){

  function videoHistoryState(id,title=""){
    return {

      title:String(title||"").trim(),
      scope:String(activePackageScope||""),
      feedMode:String(feedMode||"")
    };

  function canonicalVideoHash(id,title=""){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";

    const cleanTitle=String(title||"").trim();
    const slug=
      cleanTitle && cleanTitle.toLowerCase()!=="video"
        ? videoTitleSlug(cleanTitle)
        : "";

    return "#/watch/"+(slug?slug+"-":"")+id;
  }

  function syncVideoDocumentIdentity({push=false,write=true}={}){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const title=String(currentMeta?.title||current?.label||"").trim();
    const meaningfulTitle=title&&title.toLowerCase()!=="video"?title:"";
    document.title=meaningfulTitle?meaningfulTitle+" · 1988":"1988";
    if(!write)return;

    const stateId=historyVideoId();
    const routeId=routeVideoId();
    const existingId=stateId||routeId;
    const currentHash=String(location.hash||"");
    const hasCanonicalHash=/^#\/watch\//i.test(currentHash);

    // A direct/deep link is also a real video history entry. Keep its readable
    // slug while metadata is still loading, but mark the browser state now.
    if(
      existingId===id &&
      hasCanonicalHash &&
      !meaningfulTitle
    ){
      if(stateId!==id){
        history.replaceState(
          videoHistoryState(id,""),
          "",
          location.pathname+location.search+location.hash
        );
      }
      return;
    }

    const nextHash=canonicalVideoHash(id,meaningfulTitle);
    if(!nextHash)return;

    const nextUrl="/"+nextHash;
    const nextState=videoHistoryState(id,meaningfulTitle);

    // User-selected videos become separate browser-history entries.
    // Metadata/title refreshes only rewrite the current entry.
    if(push&&existingId!==id){
      history.pushState(nextState,"",nextUrl);
      return;
    }

    if(
      stateId!==id ||
      location.pathname!=="/" ||
      location.search ||
      currentHash!==nextHash
    ){
      history.replaceState(nextState,"",nextUrl);
    }
  }

  function navigateToVideo(id,meta=null,{replace=false}={}){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    const previousId=historyVideoId()||routeVideoId();
    const title=String(meta?.title||"").trim();
    const nextHash=canonicalVideoHash(id,title);
    if(!nextHash)return false;

    // The first media in this document establishes the current browser entry.
    // Every later user-selected media gets its own entry, so Back/Forward is
    // always video <-> video instead of falling into an empty same-page route.
    const state=videoHistoryState(id,title);
    if(replace||!previousId){
      history.replaceState(state,"","/"+nextHash);
    }else if(previousId!==id){
      history.pushState(state,"","/"+nextHash);
    }else{
      history.replaceState(state,"","/"+nextHash);
    }

    return playVideoId(id,meta,{history:"none"});
  }

  function metaForVideoId(id){

      relatedMetas.find(meta=>meta?.id===id)||
      [...packageCache.values()].flat().find(meta=>meta?.id===id)||
      null
