  function escapeHtml(value=""){
    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function videoTitleSlug(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[đĐ]/g,match=>match==="Đ"?"D":"d")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .replace(/-+/g,"-")
      .slice(0,88)
      .replace(/-+$/,"");
  }

  function routeVideoId(){
    const hash=decodeURIComponent(String(location.hash||""));
    const fromHash=hash.match(/(?:^|\/)watch\/.*?([A-Za-z0-9_-]{11})$/i)?.[1]||
      hash.match(/([A-Za-z0-9_-]{11})$/)?.[1]||
      "";
    if(fromHash)return fromHash;

    try{
      const legacy=new URLSearchParams(location.search).get("v")||"";
      if(/^[A-Za-z0-9_-]{11}$/.test(legacy))return legacy;
    }catch{}
    return "";
  }

  function historyVideoId(state=history.state){
    const id=String(state?.videoId||"").trim();
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
  }

  function videoHistoryState(id,title=""){
    return {
      yt1988:"video",
      videoId:String(id||"").trim(),
      title:String(title||"").trim(),
      scope:String(activePackageScope||""),
      feedMode:String(feedMode||"")
    };
  }

  function canonicalVideoHash(id,title=""){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";

    const cleanTitle=String(title||"").trim();
    const slug=
      cleanTitle && cleanTitle.toLowerCase()!=="video"
        ? videoTitleSlug(cleanTitle)
        : "";

    return "#/watch/"+(slug?slug+"-":"")+id;
  }

  function syncVideoDocumentIdentity({push=false,write=true}={}){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const title=String(currentMeta?.title||current?.label||"").trim();
    const meaningfulTitle=title&&title.toLowerCase()!=="video"?title:"";
    document.title=meaningfulTitle?meaningfulTitle+" · 1988":"1988";
    if(!write)return;

    const stateId=historyVideoId();
    const routeId=routeVideoId();
    const existingId=stateId||routeId;
    const currentHash=String(location.hash||"");
    const hasCanonicalHash=/^#\/watch\//i.test(currentHash);

    // A direct/deep link is also a real video history entry. Keep its readable
    // slug while metadata is still loading, but mark the browser state now.
    if(
      existingId===id &&
      hasCanonicalHash &&
      !meaningfulTitle
    ){
      if(stateId!==id){
        history.replaceState(
          videoHistoryState(id,""),
          "",
          location.pathname+location.search+location.hash
        );
      }
      return;
    }

    const nextHash=canonicalVideoHash(id,meaningfulTitle);
    if(!nextHash)return;

    const nextUrl="/"+nextHash;
    const nextState=videoHistoryState(id,meaningfulTitle);

    // User-selected videos become separate browser-history entries.
    // Metadata/title refreshes only rewrite the current entry.
    if(push&&existingId!==id){
      history.pushState(nextState,"",nextUrl);
      return;
    }

    if(
      stateId!==id ||
      location.pathname!=="/" ||
      location.search ||
      currentHash!==nextHash
    ){
      history.replaceState(nextState,"",nextUrl);
    }
  }

  function navigateToVideo(id,meta=null,{replace=false}={}){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    const previousId=historyVideoId()||routeVideoId();
    const title=String(meta?.title||"").trim();
    const nextHash=canonicalVideoHash(id,title);
    if(!nextHash)return false;

    // The first media in this document establishes the current browser entry.
    // Every later user-selected media gets its own entry, so Back/Forward is
    // always video <-> video instead of falling into an empty same-page route.
    const state=videoHistoryState(id,title);
    if(replace||!previousId){
      history.replaceState(state,"","/"+nextHash);
    }else if(previousId!==id){
      history.pushState(state,"","/"+nextHash);
    }else{
      history.replaceState(state,"","/"+nextHash);
    }

    return playVideoId(id,meta,{history:"none"});
  }

  function metaForVideoId(id){
    id=String(id||"").trim();
    return (
      feedMetas.find(meta=>meta?.id===id)||
      relatedMetas.find(meta=>meta?.id===id)||
      [...packageCache.values()].flat().find(meta=>meta?.id===id)||
      null
    );
  }

  function openVideoFromLocation(state=history.state){
    const id=historyVideoId(state)||routeVideoId();
    if(!id){
      // Compatibility with legacy empty app entries created by older builds.
      // Do not leave the same video on screen under a route with no video.
      if(String(current?.id||"")){
        queueMicrotask(()=>history.back());
      }
      return false;
    }
    if(id===String(current?.id||""))return false;

    const meta=metaForVideoId(id);
    // Browser Back/Forward owns the selected entry. Replay it only; never
    // create or replace history while traversing.
    if(!playVideoId(id,meta,{history:"none"}))return false;
    renderCurrentInfo();
    loadCurrentVideoMeta();
    schedulePip();
    return true;
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    const videoWidth=Number(row?.videoWidth)||0;
    const videoHeight=Number(row?.videoHeight)||0;
    const genericWidth=Number(row?.width)||0;
    const genericHeight=Number(row?.height)||0;
    const isShort=row?.isShort===true||row?.is_short===true;
    const aspectRatio=validMediaAspect(
      (isShort?9/16:0)||
      Number(row?.aspectRatio)||
      Number(row?.videoAspectRatio)||
      (
        videoWidth>0&&videoHeight>0
          ?videoWidth/videoHeight
          :0
      )||
      (
        genericWidth>0&&genericHeight>0
          ?genericWidth/genericHeight
          :0
      )
    );
    const normalized={
      ...meta,
      provider:"youtube",
      type:"embed",
      verified:cardVerified(row),
      isShort,
      videoWidth,
      videoHeight,
      aspectRatio,
      mediaKind:String(row?.mediaKind||""),
      downloadVideoUrl:String(
        row?.downloadVideoUrl||
        row?.videoDownloadUrl||
        row?.mp4Url||
        row?.downloads?.mp4||
        row?.download?.video||
        ""
      ).trim(),
      downloadAudioUrl:String(
        row?.downloadAudioUrl||
        row?.audioDownloadUrl||
        row?.mp3Url||
        row?.downloads?.mp3||
        row?.download?.audio||
        ""
      ).trim(),
      _aspectVerified:
        row?._aspectVerified===true||
        (videoWidth>0&&videoHeight>0)||
        isShort,
      _aspectSource:String(row?.aspectSource||row?._aspectSource||"")
    };

    const canonicalSource=channelLibraryEntry("youtube",normalized?.sourceId);
    if(canonicalSource){
      const canonicalAvatar=String(
        canonicalSource?.avatar?.url||
        canonicalSource?.avatar?.storedUrl||
        canonicalSource?.avatar?.sourceUrl||
        ""
      ).trim();
      if(canonicalSource?.name)normalized.sourceName=String(canonicalSource.name).trim();
      if(canonicalAvatar)normalized.sourceAvatar=canonicalAvatar;
      if(canonicalSource?.verified===true)normalized.verified=true;
      normalized.sourceVerified=canonicalSource?.verified===true;
      normalized.sourceStats=
        canonicalSource?.stats&&typeof canonicalSource.stats==="object"
          ?canonicalSource.stats
          :{};
      normalized.sourceSubscribers=
        canonicalSource?.stats?.subscriberText||
        canonicalSource?.stats?.subscribers||
        normalized?.sourceSubscribers||
        "";
    }

    queueYoutubeChannelDirectory(normalized,"video-metadata");
    return normalized;
  }

  function mergeSelectedMeta(base={},supplemental={}){
    const keep=(key)=>{
      const value=base?.[key];
      return value!==undefined&&value!==null&&value!=="";
    };

    // Supplemental data fills gaps; only meaningful selected-card fields
    // are protected below. Empty strings from the old card must not erase
    // sourceId/avatar/channel metadata returned by the video lookup.
    const merged={...base,...supplemental};

    // The selected package/search card is the visible contract.
    // Direct video lookup may fill gaps, but must not rename/relabel it.
    for(const key of [
      "title","sourceName","sourceAvatar","thumbnail",
      "viewsLabel","publishedLabel","durationLabel",
      "isLive","type","verified","mediaKind","aspectRatio",
      "videoWidth","videoHeight","downloadVideoUrl","downloadAudioUrl",
      "_aspectVerified","_aspectSource"
    ]){
      if(keep(key))merged[key]=base[key];
    }

    return merged;
  }

  function applySourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const sourceId=String(identity?.sourceId||"").trim();
    const avatar=String(identity?.sourceAvatar||"").trim();
    const name=String(identity?.sourceName||"").trim();
    if(!id||(!sourceId&&!avatar&&!name))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta.id||"").trim()!==id)return;
      if(sourceId&&!meta.sourceId)meta.sourceId=sourceId;
      if(avatar&&!meta.sourceAvatar)meta.sourceAvatar=avatar;
      if(name&&!meta.sourceName)meta.sourceName=name;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(String(current?.id||"")===id){
      renderCurrentInfo();
      applyHeaderTint(currentMeta);
    }

    if(avatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;

        if(oldAvatar instanceof HTMLImageElement){
          const currentSrc=String(oldAvatar.getAttribute("src")||"").trim();
          if(currentSrc!==avatar)oldAvatar.src=avatar;
          return;
        }

        const next=document.createElement("img");
        next.className="row-avatar";
        next.alt="";
        next.src=avatar;
        oldAvatar.replaceWith(next);
      });
    }
    return true;
  }

  function localSourceIdentity(sourceId=""){
    sourceId=String(sourceId||"").trim();
    if(!sourceId)return {};

    const canonical=channelLibraryEntry("youtube",sourceId);
    const cached=sourceIdentityCache.get(sourceId)||{};
    let sourceName=String(canonical?.name||cached.sourceName||"").trim();
    let sourceAvatar=String(
      canonical?.avatar?.url||
      canonical?.avatar?.storedUrl||
      canonical?.avatar?.sourceUrl||
      cached.sourceAvatar||
      ""
    ).trim();
    let sourceVerified=canonical?.verified===true||cached?.sourceVerified===true;
    let sourceStats=canonical?.stats&&typeof canonical.stats==="object"
      ?canonical.stats
      :(cached?.sourceStats||{});
    let sourceHandle=String(canonical?.handle||cached?.sourceHandle||"").trim();
    let sourceProfileUrl=String(
      canonical?.profileUrl||cached?.sourceProfileUrl||""
    ).trim();

    // Source-state is the canonical channel directory and already carries
    // thumbnail URLs for selected/suggested channels. Use it before falling
    // back to a letter placeholder.
    const stateAvatar=String(sourceStateRemote?.avatars?.[sourceId]||"").trim();
    const stateSource=(Array.isArray(sourceStateRemote?.customSources)
      ?sourceStateRemote.customSources
      :[]
    ).find(row=>String(row?.id||"").trim()===sourceId);
    if(!sourceName)sourceName=String(stateSource?.name||"").trim();
    if(!sourceAvatar)sourceAvatar=stateAvatar||String(stateSource?.thumbnailUrl||"").trim();

    const pools=[
      currentMeta,
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat(),
      ...[...searchCache.values()].flat()
    ];

    for(const meta of pools){
      if(!meta||String(meta.sourceId||"").trim()!==sourceId)continue;
      if(!sourceName)sourceName=String(meta.sourceName||"").trim();
      if(!sourceAvatar)sourceAvatar=String(meta.sourceAvatar||"").trim();
      if(sourceName&&sourceAvatar)break;
    }

    const identity={
      sourceName,
      sourceAvatar,
      sourceVerified,
      sourceStats,
      sourceHandle,
      sourceProfileUrl
    };
    if(sourceAvatar||sourceName){
      sourceIdentityCache.set(sourceId,{
        ...(sourceIdentityCache.get(sourceId)||{}),
        ...identity
      });
    }
    return identity;
  }

  function sourceIdentityNameKey(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/^@/,"")
      .toLocaleLowerCase("vi-VN")
      .replace(/\s+/g," ")
      .trim();
  }

  function resolvedSourceIdentity(meta={}){
    let sourceId=String(meta?.sourceId||"").trim();
    let sourceName=String(meta?.sourceName||"").trim();
    let sourceAvatar=String(meta?.sourceAvatar||"").trim();

    if(sourceId){
      const direct=localSourceIdentity(sourceId);
      if(!sourceName)sourceName=String(direct?.sourceName||"").trim();
      if(!sourceAvatar)sourceAvatar=String(direct?.sourceAvatar||"").trim();
    }

    const nameKey=sourceIdentityNameKey(sourceName);
    if((!sourceAvatar||!sourceId)&&nameKey){
      const stateSources=Array.isArray(sourceStateRemote?.customSources)
        ?sourceStateRemote.customSources
        :[];
      const stateMatch=stateSources.find(row=>
        sourceIdentityNameKey(row?.name)===nameKey
      );
      if(stateMatch){
        if(!sourceId)sourceId=String(stateMatch?.id||"").trim();
        if(!sourceName)sourceName=String(stateMatch?.name||"").trim();
        if(!sourceAvatar){
          sourceAvatar=
            String(sourceStateRemote?.avatars?.[sourceId]||"").trim()||
            String(stateMatch?.thumbnailUrl||"").trim();
        }
      }

      const pools=[
        currentMeta,
        ...feedMetas,
        ...relatedMetas,
        ...[...packageCache.values()].flat(),
        ...[...searchCache.values()].flat(),
        ...youtubeEdgeLiveMetas
      ];
      for(const candidate of pools){
        if(!candidate||candidate===meta)continue;
        const candidateId=String(candidate?.sourceId||"").trim();
        const idMatch=sourceId&&candidateId===sourceId;
        const nameMatch=
          nameKey&&sourceIdentityNameKey(candidate?.sourceName)===nameKey;
        if(!idMatch&&!nameMatch)continue;
        if(!sourceId)sourceId=candidateId;
        if(!sourceName)sourceName=String(candidate?.sourceName||"").trim();
        if(!sourceAvatar)sourceAvatar=String(candidate?.sourceAvatar||"").trim();
        if(sourceId&&sourceAvatar)break;
      }
    }

    if(sourceId&&(sourceName||sourceAvatar)){
      sourceIdentityCache.set(sourceId,{sourceName,sourceAvatar});
    }
    return {sourceId,sourceName,sourceAvatar};
  }

  function hydrateCurrentSourceIdentity(id=String(current?.id||"")){
    id=String(id||"").trim();
    if(!id||String(current?.id||"")!==id)return false;

    const meta=currentMeta||{};
    if(meta.sourceAvatar)return true;

    // UI stays read-only: resolve identity from source-state/packages already
    // downloaded in the browser, including a channel-name fallback when a
    // YouTube row omitted sourceId.
    const identity=resolvedSourceIdentity(meta);
    if(!identity?.sourceAvatar&&!identity?.sourceName)return false;
    if(identity?.sourceId&&!currentMeta?.sourceId)currentMeta.sourceId=identity.sourceId;
    return applySourceIdentityToVideo(id,identity);
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function packageMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const row of Array.isArray(items)?items:[]){
      const meta=cardMetaFromRow(row);
      if(!meta?.id||!meta?.title||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    primeMediaAspects(out,18);
    return out;
  }

  function oneLatestVideoPerChannel(metas=[]){
    const out=[];
    const seenChannels=new Set();
    for(const meta of Array.isArray(metas)?metas:[]){
      if(!meta?.id)continue;
      const sourceId=String(meta?.sourceId||"").trim();
      const sourceNameKey=sourceIdentityNameKey(meta?.sourceName||"");
      const channelKey=
        sourceId||
        (sourceNameKey?"name:"+sourceNameKey:"")||
        ("video:"+String(meta.id));
      if(seenChannels.has(channelKey))continue;
      seenChannels.add(channelKey);
      out.push(meta);
    }
    return out;
  }

  function startupVisibleMetas(scope,metas=[]){
    const base=Array.isArray(metas)?metas:[];
    return startupLandingActive&&scope===STARTUP_SCOPE
      ?oneLatestVideoPerChannel(base)
      :base;
  }

  function hydrateCurrentMetaFromPackage(metas=[]){
    const id=String(current?.id||"").trim();
    if(!id)return false;

    const packageMeta=(Array.isArray(metas)?metas:[])
      .find(meta=>String(meta?.id||"").trim()===id);
    if(!packageMeta)return false;

    // Package/server metadata is the canonical list record. A direct video
    // lookup may have filled extra fields, but it must not leave avatar/name
    // blank when the package already knows them.
    currentMeta=mergeSelectedMeta(
      packageMeta,
      currentMeta||{}
    );

    if(currentMeta?.title){
      current.label=currentMeta.title;
    }

    renderCurrentInfo();
    applyHeaderTint(currentMeta);
    syncVideoDocumentIdentity({push:false});
    return true;
  }

  async function loadPackageManifest(){
    try{
      const response=await fetchWithTimeout(
        PACKAGE_SYNC_URL,
        {cache:"no-store"},
        5000
      );
      if(!response.ok)throw new Error("package_manifest_"+response.status);
      const payload=await response.json();
      const next=
        payload?.manifest && typeof payload.manifest==="object"
          ? payload.manifest
          : null;
      if(!next)throw new Error("package_manifest_invalid");
      packageManifest=next;
      return packageManifest;
    }catch(_){
      // A failed/slow manifest request must never erase the last known hashes.
      return packageManifest;
    }
  }

  async function getPackage(scope,{force=false,expectedHash=""}={}){
    scope=String(scope||"").trim();
    expectedHash=String(expectedHash||"").trim();
    if(!scope)return [];

    if(!force&&packageCache.has(scope)){
      const cached=packageCache.get(scope);
      hydrateCurrentMetaFromPackage(cached);
      return cached;
    }
    if(packagePending.has(scope))return packagePending.get(scope);

    const task=(async()=>{
      try{
        const response=await fetchWithTimeout(
          PACKAGE_SYNC_URL+"?scope="+encodeURIComponent(scope),
          {cache:"no-store"},
          12000
        );
        if(!response.ok)throw new Error("package_"+scope+"_"+response.status);

        const payload=await response.json();
        const pkg=payload?.ok&&payload?.exists?payload?.package:null;
        const nextHash=String(pkg?.hash||"").trim();

        if(!pkg||!nextHash||!Array.isArray(pkg?.items)){
          throw new Error("package_"+scope+"_invalid");
        }
        if(expectedHash&&nextHash!==expectedHash){
          throw new Error("package_"+scope+"_hash_mismatch");
        }

        const metas=packageMetas(pkg.items);

        // Download + JSON parse + normalization must all finish before either
        // durable storage or RAM is replaced. IndexedDB writes are transactional.
        await writeStoredPackage(scope,pkg);

        packageCache.set(scope,metas);
        packageHashCache.set(scope,nextHash);

        // Important for deep links: the video may have started from
        // YT1988_API.video(id) before its source package finished loading.
        // As soon as any package containing this id arrives, hydrate the
        // canonical channel avatar/name/title from that package.
        hydrateCurrentMetaFromPackage(metas);

        return metas;
      }catch(_){
        if(packageCache.has(scope))return packageCache.get(scope)||[];
        return await restoreStoredPackage(scope);
      }finally{
        packagePending.delete(scope);
      }
    })();

    packagePending.set(scope,task);
    return task;
  }

  async function showPackageScope(scope,{hydrateLive=true}={}){
    scope=String(scope||"").trim()||"live";
    if(scope!=="live"){
      stopYoutubeLiveDemand();
      stopTikTokPreparedStreams();
    }
    activePackageScope=scope;
    try{localStorage.setItem(ACTIVE_SCOPE_KEY,scope)}catch{}
    feedMode="package";
    ++feedRequest;
    syncFeedHeader();

    // Tab/UI reads memory only for the first paint.
    // A tab is a menu/feed surface. Entering or restoring a tab must never
    // auto-select or auto-play its first media, including desktop two-column.
    const baseMetas=packageCache.get(scope)||[];

    if(scope==="live"){
      const provider=activeLiveProvider();
      const metas=liveMetasForProvider(provider,baseMetas);

      // YouTube LIVE and TikTok LIVE are separate feeds now. Never merge one
      // provider into the other and never wait for the other provider.
      feedMetas=metas;
      renderSampleContent();

      if(provider==="tiktok"){
        primeTikTokPlaybackNeighborhood();
      }else{
        stopTikTokPreparedStreams();
      }

      // Entering a provider's LIVE reads only that provider's Cloudflare
      // snapshot. Discovery rules remain provider-local as well.
      if(hydrateLive&&provider){
        void hydrateUnifiedLiveSnapshots({paint:true,provider}).finally(()=>{
          if(!liveDemandActive(provider))return;

          // Cloudflare YouTube LIVE is demand-only: opening the LIVE tab must
          // always paint the cached snapshot first, then start one fresh scan.
          // Without this, an old empty snapshot can leave YouTube LIVE blank
          // forever because the legacy Supabase LIVE scheduler is intentionally off.
          if(provider==="youtube"){
            const due=
              !youtubeEdgeLiveReady||
              youtubeEdgeLiveMetas.length===0||
              Date.now()-liveDiscoveryLastAt>=LIVE_DISCOVERY_MIN_GAP_MS;
            if(due){
              void refreshUnifiedLiveInBackground({
                force:true,
                reason:"tab-open",
                provider:"youtube"
              });
            }
          }
        });
      }
      return feedMetas;
    }

    feedMetas=startupVisibleMetas(scope,baseMetas);
    renderSampleContent();
    return feedMetas;
  }

  let packageSyncRunning=false;

  function paintSyncedPackage(scope,metas){
    if(feedMode!=="package"||activePackageScope!==scope)return;
    const base=Array.isArray(metas)?metas:[];
    feedMetas=scope==="live"
      ?liveMetasForProvider(activeLiveProvider(),base)
      :startupVisibleMetas(scope,base);
    renderSampleContent();
  }

  async function syncPreparedPackages(scopes=[],{refreshManifest=false}={}){
    if(packageSyncRunning)return false;
    packageSyncRunning=true;
    try{
      if(refreshManifest||!Object.keys(packageManifest).length){
        await loadPackageManifest();
      }

      const unique=[...new Set(
        ((Array.isArray(scopes)&&scopes.length)?scopes:Object.keys(packageManifest))
          .map(String)
          .filter(Boolean)
      )];

      const changedScopes=unique.filter(scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        if(!remoteHash)return false;
        return String(packageHashCache.get(scope)||"").trim()!==remoteHash;
      });

      await Promise.allSettled(changedScopes.map(async scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        const metas=await getPackage(scope,{
          force:true,
          expectedHash:remoteHash
        });
        if(String(packageHashCache.get(scope)||"")!==remoteHash)return false;

        // Each package swaps independently only after its complete download,
        // parse, hash check and normalization have finished.
        paintSyncedPackage(scope,metas);
        return true;
      }));
      return true;
    }finally{
      packageSyncRunning=false;
    }
  }

  function prefetchPackages(scopes=[]){
    setTimeout(()=>{ void syncPreparedPackages(scopes); },0);
  }

  // Demand-driven package checks:
  // - non-LIVE tabs do not poll in the background;
  // - open/focus/manual refresh checks only the active scope;
  // - LIVE gets a light check only while LIVE is actually visible;
  // - the server-side due gate/lease decides whether any upstream refresh work
  //   is necessary. Unchanged package hashes never trigger a package download.
  const PACKAGE_DEMAND_MIN_GAP_MS=15_000;
  const LIVE_ACTIVE_CHECK_MS=60_000;
  let packageDemandPending=null;
  let lastPackageDemandAt=0;

  async function requestPreparedRefresh(scopes=[]){
    const wanted=[...new Set(
      (Array.isArray(scopes)?scopes:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )];
    if(!wanted.length)return false;
    try{
      const response=await fetch(PACKAGE_REFRESH_URL,{
        method:"POST",
        cache:"no-store",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({scopes:wanted,client_check:true})
      });
      return response.ok;
    }catch(_){
      return false;
    }
  }

  async function checkPackagesOnDemand(scopes=[]){
    if(document.hidden)return false;
    const wanted=[...new Set(
      ((Array.isArray(scopes)&&scopes.length)?scopes:[activePackageScope])
        .map(value=>String(value||"").trim())
        .filter(value=>Boolean(value)&&value!=="live")
    )];
    if(!wanted.length)return false;
    if(packageDemandPending)return packageDemandPending;
    const now=Date.now();
    if(now-lastPackageDemandAt<PACKAGE_DEMAND_MIN_GAP_MS)return false;
    lastPackageDemandAt=now;

    packageDemandPending=(async()=>{
      // The refresh endpoint first performs its cheap due/lease check. When the
      // scope is not due it returns immediately and no YouTube/channel fetch is
      // started. The UI then compares the small manifest and downloads only a
      // package whose immutable hash actually changed.
      await requestPreparedRefresh(wanted);
      await loadPackageManifest();
      return syncPreparedPackages(wanted);
    })().finally(()=>{
      packageDemandPending=null;
    });
    return packageDemandPending;
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible"){
      stopYoutubeLiveDemand();
      return;
    }
    if(feedMode==="package"&&activePackageScope!=="live"){
      void checkPackagesOnDemand([activePackageScope]);
    }
  },{passive:true});

  addEventListener("focus",()=>{
    if(
      feedMode==="package"&&
      !document.hidden&&
      activePackageScope!=="live"
    ){
      void checkPackagesOnDemand([activePackageScope]);
    }
  },{passive:true});

  addEventListener("online",()=>{
    if(
      feedMode==="package"&&
      !document.hidden&&
      activePackageScope!=="live"
    ){
      void checkPackagesOnDemand([activePackageScope]);
    }
  },{passive:true});

  function activeLiveProvider(){
    if(activePlatformNav==="tiktok")return "tiktok";
    if(activePlatformNav==="youtube")return "youtube";
    return "";
  }

  function liveMetasForProvider(provider=activeLiveProvider(),youtubeFallback=[]){
    provider=String(provider||"").toLowerCase();
    if(provider==="tiktok"){
      return Array.isArray(tiktokLiveMetas)?tiktokLiveMetas:[];
    }
    if(provider==="youtube"){
      return currentYoutubeLiveMetas(
        Array.isArray(youtubeFallback)?youtubeFallback:[]
      );
    }
    return [];
  }

  function liveDemandActive(provider=""){
    if(
      document.hidden||
      feedMode!=="package"||
      activePackageScope!=="live"
    )return false;

    const active=activeLiveProvider();
    if(!active)return false;
    return !provider||active===String(provider).toLowerCase();
  }

  function stopYoutubeLiveDemand(){
    youtubeLiveScanSeq++;
    try{youtubeLiveAbortController?.abort()}catch{}
    youtubeLiveAbortController=null;
  }

  function restoreClientLiveSnapshot(){
    try{
      const saved=JSON.parse(localStorage.getItem(LIVE_CLIENT_SNAPSHOT_KEY)||"null");
      const age=Date.now()-Number(saved?.at||0);
      if(!saved||age<0||age>5*60_000||!Array.isArray(saved?.items))return false;

      const youtube=[];
      const tiktok=[];
      for(const meta of saved.items){
        if(!meta?.id||meta?.isLive!==true)continue;
        if(String(meta?.provider||"youtube").toLowerCase()==="tiktok")tiktok.push(meta);
        else youtube.push(meta);
      }
      if(youtube.length){
        youtubeEdgeLiveMetas=youtube;
        youtubeEdgeLiveReady=true;
      }
      if(tiktok.length){
        tiktokLiveMetas=tiktok;
        tiktokLiveReady=true;
      }
      return youtube.length>0||tiktok.length>0;
    }catch{
      return false;
    }
  }

  function saveClientLiveSnapshot(){
    if(!youtubeEdgeLiveReady&&!tiktokLiveReady)return false;
    try{
      const items=mergeUnifiedLiveFeed(packageCache.get("live")||[])
        .slice(0,36)
        .map(meta=>({...meta}));
      localStorage.setItem(
        LIVE_CLIENT_SNAPSHOT_KEY,
        JSON.stringify({at:Date.now(),items})
      );
      return true;
    }catch{
      return false;
    }
  }

  function normalizeLiveClientText(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/đ/g,"d")
      .replace(/[^a-z0-9]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function clientLiveBlockedKeywords(){
    const labels=
      sourceStateRemote?.sourceLabels&&
      typeof sourceStateRemote.sourceLabels==="object"&&
      !Array.isArray(sourceStateRemote.sourceLabels)
        ?sourceStateRemote.sourceLabels
        :{};
    return String(labels?.__live_keywords||"")
      .split(/[\r\n,;|]+/u)
      .map(value=>String(value||"").trim())
      .filter(Boolean);
  }

  function clientLiveKeywordBlocked(meta={}){
    const keywords=clientLiveBlockedKeywords();
    if(!keywords.length)return false;
    const haystack=normalizeLiveClientText(
      String(meta?.title||"")+" "+String(meta?.sourceName||"")
    );
    return keywords.some(keyword=>{
      const needle=normalizeLiveClientText(keyword);
      return !!needle&&haystack.includes(needle);
    });
  }

  function youtubeLiveSourceSelected(sourceId=""){
    sourceId=validSourceId(sourceId);
    if(!sourceId)return false;
    const selected=[
      ...(Array.isArray(sourceStateRemote?.selected)?sourceStateRemote.selected:[]),
      ...Object.values(
        sourceStateRemote?.scopedSelected&&typeof sourceStateRemote.scopedSelected==="object"
          ?sourceStateRemote.scopedSelected
          :{}
      ).flatMap(value=>Array.isArray(value)?value:[])
    ].map(String);
    return selected.includes(sourceId);
  }

  function liveGenericTitleSegment(value=""){
    const n=normalizeLiveClientText(value);
    return /^(?:live|live stream|livestream|truc tiep|dang truc tiep|item|video)$/.test(n);
  }

  function liveTitleSourceMatch(value="",sourceName=""){
    const a=normalizeLiveClientText(value);
    let b=normalizeLiveClientText(sourceName);
    if(!a||!b)return false;
    if(a===b)return true;
    b=b.replace(/\b(?:official|official channel|channel|news|television|media)\b/g," ")
      .replace(/\s+/g," ")
      .trim();
    return !!b&&a===b;
  }

  function cleanYoutubeLiveDisplayTitle(value="",sourceName=""){
    const original=String(value||"").replace(/\s+/g," ").trim();
    if(!original)return "";

    let title=original.replace(
      /^(?:[^A-Za-zÀ-ỹ0-9]*)(?:(?:trực\s*tiếp)|(?:live\s*stream)|livestream|live)\b(?:[^A-Za-zÀ-ỹ0-9]*)/iu,
      ""
    ).trim();

    const parts=title
      .split(/\s*[|•·]\s*|\s+[-–—]\s+|\s*:\s*/u)
      .map(part=>String(part||"").replace(/\s+/g," ").trim())
      .filter(Boolean);

    if(parts.length>1){
      const kept=parts.filter(part=>
        !liveGenericTitleSegment(part)&&
        !liveTitleSourceMatch(part,sourceName)
      );
      if(kept.length)title=kept.join(" | ");
    }

    if(
      liveGenericTitleSegment(title)||
      liveTitleSourceMatch(title,sourceName)
    )return "";
    return title;
  }

  function normalizeYoutubeEdgeLiveItem(item={}){
    const id=String(item?.videoId||item?.id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;

    const sourceId=String(
      item?.sourceId||
      item?.channelId||
      item?.uploaderId||
      ""
    ).trim();
    const sourceName=String(
      item?.sourceName||
      item?.channelName||
      item?.uploaderName||
      item?.uploader||
      ""
    ).trim();
    const sourceAvatar=String(
      item?.sourceAvatar||
      item?.avatar||
      item?.channelAvatar||
      item?.channelThumbnailUrl||
      item?.uploaderAvatar||
      item?.uploaderThumbnailUrl||
      ""
    ).trim();
    const thumbnail=String(
      item?.thumbnail||
      item?.thumbnailUrl||
      item?.cover||
      ""
    ).trim();
    const viewerCount=Math.max(
      0,
      Number(
        item?.viewerCount||
        item?.concurrentViewers||
        item?.liveViewers||
        0
      )||0
    );

    // Cloudflare is authoritative only for "what is LIVE now".
    // Keep edge metadata when it exists, but do not manufacture blank/default
    // fields that would overwrite the richer package/source metadata below.
    const normalized={
      id,
      provider:"youtube",
      title:cleanYoutubeLiveDisplayTitle(
        String(item?.title||item?.videoTitle||"").trim(),
        sourceName
      )||"Đang trực tiếp",
      sourceName,
      sourceId,
      sourceAvatar,
      thumbnail,
      livePreview:thumbnail,
      isLive:true,
      verified:item?.verified===true,
      viewerCount,
      viewsLabel:viewerCount?compactLiveViewerCount(viewerCount):"",
      publishedLabel:"Đang trực tiếp",
      durationLabel:"",
      duration:-1,
      uploaded:-1,
      mediaKind:"landscape",
      aspectRatio:16/9,
      videoWidth:0,
      videoHeight:0,
      _aspectVerified:false,
      _aspectSource:"youtube-live-edge",
      _liveOrigin:String(item?.origin||item?.liveOrigin||"cloudflare"),
      _liveItem:String(item?.itemType||item?.liveItem||""),
      checkedAt:Number(item?.checkedAt||0)
    };
    queueYoutubeChannelDirectory(normalized,"live-edge");
    return normalized;
  }

  function youtubeLiveSourceBlocked(sourceId=""){
    sourceId=validSourceId(sourceId);
    if(!sourceId)return false;

    const blocked=new Set(
      [
        ...(Array.isArray(sourceStateRemote?.blocked)?sourceStateRemote.blocked:[]),
        ...Object.values(
          sourceStateRemote?.scopedBlocked&&typeof sourceStateRemote.scopedBlocked==="object"
            ?sourceStateRemote.scopedBlocked
            :{}
        ).flatMap(value=>Array.isArray(value)?value:[])
      ].map(String)
    );
    return blocked.has(sourceId);
  }

  const youtubeLiveAvatarLookupDone=new Set();
  const youtubeLiveAvatarLookupPending=new Set();
  const youtubeLiveViewerLookupPending=new Set();
  const youtubeLiveViewerLookupAt=new Map();

  function parseLiveViewerCount(value=""){
    const raw=String(value||"").replace(/\s+/g," ").trim();
    if(!raw)return 0;
    const normalized=raw
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/đ/g,"d");
    if(!/(dang xem|watching)/.test(normalized))return 0;

    const match=normalized.match(/([\d.,]+)\s*(k|n|nghin|m|tr|trieu|b|ty)?/);
    if(!match)return 0;

    let numeric=String(match[1]||"");
    const suffix=String(match[2]||"");
    let n=0;
    if(suffix){
      n=Number(numeric.replace(",","."));
    }else{
      const parts=numeric.split(/[.,]/);
      numeric=parts.length===2&&parts[1].length===3
        ?parts.join("")
        :numeric.replace(",",".");
      n=Number(numeric);
    }
    if(!Number.isFinite(n)||n<=0)return 0;

    const factor=
      /^(k|n|nghin)$/.test(suffix)?1e3:
      /^(m|tr|trieu)$/.test(suffix)?1e6:
      /^(b|ty)$/.test(suffix)?1e9:
      1;
    return Math.max(0,Math.round(n*factor));
  }

  function liveViewerCountFromRow(row={},meta={}){
    const textCandidates=[
      row?.viewText,
      row?.short_view_count,
      row?.view_count_text,
      row?.viewsText,
      row?.liveViewCountText,
      row?.concurrentViewersText
    ];
    for(const value of textCandidates){
      const parsed=parseLiveViewerCount(value);
      if(parsed>0)return parsed;
    }

    const direct=Math.max(
      0,
      Number(row?.concurrentViewers)||0,
      Number(row?.viewerCount)||0,
      Number(row?.liveViewers)||0,
      Number(meta?.viewerCount)||0
    );
    if(direct>0)return direct;

    // For a row that is explicitly LIVE, providers commonly expose the
    // concurrent count through the generic views field.
    const live=
      row?.isLive===true||
      meta?.isLive===true||
      Number(row?.duration)===-1||
      Number(row?.uploaded)===-1;
    return live
      ?Math.max(0,Number(row?.views)||Number(row?.viewCount)||Number(meta?.views)||0)
      :0;
  }

  async function hydrateMissingYoutubeLiveViewers({paint=true}={}){
    if(
      !youtubeEdgeLiveReady||
      (!window.YT1988_API?.video&&!window.YT1988_API?.search)
    )return false;
    const now=Date.now();
    const missing=youtubeEdgeLiveMetas
      .filter(meta=>{
        const id=String(meta?.id||"").trim();
        const last=Number(youtubeLiveViewerLookupAt.get(id)||0);
        return (
          /^[A-Za-z0-9_-]{11}$/.test(id)&&
          Math.max(0,Number(meta?.viewerCount)||0)===0&&
          !youtubeLiveViewerLookupPending.has(id)&&
          now-last>45_000
        );
      })
      .slice(0,6);

    if(!missing.length)return false;

    await Promise.allSettled(missing.map(async meta=>{
      const id=String(meta.id);
      youtubeLiveViewerLookupPending.add(id);
      youtubeLiveViewerLookupAt.set(id,Date.now());
      try{
        let viewers=0;

        // Exact video lookup first: no fuzzy-title dependency and no chance of
        // reading the viewer number from a different LIVE result.
        if(window.YT1988_API?.video){
          try{
            const payload=await window.YT1988_API.video(id);
            const raw=dataRow(payload);
            const full=cardMetaFromRow(raw);
            viewers=liveViewerCountFromRow(raw,full);
          }catch{}
        }

        // Some upstream /streams responses omit concurrent viewers. Search is
        // a secondary source because a LIVE search card often carries "watching".
        if(!viewers&&window.YT1988_API?.search){
          const query=[
            String(meta?.sourceName||"").trim(),
            String(meta?.title||"").trim()
          ].filter(Boolean).join(" ");
          if(query){
            const payload=await window.YT1988_API.search(query,"videos");
            const rawRows=collectVideoRows(payload);
            const exact=rawRows.find(row=>
              String(row?.id||"").trim()===id&&
              row?.isLive===true
            );
            viewers=liveViewerCountFromRow(exact||{},exact||{});
          }
        }

        if(!viewers)return;

        meta.viewerCount=viewers;
        meta.viewsLabel=compactLiveViewerCount(viewers);
        const visible=feedMetas.find(row=>String(row?.id||"").trim()===id);
        if(visible){
          visible.viewerCount=viewers;
          visible.viewsLabel=meta.viewsLabel;
        }
      }catch{}
      finally{
        youtubeLiveViewerLookupPending.delete(id);
      }
    }));

    if(paint&&liveDemandActive("youtube")){
      const rows=document.getElementById("rows");
      if(rows)rows.dataset.renderSignature="";
      paintUnifiedLiveFromEdge("youtube");
    }
    return true;
  }

  async function hydrateMissingYoutubeLiveAvatars({paint=true}={}){
    // LIVE avatars used to come from the normal YouTube stream/package rows.
    // videoMeta is aspect-only, so it can never restore a missing channel icon.
    // Use the full video endpoint here, exactly like the pre-Cloudflare flow.
    const videoMetaApi=window.YT1988_API?.video;
    if(!youtubeEdgeLiveReady||!videoMetaApi)return false;

    const missing=youtubeEdgeLiveMetas
      .filter(meta=>{
        const id=String(meta?.id||"").trim();
        return (
          /^[A-Za-z0-9_-]{11}$/.test(id) &&
          (
            !String(meta?.sourceId||"").trim() ||
            !String(meta?.sourceName||"").trim() ||
            !String(meta?.sourceAvatar||"").trim()
          ) &&
          !youtubeLiveAvatarLookupDone.has(id) &&
          !youtubeLiveAvatarLookupPending.has(id)
        );
      })
      .slice(0,8);

    if(!missing.length)return false;

    await Promise.allSettled(missing.map(async meta=>{
      const id=String(meta.id);
      youtubeLiveAvatarLookupPending.add(id);
      try{
        const payload=await videoMetaApi(id);
        const full=cardMetaFromRow(dataRow(payload));
        const sourceId=String(full?.sourceId||"").trim();
        const sourceName=String(full?.sourceName||"").trim();
        const avatar=String(full?.sourceAvatar||"").trim();

        if(sourceId)meta.sourceId=sourceId;
        if(sourceName)meta.sourceName=sourceName;
        if(avatar)meta.sourceAvatar=avatar;

        if(meta.sourceId){
          sourceIdentityCache.set(String(meta.sourceId),{
            sourceName:String(meta.sourceName||""),
            sourceAvatar:String(meta.sourceAvatar||"")
          });
          queueYoutubeChannelDirectory(meta,"live-resolve");
        }
      }catch{}
      finally{
        youtubeLiveAvatarLookupPending.delete(id);
        youtubeLiveAvatarLookupDone.add(id);
      }
    }));

    if(paint&&liveDemandActive()){
      const rows=document.getElementById("rows");
      if(rows)rows.dataset.renderSignature="";
      paintUnifiedLiveFromEdge();
    }
    return true;
  }

  function currentYoutubeLiveMetas(fallback=[]){
    const base=Array.isArray(fallback)?fallback:[];

    const finalize=(items=[])=>items
      .map(meta=>{
        const sourceName=String(meta?.sourceName||"").trim();
        const cleaned=cleanYoutubeLiveDisplayTitle(meta?.title||"",sourceName);
        return {
          ...meta,
          title:cleaned||"Đang trực tiếp"
        };
      })
      .filter(meta=>!youtubeLiveSourceBlocked(meta?.sourceId))
      .filter(meta=>!clientLiveKeywordBlocked(meta))
      .sort((a,b)=>
        Number(youtubeLiveSourceSelected(b?.sourceId))-
        Number(youtubeLiveSourceSelected(a?.sourceId))
      );

    if(!youtubeEdgeLiveReady)return finalize(base);

    // Old LIVE package/source rows remain the metadata dictionary only.
    // Cloudflare decides the membership (which videoIds are LIVE now).
    const byId=new Map(base.map(meta=>[String(meta?.id||""),meta]));
    const bySource=new Map(
      base
        .filter(meta=>String(meta?.sourceId||"").trim())
        .map(meta=>[String(meta.sourceId).trim(),meta])
    );

    const next=youtubeEdgeLiveMetas
      .map(edge=>{
        const edgeSourceId=String(edge?.sourceId||"").trim();
        const fallbackMeta=
          byId.get(String(edge?.id||""))||
          (edgeSourceId?bySource.get(edgeSourceId):null)||
          {};

        const resolvedSourceId=
          edgeSourceId||
          String(fallbackMeta?.sourceId||"").trim();

        // Do not spread the sparse edge object over the package row: empty
        // sourceName/avatar/views used to erase the complete YouTube card.
        const fallbackLiveViewsLabel=
          /(?:đang xem|watching)/i.test(String(fallbackMeta?.viewsLabel||""))
            ?String(fallbackMeta.viewsLabel).trim()
            :"";
        const merged={
          ...fallbackMeta,
          id:String(edge?.id||fallbackMeta?.id||"").trim(),
          provider:"youtube",
          isLive:true,
          sourceId:resolvedSourceId,
          title:String(
            edge?.title||
            fallbackMeta?.title||
            edge?.sourceName||
            fallbackMeta?.sourceName||
            "Đang trực tiếp"
          ).trim(),
          sourceName:String(
            edge?.sourceName||
            fallbackMeta?.sourceName||
            ""
          ).trim(),
          sourceAvatar:String(
            edge?.sourceAvatar||
            fallbackMeta?.sourceAvatar||
            ""
          ).trim(),
          thumbnail:String(
            edge?.thumbnail||
            fallbackMeta?.thumbnail||
            ("https://i.ytimg.com/vi/"+encodeURIComponent(String(edge?.id||fallbackMeta?.id||""))+"/hqdefault.jpg")
          ).trim(),
          livePreview:String(
            edge?.livePreview||
            edge?.thumbnail||
            fallbackMeta?.livePreview||
            fallbackMeta?.thumbnail||
            ""
          ).trim(),
          viewerCount:Math.max(
            0,
            Number(edge?.viewerCount)||Number(fallbackMeta?.viewerCount)||0
          ),
          viewsLabel:String(
            edge?.viewsLabel||
            fallbackLiveViewsLabel||
            ""
          ).trim(),
          publishedLabel:"Đang trực tiếp",
          durationLabel:"",
          duration:-1,
          uploaded:-1,
          verified:edge?.verified===true||fallbackMeta?.verified===true,
          mediaKind:String(fallbackMeta?.mediaKind||"landscape"),
          aspectRatio:validMediaAspect(fallbackMeta?.aspectRatio)||16/9,
          videoWidth:Number(fallbackMeta?.videoWidth)||0,
          videoHeight:Number(fallbackMeta?.videoHeight)||0,
          _aspectVerified:fallbackMeta?._aspectVerified===true,
          _aspectSource:String(fallbackMeta?._aspectSource||"youtube-live-edge"),
          _liveOrigin:String(edge?._liveOrigin||fallbackMeta?._liveOrigin||"cloudflare"),
          _liveItem:String(edge?._liveItem||fallbackMeta?._liveItem||""),
          checkedAt:Number(edge?.checkedAt||fallbackMeta?.checkedAt||0)
        };

        const identity=resolvedSourceIdentity(merged);
        merged.sourceId=String(identity?.sourceId||merged.sourceId||"").trim();
        merged.sourceName=String(identity?.sourceName||merged.sourceName||"").trim();
        merged.sourceAvatar=String(identity?.sourceAvatar||merged.sourceAvatar||"").trim();
        merged.title=
          cleanYoutubeLiveDisplayTitle(merged.title,merged.sourceName)||
          "Đang trực tiếp";

        if(!merged.viewsLabel&&merged.viewerCount){
          merged.viewsLabel=compactLiveViewerCount(merged.viewerCount);
        }
        return merged;
      });

    // Client repeats the canonical filters as a safety net. That way a stale
    // edge snapshot cannot re-introduce a blocked channel/keyword while the
    // next Cloudflare scan is still pending.
    return finalize(next);
  }

  async function fetchYoutubeLiveSnapshot({signal=null}={}){
    const response=await fetch(
      YOUTUBE_LIVE_API+"/youtube/live-now?t="+Date.now(),
      {cache:"no-store",signal}
    );
    if(!response.ok)throw new Error("youtube_live_now_"+response.status);
    const payload=await response.json();
    return {
      ...payload,
      metas:(Array.isArray(payload?.items)?payload.items:[])
        .map(normalizeYoutubeEdgeLiveItem)
        .filter(Boolean)
    };
  }

  async function preloadStartupLiveLists(){
    if(startupLivePreloadPromise)return startupLivePreloadPromise;

    // Reuse a recent client snapshot immediately. The landing feed paints first,
    // then LIVE warms completely in the background so opening LIVE is instant.
    restoreClientLiveSnapshot();

    startupLivePreloadPromise=(async()=>{
      const youtubeSnapshotTask=fetchYoutubeLiveSnapshot()
        .then(snapshot=>{
          youtubeEdgeLiveMetas=snapshot.metas;
          youtubeEdgeLiveReady=true;
          return true;
        })
        .catch(()=>false);

      // The TikTok account rail needs profile/avatar metadata as well as the
      // realtime LIVE list. These requests never replace the visible landing feed.
      const tiktokLibraryTask=loadTikTokLatestVideoFeed({silent:true})
        .then(()=>true)
        .catch(()=>false);
      const tiktokLiveTask=refreshTikTokLiveFeed({paint:false,force:true})
        .then(()=>true)
        .catch(()=>false);

      await Promise.allSettled([
        youtubeSnapshotTask,
        tiktokLibraryTask,
        tiktokLiveTask
      ]);

      // A cached YouTube snapshot is not enough: do one complete edge scan after
      // the normal "latest" cards are already visible. Keep the old LIVE array
      // in memory until the full scan finishes, then atomically swap the result.
      await runYoutubeLiveCycle({
        force:true,
        paint:false,
        background:true
      }).catch(()=>false);

      queueDiscoveredYoutubeHydration(
        youtubeEdgeLiveMetas,
        "live-background"
      );
      await Promise.allSettled([
        hydrateMissingYoutubeLiveAvatars({paint:false}),
        hydrateMissingYoutubeLiveViewers({paint:false})
      ]);
      saveClientLiveSnapshot();

      // If the user entered LIVE while the warm scan was running, publish the
      // completed in-memory result immediately without another network wait.
      const provider=activeLiveProvider();
      if(liveDemandActive(provider)){
        paintUnifiedLiveFromEdge(provider);
        if(provider==="tiktok")primeTikTokPlaybackNeighborhood();
      }
      return true;
    })().finally(()=>{
      startupLivePreloadPromise=null;
      scheduleLiveBackgroundRefresh();
    });
    return startupLivePreloadPromise;
  }

  function scheduleLiveBackgroundRefresh(delay=LIVE_BACKGROUND_REFRESH_MS){
    clearTimeout(liveBackgroundTimer);
    liveBackgroundTimer=setTimeout(async()=>{
      if(document.hidden){
        scheduleLiveBackgroundRefresh(30_000);
        return;
      }

      await Promise.allSettled([
        runYoutubeLiveCycle({
          force:true,
          paint:false,
          background:true
        }),
        refreshTikTokLiveFeed({paint:false,force:true})
      ]);

      queueDiscoveredYoutubeHydration(
        youtubeEdgeLiveMetas,
        "live-background-refresh"
      );
      await Promise.allSettled([
        hydrateMissingYoutubeLiveAvatars({paint:false}),
        hydrateMissingYoutubeLiveViewers({paint:false})
      ]);
      saveClientLiveSnapshot();

      const provider=activeLiveProvider();
      if(liveDemandActive(provider)){
        paintUnifiedLiveFromEdge(provider);
        if(provider==="tiktok")primeTikTokPlaybackNeighborhood();
      }
      scheduleLiveBackgroundRefresh();
    },Math.max(1_000,Number(delay)||LIVE_BACKGROUND_REFRESH_MS));
  }

  function scheduleStartupLivePreload(){
    requestAnimationFrame(()=>{
      setTimeout(()=>{ void preloadStartupLiveLists(); },0);
    });
  }

  async function hydrateUnifiedLiveSnapshots({paint=true,provider=activeLiveProvider()}={}){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;
    if(unifiedLiveSnapshotPromise)return unifiedLiveSnapshotPromise;

    unifiedLiveSnapshotPromise=(async()=>{
      if(provider==="youtube"){
        try{
          const snapshot=await fetchYoutubeLiveSnapshot();
          if(!liveDemandActive("youtube"))return false;
          youtubeEdgeLiveMetas=snapshot.metas;
          youtubeEdgeLiveReady=true;
          if(paint)paintUnifiedLiveFromEdge("youtube");
          void hydrateMissingYoutubeLiveAvatars({paint});
          void hydrateMissingYoutubeLiveViewers({paint});
          saveClientLiveSnapshot();
          return true;
        }catch{
          return false;
        }
      }

      if(provider==="tiktok"){
        try{
          await refreshTikTokLiveFeed({paint:false,force:true});
          if(!liveDemandActive("tiktok")||!tiktokLiveReady)return false;
          if(paint)paintUnifiedLiveFromEdge("tiktok");
          primeTikTokPlaybackNeighborhood();
          saveClientLiveSnapshot();
          return true;
        }catch{
          return false;
        }
      }

      return false;
    })().finally(()=>{
      unifiedLiveSnapshotPromise=null;
    });
    return unifiedLiveSnapshotPromise;
  }

  async function refreshUnifiedLiveInBackground({force=true,reason="manual",provider=activeLiveProvider()}={}){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;
    if(unifiedLiveRefreshPromise)return unifiedLiveRefreshPromise;

    liveDiscoveryLastAt=Date.now();

    unifiedLiveRefreshPromise=(async()=>{
      if(provider==="youtube"){
        const ok=await runYoutubeLiveCycle({force,paint:false});
        if(!ok||!liveDemandActive("youtube"))return false;
        paintUnifiedLiveFromEdge("youtube");
        void hydrateMissingYoutubeLiveAvatars({paint:true});
        void hydrateMissingYoutubeLiveViewers({paint:true});
        saveClientLiveSnapshot();
        return true;
      }

      if(provider==="tiktok"){
        await refreshTikTokLiveFeed({paint:false,force:true});
        if(!tiktokLiveReady||!liveDemandActive("tiktok"))return false;
        paintUnifiedLiveFromEdge("tiktok");
        primeTikTokPlaybackNeighborhood();
        saveClientLiveSnapshot();
        return true;
      }

      return false;
    })().finally(()=>{
      unifiedLiveRefreshPromise=null;
    });
    return unifiedLiveRefreshPromise;
  }

  function paintUnifiedLiveFromEdge(provider=activeLiveProvider()){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;

    const next=liveMetasForProvider(
      provider,
      packageCache.get("live")||[]
    );
    feedMetas=next;

    // A discovered YouTube LIVE must become a canonical channel-library row
    // even when the old package never contained that channel/avatar.
    if(provider==="youtube"){
      queueDiscoveredYoutubeHydration(next,"live-discovery");
    }

    renderSampleContent();
    return true;
  }

  async function runYoutubeLiveCycle({force=false,paint=true,background=false}={}){
    const scanAllowed=()=>background?!document.hidden:liveDemandActive("youtube");
    if(!scanAllowed())return false;
    const now=Date.now();
    if(!force&&now-youtubeLiveLastCycleAt<LIVE_ACTIVE_CHECK_MS)return false;
    if(youtubeLiveScanPromise)return youtubeLiveScanPromise;

    const seq=++youtubeLiveScanSeq;
    const controller=new AbortController();
    youtubeLiveAbortController=controller;

    youtubeLiveScanPromise=(async()=>{
      try{
        let response=await fetch(
          YOUTUBE_LIVE_API+"/youtube/live-scan?start=1&t="+Date.now(),
          {cache:"no-store",signal:controller.signal}
        );
        if(!response.ok)throw new Error("youtube_live_scan_"+response.status);
        let state=await response.json();

        while(
          state?.ok===true&&
          state?.done!==true&&
          seq===youtubeLiveScanSeq&&
          scanAllowed()
        ){
          response=await fetch(
            YOUTUBE_LIVE_API+"/youtube/live-scan?t="+Date.now(),
            {cache:"no-store",signal:controller.signal}
          );
          if(!response.ok)throw new Error("youtube_live_scan_"+response.status);
          state=await response.json();
        }

        if(
          seq!==youtubeLiveScanSeq||
          !scanAllowed()||
          state?.done!==true
        )return false;

        const snapshot=await fetchYoutubeLiveSnapshot({signal:controller.signal});
        if(seq!==youtubeLiveScanSeq||!scanAllowed())return false;

        youtubeEdgeLiveMetas=snapshot.metas;
        youtubeEdgeLiveReady=true;
        youtubeLiveLastCycleAt=Date.now();
        liveDiscoveryLastAt=youtubeLiveLastCycleAt;

        // The previous LIVE array stays untouched until this full scan + snapshot
        // succeeds. Background warming therefore never clears the visible list
        // halfway through a refresh.
        if(paint&&liveDemandActive("youtube"))paintUnifiedLiveFromEdge("youtube");
        void hydrateMissingYoutubeLiveAvatars({paint:paint&&liveDemandActive("youtube")});
        void hydrateMissingYoutubeLiveViewers({paint:paint&&liveDemandActive("youtube")});
        return true;
      }catch(error){
        if(error?.name!=="AbortError"){
          console.warn("youtube_live_edge_failed",error);
        }
        return false;
      }finally{
        if(seq===youtubeLiveScanSeq)youtubeLiveAbortController=null;
        youtubeLiveScanPromise=null;
      }
    })();
    return youtubeLiveScanPromise;
  }

  function tiktokLiveId(handle=""){
    return "tiktok_live_"+String(handle||"").trim().toLowerCase();
  }

  function compactLiveViewerCount(value){
    const n=Math.max(0,Number(value)||0);
    if(!n)return "";
    if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M đang xem";
    if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K đang xem";
    return Math.round(n)+" đang xem";
  }

  function normalizeTikTokLiveItem(item={}){

    const avatar=String(item?.avatar||"").trim();

        (avatar&&previewRaw!==avatar&&coverRaw&&previewRaw!==coverRaw)

      id:tiktokLiveId(handle),
      provider:"tiktok",
      type:"live",

  function tiktokLibraryChannelFallbacks(meta={}){
    const channel=tiktokLibraryChannelForHandle(meta?.handle);
    if(!channel)return meta;

    const profile=channel?.profile&&typeof channel.profile==="object"?channel.profile:{};
    const canonical=channelLibraryEntry("tiktok",meta?.handle);
    const profileName=String(

    const profileAvatar=String(

      canonical?.avatar?.sourceUrl||

      profile?.avatar?.storedUrl||

    ).trim();

    const latest=(Array.isArray(channel?.videos)?channel.videos:[])
      .slice()
      .sort((a,b)=>Number(b?.createTime||0)-Number(a?.createTime||0))[0]||null;
    const latestCover=String(
      latest?.cover?.url||
      latest?.cover?.sourceUrl||
      latest?.cover?.storedUrl||
      ""
    ).trim();

    const handle=String(meta?.handle||"").trim().replace(/^@/,"");
    const currentName=String(meta?.sourceName||"").trim();
    if(
      profileName&&

        liveComparableName(currentName)===liveComparableName(handle)
      )
    ){

    if(!String(meta?.sourceAvatar||"").trim()&&profileAvatar){
      meta.sourceAvatar=profileAvatar;

    const currentCover=String(meta?.livePreview||meta?.thumbnail||"").trim();
    const coverLooksLikeAvatar=
      currentCover&&String(meta?.sourceAvatar||"").trim()&&
      currentCover===String(meta.sourceAvatar).trim();

    if((!meta?.hasLiveCover||coverLooksLikeAvatar)&&latestCover){
      meta.livePreview=latestCover;
      meta.thumbnail=latestCover;
    }

    meta.livePreviewFallbacks=[...new Set([
      ...(Array.isArray(meta?.livePreviewFallbacks)?meta.livePreviewFallbacks:[]),
      latestCover,
      String(meta?.sourceAvatar||"").trim(),
      profileAvatar
    ].filter(Boolean))];

    return meta;
  }

  function liveComparableName(value=""){

  const directMediaPreconnectOrigins=new Set();

  function preconnectDirectMedia(url=""){
    let parsed=null;
    try{parsed=new URL(String(url||""))}catch{}
    if(!parsed||!/^https?:$/.test(parsed.protocol))return false;
    const origin=parsed.origin;
    if(!origin||directMediaPreconnectOrigins.has(origin))return true;
    directMediaPreconnectOrigins.add(origin);

    const preconnect=document.createElement("link");
    preconnect.rel="preconnect";
    preconnect.href=origin;
    preconnect.crossOrigin="anonymous";
    document.head.appendChild(preconnect);

    const dns=document.createElement("link");
    dns.rel="dns-prefetch";
    dns.href="//"+parsed.host;
    document.head.appendChild(dns);

    return true;
  }

  const TIKTOK_PRELOAD_DESKTOP_MAX=12;
  const TIKTOK_PRELOAD_MOBILE_MAX=6;
  const TIKTOK_PRELOAD_TARGET_MS=900;
  const TIKTOK_PRELOAD_TARGET_BYTES=384*1024;
  const TIKTOK_PRELOAD_MAX_BYTES=768*1024;
  const TIKTOK_PRELOAD_KEEP_MS=45_000;
  const tiktokPreparedStreams=new Map();

  function tiktokPreloadLimit(){
    return (
      isAppleMobileBrowser()||
      matchMedia("(max-width:656px)").matches
    )
      ?TIKTOK_PRELOAD_MOBILE_MAX
      :TIKTOK_PRELOAD_DESKTOP_MAX;
  }

  function tiktokDirectStreamUrl(meta={}){
    if(String(meta?.provider||"").toLowerCase()!=="tiktok")return "";
    return String(meta?.streamUrl||"").trim();

  function warmTikTokDirectMeta(meta={}){
    if(String(meta?.provider||"").toLowerCase()!=="tiktok")return false;
    const preferred=
      isAppleMobileBrowser()&&String(meta?.hlsUrl||"").trim()
        ?String(meta.hlsUrl).trim()
        :String(meta?.streamUrl||meta?.hlsUrl||"").trim();
    if(preferred)preconnectDirectMedia(preferred);

    const preview=livePreviewForMeta(meta);
    if(preview)preconnectDirectMedia(preview);
    return Boolean(preferred);
  }

  function tiktokFlvPreloadState(){
    return {
      parsedOffset:0,
      headerOffset:-1,
      firstKeyframeTs:-1,
      latestVideoTs:-1
    };
  }

  function tiktokFlvRead24(bytes,offset){
    return (
      ((bytes[offset]||0)<<16)|
      ((bytes[offset+1]||0)<<8)|
      (bytes[offset+2]||0)
    )>>>0;
  }

  function inspectTikTokFlvPreload(bytes,state){
    if(!(bytes instanceof Uint8Array)||bytes.length<13)return false;

    if(state.headerOffset<0){
      if(
        bytes[0]!==0x46||
        bytes[1]!==0x4c||
        bytes[2]!==0x56
      )return bytes.length>=TIKTOK_PRELOAD_MAX_BYTES;

      const dataOffset=(
        ((bytes[5]||0)<<24)|
        ((bytes[6]||0)<<16)|
        ((bytes[7]||0)<<8)|
        (bytes[8]||0)
      )>>>0;
      state.headerOffset=Math.max(9,dataOffset)+4;
      state.parsedOffset=state.headerOffset;
    }

    let offset=Math.max(state.parsedOffset,state.headerOffset);
    while(offset+15<=bytes.length){
      const tagType=bytes[offset];
      const dataSize=tiktokFlvRead24(bytes,offset+1);
      const tagEnd=offset+11+dataSize+4;
      if(tagEnd>bytes.length)break;

      const timestamp=(
        ((bytes[offset+7]||0)<<24)|
        ((bytes[offset+4]||0)<<16)|
        ((bytes[offset+5]||0)<<8)|
        (bytes[offset+6]||0)
      )>>>0;

      if(tagType===9&&dataSize>0){
        state.latestVideoTs=timestamp;
        const videoHeader=bytes[offset+11]||0;
        const frameType=(videoHeader>>4)&0x0f;

        if(frameType===1&&state.firstKeyframeTs<0){
          state.firstKeyframeTs=timestamp;
        }
      }
      offset=tagEnd;
    }
    state.parsedOffset=offset;

    if(
      state.firstKeyframeTs>=0&&
      state.latestVideoTs>=state.firstKeyframeTs&&
      state.latestVideoTs-state.firstKeyframeTs>=TIKTOK_PRELOAD_TARGET_MS
    )return true;

    return bytes.length>=TIKTOK_PRELOAD_MAX_BYTES;
  }

  function tiktokPreparedBytes(session){
    if(!session?.chunks?.length)return new Uint8Array(0);
    const bytes=new Uint8Array(session.bytes);
    let offset=0;
    for(const chunk of session.chunks){
      bytes.set(new Uint8Array(chunk),offset);
      offset+=chunk.byteLength;
    }
    return bytes;
  }

  function closeTikTokPreparedSession(session){
    if(!session||session.claimed)return;
    session.closed=true;
    clearTimeout(session.expireTimer);
    try{session.reader?.cancel?.()}catch{}
    try{session.controller?.abort?.()}catch{}
    if(tiktokPreparedStreams.get(session.url)===session){
      tiktokPreparedStreams.delete(session.url);
    }
  }

  function stopTikTokPreparedStreams({exceptUrl=""}={}){
    exceptUrl=String(exceptUrl||"").trim();
    for(const session of [...tiktokPreparedStreams.values()]){
      if(exceptUrl&&session.url===exceptUrl)continue;
      closeTikTokPreparedSession(session);
    }
  }

  function takeTikTokPreparedSession(url=""){
    url=String(url||"").trim();
    const session=tiktokPreparedStreams.get(url);
    if(!session||session.closed)return null;

    tiktokPreparedStreams.delete(url);
    clearTimeout(session.expireTimer);
    session.claimed=true;
    return session;
  }

  function primeTikTokPreparedStream(meta={},options={}){
    warmTikTokDirectMeta(meta);
    if(isAppleMobileBrowser())return warmTikTokHlsAhead(meta);

    const url=tiktokDirectStreamUrl(meta);
    if(!url)return Promise.resolve(false);

    const existing=tiktokPreparedStreams.get(url);
    if(existing&&!existing.closed){
      return existing.task||Promise.resolve(existing.ready===true);
    }

    const session={
      id:String(meta?.id||""),
      url,
      sourceSig:String(meta?.sourceSig||""),
      createdAt:Date.now(),
      bytes:0,
      chunks:[],
      reader:null,
      controller:new AbortController(),
      parseState:tiktokFlvPreloadState(),
      claimed:false,
      closed:false,
      ready:false,
      failed:false,
      expireTimer:0,
      task:null
    };
    tiktokPreparedStreams.set(url,session);

    session.expireTimer=setTimeout(()=>{
      closeTikTokPreparedSession(session);
    },TIKTOK_PRELOAD_KEEP_MS);

    session.task=(async()=>{
      try{
        const response=await fetch(url,{
          method:"GET",
          mode:"cors",
          cache:"no-store",
          signal:session.controller.signal
        });
        if(!response.ok||!response.body)throw new Error("tiktok_preload_http_"+response.status);

        session.reader=response.body.getReader();

        while(!session.closed&&!session.claimed){
          const part=await session.reader.read();
          if(part.done){
            session.closed=true;
            break;
          }
          if(!part.value?.byteLength)continue;

          const copy=part.value.buffer.slice(
            part.value.byteOffset,
            part.value.byteOffset+part.value.byteLength
          );
          session.chunks.push(copy);
          session.bytes+=copy.byteLength;

          const bytes=tiktokPreparedBytes(session);
          const enough=
            inspectTikTokFlvPreload(bytes,session.parseState)||
            (
              session.parseState.firstKeyframeTs>=0&&
              session.bytes>=TIKTOK_PRELOAD_TARGET_BYTES
            );

          if(enough){
            session.ready=true;
            break;
          }
        }
        return session.ready||session.bytes>0;
      }catch(error){
        if(!session.claimed&&!session.closed){
          session.failed=true;
          closeTikTokPreparedSession(session);
        }
        return false;
      }
    })();

    return session.task;
  }

  const tiktokHlsWarmUntil=new Map();

  async function warmTikTokHlsAhead(meta={}){
    const manifestUrl=String(meta?.hlsUrl||"").trim();
    if(!manifestUrl)return false;

    const now=Date.now();
    if(Number(tiktokHlsWarmUntil.get(manifestUrl)||0)>now)return true;
    tiktokHlsWarmUntil.set(manifestUrl,now+20_000);
    preconnectDirectMedia(manifestUrl);

    try{
      const response=await fetch(manifestUrl,{
        mode:"cors",
        cache:"default"
      });
      if(!response.ok)return false;

      const text=await response.text();
      const lines=text
        .split(/\r?\n/)
        .map(line=>line.trim())
        .filter(line=>line&&!line.startsWith("#"))
        .slice(-3);

      const mediaUrls=lines
        .map(line=>{
          try{return new URL(line,manifestUrl).toString()}catch{return ""}
        })
        .filter(Boolean)
        .slice(0,2);

      await Promise.allSettled(mediaUrls.map(async url=>{
        preconnectDirectMedia(url);
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),1800);
        try{
          const r=await fetch(url,{
            mode:"cors",
            cache:"default",
            signal:controller.signal,
            headers:{"Range":"bytes=0-262143"}
          });
          const reader=r.body?.getReader?.();
          if(reader){
            await reader.read();
            try{await reader.cancel()}catch{}
          }
        }catch{}
        finally{
          clearTimeout(timer);
          try{controller.abort()}catch{}
        }
      }));
      return true;
    }catch{
      return false;
    }
  }

  function primeTikTokPlaybackNeighborhood(centerId="",radius=2){
    const liveList=(Array.isArray(feedMetas)?feedMetas:[])
      .filter(meta=>
        meta?.isLive===true&&
        String(meta?.provider||"").toLowerCase()==="tiktok"&&
        String(meta?.streamUrl||meta?.hlsUrl||"").trim()
      );
    if(!liveList.length){
      stopTikTokPreparedStreams();
      return false;
    }

    const limit=Math.min(tiktokPreloadLimit(),liveList.length);
    const selected=[];
    const center=liveList.findIndex(
      meta=>String(meta?.id||"")===String(centerId||"")
    );

    if(center>=0){
      selected.push(liveList[center]);
      for(let distance=1;selected.length<limit&&distance<liveList.length;distance++){
        const next=center+distance;
        const prev=center-distance;
        if(next<liveList.length)selected.push(liveList[next]);
        if(selected.length>=limit)break;
        if(prev>=0)selected.push(liveList[prev]);
      }
    }else{
      selected.push(...liveList.slice(0,limit));
    }

    const keepUrls=new Set(
      selected
        .map(meta=>tiktokDirectStreamUrl(meta))
        .filter(Boolean)
    );

    // Desktop keeps up to 12 real HTTP-FLV connections prepared. We only read
    // through the first decodable GOP (~1s, hard capped at 768 KiB) and then
    // pause the reader: no decoder and no continuous hidden playback.
    for(const meta of selected){
      void primeTikTokPreparedStream(meta,{
        priority:String(meta?.id||"")===String(centerId||"")
      });
    }

    for(const session of [...tiktokPreparedStreams.values()]){
      if(!keepUrls.has(session.url))closeTikTokPreparedSession(session);
    }
    return selected.length>0;
  }

  function primeVisibleLivePreviews(){
    if(feedMode!=="package"||activePackageScope!=="live"){
      stopTikTokPreparedStreams();
      return;
    }

    primeTikTokPlaybackNeighborhood();

    const rows=[...document.querySelectorAll(".row.live-card")];
    for(const row of rows){
      const rect=row.getBoundingClientRect();
      if(rect.bottom<0||rect.top>innerHeight*1.6)continue;
      const id=String(row.dataset.videoId||"");
      const meta=feedMetas.find(item=>String(item?.id||"")===id);

      const img=row.querySelector(".row-thumb img");
      const tried=new Set(
        String(img?.dataset?.tiktokThumbTried||"")

          .map(value=>value.trim())
          .filter(Boolean)
      );
      if(img&&!tried.has(preview)&&img.src!==preview)img.src=preview;
    }
  }

  class TikTokPreparedLoader{
    constructor(_seekHandler,_config){
      this._status=0;
      this._needStash=false;
      this._aborted=false;
      this._reader=null;
      this._controller=null;
      this._received=0;
      this.onContentLengthKnown=null;
      this.onURLRedirect=null;
      this.onDataArrival=null;
      this.onError=null;
      this.onComplete=null;
    }

    get type(){return "tiktok-prepared-fetch"}
    get status(){return this._status}
    get needStashBuffer(){return false}

    isWorking(){
      return this._status===1||this._status===2;
    }

    open(dataSource,_range){
      this._aborted=false;
      this._status=1;
      void this._open(dataSource);
    }

    async _open(dataSource){
      const url=String(dataSource?.url||"").trim();
      if(!url){
        this._fail("empty_url");
        return;
      }

      let byteStart=0;
      const prepared=takeTikTokPreparedSession(url);

      try{
        if(prepared){
          // If the user taps while the preload fetch is still in flight, claim
          // the exact same request. Its loop stops after the current read.
          try{await prepared.task}catch{}

          if(prepared.reader&&!prepared.failed){
            this._controller=prepared.controller;
            this._reader=prepared.reader;
            this._status=2;

            for(const chunk of prepared.chunks){
              if(this._aborted)return;
              const copy=chunk.slice(0);
              this._received+=copy.byteLength;
              this.onDataArrival?.(copy,byteStart,this._received);
              byteStart+=copy.byteLength;
            }
            prepared.chunks.length=0;
            prepared.bytes=0;

            await this._pump(byteStart);
            return;
          }
        }

        this._controller=new AbortController();
        const response=await fetch(url,{
          method:"GET",
          mode:"cors",
          cache:"no-store",
          signal:this._controller.signal
        });
        if(!response.ok||!response.body){
          this._fail("http_"+response.status,response.status);
          return;
        }
        if(response.url&&response.url!==url){
          this.onURLRedirect?.(response.url);
        }

        const contentLength=Number(response.headers.get("content-length")||0);
        if(contentLength>0)this.onContentLengthKnown?.(contentLength);

        this._reader=response.body.getReader();
        this._status=2;
        await this._pump(0);
      }catch(error){
        if(!this._aborted)this._fail(String(error?.message||error||"fetch_failed"));
      }
    }

    async _pump(byteStart=0){
      while(!this._aborted&&this._reader){
        const part=await this._reader.read();
        if(part.done){
          this._status=4;
          this.onComplete?.(0,Math.max(0,byteStart-1));
          return;
        }
        if(!part.value?.byteLength)continue;

        const copy=part.value.buffer.slice(
          part.value.byteOffset,
          part.value.byteOffset+part.value.byteLength
        );
        this._received+=copy.byteLength;
        this.onDataArrival?.(copy,byteStart,this._received);
        byteStart+=copy.byteLength;
      }
    }

    _fail(message,code=0){
      this._status=3;
      this.onError?.("Exception",{
        code:Number(code)||0,
        msg:String(message||"tiktok_loader_error")
      });
    }

    abort(){
      this._aborted=true;
      this._status=0;
      try{this._reader?.cancel?.()}catch{}
      try{this._controller?.abort?.()}catch{}
      this._reader=null;
      this._controller=null;
    }

    destroy(){
      this.abort();
      this.onContentLengthKnown=null;
      this.onURLRedirect=null;
      this.onDataArrival=null;
      this.onError=null;
      this.onComplete=null;
    }
  }

  function mergeUnifiedLiveFeed(youtubeFallback=[]){

    const seen=new Set(youtube.map(meta=>String(meta?.id||"")));
