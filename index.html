  }

  function openVideoFromLocation(state=history.state){
    const id=historyVideoId(state)||routeVideoId();
    if(!id){
      // Compatibility with legacy empty app entries created by older builds.
      // Do not leave the same video on screen under a route with no video.
      if(String(current?.id||"")){
        queueMicrotask(()=>history.back());
      }
      return false;
    }
    if(id===String(current?.id||""))return false;

    const meta=metaForVideoId(id);
    // Browser Back/Forward owns the selected entry. Replay it only; never
    // create or replace history while traversing.
    if(!playVideoId(id,meta,{history:"none"}))return false;
    returnPlayerToMainStage();
    layout();
    if(!isTwoColumn())scrollPageToTop();
    renderCurrentInfo();
    loadCurrentVideoMeta();
    return true;
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    const videoWidth=Number(row?.videoWidth)||0;
    const videoHeight=Number(row?.videoHeight)||0;
    const genericWidth=Number(row?.width)||0;
    const genericHeight=Number(row?.height)||0;
    const isShort=row?.isShort===true||row?.is_short===true;
    const aspectRatio=validMediaAspect(
      (isShort?9/16:0)||
      Number(row?.aspectRatio)||
      Number(row?.videoAspectRatio)||
      (
        videoWidth>0&&videoHeight>0
          ?videoWidth/videoHeight
          :0
      )||
      (
        genericWidth>0&&genericHeight>0
          ?genericWidth/genericHeight
          :0
      )
    );
    const liveViewerCount=Math.max(
      0,
      Number(row?.viewerCount)||
      Number(row?.concurrentViewers)||
      0
    );
    const normalized={
      ...meta,
      provider:"youtube",
      type:"embed",
      verified:cardVerified(row),
      isShort,
      videoWidth,
      videoHeight,
      aspectRatio,
      mediaKind:String(row?.mediaKind||""),
      downloadVideoUrl:String(
        row?.downloadVideoUrl||
        row?.videoDownloadUrl||
        row?.mp4Url||
        row?.downloads?.mp4||
        row?.download?.video||
        ""
      ).trim(),
      downloadAudioUrl:String(
        row?.downloadAudioUrl||
        row?.audioDownloadUrl||
        row?.mp3Url||
        row?.downloads?.mp3||
        row?.download?.audio||
        ""
      ).trim(),
      _aspectVerified:
        row?._aspectVerified===true||
        (videoWidth>0&&videoHeight>0)||
        isShort,
      _aspectSource:String(row?.aspectSource||row?._aspectSource||""),
      viewerCount:liveViewerCount,
      viewsLabel:
        row?.isLive===true&&liveViewerCount>0
          ?compactLiveViewerCount(liveViewerCount)
          :String(meta?.viewsLabel||"")
    };

    const canonicalSource=channelLibraryEntry("youtube",normalized?.sourceId);
    if(canonicalSource){
      const canonicalAvatar=String(
        canonicalSource?.avatar?.url||
        canonicalSource?.avatar?.storedUrl||
        canonicalSource?.avatar?.sourceUrl||
        ""
      ).trim();
      if(canonicalSource?.name)normalized.sourceName=String(canonicalSource.name).trim();
      if(canonicalAvatar)normalized.sourceAvatar=canonicalAvatar;
      if(canonicalSource?.verified===true)normalized.verified=true;
      normalized.sourceVerified=canonicalSource?.verified===true;
      normalized.sourceStats=
        canonicalSource?.stats&&typeof canonicalSource.stats==="object"
          ?canonicalSource.stats
          :{};
      normalized.sourceSubscribers=
        canonicalSource?.stats?.subscriberText||
        canonicalSource?.stats?.subscribers||
        normalized?.sourceSubscribers||
        "";
    }

    queueYoutubeChannelDirectory(normalized,"video-metadata");
    return normalized;
  }

  function mergeSelectedMeta(base={},supplemental={},options={}){
    const keep=(key)=>{
      const value=base?.[key];
      return value!==undefined&&value!==null&&value!=="";
    };

    const merged={...base,...supplemental};
    const authoritativeIdentity=options?.authoritativeIdentity===true;
    const baseSourceId=String(base?.sourceId||"").trim();
    const exactSourceId=String(supplemental?.sourceId||"").trim();
    const sourceConflict=
      authoritativeIdentity&&
      !!baseSourceId&&
      !!exactSourceId&&
      baseSourceId!==exactSourceId;

    // Prepared package metadata stays the visible contract in the normal case.
    for(const key of [
      "title","sourceName","sourceAvatar","thumbnail",
      "viewsLabel","publishedLabel","durationLabel",
      "isLive","type","verified","mediaKind","aspectRatio",
      "videoWidth","videoHeight","downloadVideoUrl","downloadAudioUrl",
      "_aspectVerified","_aspectSource"
    ]){
      if(keep(key))merged[key]=base[key];
    }

    if(authoritativeIdentity){
      // Exact metadata for the selected videoId is authoritative for channel
      // identity. This repairs a stale browser/package row that points the same
      // video to the wrong channel.
      for(const key of ["sourceId","sourceName","sourceAvatar","verified"]){
        const value=supplemental?.[key];
        if(value!==undefined&&value!==null&&value!=="")merged[key]=value;
      }

      const exactTitle=String(supplemental?.title||"").trim();
      const baseTitle=String(base?.title||"").trim();
      const baseSourceName=String(base?.sourceName||"").trim();
      const baseTitleIsSource=
        !!baseTitle&&
        !!baseSourceName&&
        normalizedSearchQuery(baseTitle)===normalizedSearchQuery(baseSourceName);

      if(exactTitle&&(sourceConflict||baseTitleIsSource||!baseTitle)){
        merged.title=exactTitle;
      }

      if(sourceConflict){
        if(String(supplemental?.thumbnail||"").trim()){
          merged.thumbnail=supplemental.thumbnail;
        }
        if(supplemental?.isLive!==undefined)merged.isLive=supplemental.isLive;
        if(String(supplemental?.viewsLabel||"").trim()){
          merged.viewsLabel=supplemental.viewsLabel;
        }
        if(Number(supplemental?.viewerCount)>0){
          merged.viewerCount=supplemental.viewerCount;
        }
      }
    }

    return merged;
  }

  function applySourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const sourceId=String(identity?.sourceId||"").trim();
    const avatar=String(identity?.sourceAvatar||"").trim();
    const name=String(identity?.sourceName||"").trim();
    if(!id||(!sourceId&&!avatar&&!name))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta.id||"").trim()!==id)return;
      if(sourceId&&!meta.sourceId)meta.sourceId=sourceId;
      if(avatar&&!meta.sourceAvatar)meta.sourceAvatar=avatar;
      if(name&&!meta.sourceName)meta.sourceName=name;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(String(current?.id||"")===id){
      renderCurrentInfo();
      applyHeaderTint(currentMeta);
    }

    if(avatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;

        if(oldAvatar instanceof HTMLImageElement){
          const currentSrc=String(oldAvatar.getAttribute("src")||"").trim();
          if(currentSrc!==avatar)oldAvatar.src=avatar;
          return;
        }

        const next=document.createElement("img");
        next.className="row-avatar";
        next.alt="";
        next.src=avatar;
        oldAvatar.replaceWith(next);
      });
    }
    return true;
  }

  function applyExactSourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const sourceId=String(identity?.sourceId||"").trim();
    const sourceName=String(identity?.sourceName||"").trim();
    const sourceAvatar=String(identity?.sourceAvatar||"").trim();
    if(!id||(!sourceId&&!sourceName&&!sourceAvatar))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta?.id||"").trim()!==id)return;
      if(sourceId)meta.sourceId=sourceId;
      if(sourceName)meta.sourceName=sourceName;
      if(sourceAvatar)meta.sourceAvatar=sourceAvatar;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(/^UC[A-Za-z0-9_-]+$/.test(sourceId)){
      const known=sourceIdentityCache.get(sourceId)||{};
      sourceIdentityCache.set(sourceId,{
        ...known,
        sourceName:sourceName||String(known?.sourceName||""),
        sourceAvatar:sourceAvatar||String(known?.sourceAvatar||"")
      });
      queueYoutubeChannelDirectory({
        provider:"youtube",
        sourceId,
        sourceName,
        sourceAvatar
      },"exact-video-correction");
    }

    if(sourceAvatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;
        if(oldAvatar instanceof HTMLImageElement){
          oldAvatar.src=sourceAvatar;
          return;
        }
        const next=document.createElement("img");
        next.className="row-avatar";
        next.alt="";
        next.src=sourceAvatar;
        oldAvatar.replaceWith(next);
      });
    }
    return true;
  }

  function localSourceIdentity(sourceId=""){
    sourceId=String(sourceId||"").trim();
    if(!sourceId)return {};

    const canonical=channelLibraryEntry("youtube",sourceId);
    const cached=sourceIdentityCache.get(sourceId)||{};
    let sourceName=String(canonical?.name||cached.sourceName||"").trim();
    let sourceAvatar=String(
      canonical?.avatar?.url||
      canonical?.avatar?.storedUrl||
      canonical?.avatar?.sourceUrl||
      cached.sourceAvatar||
      ""
    ).trim();
    let sourceVerified=canonical?.verified===true||cached?.sourceVerified===true;
    let sourceStats=canonical?.stats&&typeof canonical.stats==="object"
      ?canonical.stats
      :(cached?.sourceStats||{});
    let sourceHandle=String(canonical?.handle||cached?.sourceHandle||"").trim();
    let sourceProfileUrl=String(
      canonical?.profileUrl||cached?.sourceProfileUrl||""
    ).trim();

    // Source-state is the canonical channel directory and already carries
    // thumbnail URLs for selected/suggested channels. Use it before falling
    // back to a letter placeholder.
    const stateAvatar=String(sourceStateRemote?.avatars?.[sourceId]||"").trim();
    const stateSource=(Array.isArray(sourceStateRemote?.customSources)
      ?sourceStateRemote.customSources
      :[]
    ).find(row=>String(row?.id||"").trim()===sourceId);
    if(!sourceName)sourceName=String(stateSource?.name||"").trim();
    if(!sourceAvatar)sourceAvatar=stateAvatar||String(stateSource?.thumbnailUrl||"").trim();

    const pools=[
      currentMeta,
      ...feedMetas,
      ...relatedMetas,
      ...[...packageCache.values()].flat(),
      ...[...searchCache.values()].flat()
    ];

    for(const meta of pools){
      if(!meta||String(meta.sourceId||"").trim()!==sourceId)continue;
      if(!sourceName)sourceName=String(meta.sourceName||"").trim();
      if(!sourceAvatar)sourceAvatar=String(meta.sourceAvatar||"").trim();
      if(sourceName&&sourceAvatar)break;
    }

    const identity={
      sourceName,
      sourceAvatar,
      sourceVerified,
      sourceStats,
      sourceHandle,
      sourceProfileUrl
    };
    if(sourceAvatar||sourceName){
      sourceIdentityCache.set(sourceId,{
        ...(sourceIdentityCache.get(sourceId)||{}),
        ...identity
      });
    }
    return identity;
  }

  function sourceIdentityNameKey(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/^@/,"")
      .toLocaleLowerCase("vi-VN")
      .replace(/\s+/g," ")
      .trim();
  }

  function resolvedSourceIdentity(meta={}){
    let sourceId=String(meta?.sourceId||"").trim();
    let sourceName=String(meta?.sourceName||"").trim();
    let sourceAvatar=String(meta?.sourceAvatar||"").trim();

    if(sourceId){
      const direct=localSourceIdentity(sourceId);
      if(!sourceName)sourceName=String(direct?.sourceName||"").trim();
      if(!sourceAvatar)sourceAvatar=String(direct?.sourceAvatar||"").trim();
    }

    const nameKey=sourceIdentityNameKey(sourceName);
    if((!sourceAvatar||!sourceId)&&nameKey){
      const stateSources=Array.isArray(sourceStateRemote?.customSources)
        ?sourceStateRemote.customSources
        :[];
      const stateMatch=stateSources.find(row=>
        sourceIdentityNameKey(row?.name)===nameKey
      );
      if(stateMatch){
        if(!sourceId)sourceId=String(stateMatch?.id||"").trim();
        if(!sourceName)sourceName=String(stateMatch?.name||"").trim();
        if(!sourceAvatar){
          sourceAvatar=
            String(sourceStateRemote?.avatars?.[sourceId]||"").trim()||
            String(stateMatch?.thumbnailUrl||"").trim();
        }
      }

      const pools=[
        currentMeta,
        ...feedMetas,
        ...relatedMetas,
        ...[...packageCache.values()].flat(),
        ...[...searchCache.values()].flat(),
        ...youtubeEdgeLiveMetas
      ];
      for(const candidate of pools){
        if(!candidate||candidate===meta)continue;
        const candidateId=String(candidate?.sourceId||"").trim();
        const idMatch=sourceId&&candidateId===sourceId;
        const nameMatch=
          nameKey&&sourceIdentityNameKey(candidate?.sourceName)===nameKey;
        if(!idMatch&&!nameMatch)continue;
        if(!sourceId)sourceId=candidateId;
        if(!sourceName)sourceName=String(candidate?.sourceName||"").trim();
        if(!sourceAvatar)sourceAvatar=String(candidate?.sourceAvatar||"").trim();
        if(sourceId&&sourceAvatar)break;
      }
    }

    if(sourceId&&(sourceName||sourceAvatar)){
      sourceIdentityCache.set(sourceId,{sourceName,sourceAvatar});
    }
    return {sourceId,sourceName,sourceAvatar};
  }

  function hydrateCurrentSourceIdentity(id=String(current?.id||"")){
    id=String(id||"").trim();
    if(!id||String(current?.id||"")!==id)return false;

    const meta=currentMeta||{};
    if(meta.sourceAvatar)return true;

    // UI stays read-only: resolve identity from source-state/packages already
    // downloaded in the browser, including a channel-name fallback when a
    // YouTube row omitted sourceId.
    const identity=resolvedSourceIdentity(meta);
    if(!identity?.sourceAvatar&&!identity?.sourceName)return false;
    if(identity?.sourceId&&!currentMeta?.sourceId)currentMeta.sourceId=identity.sourceId;
    return applySourceIdentityToVideo(id,identity);
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function packageMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const row of Array.isArray(items)?items:[]){
      const meta=cardMetaFromRow(row);
      if(!meta?.id||!meta?.title||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    primeMediaAspects(out,18);
    return out;
  }

  function oneLatestVideoPerChannel(metas=[]){
    const out=[];
    const seenChannels=new Set();
    for(const meta of Array.isArray(metas)?metas:[]){
      if(!meta?.id)continue;
      const sourceId=String(meta?.sourceId||"").trim();
      const sourceNameKey=sourceIdentityNameKey(meta?.sourceName||"");
      const channelKey=
        sourceId||
        (sourceNameKey?"name:"+sourceNameKey:"")||
        ("video:"+String(meta.id));
      if(seenChannels.has(channelKey))continue;
      seenChannels.add(channelKey);
      out.push(meta);
    }
    return out;
  }

  function startupVisibleMetas(scope,metas=[]){
    const base=Array.isArray(metas)?metas:[];
    return startupLandingActive&&scope===STARTUP_SCOPE
      ?oneLatestVideoPerChannel(base)
      :base;
  }

  function hydrateCurrentMetaFromPackage(metas=[]){
    const id=String(current?.id||"").trim();
    if(!id)return false;

    const packageMeta=(Array.isArray(metas)?metas:[])
      .find(meta=>String(meta?.id||"").trim()===id);
    if(!packageMeta)return false;

    // Package/server metadata is the canonical list record. A direct video
    // lookup may have filled extra fields, but it must not leave avatar/name
    // blank when the package already knows them.
    currentMeta=mergeSelectedMeta(
      packageMeta,
      currentMeta||{}
    );

    if(currentMeta?.title){
      current.label=currentMeta.title;
    }

    renderCurrentInfo();
    applyHeaderTint(currentMeta);
    syncVideoDocumentIdentity({push:false});
    return true;
  }

  async function loadPackageManifest(){
    try{
      const response=await fetchWithTimeout(
        PACKAGE_SYNC_URL,
        {cache:"no-store"},
        5000
      );
      if(!response.ok)throw new Error("package_manifest_"+response.status);
      const payload=await response.json();
      const next=
        payload?.manifest && typeof payload.manifest==="object"
          ? payload.manifest
          : null;
      if(!next)throw new Error("package_manifest_invalid");
      packageManifest=next;
      return packageManifest;
    }catch(_){
      // A failed/slow manifest request must never erase the last known hashes.
      return packageManifest;
    }
  }

  async function getPackage(scope,{force=false,expectedHash=""}={}){
    scope=String(scope||"").trim();
    expectedHash=String(expectedHash||"").trim();
    if(!scope)return [];

    if(!force&&packageCache.has(scope)){
      const cached=packageCache.get(scope);
      hydrateCurrentMetaFromPackage(cached);
      return cached;
    }
    if(packagePending.has(scope))return packagePending.get(scope);

    const task=(async()=>{
      try{
        const response=await fetchWithTimeout(
          PACKAGE_SYNC_URL+"?scope="+encodeURIComponent(scope),
          {cache:"no-store"},
          12000
        );
        if(!response.ok)throw new Error("package_"+scope+"_"+response.status);

        const payload=await response.json();
        const pkg=payload?.ok&&payload?.exists?payload?.package:null;
        const nextHash=String(pkg?.hash||"").trim();

        if(!pkg||!nextHash||!Array.isArray(pkg?.items)){
          throw new Error("package_"+scope+"_invalid");
        }
        if(expectedHash&&nextHash!==expectedHash){
          throw new Error("package_"+scope+"_hash_mismatch");
        }

        const metas=packageMetas(pkg.items);

        // Download + JSON parse + normalization must all finish before either
        // durable storage or RAM is replaced. IndexedDB writes are transactional.
        await writeStoredPackage(scope,pkg);

        packageCache.set(scope,metas);
        packageHashCache.set(scope,nextHash);

        // Important for deep links: the video may have started from
        // YT1988_API.video(id) before its source package finished loading.
        // As soon as any package containing this id arrives, hydrate the
        // canonical channel avatar/name/title from that package.
        hydrateCurrentMetaFromPackage(metas);

        return metas;
      }catch(_){
        if(packageCache.has(scope))return packageCache.get(scope)||[];
        return await restoreStoredPackage(scope);
      }finally{
        packagePending.delete(scope);
      }
    })();

    packagePending.set(scope,task);
    return task;
  }

  async function ensurePreparedPackageReady(scope=""){
    scope=String(scope||"").trim();
    if(!scope)return [];

    if(packageCache.has(scope)){
      const cached=packageCache.get(scope)||[];
      if(cached.length||scope!=="live")return cached;

      // Recovery rule for LIVE: an old bad refresh could have persisted an
      // empty committed package in IndexedDB. LIVE is cheap to re-read, so an
      // empty local copy must re-check the current server package before paint.
      // This is still package-only I/O; the browser does no discovery/filtering.
      return getPackage(scope,{force:true});
    }

    const stored=await restoreStoredPackage(scope);
    if(packageCache.has(scope)){
      const cached=packageCache.get(scope)||stored||[];
      if(cached.length||scope!=="live")return cached;
      return getPackage(scope,{force:true});
    }

    // First install/private window may have no IndexedDB copy yet. Fetch only
    // the already-committed package; this never asks the UI to build/filter it.
    return getPackage(scope,{force:true});
  }

  async function showPackageScope(scope,{hydrateLive=true}={}){
    scope=String(scope||"").trim()||"live";
    if(scope!=="live"){
      stopYoutubeLiveDemand();
    }
    activePackageScope=scope;
    try{localStorage.setItem(ACTIVE_SCOPE_KEY,scope)}catch{}
    feedMode="package";
    ++feedRequest;
    syncFeedHeader();

    // Every tab is package-only. Usually the package is already in RAM because
    // startup preloads it. On a first install/private window, wait for the
    // committed package itself instead of rendering an empty feed.
    let baseMetas=packageCache.has(scope)
      ?(packageCache.get(scope)||[])
      :await ensurePreparedPackageReady(scope);

    // The user may have switched tabs while IndexedDB/network completed.
    if(feedMode!=="package"||activePackageScope!==scope)return feedMetas;

    if(scope==="live"){
      // 1988 rule: UI reads only the prepared LIVE package. Cloudflare may
      // discover LIVE channels, but its snapshot is never a browser feed.
      feedMetas=Array.isArray(baseMetas)?baseMetas:[];
      renderSampleContent();

      if(hydrateLive){
        void refreshUnifiedLiveInBackground({
          force:true,
          reason:"tab-open",
          provider:"youtube"
        });
        scheduleLiveBackgroundRefresh();
      }
      return feedMetas;
    }

    feedMetas=startupVisibleMetas(scope,baseMetas);
    renderSampleContent();

    // Every normal tab is stale-while-revalidate: show its committed package
    // first, then ask the server to rebuild only when that scope is due.
    setTimeout(()=>{ void checkPackagesOnDemand([scope]); },0);
    return feedMetas;
  }

  let packageSyncRunning=false;

  function paintSyncedPackage(scope,metas){
    if(feedMode!=="package"||activePackageScope!==scope)return;
    const base=Array.isArray(metas)?metas:[];
    // YouTube tab feeds, including LIVE, are already final server packages.
    // Never pass LIVE through a provider/client discovery layer here.
    feedMetas=startupVisibleMetas(scope,base);
    renderSampleContent();
  }

  async function syncPreparedPackages(scopes=[],{refreshManifest=false}={}){
    if(packageSyncRunning)return false;
    packageSyncRunning=true;
    try{
      if(refreshManifest||!Object.keys(packageManifest).length){
        await loadPackageManifest();
      }

      const unique=[...new Set(
        ((Array.isArray(scopes)&&scopes.length)?scopes:Object.keys(packageManifest))
          .map(String)
          .filter(Boolean)
      )];

      const changedScopes=unique.filter(scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        if(!remoteHash)return false;
        return String(packageHashCache.get(scope)||"").trim()!==remoteHash;
      });

      await Promise.allSettled(changedScopes.map(async scope=>{
        const remoteHash=String(packageManifest?.[scope]?.hash||"").trim();
        const metas=await getPackage(scope,{
          force:true,
          expectedHash:remoteHash
        });
        if(String(packageHashCache.get(scope)||"")!==remoteHash)return false;

        // Each package swaps independently only after its complete download,
        // parse, hash check and normalization have finished.
        paintSyncedPackage(scope,metas);
        return true;
      }));
      return true;
    }finally{
      packageSyncRunning=false;
    }
  }

  function prefetchPackages(scopes=[]){
    setTimeout(()=>{ void syncPreparedPackages(scopes); },0);
  }

  // Demand-driven package checks:
  // - non-LIVE tabs do not poll in the background;
  // - open/focus/manual refresh checks only the active scope;
  // - LIVE gets a light check only while LIVE is actually visible;
  // - the server-side due gate/lease decides whether any upstream refresh work
  //   is necessary. Unchanged package hashes never trigger a package download.
  const PACKAGE_DEMAND_MIN_GAP_MS=15_000;
  const LIVE_ACTIVE_CHECK_MS=60_000;
  const PACKAGE_WAKE_CACHE_KEY="1988-package-wake-at-v1";
  let packageDemandPending=null;
  let lastPackageDemandAt=0;
  let packageWakeAtByScope=(()=>{
    try{
      const saved=JSON.parse(localStorage.getItem(PACKAGE_WAKE_CACHE_KEY)||"{}");
      return saved&&typeof saved==="object"?saved:{};
    }catch{
      return {};
    }
  })();

  function packageClientWakeGap(scope=""){
    scope=String(scope||"").trim();
    if(scope==="live")return 60_000;
    if(scope==="latest")return 5*60_000;
    if(scope==="week")return 30*60_000;
    return 15*60_000;
  }

  function packageWakeDue(scope="",now=Date.now()){
    scope=String(scope||"").trim();
    if(!scope)return false;
    const last=Math.max(0,Number(packageWakeAtByScope?.[scope])||0);
    return !last||now-last>=packageClientWakeGap(scope);
  }

  function markPackageWake(scopes=[],at=Date.now()){
    for(const scope of Array.isArray(scopes)?scopes:[]){
      const key=String(scope||"").trim();
      if(key)packageWakeAtByScope[key]=at;
    }
    try{
      localStorage.setItem(PACKAGE_WAKE_CACHE_KEY,JSON.stringify(packageWakeAtByScope));
    }catch{}
  }

  async function requestPreparedRefresh(scopes=[]){
    const wanted=[...new Set(
      (Array.isArray(scopes)?scopes:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )];
    if(!wanted.length)return false;
    try{
      const response=await fetch(PACKAGE_REFRESH_URL,{
        method:"POST",
        cache:"no-store",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({scopes:wanted,client_check:true})
      });
      return response.ok;
    }catch(_){
      return false;
    }
  }

  async function checkPackagesOnDemand(scopes=[]){
    if(document.hidden)return false;
    const wanted=[...new Set(
      ((Array.isArray(scopes)&&scopes.length)?scopes:[activePackageScope])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )];
    if(!wanted.length)return false;
    if(packageDemandPending)return packageDemandPending;
    const now=Date.now();
    if(now-lastPackageDemandAt<PACKAGE_DEMAND_MIN_GAP_MS)return false;
    lastPackageDemandAt=now;

    packageDemandPending=(async()=>{
      const due=wanted.filter(scope=>packageWakeDue(scope,now));

      // Browser focus/visibility may happen many times. Manifest checks stay
      // cheap, but only wake the package builder at the same cadence as the
      // server's intended scope freshness. Explicit LIVE/source actions use
      // their dedicated wake paths and are not blocked by this cache.
      if(due.length){
        const woke=await requestPreparedRefresh(due);
        if(woke)markPackageWake(due,Date.now());
      }

      await loadPackageManifest();
      return syncPreparedPackages(wanted);
    })().finally(()=>{
      packageDemandPending=null;
    });
    return packageDemandPending;
  }

  function resumeVisibleDemand(reason="resume"){
    if(document.hidden||feedMode!=="package")return false;
    if(activePackageScope==="live"){
      const provider=activeLiveProvider();
      void refreshUnifiedLiveInBackground({
        force:false,
        reason,
        provider
      });
      scheduleLiveBackgroundRefresh();
      return true;
    }
    void checkPackagesOnDemand([activePackageScope]);
    return true;
  }

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible"){
      stopYoutubeLiveDemand();
      return;
    }
    resumeVisibleDemand("visibility");
  },{passive:true});

  addEventListener("focus",()=>{
    resumeVisibleDemand("focus");
  },{passive:true});

  addEventListener("online",()=>{
    resumeVisibleDemand("online");
  },{passive:true});

  function activeLiveProvider(){
    return "youtube";
  }

  function liveMetasForProvider(_provider=activeLiveProvider(),youtubeFallback=[]){
    // YouTube LIVE is package-only. Cloudflare discovery never becomes browser
    // feed data directly.
    return Array.isArray(youtubeFallback)?youtubeFallback:[];
  }

  function liveDemandActive(provider=""){
    if(
      document.hidden||
      feedMode!=="package"||
      activePackageScope!=="live"
    )return false;

    const active=activeLiveProvider();
    if(!active)return false;
    return !provider||active===String(provider).toLowerCase();
  }

  function stopYoutubeLiveDemand(){
    youtubeLiveScanSeq++;
    try{youtubeLiveAbortController?.abort()}catch{}
    youtubeLiveAbortController=null;
    clearTimeout(liveBackgroundTimer);
    liveBackgroundTimer=0;
  }

  function normalizeLiveClientText(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/đ/g,"d")
      .replace(/[^a-z0-9]+/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function clientLiveBlockedKeywords(){
    const labels=
      sourceStateRemote?.sourceLabels&&
      typeof sourceStateRemote.sourceLabels==="object"&&
      !Array.isArray(sourceStateRemote.sourceLabels)
        ?sourceStateRemote.sourceLabels
        :{};
    return String(labels?.__live_keywords||"")
      .split(/[\r\n,;|]+/u)
      .map(value=>String(value||"").trim())
      .filter(Boolean);
  }

  function clientLiveKeywordBlocked(meta={}){
    const keywords=clientLiveBlockedKeywords();
    if(!keywords.length)return false;
    const haystack=normalizeLiveClientText(
      String(meta?.title||"")+" "+String(meta?.sourceName||"")
    );
    return keywords.some(keyword=>{
      const needle=normalizeLiveClientText(keyword);
      return !!needle&&haystack.includes(needle);
    });
  }

  function youtubeLiveSourceSelected(sourceId=""){
    sourceId=validSourceId(sourceId);
    if(!sourceId)return false;
    const selected=[
      ...(Array.isArray(sourceStateRemote?.selected)?sourceStateRemote.selected:[]),
      ...Object.values(
        sourceStateRemote?.scopedSelected&&typeof sourceStateRemote.scopedSelected==="object"
          ?sourceStateRemote.scopedSelected
          :{}
      ).flatMap(value=>Array.isArray(value)?value:[])
    ].map(String);
    return selected.includes(sourceId);
  }

  function liveGenericTitleSegment(value=""){
    const n=normalizeLiveClientText(value);
    return /^(?:live|live stream|livestream|truc tiep|dang truc tiep|item|video)$/.test(n);
  }

  function liveTitleSourceMatch(value="",sourceName=""){
    const a=normalizeLiveClientText(value);
    let b=normalizeLiveClientText(sourceName);
    if(!a||!b)return false;
    if(a===b)return true;
    b=b.replace(/\b(?:official|official channel|channel|news|television|media)\b/g," ")
      .replace(/\s+/g," ")
      .trim();
    return !!b&&a===b;
  }

  function cleanYoutubeLiveDisplayTitle(value="",sourceName=""){
    const original=String(value||"").replace(/\s+/g," ").trim();
    if(!original)return "";

    let title=original.replace(
      /^(?:[^A-Za-zÀ-ỹ0-9]*)(?:(?:trực\s*tiếp)|(?:live\s*stream)|livestream|live)\b(?:[^A-Za-zÀ-ỹ0-9]*)/iu,
      ""
    ).trim();

    const parts=title
      .split(/\s*[|•·]\s*|\s+[-–—]\s+|\s*:\s*/u)
      .map(part=>String(part||"").replace(/\s+/g," ").trim())
      .filter(Boolean);

    if(parts.length>1){
      const kept=parts.filter(part=>
        !liveGenericTitleSegment(part)&&
        !liveTitleSourceMatch(part,sourceName)
      );
      if(kept.length)title=kept.join(" | ");
    }

    if(
      liveGenericTitleSegment(title)||
      liveTitleSourceMatch(title,sourceName)
    )return "";
    return title;
  }

  function normalizeYoutubeEdgeLiveItem(item={}){
    const id=String(item?.videoId||item?.id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;

    const sourceId=String(
      item?.sourceId||
      item?.channelId||
      item?.uploaderId||
      ""
    ).trim();
    const sourceName=String(
      item?.sourceName||
      item?.channelName||
      item?.uploaderName||
      item?.uploader||
      ""
    ).trim();
    const sourceAvatar=String(
      item?.sourceAvatar||
      item?.avatar||
      item?.channelAvatar||
      item?.channelThumbnailUrl||
      item?.uploaderAvatar||
      item?.uploaderThumbnailUrl||
      ""
    ).trim();
    const thumbnail=String(
      item?.thumbnail||
      item?.thumbnailUrl||
      item?.cover||
      ""
    ).trim();
    const viewerCount=Math.max(
      0,
      Number(
        item?.viewerCount||
        item?.concurrentViewers||
        item?.liveViewers||
        0
      )||0
    );

    // Cloudflare is authoritative only for "what is LIVE now".
    // Keep edge metadata when it exists, but do not manufacture blank/default
    // fields that would overwrite the richer package/source metadata below.
    const normalized={
      id,
      provider:"youtube",
      title:cleanYoutubeLiveDisplayTitle(
        String(item?.title||item?.videoTitle||"").trim(),
        sourceName
      )||"Đang trực tiếp",
      sourceName,
      sourceId,
      sourceAvatar,
      thumbnail,
      livePreview:thumbnail,
      isLive:true,
      verified:item?.verified===true,
      viewerCount,
      viewsLabel:viewerCount?compactLiveViewerCount(viewerCount):"",
      publishedLabel:"Đang trực tiếp",
      durationLabel:"",
      duration:-1,
      uploaded:-1,
      mediaKind:"landscape",
      aspectRatio:16/9,
      videoWidth:0,
      videoHeight:0,
      _aspectVerified:false,
      _aspectSource:"youtube-live-edge",
      _liveOrigin:String(item?.origin||item?.liveOrigin||"cloudflare"),
      _liveItem:String(item?.itemType||item?.liveItem||""),
      checkedAt:Number(item?.checkedAt||0)
    };
    queueYoutubeChannelDirectory(normalized,"live-edge");
    return normalized;
  }

  function youtubeLiveSourceBlocked(sourceId=""){
    sourceId=validSourceId(sourceId);
    if(!sourceId)return false;

    const blocked=new Set(
      [
        ...(Array.isArray(sourceStateRemote?.blocked)?sourceStateRemote.blocked:[]),
        ...Object.values(
          sourceStateRemote?.scopedBlocked&&typeof sourceStateRemote.scopedBlocked==="object"
            ?sourceStateRemote.scopedBlocked
            :{}
        ).flatMap(value=>Array.isArray(value)?value:[])
      ].map(String)
    );
    return blocked.has(sourceId);
  }

  const youtubeLiveAvatarLookupDone=new Set();
  const youtubeLiveAvatarLookupPending=new Set();
  const youtubeLiveViewerLookupPending=new Set();
  const youtubeLiveViewerLookupAt=new Map();

  function parseLiveViewerCount(value=""){
    const raw=String(value||"").replace(/\s+/g," ").trim();
    if(!raw)return 0;
    const normalized=raw
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toLowerCase()
      .replace(/đ/g,"d");
    if(!/(dang xem|watching)/.test(normalized))return 0;

    const match=normalized.match(/([\d.,]+)\s*(k|n|nghin|m|tr|trieu|b|ty)?/);
    if(!match)return 0;

    let numeric=String(match[1]||"");
    const suffix=String(match[2]||"");
    let n=0;
    if(suffix){
      n=Number(numeric.replace(",","."));
    }else{
      const parts=numeric.split(/[.,]/);
      numeric=parts.length===2&&parts[1].length===3
        ?parts.join("")
        :numeric.replace(",",".");
      n=Number(numeric);
    }
    if(!Number.isFinite(n)||n<=0)return 0;

    const factor=
      /^(k|n|nghin)$/.test(suffix)?1e3:
      /^(m|tr|trieu)$/.test(suffix)?1e6:
      /^(b|ty)$/.test(suffix)?1e9:
      1;
    return Math.max(0,Math.round(n*factor));
  }

  function liveViewerCountFromRow(row={},meta={}){
    const textCandidates=[
      row?.viewText,
      row?.short_view_count,
      row?.view_count_text,
      row?.viewsText,
      row?.liveViewCountText,
      row?.concurrentViewersText
    ];
    for(const value of textCandidates){
      const parsed=parseLiveViewerCount(value);
      if(parsed>0)return parsed;
    }

    const direct=Math.max(
      0,
      Number(row?.concurrentViewers)||0,
      Number(row?.viewerCount)||0,
      Number(row?.liveViewers)||0,
      Number(meta?.viewerCount)||0
    );
    if(direct>0)return direct;

    // For a row that is explicitly LIVE, providers commonly expose the
    // concurrent count through the generic views field.
    const live=
      row?.isLive===true||
      meta?.isLive===true||
      Number(row?.duration)===-1||
      Number(row?.uploaded)===-1;
    return live
      ?Math.max(0,Number(row?.views)||Number(row?.viewCount)||Number(meta?.views)||0)
      :0;
  }

  async function hydrateMissingYoutubeLiveViewers({paint=true}={}){
    if(
      !youtubeEdgeLiveReady||
      (!window.YT1988_API?.videoMeta&&!window.YT1988_API?.video&&!window.YT1988_API?.search)
    )return false;
    const now=Date.now();
    const missing=youtubeEdgeLiveMetas
      .filter(meta=>{
        const id=String(meta?.id||"").trim();
        const last=Number(youtubeLiveViewerLookupAt.get(id)||0);
        const needsViewer=Math.max(0,Number(meta?.viewerCount)||0)===0;
        const needsTitle=youtubeLiveTitleNeedsHydration(meta);
        return (
          /^[A-Za-z0-9_-]{11}$/.test(id)&&
          (needsViewer||needsTitle)&&
          !youtubeLiveViewerLookupPending.has(id)&&
          now-last>45_000
        );
      })
      .slice(0,8);

    if(!missing.length)return false;

    await Promise.allSettled(missing.map(async meta=>{
      const id=String(meta.id);
      youtubeLiveViewerLookupPending.add(id);
      youtubeLiveViewerLookupAt.set(id,Date.now());
      try{
        let viewers=0;
        let resolvedTitle="";

        // First use the exact-id oEmbed/search endpoint. It is much more
        // reliable for a newly discovered LIVE than searching by a generic
        // "Đang trực tiếp" title.
        if(window.YT1988_API?.videoMeta){
          try{
            const payload=await window.YT1988_API.videoMeta(id);
            const raw=dataRow(payload);
            const full=cardMetaFromRow(raw);
            resolvedTitle=cleanYoutubeLiveDisplayTitle(
              full?.title||raw?.title||"",
              String(meta?.sourceName||full?.sourceName||"").trim()
            );
            viewers=liveViewerCountFromRow(raw,full);
          }catch{}
        }

        // Full video is the identity fallback and sometimes also carries a
        // current viewer field.
        if((!viewers||!resolvedTitle)&&window.YT1988_API?.video){
          try{
            const payload=await window.YT1988_API.video(id);
            const raw=dataRow(payload);
            const full=cardMetaFromRow(raw);
            if(!resolvedTitle){
              resolvedTitle=cleanYoutubeLiveDisplayTitle(
                full?.title||raw?.title||"",
                String(meta?.sourceName||full?.sourceName||"").trim()
              );
            }
            if(!viewers)viewers=liveViewerCountFromRow(raw,full);
          }catch{}
        }

        // Search is the final viewer fallback because a LIVE search card often
        // carries a "watching now" count.
        if(!viewers&&window.YT1988_API?.search){
          const query=[
            String(meta?.sourceName||"").trim(),
            String(meta?.title||"").trim()
          ].filter(Boolean).join(" ");
          if(query){
            const payload=await window.YT1988_API.search(query,"videos");
            const rawRows=collectVideoRows(payload);
            const exact=rawRows.find(row=>
              String(row?.id||"").trim()===id&&
              row?.isLive===true
            );
            viewers=liveViewerCountFromRow(exact||{},exact||{});
          }
        }

        if(resolvedTitle){
          meta.title=resolvedTitle;
        }
        if(viewers>0){
          meta.viewerCount=viewers;
          meta.viewsLabel=compactLiveViewerCount(viewers);
        }
        if(!resolvedTitle&&viewers<=0)return;

        const visible=feedMetas.find(row=>String(row?.id||"").trim()===id);
        if(visible){
          if(resolvedTitle)visible.title=resolvedTitle;
          if(viewers>0){
            visible.viewerCount=viewers;
            visible.viewsLabel=meta.viewsLabel;
          }
        }
      }catch{}
      finally{
        youtubeLiveViewerLookupPending.delete(id);
      }
    }));

    if(paint&&liveDemandActive("youtube")){
      const rows=document.getElementById("rows");
      if(rows)rows.dataset.renderSignature="";
      paintUnifiedLiveFromEdge("youtube");
    }
    return true;
  }

  async function hydrateMissingYoutubeLiveAvatars({paint=true}={}){
    // LIVE avatars used to come from the normal YouTube stream/package rows.
    // videoMeta is aspect-only, so it can never restore a missing channel icon.
    // Use the full video endpoint here, exactly like the pre-Cloudflare flow.
    const videoMetaApi=window.YT1988_API?.video;
    if(!youtubeEdgeLiveReady||!videoMetaApi)return false;

    const missing=youtubeEdgeLiveMetas
      .filter(meta=>{
        const id=String(meta?.id||"").trim();
        return (
          /^[A-Za-z0-9_-]{11}$/.test(id) &&
          (
            !String(meta?.sourceId||"").trim() ||
            !String(meta?.sourceName||"").trim() ||
            !String(meta?.sourceAvatar||"").trim()
          ) &&
          !youtubeLiveAvatarLookupDone.has(id) &&
          !youtubeLiveAvatarLookupPending.has(id)
        );
      })
      .slice(0,8);

    if(!missing.length)return false;

    await Promise.allSettled(missing.map(async meta=>{
      const id=String(meta.id);
      youtubeLiveAvatarLookupPending.add(id);
      try{
        const payload=await videoMetaApi(id);
        const full=cardMetaFromRow(dataRow(payload));
        const sourceId=String(full?.sourceId||"").trim();
        const sourceName=String(full?.sourceName||"").trim();
        const avatar=String(full?.sourceAvatar||"").trim();

        if(sourceId)meta.sourceId=sourceId;
        if(sourceName)meta.sourceName=sourceName;
        if(avatar)meta.sourceAvatar=avatar;

        if(meta.sourceId){
          sourceIdentityCache.set(String(meta.sourceId),{
            sourceName:String(meta.sourceName||""),
            sourceAvatar:String(meta.sourceAvatar||"")
          });
          queueYoutubeChannelDirectory(meta,"live-resolve");
        }
      }catch{}
      finally{
        youtubeLiveAvatarLookupPending.delete(id);
        youtubeLiveAvatarLookupDone.add(id);
      }
    }));

    if(paint&&liveDemandActive()){
      const rows=document.getElementById("rows");
      if(rows)rows.dataset.renderSignature="";
      paintUnifiedLiveFromEdge();
    }
    return true;
  }

  function currentYoutubeLiveMetas(fallback=[]){
    // Legacy compatibility only. YouTube LIVE visible membership is exactly
    // the prepared package and is never filtered/merged with edge state here.
    return Array.isArray(fallback)?fallback:[];
  }

  async function fetchYoutubeLiveSnapshot({signal=null}={}){
    const response=await fetch(
      YOUTUBE_LIVE_API+"/youtube/live-now?t="+Date.now(),
      {cache:"no-store",signal}
    );
    if(!response.ok)throw new Error("youtube_live_now_"+response.status);
    const payload=await response.json();
    return {
      ...payload,
      metas:(Array.isArray(payload?.items)?payload.items:[])
        .map(normalizeYoutubeEdgeLiveItem)
        .filter(Boolean)
    };
  }

  async function syncPreparedScopeAfterWake(
    scope="",
    delays=[1200,3200,7000,14000],
    {wake=true}={}
  ){
    scope=String(scope||"").trim();
    if(!scope)return false;
    const before=String(packageHashCache.get(scope)||"");

    if(wake)await requestPreparedRefresh([scope]).catch(()=>false);

    for(const delay of delays){
      await new Promise(resolve=>setTimeout(resolve,delay));
      if(document.hidden)continue;
      await loadPackageManifest();
      await syncPreparedPackages([scope]);
      const after=String(packageHashCache.get(scope)||"");
      if(after&&after!==before)return true;
    }
    return false;
  }

  function scheduleLiveBackgroundRefresh(delay=LIVE_BACKGROUND_REFRESH_MS){
    clearTimeout(liveBackgroundTimer);
    liveBackgroundTimer=0;
    if(!liveDemandActive())return false;

    const provider=activeLiveProvider();
    liveBackgroundTimer=setTimeout(async()=>{
      if(!liveDemandActive(provider)){
        liveBackgroundTimer=0;
        return;
      }

      // Cheap sync is allowed only while LIVE is visible. YouTube still renders
      // only its prepared Supabase package.
      if(provider==="youtube"){
        await loadPackageManifest();
        await syncPreparedPackages(["live"]);
      }

      // Discovery is demand-only: no open LIVE tab means no scan. A visible
      // LIVE tab may start one shared logical scan about once per minute.
      if(Date.now()-liveDiscoveryLastAt>=LIVE_DISCOVERY_MIN_GAP_MS){
        await refreshUnifiedLiveInBackground({
          force:true,
          reason:"visible-live",
          provider
        });
      }

      if(liveDemandActive(provider))scheduleLiveBackgroundRefresh();
      else liveBackgroundTimer=0;
    },Math.max(1_000,Number(delay)||LIVE_BACKGROUND_REFRESH_MS));
    return true;
  }

  async function hydrateUnifiedLiveSnapshots({paint=true,provider=activeLiveProvider()}={}){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;
    if(unifiedLiveSnapshotPromise)return unifiedLiveSnapshotPromise;

    unifiedLiveSnapshotPromise=(async()=>{
      if(provider==="youtube"){
        try{
          await loadPackageManifest();
          await syncPreparedPackages(["live"]);
          if(!liveDemandActive("youtube"))return false;
          if(paint)paintSyncedPackage("live",packageCache.get("live")||[]);
          return true;
        }catch{
          return false;
        }
      }

      return false;
    })().finally(()=>{
      unifiedLiveSnapshotPromise=null;
    });
    return unifiedLiveSnapshotPromise;
  }

  async function refreshUnifiedLiveInBackground({force=true,reason="manual",provider=activeLiveProvider()}={}){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;
    if(unifiedLiveRefreshPromise)return unifiedLiveRefreshPromise;

    liveDiscoveryLastAt=Date.now();

    unifiedLiveRefreshPromise=(async()=>{
      if(provider==="youtube"){
        const scanned=await runYoutubeLiveCycle({force,paint:false});
        if(!liveDemandActive("youtube"))return false;

        // The edge Worker owns the LIVE package wake when its verified snapshot
        // changes. Browser only performs one catch-up wake on explicit tab-open;
        // recurring scans/focus/source edits wait for the hash instead of
        // creating duplicate yt1988-refresh requests.
        if(scanned){
          livePackageLastWakeAt=Date.now();
          await syncPreparedScopeAfterWake(
            "live",
            reason==="tab-open"?[800,2200,5000,10000]:[1200,3500,8000],
            {wake:reason==="tab-open"}
          );
        }else{
          await loadPackageManifest();
          await syncPreparedPackages(["live"]);
        }

        if(!liveDemandActive("youtube"))return false;
        paintSyncedPackage("live",packageCache.get("live")||[]);
        return true;
      }

      return false;
    })().finally(()=>{
      unifiedLiveRefreshPromise=null;
    });
    return unifiedLiveRefreshPromise;
  }

  function paintUnifiedLiveFromEdge(provider=activeLiveProvider()){
    provider=String(provider||"").toLowerCase();
    if(!liveDemandActive(provider))return false;

    if(provider==="youtube"){
      // Cloudflare never paints YouTube. Membership + link + title + channel
      // identity all come from the prepared Supabase package.
      paintSyncedPackage("live",packageCache.get("live")||[]);
      return true;
    }

    feedMetas=liveMetasForProvider(provider,[]);
    renderSampleContent();
    return true;
  }

  async function runYoutubeLiveCycle({force=false,paint=true,background=false}={}){
    const scanAllowed=()=>background?!document.hidden:liveDemandActive("youtube");
    if(!scanAllowed())return false;
    const now=Date.now();
    if(!force&&now-youtubeLiveLastCycleAt<LIVE_ACTIVE_CHECK_MS)return false;
    if(youtubeLiveScanPromise)return youtubeLiveScanPromise;

    const seq=++youtubeLiveScanSeq;
    const controller=new AbortController();
    youtubeLiveAbortController=controller;

    youtubeLiveScanPromise=(async()=>{
      try{
        let response=await fetch(
          YOUTUBE_LIVE_API+"/youtube/live-scan?start=1&t="+Date.now(),
          {cache:"no-store",signal:controller.signal}
        );
        if(!response.ok)throw new Error("youtube_live_scan_"+response.status);
        let state=await response.json();

        while(
          state?.ok===true&&
          state?.done!==true&&
          seq===youtubeLiveScanSeq&&
          scanAllowed()
        ){
          response=await fetch(
            YOUTUBE_LIVE_API+"/youtube/live-scan?t="+Date.now(),
            {cache:"no-store",signal:controller.signal}
          );
          if(!response.ok)throw new Error("youtube_live_scan_"+response.status);
          state=await response.json();
        }

        if(
          seq!==youtubeLiveScanSeq||
          !scanAllowed()||
          state?.done!==true
        )return false;

        // The completed edge cycle is only a discovery/wake signal.
        // Do not copy its items into browser feed state and do not repair
        // package title/avatar/viewers on the client.
        youtubeLiveLastCycleAt=Date.now();
        liveDiscoveryLastAt=youtubeLiveLastCycleAt;
        return true;
      }catch(error){
        if(error?.name!=="AbortError"){
          console.warn("youtube_live_edge_failed",error);
        }
        return false;
      }finally{
        if(seq===youtubeLiveScanSeq)youtubeLiveAbortController=null;
        youtubeLiveScanPromise=null;
      }
    })();
    return youtubeLiveScanPromise;
  }

  const youtubeThumbQualityCache=new Map();
  let youtubeThumbQualityObserver=null;

  function probeYoutubeThumb(url,minWidth=480,minHeight=270){
    return new Promise(resolve=>{
      if(!url){resolve("");return;}
      const test=new Image();
      test.decoding="async";
      try{test.fetchPriority="low";}catch{}
      let settled=false;
      const finish=value=>{
        if(settled)return;
        settled=true;
        resolve(value);
      };
      test.onload=async()=>{
        try{await test.decode?.();}catch{}
        const width=Number(test.naturalWidth)||0;
        const height=Number(test.naturalHeight)||0;
        finish(width>=minWidth&&height>=minHeight?url:"");
      };
      test.onerror=()=>finish("");
      test.src=url;
      if(test.complete&&test.naturalWidth)queueMicrotask(()=>test.onload?.());
      setTimeout(()=>finish(""),1800);
    });
  }

  function resolvePreferredCardThumb(id,current=""){
    id=String(id||"").trim();
    current=String(current||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return Promise.resolve(current);
    const cacheKey=id+"|"+current;
    const cached=youtubeThumbQualityCache.get(cacheKey);
    if(cached)return cached;

    const task=(async()=>{
      const maxres=await probeYoutubeThumb(youtubeThumbUrl(id,"maxresdefault.jpg"),640,360);
      if(maxres)return maxres;

      // Some videos do not publish maxres. YouTube can answer those URLs with
      // a tiny grey placeholder instead of a network error, so validate the
      // decoded size before switching the visible card away from its safe hq image.
      const sd=await probeYoutubeThumb(youtubeThumbUrl(id,"sddefault.jpg"),480,360);
      if(sd)return sd;

      return current;
    })().catch(()=>current);

    youtubeThumbQualityCache.set(cacheKey,task);
    return task;
  }

  function upgradeRowThumb(img){
    if(!(img instanceof HTMLImageElement)||img.dataset.thumbQualityDone==="1")return;
    const card=img.closest(".row[data-video-id]");
    const id=String(card?.dataset?.videoId||"").trim();
    const base=String(img.dataset.thumbBase||img.getAttribute("src")||"").trim();
    if(!id||!base){
      img.dataset.thumbQualityDone="1";
      return;
    }
    img.dataset.thumbQualityDone="1";
    void resolvePreferredCardThumb(id,base).then(best=>{
      if(!best||!img.isConnected||card?.dataset?.videoId!==id)return;
      if(best!==img.getAttribute("src"))img.src=best;
    });
  }

  function observeRowThumbQuality(root){
    if(!root)return;
    const images=[...root.querySelectorAll(".row[data-video-id] .row-thumb img")];
    if(!("IntersectionObserver" in window)){
      images.forEach(upgradeRowThumb);
      return;
    }
    if(!youtubeThumbQualityObserver){
      youtubeThumbQualityObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          youtubeThumbQualityObserver?.unobserve?.(entry.target);
          upgradeRowThumb(entry.target);
        }
      },{rootMargin:"320px 0px"});
    }
    images.forEach(img=>youtubeThumbQualityObserver.observe(img));
  }

  function directSourceStatus(sourceId,scope=activePackageScope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return "normal";
    const selected=Array.isArray(sourceStateRemote?.scopedSelected?.[scope])
      ?sourceStateRemote.scopedSelected[scope]
      :[];
    const blocked=Array.isArray(sourceStateRemote?.scopedBlocked?.[scope])
      ?sourceStateRemote.scopedBlocked[scope]
      :[];
    if(blocked.includes(sourceId))return "blocked";
    if(selected.includes(sourceId))return "selected";
    return "normal";
  }

  function remoteSourceSet(kind){
    const legacy=Array.isArray(sourceStateRemote?.[kind])
      ?sourceStateRemote[kind]
      :[];
    const scopedKey=kind==="selected"?"scopedSelected":"scopedBlocked";
    const scoped=
      sourceStateRemote?.[scopedKey]&&typeof sourceStateRemote[scopedKey]==="object"
        ?sourceStateRemote[scopedKey]
        :{};
    return new Set([
      ...legacy,
      ...Object.values(scoped).flatMap(value=>Array.isArray(value)?value:[])
    ].map(String));
  }

  function effectiveSourceStatus(sourceId,scope=activePackageScope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return "normal";
    if(scope!=="live")return directSourceStatus(sourceId,scope);

    // LIVE is the union of every selected source. Any blocked source wins,
    // matching the Cloudflare stateTargets contract.
    if(remoteSourceSet("blocked").has(sourceId))return "blocked";
    if(remoteSourceSet("selected").has(sourceId))return "selected";
    return "normal";
  }

  function inheritedLiveSourceStatus(sourceId){
    const effective=effectiveSourceStatus(sourceId,"live");
    const direct=directSourceStatus(sourceId,"live");
    return effective!=="normal"&&effective!==direct?effective:"";
  }

  function sourceStatusSummary(sourceId){

    const blocked=[];

      const direct=directSourceStatus(sourceId,row.key);
      if(direct==="selected")selected.push(row);
      if(direct==="blocked")blocked.push(row);
    }
    return {selected,blocked};
  }

  function sourceMenuLabels(sourceId,scope="",scopeLabel=""){

      const inherited=scope==="live"&&Boolean(inheritedLiveSourceStatus(sourceId));
      return {
        status,
        inherited,
        selectLabel:status==="selected"
          ?(inherited
            ?"Đã chọn trong "+scopeLabel+" (kế thừa)…"
            :"Bỏ chọn khỏi "+scopeLabel)
          :"Chọn vào "+scopeLabel,
        blockLabel:status==="blocked"
          ?(inherited
            ?"Đã chặn trong "+scopeLabel+" (kế thừa)…"
            :"Bỏ chặn khỏi "+scopeLabel)
          :"Chặn khỏi "+scopeLabel
      };
    }
    const summary=sourceStatusSummary(sourceId);
    return {
      status:"normal",
      inherited:false,
      selectLabel:summary.selected.length?"Đã chọn trong nguồn…":"Chọn vào nguồn…",
      blockLabel:summary.blocked.length?"Đã chặn trong nguồn…":"Chặn trong nguồn…"
    };
  }

  function patchLocalSourceStatus(sourceId,status,scope){
    sourceId=validSourceId(sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope)return;
    sourceStateRemote=sourceStateRemote&&typeof sourceStateRemote==="object"
      ?sourceStateRemote
      :{};
    sourceStateRemote.scopedSelected=sourceStateRemote.scopedSelected||{};
    sourceStateRemote.scopedBlocked=sourceStateRemote.scopedBlocked||{};
    const without=(list)=>Array.isArray(list)?list.filter(id=>id!==sourceId):[];
    sourceStateRemote.scopedSelected[scope]=without(sourceStateRemote.scopedSelected[scope]);
    sourceStateRemote.scopedBlocked[scope]=without(sourceStateRemote.scopedBlocked[scope]);
    if(status==="selected")sourceStateRemote.scopedSelected[scope].push(sourceId);
    if(status==="blocked")sourceStateRemote.scopedBlocked[scope].push(sourceId);
  }

  function ensureRowActionMenu(){

  function positionRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor||menu.hidden)return;
    const rect=anchor.getBoundingClientRect();
    const menuRect=menu.getBoundingClientRect();
    const gap=6;
    const left=Math.max(
      8,
      Math.min(
        window.innerWidth-menuRect.width-8,
        rect.right-menuRect.width
      )
    );
    const below=rect.bottom+gap;
    const top=below+menuRect.height<=window.innerHeight-8
      ?below
      :Math.max(8,rect.top-menuRect.height-gap);
    menu.style.left=Math.round(left)+"px";
    menu.style.top=Math.round(top)+"px";
  }

  function revealRowActionMenu(anchor){
    const menu=ensureRowActionMenu();
    if(!anchor){
      menu.hidden=true;
      return;
    }
    // Keep the freshly rendered menu out of paint until its final
    // coordinates are known. This prevents the one-frame flash at the
    // previous/default position when opening or switching submenus.
    menu.style.visibility="hidden";
    menu.hidden=false;
    positionRowActionMenu(anchor);
    menu.style.visibility="";
    requestAnimationFrame(()=>{
      syncInlinePlayerOverlay();
      requestAnimationFrame(()=>syncInlinePlayerOverlay());
    });
  }

  function showScopePicker(action){
    const menu=ensureRowActionMenu();
    const choices=currentSourceChoices();
    const sourceId=validSourceId(openRowMenuMeta?.sourceId);

    const rows=choices.map(row=>{
      const direct=directSourceStatus(sourceId,row.key);
      const effective=effectiveSourceStatus(sourceId,row.key);
      const inherited=
        row.key==="live"&&
        effective!=="normal"&&
        direct!==effective;

      let stateLabel=action==="blocked"?"Chưa chặn":"Chưa chọn";
      if(effective==="selected")stateLabel=inherited?"Đã chọn · kế thừa":"Đã chọn";
      if(effective==="blocked")stateLabel=inherited?"Đã chặn · kế thừa":"Đã chặn";

      const same=
        (action==="selected"&&direct==="selected")||
        (action==="blocked"&&direct==="blocked");
      const inheritedLocked=
        inherited&&
        ((action==="selected"&&effective==="selected")||
         (action==="blocked"&&effective==="blocked"));

      const nextHint=same
        ?(action==="selected"?"Bấm để bỏ chọn":"Bấm để bỏ chặn")
        :(inheritedLocked
          ?"Thay đổi tại nguồn gốc"
          :(action==="selected"?"Bấm để chọn":"Bấm để chặn"));

      return '<button class="row-action-item" type="button" role="menuitem" '+
        'data-row-scope="'+escapeHtml(row.key)+'" '+
        'data-row-status="'+escapeHtml(action)+'" '+
        (inheritedLocked?'disabled ':'')+
        'title="'+escapeHtml(nextHint)+'">'+
        menuIcon(effective==="blocked"?"block":"select")+
        '<span>'+escapeHtml(row.label)+' · '+escapeHtml(stateLabel)+'</span>'+
      '</button>';
    }).join("");

    menu.innerHTML=
      '<div class="row-action-title">'+
        escapeHtml(action==="selected"?"Trạng thái nguồn":"Trạng thái chặn")+
      '</div>'+
      rows+

      rowActionButton("back-main","Quay lại","back");
    revealRowActionMenu(openRowMenuAnchor);

    const id=String(meta?.id||"").trim();

  async function startNativeDownload(meta={},format="mp4"){
    const resolverUrl=downloadUrl(meta,format);
    if(!resolverUrl){
      setDownloadRowStatus(format,"");
      window.alert("Không tìm thấy media để tải.");
      return false;
    }

    try{
      const response=await fetch(resolverUrl,{
        method:"GET",
        mode:"cors",
        cache:"no-store",
        credentials:"omit",
        headers:{"accept":"application/json"}
      });
      const data=await response.json().catch(()=>null);
      const directUrl=String(data?.url||"").trim();
      if(!response.ok||!data?.ok||!/^https:\/\//i.test(directUrl)){
        throw new Error(String(data?.error||"download_resolve_failed"));
      }

      const anchor=document.createElement("a");
      anchor.href=directUrl;
      anchor.rel="noopener";
      anchor.download="";
      anchor.style.display="none";
      document.body.appendChild(anchor);
      anchor.click();
      window.setTimeout(()=>anchor.remove(),30000);
      window.setTimeout(()=>closeRowActionMenu(),1200);
      return true;
    }catch(error){
      console.warn("download resolve failed",error);
      setDownloadRowStatus(format,"");
      window.alert("Không lấy được file. Thử lại.");
      return false;
    }
  }

  async function writeCardSourceStatus(meta,status,scope){
    const sourceId=validSourceId(meta?.sourceId);
    scope=String(scope||"").trim();
    if(!sourceId||!scope||!hasSourceAdminAccess())return false;
    const pin=SOURCE_ADMIN_PIN;

    const previous=directSourceStatus(sourceId,scope);
    patchLocalSourceStatus(sourceId,status,scope);

    try{
      const response=await fetch(SOURCE_STATE_URL,{
        method:"POST",
        cache:"no-store",
        headers:{
          "content-type":"application/json",
          "x-1988-pin":pin
        },
        body:JSON.stringify({
          op:"set_source",
          scope,
          channel_id:sourceId,
          status,
          version:Date.now(),
          source:{
            name:String(meta?.sourceName||"").trim(),
            thumbnailUrl:String(meta?.sourceAvatar||"").trim(),
            subscribers:""
          }
        })
      });
      if(response.status===401){
        try{localStorage.removeItem(SOURCE_ADMIN_AUTH_KEY)}catch{}
        patchLocalSourceStatus(sourceId,previous,scope);
        closeRowActionMenu();
        window.alert("Phiên quản trị không còn hợp lệ.");
        return false;
      }
      if(!response.ok){
        patchLocalSourceStatus(sourceId,previous,scope);
        throw new Error("source_state_"+response.status);
      }

      const event={
        type:"source-state",
        id:sourceId,
        status,
        scope,
        name:String(meta?.sourceName||"").trim(),
        at:Date.now()
      };
      try{sourceUiChannel?.postMessage(event)}catch{}
      try{localStorage.setItem(SOURCE_UI_EVENT_KEY,JSON.stringify(event))}catch{}

      closeRowActionMenu();
      if(liveDemandActive("youtube")){
        setTimeout(()=>void syncPreparedScopeAfterWake(
          "live",
          [700,1800,4000,8000],
          {wake:false}
        ),500);
      }else if(feedMode==="package"&&activePackageScope===scope){
        setTimeout(()=>void syncPreparedPackages(
          [scope],
          {refreshManifest:true}
        ),900);
      }
      return true;
    }catch(error){
      patchLocalSourceStatus(sourceId,previous,scope);
      console.warn("save source status failed",error);
      window.alert("Chưa lưu được thay đổi nguồn.");
      return false;
    }
  }

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

  function updateHeaderSearchRoom(){
    if(!top||!sourceChips)return;

    // Mobile keeps the compact icon; explicit search always owns the row.
    if(mobileHeaderMq.matches||top.classList.contains("search-open")){
      headerRoomy=false;
      top.classList.remove("search-roomy");
      top.style.removeProperty("--auto-search-w");
      return;
    }

    const headerW=Math.max(
      0,
      top.clientWidth||
      document.documentElement.clientWidth||
      window.innerWidth||
      0
    );

    // IMPORTANT: do not use sourceChips.scrollWidth here.
    // The flex/block rail expands to its parent, so scrollWidth can look almost
    // as wide as the whole header even when the actual chips occupy much less.
    const chipsW=naturalSourceChipsWidth();

    // Reserve outer spacing plus the separate mic + settings buttons.
    // The source rail owns the left side; search/mic/settings own the right.
    const chromeReserve=108;
    const surplus=Math.max(0,headerW-chipsW-chromeReserve);

    // Full search is useful from 280px upward; let it grow with the real spare
    // space but cap it near YouTube's desktop search width.
    const roomy=chipsW>0&&surplus>=280;
    const searchW=roomy
      ?Math.min(640,Math.max(280,Math.floor(surplus)))
      :0;

    headerRoomy=roomy;
    top.classList.toggle("search-roomy",roomy);
    if(roomy)top.style.setProperty("--auto-search-w",searchW+"px");
    else top.style.removeProperty("--auto-search-w");
  }

  async function loadExistingSourceNames(){
    sourceNameChips.innerHTML="";

    const fallbackRows=[
      {key:"latest",label:"Ngày"},
      {key:"week",label:"Tuần"},
      {key:"live",label:"Live"}
    ];
    const sourceTabsKey="yt1988-source-tabs-v1";
    let storedRows=[];
    try{
      const saved=JSON.parse(localStorage.getItem(sourceTabsKey)||"[]");
      if(Array.isArray(saved)){
        storedRows=saved.filter(row=>row?.key&&row?.label);
      }
    }catch{}

    // Paint remembered tabs immediately; network state can refresh them later.
    renderExistingSourceNames(storedRows.length?storedRows:fallbackRows);

    // First app entry is video-first. LIVE remains fully dormant until the
    // user explicitly opens a LIVE surface.
    // First app entry is always video-first: paint the latest package from
    // IndexedDB immediately and keep one newest video per channel.
    const firstPackagePromise=(async()=>{
      const scope=STARTUP_SCOPE;
      activePackageScope=scope;
      await restoreStoredPackage(scope);
      const painted=await showPackageScope(scope,{hydrateLive:false});

      return painted;
    })();

    const statePromise=(async()=>{
      const cached=readCachedSourceLite();
      if(cached?.state){
        sourceStateRemote=cached.state;
        primeChannelDirectoryFromState(cached.state);
        const cachedRows=existingSourceTabNames(cached.state);
        if(cachedRows.length){
          renderExistingSourceNames(cachedRows);
          try{localStorage.setItem(sourceTabsKey,JSON.stringify(cachedRows))}catch{}
        }
      }

      try{
        const loaded=await loadSourceStateLite();
        const remote=loaded.state||{};
        const changed=remote!==sourceStateRemote;
        sourceStateRemote=remote;
        primeChannelDirectoryFromState(remote);

        // MAIN never downloads channelLibrary. Package/search/video metadata own
        // card identity; lite state only owns source controls/tab labels.
        if(changed&&currentMeta)renderCurrentInfo();

        const rows=existingSourceTabNames(remote);
        try{localStorage.setItem(sourceTabsKey,JSON.stringify(rows))}catch{}
        return rows;
      }catch(_){
        return cached?.state
          ?existingSourceTabNames(cached.state)
          :storedRows;
      }
    })();

    const manifestPromise=loadPackageManifest().then(async manifest=>{
      const scope=manifest?.[activePackageScope]?activePackageScope:(manifest?.latest?"latest":"");
      if(scope)await syncPreparedPackages([scope]);
      return manifest;
    });

    const [rowsFromState]=await Promise.all([
      statePromise,
      manifestPromise,
      firstPackagePromise
    ]);

    const rows=rowsFromState.length?rowsFromState:(storedRows.length?storedRows:fallbackRows);
    if(!rows.some(row=>String(row?.key||"")===String(activePackageScope))){
      activePackageScope=String(rows[0]?.key||"live");
      try{localStorage.setItem(ACTIVE_SCOPE_KEY,activePackageScope)}catch{}
    }
    renderExistingSourceNames(rows);

    const scopes=rows
      .map(row=>row.key)
      .filter(scope=>!Object.keys(packageManifest).length||packageManifest[scope]);

    // Restore every previously committed package before any new download. Tab
    // clicks remain RAM-only even after a refresh or temporary loss of network.
    await Promise.all(scopes.map(scope=>restoreStoredPackage(scope)));
    if(feedMode==="package"){
      await showPackageScope(activePackageScope);
    }

    // Do not fetch unopened scopes. The active tab is demand-driven; every
    // other committed package stays local until the user actually opens it.
    prefetchPackages([activePackageScope]);

    // The visible package may refresh in the background after its first paint.
    // Other tabs refresh only when opened; their committed packages are already
    // prefetched above and therefore remain instant.
    setTimeout(()=>{
      if(feedMode==="package"){
        void checkPackagesOnDemand([activePackageScope]);
      }
    },0);
    return rows;
  }

  function applyRenderedCardTints(rows){
    if(!rows)return;

    if(!("IntersectionObserver" in window)){
      rows.querySelectorAll(".row[data-video-id]").forEach(paintCardTint);
      return;
    }

    if(!cardTintObserver){
      cardTintObserver=new IntersectionObserver(entries=>{
        for(const entry of entries){
          if(!entry.isIntersecting)continue;
          cardTintObserver.unobserve(entry.target);
          paintCardTint(entry.target);
        }
      },{root:null,rootMargin:"320px 0px",threshold:0.01});
    }

    rows.querySelectorAll(".row[data-video-id]").forEach(card=>{
      cardTintObserver.observe(card);
