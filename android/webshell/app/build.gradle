plugins { id 'com.android.application' version '8.9.2' }

android {
  namespace 'xyz.taphoa.webshell'
  compileSdk 35
  defaultConfig {
    applicationId 'xyz.taphoa.video1988'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '0.1.0-test'
    buildConfigField 'String', 'START_URL', '"https://yt.taphoa.xyz/"'
    buildConfigField 'String', 'APP_HOST', '"yt.taphoa.xyz"'
    buildConfigField 'String', 'BAR_COLOR', '"#DC2626"'
    buildConfigField 'boolean', 'IS_DARK', 'true'
    buildConfigField 'boolean', 'VIDEO_APP', 'true'
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
