<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TikTok origin media proof</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#0f0f0f;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.page{width:min(1050px,100%);margin:0 auto;padding:18px}
h1{font-size:18px;margin:0 0 6px}.sub{color:#aaa;font-size:13px;line-height:1.5;margin:0 0 16px}
.grid{display:grid;grid-template-columns:minmax(300px,430px) minmax(280px,1fr);gap:18px;align-items:start}
.panel{background:#181818;border:1px solid #2d2d2d;border-radius:16px;padding:14px}
.player-shell{width:min(100%,410px);aspect-ratio:9/16;margin:0 auto;background:#000;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.status{min-height:20px;margin-top:10px;text-align:center;color:#aaa;font-size:12px}
.inputline{display:flex;gap:8px;margin-bottom:12px}
.inputline input{min-width:0;flex:1;background:#111;border:1px solid #333;border-radius:10px;color:#fff;padding:10px 11px;font-size:13px}
button,a{font:inherit}
button,.linkbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#2a2a2a;color:#fff;border:1px solid #3a3a3a;border-radius:10px;padding:9px 11px;cursor:pointer;font-weight:650;text-decoration:none}
button:hover,.linkbtn:hover{background:#343434}.primary{background:#fff;color:#111;border-color:#fff}.primary:hover{background:#e8e8e8}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pill{display:inline-flex;border:1px solid #333;border-radius:999px;padding:4px 8px;font-size:11px;color:#bbb;margin:0 6px 6px 0}
.info{background:#111;border:1px solid #292929;border-radius:12px;padding:12px;margin-top:12px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa;word-break:break-word}
.ok{color:#79d68a}.bad{color:#ff7777}.warn{color:#ffd166}
@media(max-width:760px){.page{padding:10px}.grid{grid-template-columns:1fr}.panel{padding:10px}.player-shell{width:min(100%,390px)}}
@media(max-width:480px){.page{padding:0}.page>h1,.page>.sub,.right{margin-left:10px;margin-right:10px}.left{padding:0;border-left:0;border-right:0;border-radius:0}.player-shell{width:100%;border-radius:0}}
</style>
</head>
<body>
<div class="page">
  <h1>TikTok · origin media</h1>
  <p class="sub">Không iframe. Không TikWM/TDown. Lấy đúng <b>www.tiktok.com/aweme/v1/play</b> rồi để native video tự theo redirect sang TikTok CDN.</p>
  <div class="grid">
    <section class="panel left">
      <div class="player-shell">
        <video id="media" controls playsinline preload="metadata"></video>
      </div>
      <div class="status" id="status">Đang lấy link gốc…</div>
    </section>

    <section class="panel right">
      <div class="inputline">
        <input id="videoInput" value="https://www.tiktok.com/@geely.daily/video/7689814919914458374?is_from_webapp=1&sender_device=pc&web_id=7670812910123369992">
        <button id="resolveBtn" class="primary" type="button">Lấy link gốc</button>
      </div>

      <div>
        <span class="pill">H.264 / avc1</span>
        <span class="pill">AAC / mp4a</span>
        <span class="pill">Không proxy video</span>
        <span class="pill">Không Supabase</span>
      </div>

      <div class="btns">
        <button id="playBtn" type="button">▶ Play</button>
        <button id="pauseBtn" type="button">Ⅱ Pause</button>
        <button id="soundBtn" type="button">🔊 Có tiếng</button>
        <a id="openMedia" class="linkbtn" target="_blank" rel="noopener">Mở link media</a>
      </div>

      <div class="info" id="info">directUrl = —</div>
    </section>
  </div>
</div>

<script>
(() => {
  const RESOLVER='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin';
  const REDIRECT='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev/tiktok/video-origin-redirect';
  const media=document.getElementById('media');
  const input=document.getElementById('videoInput');
  const status=document.getElementById('status');
  const info=document.getElementById('info');
  const openMedia=document.getElementById('openMedia');

  function setStatus(text,cls=''){
    status.className='status '+cls;
    status.textContent=text;
  }

  async function resolve(){
    const post=input.value.trim();
    if(!post)return;
    setStatus('Đang lấy aweme/v1/play gốc từ TikTok…');
    try{
      const r=await fetch(RESOLVER+'?url='+encodeURIComponent(post),{cache:'no-store'});
      const j=await r.json();
      if(!j?.ok||!j?.data?.directUrl)throw new Error(j?.error||('HTTP '+r.status));

      const d=j.data;
      const direct=String(d.directUrl||'');
      const isAweme=/^https:\/\/www\.tiktok\.com\/aweme\/v1\/play\//i.test(direct);

      info.innerHTML=
        'source = '+(d.bestSource||'—')+'<br>'+
        'awemeGateway = '+String(isAweme)+'<br>'+
        'directUrl = '+direct+'<br>'+ 
        'browserUrl = redirect-only gateway<br>'+
        'render = false<br>'+
        'tikwm = false<br>'+
        'tdown = false<br>'+
        'proxyVideo = false<br>'+
        'storage = none<br>'+
        'supabaseWrites = 0';

      const browserUrl=REDIRECT+'?url='+encodeURIComponent(direct);
      openMedia.href=browserUrl;
      media.pause();
      media.src=browserUrl;
      media.load();

      setStatus(isAweme
        ? 'Đã có aweme/v1/play · Worker chỉ đổi 302 · video tải thẳng TikTok CDN.'
        : 'Đã có media URL nhưng chưa phải aweme gateway.','ok');
    }catch(e){
      setStatus('Resolver lỗi: '+String(e?.message||e),'bad');
      info.textContent='error = '+String(e?.message||e);
    }
  }

  document.getElementById('resolveBtn').onclick=resolve;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();resolve();}});
  document.getElementById('playBtn').onclick=()=>media.play();
  document.getElementById('pauseBtn').onclick=()=>media.pause();
  document.getElementById('soundBtn').onclick=()=>{media.muted=false;media.volume=1;media.play();};

  media.addEventListener('loadedmetadata',()=>{
    setStatus('Native video đã load · '+media.videoWidth+'×'+media.videoHeight+' · '+Math.round(media.duration||0)+'s','ok');
  });
  media.addEventListener('error',()=>{
    setStatus('Media URL này chưa phát được trực tiếp trên browser.','bad');
  });

  resolve();
})();
</script>
</body>
</html>
