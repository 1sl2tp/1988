    <button class="actionbtn" type="button" aria-label="Bình luận"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H6l-4 3 1.4-5A9 9 0 1 1 21 12Z"/></svg></button><div class="actioncount" id="commentCount"></div>
    <button class="actionbtn" type="button" aria-label="Lưu"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg></button><div class="actioncount" id="saveCount"></div>
    <button class="actionbtn" type="button" aria-label="Chia sẻ"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="m16 6-4-4-4 4"/><path d="M12 2v14"/></svg></button><div class="actioncount" id="shareCount"></div>
  </div>

  </div>
</div>
        <div class="streamrow">
          <input id="streamUrl" readonly placeholder="Link phát trực tiếp sẽ hiện ở đây">

<script>
const EDGE="https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev";

const gestureHint=document.getElementById("gestureHint");
const LIVE_LINK_TTL_MS=45_000;
const VOD_LINK_TTL_MS=90_000;
const VOD_EMBED_FIRST=true;
const VOD_EMBED_READY_TIMEOUT_MS=6500;
const vodLinkCache=new Map();
const preconnectedOrigins=new Set();
let flvPlayer=null;
let hlsPlayer=null;
let hlsLoaderPromise=null;
let liveFallbackStarted=false;
const HLS_JS_URL="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js";
let handle="";
let currentLiveState=null;
let currentLiveStateAt=0;
let currentChannelLibrary=null;
let liveRefreshPromise=null;
let currentVideos=[];
let currentVideoIndex=-1;
let currentMediaMode="idle";
let wheelLocked=false;
let touchStartY=null;
let mobileLivePrimed=false;
const MOBILE_FEED_MQ=window.matchMedia("(max-width:760px)");
const MOBILE_LIVE_PRELOAD_RADIUS=1;
const LIVE_MPEGTS_ACTIVE_CONFIG=Object.freeze({
  enableStashBuffer:true,
  stashInitialSize:384*1024,
  lazyLoad:false,
  liveSync:true,
  autoCleanupSourceBuffer:true,
  autoCleanupMaxBackwardDuration:8,
  autoCleanupMinBackwardDuration:3,
  fixAudioTimestampGap:true
});
const LIVE_MPEGTS_WARM_CONFIG=Object.freeze({
  enableStashBuffer:true,
  stashInitialSize:192*1024,
  lazyLoad:false,
  liveSync:true,
  autoCleanupSourceBuffer:true,
  autoCleanupMaxBackwardDuration:5,
  autoCleanupMinBackwardDuration:2,
  fixAudioTimestampGap:true
});
const mobileLiveSlots=new Map();
let activeMobileLiveHandle="";
let vodEmbedReady=false;
let vodEmbedFallbackTimer=null;
let currentVodEmbedRow=null;
const sessionChannels=new Map();
const sessionLiveStates=new Map();
const catalogChannels=new Map();
let currentChannelListHandle="";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function compactCount(v){
  const n=Number(v);
  if(!Number.isFinite(n)||n<=0)return "";
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K";
  return String(Math.round(n));
}
function firstNumber(...vals){
  for(const v of vals){const n=Number(v);if(Number.isFinite(n)&&n>0)return n}
  return 0;
}
function avatarUrl(profile){
  return String(profile?.avatar?.url||profile?.avatar||"");
}
function isMobileFeed(){
  return MOBILE_FEED_MQ.matches;
}
function supportsNativeHls(mediaEl=video){
  try{
    return Boolean(
      mediaEl?.canPlayType?.("application/vnd.apple.mpegurl")||
      mediaEl?.canPlayType?.("application/x-mpegURL")
    );
  }catch{
    return false;
  }
}
function preferredLiveTransport(state,mediaEl=video){
  const flv=String(state?.streamUrl||"");
  const hls=String(state?.hlsUrl||"");
  // Safari + all iOS browsers expose native HLS through WebKit.
  if(hls&&supportsNativeHls(mediaEl))return {kind:"native-hls",flv,hls};
  // Chromium/Android/desktop: direct HTTP-FLV through mpegts when available.
  if(flv&&window.mpegts?.isSupported?.())return {kind:"mpegts-flv",flv,hls};
  // Last browser-side fallback for Chromium when only HLS is available.
  if(hls)return {kind:"hls-js",flv,hls};
  return {kind:"none",flv,hls};
}
function ensureHlsJs(){
  if(window.Hls?.isSupported?.())return Promise.resolve(window.Hls);
  if(hlsLoaderPromise)return hlsLoaderPromise;
  hlsLoaderPromise=new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=HLS_JS_URL;
    script.async=true;
    script.onload=()=>window.Hls?.isSupported?.()?resolve(window.Hls):reject(new Error("HLS.js unsupported"));
    script.onerror=()=>reject(new Error("HLS.js load failed"));
    document.head.appendChild(script);
  }).catch(error=>{
    hlsLoaderPromise=null;
    throw error;
  });
  return hlsLoaderPromise;
}
async function attachHlsStream(mediaEl,hlsUrl,{autoplay=false,muted=false}={}){
  if(!hlsUrl)throw new Error("missing_hls");
  mediaEl.muted=Boolean(muted);
  if(supportsNativeHls(mediaEl)){
    mediaEl.src=hlsUrl;
    mediaEl.load();
    if(autoplay)await mediaEl.play().catch(()=>{});
    return {kind:"native-hls",player:null};
  }
  const Hls=await ensureHlsJs();
  const player=new Hls({
    lowLatencyMode:true,
    backBufferLength:8,
    maxBufferLength:12,
    maxMaxBufferLength:20,
    liveSyncDurationCount:2,
    liveMaxLatencyDurationCount:5
  });
  player.loadSource(hlsUrl);
  player.attachMedia(mediaEl);
  if(autoplay){
    player.once(Hls.Events.MANIFEST_PARSED,()=>mediaEl.play().catch(()=>{}));
  }
  return {kind:"hls-js",player};
}

function liveFeedRows(){
  return [...sessionLiveStates.entries()].filter(([h,row])=>
    sessionChannels.has(h)&&Boolean(row?.streamUrl||row?.hlsUrl)
  );
}
function liveStateSignature(state){
  return String(state?.streamUrl||"")+"|"+String(state?.hlsUrl||"");
}
function activeMobileLiveSlot(){
  return mobileLiveSlots.get(activeMobileLiveHandle)||null;
}
function destroyMobileLiveSlot(rawHandle){
  const h=String(rawHandle||"").replace(/^@/,"");
  const slot=mobileLiveSlots.get(h);
  if(!slot)return;
  try{slot.player?.destroy?.()}catch{}
  try{slot.hlsPlayer?.destroy?.()}catch{}
  try{slot.video.pause()}catch{}
  try{slot.video.removeAttribute("src");slot.video.load()}catch{}
  try{slot.video.remove()}catch{}
  mobileLiveSlots.delete(h);
  if(activeMobileLiveHandle===h)activeMobileLiveHandle="";
}
function destroyMobileLiveDeck(){
  for(const h of [...mobileLiveSlots.keys()])destroyMobileLiveSlot(h);
  activeMobileLiveHandle="";
  video.style.display="";
}
async function createMobileLiveSlot(rawHandle,state){
  const h=String(rawHandle||"").replace(/^@/,"");
  if(!h||!isMobileFeed()||document.hidden)return null;
  const signature=liveStateSignature(state);
  const existing=mobileLiveSlots.get(h);
  if(existing&&existing.signature===signature)return existing;
  if(existing)destroyMobileLiveSlot(h);

  const el=document.createElement("video");
  el.className="live-deck-video";
  el.playsInline=true;
  el.muted=true;
  el.autoplay=false;
  el.preload="auto";
  el.setAttribute("aria-hidden","true");
  document.querySelector(".mediaframe")?.appendChild(el);

  const slot={handle:h,state,signature,video:el,player:null,hlsPlayer:null,ready:false,fallbackStarted:false};
  mobileLiveSlots.set(h,slot);
  const markReady=()=>{
    slot.ready=true;
    if(activeMobileLiveHandle===h)applyMediaShape(el.videoWidth,el.videoHeight);
  };
  el.addEventListener("loadedmetadata",markReady,{once:true});
  el.addEventListener("canplay",()=>{slot.ready=true},{once:true});

  const plan=preferredLiveTransport(state,el);
  const useHls=async()=>{
    if(!plan.hls)return false;
    const result=await attachHlsStream(el,plan.hls,{autoplay:false,muted:true});
    slot.hlsPlayer=result.player;
    slot.kind=result.kind;
    return true;
  };
  try{
    if(plan.kind==="native-hls"){
      await useHls();
    }else if(plan.kind==="mpegts-flv"){
      const player=mpegts.createPlayer(
        {type:"flv",isLive:true,url:plan.flv,cors:true,withCredentials:false},
        LIVE_MPEGTS_WARM_CONFIG
      );
      slot.player=player;
      slot.kind="mpegts-flv";
      player.attachMediaElement(el);
      player.load();
      if(plan.hls){
        player.on(mpegts.Events.ERROR,()=>{
          if(slot.fallbackStarted||!mobileLiveSlots.has(h))return;
          slot.fallbackStarted=true;
          try{player.destroy()}catch{}
          slot.player=null;
          useHls().catch(()=>{});
        });
      }
    }else if(plan.kind==="hls-js"){
      await useHls();
    }else{
      destroyMobileLiveSlot(h);
      return null;
    }
  }catch(error){
    console.warn("mobile live preload",h,error);
    destroyMobileLiveSlot(h);
    return null;
  }
  return slot;
}
async function warmMobileLiveWindow(centerHandle){
  if(!isMobileFeed()||document.hidden)return;
  const rows=liveFeedRows();
  const index=rows.findIndex(([h])=>h===centerHandle);
  if(index<0)return;
  const wanted=new Set();
  const warm=[];
  for(let offset=-MOBILE_LIVE_PRELOAD_RADIUS;offset<=MOBILE_LIVE_PRELOAD_RADIUS;offset++){
    const row=rows[index+offset];
    if(!row)continue;
    wanted.add(row[0]);
    warm.push(createMobileLiveSlot(row[0],row[1]));
  }
  await Promise.all(warm);
  for(const h of [...mobileLiveSlots.keys()]){
    if(!wanted.has(h))destroyMobileLiveSlot(h);
  }
}
async function activateMobileLiveSlot(rawHandle,{userGesture=false}={}){
  const h=String(rawHandle||"").replace(/^@/,"");
  const state=sessionLiveStates.get(h)||null;
  if(!h||!state||!(state.streamUrl||state.hlsUrl))return false;
  const slot=await createMobileLiveSlot(h,state);
  if(!slot)return false;

  video.style.display="none";
  for(const [slotHandle,item] of mobileLiveSlots){
    const active=slotHandle===h;
    item.video.classList.toggle("active",active);
    item.video.muted=active?!userGesture:true;
    if(active){
      item.player?.play?.().catch?.(()=>{});
      item.video.play().catch(()=>{});
    }else{
      try{item.player?.pause?.()}catch{}
      try{item.video.pause()}catch{}
    }
  }
  activeMobileLiveHandle=h;
  setMediaChrome({...state,handle:h},"live");
  applyMediaShape(slot.video.videoWidth,slot.video.videoHeight);
  queueMicrotask(()=>warmMobileLiveWindow(h));
  return true;
}

function parseHandle(raw){
  raw=String(raw||"").trim();
  const m=raw.match(/(?:https?:\/\/)?(?:www\.)?tiktok\.com\/@([^/?#]+)/i);

  const h=raw.replace(/^@/,"").split(/[/?#]/)[0];

}

async function getJson(url,timeout=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{cache:"no-store",signal:controller.signal});
    const body=await r.json().catch(()=>null);
    if(!r.ok)throw new Error(body?.error||("HTTP "+r.status));
    return body;
  }finally{
    clearTimeout(timer);
  }
}
function renderState(state,stateHandle=handle){
  const h=String(stateHandle||handle||"").replace(/^@/,"");
  const live=Number(state?.status)===2;
  const playable=Boolean(live&&(state?.streamUrl||state?.hlsUrl));
  if(h===handle){
    if(playable){
      currentLiveState=state;
      currentLiveStateAt=Date.now();
    }else if(!live){
      currentLiveState=null;
      currentLiveStateAt=0;
    }
  }
  const profile=h===handle?(currentChannelLibrary?.profile||{}):(sessionChannels.get(h)||{});
  rememberChannel(h,profile);
  const retained=sessionLiveStates.get(h)||null;
  if(playable)sessionLiveStates.set(h,{...state,handle:h});
  else if(retained&&(retained.streamUrl||retained.hlsUrl)){
    sessionLiveStates.set(h,retained);
  }else if(!live)sessionLiveStates.delete(h);
  renderLiveList();
}
async function playLive(state,{mutedAutoplay=false}={}){
  stopPlayer();
  video.controls=!isMobileFeed();
  video.muted=Boolean(mutedAutoplay);
  currentVideoIndex=-1;
  setMediaChrome({...state,handle}, "live");
  const plan=preferredLiveTransport(state,video);
  const selected=(plan.kind==="native-hls"||plan.kind==="hls-js")?plan.hls:(plan.flv||plan.hls);
  streamUrlEl.value=selected;
  if(!selected){
    nowEl.textContent="Đang phát nhưng chưa có link phát.";
    return false;
  }

  const fallbackToHls=async()=>{
    if(liveFallbackStarted||!plan.hls)return false;
    liveFallbackStarted=true;
    try{
      if(flvPlayer){try{flvPlayer.destroy()}catch{} flvPlayer=null}
      const result=await attachHlsStream(video,plan.hls,{autoplay:true,muted:Boolean(mutedAutoplay)});
      hlsPlayer=result.player;
      streamUrlEl.value=plan.hls;
      nowEl.textContent="@"+handle+" · "+(result.kind==="native-hls"?"HLS native":"HLS.js");
      return true;
    }catch(error){
      nowEl.textContent="HLS lỗi: "+String(error?.message||error);
      return false;
    }
  };

  if(plan.kind==="native-hls"||plan.kind==="hls-js"){
    liveFallbackStarted=false;
    return fallbackToHls();
  }

  if(plan.kind==="mpegts-flv"){
    nowEl.textContent="@"+handle+" · FLV/mpegts";
    flvPlayer=mpegts.createPlayer(
      {type:"flv",isLive:true,url:plan.flv,cors:true,withCredentials:false},
      LIVE_MPEGTS_ACTIVE_CONFIG
    );
    flvPlayer.attachMediaElement(video);
    flvPlayer.load();
    if(plan.hls){
      flvPlayer.on(mpegts.Events.ERROR,()=>{ fallbackToHls(); });
    }
    flvPlayer.play().catch(()=>video.play().catch(()=>fallbackToHls()));
    return true;
  }

  nowEl.textContent="Có link nhưng trình phát hiện tại không hỗ trợ định dạng này.";
  return false;
}

function liveStateFresh(){

}

  ).then(state=>{

    return state;
  }).finally(()=>{
    liveRefreshPromise=null;
  });
  return liveRefreshPromise;
}

async function replayLive(){

  }

  nowEl.textContent="@"+handle+" · đang làm mới link trực tiếp…";
  try{

    if(Number(state?.status)===2&&(state?.streamUrl||state?.hlsUrl)){

async function playDirectVodFallback(row){
  const h=String(row?.handle||handle||"").replace(/^@/,"");
  let bhwaTried=false;
  const tryBhwa=async()=>{
    if(bhwaTried)return false;
    bhwaTried=true;
    try{
      const direct=await resolveBhwaVideo(row);
      streamUrlEl.value=direct;
      nowEl.textContent="@"+h+" · Embed/TikWM lỗi → BHWA";
      video.style.display="";

      video.src=direct;

      return true;
    }catch(error){

      return false;
    }
  };
  try{
    nowEl.textContent="@"+h+" · đang lấy TikWM HD dự phòng…";
    const direct=await getWarmTikwmLink(row);
    streamUrlEl.value=direct;
    nowEl.textContent="@"+h+" · TikWM dự phòng";
    video.style.display="";
    video.controls=true;
    video.onerror=()=>{ video.onerror=null; vodLinkCache.delete(videoCacheKey(row)); tryBhwa(); };
    video.preload="auto";
    video.src=direct;
    video.load();
    try{
      await video.play();
    }catch(error){
      if(String(error?.name||"")==="NotAllowedError")return;
      await tryBhwa();
    }
  }catch{
    await tryBhwa();
  }
}

window.addEventListener("message",event=>{
  if(event.origin!=="https://www.tiktok.com"||event.source!==vodEmbed.contentWindow)return;
  const msg=event.data||{};
  if(msg?.["x-tiktok-player"]!==true)return;
  if(msg.type==="onPlayerReady"){
    vodEmbedReady=true;
    clearTimeout(vodEmbedFallbackTimer);
    vodEmbedFallbackTimer=null;
    postTikTokPlayer("play");
    return;
  }
  if(msg.type==="onPlayerError"){
    const code=Number(msg?.value?.errorCode||msg?.value||0);
    if(code===3002)return;
    const row=currentVodEmbedRow;
    if(!row)return;

  }
});

async function resolveTikwmVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://www.tikwm.com/api/?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  if(Number(data?.code)!==0)throw new Error(String(data?.msg||("TikWM code "+data?.code)));
  const body=data?.data||{};
  let url=String(body?.hdplay||body?.play||"").trim();
  if(!url)throw new Error("TikWM không trả link phát");
  if(url.startsWith("//"))url="https:"+url;
  else if(url.startsWith("/"))url="https://www.tikwm.com"+url;
  return url;
}

function videoCacheKey(row){
  const h=String(row?.handle||handle||"").replace(/^@/,"").toLowerCase();
  return h+":"+String(row?.id||"");
}

function preconnectMediaOrigin(url){
  try{
    const origin=new URL(url).origin;
    if(!origin||preconnectedOrigins.has(origin))return;
    preconnectedOrigins.add(origin);
    const link=document.createElement("link");
    link.rel="preconnect";
    link.href=origin;
    link.crossOrigin="anonymous";
    document.head.appendChild(link);
  }catch{}
}

async function getWarmTikwmLink(row){
  const key=videoCacheKey(row);
  const cached=vodLinkCache.get(key);
  if(cached?.url&&cached.expiresAt>Date.now())return cached.url;
  if(cached?.promise)return cached.promise;

  const promise=resolveTikwmVideo(row)
    .then(url=>{
      preconnectMediaOrigin(url);
      vodLinkCache.set(key,{url,expiresAt:Date.now()+VOD_LINK_TTL_MS});
      return url;
    })
    .catch(error=>{
      vodLinkCache.delete(key);
      throw error;
    });

  vodLinkCache.set(key,{promise,expiresAt:0});
  return promise;
}

function warmVideoLink(row){
  getWarmTikwmLink(row).catch(()=>{});
}

async function resolveBhwaVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://downloader-api.bhwa233.com/api/parse?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  const root=data?.data||data||{};
  const rows=[
    root?.originDownloadVideoUrl,
    root?.downloadVideoUrl,
    root?.video?.originDownloadVideoUrl,
    root?.video?.downloadVideoUrl,
    root?.video?.url,
    root?.url
  ].flat().filter(Boolean);
  const url=String(rows[0]||"").trim();
  if(!/^https?:\/\//i.test(url))throw new Error("BHWA không trả link video");
  return url;
}

async function playChannelVideo(row,index=currentVideos.indexOf(row)){
  stopPlayer();
  currentVideoIndex=Number.isInteger(index)&&index>=0?index:currentVideos.indexOf(row);
  setMediaChrome(row,"vod");
  videosBox.querySelectorAll("[data-video-i]").forEach((btn,i)=>btn.classList.toggle("active",i===currentVideoIndex));
  playerStage.classList.add("gesture");
  clearTimeout(playChannelVideo._hintTimer);
  playChannelVideo._hintTimer=setTimeout(()=>playerStage.classList.remove("gesture"),1000);
  const h=String(row?.handle||handle||"").replace(/^@/,"");
  const id=String(row?.id||"");
  if(!h||!/^\d{8,}$/.test(id))return;

  if(VOD_EMBED_FIRST&&activateTikTokEmbed(row))return;
  await playDirectVodFallback(row);
}

async function openCachedLive(rawHandle,{userGesture=false}={}){
  const h=String(rawHandle||"").replace(/^@/,"");
  const state=sessionLiveStates.get(h)||null;
  if(!h||!state||!(state.streamUrl||state.hlsUrl))return false;
  handle=h;
  input.value="https://www.tiktok.com/@"+h+"/live";
  currentLiveState=state;
  currentLiveStateAt=Date.now();
  markActiveChannel(h);
  renderLiveList();
  if(isMobileFeed()){
    await activateMobileLiveSlot(h,{userGesture});
  }else{
    await playLive(state,{mutedAutoplay:false});
  }
  updateNav();
  return true;
}
function moveLive(delta){
  const rows=liveFeedRows();
  if(!rows.length)return;
  const index=rows.findIndex(([h])=>h===handle);
  const base=index>=0?index:0;
  const next=Math.max(0,Math.min(rows.length-1,base+delta));
  if(next===base){updateNav();return}
  openCachedLive(rows[next][0],{userGesture:true});
}
function moveMedia(delta){
  if(currentMediaMode==="live"){moveLive(delta);return}
  moveVideo(delta);
}

function moveVideo(delta){
  if(currentMediaMode!=="vod"||!currentVideos.length)return;
  if(vodEmbed.classList.contains("active"))postTikTokPlayer("pause");
  const base=currentVideoIndex>=0?currentVideoIndex:0;
  const next=Math.max(0,Math.min(currentVideos.length-1,base+delta));
  if(next===base){updateNav();return}
  currentVideoIndex=next;
  playChannelVideo(currentVideos[next],next);
}
prevMedia.addEventListener("click",()=>moveMedia(-1));
nextMedia.addEventListener("click",()=>moveMedia(1));
playerStage.addEventListener("wheel",e=>{
  if(currentMediaMode!=="vod"||Math.abs(e.deltaY)<24)return;
  e.preventDefault();
  if(wheelLocked)return;
  wheelLocked=true;
  moveVideo(e.deltaY>0?1:-1);
  setTimeout(()=>wheelLocked=false,220);
},{passive:false});
playerStage.addEventListener("touchstart",e=>{
  touchStartY=e.touches?.[0]?.clientY??null;
},{passive:true});
playerStage.addEventListener("touchend",e=>{
  if(touchStartY==null)return;
  const endY=e.changedTouches?.[0]?.clientY??touchStartY;
  const dy=endY-touchStartY;
  touchStartY=null;
  if(Math.abs(dy)<42)return;
  if(isMobileFeed()&&currentMediaMode==="live")moveLive(dy<0?1:-1);
  else moveVideo(dy<0?1:-1);
},{passive:true});
playerStage.addEventListener("click",e=>{
  if(!isMobileFeed()||currentMediaMode!=="live")return;
  if(e.target.closest("button"))return;
  const target=activeMobileLiveSlot()?.video||video;
  if(target.muted){
    target.muted=false;
    target.play().catch(()=>{});
    gestureHint.textContent="Vuốt lên / xuống để chuyển trực tiếp";
    return;
  }
  if(target.paused)target.play().catch(()=>{});
});
document.addEventListener("keydown",e=>{
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowDown"){e.preventDefault();moveMedia(1)}
  if(e.key==="ArrowUp"){e.preventDefault();moveMedia(-1)}
});

function renderCatalogLatestVideos(){
  const latest=[];
  for(const [h,channel] of catalogChannels.entries()){
    const newest=Array.isArray(channel?.videos)?channel.videos[0]:null;
    if(newest?.id)latest.push({...newest,handle:h});
  }
  latest.sort((a,b)=>Number(b?.createTime||0)-Number(a?.createTime||0));
  currentChannelListHandle="";
  renderVideos(latest);
  return latest;
}

async function setChannelSelected(rawHandle,selected){
  const h=parseHandle(rawHandle);
  if(!h)throw new Error("Link hoặc tên kênh TikTok không hợp lệ.");
  const r=await fetch(LIBRARY+"/tiktok/selected-channel",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({handle:h,selected}),
    cache:"no-store"
  });
  const body=await r.json().catch(()=>null);
  if(!r.ok||body?.ok!==true)throw new Error(String(body?.error||("HTTP "+r.status)));
  return body;
}

async function addChannel(){
  const rawInput=String(input.value||"").trim();
  const h=parseHandle(rawInput);
  if(!h){statusEl.textContent="Không nhận ra kênh TikTok.";return}
  addChannelBtn.disabled=true;
  statusEl.textContent="@"+h+" · đang thêm kênh…";
  try{
    const result=await setChannelSelected(h,true);
    let channel=null;
    try{
      const data=await getJson(LIBRARY+"/tiktok/library?user="+encodeURIComponent(h)+"&t="+Date.now(),12000);
      channel=data?.channel||null;
    }catch{}
    if(channel){
      catalogChannels.set(h,channel);
      const profile=channel.profile||{};
      sessionChannels.set(h,{handle:h,name:String(profile.name||("@"+h)),avatar:avatarUrl(profile)});
    }else{
      sessionChannels.set(h,{handle:h,name:"@"+h,avatar:""});
    }
    if(result?.live)sessionLiveStates.set(h,{handle:h,status:2});
    renderChannels();
    renderLiveList();
    if(!currentChannelListHandle)renderCatalogLatestVideos();
    input.value="https://www.tiktok.com/@"+h+"/live";
    statusEl.textContent=result?.duplicate?"@"+h+" · kênh đã có trong danh sách.":"@"+h+" · đã thêm kênh.";
  }catch(error){
    statusEl.textContent="Không thêm được kênh: "+String(error?.message||error);
  }finally{
    addChannelBtn.disabled=false;
  }
}

async function removeChannel(rawHandle){
  const h=parseHandle(rawHandle);
  if(!h)return;
  statusEl.textContent="@"+h+" · đang xóa khỏi danh sách…";
  try{
    await setChannelSelected(h,false);
    sessionChannels.delete(h);
    sessionLiveStates.delete(h);
    catalogChannels.delete(h);
    if(handle===h){
      handle="";
      currentLiveState=null;
      currentLiveStateAt=0;
      currentChannelLibrary=null;
      currentMediaMode="idle";
      currentChannelListHandle="";
      stopPlayer();
      setMediaChrome({title:"Chưa có media"},"idle");
    }
    renderChannels();
    renderLiveList();
    if(!currentChannelListHandle||currentChannelListHandle===h)renderCatalogLatestVideos();
    statusEl.textContent="@"+h+" · đã xóa khỏi danh sách.";
  }catch(error){
    statusEl.textContent="Không xóa được kênh: "+String(error?.message||error);
  }
}

let liveSweepPromise=null;
let liveSweepTimer=null;
function syncLiveNow(payload){
  const next=new Map();
  for(const row of Array.isArray(payload?.items)?payload.items:[]){
    const h=String(row?.handle||"").replace(/^@/,"");
    if(!h||!sessionChannels.has(h))continue;
    if(!(row?.streamUrl||row?.hlsUrl))continue;
    next.set(h,{...row,handle:h,status:2});
  }
  sessionLiveStates.clear();
  for(const [h,row] of next)sessionLiveStates.set(h,row);
  renderLiveList();
  updateNav();
  if(isMobileFeed()&&!mobileLivePrimed&&sessionLiveStates.size){
    mobileLivePrimed=true;
    const first=liveFeedRows()[0]?.[0]||"";
    if(first)queueMicrotask(()=>openCachedLive(first,{userGesture:false}));
  }else if(isMobileFeed()&&currentMediaMode==="live"&&!sessionLiveStates.has(handle)&&sessionLiveStates.size){
    const first=liveFeedRows()[0]?.[0]||"";
    if(first)queueMicrotask(()=>openCachedLive(first,{userGesture:false}));
  }else if(isMobileFeed()&&currentMediaMode==="live"&&handle){
    queueMicrotask(()=>warmMobileLiveWindow(handle));
  }
}
async function refreshVisibleLive(){
  if(document.hidden||liveSweepPromise)return liveSweepPromise;
  liveSweepPromise=(async()=>{
    try{
      await getJson(EDGE+"/sweep?t="+Date.now(),30000);
    }catch(error){
      console.warn("live sweep",error);
    }
    try{
      const data=await getJson(EDGE+"/tiktok/live-now?t="+Date.now(),10000);
      syncLiveNow(data);
      return data;
    }catch(error){
      console.warn("live-now",error);
      return null;
    }
  })().finally(()=>{liveSweepPromise=null});
  return liveSweepPromise;
}
function startLiveDemandLoop(){
  clearInterval(liveSweepTimer);
  liveSweepTimer=null;
  if(document.hidden)return;
  refreshVisibleLive();
  liveSweepTimer=setInterval(()=>{if(!document.hidden)refreshVisibleLive();},60000);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    clearInterval(liveSweepTimer);
    liveSweepTimer=null;
    if(isMobileFeed())destroyMobileLiveDeck();
  }else{
    startLiveDemandLoop();
    if(isMobileFeed()&&currentMediaMode==="live"&&handle){
      queueMicrotask(()=>openCachedLive(handle,{userGesture:false}));
    }
  }
});

async function loadInitialCatalog(){
  statusEl.textContent="Đang nạp danh sách kênh, trực tiếp và video mới nhất…";
  const [libraryResult,liveResult]=await Promise.allSettled([
    getJson(LIBRARY+"/tiktok/library?t="+Date.now(),15000),
    getJson(EDGE+"/tiktok/live-now?t="+Date.now(),10000)
  ]);

  let latestVideos=[];
  if(libraryResult.status==="fulfilled"&&libraryResult.value?.ok!==false){
    const payload=libraryResult.value||{};
    const channels=Array.isArray(payload.channels)?payload.channels:[];
    sessionChannels.clear();
    catalogChannels.clear();
    for(const channel of channels){
      const h=String(channel?.handle||"").replace(/^@/,"");
      if(!h)continue;
      const profile=channel?.profile||{};
      sessionChannels.set(h,{
        handle:h,
        name:String(profile?.name||("@"+h)),
        avatar:avatarUrl(profile)
      });
      catalogChannels.set(h,channel);
      const newest=Array.isArray(channel?.videos)?channel.videos[0]:null;
      if(newest?.id)latestVideos.push({...newest,handle:h});
    }
    latestVideos.sort((a,b)=>Number(b?.createTime||0)-Number(a?.createTime||0));
    currentChannelListHandle="";
    renderChannels();
    renderVideos(latestVideos);
  }else{
    channelsBox.innerHTML='<div class="empty">Chưa nạp được danh sách kênh.</div>';
    videosBox.innerHTML='<div class="empty">Chưa nạp được danh sách video.</div>';
  }

  if(liveResult.status==="fulfilled"){
    syncLiveNow(liveResult.value);
  }else{
    liveBox.innerHTML='<div class="empty">Chưa đọc được trạng thái trực tiếp.</div>';
  }

  const channelTotal=sessionChannels.size;
  const liveTotal=sessionLiveStates.size;
  statusEl.textContent=channelTotal
    ? channelTotal+" kênh · "+liveTotal+" đang phát · "+latestVideos.length+" video mới nhất"
    : "Chưa nạp được thư viện TikTok.";
}

async function refreshChannelVideos(rawHandle){
  const h=parseHandle(rawHandle);
  if(!h)return;
  const btn=document.getElementById("refreshVideosBtn");
  if(btn)btn.disabled=true;
  statusEl.textContent="@"+h+" · đang cập nhật video…";
  try{
    const endpoint=new URL(LIBRARY+"/tiktok/channel-videos");
    endpoint.searchParams.set("user",h);
    endpoint.searchParams.set("refresh","1");
    endpoint.searchParams.set("full","1");
    endpoint.searchParams.set("wait","1");
    endpoint.searchParams.set("t",Date.now());
    const refreshed=await getJson(endpoint.toString(),60000);
    const directVideos=Array.isArray(refreshed?.videos)?refreshed.videos:[];
    if(directVideos.length){
      currentChannelListHandle=h;
      renderVideos(directVideos.map(row=>({...row,handle:h})));
    }
    const result=await loadChannelLibrary(h).catch(()=>({count:directVideos.length}));
    const count=Math.max(Number(result?.count||0),directVideos.length);
    statusEl.textContent=count
      ? "@"+h+" · đã cập nhật "+count+" video."
      : "@"+h+" · chưa tìm thấy video sau lần cập nhật này.";
  }catch(error){
    statusEl.textContent="Không cập nhật được video: "+String(error?.message||error);
  }finally{
    const currentBtn=document.getElementById("refreshVideosBtn");
    if(currentBtn)currentBtn.disabled=false;
  }
}

async function loadChannelLibrary(h){
  const endpoint=new URL(LIBRARY+"/tiktok/library");
  endpoint.searchParams.set("user",h);
  const data=await getJson(endpoint.toString(),12000);
  if(data?.ok!==true||!data?.channel){
    throw new Error(String(data?.error||"Không lấy được thư viện kênh"));
  }
  currentChannelLibrary=data.channel;
  catalogChannels.set(h,data.channel);
  rememberChannel(h,data.channel.profile||{});
  currentChannelListHandle=h;
  const videos=Array.isArray(data.channel.videos)?data.channel.videos:[];
  renderVideos(videos);
  return {
    count:videos.length,
    profile:data.channel.profile||{},
    version:Number(data.version||0)
  };
}

async function loadLive(h){
  const state=await refreshLiveState(h);
  if(Number(state?.status)!==2){
    nowEl.textContent="Kênh hiện không phát trực tiếp.";
    return false;
  }
  const playable=Boolean(state?.streamUrl||state?.hlsUrl);
  if(!playable){
    nowEl.textContent="Đang phát trực tiếp nhưng chưa có stream URL.";
    return false;
  }
  await playLive(state);
  return true;
}

async function checkLive(raw){
  const h=parseHandle(raw);
  if(!h){
    statusEl.textContent="Link TikTok không hợp lệ.";
    liveBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    videosBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    return;
  }

  handle=h;
  markActiveChannel(h);
  rememberChannel(h,{});
  currentLiveState=null;
  currentLiveStateAt=0;
  currentChannelLibrary=null;
  liveRefreshPromise=null;
  currentVideos=[];
  currentVideoIndex=-1;
  currentMediaMode="idle";
  setMediaChrome({handle:h,title:"@"+h},"idle");
  vodLinkCache.clear();
  stopPlayer();
  streamUrlEl.value="";
  renderChannels();
  if(!sessionLiveStates.size)liveBox.innerHTML='<div class="empty">Đang kiểm tra trực tiếp @'+esc(h)+'…</div>';
  videosBox.className="body";
  videosBox.innerHTML='<div class="empty">Đang đọc thư viện kênh…</div>';
  statusEl.textContent="@"+h+" · đang đọc thư viện và kiểm tra trực tiếp…";
  nowEl.textContent="Đang chờ kết quả…";

  let liveText="đang kiểm tra trực tiếp";
  let videoText="thư viện đang tải";
  const updateStatus=()=>statusEl.textContent="@"+h+" · "+liveText+" · "+videoText;

  const liveTask=loadLive(h)
    .then(isLive=>{
      liveText=isLive?"đang phát":"không phát trực tiếp";
      updateStatus();
    })
    .catch(error=>{
      liveText="kiểm tra trực tiếp lỗi";
      sessionLiveStates.delete(h);
      renderLiveList();
      updateStatus();
      console.warn("LIVE lookup",error);
    });

  const videoTask=loadChannelLibrary(h)
    .then(result=>{
      videoText=result.count?(result.count+" video thư viện"):"không có video";
      if(currentLiveState)renderState(currentLiveState,h);
      updateStatus();
    })
    .catch(error=>{
      videoText="thư viện lỗi";
      videosBox.innerHTML='<div class="empty">Không đọc được thư viện kênh.</div>';
      updateStatus();
      console.warn("channel library",error);
    });

  await Promise.allSettled([liveTask,videoTask]);
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  checkLive(input.value);
});
addChannelBtn.addEventListener("click",()=>addChannel());
video.addEventListener("loadedmetadata",()=>{
  applyMediaShape(video.videoWidth,video.videoHeight);
});
MOBILE_FEED_MQ.addEventListener?.("change",event=>{
  if(!event.matches)destroyMobileLiveDeck();
  else if(currentMediaMode==="live"&&handle)queueMicrotask(()=>openCachedLive(handle,{userGesture:false}));
});
loadInitialCatalog().then(()=>{
  startLiveDemandLoop();
}).catch(error=>{
  statusEl.textContent="Không nạp được danh sách: "+String(error?.message||error);
  startLiveDemandLoop();
});
copyBtn.addEventListener("click",async()=>{
  const url=streamUrlEl.value.trim();
  if(!url)return;
  try{
    await navigator.clipboard.writeText(url);
    copyBtn.textContent="Đã chép";
    setTimeout(()=>copyBtn.textContent="Sao chép",900);
  }catch{
    streamUrlEl.select();
  }
});
