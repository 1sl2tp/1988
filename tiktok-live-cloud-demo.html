<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TikTok LIVE Direct Demo</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}
.top{position:sticky;top:0;z-index:5;padding:12px;background:#111;border-bottom:1px solid #26262a}
.search{max-width:980px;margin:auto;display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #34343a;border-radius:22px;background:#19191d;color:#fff;padding:11px 14px;font-size:15px;outline:none}.search button{border:0;border-radius:22px;padding:0 18px;background:#fe2c55;color:#fff;font-weight:700;cursor:pointer}
.page{max-width:940px;margin:auto;padding:10px 12px}.status{font-size:13px;color:#aaa;margin-bottom:8px;min-height:18px}
.grid{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:10px}.panel{background:#121216;border:1px solid #26262a;border-radius:12px;overflow:hidden}.head{padding:10px 12px;font-weight:800;border-bottom:1px solid #26262a}.body{padding:8px}
.livecard{width:100%;border:0;background:#1b1b20;color:#fff;border-radius:10px;padding:10px;text-align:left;display:flex;gap:9px;align-items:center;cursor:pointer}.livecard:hover{background:#222228}.livecard:disabled{cursor:default;opacity:.75}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#2a2a2f}.meta{min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:#aaa;margin-top:3px}.pill{display:inline-block;margin-top:6px;background:#fe2c55;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:800}
.empty{color:#999;padding:14px 6px;text-align:center}.videos{display:grid;gap:6px}.videoitem{width:100%;border:0;display:grid;grid-template-columns:66px minmax(0,1fr);gap:9px;align-items:center;padding:7px;border-radius:9px;background:#1b1b20;color:#fff;text-align:left;cursor:pointer}.thumb{width:66px;height:88px;object-fit:cover;border-radius:7px;background:#29292f}.vtitle{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vmeta{font-size:11px;color:#aaa;margin-top:4px}.player{position:relative;background:#000;border-radius:10px;overflow:hidden;height:clamp(360px,58vh,560px);display:grid;place-items:center}video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.streamrow{margin-top:8px;display:flex;gap:6px}.streamrow input{flex:1;min-width:0;border:1px solid #34343a;border-radius:8px;background:#19191d;color:#ddd;padding:7px 8px;font-size:11px}.streamrow button{border:1px solid #34343a;background:#1b1b20;color:#fff;border-radius:8px;padding:0 10px;cursor:pointer}.now{padding:7px 2px 0;font-size:12px;color:#aaa;min-height:24px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.player{height:56vh;min-height:320px;max-height:520px}.search{gap:6px}.search button{padding:0 14px}}
</style>
</head>
<body>
<!-- local-video-player-contract -->
<div class="top">
  <form class="search" id="form">
    <input id="input" value="https://www.tiktok.com/@tu.thuong_lay_minh_1/live" placeholder="Dán link TikTok LIVE...">
    <button>Kiểm tra</button>
  </form>
</div>
<div class="page">
  <div class="status" id="status">Dán link LIVE rồi bấm Kiểm tra.</div>
  <div class="grid">
    <section class="panel">
      <div class="head">Kênh / LIVE</div>
      <div class="body" id="liveBox"><div class="empty">Chưa kiểm tra.</div></div>
      <div class="head">Video mới nhất</div>
      <div class="body" id="videosBox"><div class="empty">Chưa tải video.</div></div>
    </section>
    <section class="panel">
      <div class="head">Player LIVE / Video</div>
      <div class="body">
        <div class="player"><video id="video" playsinline controls></video></div>
        <div class="streamrow">
          <input id="streamUrl" readonly placeholder="Link phát LIVE sẽ hiện ở đây">
          <button type="button" id="copyBtn">Sao chép</button>
        </div>
        <div class="now" id="now">Chưa có link phát.</div>
      </div>
    </section>
  </div>
</div>
<script>
const EDGE="https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev";
const form=document.getElementById("form");
const input=document.getElementById("input");
const statusEl=document.getElementById("status");
const liveBox=document.getElementById("liveBox");
const videosBox=document.getElementById("videosBox");
const video=document.getElementById("video");
const streamUrlEl=document.getElementById("streamUrl");
const copyBtn=document.getElementById("copyBtn");
const nowEl=document.getElementById("now");
const LIVE_LINK_TTL_MS=45_000;
const VOD_LINK_TTL_MS=90_000;
const vodLinkCache=new Map();
const preconnectedOrigins=new Set();
let flvPlayer=null;
let handle="";
let currentLiveState=null;
let currentLiveStateAt=0;
let liveRefreshPromise=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function parseHandle(raw){
  raw=String(raw||"").trim();
  const m=raw.match(/(?:https?:\/\/)?(?:www\.)?tiktok\.com\/@([^/?#]+)/i);
  if(m)return decodeURIComponent(m[1]).replace(/^@/,"");
  const h=raw.replace(/^@/,"").split(/[/?#]/)[0];
  return /^[A-Za-z0-9._]{2,32}$/.test(h)?h:"";
}
function stopPlayer(){
  if(flvPlayer){try{flvPlayer.destroy()}catch{} flvPlayer=null}
  video.onerror=null;
  try{video.pause()}catch{}
  video.removeAttribute("src");
  video.load();
}
async function getJson(url,timeout=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{cache:"no-store",signal:controller.signal});
    const body=await r.json().catch(()=>null);
    if(!r.ok)throw new Error(body?.error||("HTTP "+r.status));
    return body;
  }finally{
    clearTimeout(timer);
  }
}
function renderState(state){
  const live=Number(state?.status)===2;
  const playable=Boolean(live&&(state?.streamUrl||state?.hlsUrl));
  if(playable){
    currentLiveState=state;
    currentLiveStateAt=Date.now();
  }else if(!live){
    currentLiveState=null;
    currentLiveStateAt=0;
  }

  const avatar=String(state?.avatar||"");
  const name=String(state?.sourceName||("@"+handle));
  const viewer=Number(state?.viewerCount||0);
  liveBox.innerHTML=
    '<button type="button" class="livecard" id="liveReplay"'+(playable?'':' disabled')+'>'+
      (avatar?'<img class="avatar" src="'+esc(avatar)+'" alt="">':'<div class="avatar"></div>')+
      '<div class="meta"><div class="name">'+esc(name)+'</div>'+
      '<div class="sub">@'+esc(handle)+(viewer?" · "+viewer+" người xem":"")+'</div>'+
      (live
        ? '<span class="pill">LIVE</span><div class="sub">Bấm để quay lại LIVE</div>'
        : '<div class="sub">Không có LIVE đang phát</div>')+
      '</div></button>';

  const liveReplay=document.getElementById("liveReplay");
  if(playable&&liveReplay){
    liveReplay.addEventListener("click",()=>replayLive());
  }
}
async function playLive(state){
  stopPlayer();
  const flv=String(state?.streamUrl||"");
  const hls=String(state?.hlsUrl||"");
  const stream=flv||hls;
  streamUrlEl.value=stream;
  if(!stream){
    nowEl.textContent="LIVE nhưng chưa có link phát.";
    return false;
  }

  nowEl.textContent="@"+handle+" · đã lấy link phát mới";
  if(flv&&window.mpegts?.isSupported?.()){
    flvPlayer=mpegts.createPlayer(
      {type:"flv",isLive:true,url:flv,cors:true,withCredentials:false},
      {enableStashBuffer:false,lazyLoad:false,liveSync:true}
    );
    flvPlayer.attachMediaElement(video);
    flvPlayer.load();
    flvPlayer.play().catch(()=>video.play().catch(()=>{}));
    return true;
  }

  if(hls){
    video.src=hls;
    video.load();
    video.play().catch(()=>{});
    return true;
  }

  nowEl.textContent="Có link nhưng trình phát hiện tại không hỗ trợ định dạng này.";
  return false;
}

function liveStateFresh(){
  return Boolean(
    currentLiveState&&
    (currentLiveState.streamUrl||currentLiveState.hlsUrl)&&
    Date.now()-currentLiveStateAt<LIVE_LINK_TTL_MS
  );
}

async function refreshLiveState(h){
  if(liveRefreshPromise)return liveRefreshPromise;
  liveRefreshPromise=getJson(
    EDGE+"/lookup?user="+encodeURIComponent(h)+"&t="+Date.now(),
    15000
  ).then(state=>{
    renderState(state);
    return state;
  }).finally(()=>{
    liveRefreshPromise=null;
  });
  return liveRefreshPromise;
}

async function replayLive(){
  if(!handle)return false;
  if(liveStateFresh()){
    const state=currentLiveState;
    await playLive(state);
    refreshLiveState(handle).catch(()=>{});
    return true;
  }

  nowEl.textContent="@"+handle+" · đang làm mới link LIVE…";
  try{
    const state=await refreshLiveState(handle);
    if(Number(state?.status)===2&&(state?.streamUrl||state?.hlsUrl)){
      return playLive(state);
    }
    nowEl.textContent="Kênh hiện không LIVE.";
  }catch(error){
    nowEl.textContent="Không làm mới được LIVE: "+String(error?.message||error);
  }
  return false;
}

function renderVideos(rows){
  const videos=Array.isArray(rows)?rows:[];
  if(!videos.length){
    videosBox.innerHTML='<div class="empty">Kênh chưa trả video.</div>';
    return;
  }
  videosBox.className="body videos";
  videosBox.innerHTML=videos.map((row,i)=>
    '<button type="button" class="videoitem" data-video-i="'+i+'">'+
      (row.thumbnail
        ? '<img class="thumb" src="'+esc(row.thumbnail)+'" alt="">'
        : '<div class="thumb"></div>')+
      '<div><div class="vtitle">'+esc(row.title||("Video "+row.id))+'</div>'+
      '<div class="vmeta">@'+esc(row.handle||handle)+' · '+esc(row.id)+'</div></div></button>'
  ).join("");
  videosBox.querySelectorAll("[data-video-i]").forEach(btn=>{
    const row=videos[Number(btn.dataset.videoI)||0];
    const warm=()=>{ if(row)warmVideoLink(row); };
    btn.addEventListener("pointerenter",warm,{once:true});
    btn.addEventListener("pointerdown",warm,{once:true});
    btn.addEventListener("touchstart",warm,{once:true,passive:true});
    btn.addEventListener("click",()=>{
      if(row)playChannelVideo(row);
    });
  });
}

async function resolveTikwmVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://www.tikwm.com/api/?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  if(Number(data?.code)!==0)throw new Error(String(data?.msg||("TikWM code "+data?.code)));
  const body=data?.data||{};
  let url=String(body?.hdplay||body?.play||"").trim();
  if(!url)throw new Error("TikWM không trả link phát");
  if(url.startsWith("//"))url="https:"+url;
  else if(url.startsWith("/"))url="https://www.tikwm.com"+url;
  return url;
}

function videoCacheKey(row){
  const h=String(row?.handle||handle||"").replace(/^@/,"").toLowerCase();
  return h+":"+String(row?.id||"");
}

function preconnectMediaOrigin(url){
  try{
    const origin=new URL(url).origin;
    if(!origin||preconnectedOrigins.has(origin))return;
    preconnectedOrigins.add(origin);
    const link=document.createElement("link");
    link.rel="preconnect";
    link.href=origin;
    link.crossOrigin="anonymous";
    document.head.appendChild(link);
  }catch{}
}

async function getWarmTikwmLink(row){
  const key=videoCacheKey(row);
  const cached=vodLinkCache.get(key);
  if(cached?.url&&cached.expiresAt>Date.now())return cached.url;
  if(cached?.promise)return cached.promise;

  const promise=resolveTikwmVideo(row)
    .then(url=>{
      preconnectMediaOrigin(url);
      vodLinkCache.set(key,{url,expiresAt:Date.now()+VOD_LINK_TTL_MS});
      return url;
    })
    .catch(error=>{
      vodLinkCache.delete(key);
      throw error;
    });

  vodLinkCache.set(key,{promise,expiresAt:0});
  return promise;
}

function warmVideoLink(row){
  getWarmTikwmLink(row).catch(()=>{});
}

async function resolveBhwaVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://downloader-api.bhwa233.com/api/parse?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  const root=data?.data||data||{};
  const rows=[
    root?.originDownloadVideoUrl,
    root?.downloadVideoUrl,
    root?.video?.originDownloadVideoUrl,
    root?.video?.downloadVideoUrl,
    root?.video?.url,
    root?.url
  ].flat().filter(Boolean);
  const url=String(rows[0]||"").trim();
  if(!/^https?:\/\//i.test(url))throw new Error("BHWA không trả link video");
  return url;
}

async function playChannelVideo(row){
  stopPlayer();
  const h=String(row?.handle||handle||"").replace(/^@/,"");
  const id=String(row?.id||"");
  if(!h||!/^\d{8,}$/.test(id))return;

  let bhwaTried=false;
  const tryBhwa=async()=>{
    if(bhwaTried)return false;
    bhwaTried=true;
    try{
      const direct=await resolveBhwaVideo(row);
      streamUrlEl.value=direct;
      nowEl.textContent="@"+h+" · TikWM lỗi → BHWA";
      video.src=direct;
      video.load();
      await video.play().catch(()=>{});
      return true;
    }catch(error){
      nowEl.textContent="Không mở được video: "+String(error?.message||error);
      return false;
    }
  };

  try{
    nowEl.textContent="@"+h+" · đang lấy TikWM HD…";
    const direct=await getWarmTikwmLink(row);
    streamUrlEl.value=direct;
    nowEl.textContent="@"+h+" · TikWM";
    video.onerror=()=>{ video.onerror=null; vodLinkCache.delete(videoCacheKey(row)); tryBhwa(); };
    video.preload="metadata";
    video.src=direct;
    video.load();
    try{
      await video.play();
    }catch(error){
      if(String(error?.name||"")==="NotAllowedError")return;
      await tryBhwa();
    }
  }catch{
    await tryBhwa();
  }
}

async function loadChannelVideos(h){
  const endpoint=new URL(EDGE+"/tiktok/channel-videos");
  endpoint.searchParams.set("user",h);
  endpoint.searchParams.set("count","1");
  endpoint.searchParams.set("t",Date.now());
  const data=await getJson(endpoint.toString(),15000);
  if(data?.ok!==true)throw new Error(String(data?.error||"Không lấy được video"));
  renderVideos(data.videos);
  return Array.isArray(data?.videos)?data.videos.length:0;
}

async function loadLive(h){
  const state=await refreshLiveState(h);
  if(Number(state?.status)!==2){
    nowEl.textContent="Kênh hiện không LIVE.";
    return false;
  }
  const playable=Boolean(state?.streamUrl||state?.hlsUrl);
  if(!playable){
    nowEl.textContent="Đang LIVE nhưng response chưa có stream URL.";
    return false;
  }
  await playLive(state);
  return true;
}

async function checkLive(raw){
  const h=parseHandle(raw);
  if(!h){
    statusEl.textContent="Link TikTok không hợp lệ.";
    liveBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    videosBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    return;
  }

  handle=h;
  currentLiveState=null;
  currentLiveStateAt=0;
  liveRefreshPromise=null;
  vodLinkCache.clear();
  stopPlayer();
  streamUrlEl.value="";
  liveBox.innerHTML='<div class="empty">Đang kiểm tra LIVE @'+esc(h)+'…</div>';
  videosBox.className="body";
  videosBox.innerHTML='<div class="empty">Đang lấy video mới nhất…</div>';
  statusEl.textContent="@"+h+" · đang kiểm tra LIVE và video…";
  nowEl.textContent="Đang chờ kết quả…";

  let liveText="LIVE đang kiểm tra";
  let videoText="video đang tải";
  const updateStatus=()=>statusEl.textContent="@"+h+" · "+liveText+" · "+videoText;

  const liveTask=loadLive(h)
    .then(isLive=>{
      liveText=isLive?"đang LIVE":"không LIVE";
      updateStatus();
    })
    .catch(error=>{
      liveText="LIVE lỗi";
      liveBox.innerHTML='<div class="empty">Không lấy được LIVE.</div>';
      updateStatus();
      console.warn("LIVE lookup",error);
    });

  const videoTask=loadChannelVideos(h)
    .then(count=>{
      videoText=count?"1 video mới nhất":"không có video";
      updateStatus();
    })
    .catch(error=>{
      videoText="video lỗi";
      videosBox.innerHTML='<div class="empty">Không lấy được video của kênh.</div>';
      updateStatus();
      console.warn("channel videos",error);
    });

  await Promise.allSettled([liveTask,videoTask]);
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  checkLive(input.value);
});
copyBtn.addEventListener("click",async()=>{
  const url=streamUrlEl.value.trim();
  if(!url)return;
  try{
    await navigator.clipboard.writeText(url);
    copyBtn.textContent="Đã chép";
    setTimeout(()=>copyBtn.textContent="Sao chép",900);
  }catch{
    streamUrlEl.select();
  }
});
</script>
</body>
</html>
