<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TikTok Direct Demo</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}
.top{position:sticky;top:0;z-index:5;padding:12px;background:#111;border-bottom:1px solid #26262a}
.search{max-width:1100px;margin:auto;display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #34343a;border-radius:22px;background:#19191d;color:#fff;padding:11px 14px;font-size:15px;outline:none}.search button{border:0;border-radius:22px;padding:0 18px;background:#fe2c55;color:#fff;font-weight:700;cursor:pointer}.search .secondary{background:#25252b}.search button:disabled{opacity:.55;cursor:default}
.page{max-width:1540px;margin:auto;padding:10px 12px}.status{font-size:13px;color:#aaa;margin-bottom:8px;min-height:18px}
.grid{display:grid;grid-template-columns:minmax(220px,260px) minmax(260px,330px) minmax(0,1fr);grid-template-areas:"source videos player";gap:12px;align-items:start}
.leftstack{grid-area:source;display:grid;gap:12px;align-self:start}.videopanel{grid-area:videos}.playerpanel{grid-area:player;position:sticky;top:70px}
.panel{background:#121216;border:1px solid #26262a;border-radius:12px;overflow:hidden;min-width:0}.head{padding:10px 12px;font-weight:800;border-bottom:1px solid #26262a;display:flex;align-items:center;justify-content:space-between;gap:8px}.body{padding:8px}
.headbadge{font-size:11px;color:#bbb;background:#232329;border-radius:999px;padding:4px 8px;font-weight:700}.listbody{overflow:visible}
.livecard,.channelcard{width:100%;border:0;background:#1b1b20;color:#fff;border-radius:10px;padding:9px;text-align:left;display:flex;gap:9px;align-items:center;cursor:pointer}.livecard:hover,.channelcard:hover{background:#222228}.livecard.active,.channelcard.active{outline:2px solid #25f4ee;background:#202026}.channelrow{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:6px;align-items:stretch}.removebtn{border:0;border-radius:10px;background:#1b1b20;color:#999;font-size:20px;cursor:pointer}.removebtn:hover{background:#2a1d21;color:#fff}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#2a2a2f;flex:0 0 auto}.meta{min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:#aaa;margin-top:3px}.pill{display:inline-block;margin-top:6px;background:#fe2c55;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:800}.channelstatus{margin-left:auto;font-size:10px;color:#8f8f98}
.empty{color:#999;padding:14px 6px;text-align:center}.videos{display:grid;gap:6px;overflow:visible}.videoitem{width:100%;border:0;display:grid;grid-template-columns:66px minmax(0,1fr);gap:9px;align-items:center;padding:7px;border-radius:9px;background:#1b1b20;color:#fff;text-align:left;cursor:pointer}.videoitem.active{outline:2px solid #fe2c55;background:#242429}.thumb{width:66px;height:88px;object-fit:cover;border-radius:7px;background:#29292f}.vtitle{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vmeta{font-size:11px;color:#aaa;margin-top:4px}.player{position:relative;background:#000;border-radius:14px;overflow:hidden;height:clamp(430px,72vh,720px);touch-action:pan-x;overscroll-behavior:contain;user-select:none}
.mediaframe{position:absolute;inset:12px 74px 12px 12px;border-radius:12px;overflow:hidden;background:#000;display:grid;place-items:center;transition:left .18s,right .18s,width .18s,transform .18s}
.player.shape-portrait .mediaframe{top:12px;bottom:12px;left:50%;right:auto;width:min(52%,430px);transform:translateX(-50%)}
.player.shape-landscape .mediaframe,.player.shape-auto .mediaframe{inset:12px 74px 12px 12px;width:auto;transform:none}
.livebadge{position:absolute;left:18px;top:18px;z-index:5;width:10px;height:10px;border-radius:50%;background:#fe2c55;box-shadow:0 0 0 4px #fe2c5533;display:none}.player.mode-live .livebadge{display:block}
video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.actionrail{position:absolute;right:14px;bottom:26px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:13px}
.actionbtn{width:48px;height:48px;border:0;border-radius:50%;background:#252529;color:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer;box-shadow:0 3px 14px #0008}
.actionbtn.avatarbtn{padding:0;border:2px solid #fff;background:#111;overflow:hidden}
.actionbtn.avatarbtn img{width:100%;height:100%;object-fit:cover}
.actioncount{font-size:11px;font-weight:700;color:#ddd;margin-top:-8px;min-height:13px}
.navrail{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:10px}
.navbtn{width:42px;height:42px;border:0;border-radius:50%;background:#2a2a2ecc;color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px)}
.navbtn:disabled{opacity:.28;cursor:default}
.caption{position:absolute;left:26px;right:92px;bottom:24px;z-index:3;text-shadow:0 2px 10px #000;pointer-events:none}
.caption .ctitle{font-size:15px;font-weight:800;line-height:1.25}.caption .csub{font-size:12px;color:#eee;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gesturehint{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3;padding:5px 10px;border-radius:999px;background:#0008;color:#ddd;font-size:11px;opacity:0;transition:opacity .18s;pointer-events:none}
.player.gesture .gesturehint{opacity:1}
.streamrow{margin-top:8px;display:flex;gap:6px}.streamrow input{flex:1;min-width:0;border:1px solid #34343a;border-radius:8px;background:#19191d;color:#ddd;padding:7px 8px;font-size:11px}.streamrow button{border:1px solid #34343a;background:#1b1b20;color:#fff;border-radius:8px;padding:0 10px;cursor:pointer}.now{padding:7px 2px 0;font-size:12px;color:#aaa;min-height:24px}
@media(max-width:1180px) and (min-width:761px){
  .grid{grid-template-columns:minmax(230px,280px) minmax(0,1fr);grid-template-areas:"source player" "videos player"}
}
@media(max-width:760px){
  .page{padding:8px}
  .grid{grid-template-columns:1fr;grid-template-areas:"player" "source" "videos"}
  .playerpanel{position:static}.leftstack{grid-template-columns:1fr 1fr}
  .player{height:min(76vh,720px);min-height:440px;max-height:none;border-radius:0;margin:0 -8px}
  .mediaframe,.player.shape-portrait .mediaframe,.player.shape-landscape .mediaframe,.player.shape-auto .mediaframe{inset:0;width:auto;transform:none;border-radius:0}
  .actionrail{right:10px;bottom:22px}
  .navrail{right:10px;top:48%}
  .caption{left:14px;right:78px;bottom:18px}
  .gesturehint{top:10px}.livebadge{left:10px;top:10px}
  .streamrow{display:none}
  .search{gap:6px}.search button{padding:0 14px}
}
@media(max-width:520px){.leftstack{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- local-video-player-contract -->
<div class="top">
  <form class="search" id="form">
    <input id="input" value="https://www.tiktok.com/@tu.thuong_lay_minh_1/live" placeholder="Dán link hoặc @tên_kênh TikTok...">
    <button type="submit">Mở</button>
    <button type="button" class="secondary" id="addChannelBtn">+ Thêm kênh</button>
  </form>
</div>
<div class="page">
  <div class="status" id="status">Dán link TikTok rồi bấm Kiểm tra.</div>
  <div class="grid">
    <div class="leftstack">
      <section class="panel">
        <div class="head"><span>Đang phát</span><span class="headbadge" id="liveCount">0</span></div>
        <div class="body listbody" id="liveBox"><div class="empty">Chưa có kênh đang phát.</div></div>
      </section>
      <section class="panel">
        <div class="head"><span>Kênh</span><span class="headbadge" id="channelCount">0</span></div>
        <div class="body listbody" id="channelsBox"><div class="empty">Chưa mở kênh.</div></div>
      </section>
    </div>
    <section class="panel videopanel">
      <div class="head"><span>Danh sách video</span><span class="headbadge" id="videoCount">0</span></div>
      <div class="body" id="videosBox"><div class="empty">Chưa tải video.</div></div>
    </section>
    <section class="panel playerpanel">
      <div class="head"><span id="playerKind">Media</span><span class="headbadge" id="playerShape">Chưa phát</span></div>
      <div class="body">
        <div class="player shape-auto" id="playerStage">
  <div class="mediaframe"><video id="video" playsinline controls></video></div>
  <div class="livebadge" aria-label="Đang phát"></div>
  <div class="gesturehint">Vuốt / cuộn để chuyển video</div>
  <div class="navrail">
    <button class="navbtn" type="button" id="prevMedia" aria-label="Video trước">↑</button>
    <button class="navbtn" type="button" id="nextMedia" aria-label="Video tiếp">↓</button>
  </div>
  <div class="actionrail">
    <button class="actionbtn avatarbtn" type="button" id="mediaAvatar" aria-label="Kênh"><span>♪</span></button>
    <button class="actionbtn" type="button" aria-label="Thích">♥</button><div class="actioncount" id="likeCount"></div>
    <button class="actionbtn" type="button" aria-label="Bình luận">💬</button><div class="actioncount" id="commentCount"></div>
    <button class="actionbtn" type="button" aria-label="Lưu">🔖</button><div class="actioncount" id="saveCount"></div>
    <button class="actionbtn" type="button" aria-label="Chia sẻ">↗</button><div class="actioncount" id="shareCount"></div>
  </div>
  <div class="caption">
    <div class="ctitle" id="mediaTitle">Chưa có media</div>
    <div class="csub" id="mediaSub">Chọn trực tiếp hoặc video để phát</div>
  </div>
</div>
        <div class="streamrow">
          <input id="streamUrl" readonly placeholder="Link phát trực tiếp sẽ hiện ở đây">
          <button type="button" id="copyBtn">Sao chép</button>
        </div>
        <div class="now" id="now">Chưa có link phát.</div>
      </div>
    </section>
  </div>
</div>
<script>
const EDGE="https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev";
const LIBRARY="https://one988-tiktok-session.onrender.com";
const form=document.getElementById("form");
const input=document.getElementById("input");
const statusEl=document.getElementById("status");
const addChannelBtn=document.getElementById("addChannelBtn");
const liveBox=document.getElementById("liveBox");
const channelsBox=document.getElementById("channelsBox");
const videosBox=document.getElementById("videosBox");
const liveCount=document.getElementById("liveCount");
const channelCount=document.getElementById("channelCount");
const videoCount=document.getElementById("videoCount");
const playerKind=document.getElementById("playerKind");
const playerShape=document.getElementById("playerShape");
const video=document.getElementById("video");
const streamUrlEl=document.getElementById("streamUrl");
const copyBtn=document.getElementById("copyBtn");
const nowEl=document.getElementById("now");
const playerStage=document.getElementById("playerStage");
const prevMedia=document.getElementById("prevMedia");
const nextMedia=document.getElementById("nextMedia");
const mediaAvatar=document.getElementById("mediaAvatar");
const mediaTitle=document.getElementById("mediaTitle");
const mediaSub=document.getElementById("mediaSub");
const likeCount=document.getElementById("likeCount");
const commentCount=document.getElementById("commentCount");
const saveCount=document.getElementById("saveCount");
const shareCount=document.getElementById("shareCount");
const LIVE_LINK_TTL_MS=45_000;
const VOD_LINK_TTL_MS=90_000;
const vodLinkCache=new Map();
const preconnectedOrigins=new Set();
let flvPlayer=null;
let handle="";
let currentLiveState=null;
let currentLiveStateAt=0;
let currentChannelLibrary=null;
let liveRefreshPromise=null;
let currentVideos=[];
let currentVideoIndex=-1;
let currentMediaMode="idle";
let wheelLocked=false;
let touchStartY=null;
const sessionChannels=new Map();
const sessionLiveStates=new Map();
const catalogChannels=new Map();
let currentChannelListHandle="";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function compactCount(v){
  const n=Number(v);
  if(!Number.isFinite(n)||n<=0)return "";
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K";
  return String(Math.round(n));
}
function firstNumber(...vals){
  for(const v of vals){const n=Number(v);if(Number.isFinite(n)&&n>0)return n}
  return 0;
}
function avatarUrl(profile){
  return String(profile?.avatar?.url||profile?.avatar||"");
}
function rememberChannel(h,profile={}){
  h=String(h||"").replace(/^@/,"");
  if(!h)return;
  const prev=sessionChannels.get(h)||{};
  const next={
    handle:h,
    name:String(profile?.name||prev.name||("@"+h)),
    avatar:avatarUrl(profile)||prev.avatar||""
  };
  sessionChannels.delete(h);
  sessionChannels.set(h,next);
  renderChannels();
}
function renderChannels(){
  const rows=[...sessionChannels.values()].sort((a,b)=>
    Number(sessionLiveStates.has(b.handle))-Number(sessionLiveStates.has(a.handle))||
    String(a.name||a.handle).localeCompare(String(b.name||b.handle),'vi')
  );
  channelCount.textContent=String(rows.length);
  if(!rows.length){channelsBox.innerHTML='<div class="empty">Chưa có kênh.</div>';return}
  channelsBox.innerHTML=rows.map(row=>
    '<div class="channelrow">'+
      '<button type="button" class="channelcard'+(row.handle===handle?' active':'')+'" data-channel="'+esc(row.handle)+'">'+
        (row.avatar?'<img class="avatar" loading="lazy" src="'+esc(row.avatar)+'" alt="">':'<div class="avatar"></div>')+
        '<div class="meta"><div class="name">'+esc(row.name)+'</div><div class="sub">@'+esc(row.handle)+'</div></div>'+
        '<span class="channelstatus">'+(sessionLiveStates.has(row.handle)?'●':'')+'</span>'+
      '</button>'+
      '<button type="button" class="removebtn" data-remove-channel="'+esc(row.handle)+'" aria-label="Xóa kênh khỏi danh sách" title="Xóa kênh">×</button>'+
    '</div>'
  ).join("");
  channelsBox.querySelectorAll("[data-channel]").forEach(btn=>btn.addEventListener("click",()=>{
    const h=btn.dataset.channel||"";
    if(!h)return;
    input.value="https://www.tiktok.com/@"+h+"/live";
    checkLive(h);
  }));
  channelsBox.querySelectorAll("[data-remove-channel]").forEach(btn=>btn.addEventListener("click",()=>{
    removeChannel(btn.dataset.removeChannel||"");
  }));
}
function renderLiveList(){
  const rows=[...sessionLiveStates.entries()].map(([h,state])=>({h,state})).reverse();
  liveCount.textContent=String(rows.length);
  if(!rows.length){liveBox.innerHTML='<div class="empty">Chưa có kênh đang phát.</div>';renderChannels();return}
  liveBox.innerHTML=rows.map(({h,state})=>{
    const ch=sessionChannels.get(h)||{};
    const avatar=String(state?.avatar||ch.avatar||"");
    const name=String(state?.sourceName||ch.name||("@"+h));
    const viewer=Number(state?.viewerCount||0);
    return '<button type="button" class="livecard'+(h===handle&&currentMediaMode==="live"?' active':'')+'" data-live-h="'+esc(h)+'">'+
      (avatar?'<img class="avatar" src="'+esc(avatar)+'" alt="">':'<div class="avatar"></div>')+
      '<div class="meta"><div class="name">'+esc(name)+'</div><div class="sub">@'+esc(h)+(viewer?' · '+compactCount(viewer)+' đang xem':'')+'</div><span class="pill">●</span></div></button>';
  }).join("");
  liveBox.querySelectorAll("[data-live-h]").forEach(btn=>btn.addEventListener("click",()=>{
    const h=btn.dataset.liveH||"";
    if(!h)return;
    if(h===handle){replayLive();return}
    input.value="https://www.tiktok.com/@"+h+"/live";
    checkLive(h);
  }));
  renderChannels();
}
function applyMediaShape(width,height){
  const w=Number(width||0),h=Number(height||0);
  playerStage.classList.remove("shape-portrait","shape-landscape","shape-auto");
  if(w>0&&h>0){
    const portrait=h>w;
    playerStage.classList.add(portrait?"shape-portrait":"shape-landscape");
    playerShape.textContent=portrait?"Video dọc":"Video ngang";
  }else{
    playerStage.classList.add("shape-auto");
    playerShape.textContent=currentMediaMode==="live"?"Trực tiếp · chờ tỷ lệ":"Đang xác định";
  }
}
function rowDimensions(row){
  return {
    width:firstNumber(row?.width,row?.videoWidth,row?.video_width,row?.cover?.width,row?.stats?.width),
    height:firstNumber(row?.height,row?.videoHeight,row?.video_height,row?.cover?.height,row?.stats?.height)
  };
}
function videoThumb(row){
  return String(row?.thumbnail||row?.cover?.url||row?.coverUrl||row?.image||"");
}
function updateNav(){
  const vod=currentMediaMode==="vod"&&currentVideos.length>0;
  prevMedia.disabled=!vod||currentVideoIndex<=0;
  nextMedia.disabled=!vod||currentVideoIndex>=currentVideos.length-1;
}
function setMediaChrome(row,mode="vod"){
  currentMediaMode=mode;
  playerStage.classList.toggle("mode-live",mode==="live");
  playerKind.textContent=mode==="live"?"Trực tiếp":mode==="vod"?"Video":"Media";
  const dims=rowDimensions(row);
  applyMediaShape(dims.width,dims.height);
  const profile=currentChannelLibrary?.profile||{};
  const h=String(row?.handle||handle||"").replace(/^@/,"");
  const channel=sessionChannels.get(h)||{};
  const avatar=String(row?.avatar||channel.avatar||profile?.avatar?.url||"");
  mediaAvatar.innerHTML=avatar?'<img src="'+esc(avatar)+'" alt="">':'<span>♪</span>';
  mediaTitle.textContent=String(row?.title||row?.sourceName||profile?.name||(h?"@"+h:"TikTok"));
  const viewer=firstNumber(row?.viewerCount);
  mediaSub.textContent=mode==="live"
    ? ("@"+h+(viewer?" · "+compactCount(viewer)+" đang xem":""))
    : ("@"+h);
  likeCount.textContent=compactCount(firstNumber(row?.diggCount,row?.likes,row?.likeCount,row?.stats?.likes));
  commentCount.textContent=compactCount(firstNumber(row?.commentCount,row?.comments,row?.stats?.comments));
  saveCount.textContent=compactCount(firstNumber(row?.collectCount,row?.saveCount,row?.stats?.saves));
  shareCount.textContent=compactCount(firstNumber(row?.shareCount,row?.shares,row?.stats?.shares));
  updateNav();
}
function parseHandle(raw){
  raw=String(raw||"").trim();
  const m=raw.match(/(?:https?:\/\/)?(?:www\.)?tiktok\.com\/@([^/?#]+)/i);
  if(m)return decodeURIComponent(m[1]).replace(/^@/,"");
  const h=raw.replace(/^@/,"").split(/[/?#]/)[0];
  return /^[A-Za-z0-9._]{2,32}$/.test(h)?h:"";
}
function stopPlayer(){
  if(flvPlayer){try{flvPlayer.destroy()}catch{} flvPlayer=null}
  video.onerror=null;
  try{video.pause()}catch{}
  video.removeAttribute("src");
  video.load();
}
async function getJson(url,timeout=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{cache:"no-store",signal:controller.signal});
    const body=await r.json().catch(()=>null);
    if(!r.ok)throw new Error(body?.error||("HTTP "+r.status));
    return body;
  }finally{
    clearTimeout(timer);
  }
}
function renderState(state,stateHandle=handle){
  const h=String(stateHandle||handle||"").replace(/^@/,"");
  const live=Number(state?.status)===2;
  const playable=Boolean(live&&(state?.streamUrl||state?.hlsUrl));
  if(h===handle){
    if(playable){
      currentLiveState=state;
      currentLiveStateAt=Date.now();
    }else if(!live){
      currentLiveState=null;
      currentLiveStateAt=0;
    }
  }
  const profile=h===handle?(currentChannelLibrary?.profile||{}):(sessionChannels.get(h)||{});
  rememberChannel(h,profile);
  if(playable)sessionLiveStates.set(h,{...state,handle:h});
  else if(!live)sessionLiveStates.delete(h);
  renderLiveList();
}
async function playLive(state){
  stopPlayer();
  currentVideoIndex=-1;
  setMediaChrome({...state,handle}, "live");
  const flv=String(state?.streamUrl||"");
  const hls=String(state?.hlsUrl||"");
  const stream=flv||hls;
  streamUrlEl.value=stream;
  if(!stream){
    nowEl.textContent="Đang phát nhưng chưa có link phát.";
    return false;
  }

  nowEl.textContent="@"+handle+" · đã lấy link phát mới";
  if(flv&&window.mpegts?.isSupported?.()){
    flvPlayer=mpegts.createPlayer(
      {type:"flv",isLive:true,url:flv,cors:true,withCredentials:false},
      {enableStashBuffer:false,lazyLoad:false,liveSync:true}
    );
    flvPlayer.attachMediaElement(video);
    flvPlayer.load();
    flvPlayer.play().catch(()=>video.play().catch(()=>{}));
    return true;
  }

  if(hls){
    video.src=hls;
    video.load();
    video.play().catch(()=>{});
    return true;
  }

  nowEl.textContent="Có link nhưng trình phát hiện tại không hỗ trợ định dạng này.";
  return false;
}

function liveStateFresh(){
  return Boolean(
    currentLiveState&&
    (currentLiveState.streamUrl||currentLiveState.hlsUrl)&&
    Date.now()-currentLiveStateAt<LIVE_LINK_TTL_MS
  );
}

async function refreshLiveState(h){
  if(liveRefreshPromise)return liveRefreshPromise;
  liveRefreshPromise=getJson(
    EDGE+"/lookup?user="+encodeURIComponent(h)+"&t="+Date.now(),
    15000
  ).then(state=>{
    renderState(state,h);
    return state;
  }).finally(()=>{
    liveRefreshPromise=null;
  });
  return liveRefreshPromise;
}

async function replayLive(){
  if(!handle)return false;
  if(liveStateFresh()){
    const state=currentLiveState;
    await playLive(state);
    refreshLiveState(handle).catch(()=>{});
    return true;
  }

  nowEl.textContent="@"+handle+" · đang làm mới link trực tiếp…";
  try{
    const state=await refreshLiveState(handle);
    if(Number(state?.status)===2&&(state?.streamUrl||state?.hlsUrl)){
      return playLive(state);
    }
    nowEl.textContent="Kênh hiện không phát trực tiếp.";
  }catch(error){
    nowEl.textContent="Không làm mới được trực tiếp: "+String(error?.message||error);
  }
  return false;
}

function renderVideos(rows){
  const videos=Array.isArray(rows)?rows:[];
  currentVideos=videos;
  videoCount.textContent=String(videos.length);
  if(currentMediaMode==="vod"&&currentVideoIndex>=videos.length)currentVideoIndex=-1;
  updateNav();
  if(!videos.length){
    videosBox.innerHTML='<div class="empty">Kênh chưa trả video.</div>';
    return;
  }
  videosBox.className="body videos";
  videosBox.innerHTML=videos.map((row,i)=>{
    const thumb=videoThumb(row);
    return '<button type="button" class="videoitem" data-video-i="'+i+'">'+
      (thumb
        ? '<img class="thumb" loading="lazy" src="'+esc(thumb)+'" alt="">'
        : '<div class="thumb"></div>')+
      '<div><div class="vtitle">'+esc(row.title||("Video "+row.id))+'</div>'+
      '<div class="vmeta">@'+esc(row.handle||handle)+' · '+esc(row.id)+'</div></div></button>';
  }).join("");
  videosBox.querySelectorAll("[data-video-i]").forEach(btn=>{
    const row=videos[Number(btn.dataset.videoI)||0];
    const warm=()=>{ if(row)warmVideoLink(row); };
    btn.addEventListener("pointerenter",warm,{once:true});
    btn.addEventListener("pointerdown",warm,{once:true});
    btn.addEventListener("touchstart",warm,{once:true,passive:true});
    btn.addEventListener("click",()=>{
      if(row){
        currentVideoIndex=Number(btn.dataset.videoI)||0;
        playChannelVideo(row,currentVideoIndex);
      }
    });
  });
}

async function resolveTikwmVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://www.tikwm.com/api/?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  if(Number(data?.code)!==0)throw new Error(String(data?.msg||("TikWM code "+data?.code)));
  const body=data?.data||{};
  let url=String(body?.hdplay||body?.play||"").trim();
  if(!url)throw new Error("TikWM không trả link phát");
  if(url.startsWith("//"))url="https:"+url;
  else if(url.startsWith("/"))url="https://www.tikwm.com"+url;
  return url;
}

function videoCacheKey(row){
  const h=String(row?.handle||handle||"").replace(/^@/,"").toLowerCase();
  return h+":"+String(row?.id||"");
}

function preconnectMediaOrigin(url){
  try{
    const origin=new URL(url).origin;
    if(!origin||preconnectedOrigins.has(origin))return;
    preconnectedOrigins.add(origin);
    const link=document.createElement("link");
    link.rel="preconnect";
    link.href=origin;
    link.crossOrigin="anonymous";
    document.head.appendChild(link);
  }catch{}
}

async function getWarmTikwmLink(row){
  const key=videoCacheKey(row);
  const cached=vodLinkCache.get(key);
  if(cached?.url&&cached.expiresAt>Date.now())return cached.url;
  if(cached?.promise)return cached.promise;

  const promise=resolveTikwmVideo(row)
    .then(url=>{
      preconnectMediaOrigin(url);
      vodLinkCache.set(key,{url,expiresAt:Date.now()+VOD_LINK_TTL_MS});
      return url;
    })
    .catch(error=>{
      vodLinkCache.delete(key);
      throw error;
    });

  vodLinkCache.set(key,{promise,expiresAt:0});
  return promise;
}

function warmVideoLink(row){
  getWarmTikwmLink(row).catch(()=>{});
}

async function resolveBhwaVideo(row){
  const pageUrl=String(row?.pageUrl||("https://www.tiktok.com/@"+row.handle+"/video/"+row.id));
  const api="https://downloader-api.bhwa233.com/api/parse?url="+encodeURIComponent(pageUrl);
  const data=await getJson(api,12000);
  const root=data?.data||data||{};
  const rows=[
    root?.originDownloadVideoUrl,
    root?.downloadVideoUrl,
    root?.video?.originDownloadVideoUrl,
    root?.video?.downloadVideoUrl,
    root?.video?.url,
    root?.url
  ].flat().filter(Boolean);
  const url=String(rows[0]||"").trim();
  if(!/^https?:\/\//i.test(url))throw new Error("BHWA không trả link video");
  return url;
}

async function playChannelVideo(row,index=currentVideos.indexOf(row)){
  stopPlayer();
  currentVideoIndex=Number.isInteger(index)&&index>=0?index:currentVideos.indexOf(row);
  setMediaChrome(row,"vod");
  videosBox.querySelectorAll("[data-video-i]").forEach((btn,i)=>btn.classList.toggle("active",i===currentVideoIndex));
  playerStage.classList.add("gesture");
  clearTimeout(playChannelVideo._hintTimer);
  playChannelVideo._hintTimer=setTimeout(()=>playerStage.classList.remove("gesture"),1000);
  const h=String(row?.handle||handle||"").replace(/^@/,"");
  const id=String(row?.id||"");
  if(!h||!/^\d{8,}$/.test(id))return;

  let bhwaTried=false;
  const tryBhwa=async()=>{
    if(bhwaTried)return false;
    bhwaTried=true;
    try{
      const direct=await resolveBhwaVideo(row);
      streamUrlEl.value=direct;
      nowEl.textContent="@"+h+" · TikWM lỗi → BHWA";
      video.src=direct;
      video.load();
      await video.play().catch(()=>{});
      return true;
    }catch(error){
      nowEl.textContent="Không mở được video: "+String(error?.message||error);
      return false;
    }
  };

  try{
    nowEl.textContent="@"+h+" · đang lấy TikWM HD…";
    const direct=await getWarmTikwmLink(row);
    streamUrlEl.value=direct;
    nowEl.textContent="@"+h+" · TikWM";
    video.onerror=()=>{ video.onerror=null; vodLinkCache.delete(videoCacheKey(row)); tryBhwa(); };
    video.preload="metadata";
    video.src=direct;
    video.load();
    try{
      await video.play();
    }catch(error){
      if(String(error?.name||"")==="NotAllowedError")return;
      await tryBhwa();
    }
  }catch{
    await tryBhwa();
  }
}

function moveVideo(delta){
  if(currentMediaMode!=="vod"||!currentVideos.length)return;
  const base=currentVideoIndex>=0?currentVideoIndex:0;
  const next=Math.max(0,Math.min(currentVideos.length-1,base+delta));
  if(next===base){updateNav();return}
  currentVideoIndex=next;
  playChannelVideo(currentVideos[next],next);
}
prevMedia.addEventListener("click",()=>moveVideo(-1));
nextMedia.addEventListener("click",()=>moveVideo(1));
playerStage.addEventListener("wheel",e=>{
  if(currentMediaMode!=="vod"||Math.abs(e.deltaY)<24)return;
  e.preventDefault();
  if(wheelLocked)return;
  wheelLocked=true;
  moveVideo(e.deltaY>0?1:-1);
  setTimeout(()=>wheelLocked=false,520);
},{passive:false});
playerStage.addEventListener("touchstart",e=>{
  touchStartY=e.touches?.[0]?.clientY??null;
},{passive:true});
playerStage.addEventListener("touchend",e=>{
  if(touchStartY==null)return;
  const endY=e.changedTouches?.[0]?.clientY??touchStartY;
  const dy=endY-touchStartY;
  touchStartY=null;
  if(Math.abs(dy)<60)return;
  moveVideo(dy<0?1:-1);
},{passive:true});
document.addEventListener("keydown",e=>{
  if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowDown"){e.preventDefault();moveVideo(1)}
  if(e.key==="ArrowUp"){e.preventDefault();moveVideo(-1)}
});

function renderCatalogLatestVideos(){
  const latest=[];
  for(const [h,channel] of catalogChannels.entries()){
    const newest=Array.isArray(channel?.videos)?channel.videos[0]:null;
    if(newest?.id)latest.push({...newest,handle:h});
  }
  latest.sort((a,b)=>Number(b?.createTime||0)-Number(a?.createTime||0));
  currentChannelListHandle="";
  renderVideos(latest);
  return latest;
}

async function setChannelSelected(rawHandle,selected){
  const h=parseHandle(rawHandle);
  if(!h)throw new Error("Link hoặc tên kênh TikTok không hợp lệ.");
  const r=await fetch(LIBRARY+"/tiktok/selected-channel",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({handle:h,selected}),
    cache:"no-store"
  });
  const body=await r.json().catch(()=>null);
  if(!r.ok||body?.ok!==true)throw new Error(String(body?.error||("HTTP "+r.status)));
  return body;
}

async function addChannel(){
  const h=parseHandle(input.value);
  if(!h){statusEl.textContent="Không nhận ra kênh TikTok.";return}
  addChannelBtn.disabled=true;
  statusEl.textContent="@"+h+" · đang thêm kênh…";
  try{
    const result=await setChannelSelected(h,true);
    let channel=null;
    try{
      const data=await getJson(LIBRARY+"/tiktok/library?user="+encodeURIComponent(h)+"&t="+Date.now(),12000);
      channel=data?.channel||null;
    }catch{}
    if(channel){
      catalogChannels.set(h,channel);
      const profile=channel.profile||{};
      sessionChannels.set(h,{handle:h,name:String(profile.name||("@"+h)),avatar:avatarUrl(profile)});
    }else{
      sessionChannels.set(h,{handle:h,name:"@"+h,avatar:""});
    }
    if(result?.live)sessionLiveStates.set(h,{handle:h,status:2});
    renderChannels();
    renderLiveList();
    if(!currentChannelListHandle)renderCatalogLatestVideos();
    input.value="https://www.tiktok.com/@"+h+"/live";
    statusEl.textContent=result?.duplicate?"@"+h+" · kênh đã có trong danh sách.":"@"+h+" · đã thêm kênh.";
  }catch(error){
    statusEl.textContent="Không thêm được kênh: "+String(error?.message||error);
  }finally{
    addChannelBtn.disabled=false;
  }
}

async function removeChannel(rawHandle){
  const h=parseHandle(rawHandle);
  if(!h)return;
  statusEl.textContent="@"+h+" · đang xóa khỏi danh sách…";
  try{
    await setChannelSelected(h,false);
    sessionChannels.delete(h);
    sessionLiveStates.delete(h);
    catalogChannels.delete(h);
    if(handle===h){
      handle="";
      currentLiveState=null;
      currentLiveStateAt=0;
      currentChannelLibrary=null;
      currentMediaMode="idle";
      currentChannelListHandle="";
      stopPlayer();
      setMediaChrome({title:"Chưa có media"},"idle");
    }
    renderChannels();
    renderLiveList();
    if(!currentChannelListHandle||currentChannelListHandle===h)renderCatalogLatestVideos();
    statusEl.textContent="@"+h+" · đã xóa khỏi danh sách.";
  }catch(error){
    statusEl.textContent="Không xóa được kênh: "+String(error?.message||error);
  }
}

async function loadInitialCatalog(){
  statusEl.textContent="Đang nạp danh sách kênh, trực tiếp và video mới nhất…";
  const [libraryResult,liveResult]=await Promise.allSettled([
    getJson(LIBRARY+"/tiktok/library?t="+Date.now(),15000),
    getJson(EDGE+"/state?t="+Date.now(),10000)
  ]);

  let latestVideos=[];
  if(libraryResult.status==="fulfilled"&&libraryResult.value?.ok!==false){
    const payload=libraryResult.value||{};
    const channels=Array.isArray(payload.channels)?payload.channels:[];
    sessionChannels.clear();
    catalogChannels.clear();
    for(const channel of channels){
      const h=String(channel?.handle||"").replace(/^@/,"");
      if(!h)continue;
      const profile=channel?.profile||{};
      sessionChannels.set(h,{
        handle:h,
        name:String(profile?.name||("@"+h)),
        avatar:avatarUrl(profile)
      });
      catalogChannels.set(h,channel);
      const newest=Array.isArray(channel?.videos)?channel.videos[0]:null;
      if(newest?.id)latestVideos.push({...newest,handle:h});
    }
    latestVideos.sort((a,b)=>Number(b?.createTime||0)-Number(a?.createTime||0));
    currentChannelListHandle="";
    renderChannels();
    renderVideos(latestVideos);
  }else{
    channelsBox.innerHTML='<div class="empty">Chưa nạp được danh sách kênh.</div>';
    videosBox.innerHTML='<div class="empty">Chưa nạp được danh sách video.</div>';
  }

  if(liveResult.status==="fulfilled"){
    const snapshot=liveResult.value||{};
    sessionLiveStates.clear();
    for(const [rawHandle,row] of Object.entries(snapshot?.channels||{})){
      const h=String(rawHandle||"").replace(/^@/,"");
      if(h&&Number(row?.status)===2){
        sessionLiveStates.set(h,{...row,handle:h,status:2});
      }
    }
    renderLiveList();
  }else{
    liveBox.innerHTML='<div class="empty">Chưa đọc được trạng thái trực tiếp.</div>';
  }

  const channelTotal=sessionChannels.size;
  const liveTotal=sessionLiveStates.size;
  statusEl.textContent=channelTotal
    ? channelTotal+" kênh · "+liveTotal+" đang phát · "+latestVideos.length+" video mới nhất"
    : "Chưa nạp được thư viện TikTok.";
}

async function loadChannelLibrary(h){
  const endpoint=new URL(LIBRARY+"/tiktok/library");
  endpoint.searchParams.set("user",h);
  const data=await getJson(endpoint.toString(),12000);
  if(data?.ok!==true||!data?.channel){
    throw new Error(String(data?.error||"Không lấy được thư viện kênh"));
  }
  currentChannelLibrary=data.channel;
  catalogChannels.set(h,data.channel);
  rememberChannel(h,data.channel.profile||{});
  currentChannelListHandle=h;
  const videos=Array.isArray(data.channel.videos)?data.channel.videos:[];
  renderVideos(videos);
  return {
    count:videos.length,
    profile:data.channel.profile||{},
    version:Number(data.version||0)
  };
}

async function loadLive(h){
  const state=await refreshLiveState(h);
  if(Number(state?.status)!==2){
    nowEl.textContent="Kênh hiện không phát trực tiếp.";
    return false;
  }
  const playable=Boolean(state?.streamUrl||state?.hlsUrl);
  if(!playable){
    nowEl.textContent="Đang phát trực tiếp nhưng chưa có stream URL.";
    return false;
  }
  await playLive(state);
  return true;
}

async function checkLive(raw){
  const h=parseHandle(raw);
  if(!h){
    statusEl.textContent="Link TikTok không hợp lệ.";
    liveBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    videosBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    return;
  }

  handle=h;
  rememberChannel(h,{});
  currentLiveState=null;
  currentLiveStateAt=0;
  currentChannelLibrary=null;
  liveRefreshPromise=null;
  currentVideos=[];
  currentVideoIndex=-1;
  currentMediaMode="idle";
  setMediaChrome({handle:h,title:"@"+h},"idle");
  vodLinkCache.clear();
  stopPlayer();
  streamUrlEl.value="";
  renderChannels();
  if(!sessionLiveStates.size)liveBox.innerHTML='<div class="empty">Đang kiểm tra trực tiếp @'+esc(h)+'…</div>';
  videosBox.className="body";
  videosBox.innerHTML='<div class="empty">Đang đọc thư viện kênh…</div>';
  statusEl.textContent="@"+h+" · đang đọc thư viện và kiểm tra trực tiếp…";
  nowEl.textContent="Đang chờ kết quả…";

  let liveText="đang kiểm tra trực tiếp";
  let videoText="thư viện đang tải";
  const updateStatus=()=>statusEl.textContent="@"+h+" · "+liveText+" · "+videoText;

  const liveTask=loadLive(h)
    .then(isLive=>{
      liveText=isLive?"đang phát":"không phát trực tiếp";
      updateStatus();
    })
    .catch(error=>{
      liveText="kiểm tra trực tiếp lỗi";
      sessionLiveStates.delete(h);
      renderLiveList();
      updateStatus();
      console.warn("LIVE lookup",error);
    });

  const videoTask=loadChannelLibrary(h)
    .then(result=>{
      videoText=result.count?(result.count+" video thư viện"):"không có video";
      if(currentLiveState)renderState(currentLiveState,h);
      updateStatus();
    })
    .catch(error=>{
      videoText="thư viện lỗi";
      videosBox.innerHTML='<div class="empty">Không đọc được thư viện kênh.</div>';
      updateStatus();
      console.warn("channel library",error);
    });

  await Promise.allSettled([liveTask,videoTask]);
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  checkLive(input.value);
});
addChannelBtn.addEventListener("click",()=>addChannel());
video.addEventListener("loadedmetadata",()=>{
  applyMediaShape(video.videoWidth,video.videoHeight);
});
loadInitialCatalog().catch(error=>{
  statusEl.textContent="Không nạp được danh sách: "+String(error?.message||error);
});
copyBtn.addEventListener("click",async()=>{
  const url=streamUrlEl.value.trim();
  if(!url)return;
  try{
    await navigator.clipboard.writeText(url);
    copyBtn.textContent="Đã chép";
    setTimeout(()=>copyBtn.textContent="Sao chép",900);
  }catch{
    streamUrlEl.select();
  }
});
</script>
