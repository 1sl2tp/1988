<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>TikTok LIVE Direct Demo</title>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh}
.top{position:sticky;top:0;z-index:5;padding:12px;background:#111;border-bottom:1px solid #26262a}
.search{max-width:980px;margin:auto;display:flex;gap:8px}.search input{flex:1;min-width:0;border:1px solid #34343a;border-radius:22px;background:#19191d;color:#fff;padding:11px 14px;font-size:15px;outline:none}.search button{border:0;border-radius:22px;padding:0 18px;background:#fe2c55;color:#fff;font-weight:700;cursor:pointer}
.page{max-width:980px;margin:auto;padding:14px}.status{font-size:13px;color:#aaa;margin-bottom:12px;min-height:18px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px}.panel{background:#121216;border:1px solid #26262a;border-radius:14px;overflow:hidden}.head{padding:12px 14px;font-weight:800;border-bottom:1px solid #26262a}.body{padding:10px}
.livecard{width:100%;border:0;background:#1b1b20;color:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#2a2a2f}.meta{min-width:0}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:#aaa;margin-top:4px}.pill{display:inline-block;margin-top:7px;background:#fe2c55;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:800}
.empty{color:#999;padding:18px 6px;text-align:center}.player{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:9/16;display:grid;place-items:center}video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.streamrow{margin-top:10px;display:flex;gap:6px}.streamrow input{flex:1;min-width:0;border:1px solid #34343a;border-radius:8px;background:#19191d;color:#ddd;padding:9px;font-size:12px}.streamrow button{border:1px solid #34343a;background:#1b1b20;color:#fff;border-radius:8px;padding:0 12px;cursor:pointer}.now{padding:10px 2px 0;font-size:13px;color:#aaa;min-height:28px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.player{max-height:58vh}.search{gap:6px}.search button{padding:0 14px}}
</style>
</head>
<body>
<div class="top">
  <form class="search" id="form">
    <input id="input" value="https://www.tiktok.com/@tu.thuong_lay_minh_1/live" placeholder="Dán link TikTok LIVE...">
    <button>Kiểm tra</button>
  </form>
</div>
<div class="page">
  <div class="status" id="status">Dán link LIVE rồi bấm Kiểm tra.</div>
  <div class="grid">
    <section class="panel">
      <div class="head">Kênh / LIVE</div>
      <div class="body" id="liveBox"><div class="empty">Chưa kiểm tra.</div></div>
    </section>
    <section class="panel">
      <div class="head">Player LIVE</div>
      <div class="body">
        <div class="player"><video id="video" playsinline controls></video></div>
        <div class="streamrow">
          <input id="streamUrl" readonly placeholder="Link phát LIVE sẽ hiện ở đây">
          <button type="button" id="copyBtn">Sao chép</button>
        </div>
        <div class="now" id="now">Chưa có link phát.</div>
      </div>
    </section>
  </div>
</div>
<script>
const EDGE="https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev";
const form=document.getElementById("form");
const input=document.getElementById("input");
const statusEl=document.getElementById("status");
const liveBox=document.getElementById("liveBox");
const video=document.getElementById("video");
const streamUrlEl=document.getElementById("streamUrl");
const copyBtn=document.getElementById("copyBtn");
const nowEl=document.getElementById("now");
let flvPlayer=null;
let handle="";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function parseHandle(raw){
  raw=String(raw||"").trim();
  const m=raw.match(/(?:https?:\/\/)?(?:www\.)?tiktok\.com\/@([^/?#]+)/i);
  if(m)return decodeURIComponent(m[1]).replace(/^@/,"");
  const h=raw.replace(/^@/,"").split(/[/?#]/)[0];
  return /^[A-Za-z0-9._]{2,32}$/.test(h)?h:"";
}
function stopPlayer(){
  if(flvPlayer){try{flvPlayer.destroy()}catch{} flvPlayer=null}
  try{video.pause()}catch{}
  video.removeAttribute("src");
  video.load();
}
async function getJson(url,timeout=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{cache:"no-store",signal:controller.signal});
    const body=await r.json().catch(()=>null);
    if(!r.ok)throw new Error(body?.error||("HTTP "+r.status));
    return body;
  }finally{
    clearTimeout(timer);
  }
}
function renderState(state){
  const live=Number(state?.status)===2;
  const avatar=String(state?.avatar||"");
  const name=String(state?.sourceName||("@"+handle));
  const viewer=Number(state?.viewerCount||0);
  liveBox.innerHTML=
    '<div class="livecard">'+
      (avatar?'<img class="avatar" src="'+esc(avatar)+'" alt="">':'<div class="avatar"></div>')+
      '<div class="meta"><div class="name">'+esc(name)+'</div>'+
      '<div class="sub">@'+esc(handle)+(viewer?" · "+viewer+" người xem":"")+'</div>'+
      (live?'<span class="pill">LIVE</span>':'<div class="sub">Không có LIVE đang phát</div>')+
      '</div></div>';
}
async function playLive(state){
  stopPlayer();
  const flv=String(state?.streamUrl||"");
  const hls=String(state?.hlsUrl||"");
  const stream=flv||hls;
  streamUrlEl.value=stream;
  if(!stream){
    nowEl.textContent="LIVE nhưng chưa có link phát.";
    return false;
  }

  nowEl.textContent="@"+handle+" · đã lấy link phát mới";
  if(flv&&window.mpegts?.isSupported?.()){
    flvPlayer=mpegts.createPlayer(
      {type:"flv",isLive:true,url:flv,cors:true,withCredentials:false},
      {enableStashBuffer:false,lazyLoad:false,liveSync:true}
    );
    flvPlayer.attachMediaElement(video);
    flvPlayer.load();
    flvPlayer.play().catch(()=>video.play().catch(()=>{}));
    return true;
  }

  if(hls){
    video.src=hls;
    video.load();
    video.play().catch(()=>{});
    return true;
  }

  nowEl.textContent="Có link nhưng trình phát hiện tại không hỗ trợ định dạng này.";
  return false;
}
async function checkLive(raw){
  const h=parseHandle(raw);
  if(!h){
    statusEl.textContent="Link LIVE TikTok không hợp lệ.";
    liveBox.innerHTML='<div class="empty">Không nhận ra kênh từ link.</div>';
    return;
  }

  handle=h;
  stopPlayer();
  streamUrlEl.value="";
  liveBox.innerHTML='<div class="empty">Đang lấy link LIVE @'+esc(h)+'…</div>';
  statusEl.textContent="@"+h+" · đang lấy link LIVE mới…";
  nowEl.textContent="Đang chờ link phát…";

  try{
    const state=await getJson(
      EDGE+"/refresh?user="+encodeURIComponent(h)+"&t="+Date.now(),
      15000
    );
    renderState(state);
    if(Number(state?.status)!==2){
      statusEl.textContent="@"+h+" · hiện không LIVE.";
      nowEl.textContent="Không có stream LIVE.";
      return;
    }

    const playable=Boolean(state?.streamUrl||state?.hlsUrl);
    if(!playable){
      statusEl.textContent="@"+h+" · đang LIVE nhưng chưa lấy được link phát.";
      nowEl.textContent="Response chưa có stream URL.";
      return;
    }

    statusEl.textContent="@"+h+" · LIVE · đã lấy link phát mới.";
    await playLive(state);
  }catch(error){
    statusEl.textContent="@"+h+" · lỗi lấy LIVE: "+String(error?.message||error);
    liveBox.innerHTML='<div class="empty">Không lấy được link LIVE mới.</div>';
    nowEl.textContent="Không có link phát.";
  }
}
form.addEventListener("submit",e=>{
  e.preventDefault();
  checkLive(input.value);
});
copyBtn.addEventListener("click",async()=>{
  const url=streamUrlEl.value.trim();
  if(!url)return;
  try{
    await navigator.clipboard.writeText(url);
    copyBtn.textContent="Đã chép";
    setTimeout(()=>copyBtn.textContent="Sao chép",900);
  }catch{
    streamUrlEl.select();
  }
});
</script>
</body>
</html>
