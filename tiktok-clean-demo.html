<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TikTok LIVE · Clean Demo</title>
<link rel="preconnect" href="https://one988-tiktok-session.onrender.com" crossorigin>
<link rel="dns-prefetch" href="//one988-tiktok-session.onrender.com">
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#0f0f0f;
  --panel2:#181818;
  --line:#272727;
  --line2:#333;
  --text:#fff;
  --muted:#9b9b9b;
  --muted2:#737373;
  --pink:#fe2c55;
  --cyan:#25f4ee;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
body{overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit}
button{cursor:pointer}

/* Header: brand | centered YouTube-style search | action */
.topbar{
  position:relative;z-index:30;
  height:64px;
  display:grid;
  grid-template-columns:minmax(190px,1fr) minmax(340px,640px) minmax(120px,1fr);
  align-items:center;
  gap:18px;
  padding:0 18px;
  background:rgba(0,0,0,.96);
  border-bottom:1px solid var(--line)
}
.brand{
  justify-self:start;
  display:flex;align-items:center;gap:10px;
  font-size:19px;font-weight:850;white-space:nowrap
}
.brandmark{position:relative;width:25px;height:29px;display:inline-block}
.brandmark:before,.brandmark:after,.brandmark i{
  content:"";position:absolute;inset:2px 7px 3px 7px;
  border:4px solid #fff;border-top:0;border-radius:3px 3px 8px 8px
}
.brandmark:before{transform:translate(-2px,1px);border-color:var(--cyan)}
.brandmark:after{transform:translate(2px,-1px);border-color:var(--pink)}
.brandmark i{z-index:2;border-color:#fff}
.search-wrap{width:100%;justify-self:center}
.searchbox{
  height:42px;width:100%;
  display:grid;grid-template-columns:42px minmax(0,1fr);
  align-items:center;
  overflow:hidden;
  border:1px solid #303030;
  border-radius:999px;
  background:#121212;
  transition:border-color .15s ease,box-shadow .15s ease
}
.searchbox:focus-within{
  border-color:#4a4a4a;
  box-shadow:0 0 0 1px #262626 inset
}
.search-icon{
  width:42px;height:42px;display:grid;place-items:center;
  color:#8e8e93;pointer-events:none
}
.search-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.searchbox input{
  min-width:0;width:100%;height:40px;
  border:0;outline:0;background:transparent;color:#fff;
  padding:0 15px 0 0;font-size:14px
}
.searchbox input::placeholder{color:#7d7d82}
.primary{
  justify-self:end;
  border:0;border-radius:12px;background:var(--pink);color:#fff;
  height:40px;padding:0 18px;font-weight:750;font-size:14px
}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.55;cursor:default}

/* App frame */
.app{
  height:calc(100dvh - 64px);
  min-height:0;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  overflow:hidden
}
.sidebar{
  min-width:0;height:100%;min-height:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:#050505;
  padding:14px 10px 10px;
  overflow:hidden
}
.sidehead{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:2px 6px 9px
}
.sidehead strong{font-size:14px;font-weight:800}
.summary{
  margin-left:auto;color:var(--muted);
  font-size:10.5px;white-space:nowrap
}
.toolbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:0 6px 10px
}
.tool{
  height:31px;
  border:1px solid #2b2b2b;background:#191919;color:#fff;
  border-radius:10px;padding:0 11px;
  font-size:11.5px;font-weight:650
}
.tool:hover{background:#232323}
.tool.active{background:#fff;color:#000;border-color:#fff}
.list{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:0 2px 16px;
  scrollbar-width:thin;
  scrollbar-color:#575757 transparent
}
.list::-webkit-scrollbar{width:7px}
.list::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb{background:#494949;border-radius:999px}
.group{
  display:flex;align-items:center;gap:8px;
  padding:10px 6px 6px;
  color:#747474;font-size:9.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase
}
.group:after{content:"";height:1px;background:#1d1d1d;flex:1}

/* Balanced two-line channel row */
.channel{
  width:100%;min-height:64px;
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  padding:7px 7px;
  margin:2px 0;
  border-radius:14px;
  color:inherit;background:transparent;
  position:relative;
  transition:background .14s ease
}
.channel:hover{background:#141414}
.channel.active{background:#1f1f1f}
.avatar{
  width:42px;height:42px;border-radius:50%;overflow:hidden;
  background:#242424;display:grid;place-items:center;
  font-weight:800;font-size:14px;
  box-shadow:0 0 0 1px #2d2d2d inset
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chtext{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.chname{
  min-width:0;
  font-size:13.5px;font-weight:780;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.chsub{
  min-width:0;
  display:flex;align-items:center;gap:5px;
  color:#858585;font-size:10.5px;line-height:1.2;
  white-space:nowrap;overflow:hidden
}
.chhandle{
  flex:0 1 auto;min-width:0;
  color:#8c8c8c;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.channel-stats{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:4px;
  color:#777;
  overflow:hidden;white-space:nowrap
}
.channel-stats span{flex:0 0 auto;white-space:nowrap}
.channel-stats .hot{color:#969696}
.row-actions{
  align-self:center;
  display:flex;align-items:center;gap:6px;
  min-width:34px;justify-content:flex-end
}
.live-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--pink);font-size:0;display:block;flex:0 0 auto
}
.iconbtn{
  border:0;background:transparent;color:#858585;
  width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;padding:0;
  opacity:.28;transition:opacity .14s ease,background .14s ease,color .14s ease
}
.channel:hover .iconbtn,.channel.active .iconbtn{opacity:.9}
.iconbtn:hover{background:#2a2a2a;color:#fff}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Compact media stage */
.stage{
  min-width:0;height:100%;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:center;
  padding:14px 22px 12px;
  background:#000
}
.watch{
  width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  gap:0
}
.phone{
  position:relative;
  width:min(100%,540px);
  max-height:calc(100dvh - 64px - 78px);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#000;
  border-radius:18px;
  box-shadow:0 0 0 1px #171717
}
.phone.landscape{
  width:min(100%,760px);
  max-width:760px;
  aspect-ratio:16/9
}
.phone.square{
  width:min(100%,620px);
  max-width:620px;
  aspect-ratio:1/1
}
.phone video{
  width:100%;height:100%;display:block;
  object-fit:contain;background:#000
}
.current-info{
  width:min(100%,540px);
  min-height:58px;
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  padding:8px 2px 0
}
.phone.landscape + .current-info{width:min(100%,760px)}
.phone.square + .current-info{width:min(100%,620px)}
.current-info[hidden]{display:none}
.current-avatar{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:#202020;display:grid;place-items:center;
  font-weight:800;font-size:12px
}
.current-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.current-copy{min-width:0}
.now-name{
  font-size:13px;font-weight:780;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.now-handle{
  margin-top:1px;
  color:#858585;font-size:10.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.now-state{
  margin-top:2px;color:#707070;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.current-actions{display:flex;align-items:center;gap:2px}
.mini-action{
  border:0;background:transparent;color:#8d8d8d;
  width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;padding:0
}
.mini-action:hover{background:#1c1c1c;color:#fff}
.mini-action:disabled{opacity:.35}
.mini-action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

.toast{
  position:fixed;left:50%;bottom:24px;z-index:100;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:#242424;color:#fff;border:1px solid #3a3a3a;
  padding:9px 13px;border-radius:9px;font-size:12px;
  transition:.16s ease
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:980px){
  .topbar{
    grid-template-columns:minmax(150px,.7fr) minmax(280px,1.5fr) auto;
    gap:12px;padding:0 12px
  }
  .app{grid-template-columns:280px minmax(0,1fr)}
  .stage{padding-left:12px;padding-right:12px}
  .phone{width:min(100%,500px)}
  .current-info{width:min(100%,500px)}
}
@media(max-width:760px){
  body{overflow:auto}
  .topbar{
    height:auto;min-height:58px;
    grid-template-columns:1fr auto;
    gap:9px;
    padding:9px 10px
  }
  .brand{font-size:17px}
  .search-wrap{grid-column:1 / -1;grid-row:2}
  .primary{grid-column:2;grid-row:1;height:36px;padding:0 14px}
  .searchbox{height:40px}
  .searchbox input{height:38px}
  .app{
    height:auto;min-height:calc(100dvh - 108px);
    display:block;overflow:visible
  }
  .sidebar{
    height:auto;max-height:38vh;
    border-right:0;border-bottom:1px solid var(--line);
    padding:10px 8px 7px
  }
  .list{max-height:27vh}
  .stage{height:auto;overflow:visible;padding:8px 0 26px}
  .watch{height:auto}
  .phone{
    width:100%;max-width:none;max-height:none;
    border-radius:0;box-shadow:none
  }
  .phone.landscape,.phone.square{width:100%;max-width:none}
  .current-info,
  .phone.landscape + .current-info,
  .phone.square + .current-info{
    width:100%;padding:8px 10px 0
  }
}

/* LIVE + Video workspace */
.stage{align-items:stretch;justify-content:center;overflow:hidden;padding:10px 14px 12px}
.main-shell{
  width:min(1180px,100%);height:100%;min-height:0;
  display:flex;flex-direction:column;overflow:hidden
}
.media-tabs{
  flex:0 0 42px;
  display:flex;align-items:center;gap:6px;
  border-bottom:1px solid #1d1d1d;
  padding:0 2px 7px
}
.media-tab{
  height:32px;border:0;border-radius:10px;
  background:transparent;color:#8f8f8f;
  padding:0 14px;font-size:12px;font-weight:750
}
.media-tab:hover{background:#171717;color:#fff}
.media-tab.active{background:#fff;color:#000}
.media-title{
  min-width:0;margin-left:6px;
  color:#737373;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.media-workspace{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr) 314px;
  gap:14px;padding-top:10px;overflow:hidden
}
.media-workspace[hidden]{display:none}
.watch{
  min-width:0;width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  overflow:auto;scrollbar-width:none
}
.watch::-webkit-scrollbar{display:none}
.phone{
  flex:0 1 auto;
  width:min(100%,520px);
  max-height:calc(100dvh - 64px - 42px - 82px);
  border-radius:18px
}
.phone.video-mode{
  width:min(100%,520px);
  aspect-ratio:9/16;
  max-width:520px
}
#videoFrame{
  width:100%;height:100%;border:0;display:block;background:#000
}
.video-rail{
  min-width:0;height:100%;min-height:0;
  display:flex;flex-direction:column;
  border-left:1px solid #1d1d1d;
  padding-left:12px;overflow:hidden
}
.rail-head{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:34px;padding:0 2px 7px;
  color:#e8e8e8;font-size:12px;font-weight:800
}
.rail-sub{color:#707070;font-size:10px;font-weight:600}
.rail-list{
  flex:1 1 auto;min-height:0;overflow:auto;
  padding:0 2px 14px 0;scrollbar-width:thin;
  scrollbar-color:#444 transparent
}
.video-card{
  width:100%;display:grid;
  grid-template-columns:112px minmax(0,1fr);
  gap:9px;align-items:start;
  padding:6px;border-radius:12px;
  background:transparent;cursor:pointer;
  transition:background .14s ease
}
.video-card:hover{background:#151515}
.video-card.active{background:#202020}
.video-thumb{
  position:relative;width:112px;height:72px;
  border-radius:9px;overflow:hidden;background:#171717
}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.video-duration{
  position:absolute;right:4px;bottom:4px;
  padding:2px 4px;border-radius:4px;
  background:rgba(0,0,0,.78);color:#fff;
  font-size:9px;font-weight:700
}
.video-copy{min-width:0;padding-top:1px}
.video-title{
  color:#f3f3f3;font-size:11.5px;font-weight:700;
  line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden
}
.video-meta{
  margin-top:4px;color:#777;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.video-owner{
  margin-top:3px;color:#929292;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.rail-empty{
  padding:22px 10px;color:#666;font-size:11px;text-align:center
}

/* Search results from selected channels + their recent videos */
.search-results{
  flex:1 1 auto;min-height:0;overflow:auto;
  padding:12px 4px 24px
}
.search-results[hidden]{display:none}
.search-block{margin-bottom:22px}
.search-heading{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 9px;color:#e8e8e8;font-size:12px;font-weight:800
}
.search-count{color:#6f6f6f;font-size:10px;font-weight:600}
.search-channels{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:7px
}
.search-channel{
  min-width:0;display:grid;grid-template-columns:42px minmax(0,1fr) auto;
  gap:9px;align-items:center;padding:8px;
  border-radius:12px;cursor:pointer
}
.search-channel:hover{background:#151515}
.search-channel .avatar{width:42px;height:42px}
.search-videos{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px
}
.search-video{min-width:0;cursor:pointer}
.search-video-thumb{
  position:relative;width:100%;aspect-ratio:16/9;
  border-radius:12px;overflow:hidden;background:#171717
}
.search-video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.search-video-title{
  margin-top:7px;color:#efefef;font-size:12px;font-weight:700;
  line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden
}
.search-video-meta{
  margin-top:4px;color:#777;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

@media(max-width:980px){
  .media-workspace{grid-template-columns:minmax(0,1fr) 270px;gap:10px}
  .video-rail{padding-left:9px}
  .video-card{grid-template-columns:92px minmax(0,1fr);gap:7px}
  .video-thumb{width:92px;height:60px}
}
@media(max-width:760px){
  .stage{padding:0 0 24px}
  .main-shell{height:auto;overflow:visible}
  .media-tabs{padding:7px 10px;position:sticky;top:0;background:#000;z-index:4}
  .media-workspace{display:block;overflow:visible;padding-top:0}
  .video-rail{border-left:0;border-top:1px solid #1d1d1d;padding:10px;height:auto;max-height:none}
  .rail-list{max-height:none;overflow:visible}
  .video-card{grid-template-columns:112px minmax(0,1fr)}
  .video-thumb{width:112px;height:72px}
  .phone,.phone.video-mode{width:100%;max-width:none;border-radius:0}
  .search-results{overflow:visible;padding:12px 10px 24px}
  .search-videos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brandmark"><i></i></span><span>TikTok LIVE</span></div>
  <div class="search-wrap">
    <div class="searchbox">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      </span>
      <input id="addInput" autocomplete="off" spellcheck="false" placeholder="Tìm hoặc dán link TikTok">
    </div>
  </div>
  <button class="primary" id="addBtn">Thêm kênh</button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidehead">
      <strong>Kênh đã chọn</strong>
      <span class="summary" id="summary">Đang tải…</span>
    </div>
    <div class="toolbar">
      <button class="tool active" data-filter="all">Tất cả</button>
      <button class="tool" data-filter="live">Đang phát</button>
      <button class="tool" id="refreshBtn">Làm mới</button>
    </div>
    <div class="list" id="channelList"></div>
  </aside>

  <main class="stage">
    <div class="main-shell">
      <div class="media-tabs">
        <button class="media-tab active" data-media-mode="live">LIVE</button>
        <button class="media-tab" data-media-mode="video">Video</button>
        <span class="media-title" id="mediaTitle"></span>
      </div>

      <div class="search-results" id="searchResults" hidden></div>

      <div class="media-workspace" id="mediaWorkspace">
        <section class="watch">
          <div class="phone" id="phone">
            <video id="liveVideo" playsinline preload="metadata"></video>
            <iframe
              id="videoFrame"
              hidden
              allow="autoplay; fullscreen"
              referrerpolicy="strict-origin-when-cross-origin"
              title="TikTok video"
            ></iframe>
          </div>

          <div class="current-info" id="overlay" hidden>
            <div class="current-avatar" id="nowAvatar">T</div>
            <div class="current-copy">
              <div class="now-name" id="nowName">TikTok LIVE</div>
              <div class="now-handle" id="nowHandle">@handle</div>
              <div class="now-state" id="nowState"></div>
            </div>
            <div class="current-actions">
              <button class="mini-action" id="openTikTokBtn" title="Mở TikTok" disabled>
                <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
              </button>
              <button class="mini-action" id="reloadLiveBtn" title="Mở lại" disabled>
                <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 5"/><path d="M20 4v7h-7"/></svg>
              </button>
              <button class="mini-action" id="deleteCurrentBtn" title="Xoá" disabled>
                <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>
              </button>
            </div>
          </div>
        </section>

        <aside class="video-rail">
          <div class="rail-head">
            <span id="railTitle">Video gần đây</span>
            <span class="rail-sub" id="railCount"></span>
          </div>
          <div class="rail-list" id="recentVideos"></div>
        </aside>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const TIKTOK_MAINTENANCE=true;
if(TIKTOK_MAINTENANCE){

function parseHandle(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  const direct=raw.replace(/^@/,'');
  if(/^[A-Za-z0-9._]{2,32}$/.test(direct))return direct;
  const m=raw.match(/tiktok\.com\/@([A-Za-z0-9._]{2,32})(?:\/live)?/i);
  return m?.[1]||'';
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function compactCount(value){
  const n=Number(value||0);
  if(!Number.isFinite(n)||n<=0)return '';
  if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K';
  return String(Math.round(n));
}
function profileStatsHtml(profile,latestVideo){
  const parts=[];
  const follower=compactCount(profile?.followers);
  const heart=compactCount(profile?.likes);
  const views=compactCount(latestVideo?.stats?.views);
  const likes=compactCount(latestVideo?.stats?.likes);
  if(follower)parts.push('<span>'+esc(follower)+' theo dõi</span>');
  if(heart)parts.push('<span>'+esc(heart)+' thích</span>');
  if(views)parts.push('<span class="hot">'+esc(views)+' xem</span>');
  if(likes)parts.push('<span class="hot">♥ '+esc(likes)+'</span>');
  return parts.join('<span>·</span>');
}
function normalizeSearch(value){
  return String(value||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim();
}
function channelFor(handle){
  const key=String(handle||'').toLowerCase();
  return channels.find(row=>String(row?.handle||'').toLowerCase()===key)||null;
}
function profileFor(handle){
  return channelFor(handle)?.profile||null;
}
function videosFor(handle){
  const row=channelFor(handle);
  return Array.isArray(row?.videos)?row.videos:[];
}
function allVideos(){
  return channels.flatMap(row=>
    (Array.isArray(row?.videos)?row.videos:[]).map(video=>({...video,handle:String(video?.handle||row.handle||'')}))
  );
}
function formatDuration(value){
  const total=Math.max(0,Math.round(Number(value||0)));
  if(!total)return '';
  const m=Math.floor(total/60);
  const s=String(total%60).padStart(2,'0');
  return m+':'+s;
}
function formatAgo(value){
  let n=Number(value||0);
  if(!n)return '';
  if(n<1e12)n*=1000;
  const sec=Math.max(1,Math.floor((Date.now()-n)/1000));
  if(sec<60)return sec+' giây trước';
  const min=Math.floor(sec/60);
  if(min<60)return min+' phút trước';
  const hour=Math.floor(min/60);
  if(hour<24)return hour+' giờ trước';
  const day=Math.floor(hour/24);
  if(day<7)return day+' ngày trước';
  const week=Math.floor(day/7);
  if(week<5)return week+' tuần trước';
  const month=Math.floor(day/30);
  if(month<12)return month+' tháng trước';
  return Math.floor(day/365)+' năm trước';
}
function videoMetaText(video){
  return [
    compactCount(video?.stats?.views)?compactCount(video.stats.views)+' xem':'',
    compactCount(video?.stats?.likes)?compactCount(video.stats.likes)+' thích':'',
    formatAgo(video?.createTime)
  ].filter(Boolean).join(' · ');
}
function currentVideoFor(handle,id){
  return videosFor(handle).find(video=>String(video.id||'')===String(id||''))||null;
}
function rowLiveDetected(row){
  return liveNowHandles.has(String(row?.handle||'').toLowerCase());
}
function rowPlayable(row){
  const live=row?.live||{};
  const stream=live?.stream||{};
  const type=String(stream?.type||'').toLowerCase();
  return Boolean(rowLiveDetected(row)&&live?.playable&&stream?.sourceSig&&stream?.url&&type==='flv');
}
function rowFor(handle){
  return channelFor(handle);
}
function showToast(message){
  const el=document.getElementById('toast');
  el.textContent=String(message||'');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
async function apiJson(url,options={}){
  const r=await fetch(url,{cache:'no-store',...options});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.error||('HTTP '+r.status));
  return data;
}
function destroyPlayer(){
  try{
    player?.pause?.();
    player?.unload?.();
    player?.detachMediaElement?.();
    player?.destroy?.();
  }catch{}
  player=null;
  const video=document.getElementById('liveVideo');
  try{
    video.controls=false;
    video.pause();
    video.removeAttribute('src');
    video.load();
  }catch{}
}
function setPlayerShape(video){
  const box=document.getElementById('phone');
  const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
  box.classList.remove('landscape','square');
  if(!w||!h)return;
  const ratio=w/h;
  if(ratio>1.12)box.classList.add('landscape');
  else if(ratio>=.88)box.classList.add('square');
}

  const avatar=String(profile.avatar?.url||profile.avatar?.sourceUrl||'').trim();

  document.getElementById('nowHandle').textContent=currentHandle?'@'+currentHandle:'';
  const statsText=[
    compactCount(profile.followers)?compactCount(profile.followers)+' theo dõi':'',

    compactCount(latest?.stats?.views)?compactCount(latest.stats.views)+' xem':''
  ].filter(Boolean).join(' · ');
  document.getElementById('nowState').textContent=currentHandle
    ? (mediaMode==='video'&&currentVideo

  const enabled=Boolean(currentHandle);

  document.getElementById('reloadLiveBtn').disabled=!enabled;
  document.getElementById('deleteCurrentBtn').disabled=!enabled;
}
function renderList(){
  const root=document.getElementById('channelList');
  // For now, "Đang phát" means TikTok LIVE detection only. A missing FLV must
  // not hide the channel while we verify the LIVE detector.
  const liveRows=channels.filter(rowLiveDetected);
  const visible=filterMode==='live'?liveRows:channels.slice();
  const liveCount=liveRows.length;
  document.getElementById('summary').textContent=channels.length+' kênh · '+liveCount+' đang LIVE';

  const sorted=visible.sort((a,b)=>
    Number(rowLiveDetected(b))-Number(rowLiveDetected(a))||
    Number(rowPlayable(b))-Number(rowPlayable(a))||
    String(a.handle).localeCompare(String(b.handle))
  );
  if(!sorted.length){
    root.innerHTML='<div style="padding:22px 10px;color:#777;font-size:12px">Chưa có kênh.</div>';
    return;
  }

  const live=sorted.filter(rowLiveDetected);
  const offline=sorted.filter(row=>!rowLiveDetected(row));
  const makeRows=list=>list.map(row=>{
    const handle=String(row.handle||'');
    const profile=row.profile||{};
    const name=String(profile.name||'').trim()||('@'+handle);
    const avatar=String(profile.avatar?.url||profile.avatar?.sourceUrl||'').trim();
    const stats=profileStatsHtml(profile,row.videos?.[0]);
    return '<div class="channel '+(handle===currentHandle?'active':'')+'" data-handle="'+esc(handle)+'" role="button" tabindex="0">'+
      '<span class="avatar">'+(avatar?'<img src="'+esc(avatar)+'" alt="" referrerpolicy="no-referrer">':esc(handle.slice(0,1).toUpperCase()))+'</span>'+
      '<span class="chtext"><span class="chname">'+esc(name)+'</span>'+
      '<span class="chsub"><span class="chhandle">@'+esc(handle)+'</span>'+
      (stats?'<span class="channel-stats">'+stats+'</span>':'')+'</span></span>'+
      '<span class="row-actions">'+(rowLiveDetected(row)?'<span class="live-dot" title="'+(rowPlayable(row)?'Đang LIVE · có FLV':'Đang LIVE · chưa có FLV')+'"></span>':'')+
      '<button type="button" class="iconbtn" data-delete="'+esc(handle)+'" title="Xoá">'+
      '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button></span>'+
      '</div>';
  }).join('');

  let html='';
  if(live.length)html+='<div class="group">Đang phát · '+live.length+'</div>'+makeRows(live);
  if(offline.length)html+='<div class="group">Kênh khác · '+offline.length+'</div>'+makeRows(offline);
  root.innerHTML=html;

  root.querySelectorAll('.channel[data-handle]').forEach(el=>{
    el.addEventListener('click',event=>{
      if(event.target.closest('[data-delete]'))return;
      selectChannel(el.dataset.handle);
    });
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        selectChannel(el.dataset.handle);
      }
    });
  });
  root.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      removeChannel(el.dataset.delete);
    });
  });
}
function setMediaMode(mode){
  mediaMode=mode==='video'?'video':'live';
  document.querySelectorAll('[data-media-mode]').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.mediaMode===mediaMode);
  });
  const phone=document.getElementById('phone');
  const liveVideo=document.getElementById('liveVideo');
  const frame=document.getElementById('videoFrame');
  if(mediaMode==='video'){
    phone.classList.add('video-mode');
    phone.classList.remove('landscape','square');
    liveVideo.hidden=true;
    frame.hidden=true;
  }else{
    phone.classList.remove('video-mode');
    frame.hidden=true;
    liveVideo.hidden=false;
  }
}
function renderRecentVideos(handle=currentHandle){
  const root=document.getElementById('recentVideos');
  const countEl=document.getElementById('railCount');
  const titleEl=document.getElementById('railTitle');
  const profile=profileFor(handle)||{};
  const own=videosFor(handle);
  const list=handle
    ? own
    : allVideos()
        .slice()
        .sort((a,b)=>Number(b.createTime||0)-Number(a.createTime||0))
        .slice(0,10);

  titleEl.textContent=handle
    ? ((profile.name||('@'+handle))+' · video')
    : 'Video mới';
  countEl.textContent=list.length?String(list.length):'';

  if(!list.length){
    root.innerHTML='<div class="rail-empty">Chưa có video gần đây.</div>';
    return;
  }

  root.innerHTML=list.map(video=>{
    const owner=profileFor(video.handle)||{};
    const title=String(video.title||'').trim()||'Video TikTok';
    const cover=String(video.cover?.url||video.cover?.sourceUrl||'').trim();
    const active=String(video.id||'')===String(currentVideoId||'')?' active':'';
    return '<div class="video-card'+active+'" data-video-id="'+esc(video.id)+'" data-video-handle="'+esc(video.handle)+'">'+
      '<div class="video-thumb">'+
        (cover?'<img src="'+esc(cover)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+
        (formatDuration(video.duration)?'<span class="video-duration">'+esc(formatDuration(video.duration))+'</span>':'')+
      '</div>'+
      '<div class="video-copy">'+
        '<div class="video-title">'+esc(title)+'</div>'+
        '<div class="video-owner">'+esc(owner.name||('@'+video.handle))+'</div>'+
        '<div class="video-meta">'+esc(videoMetaText(video))+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  root.querySelectorAll('[data-video-id]').forEach(card=>{
    card.addEventListener('click',()=>{
      openVideo(card.dataset.videoHandle,card.dataset.videoId);
    });
  });
}
async function openVideo(rawHandle,videoId,retry=true){
  const handle=parseHandle(rawHandle);
  const video=currentVideoFor(handle,videoId);
  if(!handle||!video)return;

  const seq=++videoOpenSeq;
  currentHandle=handle;
  currentVideoId=String(video.id||'');
  currentVideo=video;
  destroyPlayer();
  setMediaMode('video');

  const frame=document.getElementById('videoFrame');
  const native=document.getElementById('liveVideo');
  frame.hidden=true;
  frame.src='about:blank';
  native.hidden=false;
  native.controls=true;
  native.preload='metadata';
  native.poster=String(video.cover?.url||video.cover?.sourceUrl||'');
  native.removeAttribute('src');
  native.load();

  document.getElementById('overlay').hidden=false;
  updateCurrentUi();
  document.getElementById('nowState').textContent=
    String(video.title||'').trim()||videoMetaText(video);
  document.getElementById('mediaTitle').textContent=
    (profileFor(handle)?.name||('@'+handle))+' · Video';
  renderList();
  renderRecentVideos(handle);
  hideSearchResults();

  const stream=String(video.playback?.url||'').trim();
  if(!video.playback?.ready||!stream){
    showToast('Video chưa được server đồng bộ');
    return;
  }

  const src=/^https?:\/\//i.test(stream)?stream:(API+stream);
  native.onerror=async()=>{
    if(seq!==videoOpenSeq)return;
    native.pause();
    native.removeAttribute('src');
    native.load();
    if(!retry){
      showToast('Nguồn video chưa sẵn sàng');
      return;
    }

    // UI never prepares/extracts video. It only re-reads the package in case
    // the server has already refreshed the playback source in the meantime.
    libraryVersion=-1;
    await loadUnifiedLibrary({force:true,silent:true});
    if(seq!==videoOpenSeq)return;
    const fresh=currentVideoFor(handle,videoId);
    const next=String(fresh?.playback?.url||'').trim();
    if(fresh?.playback?.ready&&next){
      openVideo(handle,videoId,false);
    }else{
      showToast('Server đang đồng bộ nguồn video');
    }
  };

  native.onloadedmetadata=()=>{
    if(seq!==videoOpenSeq)return;
    setPlayerShape(native);
    native.play().catch(()=>{});
  };

  native.src=src+(src.includes('?')?'&':'?')+'t='+Date.now();
  native.load();
  native.play().catch(()=>{});
}
async function refreshChannelVideos(handle,{silent=true}={}){
  // Data extraction is server-side only. UI just re-reads the unified package.
  renderRecentVideos(parseHandle(handle));
  return loadUnifiedLibrary({force:true,silent});
}
async function loadVideoLibrary({force=false,silent=true}={}){
  return loadUnifiedLibrary({force,silent});
}

function hideSearchResults(){
  searchQuery='';
  document.getElementById('searchResults').hidden=true;
  document.getElementById('mediaWorkspace').hidden=false;
}
function renderSearchResults(value){
  const query=normalizeSearch(value);
  searchQuery=query;
  if(query.length<2){
    hideSearchResults();
    return;
  }

  const channelMatches=channels.filter(row=>
    normalizeSearch([row.handle,row.profile?.name].join(' ')).includes(query)
  ).slice(0,24);

  const videoMatches=allVideos().filter(video=>{
    const profile=profileFor(video.handle)||{};
    return normalizeSearch([video.title,video.handle,profile.name].join(' ')).includes(query);
  }).sort((a,b)=>Number(b.createTime||0)-Number(a.createTime||0)).slice(0,36);

  const root=document.getElementById('searchResults');
  document.getElementById('mediaWorkspace').hidden=true;
  root.hidden=false;

  const channelsHtml=channelMatches.map(row=>{
    const profile=row.profile||{};
    const avatar=String(profile.avatar?.url||profile.avatar?.sourceUrl||'').trim();
    return '<div class="search-channel" data-search-channel="'+esc(row.handle)+'">'+
      '<span class="avatar">'+(avatar?'<img src="'+esc(avatar)+'" alt="" referrerpolicy="no-referrer">':esc(row.handle.slice(0,1).toUpperCase()))+'</span>'+
      '<span class="chtext"><span class="chname">'+esc(profile.name||('@'+row.handle))+'</span>'+
      '<span class="chsub"><span class="chhandle">@'+esc(row.handle)+'</span></span></span>'+
      (rowLiveDetected(row)?'<span class="live-dot"></span>':'')+
    '</div>';
  }).join('');

  const videosHtml=videoMatches.map(video=>{
    const profile=profileFor(video.handle)||{};
    const cover=String(video.cover?.url||video.cover?.sourceUrl||'').trim();
    return '<div class="search-video" data-search-video="'+esc(video.id)+'" data-search-handle="'+esc(video.handle)+'">'+
      '<div class="search-video-thumb">'+
        (cover?'<img src="'+esc(cover)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+
        (formatDuration(video.duration)?'<span class="video-duration">'+esc(formatDuration(video.duration))+'</span>':'')+
      '</div>'+
      '<div class="search-video-title">'+esc(String(video.title||'').trim()||'Video TikTok')+'</div>'+
      '<div class="search-video-meta">'+esc((profile.name||('@'+video.handle))+' · '+videoMetaText(video))+'</div>'+
    '</div>';
  }).join('');

  root.innerHTML=
    '<div class="search-block"><div class="search-heading"><span>Kênh</span><span class="search-count">'+channelMatches.length+'</span></div>'+
      (channelsHtml?'<div class="search-channels">'+channelsHtml+'</div>':'<div class="rail-empty">Không có kênh phù hợp.</div>')+
    '</div>'+
    '<div class="search-block"><div class="search-heading"><span>Video</span><span class="search-count">'+videoMatches.length+'</span></div>'+
      (videosHtml?'<div class="search-videos">'+videosHtml+'</div>':'<div class="rail-empty">Chưa có video phù hợp trong dữ liệu đã tải.</div>')+
    '</div>';

  root.querySelectorAll('[data-search-channel]').forEach(el=>{
    el.addEventListener('click',()=>{
      document.getElementById('addInput').value='';
      openChannel(el.dataset.searchChannel);
    });
  });
  root.querySelectorAll('[data-search-video]').forEach(el=>{
    el.addEventListener('click',()=>{
      document.getElementById('addInput').value='';
      openVideo(el.dataset.searchHandle,el.dataset.searchVideo);
    });
  });
}
function selectChannel(handle){
  if(mediaMode==='video'){
    currentHandle=parseHandle(handle);
    currentVideoId='';
    currentVideo=null;
    document.getElementById('videoFrame').src='about:blank';
    document.getElementById('overlay').hidden=false;
    updateCurrentUi();
    renderList();
    renderRecentVideos(currentHandle);
    const list=videosFor(currentHandle);
    if(list.length)openVideo(currentHandle,list[0].id);
    else{
      setMediaMode('video');
      showToast('Kênh này chưa có video trong thư viện');
    }
    return;
  }
  openChannel(handle);
}
function emptyLiveState(){
  return {
    isLive:false,
    playable:false,
    probeState:'unknown',
    title:'',
    cover:{url:'',sourceUrl:'',storedUrl:''},
    stream:{type:'',sourceSig:'',url:''},
    checkedAt:null,
    updatedAt:null
  };
}
function applyUnifiedLibrary(data){
  const rows=Array.isArray(data?.channels)?data.channels:[];
  const previousLive=new Map(
    channels.map(row=>[String(row?.handle||'').toLowerCase(),row?.live||emptyLiveState()])
  );
  channels=rows.map(ch=>{
    const handle=String(ch?.handle||'');
    const profile=ch?.profile||{};
    const videos=(Array.isArray(ch?.videos)?ch.videos:[])
      .map(v=>({
        id:String(v?.id||''),
        handle,
        title:String(v?.title||''),
        createTime:Number(v?.createTime||0),
        duration:Number(v?.duration||0),
        pageUrl:String(v?.pageUrl||''),
        cover:{
          url:String(v?.cover?.url||v?.cover?.sourceUrl||''),
          sourceUrl:String(v?.cover?.sourceUrl||''),
          storedUrl:String(v?.cover?.storedUrl||''),
          width:Number(v?.cover?.width||0),
          height:Number(v?.cover?.height||0)
        },
        stats:{
          views:Number(v?.stats?.views||0),
          likes:Number(v?.stats?.likes||0),
          comments:Number(v?.stats?.comments||0),
          shares:Number(v?.stats?.shares||0),
          collects:Number(v?.stats?.collects||0)
        },
        playback:{
          type:String(v?.playback?.type||'mp4'),
          ready:Boolean(v?.playback?.ready),
          url:String(v?.playback?.url||''),
          source:String(v?.playback?.source||''),
          expiresAt:v?.playback?.expiresAt||null,
          updatedAt:v?.playback?.updatedAt||null
        }
      }))
      .filter(v=>/^\d{8,}$/.test(v.id));

    return {
      handle,
      profile:{
        userId:String(profile?.userId||''),
        secUid:String(profile?.secUid||''),
        name:String(profile?.name||''),
        bio:String(profile?.bio||''),
        verified:Boolean(profile?.verified),
        avatar:{
          url:String(profile?.avatar?.url||profile?.avatar?.sourceUrl||''),
          sourceUrl:String(profile?.avatar?.sourceUrl||''),
          storedUrl:String(profile?.avatar?.storedUrl||''),
          width:Number(profile?.avatar?.width||0),
          height:Number(profile?.avatar?.height||0)
        },
        followers:Number(profile?.followers||0),
        following:Number(profile?.following||0),
        likes:Number(profile?.likes||0),
        videoCount:Number(profile?.videoCount||0),
        source:String(profile?.source||''),
        checkedAt:profile?.checkedAt||null
      },
      live:previousLive.get(handle.toLowerCase())||emptyLiveState(),
      videos
    };
  }).filter(row=>parseHandle(row.handle));

  libraryVersion=Number(data?.version??libraryVersion);
  packageVersion=libraryVersion;
  videoVersion=libraryVersion;

  renderList();
  renderRecentVideos(currentHandle);
  updateCurrentUi();
  if(searchQuery)renderSearchResults(searchQuery);
}
async function loadUnifiedLibrary({force=false,silent=false}={}){
  if(loadBusy)return;
  loadBusy=true;
  try{
    const v=force?-1:libraryVersion;
    const data=await apiJson(API+'/tiktok/library?v='+encodeURIComponent(v)+'&t='+Date.now());
    if(!data.unchanged)applyUnifiedLibrary(data);
  }catch(error){
    if(!silent)showToast('Không tải được thư viện TikTok');
    console.warn('tiktok library',error);
  }finally{
    loadBusy=false;
  }
}
function applyLiveNow(data){
  const items=Array.isArray(data?.items)?data.items:[];
  const beforeRow=currentHandle?channelFor(currentHandle):null;
  const beforeLive=beforeRow?rowLiveDetected(beforeRow):false;
  const beforePlayable=Boolean(beforeRow&&rowPlayable(beforeRow));
  const beforeSig=String(beforeRow?.live?.stream?.sourceSig||'');

  const byHandle=new Map();
  for(const item of items){
    const handle=String(item?.handle||'').toLowerCase();
    if(handle)byHandle.set(handle,item);
  }
  liveNowHandles=new Set(byHandle.keys());

  // LIVE state comes only from the current server snapshot.
  // Channel/video metadata still comes from the unified package.
  for(const row of channels){
    const key=String(row?.handle||'').toLowerCase();
    const item=byHandle.get(key);
    if(!item){
      row.live={
        ...(row.live||emptyLiveState()),
        isLive:false,
        playable:false,
        probeState:'offline',
        stream:{type:'',sourceSig:'',url:''}
      };
      continue;
    }

    const sourceSig=String(item?.sourceSig||'');
    const streamUrl=String(item?.streamUrl||'');
    const playable=Boolean(item?.playable&&sourceSig&&streamUrl);
    row.live={
      isLive:true,
      playable,
      probeState:'live',
      title:String(item?.title||''),
      cover:{
        url:String(item?.thumbnail||''),
        sourceUrl:String(item?.thumbnail||''),
        storedUrl:''
      },
      stream:{
        type:playable?String(item?.type||''):'',
        sourceSig:playable?sourceSig:'',
        url:playable?streamUrl:''
      },
      checkedAt:Number(item?.lastSeenAt||data?.checkedAt||0)||null,
      updatedAt:Number(item?.changedAt||0)||null
    };
  }

  renderList();
  updateCurrentUi();
  if(searchQuery)renderSearchResults(searchQuery);

  if(currentHandle&&mediaMode==='live'){
    const nowRow=channelFor(currentHandle);
    const nowLive=nowRow?rowLiveDetected(nowRow):false;
    const nowPlayable=Boolean(nowRow&&rowPlayable(nowRow));
    const nowSig=String(nowRow?.live?.stream?.sourceSig||'');
    if(beforeLive&&!nowLive){
      destroyPlayer();
      document.getElementById('nowState').textContent='';
    }else if(nowLive&&nowPlayable&&(!beforePlayable||beforeSig!==nowSig)){
      openChannel(currentHandle);
    }
  }
}
async function loadLiveNow({silent=true}={}){
  if(liveNowBusy)return;
  liveNowBusy=true;
  try{
    const data=await apiJson(API+'/tiktok/live-now?t='+Date.now());
    applyLiveNow(data);
  }catch(error){
    if(!silent)showToast('Không tải được trạng thái LIVE');
    console.warn('tiktok live realtime',error);
  }finally{
    liveNowBusy=false;
  }
}

async function hydrateIdentity(){ return; }
async function hydrateIdentities(){ return; }
async function loadChannels({force=false,silent=false}={}){
  return loadUnifiedLibrary({force,silent});
}

function optimisticChannel(handle){
  const key=String(handle||'').toLowerCase();
  let row=channels.find(x=>String(x?.handle||'').toLowerCase()===key);
  if(row)return row;
  row={
    handle,
    profile:{
      userId:'',secUid:'',name:'@'+handle,bio:'',verified:false,
      avatar:{url:'',sourceUrl:'',storedUrl:'',width:0,height:0},
      followers:0,following:0,likes:0,videoCount:0,source:'',checkedAt:null
    },
    live:emptyLiveState(),
    videos:[]
  };
  channels.unshift(row);
  return row;
}
function optimisticRemove(handle){
  const key=String(handle||'').toLowerCase();
  channels=channels.filter(row=>String(row?.handle||'').toLowerCase()!==key);
}

async function addChannel(){
  if(mutationBusy)return;
  const input=document.getElementById('addInput');
  const handle=parseHandle(input.value);
  if(!handle){
    input.focus();
    showToast('Link hoặc @handle chưa đúng');
    return;
  }

  // Duplicate means true no-op: no request, no optimistic row, no toast.
  if(channelFor(handle))return;

  mutationBusy=true;
  const btn=document.getElementById('addBtn');
  btn.disabled=true;btn.textContent='Đang kiểm tra…';
  try{
    // Server is authoritative: it verifies that this is a real TikTok channel
    // before changing membership. Only then may the UI reflect the new row.
    const data=await apiJson(API+'/tiktok/selected-channel',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({handle,selected:true})
    });

    // A duplicate discovered by the server is also a strict no-op.
    if(data?.duplicate||data?.unchanged)return;

    optimisticChannel(handle);
    currentHandle=handle;
    renderList();
    renderRecentVideos(handle);
    updateCurrentUi();
    input.value='';

    showToast(data.live?'Đã thêm · LIVE':'Đã thêm kênh');
    libraryVersion=-1;
        await loadUnifiedLibrary({force:true,silent:true});
    await loadLiveNow({silent:true});
    if(currentHandle===handle)openChannel(handle);
  }catch(error){
    if(String(error?.message||'')==='tiktok_channel_not_found'){
      input.focus();
      showToast('Không tìm thấy kênh TikTok');
      return;
    }

    // A transport/server failure may happen after the durable write; reconcile
    // from the canonical package without inventing an optimistic channel.
    libraryVersion=-1;
    await loadUnifiedLibrary({force:true,silent:true});
    showToast('Lưu kênh thất bại');
    console.warn(error);
  }finally{
    mutationBusy=false;
    btn.disabled=false;btn.textContent='Thêm kênh';
  }
}
async function removeChannel(rawHandle){
  const handle=parseHandle(rawHandle);
  if(!handle||mutationBusy)return;
  if(!confirm('Xoá @'+handle+' khỏi danh sách?'))return;
  mutationBusy=true;
  const wasCurrent=handle===currentHandle;
  optimisticRemove(handle);
  if(wasCurrent){
    currentHandle='';currentSourceSig='';currentType='';
    destroyPlayer();
    document.getElementById('overlay').hidden=true;
    updateCurrentUi();
  }
  renderList();
  renderRecentVideos(currentHandle);
  try{
    await apiJson(API+'/tiktok/selected-channel',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({handle,selected:false})
    });
    libraryVersion=-1;
        await loadUnifiedLibrary({force:true,silent:true});
    await loadLiveNow({silent:true});
    showToast('Đã xoá @'+handle);
  }catch(error){
    libraryVersion=-1;
    await loadUnifiedLibrary({force:true,silent:true});
    showToast('Xoá thất bại: '+String(error.message||error));
  }finally{
    mutationBusy=false;
  }
}
function attachFlv(url,handle){
  const video=document.getElementById('liveVideo');
  destroyPlayer();
  let failed=false;
  const p=flvjs.createPlayer(
    {type:'flv',isLive:true,url,cors:true,withCredentials:false},
    {
      enableStashBuffer:false,
      stashInitialSize:64*1024,
      lazyLoad:false,
      autoCleanupSourceBuffer:true,
      autoCleanupMaxBackwardDuration:30,
      autoCleanupMinBackwardDuration:12
    }
  );
  const startPlayback=()=>{
    if(failed||handle!==currentHandle)return;
    try{
      const pending=p.play();
      if(pending&&typeof pending.catch==='function'){
        pending.catch(()=>video.play().catch(()=>{}));
      }
    }catch{
      video.play().catch(()=>{});
    }
  };
  p.attachMediaElement(video);
  p.load();

  // Start while openChannel is still inside the user's click gesture.
  // Waiting only for METADATA_ARRIVED can lose autoplay permission or leave
  // Chrome stuck at the first frame even though the HTTP-FLV stream is valid.
  startPlayback();
  p.on(flvjs.Events.MEDIA_INFO,()=>{
    setPlayerShape(video);
    startPlayback();
  });
  p.on(flvjs.Events.METADATA_ARRIVED,()=>{
    setPlayerShape(video);
    startPlayback();
  });
  p.on(flvjs.Events.ERROR,()=>{
    if(failed)return;
    failed=true;
    destroyPlayer();
    document.getElementById('nowState').textContent='';
  });
  player=p;
  video.onplaying=()=>{
    if(handle!==currentHandle)return;
    video.controls=true;
    setPlayerShape(video);
    updateCurrentUi();
  };
}

function openChannel(rawHandle){
  const handle=parseHandle(rawHandle);
  if(!handle)return;
  currentHandle=handle;
  currentVideoId='';
  currentVideo=null;
  const frame=document.getElementById('videoFrame');
  if(frame)frame.src='about:blank';
  setMediaMode('live');
  document.getElementById('overlay').hidden=false;
  updateCurrentUi();
  renderList();
  renderRecentVideos(handle);

  const row=rowFor(handle)||{};
  const profile=row.profile||{};
  const live=row.live||{};
  const stream=live.stream||{};
  document.getElementById('mediaTitle').textContent=(profile.name||('@'+handle))+' · LIVE';

  const native=document.getElementById('liveVideo');
  native.poster=String(live.cover?.url||live.cover?.sourceUrl||'');
  currentSourceSig=String(stream.sourceSig||'');
  currentType=String(stream.type||'').toLowerCase();

  const packaged=String(stream.url||'').trim();
  if(live.isLive&&live.playable&&packaged&&currentSourceSig&&currentType==='flv'){
    const base=/^https?:\/\//i.test(packaged)?packaged:(API+packaged);
    const url=base+(base.includes('?')?'&':'?')+'t='+Date.now();
    document.getElementById('nowState').textContent='';
    attachFlv(url,handle);
    return;
  }

  destroyPlayer();
  document.getElementById('nowState').textContent='';
}
document.getElementById('addBtn').addEventListener('click',addChannel);
const searchInput=document.getElementById('addInput');
searchInput.addEventListener('input',()=>{
  const raw=searchInput.value.trim();
  if(!raw){
    hideSearchResults();
    return;
  }
  if(/^https?:\/\//i.test(raw))return;
  renderSearchResults(raw);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  e.preventDefault();
  const raw=searchInput.value.trim();
  if(parseHandle(raw)||/tiktok\.com\/@/i.test(raw)){
    void addChannel();
  }else{
    renderSearchResults(raw);
  }
});
document.querySelectorAll('[data-media-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const mode=btn.dataset.mediaMode;
    if(mode==='live'){
      if(currentHandle)openChannel(currentHandle);
      else setMediaMode('live');
      return;
    }
    const list=videosFor(currentHandle);
    if(list.length)openVideo(currentHandle,list[0].id);
    else{
      setMediaMode('video');
      renderRecentVideos(currentHandle);
      if(currentHandle)showToast('Kênh này chưa có video trong thư viện');
    }
  });
});
document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterMode=btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));
    renderList();
  });
});
document.getElementById('refreshBtn').addEventListener('click',()=>{
  libraryVersion=-1;
    void (async()=>{
    await loadUnifiedLibrary({force:true});
    await loadLiveNow({silent:true});
  })();
});
document.getElementById('openTikTokBtn').addEventListener('click',()=>{
  if(!currentHandle)return;
  const url=mediaMode==='video'&&currentVideoId
    ? 'https://www.tiktok.com/@'+currentHandle+'/video/'+currentVideoId
    : 'https://www.tiktok.com/@'+currentHandle+'/live';
  window.open(url,'_blank','noopener');
});
document.getElementById('reloadLiveBtn').addEventListener('click',()=>{
  if(!currentHandle)return;
  if(mediaMode==='video'&&currentVideoId)openVideo(currentHandle,currentVideoId);
  else openChannel(currentHandle);
});
document.getElementById('deleteCurrentBtn').addEventListener('click',()=>{
  if(currentHandle)void removeChannel(currentHandle);
});

void (async()=>{
  await loadUnifiedLibrary({force:true});
  await loadLiveNow({silent:true});
})();
renderRecentVideos('');
setInterval(()=>void loadUnifiedLibrary({silent:true}),POLL_MS);
setInterval(()=>void loadLiveNow({silent:true}),POLL_MS);
}
