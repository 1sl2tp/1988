<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TikTok LIVE · Clean Demo</title>
<link rel="preconnect" href="https://one988-tiktok-session.onrender.com" crossorigin>
<link rel="dns-prefetch" href="//one988-tiktok-session.onrender.com">
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#0f0f0f;
  --panel2:#181818;
  --line:#272727;
  --line2:#333;
  --text:#fff;
  --muted:#9b9b9b;
  --muted2:#737373;
  --pink:#fe2c55;
  --cyan:#25f4ee;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
body{overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit}
button{cursor:pointer}

/* Header: brand | centered YouTube-style search | action */
.topbar{
  position:relative;z-index:30;
  height:64px;
  display:grid;
  grid-template-columns:minmax(190px,1fr) minmax(340px,640px) minmax(120px,1fr);
  align-items:center;
  gap:18px;
  padding:0 18px;
  background:rgba(0,0,0,.96);
  border-bottom:1px solid var(--line)
}
.brand{
  justify-self:start;
  display:flex;align-items:center;gap:10px;
  font-size:19px;font-weight:850;white-space:nowrap
}
.brandmark{position:relative;width:25px;height:29px;display:inline-block}
.brandmark:before,.brandmark:after,.brandmark i{
  content:"";position:absolute;inset:2px 7px 3px 7px;
  border:4px solid #fff;border-top:0;border-radius:3px 3px 8px 8px
}
.brandmark:before{transform:translate(-2px,1px);border-color:var(--cyan)}
.brandmark:after{transform:translate(2px,-1px);border-color:var(--pink)}
.brandmark i{z-index:2;border-color:#fff}
.search-wrap{width:100%;justify-self:center}
.searchbox{
  height:42px;width:100%;
  display:grid;grid-template-columns:42px minmax(0,1fr);
  align-items:center;
  overflow:hidden;
  border:1px solid #303030;
  border-radius:999px;
  background:#121212;
  transition:border-color .15s ease,box-shadow .15s ease
}
.searchbox:focus-within{
  border-color:#4a4a4a;
  box-shadow:0 0 0 1px #262626 inset
}
.search-icon{
  width:42px;height:42px;display:grid;place-items:center;
  color:#8e8e93;pointer-events:none
}
.search-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.searchbox input{
  min-width:0;width:100%;height:40px;
  border:0;outline:0;background:transparent;color:#fff;
  padding:0 15px 0 0;font-size:14px
}
.searchbox input::placeholder{color:#7d7d82}
.primary{
  justify-self:end;
  border:0;border-radius:12px;background:var(--pink);color:#fff;
  height:40px;padding:0 18px;font-weight:750;font-size:14px
}
.primary:hover{filter:brightness(1.05)}
.primary:disabled{opacity:.55;cursor:default}

/* App frame */
.app{
  height:calc(100dvh - 64px);
  min-height:0;
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  overflow:hidden
}
.sidebar{
  min-width:0;height:100%;min-height:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:#050505;
  padding:14px 10px 10px;
  overflow:hidden
}
.sidehead{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:2px 6px 9px
}
.sidehead strong{font-size:14px;font-weight:800}
.summary{
  margin-left:auto;color:var(--muted);
  font-size:10.5px;white-space:nowrap
}
.toolbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:0 6px 10px
}
.tool{
  height:31px;
  border:1px solid #2b2b2b;background:#191919;color:#fff;
  border-radius:10px;padding:0 11px;
  font-size:11.5px;font-weight:650
}
.tool:hover{background:#232323}
.tool.active{background:#fff;color:#000;border-color:#fff}
.list{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  padding:0 2px 16px;
  scrollbar-width:thin;
  scrollbar-color:#575757 transparent
}
.list::-webkit-scrollbar{width:7px}
.list::-webkit-scrollbar-track{background:transparent}
.list::-webkit-scrollbar-thumb{background:#494949;border-radius:999px}
.group{
  display:flex;align-items:center;gap:8px;
  padding:10px 6px 6px;
  color:#747474;font-size:9.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase
}
.group:after{content:"";height:1px;background:#1d1d1d;flex:1}

/* Balanced two-line channel row */
.channel{
  width:100%;min-height:64px;
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  padding:7px 7px;
  margin:2px 0;
  border-radius:14px;
  color:inherit;background:transparent;
  position:relative;
  transition:background .14s ease
}
.channel:hover{background:#141414}
.channel.active{background:#1f1f1f}
.avatar{
  width:42px;height:42px;border-radius:50%;overflow:hidden;
  background:#242424;display:grid;place-items:center;
  font-weight:800;font-size:14px;
  box-shadow:0 0 0 1px #2d2d2d inset
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.chtext{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.chname{
  min-width:0;
  font-size:13.5px;font-weight:780;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.chsub{
  min-width:0;
  display:flex;align-items:center;gap:5px;
  color:#858585;font-size:10.5px;line-height:1.2;
  white-space:nowrap;overflow:hidden
}
.chhandle{
  flex:0 1 auto;min-width:0;
  color:#8c8c8c;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.channel-stats{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:4px;
  color:#777;
  overflow:hidden;white-space:nowrap
}
.channel-stats span{flex:0 0 auto;white-space:nowrap}
.channel-stats .hot{color:#969696}
.row-actions{
  align-self:center;
  display:flex;align-items:center;gap:6px;
  min-width:34px;justify-content:flex-end
}
.live-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--pink);font-size:0;display:block;flex:0 0 auto
}
.iconbtn{
  border:0;background:transparent;color:#858585;
  width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;padding:0;
  opacity:.28;transition:opacity .14s ease,background .14s ease,color .14s ease
}
.channel:hover .iconbtn,.channel.active .iconbtn{opacity:.9}
.iconbtn:hover{background:#2a2a2a;color:#fff}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Compact media stage */
.stage{
  min-width:0;height:100%;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:center;
  padding:14px 22px 12px;
  background:#000
}
.watch{
  width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  gap:0
}
.phone{
  position:relative;
  width:min(100%,540px);
  max-height:calc(100dvh - 64px - 78px);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#000;
  border-radius:18px;
  box-shadow:0 0 0 1px #171717
}
.phone.landscape{
  width:min(100%,760px);
  max-width:760px;
  aspect-ratio:16/9
}
.phone.square{
  width:min(100%,620px);
  max-width:620px;
  aspect-ratio:1/1
}
.phone video{
  width:100%;height:100%;display:block;
  object-fit:contain;background:#000
}
.current-info{
  width:min(100%,540px);
  min-height:58px;
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:9px;align-items:center;
  padding:8px 2px 0
}
.phone.landscape + .current-info{width:min(100%,760px)}
.phone.square + .current-info{width:min(100%,620px)}
.current-info[hidden]{display:none}
.current-avatar{
  width:38px;height:38px;border-radius:50%;overflow:hidden;
  background:#202020;display:grid;place-items:center;
  font-weight:800;font-size:12px
}
.current-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.current-copy{min-width:0}
.now-name{
  font-size:13px;font-weight:780;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.now-handle{
  margin-top:1px;
  color:#858585;font-size:10.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.now-state{
  margin-top:2px;color:#707070;font-size:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.current-actions{display:flex;align-items:center;gap:2px}
.mini-action{
  border:0;background:transparent;color:#8d8d8d;
  width:30px;height:30px;border-radius:8px;
  display:grid;place-items:center;padding:0
}
.mini-action:hover{background:#1c1c1c;color:#fff}
.mini-action:disabled{opacity:.35}
.mini-action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}

.toast{
  position:fixed;left:50%;bottom:24px;z-index:100;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:#242424;color:#fff;border:1px solid #3a3a3a;
  padding:9px 13px;border-radius:9px;font-size:12px;
  transition:.16s ease
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:980px){
  .topbar{
    grid-template-columns:minmax(150px,.7fr) minmax(280px,1.5fr) auto;
    gap:12px;padding:0 12px
  }
  .app{grid-template-columns:280px minmax(0,1fr)}
  .stage{padding-left:12px;padding-right:12px}
  .phone{width:min(100%,500px)}
  .current-info{width:min(100%,500px)}
}
@media(max-width:760px){
  body{overflow:auto}
  .topbar{
    height:auto;min-height:58px;
    grid-template-columns:1fr auto;
    gap:9px;
    padding:9px 10px
  }
  .brand{font-size:17px}
  .search-wrap{grid-column:1 / -1;grid-row:2}
  .primary{grid-column:2;grid-row:1;height:36px;padding:0 14px}
  .searchbox{height:40px}
  .searchbox input{height:38px}
  .app{
    height:auto;min-height:calc(100dvh - 108px);
    display:block;overflow:visible
  }
  .sidebar{
    height:auto;max-height:38vh;
    border-right:0;border-bottom:1px solid var(--line);
    padding:10px 8px 7px
  }
  .list{max-height:27vh}
  .stage{height:auto;overflow:visible;padding:8px 0 26px}
  .watch{height:auto}
  .phone{
    width:100%;max-width:none;max-height:none;
    border-radius:0;box-shadow:none
  }
  .phone.landscape,.phone.square{width:100%;max-width:none}
  .current-info,
  .phone.landscape + .current-info,
  .phone.square + .current-info{
    width:100%;padding:8px 10px 0
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brandmark"><i></i></span><span>TikTok LIVE</span></div>
  <div class="search-wrap">
    <div class="searchbox">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      </span>
      <input id="addInput" autocomplete="off" spellcheck="false" placeholder="Tìm hoặc dán link TikTok">
    </div>
  </div>
  <button class="primary" id="addBtn">Thêm kênh</button>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidehead">
      <strong>Kênh đã chọn</strong>
      <span class="summary" id="summary">Đang tải…</span>
    </div>
    <div class="toolbar">
      <button class="tool active" data-filter="all">Tất cả</button>
      <button class="tool" data-filter="live">Đang phát</button>
      <button class="tool" id="refreshBtn">Làm mới</button>
    </div>
    <div class="list" id="channelList"></div>
  </aside>

  <main class="stage">
    <section class="watch">
      <div class="phone" id="phone">
        <video id="liveVideo" playsinline preload="metadata"></video>
      </div>

      <div class="current-info" id="overlay" hidden>
        <div class="current-avatar" id="nowAvatar">T</div>
        <div class="current-copy">
          <div class="now-name" id="nowName">TikTok LIVE</div>
          <div class="now-handle" id="nowHandle">@handle</div>
          <div class="now-state" id="nowState">Sẵn sàng</div>
        </div>
        <div class="current-actions">
          <button class="mini-action" id="openTikTokBtn" title="Mở TikTok" disabled>
            <svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          </button>
          <button class="mini-action" id="reloadLiveBtn" title="Mở lại" disabled>
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 5"/><path d="M20 4v7h-7"/></svg>
          </button>
          <button class="mini-action" id="deleteCurrentBtn" title="Xoá" disabled>
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://one988-tiktok-session.onrender.com';
const IDENTITY_KEY='tiktokCleanIdentityV2';
const POLL_MS=5000;

let channels=[];
let filterMode='all';
let currentHandle='';
let currentSourceSig='';
let currentType='';
let player=null;
let packageVersion=-1;
let loadBusy=false;
let mutationBusy=false;
let identityBatchBusy=false;
let identityCache={};
let toastTimer=0;

try{
  const raw=JSON.parse(localStorage.getItem(IDENTITY_KEY)||'{}');
  if(raw&&typeof raw==='object')identityCache=raw;
}catch{}

function parseHandle(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  const direct=raw.replace(/^@/,'');
  if(/^[A-Za-z0-9._]{2,32}$/.test(direct))return direct;
  const m=raw.match(/tiktok\.com\/@([A-Za-z0-9._]{2,32})(?:\/live)?/i);
  return m?.[1]||'';
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function compactCount(value){
  const n=Number(value||0);
  if(!Number.isFinite(n)||n<=0)return '';
  if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K';
  return String(Math.round(n));
}
function identityStatsHtml(id){
  const parts=[];
  const follower=compactCount(id?.followerCount);
  const heart=compactCount(id?.heartCount);
  const views=compactCount(id?.latestVideoPlayCount);
  const likes=compactCount(id?.latestVideoDiggCount);
  if(follower)parts.push('<span>'+esc(follower)+' theo dõi</span>');
  if(heart)parts.push('<span>'+esc(heart)+' thích</span>');
  if(views)parts.push('<span class="hot">'+esc(views)+' xem</span>');
  if(likes)parts.push('<span class="hot">♥ '+esc(likes)+'</span>');
  return parts.join('<span>·</span>');
}
function rowPlayable(row){
  const type=String(row?.type||'').toLowerCase();
  return Boolean(row?.live&&row?.ready&&row?.sourceSig&&['flv','hls'].includes(type));
}
function rowFor(handle){
  return channels.find(x=>String(x.handle||'').toLowerCase()===String(handle||'').toLowerCase())||null;
}
function identityFor(handle){
  return identityCache[String(handle||'').toLowerCase()]?.data||null;
}
function saveIdentityCache(){
  try{
    const entries=Object.entries(identityCache)
      .sort((a,b)=>Number(b[1]?.at||0)-Number(a[1]?.at||0))
      .slice(0,80);
    localStorage.setItem(IDENTITY_KEY,JSON.stringify(Object.fromEntries(entries)));
  }catch{}
}
function showToast(message){
  const el=document.getElementById('toast');
  el.textContent=String(message||'');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
async function apiJson(url,options={}){
  const r=await fetch(url,{cache:'no-store',...options});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.error||('HTTP '+r.status));
  return data;
}
function destroyPlayer(){
  try{
    player?.pause?.();
    player?.unload?.();
    player?.detachMediaElement?.();
    player?.destroy?.();
  }catch{}
  player=null;
  const video=document.getElementById('liveVideo');
  try{
    video.controls=false;
    video.pause();
    video.removeAttribute('src');
    video.load();
  }catch{}
}
function setPlayerShape(video){
  const box=document.getElementById('phone');
  const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
  box.classList.remove('landscape','square');
  if(!w||!h)return;
  const ratio=w/h;
  if(ratio>1.12)box.classList.add('landscape');
  else if(ratio>=.88)box.classList.add('square');
}
function updateCurrentUi(){
  const identity=identityFor(currentHandle)||{};
  const row=rowFor(currentHandle)||{};
  const name=String(identity.nickname||'').trim()||('@'+currentHandle);
  const avatar=String(identity.avatar||'').trim();
  document.getElementById('nowName').textContent=name;
  document.getElementById('nowHandle').textContent=currentHandle?'@'+currentHandle:'';
  const statsText=[
    compactCount(identity.followerCount)?compactCount(identity.followerCount)+' theo dõi':'',
    compactCount(identity.heartCount)?compactCount(identity.heartCount)+' thích':'',
    compactCount(identity.latestVideoPlayCount)?compactCount(identity.latestVideoPlayCount)+' xem':''
  ].filter(Boolean).join(' · ');
  document.getElementById('nowState').textContent=currentHandle
    ? statsText
    : '';

  const av=document.getElementById('nowAvatar');
  av.innerHTML=avatar
    ? '<img src="'+esc(avatar)+'" alt="" referrerpolicy="no-referrer">'
    : esc((currentHandle||'T').slice(0,1).toUpperCase());

  const enabled=Boolean(currentHandle);
  document.getElementById('openTikTokBtn').disabled=!enabled;
  document.getElementById('reloadLiveBtn').disabled=!enabled;
  document.getElementById('deleteCurrentBtn').disabled=!enabled;
}
function renderList(){
  const root=document.getElementById('channelList');
  const visible=filterMode==='live'?channels.filter(rowPlayable):channels.slice();
  const liveCount=channels.filter(rowPlayable).length;
  document.getElementById('summary').textContent=channels.length+' kênh · '+liveCount+' đang phát';

  const sorted=visible.sort((a,b)=>
    Number(rowPlayable(b))-Number(rowPlayable(a))||
    Number(b.live)-Number(a.live)||
    Number(b.ready)-Number(a.ready)||
    String(a.handle).localeCompare(String(b.handle))
  );
  if(!sorted.length){
    root.innerHTML='<div style="padding:22px 10px;color:#777;font-size:12px">Chưa có kênh.</div>';
    return;
  }

  const live=sorted.filter(rowPlayable);
  const offline=sorted.filter(x=>!rowPlayable(x));
  const makeRows=list=>list.map(row=>{
    const handle=String(row.handle||'');
    const id=identityFor(handle)||{};
    const nickname=String(id.nickname||'').trim();
    const name=nickname||('@'+handle);
    const avatar=String(id.avatar||'').trim();
    const stats=identityStatsHtml(id);
    return '<div class="channel '+(handle===currentHandle?'active':'')+'" data-handle="'+esc(handle)+'" role="button" tabindex="0">'+
      '<span class="avatar">'+(avatar?'<img src="'+esc(avatar)+'" alt="" referrerpolicy="no-referrer">':esc(handle.slice(0,1).toUpperCase()))+'</span>'+
      '<span class="chtext"><span class="chname">'+esc(name)+'</span>'+
      '<span class="chsub"><span class="chhandle">@'+esc(handle)+'</span>'+
      (stats?'<span class="channel-stats">'+stats+'</span>':'')+'</span></span>'+
      '<span class="row-actions">'+(rowPlayable(row)?'<span class="live-dot" title="Đang phát"></span>':'')+
      '<button type="button" class="iconbtn" data-delete="'+esc(handle)+'" title="Xoá">'+
      '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button></span>'+
      '</div>';
  }).join('');

  let html='';
  if(live.length)html+='<div class="group">Đang phát · '+live.length+'</div>'+makeRows(live);
  if(offline.length)html+='<div class="group">Kênh khác · '+offline.length+'</div>'+makeRows(offline);
  root.innerHTML=html;

  root.querySelectorAll('.channel[data-handle]').forEach(el=>{
    el.addEventListener('click',event=>{
      if(event.target.closest('[data-delete]'))return;
      openChannel(el.dataset.handle);
    });
    el.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){
        event.preventDefault();
        openChannel(el.dataset.handle);
      }
    });
  });
  root.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      removeChannel(el.dataset.delete);
    });
  });
}
function cacheIdentityRow(row){
  const handle=parseHandle(row?.handle||'');
  if(!handle)return;
  const key=handle.toLowerCase();
  identityCache[key]={
    at:Date.now(),
    data:{
      nickname:String(row?.nickname||''),
      avatar:String(row?.avatar||''),
      secUid:String(row?.secUid||''),
      followerCount:Number(row?.followerCount||0),
      followingCount:Number(row?.followingCount||0),
      heartCount:Number(row?.heartCount||0),
      videoCount:Number(row?.videoCount||0),
      latestVideoId:String(row?.latestVideoId||''),
      latestVideoPlayCount:Number(row?.latestVideoPlayCount||0),
      latestVideoDiggCount:Number(row?.latestVideoDiggCount||0),
      source:String(row?.source||'')
    }
  };
}
async function hydrateIdentity(handle){
  handle=parseHandle(handle);
  if(!handle)return;
  const key=handle.toLowerCase();
  const cached=identityCache[key];
  if(cached&&Date.now()-Number(cached.at||0)<12*60*60*1000&&
     (cached.data?.nickname||cached.data?.avatar))return;
  try{
    const data=await apiJson(
      API+'/tiktok/profile-identities?handles='+encodeURIComponent(handle)+'&t='+Date.now()
    );
    const row=Array.isArray(data.items)?data.items[0]:null;
    if(row)cacheIdentityRow(row);
    saveIdentityCache();
    renderList();
    if(handle===currentHandle)updateCurrentUi();
  }catch(error){
    console.warn('identity',handle,error);
  }
}
async function hydrateIdentities(){
  if(identityBatchBusy)return;
  const todo=channels
    .map(x=>String(x.handle||''))
    .filter(handle=>{
      const cached=identityCache[handle.toLowerCase()];
      return !cached||
        Date.now()-Number(cached.at||0)>=12*60*60*1000||
        (!cached.data?.nickname&&!cached.data?.avatar);
    });
  if(!todo.length)return;

  identityBatchBusy=true;
  try{
    for(let start=0;start<todo.length;start+=100){
      const batch=todo.slice(start,start+100);
      const data=await apiJson(
        API+'/tiktok/profile-identities?handles='+encodeURIComponent(batch.join(','))+'&t='+Date.now()
      );
      for(const row of Array.isArray(data.items)?data.items:[]){
        cacheIdentityRow(row);
      }
      saveIdentityCache();
      renderList();
      updateCurrentUi();
    }
  }catch(error){
    console.warn('identity batch',error);
  }finally{
    identityBatchBusy=false;
  }
}
async function loadChannels({force=false,silent=false}={}){
  if(loadBusy)return;
  loadBusy=true;
  try{
    const v=force?-1:packageVersion;
    const data=await apiJson(API+'/tiktok/live-library?v='+encodeURIComponent(v)+'&t='+Date.now());
    if(!data.unchanged&&Array.isArray(data.items)){
      channels=data.items.map(row=>({
        handle:String(row.handle||''),
        live:Boolean(row.live),
        ready:Boolean(row.ready),
        type:String(row.type||''),
        sourceSig:String(row.sourceSig||''),
        status:String(row.status||''),
        changedAt:Number(row.changedAt||0)
      })).filter(x=>parseHandle(x.handle));
      packageVersion=Number(data.version??packageVersion);
      renderList();
      updateCurrentUi();
      if('requestIdleCallback' in window){
        requestIdleCallback(()=>void hydrateIdentities(),{timeout:2500});
      }else{
        setTimeout(()=>void hydrateIdentities(),1800);
      }
    }
  }catch(error){
    if(!silent)showToast('Không tải được danh sách');
    console.warn(error);
  }finally{
    loadBusy=false;
  }
}
async function addChannel(){
  if(mutationBusy)return;
  const input=document.getElementById('addInput');
  const handle=parseHandle(input.value);
  if(!handle){
    input.focus();
    showToast('Link hoặc @handle chưa đúng');
    return;
  }

  // Open uses the exact same path as clicking a channel in the list.
  // Saving and package refresh happen in parallel and never block playback.
  openChannel(handle);
  void hydrateIdentity(handle);

  mutationBusy=true;
  const btn=document.getElementById('addBtn');
  btn.disabled=true;btn.textContent='Đang thêm…';
  try{
    const data=await apiJson(API+'/tiktok/selected-channel',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({handle,selected:true})
    });
    input.value='';

    const key=handle.toLowerCase();
    const index=channels.findIndex(row=>String(row.handle||'').toLowerCase()===key);
    const next={
      handle,
      live:Boolean(data.live),
      ready:Boolean(data.ready),
      type:String(data.type||''),
      sourceSig:String(data.sourceSig||''),
      status:data.live?'live':'checking',
      changedAt:Date.now()
    };
    if(index>=0)channels[index]={...channels[index],...next};
    else channels.unshift(next);

    renderList();
    updateCurrentUi();
    showToast(data.live?'Đã thêm · LIVE':'Đã thêm kênh');

    packageVersion=-1;
    void loadChannels({force:true,silent:true});
  }catch(error){
    showToast('Lưu thất bại, LIVE vẫn đang mở');
    console.warn(error);
  }finally{
    mutationBusy=false;
    btn.disabled=false;btn.textContent='Thêm kênh';
  }
}
async function removeChannel(rawHandle){
  const handle=parseHandle(rawHandle);
  if(!handle||mutationBusy)return;
  if(!confirm('Xoá @'+handle+' khỏi danh sách?'))return;
  mutationBusy=true;
  try{
    await apiJson(API+'/tiktok/selected-channel',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({handle,selected:false})
    });
    if(handle===currentHandle){
      currentHandle='';currentSourceSig='';currentType='';
      destroyPlayer();
      document.getElementById('overlay').hidden=true;
      updateCurrentUi();
    }
    packageVersion=-1;
    await loadChannels({force:true});
    showToast('Đã xoá @'+handle);
  }catch(error){
    showToast('Xoá thất bại: '+String(error.message||error));
  }finally{
    mutationBusy=false;
  }
}
function attachFlv(url,handle,knownSig='',allowFallback=true){
  const video=document.getElementById('liveVideo');
  destroyPlayer();
  let failed=false;
  const p=flvjs.createPlayer(
    {type:'flv',isLive:true,url},
    {
      enableStashBuffer:false,
      stashInitialSize:64*1024,
      lazyLoad:false,
      autoCleanupSourceBuffer:true,
      autoCleanupMaxBackwardDuration:30,
      autoCleanupMinBackwardDuration:12
    }
  );
  p.attachMediaElement(video);
  p.load();
  p.on(flvjs.Events.METADATA_ARRIVED,()=>{
    setPlayerShape(video);
    video.play().catch(()=>{});
  });
  p.on(flvjs.Events.ERROR,()=>{
    if(failed)return;
    failed=true;

    // A prepared package source may have just expired. Fall back once to the
    // direct compatible relay instead of making the user click again.
    if(allowFallback&&knownSig&&handle===currentHandle){
      document.getElementById('nowState').textContent='';
      const direct=API+'/tiktok/live-stream?user='+encodeURIComponent(handle)+'&compat=1&t='+Date.now();
      setTimeout(()=>attachFlv(direct,handle,'',false),0);
      return;
    }
    document.getElementById('nowState').textContent='';
  });
  player=p;
  video.onplaying=()=>{
    setTimeout(()=>{
      if(handle!==currentHandle)return;
      const hasPicture=Number(video.videoWidth||0)>0&&Number(video.videoHeight||0)>0;
      if(!hasPicture){
        if(failed)return;
        failed=true;
        fetch(
          API+'/tiktok/live-feedback?user='+encodeURIComponent(handle)+'&status=bad&type=flv&t='+Date.now(),
          {cache:'no-store'}
        ).catch(()=>{}).finally(()=>{
          if(allowFallback&&handle===currentHandle){
            const direct=API+'/tiktok/live-stream?user='+encodeURIComponent(handle)+'&compat=1&t='+Date.now();
            setTimeout(()=>attachFlv(direct,handle,'',false),250);
          }
        });
        return;
      }

      failed=true;
      video.controls=true;
      setPlayerShape(video);
      updateCurrentUi();
      fetch(
        API+'/tiktok/live-feedback?user='+encodeURIComponent(handle)+'&status=ok&type=flv&t='+Date.now(),
        {cache:'no-store'}
      ).catch(()=>{}).finally(()=>{
        setTimeout(()=>loadChannels({force:true,silent:true}),300);
      });
    },900);
  };
}
function attachHls(url,handle){
  const video=document.getElementById('liveVideo');
  destroyPlayer();
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url;
    video.onloadedmetadata=()=>{setPlayerShape(video);video.play().catch(()=>{})};
    video.onplaying=()=>{
      video.controls=true;
      updateCurrentUi();
      fetch(API+'/tiktok/live-feedback?user='+encodeURIComponent(handle)+'&status=ok&type=hls&t='+Date.now(),{cache:'no-store'}).catch(()=>{});
    };
    return;
  }
  if(window.Hls&&Hls.isSupported()){
    const h=new Hls({lowLatencyMode:true,enableWorker:true,backBufferLength:20,maxBufferLength:16});
    h.loadSource(url);h.attachMedia(video);
    h.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
    video.onplaying=()=>{video.controls=true;setPlayerShape(video)};
    h.on(Hls.Events.ERROR,()=>{});
    player=h;
  }
}
function openChannel(rawHandle){
  const handle=parseHandle(rawHandle);
  if(!handle)return;
  currentHandle=handle;
  document.getElementById('overlay').hidden=false;
  updateCurrentUi();
  renderList();
  void hydrateIdentity(handle);

  const row=rowFor(handle)||{};
  currentSourceSig=String(row.sourceSig||'');
  currentType=String(row.type||'').toLowerCase();

  const base=API+'/tiktok/live-stream?user='+encodeURIComponent(handle);
  if(row.live&&row.ready&&currentSourceSig&&['flv','hls'].includes(currentType)){
    const url=base+'&source='+encodeURIComponent(currentSourceSig)+'&t='+Date.now();
    document.getElementById('nowState').textContent='';
    if(currentType==='hls')attachHls(url,handle);
    else attachFlv(url,handle,currentSourceSig);
    return;
  }

  document.getElementById('nowState').textContent='';
  const url=base+'&compat=1&t='+Date.now();
  attachFlv(url,handle,'');
}
document.getElementById('addBtn').addEventListener('click',addChannel);
document.getElementById('addInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();void addChannel()}
});
document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterMode=btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));
    renderList();
  });
});
document.getElementById('refreshBtn').addEventListener('click',()=>{
  packageVersion=-1;void loadChannels({force:true});
});
document.getElementById('openTikTokBtn').addEventListener('click',()=>{
  if(currentHandle)window.open('https://www.tiktok.com/@'+currentHandle+'/live','_blank','noopener');
});
document.getElementById('reloadLiveBtn').addEventListener('click',()=>{
  if(currentHandle)openChannel(currentHandle);
});
document.getElementById('deleteCurrentBtn').addEventListener('click',()=>{
  if(currentHandle)void removeChannel(currentHandle);
});

void loadChannels({force:true});
setInterval(()=>void loadChannels({silent:true}),POLL_MS);
</script>
