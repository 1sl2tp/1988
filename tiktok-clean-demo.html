const API='https://one988-tiktok-session.onrender.com';
const LIVE_API='https://1988-tiktok-live-state.taphoa-4ab8161d.workers.dev';
const LIVE_POLL_MS=30_000;
const PACKAGE_CHECK_MIN_GAP_MS=15_000;
let lastPackageCheckAt=0;

let channels=[];
let filterMode='all';
let mediaMode='live';
let videoVersion=-1;
let libraryVersion=-1;
let liveNowHandles=new Set();
let liveNowBusy=false;
let currentVideoId='';
let currentVideo=null;
let videoOpenSeq=0;
let searchQuery='';

let currentType='';

const THEME_KEY='tiktok-theme-v1';
function syncThemeUi(){
  const theme=document.documentElement.dataset.theme==='light'?'light':'dark';
  const btn=document.getElementById('themeToggle');
  if(btn)btn.title=theme==='dark'?'Chuyển sang giao diện sáng':'Chuyển sang giao diện tối';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=theme==='dark'?'#000000':'#ffffff';
}
document.getElementById('themeToggle')?.addEventListener('click',()=>{
  const next=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem(THEME_KEY,next)}catch{}
  syncThemeUi();
});
syncThemeUi();

function parseHandle(value){
  const raw=String(value||'').trim();
  if(!raw)return '';
  const direct=raw.replace(/^@/,'');
  if(/^[A-Za-z0-9._]{2,32}$/.test(direct))return direct;
  const m=raw.match(/tiktok\.com\/@([A-Za-z0-9._]{2,32})(?:\/live)?/i);
  return m?.[1]||'';
}
function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[ch]);
}
function compactCount(value){
  const n=Number(value||0);
  if(!Number.isFinite(n)||n<=0)return '';
  if(n>=1e9)return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+'K';
  return String(Math.round(n));
}
function profileStatsHtml(profile,latestVideo){
  const parts=[];
  const follower=compactCount(profile?.followers);
  const heart=compactCount(profile?.likes);
  const views=compactCount(latestVideo?.stats?.views);
  const likes=compactCount(latestVideo?.stats?.likes);
  if(follower)parts.push('<span>'+esc(follower)+' theo dõi</span>');
  if(heart)parts.push('<span>'+esc(heart)+' thích</span>');
  if(views)parts.push('<span class="hot">'+esc(views)+' xem</span>');
  if(likes)parts.push('<span class="hot">♥ '+esc(likes)+'</span>');
  return parts.join('<span>·</span>');
}
function normalizeSearch(value){
  return String(value||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim();
}
function channelFor(handle){
  const key=String(handle||'').toLowerCase();
  return channels.find(row=>String(row?.handle||'').toLowerCase()===key)||null;
}
function profileFor(handle){
  return channelFor(handle)?.profile||null;
}
function videosFor(handle){
  const row=channelFor(handle);
  return Array.isArray(row?.videos)?row.videos:[];
}
function allVideos(){
  return channels.flatMap(row=>
    (Array.isArray(row?.videos)?row.videos:[]).map(video=>({...video,handle:String(video?.handle||row.handle||'')}))
  );
}
function formatDuration(value){
  const total=Math.max(0,Math.round(Number(value||0)));
  if(!total)return '';
  const m=Math.floor(total/60);
  const s=String(total%60).padStart(2,'0');
  return m+':'+s;
}
function formatAgo(value){
  let n=Number(value||0);
  if(!n)return '';
  if(n<1e12)n*=1000;
  const sec=Math.max(1,Math.floor((Date.now()-n)/1000));
  if(sec<60)return sec+' giây trước';
  const min=Math.floor(sec/60);
  if(min<60)return min+' phút trước';
  const hour=Math.floor(min/60);
  if(hour<24)return hour+' giờ trước';
  const day=Math.floor(hour/24);
  if(day<7)return day+' ngày trước';
  const week=Math.floor(day/7);
  if(week<5)return week+' tuần trước';
  const month=Math.floor(day/30);
  if(month<12)return month+' tháng trước';
  return Math.floor(day/365)+' năm trước';
}
function videoMetaText(video){
  return [
    compactCount(video?.stats?.views)?compactCount(video.stats.views)+' xem':'',
    compactCount(video?.stats?.likes)?compactCount(video.stats.likes)+' thích':'',
    formatAgo(video?.createTime)
  ].filter(Boolean).join(' · ');
}
function currentVideoFor(handle,id){
  return videosFor(handle).find(video=>String(video.id||'')===String(id||''))||null;
}
function readyVideosFor(handle){
  return videosFor(handle)
    .filter(video=>/^\d{8,}$/.test(String(video?.id||'')))
    .slice()
    .sort((a,b)=>Number(b.createTime||0)-Number(a.createTime||0));
}
function adjacentReadyVideo(direction){
  if(mediaMode!=='video'||!currentHandle||!currentVideoId)return null;
  const list=readyVideosFor(currentHandle);
  if(list.length<2)return null;
  const index=list.findIndex(video=>String(video.id||'')===String(currentVideoId||''));
  if(index<0)return null;
  const next=index+(direction>0?1:-1);
  return next>=0&&next<list.length?list[next]:null;
}
function warmVideoHint(video){
  if(!video?.handle||!video?.id)return;
  const url=API+'/tiktok/video-warm?user='+encodeURIComponent(video.handle)+'&id='+encodeURIComponent(video.id);
  fetch(url,{cache:'no-store',keepalive:true}).catch(()=>{});
}
function warmNextVideo(){
  const next=adjacentReadyVideo(1);
  if(next)warmVideoHint(next);
}
function syncMediaUrl(mode,handle,id=''){
  try{
    const url=new URL(location.href);
    url.searchParams.set('mode',mode);
    url.searchParams.set('user',handle);
    if(mode==='video'&&id)url.searchParams.set('id',id);
    else url.searchParams.delete('id');
    history.replaceState(null,'',url);
  }catch{}
}
function stepVideo(direction){
  const next=adjacentReadyVideo(direction);
  if(!next)return false;
  const phone=document.getElementById('phone');
  phone?.classList.add(direction>0?'swipe-next':'swipe-prev');
  setTimeout(()=>{
    phone?.classList.remove('swipe-next','swipe-prev');
    openVideo(next.handle,next.id);
  },90);
  return true;
}
function adjacentPlayableLive(direction){
  const list=channels.filter(row=>rowPlayable(row));
  if(list.length<2)return null;
  const index=list.findIndex(row=>String(row?.handle||'').toLowerCase()===String(currentHandle||'').toLowerCase());
  if(index<0)return list[0]||null;
  const next=index+(direction>0?1:-1);
  return next>=0&&next<list.length?list[next]:null;
}
function stepLive(direction){
  const next=adjacentPlayableLive(direction);
  const handle=parseHandle(next?.handle||'');
  if(!handle||handle.toLowerCase()===String(currentHandle||'').toLowerCase())return false;
  const phone=document.getElementById('phone');
  phone?.classList.add(direction>0?'swipe-next':'swipe-prev');
  setTimeout(()=>{
    phone?.classList.remove('swipe-next','swipe-prev');
    openChannel(handle);
  },90);
  return true;
}
function stepCurrentMedia(direction){
  return mediaMode==='video'?stepVideo(direction):stepLive(direction);
}
function rowLiveDetected(row){
  return liveNowHandles.has(String(row?.handle||'').toLowerCase());
}
function rowPlayable(row){
  const live=row?.live||{};
  const stream=live?.stream||{};
  const type=String(stream?.type||'').toLowerCase();
  return Boolean(
    rowLiveDetected(row)&&
    live?.playable&&
    stream?.sourceSig&&
    (stream?.url||stream?.hlsUrl)&&
    type==='flv'
  );
}
function rowFor(handle){
  return channelFor(handle);
}
function showToast(message){
  const el=document.getElementById('toast');
  el.textContent=String(message||'');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
async function apiJson(url,options={}){
  const r=await fetch(url,{cache:'no-store',...options});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data?.error||('HTTP '+r.status));
  return data;
}
function destroyPlayer(){
  try{
    player?.pause?.();
    player?.unload?.();
    player?.detachMediaElement?.();
    player?.destroy?.();
  }catch{}
  player=null;

  const video=document.getElementById('liveVideo');
  try{
    video.hidden=false;
    video.controls=false;
    video.pause();
    video.onerror=null;
    video.onloadedmetadata=null;
    video.oncanplay=null;
    video.onplaying=null;
    video.onended=null;
    video.removeAttribute('src');
    video.load();
  }catch{}
}
function setPlayerShape(video){
  const box=document.getElementById('phone');
  const w=Number(video.videoWidth||0),h=Number(video.videoHeight||0);
  box.classList.remove('landscape','square');
  if(!w||!h)return;
  const ratio=w/h;
  if(ratio>1.12)box.classList.add('landscape');
  else if(ratio>=.88)box.classList.add('square');
}
function mediaClock(value){
  const total=Math.max(0,Math.floor(Number(value)||0));
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=String(total%60).padStart(2,'0');
  return h?String(h)+':'+String(m).padStart(2,'0')+':'+s:String(m)+':'+s;
}
function syncMediaControls(){
  const video=document.getElementById('liveVideo');
  const controls=document.getElementById('mediaControls');
  const seek=document.getElementById('mediaSeek');
  const current=document.getElementById('mediaCurrentTime');
  const duration=document.getElementById('mediaDuration');
  const liveChip=document.getElementById('mediaLiveChip');
  const seekWrap=document.getElementById('mediaSeekWrap');
  if(!video||!controls||!seek)return;

  const isLive=mediaMode==='live';
  controls.dataset.mode=isLive?'live':'video';
  liveChip.hidden=!isLive;

  seekWrap.hidden=isLive;
  current.hidden=isLive;
  duration.hidden=isLive;

  if(!isLive){
    const d=Number(video.duration||0);
    const t=Number(video.currentTime||0);
    current.textContent=mediaClock(t);
    duration.textContent=mediaClock(d);
    if(!mediaSeeking){
      seek.value=d>0?String(Math.max(0,Math.min(1000,Math.round(t/d*1000)))):'0';
    }
    seek.style.setProperty('--seek-progress',(Number(seek.value||0)/10)+'%');
  }

  controls.classList.toggle('is-paused',video.paused);
  controls.classList.toggle('is-muted',video.muted||video.volume===0);
}
function installMediaControls(){
  const video=document.getElementById('liveVideo');
  const play=document.getElementById('mediaPlayBtn');
  const mute=document.getElementById('mediaMuteBtn');
  const full=document.getElementById('mediaFullBtn');
  const seek=document.getElementById('mediaSeek');
  const phone=document.getElementById('phone');
  if(!video||!play||!mute||!full||!seek||!phone)return;

  play.addEventListener('click',event=>{
    event.stopPropagation();
    if(video.paused)video.play().catch(()=>{});
    else video.pause();
  });
  mute.addEventListener('click',event=>{
    event.stopPropagation();
    video.muted=!video.muted;
    syncMediaControls();
  });
  full.addEventListener('click',event=>{
    event.stopPropagation();
    if(document.fullscreenElement)document.exitFullscreen?.();
    else phone.requestFullscreen?.();
  });

  seek.addEventListener('pointerdown',()=>{mediaSeeking=true});
  seek.addEventListener('input',()=>{
    if(mediaMode!=='video')return;
    const d=Number(video.duration||0);
    if(!(d>0))return;
    seek.style.setProperty('--seek-progress',(Number(seek.value||0)/10)+'%');
    document.getElementById('mediaCurrentTime').textContent=
      mediaClock(d*Number(seek.value||0)/1000);
  });
  const commitSeek=()=>{
    if(mediaMode!=='video'){mediaSeeking=false;return;}
    const d=Number(video.duration||0);
    if(d>0)video.currentTime=d*Number(seek.value||0)/1000;
    mediaSeeking=false;
    syncMediaControls();
  };
  seek.addEventListener('change',commitSeek);
  seek.addEventListener('pointerup',commitSeek);

  // A simple tap on the video toggles play/pause; controls remain fixed.
  video.addEventListener('click',()=>{
    if(video.paused)video.play().catch(()=>{});
    else video.pause();
  });
  for(const name of ['timeupdate','durationchange','loadedmetadata','play','pause','volumechange','ended']){
    video.addEventListener(name,syncMediaControls);
  }
  document.addEventListener('fullscreenchange',syncMediaControls);
  syncMediaControls();
}

function updateCurrentUi(){
  const row=rowFor(currentHandle)||{};
  const profile=row.profile||{};
  const latest=Array.isArray(row.videos)?row.videos[0]||{}:{};
  const name=String(profile.name||'').trim()||('@'+currentHandle);
  const avatar=String(profile.avatar?.url||profile.avatar?.sourceUrl||'').trim();
  document.getElementById('nowName').textContent=name;
  document.getElementById('nowHandle').textContent=currentHandle?'@'+currentHandle:'';
  const statsText=[
    compactCount(profile.followers)?compactCount(profile.followers)+' theo dõi':'',
    compactCount(profile.likes)?compactCount(profile.likes)+' thích':'',
    compactCount(latest?.stats?.views)?compactCount(latest.stats.views)+' xem':''
  ].filter(Boolean).join(' · ');
  document.getElementById('nowState').textContent=currentHandle
    ? (mediaMode==='video'&&currentVideo
        ? [String(currentVideo.title||'').trim(),videoMetaText(currentVideo)].filter(Boolean).join(' · ')
        : (rowPlayable(row)
            ? ('LIVE'+(statsText?' · '+statsText:''))
            : statsText))
    : '';

  const av=document.getElementById('nowAvatar');
  av.innerHTML=avatar
    ? '<img src="'+esc(avatar)+'" alt="" referrerpolicy="no-referrer">'
    : esc((currentHandle||'T').slice(0,1).toUpperCase());

  const enabled=Boolean(currentHandle);
  document.getElementById('openTikTokBtn').disabled=!enabled;
  document.getElementById('reloadLiveBtn').disabled=!enabled;
  const deleteBtn=document.getElementById('deleteCurrentBtn');
  if(deleteBtn)deleteBtn.disabled=!enabled;
}
function renderList(){
  const root=document.getElementById('channelList');
  // LIVE visibility and FLV playability are separate. Every channel
  // detected LIVE must remain visible even while its FLV is still resolving.
  const liveRows=channels.filter(rowLiveDetected);
  const visible=filterMode==='live'?liveRows:channels.slice();
  const liveCount=liveRows.length;
  document.getElementById('summary').textContent=channels.length+' kênh · '+liveCount+' đang LIVE';

  const sorted=visible.sort((a,b)=>
    Number(rowLiveDetected(b))-Number(rowLiveDetected(a))||
    Number(rowPlayable(b))-Number(rowPlayable(a))||
    String(a.handle).localeCompare(String(b.handle))
  );
  if(!sorted.length){
    root.innerHTML='<div style="padding:22px 10px;color:#777;font-size:12px">Chưa có kênh.</div>';
    return;
  }

  const live=sorted.filter(rowLiveDetected);
  const offline=sorted.filter(row=>!rowLiveDetected(row));
  const makeRows=list=>list.map(row=>{
    const handle=String(row.handle||'');
    const profile=row.profile||{};
    const name=String(profile.name||'').trim()||('@'+handle);
    const avatar=String(profile.avatar?.url||profile.avatar?.sourceUrl||'').trim();
    const stats=profileStatsHtml(profile,row.videos?.[0]);
    return '<div class="channel '+(handle===currentHandle?'active':'')+'" data-handle="'+esc(handle)+'" role="button" tabindex="0">'+

async function openVideo(rawHandle,videoId,{withSound=true}={}){
  const handle=parseHandle(rawHandle);
  const video=currentVideoFor(handle,videoId);
  if(!handle||!video)return;

  ++videoOpenSeq;
  currentHandle=handle;
  currentVideoId=String(video.id||'');
  currentVideo=video;
  syncMediaUrl('video',handle,currentVideoId);

  destroyPlayer();
  setMediaMode('video');

  document.getElementById('overlay').hidden=false;
  updateCurrentUi();
  document.getElementById('nowState').textContent=
    String(video.title||'').trim()||videoMetaText(video);
  document.getElementById('mediaTitle').textContent=
    (profileFor(handle)?.name||('@'+handle))+' · Video';

  renderList();
  renderRecentVideos(handle);
  hideSearchResults();

  // VOD package already contains a fresh signed MP4 selected by the server.
  // Play that URL immediately; only use the Cloudflare resolver as recovery.
  // This keeps click-to-play cheap and avoids resolving/probing TikTok again
  // for every video the server has already prepared.
  const media=document.getElementById('liveVideo');
  const endpoint=new URL(LIVE_API+'/tiktok/video-stream');
  endpoint.searchParams.set('user',handle);
  endpoint.searchParams.set('id',currentVideoId);
  endpoint.searchParams.set('source','auto');
  const relayUrl=endpoint.toString();

  const packagedUrl=String(video?.playback?.url||'').trim();
  const expiryMs=Date.parse(String(video?.playback?.expiresAt||''));
  const packagedFresh=Boolean(
    video?.playback?.ready&&
    /^https:\/\//i.test(packagedUrl)&&
    (!Number.isFinite(expiryMs)||expiryMs-Date.now()>30_000)
  );
  let usingRelay=!packagedFresh;
  let switchingSource=false;

  const startSource=src=>{
    media.src=src;
    media.load();
    media.play().catch(()=>{});
  };
  const switchToRelay=()=>{
    if(usingRelay||switchingSource)return false;
    switchingSource=true;
    usingRelay=true;
    try{media.pause();}catch{}
    startSource(relayUrl);
    switchingSource=false;
    return true;
  };
  const requireVideoPicture=()=>{
    // An audio-only/unsupported MP4 can still expose duration and play sound.
    // A real VOD must expose decoded picture dimensions.
    if(!usingRelay&&media.readyState>=1&&(!media.videoWidth||!media.videoHeight)){
      return !switchToRelay();
    }
    return true;
  };

  media.hidden=false;
  media.controls=false;
  media.autoplay=true;
  media.muted=!withSound;
  media.playsInline=true;
  media.preload='auto';
  media.poster=String(video?.cover?.url||video?.cover?.sourceUrl||'');
  media.onloadedmetadata=()=>{
    if(!requireVideoPicture())return;
    setPlayerShape(media);
    syncMediaControls();
  };
  media.oncanplay=()=>{
    if(!requireVideoPicture())return;
    syncMediaControls();
  };
  media.onplaying=()=>{
    if(!requireVideoPicture())return;
    syncMediaControls();
  };
  media.onended=()=>stepVideo(1);
  media.onerror=()=>{
    if(!usingRelay&&switchToRelay())return;
    showToast('Không mở được video TikTok');
  };
  startSource(packagedFresh?packagedUrl:relayUrl);
  syncMediaControls();
}

function emptyLiveState(){
  return {

    playable:false,

    stream:{type:'',sourceSig:'',url:'',proxyUrl:''},

function applyUnifiedLibrary(data){
  const rows=Array.isArray(data?.channels)?data.channels:[];
  const previousLive=new Map(
    channels.map(row=>[String(row?.handle||'').toLowerCase(),row?.live||emptyLiveState()])
  );
  channels=rows.map(ch=>{
    const handle=String(ch?.handle||'');
    const profile=ch?.profile||{};
    const videos=(Array.isArray(ch?.videos)?ch.videos:[])
      .map(v=>({
        id:String(v?.id||''),
        handle,
        title:String(v?.title||''),
        createTime:Number(v?.createTime||0),
        duration:Number(v?.duration||0),
        pageUrl:String(v?.pageUrl||''),
        cover:{
          url:String(v?.cover?.url||v?.cover?.sourceUrl||''),
          sourceUrl:String(v?.cover?.sourceUrl||''),
          storedUrl:String(v?.cover?.storedUrl||''),
          width:Number(v?.cover?.width||0),
          height:Number(v?.cover?.height||0)
        },
        stats:{
          views:Number(v?.stats?.views||0),
          likes:Number(v?.stats?.likes||0),
          comments:Number(v?.stats?.comments||0),
          shares:Number(v?.stats?.shares||0),
          collects:Number(v?.stats?.collects||0)
        },
        playback:{
          type:String(v?.playback?.type||'mp4'),
          ready:Boolean(v?.playback?.ready),
          url:String(v?.playback?.url||''),
          proxyUrl:String(v?.playback?.proxyUrl||''),
          source:String(v?.playback?.source||''),
          expiresAt:v?.playback?.expiresAt||null,
          updatedAt:v?.playback?.updatedAt||null
        }
      }))
      .filter(v=>/^\d{8,}$/.test(v.id));

    return {
      handle,
      profile:{
        userId:String(profile?.userId||''),
        secUid:String(profile?.secUid||''),
        name:String(profile?.name||''),
        bio:String(profile?.bio||''),
        verified:Boolean(profile?.verified),
        avatar:{
          url:String(profile?.avatar?.url||profile?.avatar?.sourceUrl||''),
          sourceUrl:String(profile?.avatar?.sourceUrl||''),
          storedUrl:String(profile?.avatar?.storedUrl||''),
          width:Number(profile?.avatar?.width||0),
          height:Number(profile?.avatar?.height||0)
        },
        followers:Number(profile?.followers||0),
        following:Number(profile?.following||0),
        likes:Number(profile?.likes||0),
        videoCount:Number(profile?.videoCount||0),
        source:String(profile?.source||''),
        checkedAt:profile?.checkedAt||null
      },
      live:previousLive.get(handle.toLowerCase())||emptyLiveState(),
      videos
    };
  }).filter(row=>parseHandle(row.handle));

  libraryVersion=Number(data?.version??libraryVersion);
  packageVersion=libraryVersion;
  videoVersion=libraryVersion;

  renderList();
  renderRecentVideos(currentHandle);
  updateCurrentUi();
  if(searchQuery)renderSearchResults(searchQuery);
}
async function loadUnifiedLibrary({force=false,silent=false}={}){
  if(loadBusy)return;
  loadBusy=true;
  try{
    const v=force?-1:libraryVersion;
    const data=await apiJson(API+'/tiktok/library?v='+encodeURIComponent(v)+'&t='+Date.now());
    if(!data.unchanged)applyUnifiedLibrary(data);
  }catch(error){
    if(!silent)showToast('Không tải được thư viện TikTok');
    console.warn('tiktok library',error);
  }finally{
    loadBusy=false;
  }
}
function applyLiveNow(data){
  const items=Array.isArray(data?.items)?data.items:[];
  const beforeRow=currentHandle?channelFor(currentHandle):null;
  const beforeLive=beforeRow?rowLiveDetected(beforeRow):false;
  const beforePlayable=Boolean(beforeRow&&rowPlayable(beforeRow));
  const beforeSig=String(beforeRow?.live?.stream?.sourceSig||'');

  const byHandle=new Map();
  for(const item of items){
    const handle=String(item?.handle||'').toLowerCase();
    if(handle)byHandle.set(handle,item);
  }
  liveNowHandles=new Set(byHandle.keys());

  // LIVE state comes only from the current server snapshot.
  // Channel/video metadata still comes from the unified package.
  for(const row of channels){
    const key=String(row?.handle||'').toLowerCase();
    const item=byHandle.get(key);
    if(!item){
      row.live={
        ...(row.live||emptyLiveState()),
        isLive:false,
        playable:false,
        probeState:'offline',
        stream:{type:'',sourceSig:'',url:'',hlsUrl:'',proxyUrl:''}
      };
      continue;
    }

    const sourceSig=String(item?.sourceSig||'');
    const streamUrl=String(item?.streamUrl||'');
    const hlsUrl=String(item?.hlsUrl||'');
    const proxyUrl=String(item?.proxyUrl||'');
    const playable=Boolean(item?.playable&&sourceSig&&streamUrl);
    row.live={
      isLive:true,
      playable,
      probeState:'live',
      title:String(item?.title||''),
      cover:{
        url:String(item?.thumbnail||''),
        sourceUrl:String(item?.thumbnail||''),
        storedUrl:''
      },
      stream:{
        type:playable?String(item?.type||''):'',
        sourceSig:playable?sourceSig:'',
        url:playable?streamUrl:'',
        hlsUrl:playable?hlsUrl:'',
        proxyUrl:playable?proxyUrl:''
      },
      checkedAt:Number(item?.lastSeenAt||data?.checkedAt||0)||null,
      updatedAt:Number(item?.changedAt||0)||null
    };
  }

  renderList();
  updateCurrentUi();
  if(searchQuery)renderSearchResults(searchQuery);

  if(currentHandle&&mediaMode==='live'){
    const nowRow=channelFor(currentHandle);
    const nowLive=nowRow?rowLiveDetected(nowRow):false;
    const nowPlayable=Boolean(nowRow&&rowPlayable(nowRow));
    const nowSig=String(nowRow?.live?.stream?.sourceSig||'');
    if(beforeLive&&!nowLive){
      destroyPlayer();
      document.getElementById('nowState').textContent='';
    }else if(nowLive&&nowPlayable&&(!beforePlayable||beforeSig!==nowSig)){
      openChannel(currentHandle);
    }
  }
}
async function loadLiveNow({silent=true}={}){
  if(liveNowBusy)return;
  liveNowBusy=true;
  try{
    let data=null;
    try{
      data=await apiJson(LIVE_API+'/tiktok/live-now?t='+Date.now());
      if(!data?.edge)throw new Error('edge_state_invalid');
    }catch(edgeError){
      console.warn('tiktok live edge fallback',edgeError);
      data=await apiJson(API+'/tiktok/live-now?t='+Date.now());
    }
    applyLiveNow(data);
  }catch(error){
    if(!silent)showToast('Không tải được trạng thái LIVE');
    console.warn('tiktok live realtime',error);
  }finally{
    liveNowBusy=false;
  }
}

function nativeHlsSupported(video){

function mpegtsLiveSupported(){
  try{
    if(!window.mpegts)return false;
    const features=typeof mpegts.getFeatureList==='function'?mpegts.getFeatureList():{};
    return Boolean(
      mpegts.isSupported?.()||

      features?.msePlayback
    );
  }catch{return false}
}

function attachFlv(url,handle,retryCount=0,fallbackUrl='',forceLegacy=false){
  const video=document.getElementById('liveVideo');
  destroyPlayer();
  let failed=false;

  let engine=null;
  let engineName='';
  if(!forceLegacy&&mpegtsLiveSupported()){
    engine=window.mpegts;
    engineName='mpegts';
  }else if(window.flvjs&&flvjs.isSupported?.()){
    engine=window.flvjs;
    engineName='flvjs';
  }
  if(!engine){
    if(fallbackUrl&&fallbackUrl!==url){
      video.src=fallbackUrl;
      video.load();
      video.play().catch(()=>{});
    }
    return;
  }

  let p=null;
  try{
    p=engine.createPlayer(
      {type:'flv',isLive:true,url,cors:true,withCredentials:false},
      {
        enableStashBuffer:false,
        stashInitialSize:64*1024,
        lazyLoad:false,
        autoCleanupSourceBuffer:true,
        autoCleanupMaxBackwardDuration:30,
        autoCleanupMinBackwardDuration:12,
        liveSync:true,
        liveSyncMaxLatency:3,
        liveSyncTargetLatency:1.2
      }
    );
  }catch(error){
    console.warn('tiktok live player create',engineName,error);
    if(engineName==='mpegts'&&window.flvjs?.isSupported?.()){
      attachFlv(url,handle,retryCount,fallbackUrl,true);
      return;
    }
    if(fallbackUrl&&fallbackUrl!==url)attachFlv(fallbackUrl,handle,0,'',true);
    return;
  }

  const startPlayback=()=>{
    if(failed||handle!==currentHandle)return;
    try{
      const pending=p.play();
      if(pending&&typeof pending.catch==='function'){
        pending.catch(()=>video.play().catch(()=>{}));
      }
    }catch{
      video.play().catch(()=>{});
    }
  };

  try{
    p.attachMediaElement(video);
    p.load();
  }catch(error){
    console.warn('tiktok live player attach',engineName,error);
    try{p.destroy?.()}catch{}
    if(engineName==='mpegts'&&window.flvjs?.isSupported?.()){
      attachFlv(url,handle,retryCount,fallbackUrl,true);
    }
    return;
  }

  startPlayback();
  const events=engine.Events||{};
  if(events.MEDIA_INFO)p.on(events.MEDIA_INFO,()=>{
    setPlayerShape(video);
    startPlayback();
  });
  if(events.METADATA_ARRIVED)p.on(events.METADATA_ARRIVED,()=>{
    setPlayerShape(video);
    startPlayback();
  });
  if(events.ERROR)p.on(events.ERROR,()=>{
    if(failed)return;
    failed=true;
    destroyPlayer();
    document.getElementById('nowState').textContent='';
    if(handle!==currentHandle||mediaMode!=='live')return;

    // First failure on mpegts.js -> fall back to the old flv.js engine.
    if(engineName==='mpegts'&&window.flvjs?.isSupported?.()){
      setTimeout(()=>{
        if(handle===currentHandle&&mediaMode==='live'){
          attachFlv(url,handle,retryCount,fallbackUrl,true);
        }
      },120);
      return;
    }

    // Direct CDN rejected -> compatibility proxy once.
    if(fallbackUrl&&fallbackUrl!==url){
      setTimeout(()=>{
        if(handle===currentHandle&&mediaMode==='live'){
          attachFlv(fallbackUrl,handle,0,'',true);
        }
      },250);
      return;
    }
    if(retryCount<1){
      setTimeout(()=>{
        if(handle===currentHandle&&mediaMode==='live'){
          attachFlv(url,handle,retryCount+1,'',true);
        }
      },900);
    }
  });

  player=p;
  video.onplaying=()=>{
    if(handle!==currentHandle)return;
    video.controls=false;
    setPlayerShape(video);
    updateCurrentUi();
  };
}

function openChannel(rawHandle){
  const handle=parseHandle(rawHandle);
  if(!handle)return;
  currentHandle=handle;
  currentVideoId='';
  currentVideo=null;
  syncMediaUrl('live',handle);
  setMediaMode('live');
  document.getElementById('overlay').hidden=false;
  updateCurrentUi();
  renderList();
  renderRecentVideos(handle);

  const row=rowFor(handle)||{};
  const profile=row.profile||{};
  const live=row.live||{};
  const stream=live.stream||{};
  document.getElementById('mediaTitle').textContent=(profile.name||('@'+handle))+' · LIVE';

  const native=document.getElementById('liveVideo');
  native.hidden=false;
  native.controls=false;
  native.poster=String(live.cover?.url||live.cover?.sourceUrl||'');
  currentSourceSig=String(stream.sourceSig||'');
  currentType=String(stream.type||'').toLowerCase();

  const packaged=String(stream.url||'').trim();
  const hls=String(stream.hlsUrl||'').trim();
  const proxy=String(stream.proxyUrl||'').trim();
  if(live.isLive&&live.playable&&packaged&&currentSourceSig&&currentType==='flv'){
    const url=/^https?:\/\//i.test(packaged)?packaged:(API+packaged);
    const hlsUrl=/^https?:\/\//i.test(hls)?hls:'';
    document.getElementById('nowState').textContent='';

    // Media bytes stay on TikTok CDN. Render is not a playback proxy.
    if(isAppleMobileBrowser()&&hlsUrl&&nativeHlsSupported(native)){
      attachNativeHls(hlsUrl,handle,url,'');
    }else{
      attachFlv(url,handle,0,'');
    }
    return;
  }

  destroyPlayer();
  updateCurrentUi();
}
const searchInput=document.getElementById('addInput');
searchInput.addEventListener('input',()=>{
  const raw=searchInput.value.trim();
  if(!raw){
    hideSearchResults();
    return;
  }
  if(/^https?:\/\//i.test(raw))return;
  renderSearchResults(raw);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  e.preventDefault();
  const raw=searchInput.value.trim();
  if(raw)renderSearchResults(raw);
});
document.querySelectorAll('[data-media-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const mode=btn.dataset.mediaMode;
    if(mode==='live'){
      if(currentHandle)openChannel(currentHandle);
      else setMediaMode('live');
      return;
    }
    const list=videosFor(currentHandle).filter(video=>/^\d{8,}$/.test(String(video?.id||'')));
    if(list.length)openVideo(currentHandle,list[0].id);
    else{
      setMediaMode('video');
      renderRecentVideos(currentHandle);
      return;
    }
  });
});
const swipeSurface=document.getElementById('phone');
let swipeStartX=0;
let swipeStartY=0;
let swipeLastX=0;
let swipeLastY=0;
let swipeTracking=false;
let swipeLocked=false;

function swipeCanStart(event){
  if(mediaMode==='video'&&!currentVideoId)return false;
  if(mediaMode==='live'&&!currentHandle)return false;
  const touch=event.touches?.[0];
  if(!touch)return false;
  if(event.target?.closest?.('.media-controls'))return false;
  const rect=swipeSurface.getBoundingClientRect();
  const localY=touch.clientY-rect.top;
  // Bottom custom controls own this fixed strip.
  if(localY>rect.height-44)return false;
  return true;
}
swipeSurface?.addEventListener('touchstart',event=>{
  if(event.touches?.length!==1||!swipeCanStart(event))return;
  const touch=event.touches[0];
  swipeStartX=swipeLastX=touch.clientX;
  swipeStartY=swipeLastY=touch.clientY;
  swipeTracking=true;
  swipeLocked=false;
},{passive:true});
swipeSurface?.addEventListener('touchmove',event=>{
  if(!swipeTracking||event.touches?.length!==1)return;
  const touch=event.touches[0];
  swipeLastX=touch.clientX;
  swipeLastY=touch.clientY;
  const dx=swipeLastX-swipeStartX;
  const dy=swipeLastY-swipeStartY;
  if(!swipeLocked&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2)swipeLocked=true;
  if(swipeLocked)event.preventDefault();
},{passive:false});
swipeSurface?.addEventListener('touchend',()=>{
  if(!swipeTracking)return;
  swipeTracking=false;
  const dx=swipeLastX-swipeStartX;
  const dy=swipeLastY-swipeStartY;
  const vertical=Math.abs(dy)>=54&&Math.abs(dy)>Math.abs(dx)*1.25;
  swipeLocked=false;
  if(!vertical)return;
  // TikTok convention: swipe up -> next; swipe down -> previous.
  // Applies to both saved videos and currently playable LIVE channels.
  stepCurrentMedia(dy<0?1:-1);
},{passive:true});
swipeSurface?.addEventListener('touchcancel',()=>{
  swipeTracking=false;
  swipeLocked=false;
},{passive:true});

// Trackpad / mouse-wheel parity for narrow desktop windows: scrolling directly
// over the media behaves like a TikTok vertical swipe without moving the page.
let mediaWheelLockedUntil=0;
swipeSurface?.addEventListener('wheel',event=>{
  if(event.target?.closest?.('.media-controls'))return;
  if(mediaMode==='video'&&!currentVideoId)return;
  if(mediaMode==='live'&&!currentHandle)return;
  const now=Date.now();
  if(now<mediaWheelLockedUntil){
    event.preventDefault();
    return;
  }
  const dx=Number(event.deltaX||0);
  const dy=Number(event.deltaY||0);
  if(Math.abs(dy)<28||Math.abs(dy)<=Math.abs(dx)*1.2)return;
  if(stepCurrentMedia(dy>0?1:-1)){
    event.preventDefault();
    mediaWheelLockedUntil=now+420;
  }
},{passive:false});

// Desktop/tablet keyboard parity for quick review.
document.addEventListener('keydown',event=>{
  if(mediaMode==='video'&&!currentVideoId)return;
  if(mediaMode==='live'&&!currentHandle)return;
  if(event.target?.matches?.('input,textarea,[contenteditable="true"]'))return;
  if(event.key==='ArrowDown'){
    if(stepCurrentMedia(1))event.preventDefault();
  }else if(event.key==='ArrowUp'){
    if(stepCurrentMedia(-1))event.preventDefault();
  }
});

document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterMode=btn.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));
    renderList();
  });
});
document.getElementById('refreshBtn').addEventListener('click',()=>{
  libraryVersion=-1;
    void (async()=>{
    await loadUnifiedLibrary({force:true});
    await loadLiveNow({silent:true});
  })();
});
document.getElementById('openTikTokBtn').addEventListener('click',()=>{
  if(!currentHandle)return;
  const url=mediaMode==='video'&&currentVideoId
    ? 'https://www.tiktok.com/@'+currentHandle+'/video/'+currentVideoId
    : 'https://www.tiktok.com/@'+currentHandle+'/live';

});
document.getElementById('reloadLiveBtn').addEventListener('click',()=>{
  if(!currentHandle)return;
  if(mediaMode==='video'&&currentVideoId)openVideo(currentHandle,currentVideoId);
  else openChannel(currentHandle);
});

installMediaControls();

async function openRequestedMedia(){
  const params=new URLSearchParams(location.search);
  const mode=String(params.get('mode')||'').toLowerCase();
  const handle=parseHandle(params.get('user')||'');
  const id=String(params.get('id')||'').trim();
  if(!handle)return;

  if(mode==='video'&&id){
    const video=currentVideoFor(handle,id);
    if(video){
      openVideo(handle,id,{withSound:false});
      return;
    }
  }

  if(mode==='live'){
    const row=channelFor(handle);
    if(row){
      openChannel(handle);
      return;
    }
  }
}

void (async()=>{
  await loadUnifiedLibrary({force:true});
  await loadLiveNow({silent:true});
  await openRequestedMedia();
})();
renderRecentVideos('');

async function checkLibraryOnDemand({force=false}={}){
  if(document.hidden)return false;
  const now=Date.now();
  if(!force&&now-lastPackageCheckAt<PACKAGE_CHECK_MIN_GAP_MS)return false;
  lastPackageCheckAt=now;
  await loadUnifiedLibrary({force,silent:true});
  return true;
}

// The library/package is immutable-by-version from the UI point of view.
// Do not poll it every minute. Re-check only when the app becomes relevant
// again or the user explicitly refreshes.
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  void checkLibraryOnDemand();
  void loadLiveNow({silent:true});
});
window.addEventListener('focus',()=>{
  void checkLibraryOnDemand();
  void loadLiveNow({silent:true});
},{passive:true});
window.addEventListener('online',()=>{
  void checkLibraryOnDemand();
  void loadLiveNow({silent:true});
},{passive:true});

// LIVE is the only genuinely time-sensitive surface. Reading /live-now is a
// cheap snapshot read; the server owns discovery/FLV refresh. When the user is
// browsing saved videos we stop this timer too.
setInterval(()=>{
  if(document.hidden||mediaMode!=='live')return;
  void loadLiveNow({silent:true});
},LIVE_POLL_MS);
</script>
