<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PiP Simple Proof</title>
<style>
*{box-sizing:border-box}
:root{
  --top-boundary:56px;
  --bottom-gap:8px;
  --current-full-h:600px;
  --pip-landscape-w:240px;
  --pip-portrait-h:360px;
  --two-col-media-w:420px;
  --landscape-player-h:420px;
  --landscape-top-safe:56px;
  --landscape-bottom-safe:64px;
  --layout-gap:16px;
  --feed-cols:2;
  --card-target-w:310px;
  --floating-radius:10px;
}
html,body{margin:0;background:#0f0f0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
html.one-col,
html.one-col body{
  max-width:100%;
}
html.one-col body{min-height:220vh}
.top{
  position:sticky;top:0;z-index:50;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:#0f0f0f;border-bottom:1px solid #262626
}
.top strong{margin-right:auto;font-size:14px}
button{
  height:34px;padding:0 12px;border:1px solid #343434;border-radius:9px;
  background:#202020;color:#fff;font:inherit
}
button.active{background:#fff;color:#111;border-color:#fff}

main{width:100%;max-width:100%;margin:0}
.media-col{min-width:0;max-width:100%}
.stage{
  position:relative;
  margin:0 auto;
  background:#000;
  overflow:hidden;
}
.stage.pip-host{
  overflow:visible;
}
.player{
  position:absolute;
  overflow:hidden;
  background:#000;
}
.player iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}


/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
html.one-col .stage,
html.one-col .player,
html.one-col .player iframe{
  border-radius:0;
}

html.one-col.portrait .stage,
html.one-col.portrait .player,
html.one-col.portrait .player iframe,
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  background:transparent;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);
}

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  aspect-ratio:16/9;
  height:auto;
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  height:var(--current-full-h);
  width:min(100%,calc(var(--current-full-h) * 0.5625));
  aspect-ratio:9/16;
  background:transparent;
}
html.one-col.portrait .player{
  top:0;
  bottom:0;
  left:50%;
  width:calc(var(--current-full-h) * 0.5625);
  height:100%;
  transform:translateX(-50%);
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:1000;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:calc(var(--top-boundary) + 8px) !important;
  border-radius:var(--floating-radius);
  background:transparent;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w);
  height:auto;
  aspect-ratio:16/9;
}
html.one-col.portrait .player.pip{
  height:var(--pip-portrait-h);
  width:auto;
  aspect-ratio:9/16;
}
html.one-col .player.pip iframe{border-radius:inherit}

/* 2 COLUMNS */
@media(min-width:1000px){
  html.two-col,
  html.two-col body{
    overflow-x:clip;
    overscroll-behavior-y:none;
  }

  html.two-col main{
    width:100%;
    max-width:none;
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--two-col-media-w);
    grid-template-areas:"feed media";
    gap:var(--layout-gap);
    align-items:start;
    margin:0;
    padding:0 var(--layout-gap);
  }

  html.two-col .rows{
    grid-area:feed;
    min-width:0;
    padding:0;
    grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
    gap:var(--layout-gap);
  }

  html.two-col .media-col{
    grid-area:media;
    position:sticky;
    top:var(--top-boundary);
    align-self:start;
    height:var(--current-full-h);
    justify-self:end;
    min-width:0;
    margin-right:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     Column width is derived from CURRENT HEIGHT × 16/9 (capped only to preserve the feed). The iframe fills the current-height viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:var(--two-col-media-w);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:var(--landscape-player-h);
    border-radius:var(--floating-radius);
    background:#000;
    overflow:hidden;
  }
  html.two-col.landscape .player,
  html.two-col.landscape .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:#000;
  }

  /* 2-col portrait:
     Column width is derived from CURRENT HEIGHT × 9/16, so there is no wasted side space. */
  html.two-col.portrait .media-col{
    width:var(--two-col-media-w);
    height:var(--current-full-h);
  }
  html.two-col.portrait .stage{
    width:100%;
    height:100%;
    aspect-ratio:9/16;
    border-radius:var(--floating-radius);
    background:transparent;
    overflow:hidden;
  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;
  }
}
.info{padding:12px;border-bottom:1px solid #292929}
.info b{display:block;font-size:15px;margin-bottom:4px}
.info span{color:#999;font-size:12px}
.rows{
  padding:var(--layout-gap);
  display:grid;
  grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
  gap:var(--layout-gap);
}
.row{
  margin:0;
  min-width:0;
  background:transparent;
  overflow:hidden;
  color:#aaa;
}
.row-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:8px;
  background:#111;
}
.row-thumb img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.row-copy{
  min-width:0;
  padding:10px 0 4px;
}
.row-title{
  color:#fff;
  font-size:clamp(12px,2.7vw,14px);
  font-weight:600;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
}
.row-meta{
  margin-top:6px;
  color:#888;
  font-size:clamp(10px,2.3vw,12px);
  line-height:1.35
}
.state{
  position:fixed;left:8px;bottom:8px;z-index:150;
  padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.74);
  font-size:11px;color:#ddd
}
</style>
</head>
<body>
<header class="top" id="top">
  <strong>PiP proof · 1 player</strong>
  <button id="landscapeBtn" class="active">Ngang</button>
  <button id="portraitBtn">Dọc</button>
</header>

<main>
  <div class="media-col" id="mediaCol">
    <section class="stage" id="stage">
      <div class="player" id="player">
        <iframe id="videoFrame"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
    <div class="info">
      <b id="videoTitle">Video ngang · 16:9</b>
      <span id="layoutHint"></span>
    </div>
  </div>

  <div class="rows" id="rows"></div>
</main>

<div class="state" id="state"></div>

<script src="./src/api.js"></script>
<script src="./src/media-meta.js"></script>
<script>
(() => {
  const VIDEOS={
    landscape:{id:"ypLlRC_2EFc",ratio:16/9,label:"Video ngang · 16:9"},
    portrait:{id:"kUF9P2m9mrg",ratio:9/16,label:"Video dọc · 9:16"}
  };

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const frame=document.getElementById("videoFrame");
  const stateEl=document.getElementById("state");
  const titleEl=document.getElementById("videoTitle");
  const layoutHint=document.getElementById("layoutHint");
  const landscapeBtn=document.getElementById("landscapeBtn");
  const portraitBtn=document.getElementById("portraitBtn");

  let current=VIDEOS.landscape;
  let pip=false;
  let raf=0;
  let metaRequest=0;
  let currentMeta=null;
  const columnsMq=matchMedia("(min-width:1000px)");

  function embedUrl(id){
    return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }

  function isTwoColumn(){
    return columnsMq.matches;
  }

  function pageScrollY(){
    return Math.max(
      0,
      Number(document.scrollingElement?.scrollTop) || Number(window.scrollY) || 0
    );
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // YouTube source family: normal rich cards roughly 270..500px,
    // skeleton flex-basis around 310px. Pick a count near 310 without
    // allowing cards to drift outside the 270..500 band.
    const MIN=270;
    const TARGET=310;
    const MAX=500;

    const maxCols=Math.max(1,Math.floor((feedW+gap)/(MIN+gap)));
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(0,Math.round(top.getBoundingClientRect().bottom));
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const fullH=Math.max(1,viewportH-topBoundary-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP also follows its CURRENT available size:
    // landscape owns width, portrait owns height.
    const viewportW=Math.max(1,Math.round(document.documentElement.clientWidth || innerWidth || 1));
    const pipLandscapeW=Math.max(170,Math.min(280,Math.round(viewportW*.46)));
    const pipPortraitH=Math.max(240,Math.min(420,Math.round(fullH*.50)));

    root.style.setProperty("--pip-landscape-w",pipLandscapeW+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    // YOUTUBE-SOURCE GEOMETRY
    // - two-column threshold: 1000px
    // - horizontal page margin/gap: 16px
    // - sidebar width percentage buckets: 22.5 / 27.5 / 32.5
    // - sidebar min 320px, max 800px, never above 40%
    // - normal card family: 270..500px, target ~310px
    const pageW=viewportW;
    const gap=viewportW<480?8:(viewportW<1000?12:16);
    root.style.setProperty("--layout-gap",gap+"px");
    root.style.setProperty("--card-target-w","310px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(gap*2));
      const cols=chooseCardColumns(feedW,gap);
      root.style.setProperty("--feed-cols",String(cols));
    }else{
      const contentW=Math.max(1,pageW-(gap*2));

      // YouTube's variable sidebar-width buckets, applied to OUR left feed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));

      let mediaW;
      let landscapeChrome=null;

      if(current.ratio>1){
        // LANDSCAPE gets the remaining width after the source-sized feed.
        let widthCap=Math.max(1,contentW-gap-desiredFeedW);

        // Fit width to the current height after reserving source-derived
        // title/control safe zones.
        landscapeChrome=measureLandscapeChrome(widthCap);
        let safeBar=Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe);
        let heightDrivenW=Math.max(
          1,
          Math.round(Math.max(1,fullH-(safeBar*2))*current.ratio)
        );
        mediaW=Math.min(widthCap,heightDrivenW);

        // Re-measure after final width because title wrapping can change.
        landscapeChrome=measureLandscapeChrome(mediaW);
        const finalSafeBar=Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe);
        const videoH=mediaW/current.ratio;
        const playerH=Math.min(fullH,Math.ceil(videoH+(finalSafeBar*2)));

        root.style.setProperty("--landscape-player-h",playerH+"px");
        root.style.setProperty("--landscape-top-safe",landscapeChrome.topSafe+"px");
        root.style.setProperty("--landscape-bottom-safe",landscapeChrome.bottomSafe+"px");
      }else{
        // PORTRAIT stays height-driven. Never stretch it just to fill a column.
        mediaW=Math.min(
          Math.round(fullH*current.ratio),
          Math.max(1,contentW-gap-320)
        );
      }

      // Whatever media does not need is returned to the feed.
      const feedW=Math.max(1,contentW-gap-mediaW);
      const cols=chooseCardColumns(feedW,gap);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      root.style.setProperty("--feed-cols",String(cols));
    }
  }

  function dataRow(payload){
    const data=payload?.data ?? payload;
    if(!data)return {};
    if(Array.isArray(data))return data[0]||{};
    return (
      data.video ||
      data.videoDetails ||
      data.details ||
      data.info ||
      data.item ||
      data
    );
  }

  function renderSampleContent(){
    const rows=document.getElementById("rows");
    const meta=currentMeta || {};
    const title=meta.title || current.label;
    const source=meta.sourceName || "YouTube";
    const thumb=meta.thumbnail ||
      ("https://i.ytimg.com/vi/"+encodeURIComponent(current.id)+"/mqdefault.jpg");
    const ratio=current.ratio<1?"9:16":"16:9";
    const facts=[
      meta.durationLabel,
      meta.viewsLabel,
      meta.publishedLabel
    ].filter(Boolean).join(" · ");

    const card=
      '<article class="row">'+
        '<div class="row-thumb"><img src="'+thumb+'" alt=""></div>'+
        '<div class="row-copy">'+
          '<div class="row-title">'+title+'</div>'+
          '<div class="row-meta">'+source+'</div>'+
          '<div class="row-meta">'+(facts || (ratio+' · '+current.id))+'</div>'+
        '</div>'+
      '</article>';

    rows.innerHTML=card.repeat(6);
  }

  async function loadCurrentVideoMeta(){
    const request=++metaRequest;
    currentMeta=null;
    renderSampleContent();

    try{
      if(!window.YT1988_API?.video || !window.MediaMeta?.video){
        throw new Error("app data helpers unavailable");
      }

      // Same app data source as the real site; no YouTube/oEmbed side request.
      const payload=await window.YT1988_API.video(current.id);
      if(request!==metaRequest)return;

      const row=dataRow(payload);
      currentMeta=window.MediaMeta.video(row);

      // Preserve the requested/current ID even if an upstream row is sparse.
      if(!currentMeta.id)currentMeta={...currentMeta,id:current.id};

      titleEl.textContent=currentMeta.title || current.label;
      renderSampleContent();
      syncBoundaries();
    }catch(_){
      if(request!==metaRequest)return;
      currentMeta=null;
      titleEl.textContent=current.label;
      renderSampleContent();
    }
  }

  function layout(){
    syncBoundaries();
    const two=isTwoColumn();
    const portrait=current.ratio<1;

    root.classList.toggle("one-col",!two);
    root.classList.toggle("two-col",two);
    root.classList.toggle("portrait",portrait);
    root.classList.toggle("landscape",!portrait);

    /* CSS owns all geometry:
       landscape follows width, portrait follows height. */

    if(two){
      pip=false;
      player.classList.remove("pip");
      stage.classList.remove("pip-host");
    }

    paintText();
  }
  function paintText(){
    titleEl.textContent=currentMeta?.title || current.label;
    if(isTwoColumn()){
      layoutHint.textContent=current.ratio<1
        ?"2 cột · dọc full, không đen."
        :"2 cột · ngang: đen tối thiểu theo title / tua.";
      stateEl.textContent="2 CỘT · MAIN · "+(current.ratio<1?"9:16":"16:9");
    }else{
      layoutHint.textContent=current.ratio<1
        ?"1 cột · MAIN dọc full, không đen."
        :"1 cột · MAIN ngang full, không đen.";
      stateEl.textContent="1 CỘT · "+(pip?"PIP":"MAIN")+" · "+(current.ratio<1?"9:16":"16:9");
    }
  }

  function syncPip(){
    if(isTwoColumn()){
      if(pip){
        pip=false;
        player.classList.remove("pip");
        paintText();
      }
      return;
    }

    /* Simple rule:
       stage is always the original MAIN media box and stays in document flow.
       When its real bottom passes the header -> PiP.
       Because stage never becomes fixed, this remains stable after PiP opens. */
    const shouldPip=
      pageScrollY()>0 &&
      stage.getBoundingClientRect().bottom<=top.getBoundingClientRect().bottom+1;

    if(shouldPip===pip)return;

    pip=shouldPip;
    player.classList.toggle("pip",pip);
    stage.classList.toggle("pip-host",pip);
    paintText();
  }

  function schedulePip(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      syncPip();
    });
  }

  function select(kind){
    current=VIDEOS[kind];
    pip=false;
    player.classList.remove("pip");
    stage.classList.remove("pip-host");
    landscapeBtn.classList.toggle("active",kind==="landscape");
    portraitBtn.classList.toggle("active",kind==="portrait");
    frame.src=embedUrl(current.id);
    layout();
    loadCurrentVideoMeta();
    schedulePip();
  }

  landscapeBtn.addEventListener("click",()=>select("landscape"));
  portraitBtn.addEventListener("click",()=>select("portrait"));
  addEventListener("scroll",schedulePip,{passive:true});

  /* Breakpoint has exactly one owner: the same media query used by CSS. */
  columnsMq.addEventListener?.("change",()=>{
    layout();
    schedulePip();
  });

  /* Resize refreshes geometry, but never enter a scrollbar feedback loop. */
  let lastViewportW=document.documentElement.clientWidth||innerWidth||0;
  addEventListener("resize",()=>{
    const nextW=document.documentElement.clientWidth||innerWidth||0;
    const widthChanged=Math.abs(nextW-lastViewportW)>1;
    lastViewportW=nextW;

    if(widthChanged || document.documentElement.scrollWidth<=nextW+1){
      syncBoundaries();
    }
    schedulePip();
  },{passive:true});

  /* If title/search/source chrome changes height, every media mode receives
     the same new TOP without separate mode-specific calculations. */
  new ResizeObserver(()=>{
    syncBoundaries();
    schedulePip();
  }).observe(top);

  select("landscape");
})();
</script>
</body>
</html>
