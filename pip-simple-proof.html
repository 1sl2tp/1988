<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PiP Simple Proof</title>
<style>
*{box-sizing:border-box}
:root{
  --yt-bg:#0f0f0f;
  --yt-surface:#212121;
  --yt-surface-2:#272727;
  --yt-border:#303030;
  --yt-divider:#292929;
  --yt-text:#f1f1f1;
  --yt-text-secondary:#aaa;
  --yt-hover:rgba(255,255,255,.10);
  --yt-press:rgba(255,255,255,.18);
  --top-boundary:56px;
  --bottom-gap:8px;
  --current-full-h:600px;
  --pip-landscape-w:240px;
  --pip-portrait-h:360px;
  --two-col-media-w:420px;
  --landscape-player-h:420px;
  --landscape-top-safe:56px;
  --landscape-bottom-safe:64px;
  --layout-gap:16px;
  --content-top-gap:12px;
  --feed-cols:2;
  --card-target-w:310px;
  --floating-radius:10px;
}
html,body{
  margin:0;
  background:var(--yt-bg);
  color:var(--yt-text);
  font-family:Roboto,"Arial",sans-serif;
}
html{
  overflow-y:scroll;
  scrollbar-color:hsl(0 0% 67%) transparent;
}
body{
  min-height:100vh;
  overflow-y:visible;
}
html::-webkit-scrollbar{
  width:16px;
}
html::-webkit-scrollbar-track{
  background:transparent;
}
html::-webkit-scrollbar-thumb{
  min-height:56px;
  border:4px solid transparent;
  border-radius:8px;
  background-clip:content-box;
  background-color:hsl(0 0% 67%);
}
html::-webkit-scrollbar-thumb:hover{
  background-color:#bdbdbd;
  background-clip:content-box;
}
html::-webkit-scrollbar-corner{
  background:transparent;
}
html.one-col,
html.one-col body{
  max-width:100%;
}
html.one-col body{min-height:220vh}
.top{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--yt-bg);
  border-bottom:0;
  transform:translateY(0);
  transition:transform .20s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.masthead{
  height:56px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
}
.brand{
  flex:0 0 auto;
  width:97px;
  height:40px;
  display:flex;
  align-items:center;
  gap:5px;
  color:#fff;
  text-decoration:none;
  user-select:none;
}
.brand-mark{
  width:29px;
  height:20px;
  display:block;
  flex:0 0 29px;
}
.brand-mark svg{
  display:block;
  width:29px;
  height:20px;
}
.brand-name{
  /* YouTube wordmark itself is SVG 93×20; custom 1988 matches its ~18px visual height. */
  font:700 18px/20px "Arial Narrow",Roboto,Arial,sans-serif;
  letter-spacing:-.55px;
  transform:scaleX(.94);
  transform-origin:left center;
}
.searchbox{
  width:min(640px,52vw);
  height:40px;
  margin-left:auto;
  display:flex;
  min-width:0;
}
.search-input{
  min-width:0;
  flex:1 1 auto;
  height:40px;
  padding:0 16px;
  border:1px solid var(--yt-border);
  border-right:0;
  border-radius:20px 0 0 20px;
  outline:0;
  background:#121212;
  color:var(--yt-text);
  font:400 16px/24px Roboto,Noto,Arial,sans-serif;
}
.search-input::placeholder{color:#888}
.search-input:focus{
  border-color:#1c62b9;
  box-shadow:inset 1px 0 0 #1c62b9;
}
.search-button,
.icon-button{
  width:40px;
  height:40px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  color:var(--yt-text);
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.search-button{
  width:64px;
  border:1px solid #303030;
  border-radius:0 20px 20px 0;
  background:var(--yt-surface);
}
.search-button svg,
.icon-button svg{
  width:24px;
  height:24px;
  fill:currentColor;
}
.icon-button:hover{background:var(--yt-hover)}
.icon-button:active{background:var(--yt-press)}
.sourcebar{
  position:relative;
  width:100%;
  height:56px;
  background:var(--yt-bg);
  overflow:hidden;
}
.source-scroll{
  position:relative;
  width:100%;
  height:56px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.source-scroll::-webkit-scrollbar{display:none}
.source-chips{
  min-width:max-content;
  height:56px;
  display:flex;
  align-items:center;
  gap:0;
  white-space:nowrap;
  padding:0;
}
.source-name-chips{display:contents}
.source-chip{
  flex:0 0 auto;
  position:relative;
  height:32px;
  min-width:12px;
  margin:12px 12px 12px 0;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.10);
  color:#f1f1f1;
  font-family:Roboto,"Arial",sans-serif;
  font-size:14px;
  line-height:20px;
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s cubic-bezier(.05,0,0,1);
}
.source-chip:first-child{margin-left:24px}
.source-chip:last-of-type{margin-right:0}
.source-name-chips .source-chip:last-child{margin-right:0}
.source-chip:hover{background:rgba(255,255,255,.20)}
.source-chip:active{background:rgba(255,255,255,.15)}
.source-chip.active{
  background:#f1f1f1;
  color:#0f0f0f;
}
.source-arrow{
  position:absolute;
  top:0;
  bottom:0;
  z-index:4;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.source-arrow[hidden]{display:none}
.source-arrow.left{left:0}
.source-arrow.right{right:0}
.source-arrow::after,
.source-arrow::before{
  content:"";
  position:absolute;
  top:0;
  width:50px;
  height:100%;
  pointer-events:none;
}
.source-arrow.left::after{
  left:32px;
  background:linear-gradient(to right,var(--yt-bg) 20%,rgba(33,33,33,0) 80%);
}
.source-arrow.right::before{
  right:32px;
  background:linear-gradient(to left,var(--yt-bg) 20%,rgba(33,33,33,0) 80%);
}
.source-arrow-button{
  position:relative;
  z-index:2;
  width:32px;
  height:32px;
  margin:0 12px;
  padding:0;
  border:0;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:var(--yt-bg);
  color:#f1f1f1;
  pointer-events:auto;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.source-arrow-button:hover{background:#272727}
.source-arrow-button svg{
  width:24px;
  height:24px;
  fill:currentColor;
}
.search-toggle,
.search-back{
  display:none;
}

@media(max-width:656px){
  .masthead{
    height:56px;
    padding:0 12px;
    gap:8px;
  }
  .brand{
    width:auto;
    height:40px;
    flex:0 0 auto;
  }
  .brand-name{font-size:18px}

  /* Source-like narrow masthead: compact icon first; search expands only when opened. */
  .searchbox{display:none}
  .search-toggle{
    display:grid;
    width:40px;
    height:40px;
    margin-left:auto;
  }
  .search-back{display:none}
  .search-input{padding:0 12px;font-size:16px;line-height:24px}
  .search-button{width:48px}
  .sourcebar{height:56px}

  .top.mobile-scroll-hidden:not(.search-open){
    transform:translateY(-100%);
    pointer-events:none;
  }

  .top.search-open .brand,
  .top.search-open .search-toggle,
  .top.search-open .masthead > .icon-button:not(.search-back):not(.search-toggle){
    display:none;
  }
  .top.search-open .search-back{
    display:grid;
    flex:0 0 40px;
  }
  .top.search-open .searchbox{
    display:flex;
    width:auto;
    flex:1 1 auto;
    margin:0;
  }
}

@media(min-width:657px){
  .top{
    transform:none!important;
    pointer-events:auto!important;
  }
  .searchbox{display:flex}
}

main{
  width:100%;
  max-width:100%;
  margin:0;
  padding-top:var(--content-top-gap);
}
.media-col{min-width:0;max-width:100%}
.stage{
  position:relative;
  margin:0 auto;
  background:#000;
  overflow:hidden;
}
.stage.pip-host{
  overflow:visible;
}
.player{
  position:absolute;
  overflow:hidden;
  background:#000;
}
.player iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}


/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
html.one-col .stage,
html.one-col .player,
html.one-col .player iframe{
  border-radius:0;
}

html.one-col.portrait .stage,
html.one-col.portrait .player,
html.one-col.portrait .player iframe,
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  background:transparent;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);
}

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  aspect-ratio:16/9;
  height:auto;
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  height:var(--current-full-h);
  width:min(100%,calc(var(--current-full-h) * 0.5625));
  aspect-ratio:9/16;
  background:transparent;
}
html.one-col.portrait .player{
  top:0;
  bottom:0;
  left:50%;
  width:calc(var(--current-full-h) * 0.5625);
  height:100%;
  transform:translateX(-50%);
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:1000;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:calc(var(--visible-top-boundary,var(--top-boundary)) + 8px) !important;
  border-radius:var(--floating-radius);
  background:transparent;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w);
  height:auto;
  aspect-ratio:16/9;
}
html.one-col.portrait .player.pip{
  height:var(--pip-portrait-h);
  width:auto;
  aspect-ratio:9/16;
}
html.one-col .player.pip iframe{border-radius:inherit}

/* 2 COLUMNS */
@media(min-width:1000px){
  html.two-col,
  html.two-col body{
    overflow-x:clip;
    overscroll-behavior-y:none;
  }

  html.two-col main{
    width:100%;
    max-width:none;
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--two-col-media-w);
    grid-template-areas:"feed media";
    gap:var(--layout-gap);
    align-items:start;
    margin:0;
    padding:0 var(--layout-gap);
  }

  html.two-col .rows{
    grid-area:feed;
    min-width:0;
    padding:0;
    grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
    gap:var(--layout-gap);
  }

  html.two-col .media-col{
    grid-area:media;
    position:sticky;
    top:calc(var(--top-boundary) + var(--content-top-gap));
    align-self:start;
    height:var(--current-full-h);
    justify-self:end;
    min-width:0;
    margin-right:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     Column width is derived from CURRENT HEIGHT × 16/9 (capped only to preserve the feed). The iframe fills the current-height viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:var(--two-col-media-w);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:var(--landscape-player-h);
    border-radius:var(--floating-radius);
    background:#000;
    overflow:hidden;
  }
  html.two-col.landscape .player,
  html.two-col.landscape .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:#000;
  }

  /* 2-col portrait:
     Column width is derived from CURRENT HEIGHT × 9/16, so there is no wasted side space. */
  html.two-col.portrait .media-col{
    width:var(--two-col-media-w);
    height:var(--current-full-h);
  }
  html.two-col.portrait .stage{
    width:100%;
    height:100%;
    aspect-ratio:9/16;
    border-radius:var(--floating-radius);
    background:transparent;
    overflow:hidden;
  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;
  }
}
.info{
  padding:12px 16px 16px;
  border-bottom:1px solid #292929;
}
.info b{
  display:block;
  color:var(--yt-text);
  font:700 20px/28px Roboto,"Arial",sans-serif;
  margin:0;
}
.info span{
  display:block;
  margin-top:4px;
  color:#aaa;
  font:400 12px/18px Roboto,Noto,Arial,sans-serif;
}
@media(max-width:527.9px){
  .info b{font-size:18px;line-height:26px}
}
@media(max-width:656px){
  .info{padding:12px 12px 16px}
}
.rows{
  padding:0 var(--layout-gap);
  display:grid;
  grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
  gap:var(--layout-gap);
}
.row{
  position:relative;
  margin:0;
  padding-bottom:24px;
  min-width:0;
  background:transparent;
  overflow:visible;
  color:#aaa;
  cursor:pointer;
  border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.row::before{
  content:"";
  position:absolute;
  inset:-12px;
  z-index:-1;
  border-radius:16px;
  background:transparent;
  transition:background-color .12s cubic-bezier(.4,0,1,1),transform .12s ease;
}
@media(hover:hover){
  .row:hover::before{background:rgba(255,255,255,.08)}
}
.row:active::before{
  background:rgba(255,255,255,.14);
  transform:scale(.985);
}
.row.selected::before{background:var(--yt-hover)}
.row-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:8px;
  background:#111;
}
.row-thumb img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .18s cubic-bezier(.2,0,0,1);
}
@media(hover:hover){
  .row:hover .row-thumb img{transform:scale(1.015)}
}
.duration-badge{
  position:absolute;
  right:4px;
  bottom:4px;
  min-height:18px;
  display:flex;
  align-items:center;
  padding:1px 4px;
  border-radius:4px;
  background:rgba(0,0,0,.80);
  color:#fff;
  font:500 12px/16px Roboto,Arial,sans-serif;
}
.duration-badge.live{
  background:#f00;
  font-weight:600;
}
.row-details{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 40px;
  gap:12px;
  align-items:start;
  padding:12px 0 0;
}
.row-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:#272727;
}
.row-avatar.placeholder{
  display:grid;
  place-items:center;
  color:#aaa;
  font:600 13px/36px Roboto,Arial,sans-serif;
  text-align:center;
}
.row-copy{min-width:0;padding:0}
.row-title{
  color:var(--yt-text);
  font:500 16px/22px Roboto,"Arial",sans-serif;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.row-meta{
  margin-top:2px;
  color:var(--yt-text-secondary);
  font:400 14px/20px Roboto,"Arial",sans-serif;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.row-meta:empty{display:none}
.row-menu{
  width:40px;
  height:40px;
  margin-top:-8px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#f1f1f1;
  opacity:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row-menu svg{width:24px;height:24px;fill:currentColor}
.row-menu:hover{background:var(--yt-hover)}
.row-menu:active{background:var(--yt-press)}
.row:hover .row-menu,
.row:focus-within .row-menu{opacity:1}
@media(hover:none){
  .row-menu{opacity:1}
}

.state{
  position:fixed;left:8px;bottom:8px;z-index:150;
  padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.74);
  font-size:11px;color:#ddd
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="masthead">
    <a class="brand" href="#" aria-label="1988">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 29 20" focusable="false">
          <path d="M14.4848 20C14.4848 20 23.5695 20 25.8229 19.4C27.0917 19.06 28.0459 18.08 28.3808 16.87C29 14.65 29 9.98 29 9.98C29 9.98 29 5.34 28.3808 3.14C28.0459 1.9 27.0917 0.94 25.8229 0.61C23.5695 0 14.4848 0 14.4848 0C14.4848 0 5.42037 0 3.17711 0.61C1.9286 0.94 0.954148 1.9 0.59888 3.14C0 5.34 0 9.98 0 9.98C0 9.98 0 14.65 0.59888 16.87C0.954148 18.08 1.9286 19.06 3.17711 19.4C5.42037 20 14.4848 20 14.4848 20Z" fill="#FF0033"></path>
          <path d="M19 10L11.5 5.75V14.25L19 10Z" fill="#fff"></path>
        </svg>
      </span>
      <span class="brand-name">1988</span>
    </a>

    <button id="searchBack" class="icon-button search-back" aria-label="Quay lại" title="Quay lại">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.707 5.293a1 1 0 010 1.414L9.414 12l5.293 5.293a1 1 0 01-1.414 1.414l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 0Z"></path></svg>
    </button>

    <div class="searchbox" role="search">
      <input id="searchInput" class="search-input" type="search" placeholder="Tìm kiếm"
        autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="searchButton" class="search-button" aria-label="Tìm kiếm" title="Tìm kiếm">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2a9 9 0 105.641 16.01.966.966 0 00.152.197l3.5 3.5a1 1 0 101.414-1.414l-3.5-3.5a1 1 0 00-.197-.153A8.96 8.96 0 0020 11a9 9 0 00-9-9Zm0 2a7 7 0 110 14 7 7 0 010-14Z"></path></svg>
      </button>
    </div>

    <button id="searchToggle" class="icon-button search-toggle" aria-label="Tìm kiếm" title="Tìm kiếm">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2a9 9 0 105.641 16.01.966.966 0 00.152.197l3.5 3.5a1 1 0 101.414-1.414l-3.5-3.5a1 1 0 00-.197-.153A8.96 8.96 0 0020 11a9 9 0 00-9-9Zm0 2a7 7 0 110 14 7 7 0 010-14Z"></path></svg>
    </button>

    <button class="icon-button" aria-label="Thêm" title="Thêm">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5a1 1 0 112 0v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H5a1 1 0 110-2h6V5Z"></path></svg>
    </button>
  </div>

  <div class="sourcebar" id="sourcebar">
    <div class="source-arrow left" id="sourcePrev" hidden>
      <button class="source-arrow-button" type="button" aria-label="Trước">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.71 5.29a1 1 0 0 1 0 1.42L9.41 12l5.3 5.29a1 1 0 1 1-1.42 1.42l-6-6a1 1 0 0 1 0-1.42l6-6a1 1 0 0 1 1.42 0Z"/></svg>
      </button>
    </div>
    <div class="source-scroll" id="sourceScroll">
      <div class="source-chips" id="sourceChips">
        <button class="source-chip active" data-filter="all">Tất cả</button>
        <span class="source-name-chips" id="sourceNameChips"></span>
        <button id="landscapeBtn" class="source-chip proof-mode-switch active" hidden>Ngang</button>
        <button id="portraitBtn" class="source-chip proof-mode-switch" hidden>Dọc</button>
      </div>
    </div>
    <div class="source-arrow right" id="sourceNext" hidden>
      <button class="source-arrow-button" type="button" aria-label="Tiếp theo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.29 5.29a1 1 0 0 0 0 1.42l5.3 5.29-5.3 5.29a1 1 0 1 0 1.42 1.42l6-6a1 1 0 0 0 0-1.42l-6-6a1 1 0 0 0-1.42 0Z"/></svg>
      </button>
    </div>
  </div>
</header>

  <div class="media-col" id="mediaCol">

          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"

</main>

<div class="state" id="state"></div>

<script src="./src/api.js"></script>
<script src="./src/media-meta.js"></script>
<script>
(() => {
  const VIDEOS={
    landscape:{id:"ypLlRC_2EFc",ratio:16/9,label:"Video ngang · 16:9"},
    portrait:{id:"kUF9P2m9mrg",ratio:9/16,label:"Video dọc · 9:16"}
  };
  const SOURCE_STATE_URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-state";

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const frame=document.getElementById("videoFrame");
  const stateEl=document.getElementById("state");
  const titleEl=document.getElementById("videoTitle");
  const layoutHint=document.getElementById("layoutHint");
  const landscapeBtn=document.getElementById("landscapeBtn");
  const portraitBtn=document.getElementById("portraitBtn");
  const searchInput=document.getElementById("searchInput");
  const searchButton=document.getElementById("searchButton");
  const searchToggle=document.getElementById("searchToggle");
  const searchBack=document.getElementById("searchBack");
  const sourcebar=document.getElementById("sourcebar");
  const sourceScroll=document.getElementById("sourceScroll");
  const sourceChips=document.getElementById("sourceChips");
  const sourcePrev=document.getElementById("sourcePrev");
  const sourceNext=document.getElementById("sourceNext");
  const sourceNameChips=document.getElementById("sourceNameChips");

  let current=VIDEOS.landscape;
  let pip=false;
  let raf=0;
  let metaRequest=0;
  let currentMeta=null;
  let feedMetas=[];
  let relatedMetas=[];
  let feedRequest=0;
  let feedMode="related";
  const columnsMq=matchMedia("(min-width:1000px)");
  const mobileHeaderMq=matchMedia("(max-width:656px)");
  let mobileHeaderLastY=0;
  let mobileHeaderHidden=false;

  function embedUrl(id){
    return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }

  function isTwoColumn(){
    return columnsMq.matches;
  }

  function pageScrollY(){
    return Math.max(
      0,
      Number(document.scrollingElement?.scrollTop) || Number(window.scrollY) || 0
    );
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // YouTube source family: normal rich cards roughly 270..500px,
    // skeleton flex-basis around 310px. Pick a count near 310 without
    // allowing cards to drift outside the 270..500 band.
    const MIN=270;
    const TARGET=310;
    const MAX=500;

    const maxCols=Math.max(1,Math.floor((feedW+gap)/(MIN+gap)));
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(
      0,
      Math.round(top.offsetHeight || top.getBoundingClientRect().height || 0)
    );
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const contentTopGap=12;
    const fullH=Math.max(1,viewportH-topBoundary-contentTopGap-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    if(!root.style.getPropertyValue("--visible-top-boundary")){
      root.style.setProperty("--visible-top-boundary",topBoundary+"px");
    }
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP also follows its CURRENT available size:
    // landscape owns width, portrait owns height.
    const viewportW=Math.max(1,Math.round(document.documentElement.clientWidth || innerWidth || 1));
    const pipLandscapeW=Math.max(170,Math.min(280,Math.round(viewportW*.46)));
    const pipPortraitH=Math.max(240,Math.min(420,Math.round(fullH*.50)));

    root.style.setProperty("--pip-landscape-w",pipLandscapeW+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    // YOUTUBE-SOURCE GEOMETRY
    // - two-column threshold: 1000px
    // - horizontal page margin/gap: 16px
    // - sidebar width percentage buckets: 22.5 / 27.5 / 32.5
    // - sidebar min 320px, max 800px, never above 40%
    // - normal card family: 270..500px, target ~310px
    const pageW=viewportW;
    const gap=viewportW<480?8:(viewportW<1000?12:16);
    root.style.setProperty("--layout-gap",gap+"px");
    root.style.setProperty("--card-target-w","310px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(gap*2));
      const cols=chooseCardColumns(feedW,gap);
      root.style.setProperty("--feed-cols",String(cols));
    }else{
      const contentW=Math.max(1,pageW-(gap*2));

      // YouTube's variable sidebar-width buckets, applied to OUR left feed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));

      let mediaW;
      let landscapeChrome=null;

      if(current.ratio>1){
        // LANDSCAPE gets the remaining width after the source-sized feed.
        let widthCap=Math.max(1,contentW-gap-desiredFeedW);

        // Fit width to the current height after reserving source-derived
        // title/control safe zones.
        landscapeChrome=measureLandscapeChrome(widthCap);
        let safeBar=Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe);
        let heightDrivenW=Math.max(
          1,
          Math.round(Math.max(1,fullH-(safeBar*2))*current.ratio)
        );
        mediaW=Math.min(widthCap,heightDrivenW);

        // Re-measure after final width because title wrapping can change.
        landscapeChrome=measureLandscapeChrome(mediaW);
        const finalSafeBar=Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe);
        const videoH=mediaW/current.ratio;
        const playerH=Math.min(fullH,Math.ceil(videoH+(finalSafeBar*2)));

        root.style.setProperty("--landscape-player-h",playerH+"px");
        root.style.setProperty("--landscape-top-safe",landscapeChrome.topSafe+"px");
        root.style.setProperty("--landscape-bottom-safe",landscapeChrome.bottomSafe+"px");
      }else{
        // PORTRAIT stays height-driven. Never stretch it just to fill a column.
        mediaW=Math.min(
          Math.round(fullH*current.ratio),
          Math.max(1,contentW-gap-320)
        );
      }

      // Whatever media does not need is returned to the feed.
      const feedW=Math.max(1,contentW-gap-mediaW);
      const cols=chooseCardColumns(feedW,gap);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      root.style.setProperty("--feed-cols",String(cols));
    }
  }

  function dataRow(payload){
    const data=payload?.data ?? payload;
    if(!data)return {};
    if(Array.isArray(data))return data[0]||{};
    return (
      data.video ||
      data.videoDetails ||
      data.details ||
      data.info ||
      data.item ||
      data
    );
  }

  function escapeHtml(value=""){
    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    return {
      ...meta,
      verified:cardVerified(row)
    };
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function avatarMarkup(meta){
    const avatar=meta.sourceAvatar || "";
    if(avatar){
      return '<img class="row-avatar" src="'+escapeHtml(avatar)+'" alt="">';
    }
    const letter=(meta.sourceName||"1988").trim().slice(0,1).toUpperCase() || "1";
    return '<span class="row-avatar placeholder">'+escapeHtml(letter)+'</span>';
  }

  function cardMarkup(meta){
    const id=meta.id || current.id;
    const title=meta.title || current.label;
    const source=meta.sourceName || "1988";
    const thumb=meta.thumbnail ||
      ("https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/mqdefault.jpg");

    const duration=meta.isLive ? "TRỰC TIẾP" : (meta.durationLabel || "");
    const badgeClass=meta.isLive ? "duration-badge live" : "duration-badge";
    const facts=[meta.viewsLabel,meta.publishedLabel].filter(Boolean).join(" • ");
    const verified=meta.verified
      ? '<span aria-label="Đã xác minh" title="Đã xác minh"> ✓</span>'
      : "";

    return (
      '<article class="row" tabindex="0" data-video-id="'+escapeHtml(id)+'" data-title="'+escapeHtml(title.toLowerCase())+'" data-source="'+escapeHtml(source.toLowerCase())+'">'+
        '<div class="row-thumb">'+
          '<img src="'+escapeHtml(thumb)+'" alt="">'+
          (duration?'<span class="'+badgeClass+'">'+escapeHtml(duration)+'</span>':"")+
        '</div>'+
        '<div class="row-details">'+
          avatarMarkup(meta)+
          '<div class="row-copy">'+
            '<div class="row-title">'+escapeHtml(title)+'</div>'+
            '<div class="row-meta">'+escapeHtml(source)+verified+'</div>'+
            '<div class="row-meta">'+escapeHtml(facts)+'</div>'+
          '</div>'+
          '<button class="row-menu" aria-label="Thao tác khác" title="Thao tác khác">'+
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Zm0 6a2 2 0 100 4 2 2 0 000-4Z"></path></svg>'+
          '</button>'+
        '</div>'+
      '</article>'
    );
  }

  function parseSourceOrder(labels={}){
    try{
      const raw=labels?.__source_order;
      const parsed=Array.isArray(raw)?raw:JSON.parse(String(raw||"[]"));
      return Array.isArray(parsed)?parsed.map(String).filter(Boolean):[];
    }catch{
      return [];
    }
  }

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

  function renderExistingSourceNames(rows=[]){
    if(!sourceNameChips)return;
    sourceNameChips.innerHTML=(Array.isArray(rows)?rows:[]).map(row=>
      '<button class="source-chip" data-source-tab="'+escapeHtml(row.key)+'">'+
        escapeHtml(row.label)+
      '</button>'
    ).join("");
    requestAnimationFrame(updateSourceRailArrows);
  }

  function updateSourceRailArrows(){
    if(!sourceScroll||!sourcePrev||!sourceNext)return;
    const max=Math.max(0,sourceScroll.scrollWidth-sourceScroll.clientWidth);
    const left=Math.max(0,sourceScroll.scrollLeft);
    sourcePrev.hidden=left<=2;
    sourceNext.hidden=max<=2||left>=max-2;
  }

  function moveSourceRail(direction){
    if(!sourceScroll)return;
    const step=Math.max(180,Math.min(360,Math.round(sourceScroll.clientWidth*.55)));
    sourceScroll.scrollBy({left:direction*step,behavior:"smooth"});
  }

  sourcePrev?.addEventListener("click",()=>moveSourceRail(-1));
  sourceNext?.addEventListener("click",()=>moveSourceRail(1));
  sourceScroll?.addEventListener("scroll",updateSourceRailArrows,{passive:true});

  async function loadExistingSourceNames(){
    // Start with the three canonical tabs immediately, then replace with the
    // real saved labels/hashtags from the same server state used by the app.
    renderExistingSourceNames([
      {key:"live",label:"Live"},
      {key:"latest",label:"Ngày"},
      {key:"week",label:"Tuần"}
    ]);

    try{
      const response=await fetch(SOURCE_STATE_URL,{cache:"no-store"});
      if(!response.ok)throw new Error("source_state_"+response.status);
      const payload=await response.json();
      const remote=payload?.state&&typeof payload.state==="object"?payload.state:{};
      const rows=existingSourceTabNames(remote);
      if(rows.length)renderExistingSourceNames(rows);
    }catch(_){
      // Keep the canonical names already rendered.
    }
  }

  function renderSampleContent(){
    const rows=document.getElementById("rows");
    const meta=currentMeta || {};
    const cards=feedMetas.length
      ? feedMetas
      : [meta.id?meta:{...meta,id:current.id,title:current.label}];

    rows.innerHTML=cards.slice(0,18).map(cardMarkup).join("");
    applySearchFilter();
  }

  function applySearchFilter(){
    const q=(searchInput?.value||"").trim().toLowerCase();
    document.querySelectorAll(".row").forEach(card=>{
      const hay=(card.dataset.title||"")+" "+(card.dataset.source||"");
      card.hidden=!!q && !hay.includes(q);
    });
  }

  async function runSearch(){
    const q=(searchInput?.value||"").trim();
    if(!q){
      feedMode=relatedMetas.length?"related":"home";
      if(relatedMetas.length)feedMetas=relatedMetas;
      renderSampleContent();
      return;
    }

    const request=++feedRequest;
    try{
      if(!window.YT1988_API?.search)return;
      const payload=await window.YT1988_API.search(q,"videos");
      if(request!==feedRequest)return;

      const next=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.title)
        .slice(0,18);

      if(next.length){
        feedMode="search";
        feedMetas=next;
        renderSampleContent();
      }
    }catch(_){}
  }

  async function loadFeedData(){
    const request=++feedRequest;
    try{
      if(!window.YT1988_API?.home || !window.MediaMeta?.video)return;
      const payload=await window.YT1988_API.home();
      if(request!==feedRequest)return;

      const next=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.title)
        .slice(0,18);

      if(next.length && !feedMetas.length){
        feedMode="home";
        feedMetas=next;
        renderSampleContent();
      }
    }catch(_){
      // Current-video card remains as a truthful fallback.
    }
  }

  async function loadCurrentVideoMeta(){
    const request=++metaRequest;
    currentMeta=null;
    renderSampleContent();

    try{
      if(!window.YT1988_API?.video || !window.MediaMeta?.video){
        throw new Error("app data helpers unavailable");
      }

      // Same app data source as the real site; no YouTube/oEmbed side request.
      const payload=await window.YT1988_API.video(current.id);
      if(request!==metaRequest)return;

      const row=dataRow(payload);
      currentMeta=cardMetaFromRow(row);

      const related=collectVideoRows(payload)
        .filter(meta=>meta.id && meta.id!==current.id)
        .slice(0,18);
      if(related.length){
        relatedMetas=related;
        if(feedMode!=="search"){
          feedMode="related";
          feedMetas=relatedMetas;
        }
      }

      // Preserve the requested/current ID even if an upstream row is sparse.
      if(!currentMeta.id)currentMeta={...currentMeta,id:current.id};

      titleEl.textContent=currentMeta.title || current.label;
      renderSampleContent();
      syncBoundaries();
    }catch(_){
      if(request!==metaRequest)return;
      currentMeta=null;
      titleEl.textContent=current.label;
      renderSampleContent();
    }
  }

  function layout(){
    syncBoundaries();
    const two=isTwoColumn();
    const portrait=current.ratio<1;

    root.classList.toggle("one-col",!two);
    root.classList.toggle("two-col",two);
    root.classList.toggle("portrait",portrait);
    root.classList.toggle("landscape",!portrait);

    /* CSS owns all geometry:
       landscape follows width, portrait follows height. */

    if(two){
      pip=false;
      player.classList.remove("pip");
      stage.classList.remove("pip-host");
    }

    paintText();
  }
  function paintText(){
    titleEl.textContent=currentMeta?.title || current.label;
    if(isTwoColumn()){
      layoutHint.textContent=current.ratio<1
        ?"2 cột · dọc full, không đen."
        :"2 cột · ngang: đen tối thiểu theo title / tua.";
      stateEl.textContent="2 CỘT · MAIN · "+(current.ratio<1?"9:16":"16:9");
    }else{
      layoutHint.textContent=current.ratio<1
        ?"1 cột · MAIN dọc full, không đen."
        :"1 cột · MAIN ngang full, không đen.";
      stateEl.textContent="1 CỘT · "+(pip?"PIP":"MAIN")+" · "+(current.ratio<1?"9:16":"16:9");
    }
  }

  function syncPip(){
    if(isTwoColumn()){
      if(pip){
        pip=false;
        player.classList.remove("pip");
        paintText();
      }
      return;
    }

    /* Simple rule:
       stage is always the original MAIN media box and stays in document flow.
       When its real bottom passes the header -> PiP.
       Because stage never becomes fixed, this remains stable after PiP opens. */
    const shouldPip=
      pageScrollY()>0 &&
      stage.getBoundingClientRect().bottom<=top.getBoundingClientRect().bottom+1;

    if(shouldPip===pip)return;

    pip=shouldPip;
    player.classList.toggle("pip",pip);
    stage.classList.toggle("pip-host",pip);
    paintText();
  }

  function setMobileHeaderHidden(hidden){
    hidden=!!hidden && mobileHeaderMq.matches && !top.classList.contains("search-open");
    if(hidden===mobileHeaderHidden)return;

    mobileHeaderHidden=hidden;
    top.classList.toggle("mobile-scroll-hidden",hidden);
    root.style.setProperty(
      "--visible-top-boundary",
      hidden ? "0px" : Math.max(0,Math.round(top.offsetHeight||0))+"px"
    );
  }

  function syncMobileHeaderVisibility(reset=false){
    const y=pageScrollY();

    if(!mobileHeaderMq.matches){
      mobileHeaderLastY=y;
      setMobileHeaderHidden(false);
      return;
    }

    if(reset){
      mobileHeaderLastY=y;
      if(y<=4)setMobileHeaderHidden(false);
      return;
    }

    if(top.classList.contains("search-open")){
      mobileHeaderLastY=y;
      setMobileHeaderHidden(false);
      return;
    }

    const delta=y-mobileHeaderLastY;

    // Finger/content moves upward -> page scrollY increases -> hide.
    // Reverse direction -> reveal immediately. Always reveal at page top.
    if(y<=4){
      setMobileHeaderHidden(false);
    }else if(delta>6 && y>24){
      setMobileHeaderHidden(true);
    }else if(delta<-4){
      setMobileHeaderHidden(false);
    }

    mobileHeaderLastY=y;
  }

  function schedulePip(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      syncPip();
    });
  }

  function select(kind){
    current=VIDEOS[kind];
    if(feedMode!=="search"){
      relatedMetas=[];
      feedMetas=[];
      feedMode="related";
    }
    pip=false;
    player.classList.remove("pip");
    stage.classList.remove("pip-host");
    landscapeBtn.classList.toggle("active",kind==="landscape");
    portraitBtn.classList.toggle("active",kind==="portrait");
    frame.src=embedUrl(current.id);
    layout();
    loadCurrentVideoMeta();
    schedulePip();
  }

  landscapeBtn.addEventListener("click",()=>select("landscape"));
  portraitBtn.addEventListener("click",()=>select("portrait"));

  function openNarrowSearch(){
    setMobileHeaderHidden(false);
    top.classList.add("search-open");
    requestAnimationFrame(()=>{
      syncBoundaries();
      searchInput.focus();
    });
  }

  function closeNarrowSearch(){
    top.classList.remove("search-open");
    syncMobileHeaderVisibility(true);
    syncBoundaries();
  }

  searchToggle.addEventListener("click",openNarrowSearch);
  searchBack.addEventListener("click",closeNarrowSearch);

  searchInput.addEventListener("input",applySearchFilter);
  searchInput.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
      event.preventDefault();
      runSearch();
    }else if(event.key==="Escape"){
      closeNarrowSearch();
    }
  });
  searchButton.addEventListener("click",()=>{
    runSearch();
    searchInput.focus();
  });

  sourcebar.addEventListener("click",event=>{
    const chip=event.target.closest(".source-chip");
    if(!chip || chip===landscapeBtn || chip===portraitBtn)return;
    sourcebar.querySelectorAll(".source-chip:not(.proof-mode-switch)").forEach(x=>x.classList.remove("active"));
    chip.classList.add("active");
    chip.scrollIntoView?.({behavior:"smooth",block:"nearest",inline:"nearest"});
    requestAnimationFrame(updateSourceRailArrows);
  });

  document.getElementById("rows").addEventListener("click",event=>{
    const menu=event.target.closest(".row-menu");
    const card=event.target.closest(".row");
    if(!card)return;

    if(menu){
      event.stopPropagation();
      menu.animate(
        [{transform:"scale(.88)"},{transform:"scale(1)"}],
        {duration:140,easing:"cubic-bezier(.2,0,0,1)"}
      );
      return;
    }

    document.querySelectorAll(".row.selected").forEach(x=>x.classList.remove("selected"));
    card.classList.add("selected");
    frame.src=embedUrl(card.dataset.videoId || current.id);
    window.scrollTo({top:0,behavior:"smooth"});
  });
  addEventListener("scroll",()=>{
    schedulePip();
    syncMobileHeaderVisibility();
  },{passive:true});

  /* Breakpoint has exactly one owner: the same media query used by CSS. */
  columnsMq.addEventListener?.("change",()=>{
    if(matchMedia("(min-width:657px)").matches){
      top.classList.remove("search-open");
    }
    layout();
    syncMobileHeaderVisibility(true);
    schedulePip();
  });

  /* Resize refreshes geometry, but never enter a scrollbar feedback loop. */
  let lastViewportW=document.documentElement.clientWidth||innerWidth||0;
  addEventListener("resize",()=>{
    const nextW=document.documentElement.clientWidth||innerWidth||0;
    const widthChanged=Math.abs(nextW-lastViewportW)>1;
    lastViewportW=nextW;

    if(widthChanged || document.documentElement.scrollWidth<=nextW+1){
      syncBoundaries();
    }
    syncMobileHeaderVisibility(true);
    updateSourceRailArrows();
    schedulePip();
  },{passive:true});

  /* If title/search/source chrome changes height, every media mode receives
     the same new TOP without separate mode-specific calculations. */
  new ResizeObserver(()=>{
    syncBoundaries();
    schedulePip();
  }).observe(top);

  mobileHeaderLastY=pageScrollY();
  syncMobileHeaderVisibility(true);
  select("landscape");
  loadExistingSourceNames();
  requestAnimationFrame(updateSourceRailArrows);
  loadFeedData();
})();
</script>
</body>
</html>
