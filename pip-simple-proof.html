<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PiP Simple Proof</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0f0f0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:220vh}
.top{
  position:sticky;top:0;z-index:50;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:#0f0f0f;border-bottom:1px solid #262626
}
.top strong{margin-right:auto;font-size:14px}
button{
  height:34px;padding:0 12px;border:1px solid #343434;border-radius:9px;
  background:#202020;color:#fff;font:inherit
}
button.active{background:#fff;color:#111;border-color:#fff}

main{width:min(680px,100%);margin:0 auto}
.media-col{min-width:0}
.stage{
  position:relative;
  margin:0 auto;
  background:#000;
  overflow:hidden;
}
.player{
  position:absolute;
  overflow:hidden;
  background:#000;
}
.player iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

/* 1 COLUMN MAIN: stage == actual media box. No outside black gutter. */
html.one-col .stage{background:transparent}
html.one-col .player{inset:0;width:100%;height:100%}

/* PIP: exact media ratio, no black gutter. */
html.one-col .player.pip{
  position:fixed;
  z-index:100;
  inset:auto;
  right:10px;
  top:66px;
  width:var(--pip-w);
  height:var(--pip-h);
  border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
html.one-col .player.pip iframe{border-radius:inherit}

/* 2 COLUMNS */
@media(min-width:960px){
  main{
    width:min(1220px,100%);
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--media-col-w,48vw);
    grid-template-areas:"feed media";
    gap:14px;
    align-items:start;
    padding:12px 14px 30px;
  }
  .rows{grid-area:feed;padding:0;min-width:0}
  .media-col{
    grid-area:media;
    position:sticky;
    top:68px;
    width:var(--media-col-w,48vw);
    justify-self:end;
  }

  /* 2-col landscape: tall black viewing area, 16:9 video centered.
     Black can exist only above and below the actual video. */
  html.two-col.landscape .stage{
    width:100%;
    height:var(--desktop-view-h);
    background:#000;
  }
  html.two-col.landscape .player{
    left:0;
    top:50%;
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    transform:translateY(-50%);
  }

  /* 2-col portrait: stage == actual 9:16 media. No black gutter. */
  html.two-col.portrait .stage{
    width:100%;
    height:var(--desktop-view-h);
    background:transparent;
  }
  html.two-col.portrait .player{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
  }

  html.two-col .player.pip{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border-radius:0;
    box-shadow:none;
  }
}

.info{padding:12px;border-bottom:1px solid #292929}
.info b{display:block;font-size:15px;margin-bottom:4px}
.info span{color:#999;font-size:12px}
.rows{padding:10px}
.row{
  height:92px;margin:0 0 10px;border-radius:12px;background:#181818;
  display:flex;align-items:center;padding:0 14px;color:#aaa
}
.state{
  position:fixed;left:8px;bottom:8px;z-index:150;
  padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.74);
  font-size:11px;color:#ddd
}
</style>
</head>
<body>
<header class="top" id="top">
  <strong>PiP proof · 1 player</strong>
  <button id="landscapeBtn" class="active">Ngang</button>
  <button id="portraitBtn">Dọc</button>
</header>

<main>
  <div class="media-col" id="mediaCol">
    <section class="stage" id="stage">
      <div class="player" id="player">
        <iframe id="videoFrame"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
    <div class="info">
      <b id="videoTitle">Video ngang · 16:9</b>
      <span id="layoutHint"></span>
    </div>
  </div>

  <div class="rows" id="rows"></div>
</main>

<div class="state" id="state"></div>

<script>
(() => {
  const VIDEOS={
    landscape:{id:"ypLlRC_2EFc",ratio:16/9,label:"Video ngang · 16:9"},
    portrait:{id:"kUF9P2m9mrg",ratio:9/16,label:"Video dọc · 9:16"}
  };

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const frame=document.getElementById("videoFrame");
  const stateEl=document.getElementById("state");
  const titleEl=document.getElementById("videoTitle");
  const layoutHint=document.getElementById("layoutHint");
  const landscapeBtn=document.getElementById("landscapeBtn");
  const portraitBtn=document.getElementById("portraitBtn");

  let current=VIDEOS.landscape;
  let pip=false;
  let raf=0;
  let lastWidth=Math.max(1,innerWidth||1);

  function embedUrl(id){
    return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }

  function isTwoColumn(){
    return matchMedia("(min-width:960px)").matches;
  }

  function availableHeight(){
    const headerH=top.offsetHeight||56;
    return Math.max(220,(innerHeight||document.documentElement.clientHeight||700)-headerH-14);
  }

  function layout(){
    const two=isTwoColumn();
    const portrait=current.ratio<1;

    root.classList.toggle("one-col",!two);
    root.classList.toggle("two-col",two);
    root.classList.toggle("portrait",portrait);
    root.classList.toggle("landscape",!portrait);

    if(!two){
      root.style.removeProperty("--media-col-w");
      root.style.removeProperty("--desktop-view-h");
      mediaCol.style.width="";
      mediaCol.style.marginInline="";

      if(portrait){
        /* MAIN portrait: full height, exact 9:16, no black. */
        let h=availableHeight();
        let w=h*current.ratio;
        const maxW=Math.max(1,Math.min(680,innerWidth||680));
        if(w>maxW){
          w=maxW;
          h=w/current.ratio;
        }
        stage.style.width=Math.round(w)+"px";
        stage.style.height=Math.round(h)+"px";
        mediaCol.style.width=Math.round(w)+"px";
        mediaCol.style.marginInline="auto";
      }else{
        /* MAIN landscape: full width, exact 16:9, no black. */
        const w=Math.max(1,Math.min(680,innerWidth||680));
        const h=w/current.ratio;
        stage.style.width=Math.round(w)+"px";
        stage.style.height=Math.round(h)+"px";
      }
    }else{
      pip=false;
      player.classList.remove("pip");

      const h=availableHeight();

      if(portrait){
        /* 2-col portrait: full height, exact 9:16, no black. */
        const w=h*current.ratio;
        root.style.setProperty("--media-col-w",Math.round(w)+"px");
        root.style.setProperty("--desktop-view-h",Math.round(h)+"px");
        stage.style.width="100%";
        stage.style.height=Math.round(h)+"px";
      }else{
        /* 2-col landscape: wide column + tall black viewing area.
           Actual 16:9 video remains centered with black top/bottom only. */
        const w=Math.max(360,Math.min((innerWidth||1200)*.48,620));
        root.style.setProperty("--media-col-w",Math.round(w)+"px");
        root.style.setProperty("--desktop-view-h",Math.round(h)+"px");
        stage.style.width="100%";
        stage.style.height=Math.round(h)+"px";
      }
    }

    fitPip();
    paintText();
  }

  function fitPip(){
    if(current.ratio<1){
      let h=Math.min(420,Math.max(240,(innerHeight||700)*.50));
      let w=h*current.ratio;
      const maxW=Math.max(120,(innerWidth||500)*.46);
      if(w>maxW){w=maxW;h=w/current.ratio}
      root.style.setProperty("--pip-w",Math.round(w)+"px");
      root.style.setProperty("--pip-h",Math.round(h)+"px");
    }else{
      let w=Math.min(280,Math.max(170,(innerWidth||500)*.46));
      let h=w/current.ratio;
      root.style.setProperty("--pip-w",Math.round(w)+"px");
      root.style.setProperty("--pip-h",Math.round(h)+"px");
    }
  }

  function paintText(){
    titleEl.textContent=current.label;
    if(isTwoColumn()){
      layoutHint.textContent=current.ratio<1
        ?"2 cột · dọc full, không đen."
        :"2 cột · ngang giữa, đen trên/dưới.";
      stateEl.textContent="2 CỘT · MAIN · "+(current.ratio<1?"9:16":"16:9");
    }else{
      layoutHint.textContent=current.ratio<1
        ?"1 cột · MAIN dọc full, không đen."
        :"1 cột · MAIN ngang full, không đen.";
      stateEl.textContent="1 CỘT · "+(pip?"PIP":"MAIN")+" · "+(current.ratio<1?"9:16":"16:9");
    }
  }

  function syncPip(){
    if(isTwoColumn()){
      if(pip){
        pip=false;
        player.classList.remove("pip");
        paintText();
      }
      return;
    }

    /* Simple rule:
       stage is always the original MAIN media box and stays in document flow.
       When its real bottom passes the header -> PiP.
       Because stage never becomes fixed, this remains stable after PiP opens. */
    const shouldPip=
      window.scrollY>0 &&
      stage.getBoundingClientRect().bottom<=top.getBoundingClientRect().bottom+1;

    if(shouldPip===pip)return;

    pip=shouldPip;
    player.classList.toggle("pip",pip);
    paintText();
  }

  function schedulePip(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      syncPip();
    });
  }

  function select(kind){
    current=VIDEOS[kind];
    pip=false;
    player.classList.remove("pip");
    landscapeBtn.classList.toggle("active",kind==="landscape");
    portraitBtn.classList.toggle("active",kind==="portrait");
    frame.src=embedUrl(current.id);
    layout();
    schedulePip();
  }

  landscapeBtn.addEventListener("click",()=>select("landscape"));
  portraitBtn.addEventListener("click",()=>select("portrait"));
  addEventListener("scroll",schedulePip,{passive:true});
  addEventListener("resize",()=>{
    const w=Math.max(1,innerWidth||1);
    /* Ignore Chrome mobile height-only browser-bar resize. */
    if(Math.abs(w-lastWidth)>2){
      lastWidth=w;
      layout();
    }
    schedulePip();
  },{passive:true});

  document.getElementById("rows").innerHTML=
    Array.from({length:14},(_,i)=>'<div class="row">Nội dung cuộn '+(i+1)+'</div>').join("");

  select("landscape");
})();
</script>
</body>
</html>
