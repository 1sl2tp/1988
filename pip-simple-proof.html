<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PiP Simple Proof</title>
<style>
*{box-sizing:border-box}
:root{
  --top-boundary:56px;
  --bottom-gap:max(8px,env(safe-area-inset-bottom));
  --full-h:calc(100svh - var(--top-boundary) - var(--bottom-gap));
}
html,body{margin:0;background:#0f0f0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
html.one-col,
html.one-col body{
  max-width:100%;
  overflow-x:hidden;
}
html.one-col body{min-height:220vh}
.top{
  position:sticky;top:0;z-index:50;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:#0f0f0f;border-bottom:1px solid #262626
}
.top strong{margin-right:auto;font-size:14px}
button{
  height:34px;padding:0 12px;border:1px solid #343434;border-radius:9px;
  background:#202020;color:#fff;font:inherit
}
button.active{background:#fff;color:#111;border-color:#fff}

main{width:min(680px,100%);max-width:100%;margin:0 auto;overflow-x:clip}
.media-col{min-width:0;max-width:100%}
.stage{
  position:relative;
  margin:0 auto;
  background:#000;
  overflow:hidden;
}
.player{
  position:absolute;
  overflow:hidden;
  background:#000;
}
.player iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

/* 1 COLUMN MAIN
   Landscape follows WIDTH.
   Portrait follows HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:680px;
  aspect-ratio:16/9;
  height:auto;
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  height:var(--full-h);
  width:min(100%,calc(var(--full-h) * 0.5625));
  aspect-ratio:9/16;
  background:transparent;
}
html.one-col.portrait .player{
  inset:0;
  width:100%;
  height:100%;
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed;
  z-index:100;
  inset:auto;
  right:10px;
  top:calc(var(--top-boundary) + 8px);
  border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
html.one-col.landscape .player.pip{
  width:min(46vw,280px);
  height:auto;
  aspect-ratio:16/9;
}
html.one-col.portrait .player.pip{
  height:min(50svh,420px,calc(var(--full-h) - 16px));
  width:auto;
  aspect-ratio:9/16;
}
html.one-col .player.pip iframe{border-radius:inherit}

/* 2 COLUMNS */
@media(min-width:960px){
  html.two-col,
  html.two-col body{
    height:100%;
    overflow:hidden;
  }

  html.two-col main{
    width:min(1220px,100%);
    height:var(--full-h);
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"feed media";
    gap:14px;
    align-items:start;
    margin:0 auto;
    padding:0 14px;
    overflow:hidden;
  }

  html.two-col .rows{
    grid-area:feed;
    height:var(--full-h);
    min-width:0;
    padding:0 0 var(--bottom-gap);
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }

  html.two-col .media-col{
    grid-area:media;
    position:relative;
    top:auto;
    height:var(--full-h);
    justify-self:end;
    min-width:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     WIDTH owns the size. The iframe fills a tall viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:min(48vw,620px);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:100%;
    background:#000;
  }
  html.two-col.landscape .player{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
  }

  /* 2-col portrait:
     HEIGHT owns the size. Width is derived from 9:16, so there is no side black. */
  html.two-col.portrait .media-col{
    width:calc(var(--full-h) * 0.5625);
    height:100%;
  }
  html.two-col.portrait .stage{
    width:100%;
    height:100%;
    aspect-ratio:9/16;
    background:transparent;
  }
  html.two-col.portrait .player{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
  }
}
.info{padding:12px;border-bottom:1px solid #292929}
.info b{display:block;font-size:15px;margin-bottom:4px}
.info span{color:#999;font-size:12px}
.rows{padding:10px}
@media(min-width:960px){
  html.two-col .rows{
    padding:0 0 var(--bottom-gap);
  }
}
.row{
  height:92px;margin:0 0 10px;border-radius:12px;background:#181818;
  display:flex;align-items:center;padding:0 14px;color:#aaa
}
.state{
  position:fixed;left:8px;bottom:8px;z-index:150;
  padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.74);
  font-size:11px;color:#ddd
}
</style>
</head>
<body>
<header class="top" id="top">
  <strong>PiP proof · 1 player</strong>
  <button id="landscapeBtn" class="active">Ngang</button>
  <button id="portraitBtn">Dọc</button>
</header>

<main>
  <div class="media-col" id="mediaCol">
    <section class="stage" id="stage">
      <div class="player" id="player">
        <iframe id="videoFrame"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
    <div class="info">
      <b id="videoTitle">Video ngang · 16:9</b>
      <span id="layoutHint"></span>
    </div>
  </div>

  <div class="rows" id="rows"></div>
</main>

<div class="state" id="state"></div>

<script>
(() => {
  const VIDEOS={
    landscape:{id:"ypLlRC_2EFc",ratio:16/9,label:"Video ngang · 16:9"},
    portrait:{id:"kUF9P2m9mrg",ratio:9/16,label:"Video dọc · 9:16"}
  };

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const frame=document.getElementById("videoFrame");
  const stateEl=document.getElementById("state");
  const titleEl=document.getElementById("videoTitle");
  const layoutHint=document.getElementById("layoutHint");
  const landscapeBtn=document.getElementById("landscapeBtn");
  const portraitBtn=document.getElementById("portraitBtn");

  let current=VIDEOS.landscape;
  let pip=false;
  let raf=0;
  const columnsMq=matchMedia("(min-width:960px)");

  function embedUrl(id){
    return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }

  function isTwoColumn(){
    return columnsMq.matches;
  }

  function syncBoundaries(){
    // One TOP for title/search/source chrome; one BOTTOM for every media mode.
    // TOP is the actual bottom edge of the sticky chrome.
    const topBoundary=Math.max(0,Math.round(top.getBoundingClientRect().bottom));
    root.style.setProperty("--top-boundary",topBoundary+"px");
  }

  function layout(){
    syncBoundaries();
    const two=isTwoColumn();
    const portrait=current.ratio<1;

    root.classList.toggle("one-col",!two);
    root.classList.toggle("two-col",two);
    root.classList.toggle("portrait",portrait);
    root.classList.toggle("landscape",!portrait);

    /* CSS owns all geometry:
       landscape follows width, portrait follows height. */

    if(two){
      pip=false;
      player.classList.remove("pip");
      window.scrollTo(0,0);
    }

    paintText();
  }
  function paintText(){
    titleEl.textContent=current.label;
    if(isTwoColumn()){
      layoutHint.textContent=current.ratio<1
        ?"2 cột · dọc full, không đen."
        :"2 cột · ngang giữa, đen trên/dưới.";
      stateEl.textContent="2 CỘT · MAIN · "+(current.ratio<1?"9:16":"16:9");
    }else{
      layoutHint.textContent=current.ratio<1
        ?"1 cột · MAIN dọc full, không đen."
        :"1 cột · MAIN ngang full, không đen.";
      stateEl.textContent="1 CỘT · "+(pip?"PIP":"MAIN")+" · "+(current.ratio<1?"9:16":"16:9");
    }
  }

  function syncPip(){
    if(isTwoColumn()){
      if(pip){
        pip=false;
        player.classList.remove("pip");
        paintText();
      }
      return;
    }

    /* Simple rule:
       stage is always the original MAIN media box and stays in document flow.
       When its real bottom passes the header -> PiP.
       Because stage never becomes fixed, this remains stable after PiP opens. */
    const shouldPip=
      window.scrollY>0 &&
      stage.getBoundingClientRect().bottom<=top.getBoundingClientRect().bottom+1;

    if(shouldPip===pip)return;

    pip=shouldPip;
    player.classList.toggle("pip",pip);
    paintText();
  }

  function schedulePip(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      syncPip();
    });
  }

  function select(kind){
    current=VIDEOS[kind];
    pip=false;
    player.classList.remove("pip");
    landscapeBtn.classList.toggle("active",kind==="landscape");
    portraitBtn.classList.toggle("active",kind==="portrait");
    frame.src=embedUrl(current.id);
    layout();
    schedulePip();
  }

  landscapeBtn.addEventListener("click",()=>select("landscape"));
  portraitBtn.addEventListener("click",()=>select("portrait"));
  addEventListener("scroll",schedulePip,{passive:true});

  /* Breakpoint has exactly one owner: the same media query used by CSS. */
  columnsMq.addEventListener?.("change",()=>{
    layout();
    schedulePip();
  });

  /* Geometry is CSS-owned. Resize only refreshes the shared TOP boundary and PiP. */
  addEventListener("resize",()=>{
    syncBoundaries();
    schedulePip();
  },{passive:true});

  /* If title/search/source chrome changes height, every media mode receives
     the same new TOP without separate mode-specific calculations. */
  new ResizeObserver(()=>{
    syncBoundaries();
    schedulePip();
  }).observe(top);

  document.getElementById("rows").innerHTML=
    Array.from({length:14},(_,i)=>'<div class="row">Nội dung cuộn '+(i+1)+'</div>').join("");

  select("landscape");
})();
</script>
</body>
</html>
