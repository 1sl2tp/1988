<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PiP Simple Proof</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#0f0f0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:220vh}
  .top{
    position:sticky;top:0;z-index:20;height:56px;
    display:flex;align-items:center;gap:8px;padding:0 10px;
    background:rgba(15,15,15,.94);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08)
  }
  .top strong{margin-right:auto;font-size:14px}
  button{
    height:34px;padding:0 12px;border:1px solid #333;border-radius:9px;
    background:#202020;color:#fff;font:inherit
  }
  button.active{background:#fff;color:#111;border-color:#fff}
  main{
    width:min(680px,100%);
    margin:0 auto;
  }
  .media-col{min-width:0}
  .stage{
    position:relative;
    width:100%;
    height:auto;
    margin-inline:auto;
    background:#000;
  }
  .player{
    position:absolute;inset:0;
    width:100%;height:100%;
    background:#000;
    overflow:hidden;
  }
  .player iframe{
    display:block;width:100%;height:100%;border:0;background:#000;
  }
  .player.gutter-test{
    background:#000;
    padding:var(--gutter-y,0px) var(--gutter-x,0px);
  }
  .player.gutter-test iframe{
    width:100%;
    height:100%;
    border-radius:0;
  }
  .player.pip{
    position:fixed;
    inset:auto;
    z-index:100;
    width:var(--pip-w,240px);
    height:var(--pip-h,135px);
    right:10px;
    top:calc(66px + env(safe-area-inset-top));
    border-radius:10px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);
  }
  .player.pip iframe{border-radius:inherit}
  .info{padding:12px;border-bottom:1px solid #292929}
  .info b{display:block;font-size:15px;margin-bottom:4px}
  .info span{color:#999;font-size:12px}
  .rows{padding:10px}
  .row{
    height:92px;margin:0 0 10px;border-radius:12px;background:#181818;
    display:flex;align-items:center;padding:0 14px;color:#aaa
  }
  .state{
    position:fixed;left:8px;bottom:8px;z-index:150;
    padding:6px 9px;border-radius:8px;background:rgba(0,0,0,.72);
    font-size:11px;color:#ddd
  }
  @media(min-width:960px){
    main{
      width:min(1220px,100%);
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,var(--media-col-w,48vw));
      grid-template-areas:"feed media";
      gap:14px;
      align-items:start;
      padding:12px 14px 30px;
    }
    .rows{
      grid-area:feed;
      padding:0;
      min-width:0;
    }
    .media-col{
      grid-area:media;
      position:sticky;
      top:68px;
      min-width:0;
      width:var(--media-col-w,100%);
      justify-self:end;
    }
    .stage{
      max-width:100%;
      max-height:calc(100dvh - 82px);
    }
    .player.pip{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border-radius:0;
      box-shadow:none;
    }
  }
</style>
</head>
<body>
<header class="top" id="top">
  <strong>PiP proof · 1 player</strong>
  <button id="landscapeBtn" class="active">Ngang</button>
  <button id="landscapeBlackBtn">Ngang đen</button>
  <button id="portraitBtn">Dọc</button>
</header>

<main>
  <div class="media-col">
    <section class="stage" id="stage">
      <div class="player" id="player">
        <iframe
          id="videoFrame"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </section>

    <div class="info">
      <b id="videoTitle">Video ngang · 16:9</b>
      <span id="layoutHint">1 cột: cuộn khỏi media thì PiP.</span>
    </div>
  </div>

  <div class="rows" id="rows"></div>
</main>

<div class="state" id="state">MAIN · 16:9</div>

<script>
(() => {
  const VIDEOS = {
    landscape: {
      id: "ypLlRC_2EFc",
      ratio: 16/9,
      label: "Video ngang · 16:9",
      gutter:false
    },
    landscapeBlack: {
      id: "ypLlRC_2EFc",
      ratio: 16/9,
      label: "Video ngang · kiểm tra viền đen",
      gutter:true
    },
    portrait: {
      id: "kUF9P2m9mrg",
      ratio: 9/16,
      label: "Video dọc · 9:16",
      gutter:false
    }
  };

  const top = document.getElementById("top");
  const stage = document.getElementById("stage");
  const player = document.getElementById("player");
  const frame = document.getElementById("videoFrame");
  const stateEl = document.getElementById("state");
  const titleEl = document.getElementById("videoTitle");
  const layoutHint = document.getElementById("layoutHint");
  const landscapeBtn = document.getElementById("landscapeBtn");
  const landscapeBlackBtn = document.getElementById("landscapeBlackBtn");
  const portraitBtn = document.getElementById("portraitBtn");

  let current = VIDEOS.landscape;
  let pip = false;
  let raf = 0;

  function embedUrl(id){
    return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) +
      "?autoplay=1&playsinline=1&rel=0&modestbranding=1";
  }

  function viewportHeight(){
    return Math.max(1, Number(visualViewport?.height) || innerHeight || 1);
  }

  function measureMain(){
    const headerBottom = Math.max(0, top.getBoundingClientRect().bottom);
    const availableH = Math.max(
      220,
      viewportHeight() - headerBottom - (twoColumn() ? 14 : 0)
    );

    const viewportW = Math.max(1, innerWidth || 1);
    const oneColumnMaxW = Math.max(1, Math.min(680, viewportW));
    const desktopLandscapeW = Math.max(360, Math.min(viewportW * .48, 620));
    const maxW = twoColumn() ? desktopLandscapeW : oneColumnMaxW;

    let w;
    let h;

    if(current.ratio < 1){
      // PORTRAIT STANDARD:
      // height is authoritative, width follows the real media ratio.
      h = availableH;
      w = h * current.ratio;

      // Never let the portrait media exceed the actual available column/page width.
      const hardMaxW = twoColumn()
        ? Math.min(viewportW * .42, 520)
        : oneColumnMaxW;
      if(w > hardMaxW){
        w = hardMaxW;
        h = w / current.ratio;
      }

      // The desktop media COLUMN itself becomes exactly the portrait media width.
      if(twoColumn()){
        document.documentElement.style.setProperty("--media-col-w", Math.round(w) + "px");
      }
    }else{
      // LANDSCAPE STANDARD:
      // width is authoritative, height follows the real media ratio.
      w = maxW;
      h = w / current.ratio;
      if(twoColumn() && h > availableH){
        h = availableH;
        w = h * current.ratio;
      }

      if(twoColumn()){
        document.documentElement.style.setProperty("--media-col-w", Math.round(w) + "px");
      }
    }

    if(!twoColumn()){
      document.documentElement.style.removeProperty("--media-col-w");
    }

    stage.style.width = Math.round(w) + "px";
    stage.style.height = Math.round(h) + "px";
    stage.style.aspectRatio = "auto";
  }

  function fitPip(ratio){
    let w;
    let h;

    if(ratio < 1){
      // PiP dọc cũng đo theo chiều cao.
      h = Math.min(420, Math.max(240, viewportHeight() * .50));
      w = h * ratio;
      const maxW = Math.max(120, innerWidth * .46);
      if(w > maxW){
        w = maxW;
        h = w / ratio;
      }
    }else{
      // PiP ngang đo theo chiều rộng.
      w = Math.min(280, Math.max(170, innerWidth * .46));
      h = w / ratio;
      const maxH = Math.max(100, viewportHeight() * .36);
      if(h > maxH){
        h = maxH;
        w = h * ratio;
      }
    }

    document.documentElement.style.setProperty("--pip-w", Math.round(w) + "px");
    document.documentElement.style.setProperty("--pip-h", Math.round(h) + "px");
  }

  function twoColumn(){
    return matchMedia("(min-width:960px)").matches;
  }

  function paint(){
    document.documentElement.style.setProperty("--ratio", String(current.ratio));
    measureMain();
    fitPip(current.ratio);
    titleEl.textContent = current.label;
    player.classList.toggle("gutter-test", current.gutter === true);

    // "Ngang đen" is only a controlled content-gutter test:
    // the outer media geometry stays 16:9; black is inside the player on purpose.
    if(current.gutter === true){
      player.style.setProperty("--gutter-x","7%");
      player.style.setProperty("--gutter-y","0px");
    }else{
      player.style.removeProperty("--gutter-x");
      player.style.removeProperty("--gutter-y");
    }

    if(twoColumn()){
      layoutHint.textContent = current.ratio < 1
        ? "2 cột · dọc: cao quyết định rộng, cột phải co đúng media."
        : current.gutter
          ? "2 cột · ngang: viền đen là nội dung kiểm thử, không phải khoảng thừa của layout."
          : "2 cột · ngang: rộng quyết định cao, cột phải theo đúng media.";
      stateEl.textContent = "2 CỘT · MAIN · " + (current.ratio > 1 ? "16:9" : "9:16");
    }else{
      layoutHint.textContent = current.ratio < 1
        ? "1 cột · dọc full theo chiều cao vùng xem."
        : "1 cột · ngang full theo chiều rộng.";
      stateEl.textContent = "1 CỘT · " + (pip ? "PIP" : "MAIN") + " · " +
        (current.ratio > 1 ? "16:9" : "9:16");
    }
  }

  function syncPip(){
    if(twoColumn()){
      if(pip){
        pip = false;
        player.classList.remove("pip");
      }
      paint();
      return;
    }

    const mediaRect = stage.getBoundingClientRect();
    const headerBottom = top.getBoundingClientRect().bottom;

    // Use the REAL height of the current media.
    // Landscape has a short bottom edge -> PiP starts sooner.
    // Portrait is full-height -> PiP starts only after that taller media passes.
    const shouldPip =
      window.scrollY > 0 &&
      mediaRect.bottom <= headerBottom + 1;

    if(shouldPip !== pip){
      pip = shouldPip;
      player.classList.toggle("pip", pip);
    }
    paint();
  }

  function scheduleSync(){
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      syncPip();
    });
  }

  function select(kind){
    current = VIDEOS[kind];
    landscapeBtn.classList.toggle("active", kind === "landscape");
    landscapeBlackBtn.classList.toggle("active", kind === "landscapeBlack");
    portraitBtn.classList.toggle("active", kind === "portrait");
    frame.src = embedUrl(current.id);
    paint();
    scheduleSync();
  }

  landscapeBtn.addEventListener("click", () => select("landscape"));
  landscapeBlackBtn.addEventListener("click", () => select("landscapeBlack"));
  portraitBtn.addEventListener("click", () => select("portrait"));

  addEventListener("scroll", scheduleSync, {passive:true});
  addEventListener("resize", () => {
    fitPip(current.ratio);
    scheduleSync();
  }, {passive:true});
  visualViewport?.addEventListener?.("resize", () => {
    fitPip(current.ratio);
    scheduleSync();
  }, {passive:true});

  const rows = document.getElementById("rows");
  rows.innerHTML = Array.from({length:14}, (_,i) =>
    '<div class="row">Nội dung cuộn ' + (i+1) + '</div>'
  ).join("");

  select("landscape");
})();
</script>
</body>
</html>
