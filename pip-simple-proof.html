<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta id="themeColorMeta" name="theme-color" content="rgba(33,33,33,.98)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1988">
<meta name="description" content="1988 - xem video nhanh.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>1988</title>
<style>
*{box-sizing:border-box}
:root{
  --yt-bg:#0f0f0f;
  --yt-surface:#212121;
  --yt-surface-2:#272727;
  --yt-border:#303030;
  --yt-divider:#292929;
  --yt-text:#f1f1f1;
  --yt-text-secondary:#aaa;
  --yt-hover:rgba(255,255,255,.10);
  --yt-press:rgba(255,255,255,.18);
  --header-rgb:15,15,15;
  --header-accent-rgb:82,108,168;
  --header-alpha:.94;
  --header-blur:16px;
  --safe-top:env(safe-area-inset-top,0px);
  --top-boundary:calc(56px + var(--safe-top));
  --bottom-gap:8px;
  --current-full-h:600px;
  --pip-landscape-w:240px;
  --pip-portrait-h:360px;
  --two-col-media-w:420px;
  --landscape-player-h:420px;
  --landscape-top-safe:56px;
  --landscape-bottom-safe:64px;
  --layout-gap:16px;
  --content-top-gap:0px;
  --feed-cols:2;
  --card-target-w:310px;
  --floating-radius:10px;
  --media-ratio:1.7777778;
}
html,body{
  margin:0;
  background:var(--yt-bg);
  color:var(--yt-text);
  font-family:Roboto,"Arial",sans-serif;
}
html{
  overflow-y:scroll;
  scrollbar-color:hsl(0 0% 67%) transparent;
}
body{
  min-height:100vh;
  overflow-y:visible;
}
html::-webkit-scrollbar{
  width:16px;
}
html::-webkit-scrollbar-track{
  background:transparent;
}
html::-webkit-scrollbar-thumb{
  min-height:56px;
  border:4px solid transparent;
  border-radius:8px;
  background-clip:content-box;
  background-color:hsl(0 0% 67%);
}
html::-webkit-scrollbar-thumb:hover{
  background-color:#bdbdbd;
  background-clip:content-box;
}
html::-webkit-scrollbar-corner{
  background:transparent;
}
html.one-col,
html.one-col body{
  max-width:100%;
}
html.one-col body{min-height:220vh}
.top{
  position:sticky;
  top:0;
  z-index:50;
  width:100%;
  display:flex;
  align-items:center;
  padding-top:var(--safe-top);
  --header-alpha:.94;
  background:rgba(var(--header-rgb),var(--header-alpha));
  -webkit-backdrop-filter:saturate(145%) blur(var(--header-blur));
  backdrop-filter:saturate(145%) blur(var(--header-blur));
  border-bottom:0;
  transform:translateY(0);
  transition:
    transform .20s cubic-bezier(.4,0,.2,1),
    background-color .18s cubic-bezier(.2,0,0,1);
  will-change:transform;
}
.top::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.48;
  background:
    radial-gradient(
      62% 120% at 18% 50%,
      rgba(var(--header-accent-rgb),.10) 0,
      rgba(var(--header-accent-rgb),.045) 38%,
      rgba(var(--header-accent-rgb),0) 72%
    ),
    linear-gradient(
      90deg,
      rgba(var(--header-accent-rgb),.035),
      transparent 45%,
      rgba(var(--header-accent-rgb),.025)
    );
  transition:opacity .22s cubic-bezier(.2,0,0,1);
}
.top.search-open::after{
  opacity:.92;
  animation:search-chrome-wash .36s cubic-bezier(.2,0,0,1) both;
}
.top > *{
  position:relative;
  z-index:1;
}
@keyframes search-chrome-wash{
  from{opacity:.28;filter:saturate(.82)}
  to{opacity:.92;filter:saturate(1.12)}
}
.top.chrome-scrolled{
  --header-alpha:.78;
}
.top.search-open{
  --header-alpha:.90;
}
.masthead{
  flex:0 0 auto;
  width:auto;
  height:56px;
  display:flex;
  align-items:center;
  gap:2px;
  padding:0 4px 0 8px;
}
.brand{
  flex:0 0 auto;
  width:97px;
  height:40px;
  display:none;
  align-items:center;
  gap:5px;
  color:#fff;
  text-decoration:none;
  user-select:none;
}
.brand-mark{
  width:29px;
  height:20px;
  display:block;
  flex:0 0 29px;
}
.brand-mark svg{
  display:block;
  width:29px;
  height:20px;
}
.brand-name{
  /* YouTube wordmark itself is SVG 93×20; custom 1988 matches its ~18px visual height. */
  font:700 18px/20px "Arial Narrow",Roboto,Arial,sans-serif;
  letter-spacing:-.55px;
  transform:scaleX(.94);
  transform-origin:left center;
}
.searchbox{
  width:var(--auto-search-w,360px);
  height:40px;
  margin:0;
  display:none;
  min-width:0;
}
.search-input{
  min-width:0;
  flex:1 1 auto;
  height:40px;
  padding:0 16px;
  border:1px solid hsl(0 0% 18.82%);
  border-right:0;
  border-radius:20px 0 0 20px;
  outline:0;
  background:hsl(0 0% 7%);
  color:var(--yt-text);
  font:400 16px/22px Roboto,"Arial",sans-serif;
}
.search-input::placeholder{color:#888}
.search-input:focus{
  border-color:#1c62b9;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
}
.search-button,
.voice-search-button,
.icon-button{
  width:40px;
  height:40px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  color:var(--yt-text);
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.voice-search-button{
  flex:0 0 40px;
  border:1px solid hsl(0 0% 18.82%);
  border-left:0;
  border-right:0;
  border-radius:0;
  background:hsl(0 0% 7%);
}
.voice-search-button:hover{
  background:hsla(0 0% 100%/.08);
}
.voice-search-button.listening{
  color:#ff4e45;
  background:rgba(255,78,69,.10);
}
.voice-search-button.listening svg{
  animation:voice-search-pulse .9s ease-in-out infinite alternate;
}
@keyframes voice-search-pulse{
  from{transform:scale(.90);opacity:.72}
  to{transform:scale(1.08);opacity:1}
}
.search-button{
  width:64px;
  border:1px solid hsl(0 0% 18.82%);
  border-radius:0 20px 20px 0;
  background:hsla(0 0% 100%/.08);
}
.search-button:hover{
  border-color:hsl(0 0% 18.82%);
  background:hsla(0 0% 100%/.08);
}
.search-button svg,
.voice-search-button svg,
.icon-button svg{
  width:24px;
  height:24px;
  fill:currentColor;
}
.icon-button:hover{background:var(--yt-hover)}
.icon-button:active{background:var(--yt-press)}
.sourcebar{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  width:auto;
  height:56px;
  background:transparent;
  overflow:hidden;
}
.source-scroll{
  position:relative;
  width:100%;
  height:56px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  scroll-padding-inline:68px;
}
.source-scroll::-webkit-scrollbar{display:none}
.source-chips{
  min-width:max-content;
  height:56px;
  display:flex;
  align-items:center;
  gap:0;
  white-space:nowrap;
  padding:0;
}
.source-name-chips{display:contents}
.source-chip{
  flex:0 0 auto;
  position:relative;
  height:32px;
  min-width:12px;
  margin:12px 8px 12px 0;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:0;
  border-radius:8px;
  background:rgba(255,255,255,.10);
  color:#f1f1f1;
  font-family:Roboto,"Arial",sans-serif;
  font-size:14px;
  line-height:20px;
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s cubic-bezier(.05,0,0,1);
}
.source-name-chips .source-chip:first-child{margin-left:4px}
.source-chip:last-of-type{margin-right:0}
.source-name-chips .source-chip:last-child{margin-right:0}
.source-chip:hover{background:rgba(255,255,255,.20)}
.source-chip:active{background:rgba(255,255,255,.15)}
.source-chip.active{
  background:
    linear-gradient(
      135deg,
      rgba(var(--header-accent-rgb),.16),
      rgba(var(--header-accent-rgb),.05)
    ),
    #f1f1f1;
  color:#0f0f0f;
  box-shadow:
    0 0 0 1px rgba(var(--header-accent-rgb),.10),
    0 3px 12px rgba(var(--header-accent-rgb),.08);
}
.source-arrow{
  position:absolute;
  top:0;
  bottom:0;
  z-index:4;
  width:52px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(var(--header-rgb),var(--header-alpha));
  overflow:visible;
  pointer-events:none;
}
.source-arrow[hidden]{display:none}
.source-arrow.left{left:0}
.source-arrow.right{right:0}

/* Hard guard: chips are fully clipped below the arrow zone.
   Only a short 16px feather remains toward the content. */
.source-arrow.left::after,
.source-arrow.right::before{
  content:"";
  position:absolute;
  top:0;
  width:16px;
  height:100%;
  pointer-events:none;
}
.source-arrow.left::after{
  left:100%;
  background:linear-gradient(
    to right,
    rgba(var(--header-rgb),var(--header-alpha)),
    rgba(var(--header-rgb),0)
  );
}
.source-arrow.right::before{
  right:100%;
  background:linear-gradient(
    to left,
    rgba(var(--header-rgb),var(--header-alpha)),
    rgba(var(--header-rgb),0)
  );
}
.source-arrow-button{
  position:relative;
  z-index:2;
  width:32px;
  height:32px;
  margin:0;
  padding:0;
  border:0;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:rgba(var(--header-rgb),var(--header-alpha));
  color:#f1f1f1;
  pointer-events:auto;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.source-arrow-button:hover{background:#272727}
.source-arrow-button svg{
  width:24px;
  height:24px;
  fill:currentColor;
}
.search-toggle{
  display:grid;
  flex:0 0 40px;
  width:40px;
  height:40px;
  margin:0;
}
.search-back{display:none}
.settings-button{display:none}

/* Plenty of horizontal room: expand search without hiding the source rail. */
.top.search-roomy:not(.search-open) .search-toggle{display:none}
.top.search-roomy:not(.search-open) .searchbox{
  display:flex;
  flex:0 0 var(--auto-search-w,360px);
  width:var(--auto-search-w,360px);
}

/* Explicit search mode: one pill takes the row, exactly like mobile. */
.top.search-open .masthead{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  padding:0 8px;
  gap:6px;
}
.top.search-open .sourcebar{display:none}
.top.search-open .search-toggle{display:none}
.top.search-open .search-back{
  display:grid;
  flex:0 0 40px;
}
.top.search-open .settings-button{
  display:grid;
  flex:0 0 40px;
}
.top.search-open .searchbox{
  display:flex;
  flex:1 1 auto;
  min-width:0;
  width:auto;
  height:40px;
  margin:0;
  overflow:hidden;
  border:1px solid hsl(0 0% 18.82%);
  border-radius:20px;
  background:hsl(0 0% 7%);
  transition:
    border-color .16s ease,
    box-shadow .16s ease,
    background-color .16s ease;
}
.top.search-open .searchbox:focus-within{
  border-color:rgba(var(--header-accent-rgb),.78);
  box-shadow:
    0 0 0 1px rgba(var(--header-accent-rgb),.10),
    0 3px 16px rgba(var(--header-accent-rgb),.07);
}
.top.search-open .search-input{
  min-width:0;
  height:38px;
  padding:0 14px;
  border:0;
  border-radius:19px 0 0 19px;
  background:transparent;
  font-size:16px;
  line-height:22px;
  box-shadow:none;
}
.top.search-open .search-input:focus{
  border:0;
  box-shadow:none;
}
.top.search-open .voice-search-button{
  flex:0 0 40px;
  width:40px;
  height:38px;
  border:0;
  border-left:1px solid rgba(var(--header-accent-rgb),.10);
  border-radius:0;
  background:transparent;
}
.top.search-open .voice-search-button:hover{
  background:rgba(var(--header-accent-rgb),.08);
}
.top.search-open .voice-search-button.listening{
  color:#ff4e45;
  background:rgba(255,78,69,.10);
}
.top.search-open .search-button{
  flex:0 0 44px;
  width:44px;
  height:38px;
  border:0;
  border-left:1px solid rgba(var(--header-accent-rgb),.18);
  border-radius:0 19px 19px 0;
  background:
    linear-gradient(
      135deg,
      rgba(var(--header-accent-rgb),.16),
      rgba(var(--header-accent-rgb),.07)
    ),
    hsla(0 0% 100%/.05);
  transition:
    background-color .16s ease,
    transform .12s ease;
}
.top.search-open .search-button:active{
  transform:scale(.94);
}

@media(max-width:656px){
  :root{
    --top-boundary:calc(56px + var(--safe-top));
    --content-top-gap:0px;
  }

  .top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    border:0;
    outline:0;
    box-shadow:none;
  }

  .source-arrow{
    width:40px;
    height:56px;
  }
  .source-arrow.left::after,
  .source-arrow.right::before{
    width:12px;
  }
  .source-arrow-button{
    width:32px;
    height:32px;
  }

  .top.mobile-scroll-hidden:not(.search-open){
    transform:translate3d(0,calc(-100% - 2px),0);
    pointer-events:none;
  }
}

@media(min-width:657px){
  .top{
    transform:none!important;
    pointer-events:auto!important;
  }
}

main{
  width:100%;
  max-width:100%;
  margin:0;
  padding-top:var(--content-top-gap);
}
@media(max-width:656px){
  main{
    /* 1px overlap removes the compositor seam between frosted header and video. */
    padding-top:calc(var(--top-boundary) - 1px);
  }
}
.media-col{min-width:0;max-width:100%}
.stage{
  position:relative;
  margin:0 auto;
  background:#000;
  overflow:hidden;
}
.stage.pip-host{
  overflow:visible;
}
.player{
  position:absolute;
  overflow:hidden;
  background:#000;
}
.player > #videoFrame,
.player iframe{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}


/* VISUAL RULES BY MODE
   MAIN 1-col = square + no outer black
   PiP = rounded + no outer black
   2-col = rounded panel; landscape may letterbox inside, portrait has no black */
/* MAIN 1 cột:
   ngang chạm mép = vuông;
   dọc là một media card độc lập = bo thống nhất với PiP / 2 cột. */
html.one-col.landscape .stage,
html.one-col.landscape .player,
html.one-col.landscape .player iframe{
  border-radius:0;
  background:transparent;
}

html.one-col.portrait .stage,
html.one-col.portrait .player,
html.one-col.portrait .player iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}
html.one-col.portrait .stage,
html.one-col.portrait .player{
  overflow:hidden;
}

html.one-col .player.pip,
html.one-col .player.pip iframe{
  border-radius:var(--floating-radius);
  background:transparent;
}

html.two-col .stage,
html.two-col .player,
html.two-col .player iframe{
  border-radius:var(--floating-radius);
}

/* 1 COLUMN MAIN
   Landscape follows CURRENT WIDTH.
   Portrait follows CURRENT HEIGHT. */
html.one-col.landscape .stage{
  width:100%;
  max-width:none;
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.landscape .player{
  inset:0;
  width:100%;
  height:100%;
}

html.one-col.portrait .stage{
  width:min(100%,calc(var(--current-full-h) * var(--media-ratio)));
  height:auto;
  aspect-ratio:var(--media-ratio);
  background:transparent;
}
html.one-col.portrait .player{
  inset:0;
  width:100%;
  height:100%;
  transform:none;
}

/* PIP keeps the real media ratio and has no extra black gutter. */
html.one-col .player.pip{
  position:fixed !important;
  z-index:1000;
  transform:none !important;
  inset:auto !important;
  right:10px !important;
  top:calc(var(--visible-top-boundary,var(--top-boundary)) + 8px) !important;
  border-radius:var(--floating-radius);
  background:transparent;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}
html.one-col.landscape .player.pip{
  width:var(--pip-landscape-w);
  height:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col.portrait .player.pip{
  height:var(--pip-portrait-h);
  width:auto;
  aspect-ratio:var(--media-ratio);
}
html.one-col .player.pip iframe{border-radius:inherit}

/* 2 COLUMNS */
@media(min-width:1000px){
  html.two-col,
  html.two-col body{
    overflow-x:clip;
    overscroll-behavior-y:none;
  }

  html.two-col main{
    width:100%;
    max-width:none;
    display:grid;
    grid-template-columns:minmax(0,1fr) var(--two-col-media-w);
    grid-template-areas:"feed media";
    gap:var(--layout-gap);
    align-items:start;
    margin:0;
    padding:0 var(--layout-gap);
  }

  html.two-col .rows{
    grid-area:feed;
    min-width:0;
    padding:0;
    grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
    gap:var(--layout-gap);
  }

  html.two-col .media-col{
    grid-area:media;
    position:sticky;
    top:calc(var(--top-boundary) + var(--content-top-gap));
    align-self:start;
    height:var(--current-full-h);
    justify-self:end;
    min-width:0;
    margin-right:0;
    overflow:hidden;
  }

  /* 2-col landscape:
     Column width is derived from CURRENT HEIGHT × 16/9 (capped only to preserve the feed). The iframe fills the current-height viewing area, so YouTube
     itself letterboxes the 16:9 video and puts chrome in the black top/bottom. */
  html.two-col.landscape .media-col{
    width:var(--two-col-media-w);
  }
  html.two-col.landscape .stage{
    width:100%;
    height:var(--landscape-player-h);
    border-radius:var(--floating-radius);
    background:#000;
    overflow:hidden;
  }
  html.two-col.landscape .player,
  html.two-col.landscape .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:#000;
  }

  /* 2-col portrait:
     Column width is derived from CURRENT HEIGHT × 9/16, so there is no wasted side space. */
  html.two-col.portrait .media-col{
    width:var(--two-col-media-w);
    height:var(--current-full-h);
  }
  html.two-col.portrait .stage{
    width:100%;
    height:auto;
    aspect-ratio:var(--media-ratio);
    border-radius:var(--floating-radius);
    background:transparent;
    overflow:hidden;
  }
  html.two-col.portrait .player,
  html.two-col.portrait .player iframe{
    inset:0;
    width:100%;
    height:100%;
    transform:none;
    background:transparent;
  }
}
.info{
  padding:12px 16px 16px;
  border-bottom:1px solid #292929;
  container-type:inline-size;
  container-name:media-card;
}
.info-details{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 32px;
  gap:10px;
  align-items:start;
}
.info-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:#272727;
}
.info-avatar.placeholder{
  display:grid;
  place-items:center;
  color:#aaa;
  font:600 13px/36px Roboto,Arial,sans-serif;
  text-align:center;
}
.info-copy{min-width:0;padding:0}
.info-title{
  color:var(--yt-text);
  font:500 16px/21px Roboto,"Arial",sans-serif;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.info-meta{
  margin-top:2px;
  color:var(--yt-text-secondary);
  font:400 14px/19px Roboto,"Arial",sans-serif;
}
.info-meta-line{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:0;
  overflow:visible;
}
.info-source,
.info-facts{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.info-meta-sep{
  display:none;
  opacity:.9;
}
.info-meta-sep[hidden]{
  display:none!important;
}
.info-meta-line:empty{display:none}
.info-menu{
  width:32px;
  height:32px;
  margin-top:-5px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#f1f1f1;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.info-menu svg{width:24px;height:24px;fill:currentColor}
.info-menu:hover{background:var(--yt-hover)}
.info-menu:active{background:var(--yt-press)}
@media(max-width:656px){
  .info{padding:12px 12px 16px}
}
.rows{
  padding:0 var(--layout-gap);
  display:grid;
  grid-template-columns:repeat(var(--feed-cols),minmax(0,1fr));
  gap:var(--layout-gap);
}
.row{
  position:relative;
  margin:0;
  padding-bottom:24px;
  container-type:inline-size;
  container-name:media-card;
  min-width:0;
  background:transparent;
  overflow:visible;
  color:#aaa;
  cursor:pointer;
  border-radius:12px;
  -webkit-tap-highlight-color:transparent;
}
.row::before{
  content:"";
  position:absolute;
  inset:-12px;
  z-index:-1;
  border-radius:16px;
  background:transparent;
  transition:background-color .12s cubic-bezier(.4,0,1,1),transform .12s ease;
}
@media(hover:hover){
  .row:hover::before{background:rgba(255,255,255,.08)}
}
.row:active::before{
  background:rgba(255,255,255,.14);
  transform:scale(.985);
}
.row.selected::before{background:var(--yt-hover)}
.row-thumb{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:8px;
  background:#111;
}
.row-thumb img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .18s cubic-bezier(.2,0,0,1);
}
@media(hover:hover){
  .row:hover .row-thumb img{transform:scale(1.015)}
}
.duration-badge{
  position:absolute;
  right:4px;
  bottom:4px;
  min-height:18px;
  display:flex;
  align-items:center;
  padding:1px 4px;
  border-radius:4px;
  background:rgba(0,0,0,.80);
  color:#fff;
  font:500 12px/16px Roboto,Arial,sans-serif;
}
.duration-badge.live{
  background:#f00;
  font-weight:600;
}
.row-details{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 32px;
  gap:10px;
  align-items:start;
  padding:10px 0 0;
}
.row-avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:#272727;
}
.row-avatar.placeholder{
  display:grid;
  place-items:center;
  color:#aaa;
  font:600 13px/36px Roboto,Arial,sans-serif;
  text-align:center;
}
.row-copy{min-width:0;padding:0}
.row-title{
  color:var(--yt-text);
  font:500 16px/21px Roboto,"Arial",sans-serif;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.row-meta{
  margin-top:2px;
  color:var(--yt-text-secondary);
  font:400 14px/19px Roboto,"Arial",sans-serif;
}
.row-meta-line{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:0;
  overflow:visible;
}
.row-source,
.row-facts{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.row-meta-sep{
  display:none;
  opacity:.9;
}
.verified-badge{
  display:inline-flex;
  width:14px;
  height:14px;
  margin-left:4px;
  vertical-align:-2px;
  color:var(--yt-text-secondary);
  flex:0 0 auto;
}
.verified-badge svg{
  width:14px;
  height:14px;
  display:block;
  fill:currentColor;
}
.views-play-icon{
  display:inline-flex;
  width:14px;
  height:14px;
  margin-right:3px;
  vertical-align:-2px;
  color:var(--yt-text-secondary);
  flex:0 0 auto;
}
.views-play-icon svg{
  width:14px;
  height:14px;
  display:block;
  fill:currentColor;
}
.row-facts,
.info-facts{
  display:inline-flex;
  align-items:center;
  min-width:0;
}
.fact-views,
.fact-time,
.fact-sep{
  flex:0 0 auto;
}
.fact-sep{
  margin:0 4px;
}

.row-meta-line:empty{display:none}
.row-menu{
  width:32px;
  height:32px;
  margin-top:-5px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#f1f1f1;
  opacity:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.row-menu svg{width:24px;height:24px;fill:currentColor}
.row-menu:hover{background:var(--yt-hover)}
.row-menu:active{background:var(--yt-press)}
.row:hover .row-menu,
.row:focus-within .row-menu{opacity:1}
@media(hover:none){
  .row-menu{opacity:1}
}


@container media-card (min-width:360px){
  .row-meta-line,
  .info-meta-line{
    display:flex;
    align-items:center;
    gap:3px;
    overflow:hidden;
    white-space:nowrap;
  }
  .row-source,
  .info-source{
    flex:1 1 auto;
  }
  .row-facts,
  .info-facts{
    flex:0 0 auto;
  }
  .row-meta-sep,
  .info-meta-sep{
    display:inline;
    flex:0 0 auto;
  }
}

.state{display:none}
</style>
</head>
<body>

<script>
(() => {
  const VIDEOS={
    landscape:{id:"ypLlRC_2EFc",ratio:16/9,label:"Video ngang · 16:9"},
    portrait:{id:"kUF9P2m9mrg",ratio:9/16,label:"Video dọc · 9:16"}
  };
  const SOURCE_STATE_URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-state";
  const PACKAGE_SYNC_URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-packages";
  const VIDEO_META_URL="https://gcnoahqsrquxkwkjbuxy.supabase.co/functions/v1/yt1988-video-meta";

  const root=document.documentElement;
  const top=document.getElementById("top");
  const mediaCol=document.getElementById("mediaCol");
  const stage=document.getElementById("stage");
  const player=document.getElementById("player");
  const stateEl=document.getElementById("state");
  const titleEl=document.getElementById("videoTitle");
  const videoAvatarSlot=document.getElementById("videoAvatarSlot");
  const videoSourceEl=document.getElementById("videoSource");
  const videoFactsEl=document.getElementById("videoFacts");
  const videoMetaSep=document.getElementById("videoMetaSep");
  const videoMenu=document.getElementById("videoMenu");
  const layoutHint=document.getElementById("layoutHint");
  const searchInput=document.getElementById("searchInput");
  const voiceSearchButton=document.getElementById("voiceSearchButton");
  const searchButton=document.getElementById("searchButton");
  const searchToggle=document.getElementById("searchToggle");
  const searchBack=document.getElementById("searchBack");
  const sourcebar=document.getElementById("sourcebar");
  const sourceScroll=document.getElementById("sourceScroll");
  const sourceChips=document.getElementById("sourceChips");
  const sourcePrev=document.getElementById("sourcePrev");
  const sourceNext=document.getElementById("sourceNext");
  const sourceNameChips=document.getElementById("sourceNameChips");
  const themeColorMeta=document.getElementById("themeColorMeta");

  let current={id:"",kind:"landscape",ratio:16/9,detectedRatio:0,label:""};
  let pip=false;
  let raf=0;
  let metaRequest=0;
  let currentMeta=null;
  let feedMetas=[];
  let relatedMetas=[];
  let feedRequest=0;
  let feedMode="package";
  let activePackageScope="live";
  let packageManifest={};
  const packageCache=new Map();
  const packagePending=new Map();

  // Search is independent from source tabs. Keep only the 2 most recent
  // queries/results so repeats can paint immediately without another click.
  const SEARCH_RECENT_KEY="yt1988-proof-recent-searches-v1";
  const searchCache=new Map();
  let recentSearches=[];
  const SpeechRecognitionCtor=window.SpeechRecognition||window.webkitSpeechRecognition||null;
  let voiceRecognition=null;
  let voiceListening=false;
  if(voiceSearchButton)voiceSearchButton.hidden=!SpeechRecognitionCtor;
  try{
    const saved=JSON.parse(localStorage.getItem(SEARCH_RECENT_KEY)||"[]");
    if(Array.isArray(saved))recentSearches=saved.map(String).filter(Boolean).slice(0,2);
  }catch{}

  // Aspect belongs to the media id, never to the previous UI mode.
  const mediaAspectCache=new Map();
  const STANDARD_MEDIA_ASPECTS=[
    1,
    4/3,3/4,
    5/4,4/5,
    3/2,2/3,
    16/10,10/16,
    16/9,9/16,
    21/9,9/21
  ];
  const columnsMq=matchMedia("(min-width:1000px)");
  const mobileHeaderMq=matchMedia("(max-width:656px)");
  let mobileHeaderLastY=0;
  let mobileHeaderHidden=false;
  let headerRoomy=false;

  let ytPlayer=null;
  let ytPlayerReady=false;
  let pendingVideoId="";
  let youtubeApiPromise=null;

  // Server owns media aspect by video id; YouTube videoContentRect only
  // confirms/corrects the server cache after playback.
  const aspectPrimeCache=new Map();
  const aspectPrimePending=new Map();
  const aspectCorrectionSent=new Map();
  const sourceIdentityCache=new Map();
  const sourceIdentityPending=new Map();

  function validMediaAspect(value){
    const ratio=Number(value)||0;
    if(!Number.isFinite(ratio)||ratio<.34||ratio>2.6)return 0;

    let nearest=ratio;
    let delta=Infinity;
    for(const standard of STANDARD_MEDIA_ASPECTS){
      const next=Math.abs(standard-ratio);
      if(next<delta){
        nearest=standard;
        delta=next;
      }
    }
    return delta<=.05?nearest:ratio;
  }



  function cachedMediaAspect(id,{verifiedOnly=false}={}){
    const row=mediaAspectCache.get(String(id||"").trim());
    if(verifiedOnly&&row?.verified!==true)return 0;
    return validMediaAspect(row?.value);
  }

  function mediaAspectFromMeta(meta={}){
    if(!meta||typeof meta!=="object")return 0;
    if(meta.isShort===true)return 9/16;

    const direct=validMediaAspect(
      Number(meta.aspectRatio)||
      Number(meta.videoAspectRatio)||
      Number(meta.contentAspectRatio)||
      0
    );
    if(direct)return direct;

    const w=Number(meta.videoWidth||meta.width)||0;
    const h=Number(meta.videoHeight||meta.height)||0;
    return w>0&&h>0?validMediaAspect(w/h):0;
  }

  function rememberMediaAspect(id,ratio,source="",verified=false){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio)return 0;

    // Only the actual YouTube player content rectangle is allowed to define
    // media kind. Everything else is presentation/data only.
    if(source!=="iframe-content-rect"||verified!==true){
      return cachedMediaAspect(id)||0;
    }

    mediaAspectCache.set(id,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    return ratio;
  }

  function cachedPrimedAspect(id){
    const entry=aspectPrimeCache.get(String(id||"").trim());
    return validMediaAspect(entry?.value);
  }

  function applyServerAspectRow(id,row){
    id=String(id||"").trim();
    const ratio=validMediaAspect(row?.aspectRatio);
    if(!id||!ratio)return 0;

    aspectPrimeCache.set(id,{
      value:ratio,
      source:String(row?.aspectSource||"server"),
      verified:row?.aspectVerified===true,
      at:Date.now()
    });

    if(row?.aspectVerified===true){
      mediaAspectCache.set(id,{
        value:ratio,
        source:String(row?.aspectSource||"server"),
        verified:true,
        at:Date.now()
      });
    }
    return ratio;
  }

  function fetchServerAspects(ids=[],resolve=true){
    const unique=[...new Set(
      (Array.isArray(ids)?ids:[])
        .map(value=>String(value||"").trim())
        .filter(Boolean)
    )].slice(0,24);
    if(!unique.length)return Promise.resolve({});

    const url=VIDEO_META_URL+
      "?ids="+encodeURIComponent(unique.join(","))+
      (resolve?"&resolve=1":"");

    return fetch(url,{cache:"no-store"})
      .then(response=>{
        if(!response.ok)throw new Error("aspect_http_"+response.status);
        return response.json();
      })
      .then(payload=>{
        const data=payload?.data&&typeof payload.data==="object"?payload.data:{};
        for(const id of unique){
          if(data[id])applyServerAspectRow(id,data[id]);
        }
        return data;
      })
      .catch(()=>({}));
  }

  function primeMediaAspect(id){
    id=String(id||"").trim();
    if(!id)return Promise.resolve(0);

    const cached=cachedPrimedAspect(id);
    if(cached)return Promise.resolve(cached);
    if(aspectPrimePending.has(id))return aspectPrimePending.get(id);

    const task=fetchServerAspects([id],true)
      .then(data=>validMediaAspect(data?.[id]?.aspectRatio)||cachedPrimedAspect(id)||0)
      .finally(()=>aspectPrimePending.delete(id));

    aspectPrimePending.set(id,task);
    return task;
  }

  function primeMediaAspects(metas=[],limit=18){
    const list=(Array.isArray(metas)?metas:[])
      .filter(meta=>meta?.id)
      .slice(0,Math.max(0,limit));

    // Package/search metadata from the server is authoritative for first paint.
    for(const meta of list){
      const ratio=mediaAspectFromMeta(meta);
      if(ratio){
        const id=String(meta.id);
        aspectPrimeCache.set(id,{
          value:ratio,
          source:String(meta?._aspectSource||"server-package"),
          verified:meta?._aspectVerified===true,
          at:Date.now()
        });
        if(meta?._aspectVerified===true){
          mediaAspectCache.set(id,{
            value:ratio,
            source:String(meta?._aspectSource||"server-package"),
            verified:true,
            at:Date.now()
          });
        }
      }
    }

    const missing=list
      .map(meta=>String(meta.id||""))
      .filter(id=>id&&!cachedPrimedAspect(id));

    if(!missing.length)return;

    // One background batch for the whole visible list. Click never waits on it.
    const run=()=>{ void fetchServerAspects(missing,true); };
    if("requestIdleCallback" in window){
      requestIdleCallback(run,{timeout:180});
    }else{
      setTimeout(run,0);
    }
  }

  function mediaLayoutKindFromRatio(ratio){
    ratio=validMediaAspect(ratio)||16/9;
    return ratio<1?"portrait":"landscape";
  }

  function applyMediaLayoutSelection(kind,{relayout=true}={}){
    kind=kind==="portrait"?"portrait":"landscape";
    const canonical=kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio;

    current={
      ...current,
      kind,
      ratio:canonical
    };

    // Current media owns this binary layout state directly.
    root.dataset.mediaShape=kind;
    root.style.setProperty("--media-ratio",String(canonical));

    if(relayout){
      layout();
      schedulePip();
    }
    return kind;
  }

  function commitCurrentAspect(id,ratio,{relayout=true}={}){
    id=String(id||"").trim();
    ratio=validMediaAspect(ratio);
    if(!id||!ratio||String(current?.id||"")!==id)return false;

    const kind=mediaLayoutKindFromRatio(ratio);
    const changed=current?.kind!==kind;

    current={
      ...current,
      detectedRatio:ratio
    };
    applyMediaLayoutSelection(kind,{relayout:changed&&relayout});
    return changed;
  }

  const headerColorCache=new Map();

  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    let h=0,s=0;
    const l=(max+min)/2;
    const d=max-min;
    if(d){
      s=d/(1-Math.abs(2*l-1));
      if(max===r)h=((g-b)/d)%6;
      else if(max===g)h=(b-r)/d+2;
      else h=(r-g)/d+4;
      h*=60;
      if(h<0)h+=360;
    }
    return [h,s,l];
  }

  function hslToRgb(h,s,l){
    const cc=(1-Math.abs(2*l-1))*s;
    const x=cc*(1-Math.abs((h/60)%2-1));
    const m=l-cc/2;
    let rr=0,gg=0,bb=0;
    if(h<60){rr=cc;gg=x}
    else if(h<120){rr=x;gg=cc}
    else if(h<180){gg=cc;bb=x}
    else if(h<240){gg=x;bb=cc}
    else if(h<300){rr=x;bb=cc}
    else{rr=cc;bb=x}
    return [rr,gg,bb].map(v=>Math.round((v+m)*255));
  }

  function youtubeCinematicPalette(url){
    url=String(url||"").trim();
    if(!url)return Promise.resolve(null);
    if(headerColorCache.has(url))return headerColorCache.get(url);

    const task=new Promise(resolve=>{
      const img=new Image();
      img.crossOrigin="anonymous";
      img.decoding="async";
      img.onload=()=>{
        try{
          const w=24,h=14;
          const canvas=document.createElement("canvas");
          canvas.width=w;canvas.height=h;
          const ctx=canvas.getContext("2d",{willReadFrequently:true});
          if(!ctx){resolve(null);return;}
          ctx.drawImage(img,0,0,w,h);
          const data=ctx.getImageData(0,0,w,h).data;
          const buckets=new Map();

          for(let y=0;y<h;y++)for(let x=0;x<w;x++){
            const i=(y*w+x)*4;
            if(data[i+3]<128)continue;
            const r=data[i],g=data[i+1],b=data[i+2];
            const lum=.2126*r+.7152*g+.0722*b;
            if(lum<24||lum>238)continue;
            const max=Math.max(r,g,b),min=Math.min(r,g,b);
            const sat=max?((max-min)/max):0;
            const nx=(x-(w-1)/2)/(w/2),ny=(y-(h-1)/2)/(h/2);
            const center=1+Math.max(0,1-Math.sqrt(nx*nx+ny*ny))*.55;
            const weight=center*(.45+sat*1.65);
            const key=((r>>5)<<6)|((g>>5)<<3)|(b>>5);
            const row=buckets.get(key)||{r:0,g:0,b:0,w:0};
            row.r+=r*weight;row.g+=g*weight;row.b+=b*weight;row.w+=weight;
            buckets.set(key,row);
          }

          let winner=null;
          for(const row of buckets.values()){
            if(!winner||row.w>winner.w)winner=row;
          }
          if(!winner||winner.w<=0){resolve(null);return;}

          const source=[winner.r/winner.w,winner.g/winner.w,winner.b/winner.w].map(Math.round);
          const hsl=rgbToHsl(source[0],source[1],source[2]);
          hsl[1]=Math.max(.42,Math.min(.88,hsl[1]*1.08));
          hsl[2]=Math.max(.48,Math.min(.68,hsl[2]));
          const accent=hslToRgb(hsl[0],hsl[1],hsl[2]);
          const base=[15,15,15];
          const surface=base.map((v,i)=>Math.round(v*.6+accent[i]*.4));
          resolve({accent,surface});
        }catch{
          resolve(null);
        }
      };
      img.onerror=()=>resolve(null);
      img.src=url;
    });

    headerColorCache.set(url,task);
    return task;
  }

  let headerTintSeq=0;
  function applyHeaderTint(meta=currentMeta){
    const art=String(
      meta?.thumbnail||
      meta?.thumbnailUrl||
      meta?.poster||
      ""
    ).trim();
    if(!/^https?:\/\//i.test(art))return;

    const seq=++headerTintSeq;
    void youtubeCinematicPalette(art).then(palette=>{
      if(seq!==headerTintSeq||!palette)return;

      // Same composition as the main app:
      // palette.surface already contains 40% accent, then chrome keeps 32%
      // of that surface over #0f0f0f -> ~12.8% effective video tint.
      const base=[15,15,15];
      const mix=.32;
      const [r,g,b]=palette.surface.map((value,index)=>Math.round(
        base[index]*(1-mix)+value*mix
      ));
      root.style.setProperty("--header-rgb",r+","+g+","+b);
      root.style.setProperty(
        "--header-accent-rgb",
        palette.accent.join(",")
      );

      // Do NOT paint browser/PWA status chrome with the media color.
      // Keeping this neutral avoids a persistent colored notch strip while
      // the in-page header itself scrolls away underneath black-translucent.
      if(themeColorMeta){
        themeColorMeta.setAttribute("content","rgba(33,33,33,.98)");
      }
    });
  }

  function youtubeContentRect(player=ytPlayer){
    const candidates=[
      player?.playerInfo?.videoContentRect,
      player?.videoContentRect,
      player?.playerInfo?.video_content_rect
    ];

    for(const rect of candidates){
      const width=Number(rect?.width)||0;
      const height=Number(rect?.height)||0;
      if(width<=0||height<=0)continue;

      const aspectRatio=validMediaAspect(width/height);
      if(!aspectRatio)continue;
      return {width,height,aspectRatio};
    }
    return null;
  }

  function reportVerifiedAspect(id,rect){
    id=String(id||"").trim();
    const ratio=validMediaAspect(rect?.aspectRatio);
    if(!id||!ratio)return;

    const signature=[
      ratio.toFixed(5),
      Math.round(Number(rect?.width)||0),
      Math.round(Number(rect?.height)||0)
    ].join(":");
    if(aspectCorrectionSent.get(id)===signature)return;
    aspectCorrectionSent.set(id,signature);

    void fetch(VIDEO_META_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        videoId:id,
        aspectRatio:ratio,
        width:Math.round(Number(rect?.width)||0),
        height:Math.round(Number(rect?.height)||0)
      }),
      keepalive:true
    }).catch(()=>{});
  }

  function syncCurrentKindFromYoutubePlayer(player=ytPlayer){
    if(!player||!current?.id)return false;

    const expectedId=String(current.id||"").trim();
    let loadedId="";
    try{
      const data=player.getVideoData?.()||{};
      loadedId=String(data.video_id||data.videoId||"").trim();
    }catch{}

    // During loadVideoById() YouTube can briefly expose the previous video's rect.
    // Accept geometry only after YouTube explicitly reports THIS media id.
    if(!loadedId||loadedId!==expectedId)return false;

    const rect=youtubeContentRect(player);
    if(!rect)return false;

    const ratio=rememberMediaAspect(
      expectedId,
      rect.aspectRatio,
      "iframe-content-rect",
      true
    );
    if(!ratio)return false;

    commitCurrentAspect(expectedId,ratio,{relayout:true});
    aspectPrimeCache.set(expectedId,{
      value:ratio,
      source:"iframe-content-rect",
      verified:true,
      at:Date.now()
    });
    reportVerifiedAspect(expectedId,rect);
    return true;
  }

  function scheduleCurrentPlayerKind(player=ytPlayer){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const attempt=()=>{
      if(String(current?.id||"").trim()!==id)return;
      syncCurrentKindFromYoutubePlayer(player);
    };

    attempt();
    [90,260,700,1400,2600,4500].forEach(delay=>setTimeout(attempt,delay));
  }

  function configurePlayerIframe(player=ytPlayer){
    try{
      const iframe=player?.getIframe?.();
      if(!iframe)return;
      iframe.setAttribute("allowfullscreen","");
      iframe.setAttribute("webkitallowfullscreen","");
      iframe.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture; fullscreen"
      );
      iframe.referrerPolicy="strict-origin-when-cross-origin";
      iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    }catch{}
  }

  function loadYoutubeIframeApi(){
    if(window.YT&&typeof window.YT.Player==="function"){
      return Promise.resolve(window.YT);
    }
    if(youtubeApiPromise)return youtubeApiPromise;

    youtubeApiPromise=new Promise(resolve=>{
      const previous=window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady=()=>{
        try{previous?.()}catch{}
        resolve(window.YT||null);
      };

      if(!document.querySelector('script[src*="youtube.com/iframe_api"]')){
        const script=document.createElement("script");
        script.src="https://www.youtube.com/iframe_api";
        script.async=true;
        document.head.appendChild(script);
      }

      const started=Date.now();
      const timer=setInterval(()=>{
        if(window.YT&&typeof window.YT.Player==="function"){
          clearInterval(timer);
          resolve(window.YT);
        }else if(Date.now()-started>10000){
          clearInterval(timer);
          resolve(null);
        }
      },80);
    });
    return youtubeApiPromise;
  }

  async function ensureYoutubePlayer(){
    if(ytPlayer)return ytPlayer;

    const YTApi=await loadYoutubeIframeApi();
    if(!YTApi?.Player||ytPlayer)return ytPlayer;

    ytPlayer=new YTApi.Player("videoFrame",{
      host:"https://www.youtube-nocookie.com",
      width:"100%",
      height:"100%",
      playerVars:{
        autoplay:1,
        playsinline:1,
        controls:1,
        cc_load_policy:0,
        rel:0,
        fs:1,
        disablekb:0,
        modestbranding:1,
        iv_load_policy:3,
        enablejsapi:1,
        origin:location.origin,
        widget_referrer:location.href
      },
      events:{
        onReady(event){
          ytPlayerReady=true;
          configurePlayerIframe(event.target);

          const id=String(pendingVideoId||current?.id||"").trim();
          pendingVideoId="";
          if(!id)return;

          try{
            event.target.loadVideoById(id);
            event.target.playVideo?.();
          }catch{}
        },
        onStateChange(event){
          if(event.data===YTApi.PlayerState.PLAYING){
            scheduleCurrentPlayerKind(event.target);
          }
        }
      }
    });

    return ytPlayer;
  }

  function playVideoId(id,meta=null,{history="none"}={}){
    id=String(id||"").trim();
    if(!id)return false;

    const confirmedRatio=
      mediaAspectCache.get(id)?.source==="iframe-content-rect"
        ?cachedMediaAspect(id,{verifiedOnly:true})
        :0;
    const metaRatio=mediaAspectFromMeta(meta||{});
    const primedRatio=cachedPrimedAspect(id);

    // Never delay the click. The list should already have primed this media.
    // If data is still missing, preserve the current shell instead of forcing
    // a new temporary 16:9 state.
    const fallbackRatio=
      validMediaAspect(current?.detectedRatio)||
      (current?.kind==="portrait"?9/16:16/9);

    const resolvedAspect=
      confirmedRatio||
      metaRatio||
      primedRatio||
      fallbackRatio;

    const kind=mediaLayoutKindFromRatio(resolvedAspect);

    if(meta?.id===id){
      currentMeta=meta;
      applyHeaderTint(meta);
    }else if(String(current?.id||"")!==id){
      currentMeta=null;
    }

    // media -> kind; MAIN / PiP / 2-column only consume it.
    current={
      id,
      kind,
      ratio:kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio,
      detectedRatio:resolvedAspect,
      label:meta?.title||"Video"
    };
    applyMediaLayoutSelection(kind,{relayout:true});
    if(history==="push"){
      syncVideoDocumentIdentity({push:true});
    }else if(history==="replace"){
      syncVideoDocumentIdentity({push:false});
    }else{
      syncVideoDocumentIdentity({push:false,write:false});
    }
    if(!currentMeta?.sourceAvatar){
      void hydrateCurrentSourceIdentity(id);
    }

    // PLAY IMMEDIATELY. No await, no cue, no pre-click wait.
    pendingVideoId=id;
    void ensureYoutubePlayer().then(playerApi=>{
      if(!playerApi||String(current?.id||"")!==id)return;
      if(!ytPlayerReady)return;

      pendingVideoId="";
      try{
        playerApi.loadVideoById(id);
        playerApi.playVideo?.();
      }catch{}
    });

    // Only fill a missing cache in parallel. Never block the click.
    if(!confirmedRatio&&!metaRatio&&!primedRatio){
      void primeMediaAspect(id).then(ratio=>{
        if(!ratio||String(current?.id||"")!==id)return;
        if(mediaAspectCache.get(id)?.source==="iframe-content-rect")return;
        commitCurrentAspect(id,ratio,{relayout:true});
      });
    }

    return true;
  }

  function wrappedTextLines(text,maxWidth,font){
    const canvas=wrappedTextLines.canvas||(wrappedTextLines.canvas=document.createElement("canvas"));
    const ctx=canvas.getContext("2d");
    if(!ctx)return 1;
    ctx.font=font;

    const words=String(text||"").trim().split(/\s+/).filter(Boolean);
    if(!words.length)return 1;

    let lines=1;
    let line="";
    for(const word of words){
      const next=line?line+" "+word:word;
      if(line && ctx.measureText(next).width>maxWidth){
        lines+=1;
        line=word;
        if(lines>=2)return 2;
      }else{
        line=next;
      }
    }
    return lines;
  }

  function measureLandscapeChrome(mediaW){
    const title=currentMeta?.title || current.label || "";
    const source=currentMeta?.sourceName || "";

    // Approximate YouTube's own top overlay from the real title length and
    // the CURRENT player width. Cross-origin iframe DOM itself cannot be read.
    const titleFont=mediaW<560?14:(mediaW<900?16:18);
    const titleLineH=Math.round(titleFont*1.22);
    const reservedRight=mediaW<560?104:148; // sound / CC / settings
    const reservedLeft=mediaW<560?48:58;    // avatar + left padding
    const titleWidth=Math.max(120,mediaW-reservedLeft-reservedRight);
    const titleLines=wrappedTextLines(
      title,
      titleWidth,
      "700 "+titleFont+"px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
    );

    const avatar=mediaW<560?32:40;
    const sourceH=source?Math.round(titleFont*.82):0;
    const titleBlock=titleLines*titleLineH+sourceH;
    // YouTube embed source keeps player content below roughly 60px at top.
    const topSafe=Math.max(60,Math.ceil(10+Math.max(avatar,titleBlock)+8));

    // Source: ytp-embed player content bottom ~=53px; modern controls can grow
    // toward ~72px, so keep that as a narrow bounded range.
    const bottomSafe=Math.round(Math.max(53,Math.min(72,53+mediaW*.018)));

    return {topSafe,bottomSafe,titleLines};
  }

  function chooseCardColumns(feedW,gap){
    // YouTube source family: normal rich cards roughly 270..500px,
    // skeleton flex-basis around 310px. Pick a count near 310 without
    // allowing cards to drift outside the 270..500 band.
    const MIN=270;
    const TARGET=310;
    const MAX=500;

    const maxCols=Math.max(1,Math.floor((feedW+gap)/(MIN+gap)));
    const minCols=Math.max(1,Math.ceil((feedW+gap)/(MAX+gap)));
    const targetCols=Math.max(1,Math.round((feedW+gap)/(TARGET+gap)));

    return Math.max(minCols,Math.min(maxCols,targetCols));
  }

  function syncBoundaries(){
    const mediaRatio=current?.kind==="portrait"?VIDEOS.portrait.ratio:VIDEOS.landscape.ratio;
    root.style.setProperty("--media-ratio",String(mediaRatio));

    // Measure the CURRENT usable viewport, not svh/vw estimates.
    const topBoundary=Math.max(
      0,
      Math.round(top.offsetHeight || top.getBoundingClientRect().height || 0)
    );
    const viewportH=Math.max(
      topBoundary+1,
      Math.round(document.documentElement.clientHeight || innerHeight || 1)
    );
    const bottomGap=8;
    const contentTopGap=12;
    const fullH=Math.max(1,viewportH-topBoundary-contentTopGap-bottomGap);

    root.style.setProperty("--top-boundary",topBoundary+"px");
    if(!root.style.getPropertyValue("--visible-top-boundary")){
      root.style.setProperty("--visible-top-boundary",topBoundary+"px");
    }
    root.style.setProperty("--bottom-gap",bottomGap+"px");
    root.style.setProperty("--current-full-h",fullH+"px");

    // PiP also follows its CURRENT available size:
    // landscape owns width, portrait owns height.
    const viewportW=Math.max(1,Math.round(document.documentElement.clientWidth || innerWidth || 1));
    const pipLandscapeW=Math.max(170,Math.min(280,Math.round(viewportW*.46)));
    const pipPortraitH=Math.max(240,Math.min(420,Math.round(fullH*.50)));

    root.style.setProperty("--pip-landscape-w",pipLandscapeW+"px");
    root.style.setProperty("--pip-portrait-h",pipPortraitH+"px");

    // YOUTUBE-SOURCE GEOMETRY
    // - two-column threshold: 1000px
    // - horizontal page margin/gap: 16px
    // - sidebar width percentage buckets: 22.5 / 27.5 / 32.5
    // - sidebar min 320px, max 800px, never above 40%
    // - normal card family: 270..500px, target ~310px
    const pageW=viewportW;
    const gap=viewportW<480?8:(viewportW<1000?12:16);
    root.style.setProperty("--layout-gap",gap+"px");
    root.style.setProperty("--card-target-w","310px");

    if(!isTwoColumn()){
      const feedW=Math.max(1,viewportW-(gap*2));
      const cols=chooseCardColumns(feedW,gap);
      root.style.setProperty("--feed-cols",String(cols));
    }else{
      const contentW=Math.max(1,pageW-(gap*2));

      // YouTube's variable sidebar-width buckets, applied to OUR left feed.
      const sidebarPct=viewportW>=1900?0.325:(viewportW>=1550?0.275:0.225);
      const sidebarMax=Math.min(800,contentW*0.40);
      const desiredFeedW=Math.max(320,Math.min(sidebarMax,contentW*sidebarPct));

      let mediaW;
      let landscapeChrome=null;

      if(current.ratio>1){
        // LANDSCAPE gets the remaining width after the source-sized feed.
        let widthCap=Math.max(1,contentW-gap-desiredFeedW);

        // Fit width to the current height after reserving source-derived
        // title/control safe zones.
        landscapeChrome=measureLandscapeChrome(widthCap);
        let safeBar=Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe);
        let heightDrivenW=Math.max(
          1,
          Math.round(Math.max(1,fullH-(safeBar*2))*current.ratio)
        );
        mediaW=Math.min(widthCap,heightDrivenW);

        // Re-measure after final width because title wrapping can change.
        landscapeChrome=measureLandscapeChrome(mediaW);
        const extraLandscapeBlack=8;
        const finalSafeBar=
          Math.max(landscapeChrome.topSafe,landscapeChrome.bottomSafe)+
          extraLandscapeBlack;
        const videoH=mediaW/current.ratio;
        const playerH=Math.min(fullH,Math.ceil(videoH+(finalSafeBar*2)));

        root.style.setProperty("--landscape-player-h",playerH+"px");
        root.style.setProperty(
          "--landscape-top-safe",
          (landscapeChrome.topSafe+extraLandscapeBlack)+"px"
        );
        root.style.setProperty(
          "--landscape-bottom-safe",
          (landscapeChrome.bottomSafe+extraLandscapeBlack)+"px"
        );
      }else{
        // PORTRAIT stays height-driven. Never stretch it just to fill a column.
        mediaW=Math.min(
          Math.round(fullH*current.ratio),
          Math.max(1,contentW-gap-320)
        );
      }

      // Whatever media does not need is returned to the feed.
      const feedW=Math.max(1,contentW-gap-mediaW);
      const cols=chooseCardColumns(feedW,gap);

      root.style.setProperty("--two-col-media-w",Math.round(mediaW)+"px");
      root.style.setProperty("--feed-cols",String(cols));
    }
  }

  function dataRow(payload){
    const data=payload?.data ?? payload;
    if(!data)return {};
    if(Array.isArray(data))return data[0]||{};
    return (
      data.video ||
      data.videoDetails ||
      data.details ||

  function escapeHtml(value=""){
    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function videoTitleSlug(value=""){
    return String(value||"")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[đĐ]/g,match=>match==="Đ"?"D":"d")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g,"-")
      .replace(/^-+|-+$/g,"")
      .replace(/-+/g,"-")
      .slice(0,88)
      .replace(/-+$/,"");
  }

  function routeVideoId(){
    const hash=decodeURIComponent(String(location.hash||""));
    const fromHash=hash.match(/(?:^|\/)watch\/.*?([A-Za-z0-9_-]{11})$/i)?.[1]||
      hash.match(/([A-Za-z0-9_-]{11})$/)?.[1]||
      "";
    if(fromHash)return fromHash;

    try{
      const legacy=new URLSearchParams(location.search).get("v")||"";
      if(/^[A-Za-z0-9_-]{11}$/.test(legacy))return legacy;
    }catch{}
    return "";
  }

  function historyVideoId(state=history.state){
    const id=String(state?.videoId||"").trim();
    return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
  }

  function videoHistoryState(id,title=""){
    return {
      yt1988:"video",
      videoId:String(id||"").trim(),
      title:String(title||"").trim(),
      scope:String(activePackageScope||""),
      feedMode:String(feedMode||"")
    };
  }

  function canonicalVideoHash(id,title=""){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return "";

    const cleanTitle=String(title||"").trim();
    const slug=
      cleanTitle && cleanTitle.toLowerCase()!=="video"
        ? videoTitleSlug(cleanTitle)
        : "";

    return "#/watch/"+(slug?slug+"-":"")+id;
  }

  function syncVideoDocumentIdentity({push=false,write=true}={}){
    const id=String(current?.id||"").trim();
    if(!id)return;

    const title=String(currentMeta?.title||current?.label||"").trim();
    const meaningfulTitle=title&&title.toLowerCase()!=="video"?title:"";
    document.title=meaningfulTitle?meaningfulTitle+" · 1988":"1988";
    if(!write)return;

    const stateId=historyVideoId();
    const routeId=routeVideoId();
    const existingId=stateId||routeId;
    const currentHash=String(location.hash||"");
    const hasCanonicalHash=/^#\/watch\//i.test(currentHash);

    // A direct/deep link is also a real video history entry. Keep its readable
    // slug while metadata is still loading, but mark the browser state now.
    if(
      existingId===id &&
      hasCanonicalHash &&
      !meaningfulTitle
    ){
      if(stateId!==id){
        history.replaceState(
          videoHistoryState(id,""),
          "",
          location.pathname+location.search+location.hash
        );
      }
      return;
    }

    const nextHash=canonicalVideoHash(id,meaningfulTitle);
    if(!nextHash)return;

    const nextUrl="/"+nextHash;
    const nextState=videoHistoryState(id,meaningfulTitle);

    // User-selected videos become separate browser-history entries.
    // Metadata/title refreshes only rewrite the current entry.
    if(push&&existingId!==id){
      history.pushState(nextState,"",nextUrl);
      return;
    }

    if(
      stateId!==id ||
      location.pathname!=="/" ||
      location.search ||
      currentHash!==nextHash
    ){
      history.replaceState(nextState,"",nextUrl);
    }
  }

  function navigateToVideo(id,meta=null,{replace=false}={}){
    id=String(id||"").trim();
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return false;

    const previousId=historyVideoId()||routeVideoId();
    const title=String(meta?.title||"").trim();
    const nextHash=canonicalVideoHash(id,title);
    if(!nextHash)return false;

    // The first media in this document establishes the current browser entry.
    // Every later user-selected media gets its own entry, so Back/Forward is
    // always video <-> video instead of falling into an empty same-page route.
    const state=videoHistoryState(id,title);
    if(replace||!previousId){
      history.replaceState(state,"","/"+nextHash);
    }else if(previousId!==id){
      history.pushState(state,"","/"+nextHash);
    }else{
      history.replaceState(state,"","/"+nextHash);
    }

    return playVideoId(id,meta,{history:"none"});
  }

  function metaForVideoId(id){
    id=String(id||"").trim();
    return (
      feedMetas.find(meta=>meta?.id===id)||
      relatedMetas.find(meta=>meta?.id===id)||
      [...packageCache.values()].flat().find(meta=>meta?.id===id)||
      null
    );
  }

  function openVideoFromLocation(state=history.state){
    const id=historyVideoId(state)||routeVideoId();
    if(!id){
      // Compatibility with legacy empty app entries created by older builds.
      // Do not leave the same video on screen under a route with no video.
      if(String(current?.id||"")){
        queueMicrotask(()=>history.back());
      }
      return false;
    }
    if(id===String(current?.id||""))return false;

    const meta=metaForVideoId(id);
    // Browser Back/Forward owns the selected entry. Replay it only; never
    // create or replace history while traversing.
    if(!playVideoId(id,meta,{history:"none"}))return false;
    renderCurrentInfo();
    loadCurrentVideoMeta();
    schedulePip();
    return true;
  }

  function cardVerified(row={}){
    return row?.verified===true ||
      row?.isVerified===true ||
      row?.author?.verified===true ||
      row?.uploaderVerified===true;
  }

  function cardMetaFromRow(row={}){
    const meta=window.MediaMeta?.video ? window.MediaMeta.video(row) : {};
    const videoWidth=Number(row?.videoWidth)||0;
    const videoHeight=Number(row?.videoHeight)||0;
    const genericWidth=Number(row?.width)||0;
    const genericHeight=Number(row?.height)||0;
    const isShort=row?.isShort===true||row?.is_short===true;
    const aspectRatio=validMediaAspect(
      (isShort?9/16:0)||
      Number(row?.aspectRatio)||
      Number(row?.videoAspectRatio)||
      (
        videoWidth>0&&videoHeight>0
          ?videoWidth/videoHeight
          :0
      )||
      (
        genericWidth>0&&genericHeight>0
          ?genericWidth/genericHeight
          :0
      )
    );
    return {
      ...meta,
      verified:cardVerified(row),
      isShort,
      videoWidth,
      videoHeight,
      aspectRatio,
      mediaKind:String(row?.mediaKind||""),
      _aspectVerified:
        row?._aspectVerified===true||
        (videoWidth>0&&videoHeight>0)||
        isShort,
      _aspectSource:String(row?.aspectSource||row?._aspectSource||"")
    };
  }

  function mergeSelectedMeta(base={},supplemental={}){
    const keep=(key)=>{
      const value=base?.[key];
      return value!==undefined&&value!==null&&value!=="";
    };

    // Supplemental data fills gaps; only meaningful selected-card fields
    // are protected below. Empty strings from the old card must not erase
    // sourceId/avatar/channel metadata returned by the video lookup.
    const merged={...base,...supplemental};

    // The selected package/search card is the visible contract.
    // Direct video lookup may fill gaps, but must not rename/relabel it.
    for(const key of [
      "title","sourceName","sourceAvatar","thumbnail",
      "viewsLabel","publishedLabel","durationLabel",
      "isLive","verified","mediaKind","aspectRatio",
      "videoWidth","videoHeight","_aspectVerified","_aspectSource"
    ]){
      if(keep(key))merged[key]=base[key];
    }

    return merged;
  }

  function applySourceIdentityToVideo(id,identity={}){
    id=String(id||"").trim();
    const avatar=String(identity?.sourceAvatar||"").trim();
    const name=String(identity?.sourceName||"").trim();
    if(!id||(!avatar&&!name))return false;

    const patchMeta=(meta)=>{
      if(!meta||String(meta.id||"").trim()!==id)return;
      if(avatar&&!meta.sourceAvatar)meta.sourceAvatar=avatar;
      if(name&&!meta.sourceName)meta.sourceName=name;
    };

    patchMeta(currentMeta);
    for(const meta of feedMetas)patchMeta(meta);
    for(const meta of relatedMetas)patchMeta(meta);
    for(const metas of packageCache.values()){
      for(const meta of metas)patchMeta(meta);
    }
    for(const metas of searchCache.values()){
      for(const meta of metas)patchMeta(meta);
    }

    if(String(current?.id||"")===id){
      renderCurrentInfo();
      applyHeaderTint(currentMeta);
    }

    if(avatar){
      document.querySelectorAll(".row[data-video-id]").forEach(row=>{
        if(String(row.dataset.videoId||"")!==id)return;
        const oldAvatar=row.querySelector(".row-avatar");
        if(!oldAvatar)return;
        oldAvatar.outerHTML=
          '<img class="row-avatar" src="'+escapeHtml(avatar)+'" alt="">';
      });
    }
    return true;
  }

  async function hydrateCurrentSourceIdentity(id=String(current?.id||"")){
    id=String(id||"").trim();
    if(!id||String(current?.id||"")!==id)return false;

    const meta=currentMeta||{};
    if(meta.sourceAvatar)return true;

    const sourceId=String(meta.sourceId||"").trim();
    if(!/^UC[A-Za-z0-9_-]{20,}$/.test(sourceId))return false;

    const cached=sourceIdentityCache.get(sourceId);
    if(cached){
      return applySourceIdentityToVideo(id,cached);
    }

    if(sourceIdentityPending.has(sourceId)){
      const identity=await sourceIdentityPending.get(sourceId);
      if(String(current?.id||"")!==id)return false;
      return applySourceIdentityToVideo(id,identity);
    }

    if(!window.YT1988_API?.channel||!window.MediaMeta?.source)return false;

    const task=(async()=>{
      try{
        const payload=await window.YT1988_API.channel(sourceId);
        const row=dataRow(payload);
        const source=window.MediaMeta.source(row);
        const identity={
          sourceName:String(source?.name||"").trim(),
          sourceAvatar:String(source?.avatar||"").trim()
        };
        if(identity.sourceAvatar||identity.sourceName){
          sourceIdentityCache.set(sourceId,identity);
        }
        return identity;
      }catch{
        return {};
      }finally{
        sourceIdentityPending.delete(sourceId);
      }
    })();

    sourceIdentityPending.set(sourceId,task);
    const identity=await task;
    if(String(current?.id||"")!==id)return false;
    return applySourceIdentityToVideo(id,identity);
  }

  function collectVideoRows(payload){
    const out=[];
    const seen=new Set();

    function visit(value,depth=0){
      if(!value || out.length>=24 || depth>6)return;

      if(Array.isArray(value)){
        for(const item of value){
          visit(item,depth+1);
          if(out.length>=24)break;
        }
        return;
      }

      if(typeof value!=="object")return;

      const id=window.MediaMeta?.videoId?.(value) || "";
      const hasVideoShape=
        !!value.videoId ||
        /(?:watch\?v=|youtu\.be\/|shorts\/|embed\/|live\/)/i.test(String(value.url||"")) ||
        (!!id && !!(value.title||value.name||value._displayTitle));

      if(hasVideoShape && id && !seen.has(id)){
        const meta=cardMetaFromRow(value);
        if(meta.id && meta.title){
          seen.add(meta.id);
          out.push(meta);
        }
      }

      for(const [key,child] of Object.entries(value)){
        if(["thumbnails","thumbnailDetails","content_image","author"].includes(key))continue;
        if(child && (Array.isArray(child)||typeof child==="object")){
          visit(child,depth+1);
          if(out.length>=24)break;
        }
      }
    }

    visit(payload?.data ?? payload);
    return out;
  }

  function packageMetas(items=[]){
    const out=[];
    const seen=new Set();
    for(const row of Array.isArray(items)?items:[]){
      const meta=cardMetaFromRow(row);
      if(!meta?.id||!meta?.title||seen.has(meta.id))continue;
      seen.add(meta.id);
      out.push(meta);
    }
    primeMediaAspects(out,18);
    return out;
  }

  async function loadPackageManifest(){
    try{
      const response=await fetch(PACKAGE_SYNC_URL,{cache:"no-store"});
      if(!response.ok)throw new Error("package_manifest_"+response.status);
      const payload=await response.json();
      packageManifest=
        payload?.manifest && typeof payload.manifest==="object"
          ? payload.manifest
          : {};
      return packageManifest;
    }catch(_){
      packageManifest={};
      return packageManifest;
    }
  }

  async function getPackage(scope,{force=false}={}){
    scope=String(scope||"").trim();
    if(!scope)return [];

    if(!force&&packageCache.has(scope))return packageCache.get(scope);
    if(packagePending.has(scope))return packagePending.get(scope);

    const task=(async()=>{
      try{
        const response=await fetch(
          PACKAGE_SYNC_URL+"?scope="+encodeURIComponent(scope),
          {cache:"no-store"}
        );
        if(!response.ok)throw new Error("package_"+scope+"_"+response.status);
        const payload=await response.json();
        const pkg=payload?.package;
        const items=payload?.ok&&payload?.exists&&Array.isArray(pkg?.items)
          ? pkg.items
          : [];
        const metas=packageMetas(items);
        packageCache.set(scope,metas);
        return metas;
      }catch(_){
        return packageCache.get(scope)||[];
      }finally{
        packagePending.delete(scope);
      }
    })();

    packagePending.set(scope,task);
    return task;
  }

  async function showPackageScope(scope,{force=false}={}){
    scope=String(scope||"").trim()||"live";
    activePackageScope=scope;
    feedMode="package";
    const request=++feedRequest;

    const cached=packageCache.get(scope);
    if(cached?.length){
      feedMetas=cached;
      renderSampleContent();
    }

    const metas=await getPackage(scope,{force});
    if(request!==feedRequest||activePackageScope!==scope||feedMode!=="package")return;
    feedMetas=metas;
    renderSampleContent();

    if(!String(current?.id||"")&&metas[0]?.id){
      if(navigateToVideo(metas[0].id,metas[0],{replace:true})){
        renderCurrentInfo();
        loadCurrentVideoMeta();
      }
    }
  }

  function prefetchPackages(scopes=[]){
    const unique=[...new Set((Array.isArray(scopes)?scopes:[]).map(String).filter(Boolean))];
    setTimeout(()=>{
      for(const scope of unique){
        if(scope===activePackageScope||packageCache.has(scope))continue;
        void getPackage(scope);
      }
    },0);
  }

  function parseSourceOrder(labels={}){
    try{
      const raw=labels?.__source_order;
      const parsed=Array.isArray(raw)?raw:JSON.parse(String(raw||"[]"));
      return Array.isArray(parsed)?parsed.map(String).filter(Boolean):[];
    }catch{
      return [];
    }
  }

  function existingSourceTabNames(remote={}){
    const labels=
      remote?.sourceLabels && typeof remote.sourceLabels==="object" && !Array.isArray(remote.sourceLabels)
        ? remote.sourceLabels
        : {};

    const system=[
      {key:"live",label:String(labels.live||"Live").trim()||"Live"},
      {key:"latest",label:String(labels.latest||"Ngày").trim()||"Ngày"},
      {key:"week",label:String(labels.week||"Tuần").trim()||"Tuần"}
    ];

    const custom=(Array.isArray(remote?.hashtags)?remote.hashtags:[])
      .filter(row=>row?.enabled!==false)
      .map((row,index)=>({
        key:String(row?.id||row?.hashtag_id||"").trim(),
        label:String(row?.label||"").replace(/\s+/g," ").trim(),
        position:Number(row?.position)||0,
        index
      }))
      .filter(row=>row.key&&row.label);

    const order=parseSourceOrder(labels);
    if(order.length){
      const rank=new Map(order.map((key,index)=>[key,index]));
      custom.sort((a,b)=>{
        const ar=rank.has(a.key)?rank.get(a.key):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.key)?rank.get(b.key):Number.MAX_SAFE_INTEGER;
        return ar-br||a.position-b.position||a.index-b.index;
      });
    }else{
      custom.sort((a,b)=>a.position-b.position||a.index-b.index);
    }

    const seen=new Set();
    return [...system,...custom]
      .map(row=>({key:row.key,label:row.label}))
      .filter(row=>{
        const key=row.label.toLocaleLowerCase("vi-VN");
        if(seen.has(key))return false;
        seen.add(key);
        return true;
      });
  }

        escapeHtml(row.label)+
