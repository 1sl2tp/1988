<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<title>1988 · Trình phát nổi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font:12px/1.4 Arial,sans-serif}
/* Match MAIN's Rail: black viewport clips YouTube's source frame top/bottom.
   The IFrame API replaces #player with ONE YouTube iframe (it is not a child).
   Landscape hides 65px each edge; portrait uses 59px as MAIN does. */
:root{--rail-black:65px}
#media-viewport{position:absolute;inset:0;overflow:hidden;background:#000}
#player{
  position:absolute!important;
  left:0!important;right:auto!important;
  top:calc(0px - var(--rail-black))!important;bottom:auto!important;
  width:100%!important;
  height:calc(100% + var(--rail-black) + var(--rail-black))!important;
  max-width:none!important;max-height:none!important;
  display:block;border:0!important;background:#000
}
/* Browser owns PiP resize; no transforms, zoom or cropping native video pixels.
   Only the YouTube source frame's own top/bottom chrome is outside viewport. */
#tap-play{position:absolute;z-index:5;inset:0;display:grid;place-items:center;width:100%;height:100%;border:0;background:rgba(0,0,0,.20);color:#fff;cursor:pointer;touch-action:manipulation}
#tap-play .play-disc{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(16,18,24,.88);border:1px solid rgba(255,255,255,.40);box-shadow:0 3px 14px rgba(0,0,0,.30)}
#tap-play svg{width:26px;height:26px;fill:currentColor;margin-left:4px}
#tap-play:focus-visible .play-disc{outline:2px solid #fff;outline-offset:3px}
#error{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;background:#111}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="media-viewport"><div id="player"></div></div>
<button id="tap-play" type="button" hidden aria-label="Phát video trong cửa sổ nổi" title="Phát video">
  <span class="play-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.7 20 12 7 20.3V3.7Z"></path></svg></span>
</button>
<div id="error" hidden>Không mở được video nổi. Hãy trở lại trang xem.</div>
<script>
(function(){
'use strict';
const qs=new URLSearchParams(location.search);
// Match the existing MAIN rail crop by the selected video's real orientation.
document.documentElement?.style?.setProperty(
  '--rail-black',qs.get('shape')==='portrait'?'59px':'65px'
);
const valid=/^[A-Za-z0-9_-]{11}$/;
const videoId=String(qs.get('v')||'').trim();
let start=Number(qs.get('t')||0);
start=Number.isFinite(start)?Math.max(0,Math.min(86400,Math.floor(start))):0;
function notify(state,code=''){
  try{
    parent.postMessage(
      {source:'yt1988-floating-youtube',videoId,state:String(state),code:String(code).slice(0,24)},
      location.origin
    );
  }catch{}
}
const playButton=document.getElementById('tap-play');
let youtubePlayer=null;
playButton.addEventListener('click',function(){
  // A real user activation in this HTTPS host is the safe autoplay fallback.
  // Never consume the user's click before the actual YouTube API is ready.
  if(!youtubePlayer||typeof youtubePlayer.playVideo!=='function')return;
  playButton.hidden=true;
  try{youtubePlayer.playVideo()}catch{playButton.hidden=false}
});
function fail(code){
  playButton.hidden=true;
  document.getElementById('error').hidden=false;
  notify('error',code);
}
if(!valid.test(videoId)){
  fail('invalid-video-id');
  return;
}
// This is a normal HTTPS page with an explicit referrer policy, unlike the
// about:blank Document-PiP owner. YouTube's request must see this HTTPS Referer.
window.onYouTubeIframeAPIReady=function(){
  try{
    new YT.Player('player',{
      host:'https://www.youtube-nocookie.com',
      width:'100%',
      height:'100%',
      videoId,
      playerVars:{
        autoplay:1,
        controls:1,
        playsinline:1,
        fs:1,
        rel:0,
        loop:0,
        enablejsapi:1,
        origin:location.origin,
        start,
        // One selected video only: no playlist and no automatic next video.
      },
      events:{
        onReady:function(event){
          try{
            const frame=event.target.getIframe();
            frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
            frame.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
            frame.setAttribute('allowfullscreen','');
          }catch{}
          youtubePlayer=event.target;
          notify('ready');
          // One best-effort attempt; Chrome may reject unmuted autoplay after
          // a newly-created iframe loads, even though PiP was user-triggered.
          try{youtubePlayer.playVideo()}catch{}
        },
        onStateChange:function(event){
          if(event.data===YT.PlayerState.PLAYING){
            const actual=String(event.target?.getVideoData?.()?.video_id||"");
            if(actual!==videoId){
              try{event.target.pauseVideo()}catch{}
              fail('video-id-mismatch');
              return;
            }
            playButton.hidden=true;
            notify('playing');
          }
        },
        onAutoplayBlocked:function(){
          playButton.hidden=false;
          notify('autoplay-blocked');
        },
        onError:function(event){fail(Number(event?.data)||'player-error')}
      }
    });
  }catch{fail('player-create')}
};
const script=document.createElement('script');
script.src='https://www.youtube.com/iframe_api';
script.async=true;
script.referrerPolicy='strict-origin-when-cross-origin';
script.onerror=function(){fail('api-load')};
document.head.appendChild(script);
})();
</script>
</body>
</html>
